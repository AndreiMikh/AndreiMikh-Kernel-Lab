name: 🧾 KConfig Generator AOSP
run-name: "🧾 ${{ inputs.AOSPSOURCE }} KConfig Generator"
on:
  workflow_dispatch:
    inputs:
      AOSPSOURCE:
        description: "ROM Source Branch"
        type: choice
        options:
          - Lineage
          - CrDroid
        default: Lineage
        required: true
      CONFIGFRAGMENTS:
        description: "Optional Comma-Separated Extra Config Fragment Paths Relative to Kernel Source"
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: sm8750-config-${{ github.ref }}-${{ inputs.AOSPSOURCE }}
  cancel-in-progress: true
jobs:
  generate:
    name: "Generate ${{ inputs.AOSPSOURCE }} Kernel Configuration"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AOSPSOURCE: ${{ inputs.AOSPSOURCE }}
      CONFIGFRAGMENTS: ${{ inputs.CONFIGFRAGMENTS }}
      KERNELBASE: ${{ vars.KERNELSOURCE || 'https://github.com' }}
      WORKDIR: ${{ github.workspace }}/kernel_workspace
      SOURCEDIR: ${{ github.workspace }}/kernel_workspace/src
      MODULES: ${{ github.workspace }}/kernel_workspace/sm8750-modules
      DEVICETREES: ${{ github.workspace }}/kernel_workspace/sm8750-devicetrees
      OUTDIR: ${{ github.workspace }}/kernel_workspace/out
    steps:
      - name: "🧹 Prepare Build Workspace"
        shell: bash
        run: |
          echo "└─ Installing Dependencies"
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip
          mkdir -p "$WORKDIR" "$OUTDIR"
          echo "└─ Workspace         : $WORKDIR"
          echo "└─ Output            : $OUTDIR"
          echo "└─ Available Storage"
          df -h "$GITHUB_WORKSPACE"

      - name: "📂 Download SM8750 Kernel Sources"
        shell: bash
        run: |
          cd "$WORKDIR" || {
            echo "└─ Cannot Access Workspace : $WORKDIR"
            exit 1
          }
          # Select Kernel Repository Organization and Branch
          if [[ "$AOSPSOURCE" == "Lineage" ]]; then
            KERNELORG="LineageOS"
            KERNELBRANCH="lineage-24.0"
          else
            KERNELORG="crdroidandroid"
            KERNELBRANCH="17.0"
          fi

          # Define Kernel, Modules, and Device-Tree Repositories
          KERNELREPO="android_kernel_oneplus_sm8750"
          MODULESREPO="android_kernel_oneplus_sm8750-modules"
          DTREPO="android_kernel_oneplus_sm8750-devicetrees"
          echo "└─ Preparing Kernel Sources"
          echo "└─ ROM Source        : $AOSPSOURCE"
          echo "└─ Organization      : $KERNELORG"
          echo "└─ Branch            : $KERNELBRANCH"
          # Resolve Kernel Repository Commit for Metadata
          FULLSRCCOMMIT="$(
            git ls-remote \
              "${KERNELBASE}/${KERNELORG}/${KERNELREPO}.git" \
              "refs/heads/${KERNELBRANCH}" |
              awk 'NR == 1 {print $1}'
          )"

          if [[ ! "$FULLSRCCOMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "└─ Unable to Resolve Kernel Source Branch"
            echo "└─ Repository      : ${KERNELBASE}/${KERNELORG}/${KERNELREPO}.git"
            echo "└─ Branch          : $KERNELBRANCH"
            exit 1
          fi

          SRCCOMMIT="${FULLSRCCOMMIT:0:8}"
          echo "└─ Kernel Commit     : $FULLSRCCOMMIT"
          echo "└─ Short Commit      : $SRCCOMMIT"
          # Remove Old Source Directories and Temporary Archives
          rm -rf "$SOURCEDIR" "$MODULES" "$DEVICETREES"
          rm -f "$WORKDIR/src.zip" "$WORKDIR/modules.zip" "$WORKDIR/dt.zip"
          # Download and Validate Source Repository Archive
          downloadarchive() {
            local repository="$1"
            local archive="$2"
            echo "└─ Downloading $repository"
            if ! curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 1800 \
              "${KERNELBASE}/${KERNELORG}/${repository}/archive/refs/heads/${KERNELBRANCH}.zip" \
              --output "$archive"; then
              echo "└─ Download Failed: $repository"
              return 1
            fi

            if [[ ! -s "$archive" ]] || ! unzip -tq "$archive" >/dev/null; then
              echo "└─ Invalid Archive: $repository"
              return 1
            fi

            ls -lh "$archive"
          }
          # Extract Each Archive Using its Actual Root Directory
          extractarchive() {
            local archive="$1"
            local destination="$2"
            local prefix
            prefix="$(unzip -Z1 "$archive" | sed -n '1s,/.*,,p')"
            if [[ -z "$prefix" ]]; then
              echo "└─ Unable to Identify Archive Root: $archive"
              return 1
            fi

            if ! unzip -q "$archive" -d "$WORKDIR"; then
              echo "└─ Extraction Failed: $archive"
              return 1
            fi

            if [[ ! -d "$WORKDIR/$prefix" ]]; then
              echo "└─ Extracted Directory Not Found: $prefix"
              return 1
            fi

            if ! mv "$WORKDIR/$prefix" "$destination"; then
              echo "└─ Failed to Move Extracted Source to: $destination"
              return 1
            fi

            rm -f "$archive"
          }

          # Download and Extract Main Kernel Source
          if downloadarchive "$KERNELREPO" "$WORKDIR/src.zip"; then
            extractarchive "$WORKDIR/src.zip" "$SOURCEDIR" || exit 1
          else
            exit 1
          fi

          # Download and Extract Kernel Modules Source
          if downloadarchive "$MODULESREPO" "$WORKDIR/modules.zip"; then
            extractarchive "$WORKDIR/modules.zip" "$MODULES" || exit 1
          else
            exit 1
          fi

          # Download and Extract Device-Tree Source
          if downloadarchive "$DTREPO" "$WORKDIR/dt.zip"; then
            extractarchive "$WORKDIR/dt.zip" "$DEVICETREES" || exit 1
          else
            exit 1
          fi

          # Export Source Paths and Commit Metadata for Later Steps
          {
            echo "KERNELORG=$KERNELORG"
            echo "KERNELBRANCH=$KERNELBRANCH"
            echo "KERNELREPO=$KERNELREPO"
            echo "MODULESREPO=$MODULESREPO"
            echo "DTREPO=$DTREPO"
            echo "FULLSRCCOMMIT=$FULLSRCCOMMIT"
            echo "SRCCOMMIT=$SRCCOMMIT"
          } >> "$GITHUB_ENV"
          echo "└─ 📂 Kernel Source  : $SOURCEDIR"
          echo "└─ 📂 Kernel Modules : $MODULES"
          echo "└─ 📂 Device Trees   : $DEVICETREES"
          echo "└─ ✔️ Source Downloads Complete"

      - name: 🔍 Validate Kernel Sources
        shell: bash
        run: |
          echo "└─ 🔍 Validating Source Directories"
          for path in \
            "$SOURCEDIR/Makefile" \
            "$SOURCEDIR/arch/arm64" \
            "$SOURCEDIR/arch/arm64/configs" \
            "$SOURCEDIR/scripts/kconfig" \
            "$MODULES" \
            "$DEVICETREES"; do
            if [[ ! -e "$path" ]]; then
              echo "└─ Required Source Path Not Found: $path"
              exit 1
            fi

            echo "└─ Found: $path"
          done

          # Report Whether Optional KernelFwUpdate KConfig Exists
          KERNELFWUPDATE="$SOURCEDIR/drivers/base/kernelFwUpdate/Kconfig"
          if [[ -e "$KERNELFWUPDATE" ]]; then
            echo "└─ KernelFwUpdate KConfig Found"
          else
            echo "└─ KernelFwUpdate KConfig Not Present"
          fi

          # List Available DefConfigs for Troubleshooting
          echo "└─ 📄 Available ARM64 DefConfigs"
          find "$SOURCEDIR/arch/arm64/configs" \
            -type f \
            -name '*defconfig' \
            -printf '%P\n' |
            sort |
            head -100

          # Check Three Required Configuration Files
          CONFIGS="$SOURCEDIR/arch/arm64/configs"
          BASECONFIG="$CONFIGS/gki_defconfig"
          PERFCONFIG="$CONFIGS/vendor/sun_perf.config"
          OPLUSCONFIG="$CONFIGS/vendor/oplus/sun_perf.config"
          for config in "$BASECONFIG" "$PERFCONFIG" "$OPLUSCONFIG"; do
            if [[ ! -f "$config" ]]; then
              echo "└─ Required Configuration File Not Found: $config"
              exit 1
            fi

            echo "└─ Configuration Found: ${config#"$CONFIGS/"}"
          done

      - name: 🧾 Generate Kernel Configuration
        shell: bash
        run: |
          # Define Base Configuration, Performance Fragments, and Output
          CONFIGS="$SOURCEDIR/arch/arm64/configs"
          BASECONFIG="$CONFIGS/gki_defconfig"
          PERFCONFIG="$CONFIGS/vendor/sun_perf.config"
          OPLUSCONFIG="$CONFIGS/vendor/oplus/sun_perf.config"
          CONFIGFILE="$OUTDIR/.config"
          MERGESCRIPT="$SOURCEDIR/scripts/kconfig/merge_config.sh"
          echo "└─ 🧾 Generating SM8750 Kernel Configuration"
          echo "└─ ROM Source  : $AOSPSOURCE"
          echo "└─ Branch      : $KERNELBRANCH"
          echo "└─ Commit      : $FULLSRCCOMMIT"
          echo "└─ Base        : ${BASECONFIG#"$CONFIGS/"}"
          echo "└─ Performance : ${PERFCONFIG#"$CONFIGS/"}"
          echo "└─ OnePlus     : ${OPLUSCONFIG#"$CONFIGS/"}"
          echo "└─ Output      : $CONFIGFILE"      
          # Ensure Required Files and Merge Script are Available
          for config in "$BASECONFIG" "$PERFCONFIG" "$OPLUSCONFIG"; do
            if [[ ! -f "$config" ]]; then
              echo "└─ Required Configuration File Not Found: $config"
              exit 1
            fi
          done

          if [[ ! -f "$MERGESCRIPT" ]]; then
            echo "└─ Merge Config Script Not Found: $MERGESCRIPT"
            exit 1
          fi

          mkdir -p "$OUTDIR"
          rm -f "$CONFIGFILE"
          # Start with GKI Base and Merge Performance Configurations
          CONFIGINPUTS=(
            "$BASECONFIG"
            "$PERFCONFIG"
            "$OPLUSCONFIG"
          )
          # Append Optional Comma-Separated Fragments From Kernel Source
          if [[ -n "${CONFIGFRAGMENTS//[[:space:]]/}" ]]; then
            IFS=',' read -r -a FRAGMENTS <<< "$CONFIGFRAGMENTS"
            for fragment in "${FRAGMENTS[@]}"; do
              fragment="$(echo "$fragment" | xargs)"
              [[ -n "$fragment" ]] || continue
              if [[ "$fragment" = /* || "$fragment" == *".."* ]]; then
                echo "└─ Invalid Fragment Path: $fragment"
                exit 1
              fi

              if [[ ! -f "$SOURCEDIR/$fragment" ]]; then
                echo "└─ Fragment Not Found: $SOURCEDIR/$fragment"
                exit 1
              fi

              CONFIGINPUTS+=("$SOURCEDIR/$fragment")
              echo "└─ Additional Fragment: $fragment"
            done
          fi

          # Merge in Order; Later Files Can Override Earlier Settings
          cd "$SOURCEDIR" || {
            echo "└─ Cannot Access Kernel Source"
            exit 1
          }

          if ! KCONFIG_CONFIG="$CONFIGFILE" \
            bash "$MERGESCRIPT" \
              -m \
              "$BASECONFIG" \
              "${CONFIGINPUTS[@]:1}"; then
            echo "└─ Configuration Merge Failed"
            exit 1
          fi

          # Ensure Merged Configuration Was Created
          if [[ ! -s "$CONFIGFILE" ]]; then
            echo "└─ Merged Configuration Was Not Generated"
            exit 1
          fi

          # Resolve KConfig Dependencies and Normalize Configuration
          echo "└─ Resolving KConfig Dependencies"
          if ! make -C "$SOURCEDIR" \
            O="$OUTDIR" \
            ARCH=arm64 \
            olddefconfig; then
            echo "└─ OldDefConfig Failed"
            exit 1
          fi

          # Disable KASAN Stack Instrumentation
          CONFIGTOOL="$SOURCEDIR/scripts/config"
          echo "└─ Disabling KASAN Stack Instrumentation"
          if [[ ! -x "$CONFIGTOOL" ]]; then
            echo "└─ KConfig Utility Not Found : $CONFIGTOOL"
            exit 1
          fi

          if ! "$CONFIGTOOL" \
            --file "$CONFIGFILE" \
            -d CONFIG_KASAN_STACK; then
            echo "└─ Failed to Disable Config KASAN Stack"
            exit 1
          fi

          # Verify KASAN Stack Instrumentation is Disabled
          if grep -q '^CONFIG_KASAN_STACK=y$' "$CONFIGFILE"; then
            echo "└─ Config KASAN Stack is Still Enabled"
            exit 1
          fi

          echo "└─ Config KASAN Stack Disabled"  
          # Set Final Compiler and LLVM Metadata
          echo "└─ 🔧 Setting AOSP Clang 21.0.0 Metadata"
          # Remove Existing Compiler and LLVM Metadata
          sed -i \
            -e '/^CONFIG_CC_VERSION_TEXT=/d' \
            -e '/^# CONFIG_CC_VERSION_TEXT is not set$/d' \
            -e '/^CONFIG_GCC_VERSION=/d' \
            -e '/^# CONFIG_GCC_VERSION is not set$/d' \
            -e '/^CONFIG_CC_IS_CLANG=/d' \
            -e '/^# CONFIG_CC_IS_CLANG is not set$/d' \
            -e '/^CONFIG_CLANG_VERSION=/d' \
            -e '/^# CONFIG_CLANG_VERSION is not set$/d' \
            -e '/^CONFIG_AS_IS_LLVM=/d' \
            -e '/^# CONFIG_AS_IS_LLVM is not set$/d' \
            -e '/^CONFIG_AS_VERSION=/d' \
            -e '/^# CONFIG_AS_VERSION is not set$/d' \
            -e '/^CONFIG_LD_VERSION=/d' \
            -e '/^# CONFIG_LD_VERSION is not set$/d' \
            -e '/^CONFIG_LD_IS_LLD=/d' \
            -e '/^# CONFIG_LD_IS_LLD is not set$/d' \
            -e '/^CONFIG_LLD_VERSION=/d' \
            -e '/^# CONFIG_LLD_VERSION is not set$/d' \
            -e '/^CONFIG_PAHOLE_VERSION=/d' \
            -e '/^# CONFIG_PAHOLE_VERSION is not set$/d' \
            "$CONFIGFILE"
          # Define Compiler and LLVM Metadata Entries
          METADATA="$(printf '%s\n' \
            'CONFIG_CC_VERSION_TEXT="Android (14054515, +pgo, +bolt, +lto, +mlgo, based on r563880c) clang version 21.0.0 (https://android.googlesource.com/toolchain/llvm-project 5e96669f06077099aa41290cdb4c5e6fa0f59349)"' \
            'CONFIG_GCC_VERSION=0' \
            'CONFIG_CC_IS_CLANG=y' \
            'CONFIG_CLANG_VERSION=210000' \
            'CONFIG_AS_IS_LLVM=y' \
            'CONFIG_AS_VERSION=210000' \
            'CONFIG_LD_VERSION=0' \
            'CONFIG_LD_IS_LLD=y' \
            'CONFIG_LLD_VERSION=210000' \
            'CONFIG_PAHOLE_VERSION=125')"
          # Insert Metadata After OPlus Kernel Configuration Entry
          if grep -q '^CONFIG_OPLUS_SYSTEM_KERNEL_QCOM=y$' "$CONFIGFILE"; then
            sed -i '/^CONFIG_OPLUS_SYSTEM_KERNEL_QCOM=y$/r /dev/stdin' "$CONFIGFILE" <<< "$METADATA"
          else
            # Fall Back to Inserting Metadata Near the Top of the Configuration
            sed -i '1r /dev/stdin' "$CONFIGFILE" <<< "$METADATA"
          fi
      
          # Verify Final Compiler and LLVM Metadata
          grep -E \
            '^(CONFIG_CC_VERSION_TEXT|CONFIG_GCC_VERSION|CONFIG_CC_IS_CLANG|CONFIG_CLANG_VERSION|CONFIG_AS_IS_LLVM|CONFIG_AS_VERSION|CONFIG_LD_VERSION|CONFIG_LD_IS_LLD|CONFIG_LLD_VERSION|CONFIG_PAHOLE_VERSION)=' \
            "$CONFIGFILE"
          # Validate Final Compiler and LLVM Metadata
          METADATAKEYS=(
            CONFIG_CC_VERSION_TEXT
            CONFIG_GCC_VERSION
            CONFIG_CC_IS_CLANG
            CONFIG_CLANG_VERSION
            CONFIG_AS_IS_LLVM
            CONFIG_AS_VERSION
            CONFIG_LD_VERSION
            CONFIG_LD_IS_LLD
            CONFIG_LLD_VERSION
            CONFIG_PAHOLE_VERSION
          )
          for key in "${METADATAKEYS[@]}"; do
            count="$(grep -c "^${key}=" "$CONFIGFILE" || true)"
            if [[ "$count" -ne 1 ]]; then
              echo "└─ Invalid Metadata Entry: $key (count: $count)"
              exit 1
            fi

          done

          echo "└─ ✔️ Compiler Metadata Validated"
          # Confirm Output Contains Recognizable Kernel Options
          if [[ ! -s "$CONFIGFILE" ]] ||
            ! grep -qE \
              '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
              "$CONFIGFILE"; then
            echo "└─ Generated Configuration Failed Validation"
            exit 1
          fi

          # Verify Final Configuration Targets ARM64
          if ! grep -q '^CONFIG_ARM64=y$' "$CONFIGFILE"; then
            echo "└─ Generated Configuration is Not ARM64"
            exit 1
          fi

          # Save Fully Fused Kernel Configuration
          cp "$CONFIGFILE" "$OUTDIR/${{ inputs.AOSPSOURCE }}-SM8750-KConfig.config"
          echo "└─ Fused Configuration: $OUTDIR/${{ inputs.AOSPSOURCE }}-SM8750-KConfig.config"
          # Record Source and Configuration-Generation Metadata
          {
            echo "ROMSOURCE=$AOSPSOURCE"
            echo "KERNELORGANIZATION=$KERNELORG"
            echo "KERNELBRANCH=$KERNELBRANCH"
            echo "KERNELREPOSITORY=${KERNELBASE}/${KERNELORG}/${KERNELREPO}.git"
            echo "KERNELCOMMIT=$FULLSRCCOMMIT"
            echo "BASECONFIG=${BASECONFIG#"$CONFIGS/"}"
            echo "PERFCONFIG=${PERFCONFIG#"$CONFIGS/"}"
            echo "OPLUSCONFIG=${OPLUSCONFIG#"$CONFIGS/"}"
            echo "CONFIGFRAGMENTS=$CONFIGFRAGMENTS"
            echo "DATEGENERATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "CONFIGOPTIONS=$(grep -cE '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)$' "$CONFIGFILE")"
          } > "$OUTDIR/Config-Metadata.txt"
          # Preserve Source Configuration Files Alongside Final Output
          cp "$BASECONFIG" "$OUTDIR/Base-DefConfig"
          cp "$PERFCONFIG" "$OUTDIR/Sun-Perf.config"
          cp "$OPLUSCONFIG" "$OUTDIR/OPlus-Sun-Perf.config"
          echo "└─ ✔️ Configuration Generated"
          echo "└─ 📄 File Size: $(stat -c%s "$CONFIGFILE") Bytes"
          echo "└─ ⚙️ Options: $(grep -cE '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)$' "$CONFIGFILE")"

      - name: 📤 Upload Generated Configuration
        uses: actions/upload-artifact@v7
        with:
          name: SM8750-${{ inputs.AOSPSOURCE }}-Kernel-Config
          path: |
            kernel_workspace/out/.config
            kernel_workspace/out/${{ inputs.AOSPSOURCE }}-SM8750-KConfig.config
            kernel_workspace/out/Base-DefConfig
            kernel_workspace/out/Sun-Perf.config
            kernel_workspace/out/OPlus-Sun-Perf.config
            kernel_workspace/out/Config-Metadata.txt
          if-no-files-found: error
          retention-days: 30
