name: 🗄️ CodeLinaro CLO LA Cache

on:
  workflow_dispatch:
    inputs:
      FILE:
        description: "Select Kernel Manifest"
        required: true
        type: choice
        options:
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_pad_lite_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_12_b
          - oneplus_12_custom
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_6.6.66_cn
          - oneplus_13_b
          - oneplus_13_custom
          - oneplus_13_wild
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_ace_6t_canary
          - oneplus_15r
          - oneplus_15r_canary
          - oneplus_15
          - oneplus_15_canary
          - oneplus_15_w
          - oneplus_15t
          - oneplus_15t_canary
          - oneplus_pad3_pro_canary
          - oneplus_pad_4
          - oneplus_pad_4_canary
          - oneplus_sm8750_lineage_aosp
          - oneplus_sm8750_crdroid_aosp

  schedule:
    - cron: "0 3 */3 * *"

concurrency:
  group: codelinaro-clo-cache-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.FILE || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  REPO_ROOT: "${{ github.workspace }}/clo-source"
  CACHE_ROOT: "${{ github.workspace }}/clo-cache"
  CLO_RELEASE_TAG: "codelinaro-clo-cache"

jobs:

  prepare:
    name: 🧩 Prepare Manifest Matrix
    runs-on: ubuntu-latest

    outputs:
      manifests: ${{ steps.matrix.outputs.manifests }}

    steps:
      - name: 🧩 Generate Manifest Matrix
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILE="${{ github.event.inputs.FILE }}"

            if [[ -z "$FILE" ]]; then
              echo "::error::No manifest was selected."
              exit 1
            fi

            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          file_name = os.environ["FILE"]

          print(
              "manifests=" +
              json.dumps([file_name], separators=(",", ":"))
          )
          PY

            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          manifests = [
              "oneplus_10_pro_b",
              "oneplus_10t_v",
              "oneplus_11r_b",
              "oneplus_ace2_b",
              "oneplus_11_b",
              "oneplus_12r_b",
              "oneplus_pad_lite_b",
              "oneplus_ace2_pro_b",
              "oneplus_ace3_b",
              "oneplus_open_b",
              "oneplus_nord_ce4_b",
              "oneplus_nord_ce4_lite_5g_b",
              "oneplus_nord_4_b",
              "oneplus_ace_3v_b",
              "oneplus_12_b",
              "oneplus_12_custom",
              "oneplus_13r_b",
              "oneplus_ace3_pro_b",
              "oneplus_ace5_b",
              "oneplus_pad_pro_b",
              "oneplus_pad2_b",
              "oneplus_nord_5_b",
              "oneplus_ace5_pro_b",
              "oneplus_13_6.6.66_cn",
              "oneplus_13_b",
              "oneplus_13_custom",
              "oneplus_13_wild",
              "oneplus_13t_b",
              "oneplus_13s_b",
              "oneplus_pad_2_pro_b",
              "oneplus_pad_3_b",
              "oneplus_ace_6",
              "oneplus_turbo_6",
              "oneplus_nord_6",
              "oneplus_ace_6t",
              "oneplus_ace_6t_canary",
              "oneplus_15r",
              "oneplus_15r_canary",
              "oneplus_15",
              "oneplus_15_canary",
              "oneplus_15_w",
              "oneplus_15t",
              "oneplus_15t_canary",
              "oneplus_pad3_pro_canary",
              "oneplus_pad_4",
              "oneplus_pad_4_canary",
              "oneplus_sm8750_lineage_aosp",
              "oneplus_sm8750_crdroid_aosp"
          ]

          print(
              "manifests=" +
              json.dumps(manifests, separators=(",", ":"))
          )
          PY
        env:
          FILE: ${{ github.event.inputs.FILE }}

  cache-clo:
    name: 🗄️ CLO LA Cache — ${{ matrix.file }}
    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: ${{ fromJson(needs.prepare.outputs.manifests) }}

    runs-on: ubuntu-latest

    env:
      FILE: ${{ matrix.file }}
      GITREPOSITORYINPUT: ""

    steps:

      - name: 📥 Checkout Workflow Repository
        uses: actions/checkout@v5

      - name: 🧰 Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            jq \
            rsync \
            zstd \
            unzip \
            zip \
            python3 \
            ca-certificates

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔎 Validate Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${FILE:-}" ]]; then
            echo "::error::Manifest FILE is empty."
            exit 1
          fi

          echo "Selected manifest: $FILE"

      - name: 🧹 Prepare Workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$REPO_ROOT" "$CACHE_ROOT"

          mkdir -p \
            "$REPO_ROOT" \
            "$CACHE_ROOT" \
            "$CACHE_ROOT/repo-cache"

      - name: 🔍 Discover Kernel Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT"

          echo "🔍 Searching for manifest: ${FILE}.xml"

          MANIFESTFILECONFIG="$FILE"

          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            MANIFESTFILECONFIG="${BASH_REMATCH[1]}"
          fi

          MANIFESTBASEFILE=$(echo "$MANIFESTFILECONFIG" | sed -E '
            s/_aosp/AOSP/g;
            s/_custom/CustomBuild/g;
            s/_([a-zA-Z0-9])/\U\1/g;
            s/^oneplus/1+/;
            s/^realme/RealMe/;
            s/^oppo/Oppo/
          ')

          echo "Manifest config: $MANIFESTFILECONFIG"
          echo "Manifest base name: $MANIFESTBASEFILE"

          REPOS=(
            "AndreiMikh|Kernel-Manifest"
            "AndreiMikh|AndreiMikh-Kernel-Lab"
          )

          if [[ -n "${GITREPOSITORYINPUT:-}" ]]; then
            if [[ "$GITREPOSITORYINPUT" == */* ]]; then
              EXTRA_OWNER="${GITREPOSITORYINPUT%%/*}"
              EXTRA_REPO="${GITREPOSITORYINPUT#*/}"

              REPOS+=("$EXTRA_OWNER|$EXTRA_REPO")
            fi
          fi

          MANIFESTREPO=""
          MANIFESTREPONAME=""
          MANIFESTBRANCH=""
          XMLPATH=""

          for ENTRY in "${REPOS[@]}"; do
            OWNER="${ENTRY%%|*}"
            REPO="${ENTRY#*|}"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking ${OWNER}/${REPO}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            BRANCHES=()

            API_URL="https://api.github.com/repos/${OWNER}/${REPO}/branches?per_page=100"

            mapfile -t API_BRANCHES < <(
              curl -fsSL \
                --retry 3 \
                --connect-timeout 10 \
                --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "$API_URL" |
              jq -r '.[].name' 2>/dev/null || true
            )

            BRANCHES+=("${API_BRANCHES[@]}")

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              mapfile -t PUBLIC_BRANCHES < <(
                curl -fsSL \
                  --retry 3 \
                  --connect-timeout 10 \
                  --max-time 30 \
                  -H "Accept: application/vnd.github+json" \
                  "$API_URL" |
                jq -r '.[].name' 2>/dev/null || true
              )

              BRANCHES+=("${PUBLIC_BRANCHES[@]}")
            fi

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              mapfile -t REMOTE_BRANCHES < <(
                git ls-remote --heads \
                  "https://github.com/${OWNER}/${REPO}.git" |
                awk '{sub("refs/heads/", "", $2); print $2}' || true
              )

              BRANCHES+=("${REMOTE_BRANCHES[@]}")
            fi

            mapfile -t UNIQUE_BRANCHES < <(
              printf '%s\n' "${BRANCHES[@]}" |
              sed '/^$/d' |
              sort -u
            )

            for BRANCH in "${UNIQUE_BRANCHES[@]}"; do
              RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE}.xml"

              echo "Checking branch: $BRANCH"

              if curl -fsSL \
                --retry 3 \
                --connect-timeout 10 \
                --max-time 30 \
                "$RAW_URL" \
                -o candidate.xml; then

                if [[ -s candidate.xml ]] &&
                   grep -q '<manifest' candidate.xml; then

                  MANIFESTREPO="${OWNER}/${REPO}"
                  MANIFESTREPONAME="$REPO"
                  MANIFESTBRANCH="$BRANCH"

                  XMLPATH="$REPO_ROOT/${FILE}.xml"

                  cp candidate.xml "$XMLPATH"

                  echo "✅ Manifest found"
                  echo "Repository: $MANIFESTREPO"
                  echo "Branch: $MANIFESTBRANCH"
                  echo "File: $FILE.xml"

                  break 2
                fi
              fi
            done

            rm -f candidate.xml
          done

          if [[ -z "$MANIFESTREPO" ||
                -z "$MANIFESTBRANCH" ||
                -z "$XMLPATH" ]]; then

            echo "::error::Unable to locate ${FILE}.xml"
            exit 1
          fi

          MANIFESTSHA256=$(sha256sum "$XMLPATH" | awk '{print $1}')

          {
            echo "MANIFESTREPO=$MANIFESTREPO"
            echo "MANIFESTREPONAME=$MANIFESTREPONAME"
            echo "MANIFESTBRANCH=$MANIFESTBRANCH"
            echo "MANIFESTFILE=$FILE.xml"
            echo "MANIFESTFILECONFIG=$MANIFESTFILECONFIG"
            echo "MANIFESTBASEFILE=$MANIFESTBASEFILE"
            echo "MANIFESTSHA256=$MANIFESTSHA256"
            echo "XMLPATH=$XMLPATH"
          } >> "$GITHUB_ENV"

      - name: 🧬 Parse Kernel Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          XMLPATH="$REPO_ROOT/${FILE}.xml"

          [[ -f "$XMLPATH" ]] || {
            echo "::error::Manifest not found: $XMLPATH"
            exit 1
          }

          CPU=""
          VANDROID=""
          ASHORTVERSION=""

          REVISION=$(grep -m1 '<project ' "$XMLPATH" |
            sed -nE 's/.*revision="([^"]+)".*/\1/p' || true)

          if [[ -n "$REVISION" ]]; then
            CPU=$(echo "$REVISION" |
              grep -oE 'sm[0-9]+' |
              head -n1 || true)
          fi

          if [[ -z "$CPU" ]]; then
            CPU=$(grep -oE 'sm[0-9]+' "$XMLPATH" |
              head -n1 || true)
          fi

          VANDROID=$(grep -oE 'android[0-9]+' "$XMLPATH" |
            head -n1 || true)

          ASHORTVERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$XMLPATH" |
            head -n1 || true)

          CPU="${CPU:-Unknown}"
          VANDROID="${VANDROID:-Unknown}"
          ASHORTVERSION="${ASHORTVERSION:-Unknown}"

          CPUD=""
          BUILDMETHOD=""

          README_URL="https://raw.githubusercontent.com/${MANIFESTREPO}/${MANIFESTBRANCH}/README.md"

          if curl -fsSL \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            "$README_URL" \
            -o "$CACHE_ROOT/README.md"; then

            CPUD=$(grep -m1 \
              -oE 'oplus_build_kernel\.sh[^[:space:]]*' \
              "$CACHE_ROOT/README.md" |
              sed 's/oplus_build_kernel\.sh//' |
              tr -d '`' || true)

            BUILDMETHOD=$(grep -m1 -iE \
              'build[[:space:]]*method|build_method' \
              "$CACHE_ROOT/README.md" |
              sed -E \
                's/.*[:=][[:space:]]*//; s/[`*]//g' |
              head -n1 || true)
          fi

          echo "CPU: $CPU"
          echo "Android: $VANDROID"
          echo "Kernel version: $ASHORTVERSION"
          echo "CPU detail: ${CPUD:-Unknown}"
          echo "Build method: ${BUILDMETHOD:-Unknown}"

          {
            echo "CPU=$CPU"
            echo "VANDROID=$VANDROID"
            echo "ASHORTVERSION=$ASHORTVERSION"
            echo "CPUD=$CPUD"
            echo "BUILDMETHOD=$BUILDMETHOD"
          } >> "$GITHUB_ENV"

      - name: 🔑 Generate Cache Identity
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFESTHASH="${MANIFESTSHA256:0:16}"

          SAFE_BRANCH=$(printf '%s' "$MANIFESTBRANCH" |
            sed 's#[^A-Za-z0-9._-]#-#g')

          CACHEKEY="CLO-LA-${{ runner.os }}-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          RELEASEASSETNAME="CLO-LA-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          echo "Cache key: $CACHEKEY"
          echo "Release asset: $RELEASEASSETNAME"

          {
            echo "CACHEKEY=$CACHEKEY"
            echo "RELEASEASSETNAME=$RELEASEASSETNAME"
          } >> "$GITHUB_ENV"

      - name: 📋 Prepare Manifest Information
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$CACHE_ROOT/manifest-info.txt" <<EOF
          CodeLinaro CLO LA Cache
          =======================

          Manifest
          --------
          File: $MANIFESTFILE
          Repository: $MANIFESTREPO
          Repository Name: $MANIFESTREPONAME
          Branch: $MANIFESTBRANCH
          SHA256: $MANIFESTSHA256
          Base Name: $MANIFESTBASEFILE

          Kernel
          ------
          CPU: $CPU
          CPU Detail: ${CPUD:-Unknown}
          Android: $VANDROID
          Kernel Version: $ASHORTVERSION
          Build Method: ${BUILDMETHOD:-Unknown}

          Cache
          -----
          Cache Key: $CACHEKEY
          Release Tag: $CLO_RELEASE_TAG
          Release Asset: $RELEASEASSETNAME

          Workflow
          --------
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run ID: $GITHUB_RUN_ID
          Run Number: $GITHUB_RUN_NUMBER
          SHA: $GITHUB_SHA
          Ref: $GITHUB_REF

          Generated
          ---------
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

      - name: 🚀 Initialize Repo
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT"

          rm -rf "$REPO_ROOT/kernel_workspace"

          mkdir -p "$REPO_ROOT/kernel_workspace"

          cd "$REPO_ROOT/kernel_workspace"

          echo "Initializing repository..."

          repo init \
            -u "https://github.com/${MANIFESTREPO}.git" \
            -b "$MANIFESTBRANCH" \
            -m "$MANIFESTFILE" \
            --depth=1 \
            --no-repo-verify

          if [[ ! -f ".repo/manifests/${MANIFESTFILE}" ]]; then
            mkdir -p ".repo/manifests"

            cp "$REPO_ROOT/${MANIFESTFILE}" \
              ".repo/manifests/${MANIFESTFILE}"
          fi

      - name: 🧹 Clean Obsolete Manifest Entries
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"

          MANIFEST_PATH=".repo/manifests/${MANIFESTFILE}"

          [[ -f "$MANIFEST_PATH" ]] || {
            echo "::error::Manifest unavailable: $MANIFEST_PATH"
            exit 1
          }

          sed -i '/ks-kernel\.lnx\.5\.0\.r3-rel/d' "$MANIFEST_PATH"

      - name: 🔄 Sync Kernel Repository
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"

          SYNCFLAGS=(
            -c
            --force-sync
            --no-clone-bundle
            --no-tags
            --optimized-fetch
            --prune
            --retry-fetches=5
            --verbose
            "-j$(nproc)"
          )

          SYNC_LOG="$CACHE_ROOT/repo-sync.log"

          echo "Starting repo sync..."

          (
            repo sync "${SYNCFLAGS[@]}"
          ) > "$SYNC_LOG" 2>&1 &

          SYNC_PID=$!

          START_TIME=$(date +%s)
          LAST_REPORT=$START_TIME

          while kill -0 "$SYNC_PID" 2>/dev/null; do
            sleep 60

            NOW=$(date +%s)

            if (( NOW - LAST_REPORT >= 60 )); then
              ELAPSED=$((NOW - START_TIME))
              echo "⏱️ Repo Sync Running: ${ELAPSED}s"
              tail -n 20 "$SYNC_LOG" || true
              LAST_REPORT=$NOW
            fi

            if (( NOW - START_TIME >= 1500 )); then
              echo "::error::Repo sync exceeded 25 minutes."
              kill "$SYNC_PID" 2>/dev/null || true
              wait "$SYNC_PID" 2>/dev/null || true
              exit 1
            fi
          done

          if ! wait "$SYNC_PID"; then
            echo "::error::repo sync failed."
            tail -n 100 "$SYNC_LOG" || true
            exit 1
          fi

          echo "🎉 Repository Sync Completed"

      - name: 🔍 Detect CodeLinaro CLO LA Projects
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"

          RESOLVED_MANIFEST="$CACHE_ROOT/resolved-manifest.xml"
          CLO_MATCHES="$CACHE_ROOT/clo-projects.txt"
          repo manifest -r > "$RESOLVED_MANIFEST"
          grep -ni \
            "git.codelinaro.org/clo/la" \
            "$RESOLVED_MANIFEST" \
            > "$CLO_MATCHES" || true
          CLO_COUNT=$(wc -l < "$CLO_MATCHES" |
            tr -d ' ')
          echo "Detected CLO LA projects: $CLO_COUNT"
          if [[ "$CLO_COUNT" -gt 0 ]]; then
            cat "$CLO_MATCHES"
          else
            echo "No CodeLinaro CLO LA projects detected."
          fi

          echo "CLO_COUNT=$CLO_COUNT" >> "$GITHUB_ENV"

      - name: 📦 Create Repository Cache Archive
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"
          OUTPUT_DIR="$CACHE_ROOT/repo-cache"
          TEMP_ARCHIVE="$OUTPUT_DIR/repository-cache.tar.zst.tmp"
          FINAL_ARCHIVE="$OUTPUT_DIR/repository-cache.tar.zst"
          rm -f "$TEMP_ARCHIVE" "$FINAL_ARCHIVE"
          echo "📦 Creating Repository Metadata Cache..."
          tar \
            --use-compress-program="zstd -T0 -19" \
            -cf "$TEMP_ARCHIVE" \
            .repo/project-objects \
            .repo/manifests.git \
            .repo/manifests \
            .repo/repo \
            .repo/repo-versions
          mv "$TEMP_ARCHIVE" "$FINAL_ARCHIVE"
          [[ -s "$FINAL_ARCHIVE" ]] || {
            echo "::error::Cache archive was not created."
            exit 1
          }

          ls -lh "$FINAL_ARCHIVE"

      - name: 🧾 Generate Cache Metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="$CACHE_ROOT/repo-cache/repository-cache.tar.zst"
          METADATA="$CACHE_ROOT/repo-cache/metadata.txt"

          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" |
            awk '{print $1}')

          ARCHIVE_SIZE=$(stat -c '%s' "$ARCHIVE")

          cat > "$METADATA" <<EOF
          CodeLinaro CLO LA Repository Cache
          ==================================

          Manifest
          --------
          File: $MANIFESTFILE
          Repository: $MANIFESTREPO
          Repository Name: $MANIFESTREPONAME
          Branch: $MANIFESTBRANCH
          SHA256: $MANIFESTSHA256
          Base Name: $MANIFESTBASEFILE

          Kernel
          ------
          CPU: $CPU
          CPU Detail: ${CPUD:-Unknown}
          Android: $VANDROID
          Kernel Version: $ASHORTVERSION
          Build Method: ${BUILDMETHOD:-Unknown}

          CLO
          ---
          CLO LA Projects: $CLO_COUNT

          Cache
          -----
          Cache Key: $CACHEKEY
          Archive: repository-cache.tar.zst
          Archive Size: $ARCHIVE_SIZE bytes
          Archive SHA256: $ARCHIVE_SHA256

          Release
          -------
          Tag: $CLO_RELEASE_TAG
          Asset: $RELEASEASSETNAME.tar.zst

          Generated
          ---------
          Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run ID: $GITHUB_RUN_ID
          SHA: $GITHUB_SHA
          Ref: $GITHUB_REF
          EOF

      - name: 🔐 Generate SHA256 Checksums
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$CACHE_ROOT/repo-cache"

          sha256sum \
            repository-cache.tar.zst \
            metadata.txt \
            > SHA256SUMS

          cat SHA256SUMS

      - name: 💾 Save Repository Cache
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CACHE_ROOT }}/repo-cache
          key: ${{ env.CACHEKEY }}

      - name: 🚀 Upload CLO LA Cache to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_TAG="$CLO_RELEASE_TAG"

          ARCHIVE="$CACHE_ROOT/repo-cache/repository-cache.tar.zst"
          METADATA="$CACHE_ROOT/repo-cache/metadata.txt"
          CHECKSUMS="$CACHE_ROOT/repo-cache/SHA256SUMS"

          RELEASE_DIR="$CACHE_ROOT/release"

          mkdir -p "$RELEASE_DIR"

          RELEASE_ARCHIVE="$RELEASE_DIR/${RELEASEASSETNAME}.tar.zst"
          RELEASE_METADATA="$RELEASE_DIR/${RELEASEASSETNAME}-metadata.txt"
          RELEASE_CHECKSUMS="$RELEASE_DIR/${RELEASEASSETNAME}-SHA256SUMS"

          cp "$ARCHIVE" "$RELEASE_ARCHIVE"
          cp "$METADATA" "$RELEASE_METADATA"
          cp "$CHECKSUMS" "$RELEASE_CHECKSUMS"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "✅ Release already exists: $RELEASE_TAG"
          else
            echo "🚀 Creating release: $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              --title "🗄️ CodeLinaro CLO LA Cache" \
              --notes "Persistent CodeLinaro CLO LA repository cache.

          This release is maintained automatically by the CodeLinaro CLO LA Cache workflow.

          Cache identity:
          - Kernel manifest
          - CPU
          - Manifest branch
          - Manifest SHA256 fingerprint

          The manifest SHA256 prevents modified manifests from incorrectly reusing older cache data.

          Cache producer:
          CodeLinaro CLO LA Cache Workflow

          Cache consumer:
          Main.yml" \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_METADATA" \
            "$RELEASE_CHECKSUMS" \
            --clobber

          echo "✅ Release cache uploaded successfully."

      - name: 📤 Upload Cache Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLO-LA-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-${{ env.MANIFESTSHA256 }}
          path: |
            ${{ env.CACHE_ROOT }}/repo-cache/repository-cache.tar.zst
            ${{ env.CACHE_ROOT }}/repo-cache/metadata.txt
            ${{ env.CACHE_ROOT }}/repo-cache/SHA256SUMS
            ${{ env.CACHE_ROOT }}/resolved-manifest.xml
            ${{ env.CACHE_ROOT }}/clo-projects.txt
            ${{ env.CACHE_ROOT }}/manifest-info.txt
            ${{ env.CACHE_ROOT }}/repo-sync.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: 📊 Cache Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🗄️ CodeLinaro CLO LA Cache"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Manifest | \`${FILE}.xml\` |"
            echo "| Repository | \`${MANIFESTREPO:-Unknown}\` |"
            echo "| Branch | \`${MANIFESTBRANCH:-Unknown}\` |"
            echo "| Manifest SHA256 | \`${MANIFESTSHA256:-Unknown}\` |"
            echo "| Manifest Base | \`${MANIFESTBASEFILE:-Unknown}\` |"
            echo "| CPU | \`${CPU:-Unknown}\` |"
            echo "| Android | \`${VANDROID:-Unknown}\` |"
            echo "| Kernel | \`${ASHORTVERSION:-Unknown}\` |"
            echo "| CLO LA Projects | \`${CLO_COUNT:-Unknown}\` |"
            echo "| Cache Key | \`${CACHEKEY:-Unknown}\` |"
            echo "| Release | \`${CLO_RELEASE_TAG}\` |"
            echo "| Release Asset | \`${RELEASEASSETNAME:-Unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
