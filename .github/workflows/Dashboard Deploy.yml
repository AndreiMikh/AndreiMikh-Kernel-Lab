name: Kernel Dashboard Deploy

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 📥 Checkout Repository
      # ==============================
      - name: 📥 Checkout
        uses: actions/checkout@v5

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          REPO="${{ github.repository }}"

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>🔥 Kernel Dashboard</title>
            <style>
              body {
                background: #0d1117;
                color: #c9d1d9;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 30px;
              }
          
              h1 {
                text-align: center;
              }
          
              .card {
                background: #161b22;
                padding: 20px;
                border-radius: 12px;
                margin: 15px auto;
                max-width: 900px;
              }
          
              .release {
                border-bottom: 1px solid #30363d;
                padding: 15px 0;
              }
          
              a {
                color: #58a6ff;
                text-decoration: none;
              }
          
              .btn {
                display: inline-block;
                padding: 8px 12px;
                background: #238636;
                color: white;
                border-radius: 6px;
                margin-top: 8px;
              }
          
              pre {
                white-space: pre-wrap;
                background: #0d1117;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #30363d;
              }
            </style>
          </head>
          
          <body>
          
          <h1>🔥 Kernel Dashboard</h1>
          
          <div class="card" id="latest">
            <h2>⚡ Loading latest release...</h2>
          </div>
          
          <div class="card">
            <h2>📦 All Releases</h2>
            <div id="releases">Loading...</div>
          </div>
          
          <script>
          const repo = "${REPO}";
          
          async function loadReleases() {
            const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
            const data = await res.json();
          
            if (!Array.isArray(data) || !data.length) return;
          
            const latest = data[0];
          
            document.getElementById("latest").innerHTML = `
              <h2>⚡ Latest Release</h2>
              <h3>${latest.name || "Unnamed Release"}</h3>
              <a class="btn" href="${latest.assets?.[0]?.browser_download_url || '#'}">
                ⬇️ Download
              </a>
              <pre>${latest.body || "No changelog available"}</pre>
            `;
          
            let html = "";
          
            data.forEach(r => {
              const url = r.assets?.[0]?.browser_download_url || "#";
          
              html += `
                <div class="release">
                  <h3>${r.name || "Release"}</h3>
                  <a class="btn" href="${url}">Download</a>
                  <pre>${r.body || ""}</pre>
                </div>
              `;
            });
          
            document.getElementById("releases").innerHTML = html;
          }
          
          loadReleases();
          </script>
          
          </body>
          </html>
          EOF

      # ==============================
      # 📦 Upload Pages Artifact
      # ==============================
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
