name: SM-8750 Bot

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Select Workflow to Trigger"
        required: true
        default: Main.yml
        options:
          - Main V2.yml
          - Main
          - Test
      KPM:
        type: choice
        description: "Kernel Patch Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
      SUSFS_META:
        type: string
        description: "Rollback SUSFS (Hash, Number, or -1 to turn off)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
      BUILD_TIME:
        type: string
        description: "Custom Build Time ('F' for current UTC)"
        required: false
        default: "Sat Feb 14 07:17:27 UTC 2026"
      KSU_META:
        type: choice
        description: "KSU Meta"
        required: true
        default: "ReSukiSU"
        options:
          - ReSukiSU
          - SukiSU-Ultra
          - KernelSU-Next
          - WildKSU
          - KernelSU
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
          - ReSukiSU-Main
          - ReSukiSU-Main-Spoofed
      SUSFS_VERSION:
        type: choice
        description: "SUSFS Version"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      ZRAM:
        type: choice
        description: "ZRAM (0 off, 1 on) / algorithm / size"
        required: true
        default: "0"
        options:
          - 0
          - 1/lz4kd/8589934592
          - 1/lz4kd/12884901888
          - 1/lz4kd/17179869184
          - 1/lz4kd/25769803776
      ZRAM-LZ4:
        type: boolean
        description: "Enable LZ4/ZSTD if ZRAM LZ4KD is off"
        required: false
        default: false
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix"
        required: false
        default: "8-andreimikhail-4k"
      SUBLEVEL:
        type: string
        description: "Custom Kernel Level Spoofing"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build"
        required: true
        default: true
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions"
        required: true
        default: true
      BBR_ECN:
        type: boolean
        description: "Enable BBR+ECN Network Optimization"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "Apply HMBIRD Scheduler"
        required: true
        default: true
      ADIOS:
        type: boolean
        description: "Apply ADIOS I/O Scheduler"
        required: true
        default: false
      XUS_FIX:
        type: boolean
        description: "Prevent XUS Error Files"
        required: true
        default: true
      SUSFS_DEV:
        type: boolean
        description: "Apply SUSFS-Dev Branch"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update"
        required: true
        default: false

permissions:
  actions: write
  contents: read

jobs:

  # -------------------------
  # Generate Device Matrix
  # -------------------------
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate device list
        id: set-matrix
        run: |
          DEVICES="oneplus_13_b oneplus_13s_b oneplus_13t_b oneplus_ace5_pro_b oneplus_ace_6 oneplus_pad_2_pro_b oneplus_pad_3_b oneplus_13_custom"
          MATRIX_JSON=$(printf '%s\n' $DEVICES | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              file_short: (sub("_[a-z]$"; "")),
              enable_sched: true
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # -------------------------
  # Trigger Workflow per Device
  # -------------------------
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Trigger workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: refs/heads/LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.file }}",
              "KPM": "${{ github.event.inputs.KPM }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_META": "${{ github.event.inputs.SUSFS_META }}",
              "DYNAMIC_REPO": "${{ github.event.inputs.DYNAMIC_REPO }}",
              "KSU_META": "${{ github.event.inputs.KSU_META }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM-LZ4": "${{ github.event.inputs.ZRAM-LZ4 }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR_ECN": "${{ github.event.inputs.BBR_ECN }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "SCHED": "${{ github.event.inputs.SCHED }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS_FIX": "${{ github.event.inputs.XUS_FIX }}"
            }

  # -------------------------
  # Fetch & Upload Artifacts with Wait + Retry
  # -------------------------
  fetch-and-upload:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [oneplus_13, oneplus_13s, oneplus_13t, oneplus_ace5_pro, oneplus_ace_6, oneplus_pad_2_pro, oneplus_pad_3, oneplus_13_custom]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tools
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
      - name: Create device folder
        run: mkdir -p "artifacts/${{ matrix.device }}"
      - name: Wait & Fetch artifacts per device
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEVICE="${{ matrix.device }}"
          DEVICE_FOLDER="artifacts/$DEVICE"
          MAX_WAIT=$((60*60))   # 60 min max wait
          SECONDS=0
          INTERVAL=60
          echo "Waiting for artifacts for $DEVICE..."
          while (( SECONDS < MAX_WAIT )); do
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/runs \
              --jq ".workflow_runs
                    | map(select(.name==\"${{ github.event.inputs.TARGET_WORKFLOW }}\")) 
                    | .[0].id")
            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              sleep $INTERVAL
              ((SECONDS+=INTERVAL))
              continue
            fi
            ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[].name')
            if echo "$ARTIFACTS" | grep -q "$DEVICE"; then
              echo "Artifacts found for $DEVICE, starting download..."
              jq -c '.artifacts[]' <<< $(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts) | while read ART; do
                NAME=$(echo "$ART" | jq -r '.name')
                ID=$(echo "$ART" | jq -r '.id')
                if [[ "$NAME" =~ AnyKernel3|ZRAM ]]; then
                  SAFE_NAME=$(echo "$NAME" | tr ' ' '_' | tr -cd '[:alnum:]_-')
                  for i in 1 2 3; do
                    echo "Downloading $NAME attempt $i..."
                    curl -L -H "Authorization: token $GH_TOKEN" \
                      -o "$DEVICE_FOLDER/${SAFE_NAME}.zip" \
                      "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ID}/zip" && break
                    echo "Retry $i failed, waiting 15s..."
                    sleep 15
                  done
                fi
              done
              break
            fi
            echo "Artifacts not ready yet for $DEVICE, waiting..."
            sleep $INTERVAL
            ((SECONDS+=INTERVAL))
          done
          if (( SECONDS >= MAX_WAIT )); then
            echo "Timeout waiting for artifacts for $DEVICE"
            exit 1
          fi
      - name: Upload artifacts per device
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.device }}-artifacts"
          path: "artifacts/${{ matrix.device }}/*"
