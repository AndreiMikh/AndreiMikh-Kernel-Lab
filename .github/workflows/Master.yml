      - name: 🔧 Re-Kernel
        if: ${{ github.event.inputs.REKERNEL == 'true' }}
        run: |
          set -Eeuo pipefail

          # Paths
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          RKREPODIR="${WS}/Re-Kernel"
          KDIR="${WS}/kernel_platform/common"
          KCDDIR="${KDIR}/drivers"
          RKTARGETDIR="${KCDDIR}/rekernel"
          KCONFIGFILE="${KCDDIR}/Kconfig"
          MAKEFILE="${KCDDIR}/Makefile"
          BUILDBAZEL="${KDIR}/BUILD.bazel"

