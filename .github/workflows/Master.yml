      - name: 🔐 Linux Security Module Baseband Guard
        if: ${{ inputs.LSMBBG }}
        shell: bash
        run: |
          set -euo pipefail
      
          # Navigate to Kernel Common Directory
          KCDIR="kernel_workspace/kernel_platform/common"
          MAXRETRIES=3
  
          # Move Into Kernel Source Directory 
          cd "$KCDIR"
          
          echo "➡️  Working Directory: $(pwd)"
          echo "🔧 Enabling Kernel-Level Baseband Guard Support..."
      
          # Download and Execute Setup Script
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          echo "🌐 Fetching Baseband Guard Setup Script..."
          for i in $(seq 1 $MAXRETRIES); do
            curl -fsSL "$URLBBG" | bash -s -- main && break
            echo "⚠️ Download / Setup Failed, Retry $i/$MAXRETRIES..."
            sleep 2
          done
          echo "✔️ Baseband Guard Patch Script Applied"
      
          # Ensure Baseband Guard is Added to Linux Security Defaults
          BBGCONFIGFILE="./security/Kconfig"
          if [[ ! -f "$BBGCONFIGFILE" ]]; then
            echo "⚠️ ERROR: Kernel Configuration File Not Found -> $BBGCONFIGFILE"
            exit 1
          fi
      
          echo "⚙️ Updating Linux Security Configuration (Ensuring Baseband Guard is Included)..."
          awk '
            BEGIN { in_block=0 }
            /^config LSM$/ { in_block=1 }
            in_block && /^[[:space:]]*default/ {
              if ($0 !~ /baseband_guard/) {
                sub(/selinux/, "selinux,baseband_guard")
              }
            }
            /^help$/ { in_block=0 }
            { print }
          ' "$BBGCONFIGFILE" > "${BBGCONFIGFILE}.tmp"
          mv "${BBGCONFIGFILE}.tmp" "$BBGCONFIGFILE"
          echo "⚙️ Linux Security Configuration Updated Successfully"
      
          # Dynamically Detect Baseband Guard Directory (Clone or SymLink)
          BBGPATHDIR="$(find . -maxdepth 2 -type d -name "Baseband-guard" | head -n1 || true)"
          if [[ -L "./Baseband-guard" ]]; then
            BBGPATHDIR="$(readlink -f ./Baseband-guard)"
          fi

          echo "🔎 Checking Baseband Guard Source..."

          # Ensure the Baseband Guard Directory Exists
          if [[ -d "$BBGPATHDIR" ]]; then
            echo "🔎 Baseband Guard Directory Found: $BBGPATHDIR"          
            if [[ -f "$BBGPATHDIR/baseband_guard.c" ]]; then
              echo "🧾 Source File Detected"
            else
              echo "⚠️ Baseband Guard Sources Not Found Inside Baseband Guard"
              ls -la "$BBGPATHDIR" || true
            fi          
          else
            echo "⚠️ Baseband Guard Directory Not Found — Setup may have Failed"
            exit 1
          fi

          echo ""
          echo "🎉 Baseband Guard Fully Applied and Configured"

      - name: ⚙️ ADIOS I/O Scheduler
        if: ${{ inputs.SCHEDULERS == 'ADIOS' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Attempting to Auto-Detect the Kernel Directory..."

          # Define Possible Kernel Directory Paths
          possiblekerneldirectories=(
            "${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
            "${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform"
            "${GITHUB_WORKSPACE}/kernel_workspace"
          )

          KCDIR=""

          # Check Each Directory to Find the Correct One
          for directory in "${possiblekerneldirectories[@]}"; do
            echo "🔎 Checking Directory: $directory"
            if [ -d "$directory" ] && { [ -f "$directory/Makefile" ] || [ -d "$directory/arch/arm64/configs" ]; }; then
              KCDIR="$directory"
              echo "📌 Kernel Directory Detected: $KCDIR"
              break
            fi
          done

          # Environment Variables
          GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"
          
          echo "------------------------------"
          echo "🧾 Kernel Base  : $GKIVERSION"
          echo "------------------------------"
          echo ""

          # Check if Kernel Version is Set, and Provide a Fallback if Not
          if [ -z "${GKIVERSION:-}" ]; then
            echo "⚠️ Kernel Version Variable is Not Set, Exiting..."
            exit 1
          fi

          # Select Patch URL Based on the Kernel Version
          if [[ "$GKIVERSION" == "android15-6.6" ]]; then
            ADIOSPATCHURL="https://raw.githubusercontent.com/AndreiMikh/Build_Oneplus_Realme_Action/main/patch/adios_ioscheduler_6.6.patch"
          elif [[ "$GKIVERSION" == "android14-6.1" ]]; then
            ADIOSPATCHURL="https://raw.githubusercontent.com/AndreiMikh/Build_Oneplus_Realme_Action/main/patch/adios_ioscheduler_6.1.patch"
          else
            echo "⚠️ Unsupported Kernel Version: $GKIVERSION, Exiting..."
            exit 1
          fi

          ADIOSPATCHFILE="$GITHUB_WORKSPACE/adios.patch"
          DEFCONFIG="$KCDIR/arch/arm64/configs/gki_defconfig"
          echo "📩 Downloading Patch from: $ADIOSPATCHURL"
          curl -fsSL "$ADIOSPATCHURL" -o "$ADIOSPATCHFILE" || {
            echo "⚠️ Failed to Download Patch, Skipping..."
            exit 1
          }

          echo "🔧 Applying ADIOS Scheduler Patch..."
          if [ ! -f "$ADIOSPATCHFILE" ]; then
            echo "⚠️ Patch File Missing, Skipping Patch Application..."
          else
            # Check if the Patch has Already been Applied
            if grep -q "CONFIG_MQ_IOSCHED_ADIOS=y" "$DEFCONFIG"; then
              echo "✔️ Patch Already Applied, Skipping..."
            else
              echo "⚙️ Applying Patch..."
              cd "$KCDIR"
              patch -p1 -F3 --forward < "$ADIOSPATCHFILE" || true
            fi

            # Clean Reject Files
            echo "🧹 Removing Reject Files..."
            find "$KCDIR" -type f -name "*.rej" -delete
            

            # Cleanup Downloaded Patch Files
            echo "🧹 Cleaning Up the Downloaded Patch..."
            rm -f "$ADIOSPATCHFILE"
          fi

          echo ""
          echo "🎉 ADIOS I/O Scheduler Patch Process Complete"

      - name: 🧩 DroidSpacesLXC Injection + Wild NT Synchonization (Primitives) Patches
        if: ${{ inputs.LXCDOCKERSUPPORT == 'DroidSpacesLXC-Inject' }}
        shell: bash
        env:
          KERNELMODULE: ${{ env.KERNELMODULE }}
        run: |
          set -euo pipefail

          # Paths
          NTSYNC="${{ inputs.NTSYNC }}"
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
          TARGETPATH="kernel_workspace/kernel_platform/common"

          # Move Into Kernel Source Directory
          cd "$TARGETPATH"

          # Function: Patch Apply
          apply() {
            local patchfile="$1"
            if patch -R -p1 --dry-run < "$patchfile" >/dev/null 2>&1; then
              echo "🎉 Already Applied: $(basename "$patchfile")"
              return
            fi

            if patch -p1 --dry-run < "$patchfile" >/dev/null 2>&1; then
              patch -p1 --forward < "$patchfile"
              echo "✔️ Applied: $(basename "$patchfile")"
            else
              echo "⚠️ Failed Applying: $(basename "$patchfile")"
              exit 1
            fi
          }

          SCHEDFILE="include/linux/sched.h"
          USERFILE="include/linux/sched/user.h"

          if [[ ! -f "$SCHEDFILE" ]]; then
            echo "⚠️ Missing Scheduler Header File: $SCHEDFILE"
            exit 1
          fi
       
          echo "⚙️ Disabling Original System V IPC Struct Fields..."
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' "$SCHEDFILE"
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' "$SCHEDFILE"

          # Android 12.5.10 Special Handling
          if [ "${KERNELMODULE:-}" = "android12-5.10" ]; then
            echo "🔧 Fixing System V IPC Kernel ABI + POSIX MQUEUE ABI Padding for Android12-5.10..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' "$SCHEDFILE"
            sed -i 's/^\tunsigned long mq_bytes;/\/\/unsigned long mq_bytes;/' "$USERFILE"
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' "$USERFILE"

          # ABI Layout Detection (Shared Logic)
          elif grep -q "sched_dl_entity.*\*dl_server" "$SCHEDFILE"; then
            echo "♻️ Detected DL Server Pointer — ☘️ Using Packed Union Strategy"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_USE(1," "$SCHEDFILE"; then
            echo "♻️ Detected Kernel ABI USE(1) — ☘️ Using Slots 6, 7 and 8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_RESERVE(1);" "$SCHEDFILE"; then
            echo "♻️ Detected Legacy Kernel ABI — ☘️ Using Slots 1, 2 and 3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_RESERVE(3);" "$SCHEDFILE"; then
            echo "♻️ Fallback Kernel ABI Detected — ☘️ Using Slots 3, 4 and 5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' "$SCHEDFILE"
          else
            echo "⚠️ Unable to Determine Compatible Kernel ABI Layout — Aborting..."
            exit 9
          fi

          # Verification
          echo "🔎 Verifying Injection..."
          grep -q "struct sysv_sem" "$SCHEDFILE" || {
            echo "⚠️ Missing SYS V SEM Injection"
            exit 1
          }

          grep -q "struct sysv_shm" "$SCHEDFILE" || {
            echo "⚠️ Missing SYS V SHM Injection"
            exit 1
          }

          grep -q "CONFIG_SYSVIPC" "$SCHEDFILE" || {
            echo "⚠️ Missing Configuration SYS V IPC Guard"
            exit 1
          }

          echo "✔️ Injection Verification Passed"

          # Restore MIDAS Fix
          echo "🔧 Applying Ghost Task Fix Patch for OPlus BSP Midas..."
          apply "${PDIR}/001-Ghost-Task-Midas.patch"

          # Disable Rollback Protection Before Exit
          RESTORE=0        
          echo ""
          echo "🎉 DroidSpaces System V IPC Injection Completed Successfully"

          # NT Synchronization (NTSync) Primitives
          if [[ "${NTSYNC:-}" == "true" ]]; then
            echo "🧠 NTSync Enabled"

            # Validate Required Variables Early
            if [[ -z "${KERNELMODULE:-}" ]]; then
              echo "⚠️ Kernel Module Version is Not Set, Aborting..."
              exit 1
            fi

            echo "🔄 Target Kernel Module Version: $KERNELMODULE"

            if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
              echo "🔧 Applying Compatibility Fixes..."           
              # Remove Conflicting NT Synchronization Sources
              [[ -f include/uapi/linux/ntsync.h ]] && rm -f include/uapi/linux/ntsync.h
              [[ -f drivers/misc/ntsync.c ]] && rm -f drivers/misc/ntsync.c           
              
              # Export IPC Namespace Symbols for Rust Binder Module
              if ! grep -qE '^[[:space:]]*EXPORT_SYMBOL_GPL\(put_ipc_ns\);' ipc/namespace.c; then
                echo "EXPORT_SYMBOL_GPL(put_ipc_ns);" >> ipc/namespace.c
              fi
            
              if ! grep -qE '^[[:space:]]*EXPORT_SYMBOL_GPL\(init_ipc_ns\);' ipc/msgutil.c; then
                echo "EXPORT_SYMBOL_GPL(init_ipc_ns);" >> ipc/msgutil.c
              fi
            
              # Verify IPC Namespace Symbol Exports
              echo "🔎 Verifying IPC Namespace Symbol Exports..."            
              grep -qE '^[[:space:]]*EXPORT_SYMBOL_GPL\(put_ipc_ns\);' ipc/namespace.c || {
                echo "⚠️ IPC Namespace Symbol Export Missing"
                exit 1
              }            
              grep -qE '^[[:space:]]*EXPORT_SYMBOL_GPL\(init_ipc_ns\);' ipc/msgutil.c || {
                echo "⚠️ Init IPC Namespace Symbol Export Missing"
                exit 1
              }
            
              echo "✔️ IPC Namespace Symbol Exports Verified"
            fi

            echo "🛠️ Applying NT Synchronization Patches..."
            # Define NT Synchronization Paths
            NTSYNCDIR="$GITHUB_WORKSPACE/kernel_workspace/WildKernels/common/ntsync"
            NTSYNCCOMPATPATCH="ntsync_compat_${KERNELMODULE}.patch"
            NTSYNCBASEPATCH="ntsync_base.patch"

            echo "📂 Patch Directory: $NTSYNCDIR"
            # Ensure Patch Repository Exists
            if [[ ! -d "$NTSYNCDIR" ]]; then
              echo "📥 NT Synchronization Patch Directory Missing, Cloning Repository..."
              rm -rf "$GITHUB_WORKSPACE/kernel_workspace/WildKernels"
              git clone --depth=1 \
                https://github.com/WildKernels/kernel_patches.git \
                "$GITHUB_WORKSPACE/kernel_workspace/WildKernels"
            fi

            if [[ ! -d "$NTSYNCDIR" ]]; then
              echo "⚠️ Failed to Locate NT Synchronization Patch Directory After Clone..."
              exit 1
            fi

            echo "📄 Available Patches:"
            ls -la "$NTSYNCDIR"
            
            # Function Patch Helper: Apply Patch
            applyntsyncpatch() {
              local ntsyncpatchfile="$1"

              if [[ ! -f "$NTSYNCDIR/$ntsyncpatchfile" ]]; then
                echo "⚠️ Missing Patch: $ntsyncpatchfile"
                return 0
              fi

              cp "$NTSYNCDIR/$ntsyncpatchfile" ./
              echo "➡️ Applying $ntsyncpatchfile"
              patchstatus=0
              patch -p1 < "$ntsyncpatchfile" || patchstatus=$?
              rm -f "$ntsyncpatchfile"
              echo "🧹 Cleaned: $ntsyncpatchfile"
              
              if [[ "$patchstatus" -ne 0 ]]; then
                echo "⚠️ Patch Failed: $ntsyncpatchfile"
                return "$patchstatus"
              fi
            }

            # Apply Patches
            applyntsyncpatch "$NTSYNCCOMPATPATCH"
            applyntsyncpatch "$NTSYNCBASEPATCH"
            echo "☘️ NT Synchronization Patch Process Completed Successfully"

          fi

          # Load Reject Checker and Run Rejection Check
          source "$REJECTCHECKER"
          checkrejects .

          echo ""
          echo "🎉 NT Synchronization (Primitives) Done!"

      - name: 🧩 NoMount Built-in Integration
        if: ${{ inputs.NOMOUNT != 'None' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Define Paths
          NOMOUNTBRANCH="${{ inputs.NOMOUNT }}"
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          KDIR="${WS}/kernel_platform/common"
          NOMOUNTSOURCE="${WS}/nomount-source"
          NOMOUNTBIN="${WS}/nomount-bin"

          # Move Into Kernel Source Directory
          cd "$KDIR"

          echo "------------------------------"
          echo "NoMount Built-in Integration"
          echo "------------------------------"
          echo "📂 Kernel Source : $KDIR"
          echo "📦 NoMount Branch: $NOMOUNTBRANCH"
          echo ""

          # Resolve Selected NoMount Branch
          case "$NOMOUNTBRANCH" in
            Master)
              NOMOUNTGITBRANCH="master"
              ;;
            Dev)
              NOMOUNTGITBRANCH="dev"
              ;;
            *)
              echo "⛔ Invalid NoMount Branch: $NOMOUNTBRANCH"
              echo "⚠️ Supported Branches: Master, Dev"
              exit 1
              ;;
          esac

          echo "📌 Selected Branch : $NOMOUNTBRANCH"
          echo "📌 Git Branch      : $NOMOUNTGITBRANCH"
          echo ""

          # Verify Selected Remote Branch
          echo "🔎 Verifying NoMount Remote Branch..."

          REMOTECOMMIT="$(
            git ls-remote \
              "https://github.com/maxsteeel/nomount.git" \
              "refs/heads/${NOMOUNTGITBRANCH}" |
            awk '{print $1}'
          )"

          [[ -n "$REMOTECOMMIT" ]] || {
            echo "⛔ NoMount Remote Branch Not Found"
            echo "   refs/heads/${NOMOUNTGITBRANCH}"
            exit 1
          }

          echo "📌 Remote Commit : $REMOTECOMMIT"
          echo ""

          # Clone Selected NoMount Branch
          echo "📥 Cloning NoMount Source..."

          rm -rf "$NOMOUNTSOURCE"

          git clone \
            --depth=1 \
            --branch "$NOMOUNTGITBRANCH" \
            --single-branch \
            https://github.com/maxsteeel/nomount.git \
            "$NOMOUNTSOURCE"

          # Detect Actual Checked-Out Branch
          ACTUALBRANCH="$(
            git -C "$NOMOUNTSOURCE" branch --show-current
          )"

          # Detect Actual Checked-Out Commit
          ACTUALCOMMIT="$(
            git -C "$NOMOUNTSOURCE" rev-parse HEAD
          )"

          echo "📂 NoMount Source   : $NOMOUNTSOURCE"
          echo "📌 Requested Branch : $NOMOUNTGITBRANCH"
          echo "📌 Checked-Out      : $ACTUALBRANCH"
          echo "📌 NoMount Commit   : $ACTUALCOMMIT"
          echo ""

          # Verify Actual Branch
          [[ "$ACTUALBRANCH" == "$NOMOUNTGITBRANCH" ]] || {
            echo "⛔ NoMount Branch Verification Failed"
            echo "   Expected : $NOMOUNTGITBRANCH"
            echo "   Actual   : $ACTUALBRANCH"
            exit 1
          }

          # Verify Actual Commit
          [[ "$ACTUALCOMMIT" == "$REMOTECOMMIT" ]] || {
            echo "⛔ NoMount Commit Verification Failed"
            echo "   Expected : $REMOTECOMMIT"
            echo "   Actual   : $ACTUALCOMMIT"
            exit 1
          }

          echo "✔️ NoMount Branch Verified"
          echo "✔️ NoMount Commit Verified"
          echo ""

          # Verify NoMount Repository Layout
          [[ -f "$NOMOUNTSOURCE/kernel/setup.sh" ]] || {
            echo "⚠️ NoMount Setup Script Missing"
            exit 1
          }

          [[ -f "$NOMOUNTSOURCE/userspace/src/nm.c" ]] || {
            echo "⚠️ NoMount Userspace Source Missing"
            echo "   $NOMOUNTSOURCE/userspace/src/nm.c"
            exit 1
          }

          [[ -d "$NOMOUNTSOURCE/module" ]] || {
            echo "⚠️ NoMount Module Directory Missing"
            exit 1
          }

          echo "🚀 NoMount Repository Verified"
          echo ""

          # Run Official NoMount Setup
          echo "🚀 Running Official NoMount Setup..."

          if [[ "$NOMOUNTBRANCH" == "Master" ]]; then
            echo "📦 NoMount Branch: Master"
            bash "$NOMOUNTSOURCE/kernel/setup.sh"
          else
            echo "🧪 NoMount Branch: Dev"
            bash "$NOMOUNTSOURCE/kernel/setup.sh" dev
          fi

          echo ""

          # Verify NoMount Symlink
          echo "🔎 Verifying NoMount Kernel Integration..."

          [[ -L "$KDIR/fs/nomount" ]] || {
            echo "⚠️ NoMount Symlink Missing"
            exit 1
          }

          NOMOUNTKDIR="$(readlink -f "$KDIR/fs/nomount")"

          echo "📂 NoMount Kernel : $NOMOUNTKDIR"

          # Verify NoMount Kernel Source
          [[ -f "$KDIR/fs/nomount/Kconfig" ]] || {
            echo "⚠️ NoMount Kernel Config Missing"
            exit 1
          }

          [[ -f "$KDIR/fs/nomount/Makefile" ]] || {
            echo "⚠️ NoMount Makefile Missing"
            exit 1
          }

          [[ -f "$KDIR/fs/nomount/nomount.c" ]] || {
            echo "⚠️ NoMount Source Missing"
            exit 1
          }

          # Verify Kernel Config Registration
          grep -qF 'source "fs/nomount/Kconfig"' \
            "$KDIR/fs/Kconfig" || {
            echo "⚠️ NoMount Kernel Config Registration Missing"
            exit 1
          }

          # Verify Makefile Registration
          grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' \
            "$KDIR/fs/Makefile" || {
            echo "⚠️ NoMount Makefile Registration Missing"
            exit 1
          }

          echo "🚀 NoMount Symlink Verified"
          echo "🚀 NoMount Source Files Verified"
          echo "🚀 NoMount Kernel Integration Verified"
          echo ""

          # Define NoMount Userspace Source
          NOMOUNTUSERDIR="${NOMOUNTSOURCE}/userspace"
          NOMOUNTUSERSRC="${NOMOUNTUSERDIR}/src/nm.c"

          echo "------------------------------"
          echo "NoMount Userspace Compilation"
          echo "------------------------------"
          echo "📂 Source : $NOMOUNTUSERSRC"
          echo ""

          [[ -f "$NOMOUNTUSERSRC" ]] || {
            echo "⚠️ NoMount Userspace Source Missing"
            echo "   $NOMOUNTUSERSRC"
            exit 1
          }

          # Prepare Userspace Binary Output Directory
          rm -rf "$NOMOUNTBIN"
          mkdir -p "$NOMOUNTBIN"

          cd "${NOMOUNTUSERDIR}/src"

          # Compile ARM64 Userspace Binary
          echo "🔨 Building NoMount-ARM64..."

          zig cc \
            -target aarch64-linux \
            -Oz \
            -mcmodel=tiny \
            -static \
            -nostdlib \
            -ffreestanding \
            -fno-unwind-tables \
            -fno-ident \
            -Wno-invalid-noreturn \
            -Wl,--entry=_start \
            nm.c \
            -o "${NOMOUNTBIN}/nm-arm64"

          # Compile ARM32 Userspace Binary
          echo "🔨 Building NoMount-ARM..."

          zig cc \
            -target arm-linux \
            -Oz \
            -static \
            -nostdlib \
            -ffreestanding \
            -fno-unwind-tables \
            -fno-ident \
            -Wno-invalid-noreturn \
            -ffunction-sections \
            -fdata-sections \
            -Wl,--gc-sections \
            -Wl,--entry=_start \
            nm.c \
            -o "${NOMOUNTBIN}/nm-arm"

          # Verify Compiled Binaries
          [[ -x "${NOMOUNTBIN}/nm-arm64" ]] || {
            echo "⚠️ NoMount-ARM64 Compilation Failed"
            exit 1
          }

          [[ -x "${NOMOUNTBIN}/nm-arm" ]] || {
            echo "⚠️ NoMount-ARM Compilation Failed"
            exit 1
          }

          echo ""
          echo "🎉 NoMount-ARM64 Compiled Successfully"
          echo "🎉 NoMount-ARM Compiled Successfully"
          echo ""

          # Display Binary Information
          echo "📦 NoMount Binaries:"
          ls -lh \
            "${NOMOUNTBIN}/nm-arm64" \
            "${NOMOUNTBIN}/nm-arm"

          echo ""
          echo "------------------------------"
          echo "NoMount Build Summary"
          echo "------------------------------"
          echo "📦 Selected Branch : $NOMOUNTBRANCH"
          echo "🌿 Git Branch      : $ACTUALBRANCH"
          echo "📌 Commit          : $ACTUALCOMMIT"
          echo "📦 ARM64 Binary    : ${NOMOUNTBIN}/nm-arm64"
          echo "📦 ARM32 Binary    : ${NOMOUNTBIN}/nm-arm"
          echo ""
          echo "🎉 NoMount Built-in Integration Completed Successfully"

      - name: 🛠️ Re-Kernel
        if: ${{ inputs.REKERNEL }}
        run: |
          set -Eeuo pipefail

          # Paths
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          RKREPODIR="${WS}/Re-Kernel"
          KDIR="${WS}/kernel_platform/common"
          KCDDIR="${KDIR}/drivers"
          RKTARGETDIR="${KCDDIR}/rekernel"
          KCONFIGFILE="${KCDDIR}/Kconfig"
          MAKEFILE="${KCDDIR}/Makefile"
          BUILDBAZEL="${KDIR}/BUILD.bazel"

          # Clone Re-Kernel if Needed
          if [[ ! -d "$RKREPODIR/.git" ]]; then
            echo "📩 Cloning Re-Kernel..."
            git clone --depth=1 \
              https://github.com/Sakion-Team/Re-Kernel.git \
              "$RKREPODIR"
            echo "✔️ Re-Kernel Cloned"
          else
            echo "⚠️ Re-Kernel Repository Already Exists"
          fi

          # Resolve Source Directory
          if [[ -d "$RKREPODIR/LKM-Source" ]]; then
            RKSRCDIR="$RKREPODIR/LKM-Source"
          else
            RKSRCDIR="$RKREPODIR"
          fi

          echo "📂 Re-Kernel Source: $RKSRCDIR"

          [[ -d "$RKSRCDIR" ]] || {
            echo "⚠️ Re-Kernel Source Directory Not Found"
            exit 1
          }

          # Add Kernel Configuration Entry Only if Missing
          if grep -qF 'source "drivers/rekernel/Kconfig"' "$KCONFIGFILE"; then
            echo "⚠️ Re-Kernel Kernel Configuration Entry Already Exists"
          else
            sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' "$KCONFIGFILE"
            echo "⚙️ Re-Kernel Kconfig Entry Added"
          fi

          # Add Makefile Entry Only if Missing
          if grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$MAKEFILE"; then
            echo "⚠️ Re-Kernel Makefile Entry Already Exists"
          else
            printf '\n# Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/\n' >> "$MAKEFILE"
            echo "⚙️ Re-Kernel Makefile Entry Added"
          fi

          # Replace Existing Re-Kernel Source
          echo "♻️ Syncing Re-Kernel Source..."
          rm -rf "$RKTARGETDIR"
          mkdir -p "$RKTARGETDIR"
          cp -af "$RKSRCDIR"/. "$RKTARGETDIR"/
          echo "✔️ Re-Kernel Source Synced"

          # Patch BUILD Bazel if Present
          if [[ -f "$BUILDBAZEL" ]]; then
            echo "⚙️ Patching BUILD Bazel..."
            sed -i \
              '0,/name = "kernel_aarch64",/{/module_implicit_outs/s|,$| + ["drivers/rekernel/rekernel.ko"],|}' \
              "$BUILDBAZEL"
            echo "🚀 BUILD Bazel Patch Applied"
          else
            echo "ℹ️ BUILD Bazel Not Found, Skipping"
          fi

          echo ""
          echo "🎉 Re-Kernel Files and Directories Successfully Synced and Patched"

      - name: 🌐 Congestion Control BBR Version 3
        if: ${{ (inputs.TCPALGORITHM == 'BBRV1+BBRV3+ECN' || inputs.TCPALGORITHM == 'BBRV1+BBRV3+ECN+Brutal') && steps.kernel-version-setup.outputs.androidversion != 'android16' && steps.kernel-version-setup.outputs.kernelversion != '6.12' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # GKI Version Identifier
          GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"

          # Define Directories and Patch Files
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches/BBRV3"
          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          PFILE="${PDIR}/0001-net-tcp-backport-BBRv3-to-${GKIVERSION}.patch"

          # Move Into Kernel Source Directory
          cd "${KDIR}"

          # Apply Main BBRV3 Backport Patch for Selected GKI Version
          echo "Applying BBRV3 Patch for ${GKIVERSION}..."
          patchstatus=0
          patch -p1 < "${PFILE}" || patchstatus=$?

          # Android 12 (5.10) Kernels do Not Include PROC-DOU8VEC-MINMAX
          # Apply Required Compatibility Patches Only if Function Not Already Present in Source
          if [[ "${GKIVERSION}" == "android12-5.10" ]]; then
            if ! grep -qF 'int proc_dou8vec_minmax(' include/linux/sysctl.h; then
              echo "⚙️ Applying PROC-DOU8VEC-MINMAX Compatibility Patches..."
              compatstatus=0
              patch -p1 < "${PDIR}/sysctl_add_proc_dou8vec_minmax.patch" || compatstatus=$?
              
              if [[ "$compatstatus" -eq 0 ]]; then
                patch -p1 < "${PDIR}/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch" || compatstatus=$?
              fi

              if [[ "$compatstatus" -ne 0 ]]; then
                patchstatus="$compatstatus"
              fi
            else
              echo "🚀 PROC-DOU8VEC-MINMAX Already Exists, Skipping Compatibility Patches..."
            fi
          else
            echo "☘️ Compatibility Patches are Not Required for ${GKIVERSION}"
          fi

          # Load Reject Checker and Run Rejection Check
          source "$REJECTCHECKER"
          checkrejects .

          # Fail if Any Patch Application Failed
          if [[ "$patchstatus" -ne 0 ]]; then
            echo "⚠️ BBRV3 Patch Application Failed"
            exit "$patchstatus"
          fi

          echo ""
          echo "🎉 BBRV3 Patches Applied Successfully"

      - name: ⚙️ Kernel Configuration
        run: |
          set -Eeuo pipefail
          
          # Navigate to the Correct Directory
          cd kernel_workspace/kernel_platform/common

          # Set the Path to the Configuration File
          DEFCONFIG=./arch/arm64/configs/gki_defconfig

          # Get Github Environment Variables and GitHub Actions Inputs        
          KERNEL="${KERNELVERSION}"
          ROOT="${{ inputs.ROOTENGINE }}"
          SUSFS="${{ inputs.SUSFSREPOSITORY }}"
          SCHEDULERS="${{ inputs.SCHEDULERS }}" 
          FILE="${{ inputs.FILE }}" 
          REKERNEL="${{ inputs.REKERNEL }}" 
          GKI="${ANDROIDVERSION}-${KERNELVERSION}"
          KERNELPATCH="${{ inputs.KERNELPATCH }}"
          TCP="${{ inputs.TCPALGORITHM }}"
          LSM="${{ inputs.LSMBBG }}"
          NET="${{ inputs.NETFILTER }}"
          LXC="${{ inputs.LXCDOCKERSUPPORT }}"
          NTSYNC="${{ inputs.NTSYNC }}"
          NOMOUNT="${{ inputs.NOMOUNT }}"

          MAKEFILE="$PWD/Makefile"
          declare -a HIDECONFIGS=()
          
          SETCONFIG() {
            local value="$1"
            local key="${value%%=*}"
          
            if grep -qF "${key}=" "$DEFCONFIG" ||
               grep -qF "# ${key} is not set" "$DEFCONFIG"; then         
              VALUE="$value" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 {
                  print ENVIRON["VALUE"]
                  next
                }
                { print }
              ' "$DEFCONFIG" > "${DEFCONFIG}.tmp" &&
                mv "${DEFCONFIG}.tmp" "$DEFCONFIG" ||
                rm -f "${DEFCONFIG}.tmp"
            else
              printf '%s\n' "$value" >> "$DEFCONFIG"
            fi
          }
          
          HIDECONFIG() {
            local value="$1"
            local key="${value%%=*}"         
            SETCONFIG "$value"
            HIDECONFIGS+=("$key")
          }
          
          FAKECONFIG() {
            [[ ${#HIDECONFIGS[@]} -eq 0 ]] && return 0          
            local marker="# --- Fake Config Injector ---"          
            if ! grep -qF "$marker" "$MAKEFILE"; then
              {
                printf '\n%s\n' "$marker"
                printf 'ifneq ($(strip $(DISABLEFAKECONFIG)),)\n'
                printf '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE\n'
                printf '\t$(Q)sed $(foreach opt,$(DISABLEFAKECONFIG),-e '"'"'s|^$(opt)=.*|# $(opt) is not set|'"'"') $(KCONFIG_CONFIG) > $@\n'
                printf 'endif\n'
              } >> "$MAKEFILE"
            fi
          
            DISABLEFAKECONFIG="${HIDECONFIGS[*]}"
            export DISABLEFAKECONFIG          
            echo "DISABLEFAKECONFIG=$DISABLEFAKECONFIG" >> "$GITHUB_ENV"
          }
          
          trap 'FAKECONFIG' EXIT

          # Normalize Input: Uppercase and Remove Spaces
          SCHEDULERS="${SCHEDULERS// /}"
          IFS=',' read -ra SCHEDARRAY <<< "$(echo "$SCHEDULERS" | tr '[:lower:]' '[:upper:]')"
          
          # Apply Each Scheduler Individually
          for SCHED in "${SCHEDARRAY[@]}"; do
            case "$SCHED" in
              ADIOS)
                if [[ "$KERNEL" == "6.6" ]]; then
                  SETCONFIG "CONFIG_MQ_IOSCHED_ADIOS=y"
                  SETCONFIG "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y"
                  echo "🎉 ADIOS I/O Scheduler Enabled"
                else
                  echo "🚩 ADIOS Requires Kernel 6.6"
                fi
                ;;
              NONE|"")
                echo "☘️ No Scheduler Modifications Applied"
                ;;
              *)
                echo "⚠️ Unknown Scheduler: $SCHED"
                exit 1
                ;;
            esac
          done

          # Re-Kernel Configuration
          echo "🚀 Enabling Re-Kernel Support (for Use with Freezer, NoActive and Etc to Improve Background App Freezing)..."
          # Use Underscore for Variable Name
          REKERNEL="${REKERNEL:-false}"  # Default to False if Not Set
          if [[ "$REKERNEL" == "true" ]]; then
            echo "🎉 Enabling Re-Kernel Support..."
            SETCONFIG "CONFIG_REKERNEL=y"
            SETCONFIG "CONFIG_REKERNEL_NETWORK=y"
            echo "🎉 ReKernel Enabled"
          else
            echo "☘️ ReKernel Disabled"
          fi

          # Check if KSU Root Engine is ReSukiSU
          if [[ "$ROOT" == "ReSukiSU" ]]; then
            # Enable Multi-Manager Support if the Condition is True
            SETCONFIG "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"
            SETCONFIG "CONFIG_KSU_TOOLKIT_SUPPORT=y"
            echo "🎉 Multi-Manager Support Enabled for $ROOT"
          else
            echo "☘️ Multi-Manager Support Not Enabled, as KSU Root Engine is Not ReSukiSU"
          fi

          # SukiSU-Ultra KernelPatch-Module Configuration
          # Check if SukiSU-Ultra KernelPatch-Module Input is SukiSU-Ultra KernelPatch-Module (KPM), Enable SukiSU-Ultra KernelPatch-Module
          if [[ "$KERNELPATCH" == "KPM" && "$ROOT" == "SukiSU-Ultra" ]]; then
            SETCONFIG "CONFIG_KPM=y"
            echo "🎉 SukiSU-Ultra KernelPatch-Module Enabled (Supported KSU Root Engine: ReSukiSU and SukiSU-Ultra)"
          fi

          # Check if SukiSU-Ultra KernelPatch Input is KernelPatch-Next (KPN) or None,
          # Disable KernelPatch-Module
          if [[ ( "$ROOT" == "SukiSU-Ultra" || "$ROOT" == "ReSukiSU" ) && \
                ( "$KERNELPATCH" == "KPN" || "$KERNELPATCH" == "None" ) ]]; then
            SETCONFIG "CONFIG_KPM=n"
            echo "☘️ SukiSU-Ultra KernelPatch-Module Disabled (KernelPatch-Next or None Selected)"
          fi

          # Apply SUSFS Core Configuration
          if [[ "$SUSFS" != "-1" && ! ("$FILE" =~ aosp$|AOSP$) ]]; then                      
            # Base SUSFS Core Configuration Settings (Common)
            SETCONFIG "CONFIG_KSU=y"
            SETCONFIG "CONFIG_KSU_SUSFS=y"
            SETCONFIG "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SUS_PATH=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            SETCONFIG "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            SETCONFIG "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            SETCONFIG "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            SETCONFIG "CONFIG_KSU_SUSFS_SUS_MAP=y"            
            echo "🎉 SUSFS Core Configuration Applied"       
          else
            # Block SUSFS for oneplus_sm8750_lineage_aosp or Disabled SUSFS
            if [[ ! "$FILE" =~ aosp$|AOSP$ ]]; then
              SETCONFIG "CONFIG_KSU_SUSFS=n"
              echo "☘️ SUSFS Core Configuration Settings Disabled"
            else
              echo "🧩 SUSFS Core Configuration Skipped for $FILE"
            fi
          fi
          
          # TMPFS Configuration (Mountify)
          echo "🚀 Applying TMPFS Configuration..."
          SETCONFIG "CONFIG_TMPFS_XATTR=y"
          SETCONFIG "CONFIG_TMPFS_POSIX_ACL=y"
          echo "🎉 TMPFS Configuration Applied"

          # DroidspacesLXC Support Kernel Configuration
          if [[ "$LXC" == "DroidSpacesLXC-Inject" ]]; then
            echo "🚀 Applying DroidspacesLXC Support Kernel Configurations..."
            SETCONFIG "CONFIG_NTSYNC=y"
            SETCONFIG "CONFIG_SYSVIPC=y"
            SETCONFIG "CONFIG_DEVTMPFS=y"
            SETCONFIG "CONFIG_PID_NS=y"
            SETCONFIG "CONFIG_IPC_NS=y"
            SETCONFIG "CONFIG_USER_NS=y"
            SETCONFIG "CONFIG_NAMESPACES=y"
            SETCONFIG "CONFIG_POSIX_MQUEUE=y"
            SETCONFIG "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            SETCONFIG "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            SETCONFIG "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "🎉 DroidspacesLXC Support Core Configuration Applied"       
          else
            echo "☘️ DroidspacesLXC Support Disabled — Skipping Configuration..."
          fi

          # NoMount Built-in Configuration
          if [[ "$NOMOUNT" != "None" ]]; then
            echo "🚀 Enabling NoMount Built-in Support..."
            SETCONFIG "CONFIG_NOMOUNT=y"
            echo "🎉 NoMount Built-in Support Enabled"
          else
            echo "☘️ NoMount Disabled, Skipping..."
            SETCONFIG "CONFIG_NOMOUNT=n"
          fi

          # BBR + ECN Kernel Configuration with Brutal Default and Cubic Fallback
          if [[ "$TCP" != "None" ]]; then
            echo "🚀 Applying ECN Configurations..."          
            # Base BBR + ECN Settings
            SETCONFIG "CONFIG_NET_SCH_FQ=y"
            SETCONFIG "CONFIG_TCP_CONG_BIC=n"
            SETCONFIG "CONFIG_TCP_CONG_WESTWOOD=n"
            SETCONFIG "CONFIG_TCP_CONG_HTCP=n"
            SETCONFIG "CONFIG_IP_ECN=y"
            SETCONFIG "CONFIG_TCP_ECN=y"
            SETCONFIG "CONFIG_IPV6_ECN=y"
            SETCONFIG "CONFIG_IP_NF_TARGET_ECN=y"          
            # Additional TCP Algorithms if Brutal is Selected
            if [[ "$TCP" == "BBRV1+ECN+Brutal" || "$TCP" == "BBRV1+BBRV3+ECN+Brutal" ]]; then
              echo "🚀 Applying Brutal Specific Configurations..."
              SETCONFIG "CONFIG_TCP_CONG_BRUTAL=y"
              SETCONFIG "CONFIG_TCP_CONG_CUBIC=y"
              SETCONFIG "CONFIG_TCP_CONG_VEGAS=y"
              SETCONFIG "CONFIG_TCP_CONG_NV=y"
              # Set Brutal as the Default Only if it's Compiled
              SETCONFIG "CONFIG_DEFAULT_TCP_CONG=brutal"
              echo "🎉 BBR + ECN: Brutal Default Enabled (Cubic Fallback Included)"
            else
              # Not Brutal → Use Cubic as Safe Default
              SETCONFIG "CONFIG_DEFAULT_TCP_CONG=cubic"
              echo "🎉 BBR + ECN: Using Cubic as Default (Brutal Not Selected)"
            fi          
          else
            echo "☘️ Congestion Control Disabled, Skipping BBR + ECN Configuration"
            echo "🧩 Default Congestion Control Remains Unchanged"
          fi

          # Additional TCP Congestion Control Configuration for BBRV3
          if [[ ("$TCP" == "BBRV1+BBRV3+ECN" || "$TCP" == "BBRV1+BBRV3+ECN+Brutal") &&
                "$GKI" != "android16-6.12" ]]; then
            HIDECONFIG "CONFIG_TCP_CONG_ADVANCED=y"
            SETCONFIG "CONFIG_TCP_CONG_BBR=y"
            SETCONFIG "CONFIG_TCP_CONG_BBR3=y"
            echo "🚀 Applying BBRV3 Specific Configurations..."
          fi

          # Linux Security Module Baseband Guard Configuration
          if [[ "$LSM" == "true" ]]; then
            SETCONFIG "CONFIG_BBG=y"
            echo "🎉 Linux Security Module Baseband Guard Configuration Applied"
          else
            echo "☘️ Linux Security Module Baseband Guard Disabled, Skipping..."
          fi
          
          # IPSet and IPv6 NAT Configuration
          if [[ "$CPU" == sm* && "$NET" == "true" ]]; then
            # BPF Stream Parser for Non-6.12 Kernels
            if [[ "$KERNEL" != "6.12" ]]; then
              SETCONFIG "CONFIG_BPF_STREAM_PARSER=y"
              echo "🎉 BPF Stream Parser Enabled for Kernel $KERNEL"
            else
              echo "☘️ BPF Stream Parser Disabled for Kernel $KERNEL, Skipping..."
            fi
          fi

          # Netfilter and IPSet Core Configuration
          if [[ "$NET" == "true" ]]; then
            SETCONFIG "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            SETCONFIG "CONFIG_NETFILTER_XT_SET=y"
            SETCONFIG "CONFIG_IP_SET=y"
            SETCONFIG "CONFIG_IP_SET_MAX=65534"
            SETCONFIG "CONFIG_IP_SET_BITMAP_IP=y"
            SETCONFIG "CONFIG_IP_SET_BITMAP_IPMAC=y"
            SETCONFIG "CONFIG_IP_SET_BITMAP_PORT=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IP=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IPMARK=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IPPORT=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IPPORTIP=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IPPORTNET=y"
            SETCONFIG "CONFIG_IP_SET_HASH_IPMAC=y"
            SETCONFIG "CONFIG_IP_SET_HASH_MAC=y"
            SETCONFIG "CONFIG_IP_SET_HASH_NETPORTNET=y"
            SETCONFIG "CONFIG_IP_SET_HASH_NET=y"
            SETCONFIG "CONFIG_IP_SET_HASH_NETNET=y"
            SETCONFIG "CONFIG_IP_SET_HASH_NETPORT=y"
            SETCONFIG "CONFIG_IP_SET_HASH_NETIFACE=y"
            SETCONFIG "CONFIG_IP_SET_LIST_SET=y"
            HIDECONFIG "CONFIG_IP6_NF_NAT=y"
            SETCONFIG "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            SETCONFIG "CONFIG_NETFILTER_XT_TARGET_HL=y"
            SETCONFIG "CONFIG_IP_NF_TARGET_TTL=y"
            SETCONFIG "CONFIG_IP6_NF_TARGET_HL=y"
            SETCONFIG "CONFIG_NETFILTER_XT_MATCH_HL=y"
            SETCONFIG "CONFIG_IP_NF_MATCH_TTL=y"
            SETCONFIG "CONFIG_IP6_NF_MATCH_HL=y"
            SETCONFIG "CONFIG_IP_NF_MANGLE=y"
            SETCONFIG "CONFIG_IP6_NF_MANGLE=y"
            echo "🎉 Netfilter and IPSet Core Configuration Applied"
          fi

          # NT Synchronization (Primitives) Configuration
          if [[ "$NTSYNC" == "true" ]]; then
            SETCONFIG "CONFIG_NTSYNC=y"
            echo "🎉 NT Synchronization (Primitives) Configuration Applied"
          else
            echo "☘️ NT Synchronization (Primitives) Disabled, Skipping..."
          fi
     
          # Apply Build Issues Fix
          # Mediatek 6.1 Kernels
          if [[ "$KERNEL" == "5.15" && "$CPU" == mt* ]]; then
            SETCONFIG "CONFIG_OPLUS_SYSTEM_KERNEL=y"
            SETCONFIG "CONFIG_OPLUS_FEATURE_CMDLINE=m"
            SETCONFIG "CONFIG_OPLUS_FEATURE_OPLUSBOOT=m"
            SETCONFIG "CONFIG_OPLUS_FEATURE_BUILDVARIANT=m"
            SETCONFIG "CONFIG_OPLUS_FEATURE_OPROJECT=m"
            echo "☘️ Configuration Disabled, Only for Mediatek with Kernel 5.15, Skipping..."
          fi

          # Enable Rust Support if Requested
          if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
            SETCONFIG "CONFIG_RUST=y"
            SETCONFIG "CONFIG_ANDROID_BINDER_IPC_RUST=m"
            echo "🎉 Rust Support Request Applied and Granted"
          else
            echo "☘️ Rust Support Not Requested"
          fi             

      - name: 🔧 IPv6 NAT Fix Stage
        if: ${{ inputs.NETFILTER }}
        shell: bash
        run: |
          set -euo pipefail

          # Paths
          PATCHDIRECTORY="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          IPV6PATCHFILE="${PATCHDIRECTORY}/IPv6.patch"
      
          echo "✔ NetFilter Enabled — 🔎 Checking IPv6 NAT Compatibility..."
      
          # Move Into Kernel Source Directory      
          cd "$KCDIR"
      
          # Validate Patch File
          if [[ ! -f "$IPV6PATCHFILE" ]]; then
            echo "⚠️ Patch File Not Found:"
            echo "$IPV6PATCHFILE"
            exit 1
          fi
      
          # Check CPU Support
          if [[ "${CPU:-}" != sm* ]]; then
            echo "⚠️ Device CPU Not Supported for IPv6 NAT Fix — Skipping"
            exit 0
          fi
      
          echo "📊 Device CPU Supports IPv6 NAT Fix"

          # Check if Patch Already Applied
          if patch --dry-run -p1 < "$IPV6PATCHFILE" >/dev/null 2>&1; then
            echo "🚀 Applying IPv6 NAT Compatibility Patch..."
            patch -p1 -F3 < "$IPV6PATCHFILE"
            echo "✔ IPv6 NAT Fix Applied Successfully"
          else
            echo "⚙️ IPv6 NAT Patch Already Applied or Not Needed"
          fi

          echo ""
          echo "🎉 IPv6 NAT Fix Stage Completed"

      - name: 🚫 Verify and Configure Conditional Vendor Module Blacklist
        if: ${{ inputs.DISABLEVENDORMODULE }}
        shell: bash
        env:
          TCPALGORITHM: ${{ inputs.TCPALGORITHM }}
        run: |
          set -Eeuo pipefail
      
          # Paths
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/scripts"
          WORKDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          SCRIPT="${PDIR}/ConditionalVendorBlacklist.kts"
          VERIFYSCRIPT="${PDIR}/VerifyVendorModule.kts"
      
          # Kotlin Environment
          KOTLINHOME="${KOTLINHOME:-$HOME/kotlinc}"
          KOTLINC="${KOTLINHOME}/bin/kotlinc"      
          # Display Build Configuration
          echo "📌 Script : $SCRIPT"
          echo "📌 Work Dir : $WORKDIR"
          echo "📌 Kernel : $KERNELVERSION"
          echo "📌 Compiler : $KOTLINC"
          echo "📡 TCP Algorithm : ${TCPALGORITHM:-Unknown}"
          # Verify Kotlin Compiler
          echo "☕ Kotlin Compiler:"
          "$KOTLINC" -version
      
          # Select Kernel-Specific Module Blacklist
          MODULES=""      
          case "$KERNELVERSION" in
            6.12)
              # Blacklist OPlus Secure Guard on Android 16 / Kernel 6.12
              MODULES="oplus_secure_guard_new"
              ;;
            *)
              # Skip Conditional Vendor Module Blacklist For Other Kernel Versions
              echo "ℹ️ No Conditional Vendor Modules Required For Kernel $KERNELVERSION"
              MODULES=""
              ;;
          esac

          # Select Network Optimization Modules Based on TCP Algorithm
          NETWORKMODULE=""
          case "${TCPALGORITHM:-None}" in
            BBRV1+BBRV3+ECN|BBRV1+BBRV3+ECN+Brutal)
              # BBR / BBRv3 Configurations Use Custom TCP Handling
              # Blacklist Both OPlus Network Optimization Modules so
              # Vendor Tuning Modules Do Not Interfere with
              # Selected TCP Algorithm Configuration
              NETWORKMODULE="oplus_network_tuning,oplus_networks_tuning"
              ;;
            None|"")
              # No Custom TCP Algorithm Selected
              # Do Not Blacklist OPlus Network Optimization Modules
              NETWORKMODULE=""
              ;;
            *)
              echo "⚠️ Unsupported TCP Algorithm: ${TCPALGORITHM}"
              exit 1
              ;;
          esac

          # Add TCP Network Module to Blacklist Selection
          if [[ -n "${NETWORKMODULE}" ]]; then
            if [[ -n "${MODULES}" ]]; then
              MODULES="${MODULES},${NETWORKMODULE}"
            else
              MODULES="${NETWORKMODULE}"
            fi
          fi

          # Display Final Module Selection
          echo "📡 TCP Algorithm : ${TCPALGORITHM:-Unknown}"
          if [[ -n "${NETWORKMODULE}" ]]; then
            echo "🌐 Network Module: ${NETWORKMODULE}"
          else
            echo "🌐 Network Module: None"
          fi

          if [[ -n "${MODULES}" ]]; then
            echo "📦 Modules : ${MODULES}"
          else
            echo "📦 Modules : None"
          fi

          # Nothing To Blacklist
          if [[ -z "${MODULES}" ]]; then
            echo ""
            echo "ℹ️ No Modules Selected"
            echo "⏭️ Skipping Conditional Vendor Module Blacklist"
            echo ""
            echo "🎉 Conditional Vendor Module Blacklist Step Completed"
            exit 0
          fi

          # Verify Configured Vendor Modules
          # If Any Configured Module is Missing From the Kernel Source, Skip the Entire Blacklist Operation
          echo ""
          echo "🔎 Verifying Configured Vendor Modules..."
          echo "📦 Modules to Verify: ${MODULES}"
          if ! "${KOTLINC}" -script "${VERIFYSCRIPT}" \
            "${WORKDIR}" \
            "${MODULES}"; then

            echo ""
            echo "⚠️ One or More Configured Vendor Modules Were Not Found"
            echo "⏭️ Skipping Conditional Vendor Module Blacklist"
            echo "📦 Requested Modules: ${MODULES}"
            echo ""
            echo "🎉 Conditional Vendor Module Blacklist Step Completed"
            exit 0
          fi

          echo ""
          echo "✔️ All configured vendor modules were found in source"
          
          # Apply Conditional Vendor Module Blacklist
          echo ""
          echo "🛡️ Configuring Conditional Vendor Module Blacklist..."
          "${KOTLINC}" -script "${SCRIPT}" \
            "${WORKDIR}" \
            "${MODULES}" \
            "${KERNELVERSION}"

          echo ""
          echo "✔️ Blacklisted Modules: ${MODULES}"
          echo "🎉 Conditional Vendor Module Blacklist Applied"

      - name: 🕒 Setup Custom Build Time
        shell: bash
        run: |
          set -Eeuo pipefail

          TIMEINPUT="${{ inputs.BUILDTIME }}"
          if [[ -n "$TIMEINPUT" && "$TIMEINPUT" != "[Ff]" ]]; then
            DATESTR="$TIMEINPUT"
            echo "🔎 Using Input Build Time: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date '+%a %b %-d %H:%M:%S UTC %Y')"
            echo "🛠️ Using UTC Time as Fallback: $DATESTR"
          fi

          {
            echo "KBUILD_BUILD_TIMESTAMP=$DATESTR"
            echo "KBUILD_BUILD_VERSION=1"
          } >> "$GITHUB_ENV"

          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform"
          
          # Move Into Kernel Source Directory
          cd "$KDIR"

          if [[ "$ANDROIDVERSION" == "android16" && "$KERNELVERSION" == "6.12" ]]; then
            echo "ℹ️ Android 16 / 6.12 Detected"
            echo "ℹ️ Using Kbuild Build Timestamp"
            echo "ℹ️ Skipping MKCompile H Modification"
          else
            SCRIPTS=(
              "common/scripts/mkcompile_h"
              "msm-kernel/scripts/mkcompile_h"
            )

            PATCHED=0
            for SCRIPT in "${SCRIPTS[@]}"; do
              if [[ ! -f "$SCRIPT" ]]; then
                echo "ℹ️ Script Not Found: $SCRIPT — Skipping"
                continue
              fi
              echo "🚀 Patching MKCompile Script: $SCRIPT"

              if grep -q '^UTS_VERSION=' "$SCRIPT"; then
                perl -pi -e \
                  "s{^UTS_VERSION=.*}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" \
                  "$SCRIPT"
                echo "✔ Replaced Existing UTS Version"
              elif grep -q 'cat <<EOF' "$SCRIPT"; then
                perl -0777 -pi -e \
                  "s{(cat <<EOF)}{\$1\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\"}ms" \
                  "$SCRIPT"
                echo "✔ Injected UTS Version Definition"
              else
                echo "⚠️ UTS Version Injection Point Not Found: $SCRIPT"
                continue
              fi
              PATCHED=$((PATCHED + 1))
            done

            if [[ "$PATCHED" -eq 0 ]]; then
              echo "ℹ️ No MKCompile Scripts Required Patching"
              echo "ℹ️ Kbuild Build Timestamp will be Used"
            else
              echo "🎉 Patched $PATCHED MKCompile Script(s)"
            fi
          fi

          echo ""
          echo "🔍 Build Environment:"
          echo "   Build Timestamp=$DATESTR"
          echo "   Build Version=1"

          echo ""
          echo "🎉 Custom Build Time Setup Completed"
     
      - name: 🚫 Disable GPU Embedded Bridge / Engine
        if: ${{ steps.kernel-version-setup.outputs.kernelversion == '5.10' && startsWith(steps.extract-info.outputs.cpu, 'mt') }}
        shell: bash
        run: |
          set -euo pipefail
      
          MAKEFILEGPUEB="${GITHUB_WORKSPACE}/kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile"      
          # Verify Makefile Exists
          if [[ ! -f "$MAKEFILEGPUEB" ]]; then
            echo "⚠️ Makefile Not Found: $MAKEFILEGPUEB — skipping GPUEB disable"
            exit 0
          fi
      
          echo "🛠️ Disabling GPUEB in $MAKEFILEGPUEB..."
      
          # Check if GPUEB Already Disabled
          if grep -q 'obj-y.*gpueb' "$MAKEFILEGPUEB"; then          
            # Remove Lines Containing GPUEB from OBJ-Y Assignments
            sed -i '/obj-y.*gpueb/d' "$MAKEFILEGPUEB"
            echo "🎉 GPUEB Entries Removed Successfully"
          else
            echo "✔ GPUEB Already Disabled — Nothing to Do"
          fi

          echo ""
          echo "🎉 GPU Embedded Bridge / Engine Disable Stage Completed"

      - name: ♻️ Restore ThinLTO Cache
        id: restore-thinlto
        if: ${{ startsWith(steps.kernel-version-setup.outputs.kernelversion, '5.') }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.FILE }}-${{ steps.kernel-version-setup.outputs.kernelversion }}-16.9

      - name: 🏗️ Kernel Build
        id: kernelbuild
        run: |
          set -Eeuo pipefail

          # Define kernel source paths
          KERNELPLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          KERNELCOMMON="$KERNELPLATFORM/common"

          # Handle Expected Fast Build Fallback
          fallback() {
            local reason="$1"
            echo "⚠️ Fast Build Fallback"
            echo "📌 Reason : $reason"

            if [[ -z "${FALLBACKSET:-}" ]]; then
              echo "fallbackreason=$reason" >> "$GITHUB_OUTPUT"
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              export FALLBACKSET=1
            fi
            exit 0
          }

          # Handle Unexpected Fast Build Errors
          error() {
            local line="$1"
            local code="$2"
            echo "⚠️ Fast Build Failed"
            echo "📍 Line      : $line"
            echo "📤 Exit Code : $code"
            fallback "unexpectederror"
          }

          # Route Unexpected Errors Through Fallback Handler
          trap 'error "$LINENO" "$?"' ERR

          # Load Build Environment Information
          FILEBASE="${MANIFESTBASEFILE:-Unknown}"
          BRANCH="${MANIFESTBRANCH:-Unknown}"
          CPU="${CPUD:-Unknown}"
          METHOD="${BUILDMETHOD:-Perf}"
          ANDROIDVER="${ANDROIDVERSION:-Unknown}"
          KERNELVER="${KERNELVERSION:-Unknown}"
          GKIVER="${ANDROIDVER}-${KERNELVER}"

          echo "------------------------------"
          echo "🚀 Fast Kernel Build"
          echo "------------------------------"
          echo "📂 File     : $FILEBASE"
          echo "🌿 Branch   : $BRANCH"
          echo "📱 CPU      : $CPU"
          echo "⚙️ Method   : $METHOD"
          echo "📦 Version  : $GKIVER"
          echo "------------------------------"
          echo ""

          # Record Fast Build Start Time for Final Summary
          FASTBUILDSTART=$(date +%s)

          # Validate Clang Toolchain
          # Clang is Prepared by the Dedicated Clang Setup Step
          # CLANGFULLPATH is Persisted
          [[ -x "${CLANGFULLPATH:-}" ]] || {
            echo "⚠️ Clang Toolchain Is Not Available"
            fallback "missingclang"
          }

          # Validate Rust Compiler And Bindgen
          # Rust and Bindgen are Only Fequired When Kernel Source Requires Rust Support
          if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
            # Rustc Must be Available Before Attempting to Use Bindgen
            [[ -x "${RUSTCPATH:-}" ]] || {
              echo "⚠️ Rust Compiler Is Not Available"
              fallback "missingrustc"
            }

            # Bindgen is Required Together with Rust Toolchain
            [[ -x "${BINDGEN:-}" ]] || {
              echo "⚠️ Bindgen Is Not Available"
              fallback "missingbindgen"
            }
          fi

          # Detect the Prebuilt Pahole Binary Dynamically
          PAHOLEBIN="$(
            find "$KERNELPLATFORM" \
              -type f \
              -path '*/kernel-build-tools/linux-x86/bin/pahole' \
              -executable \
              -print 2>/dev/null |
            head -n1
          )"

          # Fall Back to the System Pahole When Necessary
          if [[ -z "$PAHOLEBIN" ]]; then
            PAHOLEBIN="$(command -v pahole 2>/dev/null || true)"
            if [[ -x "$PAHOLEBIN" ]]; then
              echo "⚠️ Using Pahole from System Path"
            fi
          fi

          # Validate Pahole and LLVM Tools
          if [[ -x "$PAHOLEBIN" ]]; then
            export PAHOLE="$PAHOLEBIN"
            echo "📌 Pahole Detected"
            echo "📦 Binary  : $PAHOLEBIN"
            echo "📦 Version : $("$PAHOLEBIN" --version | head -n1)"
          else
            echo "⚠️ Pahole Not Found"
            echo "⚠️ BTF Generation Cannot Continue"
            fallback "missingpahole"
          fi

          # Enter Common Kernel Source Directory
          if [[ -f "$KERNELCOMMON/Makefile" ]]; then
            cd "$KERNELCOMMON"
          else
            echo "⚠️ Common Directory Not Found!"
            echo "📂 Expected: $KERNELCOMMON"
            fallback "missingcommon"
          fi

          # Load Android Kernel Build Environment
          SETUPENVSH="${KERNELPLATFORM}/build/kernel/_setup_env.sh"
          if [[ -f "$SETUPENVSH" ]]; then
            echo "🔧 Loading Android Kernel Build Environment..."
            # Temporarily Disable Unset Variable Checking
            set +u
            source "$SETUPENVSH" 2>/dev/null || true
            set -u
          fi

          # Physical Kernel Source Root
          # Resolve for Reproducible Compiler Prefix Mapping
          ROOTREALPATH="$(realpath ../..)" ||
            fallback "realpathfailed"
          ROOTREALPATH="${ROOTREALPATH%/}"

          # Configure Compiler Path Mapping and Warning Flags
          MAP="-fdebug-prefix-map=${ROOTREALPATH}=."
          MPMAP="-fmacro-prefix-map=${ROOTREALPATH}=."
          FPMAP="-ffile-prefix-map=${ROOTREALPATH}=."
          
          # Common Optimization and Reproducibility Flags 
          KCFLAGS=(
            "$MAP"
            "$FPMAP"
            -no-canonical-prefixes
            -O2
            -pipe
            -Wno-error
            -fno-stack-protector
            -D__ANDROID_COMMON_KERNEL__
          )
          # Apply Macro Prefix Mapping
          KCPPFLAGS="$MPMAP"

          # Create CCache Clang Wrapper
          REALCLANGBIN="$CLANGFULLPATH"
          CCACHEWRAPPER="$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper"
          printf '#!/bin/bash\nexec ccache "%s" "$@"\n' \
            "$REALCLANGBIN" > "$CCACHEWRAPPER"
          chmod +x "$CCACHEWRAPPER"

          echo "🎉 CCache Wrapper Created"
          echo "📦 Wrapper : $CCACHEWRAPPER"
          echo "📦 Clang   : $REALCLANGBIN"

          # Configure ThinLTO Linker Cache for Supported 5.x Kernels
          LDLLDWRAPPER=""
          if [[ "${BUILDCCACHE:-Disabled}" != "Disabled" ]] && \
             [[ "$KERNELVER" == 5.* ]]; then
            LDCACHEDIR="$GITHUB_WORKSPACE/kernel_workspace/.thinlto-cache"
            LDLLDWRAPPER="$GITHUB_WORKSPACE/kernel_workspace/ld-wrapper"

            # Create ThinLTO Cache Directory
            mkdir -p "$LDCACHEDIR"

            # Locate LLVM LLD
            LLDBIN="$(command -v ld.lld 2>/dev/null || true)"
            if [[ -z "$LLDBIN" ]]; then
              echo "⚠️ LD.LLD Not Found"
              echo "📊 ThinLTO Linker Cache: Disabled"

              LDLLDWRAPPER=""
            else
              # Create ThinLTO LLD Wrapper
              printf '#!/bin/bash\nexec "%s" "$@" --thinlto-cache-dir="%s" --thinlto-cache-policy=cache_size_bytes=2g --thinlto-jobs=%s\n' \
                "$LLDBIN" \
                "$LDCACHEDIR" \
                "$(nproc --all)" > "$LDLLDWRAPPER"
              chmod +x "$LDLLDWRAPPER"

              echo "🎉 ThinLTO Linker Wrapper Created"
              echo "📦 Wrapper : $LDLLDWRAPPER"
              echo "📦 LLD     : $LLDBIN"
              echo "📂 Cache   : $LDCACHEDIR"
              echo "💾 Cache   : 2 Gb"
              echo "⚙️ Jobs    : $(nproc --all)"
            fi
          else
            echo "📊 ThinLTO Linker Cache: Disabled"
          fi

          # Prepare Kernel Based Arguments Shared by Build Configurations
          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="$CCACHEWRAPPER"
            HOSTCC="$CCACHEWRAPPER"
            HOSTLD="${LDLLDWRAPPER:-ld.lld}"
            PAHOLE="$PAHOLEBIN"
            KCFLAGS="${KCFLAGS[*]}"
            KCPPFLAGS="$KCPPFLAGS"
          )

          # Enable LLVM Integrated Assembler When Requested
          if [[ "${LLVMENABLED:-false}" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
            echo "🛠️ LLVM Integrated Assembler: Enabled"
          else
            echo "🛠️ LLVM Integrated Assembler: Disabled"
          fi
      
          # Pass Rust Compiler to Kernel Build
          if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTCPATH")
            echo "🦀 Rust Compiler  : Enabled"
            echo "📦 Rustc          : $RUSTCPATH"
          fi
      
          # Use ThinLTO Wrapper as Kernel Linker When Available
          if [[ -n "$LDLLDWRAPPER" ]]; then
            MAKE_ARGS+=(LD="$LDLLDWRAPPER")
            echo "🔗 Kernel Linker  : ThinLTO Wrapper"
          else
            echo "🔗 Kernel Linker  : Default LLVM LLD"
          fi
      
          # Pass Optional Fake Configuration Setting
          if [[ -n "${DISABLEFAKECONFIG:-}" ]]; then
            MAKE_ARGS+=(DISABLEFAKECONFIG="$DISABLEFAKECONFIG")
            echo "🧩 Fake Configuration Override: Enabled"
          fi

          # Generate Initial GKI Configuration
          echo ">> 🚀 Running GKI Default Configuration"
          if ! make O=out \
            "${MAKE_ARGS[@]}" \
            gki_defconfig; then
            echo "⚠️ GKI Default Configuration Failed"
            fallback "gkidefconfigfailed"
          fi

          # Configure ThinLTO for Supported 5.x Kernels
          echo "🧾 Configuring Link Time Optimization (LTO) for Kernel $KERNELVERSION"
          if [[ ! -s out/.config ]]; then
            echo "⚠️ Configuration Not Found"
            echo "📊 LTO Status: Skipped (Missing Configuration)"
          else
            CONFIGTOOL=""
            # Check Common Scripts / Configurations Locations
            for path in \
              ../scripts/config \
              ./scripts/config \
              ../../scripts/config
            do
              if [[ -x "$path" ]]; then
                CONFIGTOOL="$path"
                break
              fi
            done

            # Search Source Tree When No Standard Path Exists
            if [[ -z "$CONFIGTOOL" ]]; then
              CONFIGTOOL="$(
                find .. \
                  -type f \
                  -path '*/scripts/config' \
                  -executable \
                  2>/dev/null |
                head -n1
              )"
            fi

            # Validate Configuration Tool
            if [[ -n "$CONFIGTOOL" ]] &&
               [[ ! -x "$CONFIGTOOL" ]]; then
              CONFIGTOOL=""
            fi
            
            if [[ -z "$CONFIGTOOL" ]]; then
              echo "⚠️ Scripts / Configuration Not Found"
              echo "📊 LTO Status: Skipped (Missing scripts/config)"
            else
              case "$KERNELVERSION" in
                5.*)
                  echo ">> 🚀 LTO: Thin"
                  "$CONFIGTOOL" \
                    --file out/.config \
                    -e LTO_CLANG \
                    -e LTO_CLANG_THIN \
                    -d LTO_CLANG_NONE \
                    -d LTO_CLANG_FULL ||
                    echo "⚠️ LTO Configuration Apply Failed"
                  echo "📊 LTO Status: Applied (Thin)"
                  ;;
                *)
                  echo "🚀 LTO Skipped for Kernel $KERNELVERSION"
                  echo "📊 LTO Status: Skipped (Unsupported Kernel)"
                  ;;
              esac
            fi
          fi

          # Generate Final Kernel Configuration
          echo ">> 🚀 Running Old Default Configuration"
          if ! make O=out \
            "${MAKE_ARGS[@]}" \
            olddefconfig; then
            echo "⚠️ Old Default Configuration Failed"
            fallback "olddefconfigfailed"
          fi

          # Save Important Build Outputs for Fast Build Cache
          CACHE_DIR="../cache"
          savefastccache() {
            echo "📦 Saving Fast Build Cache..."
            mkdir -p "$CACHE_DIR" || {
              echo "⚠️ Unable to Create Fast Build Cache"
              return 0
            }
            [[ -f out/.config ]] &&
              cp -f out/.config "$CACHE_DIR/.config" || true
            if [[ -d out/include ]]; then
              rm -rf "$CACHE_DIR/include" || true
              cp -rf out/include "$CACHE_DIR/" || true
            fi
            [[ -f out/Module.symvers ]] &&
              cp -f out/Module.symvers "$CACHE_DIR/Module.symvers" || true
            echo "✔️ Fast Build Cache Saved"
          }

          # Save Configuration Before Compilation
          savefastccache

          # Display Available System Resources
          echo "💻 CPU Threads : $(nproc)"
          free -h || true
          echo ""
          echo "🚀 Compiling Kernel with $(nproc) Threads"

          # Compile Kernel
          if ! make -j"$(nproc)" \
            O=out \
            "${MAKE_ARGS[@]}"; then
            echo "⚠️ Kernel Compilation Failed"
            fallback "compilefailed"
          fi

          # Save Generated Build Outputs After Compilation
          savefastccache

          # Display Final CCache Statistics
          echo "📊 Compiler Cache Statistics"
          ccache -s || true

          # Calculate Fast Build Duration
          FASTBUILDEND=$(date +%s)
          FASTBUILDTIME=$((FASTBUILDEND - FASTBUILDSTART))
          echo "fastbuildtime=$FASTBUILDTIME" >> "$GITHUB_OUTPUT"
          echo "fastbuildstatus=success" >> "$GITHUB_OUTPUT"
          echo "⏱️ Fast Build Time: ${FASTBUILDTIME}s"

          # Generate GitHub Actions Build Summary
          CCACHESUMMARY="$(ccache -s 2>&1)"
          {
            echo "## 🧠 Compiler Cache Performance Summary"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Build Status | 🚀 Success |"
            echo "| Fast Build Time | **${FASTBUILDTIME}s** |"
            echo "| Cacheable Calls | $(echo "$CCACHESUMMARY" | grep "Cacheable calls:" | sed 's/.*Cacheable calls:[[:space:]]*//') |"
            echo "| Cache Hits | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Hits:" | head -n1 | sed 's/.*Hits:[[:space:]]*//') |"
            echo "| Direct Hits | $(echo "$CCACHESUMMARY" | grep "Direct:" | sed 's/.*Direct:[[:space:]]*//') |"
            echo "| Preprocessed Hits | $(echo "$CCACHESUMMARY" | grep "Preprocessed:" | sed 's/.*Preprocessed:[[:space:]]*//') |"
            echo "| Cache Misses | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Misses:" | head -n1 | sed 's/.*Misses:[[:space:]]*//') |"
            echo "| Uncacheable Calls | $(echo "$CCACHESUMMARY" | grep "Uncacheable calls:" | sed 's/.*Uncacheable calls:[[:space:]]*//') |"
            echo "| Cache Size | $(echo "$CCACHESUMMARY" | grep "Cache size" | sed 's/.*Cache size (GB):[[:space:]]*//') |"
            echo ""
            echo "### ⚡ Build Result"
            echo ""
            echo "**🎉 Fast Build Completed Successfully**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "🎉 Build Complete"

      - name: 🏗️ Fallback Kernel Build
        if: ${{ steps.kernelbuild.outputs.fallback == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail      
    
          # Report Fallback Errors While Preserving the Original Exit Code
          trap 'echo "⚠️ Failure on Line $LINENO (Exit Code $?)"' ERR

          FALLBACKSTART=$(date +%s)
      
          # # Enter the Kernel Platform Source Tree
          cd kernel_workspace/kernel_platform || {
            echo "⚠️ kernel_platform Directory Not Found"
            exit 1
          }
      
          # Environment Variables
          FILEBASE="${MANIFESTBASEFILE:-Unknown}"
          CPU="${CPUD:-Unknown}"
          METHOD="${BUILDMETHOD:-Perf}"
          ANDROIDVER="${ANDROIDVERSION:-Unknown}"
          KERNELVER="${KERNELVERSION:-Unknown}"
          GKIV="${ANDROIDVER}-${KERNELVER}"
      
          # Retrieve Fast Build Metadata
          FALLBACKREASON="${{ steps.kernelbuild.outputs.fallbackreason }}"
          FASTBUILDTIME="${{ steps.kernelbuild.outputs.fastbuildtime }}"      
          
          FALLBACKREASON="${FALLBACKREASON:-Unknown}"
          FASTBUILDTIME="${FASTBUILDTIME:-0}"
      
          echo "🚀 Kernel Fallback Build..."
          echo "📂 Manifest : ${FILEBASE}"
          echo "📱 Target   : ${CPU}"
          echo "⚙️ Method   : ${METHOD}"
          echo "🧩 Version  : ${GKIV}"
          echo ""
          echo "⚠️ Fallback Reason : ${FALLBACKREASON}"
      
          if [[ "${FASTBUILDTIME}" != "0" ]]; then
            echo "⚡ Fast Build Runtime : ${FASTBUILDTIME}s"
          else
            echo "⚡ Fast Build : Skipped"
          fi
      
          echo ""
      
          # Restore Metadata Generated by the Fast Build
          echo "📥 Restoring Fast Build Cache..."      
          mkdir -p out   
          if [[ -d ../cache ]]; then
            [[ -f ../cache/.config ]] &&
              cp -f ../cache/.config out/.config                 
            [[ -d ../cache/include ]] &&
              cp -rf ../cache/include out/                  
            [[ -f ../cache/Module.symvers ]] &&
              cp -f ../cache/Module.symvers out/Module.symvers      
            echo "✔️ Fast Build Cache Restored"
          else
            echo "⚠️ No Fast Build Cache Found"
            echo "📌 Performing Full Rebuild"
          fi
      
          # Remove Known Recursive Source Symlinks
          echo "🧹 Cleaning Recursive Source Symlink Loops..."      
          for link in \
            common/out/source \
            msm-kernel/out/source
          do
            if [[ -L "$link" ]]; then
              echo "⚠️ Removing Symlink: $link"
              rm -f "$link"
            fi
          done
      
          # Clear Bazel State Before the Fallback Build
          if command -v bazel >/dev/null 2>&1; then
            echo "🧹 Cleaning Bazel Build State..."      
            bazel clean --async ||
              echo "⚠️ Bazel Clean Failed (Ignored)"
          fi
      
          # Configure Fallback Build Environment Flags
          export KMI_SYMBOL_LIST_STRICT_MODE="${KMI_SYMBOL_LIST_STRICT_MODE:-0}"
          export BUILD_SYSTEM_DLKM="${BUILD_SYSTEM_DLKM:-0}"
          export SYSTEM_DLKM_RE_SIGN="${SYSTEM_DLKM_RE_SIGN:-0}"
      
          # Detect the Available Kernel Build System
          BAZELSCRIPT=""
          OPLUSSCRIPT=""      
          if [[ -f build_with_bazel.py ]]; then
            BAZELSCRIPT="build_with_bazel.py"
          elif [[ -f build/build_with_bazel.py ]]; then
            BAZELSCRIPT="build/build_with_bazel.py"
          elif [[ -f oplus/build/oplus_build_kernel.sh ]]; then
            OPLUSSCRIPT="oplus/build/oplus_build_kernel.sh"
          fi
      
          # Execute the Detected Fallback Build System
          if [[ -n "$BAZELSCRIPT" ]]; then      
            echo "🔎 Detected Bazel / Kleaf Build System"
            echo "📄 Script : $BAZELSCRIPT"  
            # Generate the OPlus Module Variant When Supported
            if [[ -f oplus/bazel/oplus_modules_variant.sh ]]; then
              chmod +x oplus/bazel/oplus_modules_variant.sh     
              ./oplus/bazel/oplus_modules_variant.sh \
                "$CPU" \
                "$METHOD"
            fi      
            # Execute the Bazel / Kleaf Kernel Build
            python3 "$BAZELSCRIPT" \
              -t "$CPU" \
              "$METHOD"      
          elif [[ -n "$OPLUSSCRIPT" ]]; then     
            echo "🔎 Detected Legacy OPlus Build System"
            echo "📄 Script : $OPLUSSCRIPT"     
            # Execute the Legacy OPlus Kernel Build Script
            chmod +x "$OPLUSSCRIPT"     
            bash "$OPLUSSCRIPT" \
              "$CPU" \
              "$METHOD"      
          else     
            # Stop When No Supported Build System Can be Detected
            echo "⚠️ No Valid Build System Found"
            echo ""
            echo "📂 Current Directory:"
            pwd
            echo ""
            echo "📄 Available Build Files:"      
            find . -maxdepth 4 \
              \( \
                -name '*.py' -o \
                -name '*.sh' -o \
                -name 'WORKSPACE' -o \
                -name 'MODULE.bazel' \
              \) \
              -print      
            exit 1
          fi
      
          # Calculate Fallback and Combined Build Times
          FALLBACKEND=$(date +%s)
          FALLBACKTIME=$((FALLBACKEND - FALLBACKSTART))
          TOTALTIME=$((FASTBUILDTIME + FALLBACKTIME))
      
          echo ""
          echo "🎉 Kernel Build Complete"
          echo "⚡ Fast Build     : ${FASTBUILDTIME}s"
          echo "🐢 Fallback Build : ${FALLBACKTIME}s"
          echo "🕒 Total Runtime  : ${TOTALTIME}s"
      
          # Write the Final Build Information to the GitHub Summary
          {
            echo "## 📊 Kernel Build Summary"
            echo ""
            echo "### ⚡ Build Performance"
            echo "- Fast Build: ${FASTBUILDTIME}s"
            echo "- Fallback Build: ${FALLBACKTIME}s"
            echo "- Total Runtime: ${TOTALTIME}s"
            echo ""
            echo "### 🧾 Build Information"
            echo "- CPU: ${CPU}"
            echo "- Method: ${METHOD}"
            echo "- Version: ${GKIV}"
            echo ""
            echo "### ⚠️ Fallback Reason"
            echo "- ${FALLBACKREASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Save ThinLTO Cache
        if: ${{ startsWith(steps.kernel-version-setup.outputs.kernelversion, '5.') && steps.kernelbuild.outputs.fallback != 'true' && steps.restore-thinlto.outputs.cache-hit == false }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.FILE }}-${{ steps.kernel-version-setup.outputs.kernelversion }}-16.9

      - name: 🗃️ Manage Compiler Cache
        if: ${{ steps.buildprofile.outputs.buildccache != 'Disabled' }}
        id: manageccache
        shell: bash
        env:
          PROFILE: ${{ inputs.PROFILE }}
        run: |
          set -Eeuo pipefail

          # Define compiler cache variables
          RESTOREDDELTAFILE="$CCACHE_DIR/.deltakey"
          RESTOREDDELTA=""
          CCACHESAVE="false"

          # Generate Environment Delta Key
          echo "🔍 Generating Environment Delta Key..."
          KERNELSHA="$(git rev-parse HEAD 2>/dev/null || echo no-git)"
          CLANGVER="$(clang --version | sha256sum | awk '{print $1}')"
          CCACHEVER="$(ccache -V | sha256sum | awk '{print $1}')"

          DELTARAW="${KERNELSHA}|${{ steps.extract-info.outputs.manifestbasefile }}|${{ steps.kernel-version-setup.outputs.kernelversion }}|${{ steps.kernel-version-setup.outputs.androidversion }}|${CLANGVER}|${CCACHEVER}"
          DELTAKEY="$(printf '%s' "$DELTARAW" | sha256sum | awk '{print $1}')"
          echo "DELTAKEY=$DELTAKEY" >> "$GITHUB_ENV"

          echo ""
          echo "📦 Delta Key:"
          echo "$DELTAKEY"

          # Validate restored cache fingerprint
          echo ""
          echo "🧪 Checking Existing Cache Fingerprint..."
          if [[ -f "$RESTOREDDELTAFILE" ]]; then
            RESTOREDDELTA="$(<"$RESTOREDDELTAFILE")"
            echo "📦 Restored Delta:"
            echo "$RESTOREDDELTA"
          else
            echo "⚠️ No Existing Delta Key Found"
          fi

          # Detect Cache Environment Mismatch
          if [[ -n "$RESTOREDDELTA" && "$RESTOREDDELTA" != "$DELTAKEY" ]]; then
            echo ""
            echo "⚠️ Delta Mismatch Detected"
            echo "🧨 Build Environment Changed"
            echo "🧹 Wiping Old Compiler Cache..."
            find "$CCACHE_DIR" -mindepth 1 -delete
            sync
            echo "🎉 Old Compiler Cache Removed"
          else
            echo ""
            echo "🎉 Compiler Cache Environment Valid"
          fi

          # Display Cache Statistics
          echo ""
          echo "📊 Cache Statistics"
          echo "HITRATE=${HITRATE:-0}"
          echo "CCACHE_DIR=${CCACHE_DIR:-None}"
          echo "RELEASE_CACHE_RESTORED=${{ steps.cache-restoration.outputs.cache-restored || 'false' }}"
          echo "ACTIONS_CACHE_HIT=${{ steps.ccache-restore.outputs.cache-hit || 'false' }}"

          echo ""

          # Validate Compiler Cache Directory
          if [[ -n "${CCACHE_DIR:-}" && -d "$CCACHE_DIR" ]]; then
            echo "📊 Cache Directory Found"
            du -sh "$CCACHE_DIR" || true
            FILECOUNT=$(find "$CCACHE_DIR" -type f 2>/dev/null | wc -l)
            echo "📄 Cached Files: ${FILECOUNT}"
            if [[ "$FILECOUNT" -eq 0 ]]; then
              echo "⚠️ Cache Directory Is Empty"
            fi
          else
            echo "⚠️ Cache Directory Missing"
          fi

          echo ""

          # Decide Whether the Compiler Cache Should be Saved
          if awk "BEGIN {exit !(${HITRATE:-0} < 90)}"; then
            echo "📉 Cache Hit Rate Below 90%"
            echo "💾 Cache Refresh Required"
            CCACHESAVE="true"
          elif [[ "${{ steps.cache-restoration.outputs.cache-restored || 'false' }}" != "true" ]]; then
            echo "📦 No GitHub Release Cache Restored"
            echo "💾 Cache Upload Required"
            CCACHESAVE="true"
          elif [[ "${{ steps.ccache-restore.outputs.cache-hit || 'false' }}" != "true" ]]; then
            echo "📦 No Actions Cache Restored"
            echo "💾 Cache Upload Required"
            CCACHESAVE="true"
          else
            echo "🎉 Compiler Cache Healthy"
            echo "⏭️ Skipping Cache Upload"
            CCACHESAVE="false"
          fi

          echo ""

          # Display Final Cache Save Decision
          echo "📌 Final Decision: CCACHESAVE=${CCACHESAVE}"
          if [[ "$CCACHESAVE" == "true" ]]; then
            echo "🔑 Cache Key:"
            echo "CCache-${{ runner.os }}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.extract-info.outputs.cpu }}-${{ github.ref_name }}"
          fi

          # Export Cache Save State
          echo "CCACHESAVE=${CCACHESAVE}" >> "$GITHUB_ENV"
          echo "ccachesave=${CCACHESAVE}" >> "$GITHUB_OUTPUT"

          # Create Compiler Cache Archive When Required
          if [[ "$CCACHESAVE" == "true" ]]; then
            echo ""
            echo "📦 Creating Compiler Cache Archive"
            TAR="CCache-${{ runner.os }}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.extract-info.outputs.cpu }}-${{ github.ref_name }}.tar.zst"
            TMPTAR="${TAR}.tmp"
            echo "TAR=$TAR" >> "$GITHUB_ENV"
            echo "tar=$TAR" >> "$GITHUB_OUTPUT"

            # Verify cache directory
            echo "📂 Cache Directory: $CCACHE_DIR"
            if [[ ! -d "$CCACHE_DIR" ]]; then
              echo "⚠️ Cache Directory Missing"
              exit 1
            fi

            # Verify Cache Contains Data
            if [[ -z "$(find "$CCACHE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ]]; then
              echo "⚠️ Cache Directory Empty"
              echo "ℹ️ Skipping Cache Archive Creation"
              CCACHESAVE="false"
              echo "CCACHESAVE=false" >> "$GITHUB_ENV"
              echo "ccachesave=false" >> "$GITHUB_OUTPUT"
            else

              # Generate Cache Metadata Fingerprint
              echo "🧬 Generating Cache Fingerprint..."
              FPFILE="$CCACHE_DIR/.fpccache"
              {
                echo "Manifest=${{ steps.extract-info.outputs.manifestbasefile }}"
                echo "RunnerOS=${{ runner.os }}"
                echo "Kernel=${KERNELVERSION}"
                echo "Android=${ANDROIDVERSION}"
                echo "KernelModule=${KERNELMODULE}"
                echo "CompilerProfile=${PROFILE}"
                echo "BuildMethod=${BUILDMETHOD}"
                echo "Delta=${DELTAKEY}"

                echo ""
                echo "---------- Clang ----------"
                clang --version || true

                echo ""
                echo "---------- Cache ----------"
                ccache -V || true

                echo ""
                echo "-------- Timestamp --------"
                date -u || true
              } > "$FPFILE"

              # Store cache delta key
              printf '%s\n' "$DELTAKEY" > "$CCACHE_DIR/.deltakey"
              sync
              # Remove Previous Archives
              echo "🧹 Cleaning Old Archives..."
              rm -f "$TAR" "$TMPTAR"

              # Display Cache Statistics
              echo "📊 Cache Statistics:"

              du -sh "$CCACHE_DIR" || true
              ccache -s || true

              # Compress Compiler Cache
              echo "📦 Compressing Compiler Cache..."
              tar \
                --sort=name \
                --mtime='UTC 2025-01-01' \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                -cf - \
                -C "$CCACHE_DIR" . \
                | zstd \
                    -T0 \
                    -15 \
                    --force \
                    -o "$TMPTAR"
              sync

              # Finalize Compiler Cache Archive
              echo "🔄 Finalizing Archive..."
              mv -f "$TMPTAR" "$TAR"
              sync
              # Verify Compiler Cache Archive
              echo "🔍 Verifying Archive..."
              [[ -f "$TAR" ]] || {
                echo "⚠️ Cache Archive Missing"
                exit 1
              }
              [[ -s "$TAR" ]] || {
                echo "⚠️ Cache Archive Empty"
                exit 1
              }

              ls -lh "$TAR"

              # Test ZSTD Compression Integrity
              echo "🧪 Testing ZSTD Integrity..."
              zstd -t "$TAR"
              # Test TAR Archive Integrity
              echo "🧪 Testing TAR Integrity..."
              tar --use-compress-program=zstd -tf "$TAR" >/dev/null
              # Preview Archive Contents
              echo "📂 Archive Preview:"
              tar --use-compress-program=zstd -tf "$TAR" | head -20 || true
              # Display Archive Size and Compression Ratio
              echo "📈 Archive Summary:"
              ORIGINALSIZE="$(du -sb "$CCACHE_DIR" | awk '{print $1}')"
              ARCHIVESIZE="$(stat -c '%s' "$TAR")"
              echo "Original Size : $(numfmt --to=iec "$ORIGINALSIZE")"
              echo "Archive Size  : $(numfmt --to=iec "$ARCHIVESIZE")"

              if [[ "$ORIGINALSIZE" -gt 0 ]]; then
                RATIO="$(awk "BEGIN { printf \"%.2f\", ($ARCHIVESIZE / $ORIGINALSIZE) * 100 }")"
                echo "Compression   : ${RATIO}%"
              fi

              echo "🎉 Compiler Cache TAR.ZST Created Successfully"
            fi
          else
            echo "⏭️ Cache Archive Creation Skipped"
          fi

          # Perform Compiler Cache Maintenance
          echo "🧹 Compiler Cache Maintenance"
          command -v ccache >/dev/null 2>&1 || {
            echo "⚠️ Compiler Cache Not Found, Skipping"
            exit 0
          }

          echo "📂 Cache Directory: $CCACHE_DIR"
          echo ""

          # Display Cache Statistics Before Maintenance
          echo "📊 Cache Statistics (Before):"
          ccache -s || true

          # Apply Cache Size Limit
          echo ""
          echo "📏 Setting Cache Size Limit..."
          ccache -M "$CCACHE_MAXSIZE" || true

          # Run Compiler Cache Internal Cleanup
          echo ""
          echo "🧹 Running Internal Cleanup..."
          ccache -c || true

          # Display Cache Statistics After Maintenance
          echo ""
          echo "📊 Cache Statistics (After):"
          ccache -s || true

          echo ""
          echo "🎉 Compiler Cache Maintenance Complete"

      - name: 📦 AnyKernel3 Packaging Engine
        run: |
          set -euo pipefail

          echo "📂 Cloning AnyKernel3 Master Branch..."
          git clone --depth=1 --branch master01-1 --single-branch https://github.com/AndreiMikh/AnyKernel3.git

          # Path to AnyKernel3 Folder
          AK3DIRECTORY="${GITHUB_WORKSPACE}/AnyKernel3"

          # Confirm AnyKernel3 Branch
          cd "$AK3DIRECTORY"
          echo "🌿 AnyKernel3 Branch: $(git branch --show-current)"
        
          # Valid Kernel Output Path
          IMAGEPATH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image"
          echo "🔎 Checking Kernel Image..."
          # Validate Kernel Image Exists
          if [[ ! -f "$IMAGEPATH" ]]; then
            echo "⚠️ ERROR: Kernel Image Not Found!"
            echo "🧾 Expected Path:"
            echo "$IMAGEPATH"
            exit 1
          fi

          echo "📌 Kernel Image Found:"
          realpath "$IMAGEPATH"

          echo "📦 Image Size:"
          ls -lh "$IMAGEPATH"

          echo "📊 Bytes:"
          stat -c%s "$IMAGEPATH"

          # Final Artifact
          echo "📦 Copying to AnyKernel3..."
          cp -f "$IMAGEPATH" "$AK3DIRECTORY/Image"

          echo ""
          echo "🎉 AnyKernel3 Packaging Completed Successfully"

      - name: 📦 Package NoMount Userspace
        if: ${{ inputs.NOMOUNT != 'None' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Define Paths
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          NOMOUNTSOURCE="${WS}/nomount-source"
          NOMOUNTBIN="${WS}/nomount-bin"
          NOMOUNTMODULEDIR="${WS}/nomount-userspace"
          NOMOUNTOUTDIR="${WS}/output"
          NOMOUNTMODULESRC="${NOMOUNTSOURCE}/module"

          echo "------------------------------"
          echo "NoMount Userspace Packaging"
          echo "------------------------------"
          echo "📂 NoMount Source : $NOMOUNTSOURCE"
          echo "📂 Module Source  : $NOMOUNTMODULESRC"
          echo "📂 Binary Source  : $NOMOUNTBIN"
          echo "📂 Output         : $NOMOUNTOUTDIR"
          echo ""

          # Verify NoMount Source
          [[ -d "$NOMOUNTSOURCE" ]] || {
            echo "⚠️ NoMount Source Directory Missing:"
            echo "   $NOMOUNTSOURCE"
            exit 1
          }

          # Verify NoMount Module Source
          [[ -d "$NOMOUNTMODULESRC" ]] || {
            echo "⚠️ NoMount Module Directory Missing:"
            echo "   $NOMOUNTMODULESRC"
            exit 1
          }

          [[ -f "$NOMOUNTMODULESRC/module.prop" ]] || {
            echo "⚠️ NoMount Module.prop Missing"
            exit 1
          }

          # Verify Compiled Userspace Binaries
          [[ -x "$NOMOUNTBIN/nm-arm64" ]] || {
            echo "⚠️ NoMount-ARM64 Missing"
            exit 1
          }

          [[ -x "$NOMOUNTBIN/nm-arm" ]] || {
            echo "⚠️ NoMount-ARM Missing"
            exit 1
          }

          # Prepare Packaging Directories
          rm -rf "$NOMOUNTMODULEDIR"
          mkdir -p "$NOMOUNTMODULEDIR/bin"
          mkdir -p "$NOMOUNTOUTDIR"

          # Copy Original NoMount Userspace
          cp -a "$NOMOUNTMODULESRC/." "$NOMOUNTMODULEDIR/"

          # Install Newly Compiled Userspace Binaries
          install -m 0755 \
            "$NOMOUNTBIN/nm-arm64" \
            "$NOMOUNTMODULEDIR/bin/nm-arm64"
          install -m 0755 \
            "$NOMOUNTBIN/nm-arm" \
            "$NOMOUNTMODULEDIR/bin/nm-arm"

          # Identify Exact NoMount Source Commit
          NOMOUNTCOMMIT="$(git -C "$NOMOUNTSOURCE" rev-parse HEAD)"
          echo "📌 NoMount Commit: $NOMOUNTCOMMIT"

          # Record NoMount Source Commit
          printf '%s\n' "$NOMOUNTCOMMIT" \
            > "$NOMOUNTMODULEDIR/nm-commit-src"

          # Normalize Module Version Code
          if grep -q '^versionCode=' "$NOMOUNTMODULEDIR/module.prop"; then
            sed -i 's/^versionCode=.*/versionCode=1/' \
              "$NOMOUNTMODULEDIR/module.prop"
          fi

          # Define Package Name
          NOMOUNTMODULEZIP="${NOMOUNTOUTDIR}/NoMount-${NOMOUNTCOMMIT}.zip"

          # Remove Existing Package
          rm -f "$NOMOUNTMODULEZIP"

          # Package Userspace
          echo "📦 Creating NoMount Userspace..."
          (
            cd "$NOMOUNTMODULEDIR"
            zip -qr "$NOMOUNTMODULEZIP" .
          )

          # Generate SHA-256 Checksum
          sha256sum "$NOMOUNTMODULEZIP" \
            > "${NOMOUNTMODULEZIP}.sha256"

          # Verify Package
          [[ -s "$NOMOUNTMODULEZIP" ]] || {
            echo "⚠️ NoMount Userspace ZIP Was Not Created"
            exit 1
          }

          echo ""
          echo "------------------------------"
          echo "NoMount Userspace Ready"
          echo "------------------------------"
          echo "📦 ZIP      : $NOMOUNTMODULEZIP"
          echo "🔐 SHA-256  : ${NOMOUNTMODULEZIP}.sha256"
          echo ""
          echo "📁 Contents:"
          unzip -l "$NOMOUNTMODULEZIP"

          echo ""
          echo "🎉 NoMount Userspace Packaged Successfully"

      - name: 🌍 Regional Variant Detection
        shell: bash
        run: |
          set -Eeuo pipefail
      
          # Init Variables
          IMAGEPATH="AnyKernel3/Image"

          # Scoring System (Heuristic-Based)
          SCORECOLOR=0
          SCOREOXYGEN=0

          # Final Outputs
          ROMBASE="Unknown"
          CONFIDENCE="Low"
      
          # Manifest Analysis (Primary Source)
          INFOMANIFEST="$(
            printf "%s %s %s" \
              "${MANIFESTBRANCH:-}" \
              "${MANIFESTREPO:-}" \
              "${MANIFESTFILECONFIG:-}" \
            | tr '[:upper:]' '[:lower:]'
          )"
      
          echo "🔎 Manifest Information:"
          echo "$INFOMANIFEST"
          echo ""
      
          # ColorOS / China Indicators
          grep -qiE "coloros|cn|china" <<< "$INFOMANIFEST" \
            && ((SCORECOLOR+=6))
      
          # OxygenOS / Global Indicators
          grep -qiE "oxygen|oneplus|global|eu|india" <<< "$INFOMANIFEST" \
            && ((SCOREOXYGEN+=6))
      
          # Generic OPlus Hint
          # OPlus generic signal (Shared Base)
          # NOTE: Affects Both ROMs
          grep -qi "oplus" <<< "$INFOMANIFEST" && {
            ((SCORECOLOR+=1))
            ((SCOREOXYGEN+=1))
          }
      
          # Kernel Image Analysis
          # (Fallback / Supplemental)
          # Only Used if Manifest Signals are Weak or Incomplete
          if [[ -f "$IMAGEPATH" ]]; then
            echo "✔ Found Kernel Image: $IMAGEPATH"

            # Extract Raw Strings from Kernel Image
            OUTPUTSTRINGS="$(
              strings "$IMAGEPATH" 2>/dev/null || true
            )"

            # Lowercase Version for Easier Matching
            LOWERSTRINGS="$(
              printf "%s" "$OUTPUTSTRINGS" \
                | tr '[:upper:]' '[:lower:]'
            )"

            # Debug Preview (Top 15 Matches)
            echo "🔎 Debug Matches (Top 15 Relevant Lines):"
      
            {
              grep -iE \
                "androidboot|fingerprint|oplus|oneplus|coloros|oxygen|hwc|region|country|build" \
                <<< "$OUTPUTSTRINGS" \
                | sed -n '1,15p'
            } || true
      
            echo "🧠 Analyzing Kernel Strings..."

            # Strong ColorOS Signals
            # Direct ROM Branding
            grep -qi "coloros" <<< "$LOWERSTRINGS" \
              && ((SCORECOLOR+=4))

            # China Region Hardware Configuration
            grep -qiE "hwc=cn|region=cn|country=cn|china" <<< "$LOWERSTRINGS" \
              && ((SCORECOLOR+=6))
      
            # Strong OxygenOS Indicators
            # Direct ROM Branding
            grep -qi "oxygen" <<< "$LOWERSTRINGS" \
              && ((SCOREOXYGEN+=4))
         
            # Global Region Hardware Configuration
            grep -qiE "hwc=global|hwc=eu|hwc=india" <<< "$LOWERSTRINGS" \
              && ((SCOREOXYGEN+=6))

            # Extra Weak Regional Hints
            grep -qiE "global|europe|india" <<< "$LOWERSTRINGS" \
              && ((SCOREOXYGEN+=2))

            # Shared Vendor Signal
            # OPlus Appears in Both ROM Eco-Systems
            grep -qi "oneplus" <<< "$LOWERSTRINGS" \
              && ((SCOREOXYGEN+=1))
      
            grep -qi "oplus" <<< "$LOWERSTRINGS" && {
              ((SCORECOLOR+=1))
              ((SCOREOXYGEN+=1))
            }      
          else
            # If kernel Image is Missing, Rely Entirely on Manifest
            echo "⚠️ Kernel Image Not Found"
            echo "⚠️ Using Manifest-Only Detection"
            echo ""      
          fi
      
          # Final Decision Logic
          if (( SCORECOLOR > SCOREOXYGEN )); then
            ROMBASE="ColorOS"
            MAXSCORE=$SCORECOLOR
          elif (( SCOREOXYGEN > SCORECOLOR )); then
            ROMBASE="OxygenOS"
            MAXSCORE=$SCOREOXYGEN
          elif (( SCORECOLOR >= 4 && SCOREOXYGEN >= 4 )); then
            # Only Treat as Tie if Both have Signals
            ROMBASE="ColorOS / OxygenOS"
            MAXSCORE=$SCORECOLOR
          else
            ROMBASE="Unknown"
            MAXSCORE=0
          fi
      
          # Confidence Level Calculation
          # Higher Score = Stronger Certainty
          if (( MAXSCORE >= 10 )); then
            CONFIDENCE="High"
          elif (( MAXSCORE >= 5 )); then
            CONFIDENCE="Medium"
          else
            CONFIDENCE="Low"
          fi
      
          # Output
          echo "------------------------------"
          echo "📊 Score Breakdown"
          echo "------------------------------"
          echo "🇨🇳 ColorOS  : $SCORECOLOR"
          echo "🇺🇸 OxygenOS : $SCOREOXYGEN"
          echo "------------------------------"
          echo "📌 Final ROM Base : $ROMBASE"
          echo "🎯 Confidence     : $CONFIDENCE"
          echo "------------------------------"

          # Export Results to GitHub Actions Environment
          {
            echo "ROMBASE=$ROMBASE"
            echo "ROMCONFIDENCE=$CONFIDENCE"
          } >> "$GITHUB_ENV"
      
          echo ""
          echo "🎉 Regional ROM Base Detection Complete!"

      - name: 🧩 KernelPatch / KernelPatch-Next
        if: ${{ (inputs.KERNELPATCH == 'KPM' && inputs.ROOTENGINE == 'SukiSU-Ultra') || inputs.KERNELPATCH == 'KPN' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Common Paths
          WORKSPACE="${GITHUB_WORKSPACE}"
          AK3DIR="${WORKSPACE}/AnyKernel3"

          echo ""
          echo "------------------------------"
          echo "🧩 KernelPatch Configuration"
          echo "------------------------------"
          echo "KernelPatch : ${{ inputs.KERNELPATCH }}"
          echo "Root Engine : ${{ inputs.ROOTENGINE }}"
          echo "------------------------------"
          echo ""

          # SukiSU KernelPatch-Module Mode
          if [[ "${{ inputs.KERNELPATCH }}" == "KPM" && "${{ inputs.ROOTENGINE }}" == "SukiSU-Ultra" ]]; then
            echo "🧩 Using SukiSU-Ultra KernelPatch-Module"
            PATCHDIRECTORY="${WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
            OUTDIRECTORY="${WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
            # Validate directories
            [[ -d "$PATCHDIRECTORY" ]] || {
              echo "⚠️ Patch Directory Not Found: $PATCHDIRECTORY"
              exit 1
            }
            [[ -d "$OUTDIRECTORY" ]] || {
              echo "⚠️ Output Directory Not Found: $OUTDIRECTORY"
              exit 1
            }

            # Locate patch tool
            PATCHTOOL="${PATCHDIRECTORY}/patch_linux"
            [[ -f "$PATCHTOOL" ]] || {
              echo "⚠️ Patch Tool Not Found"
              exit 1
            }
            chmod +x "$PATCHTOOL"

            # Locate image
            IMAGE="${OUTDIRECTORY}/Image"
            [[ -f "$IMAGE" ]] || {
              echo "⚠️ Kernel Image Not Found: $IMAGE"
              exit 1
            }

            echo "📌 Kernel Image Found: $IMAGE"
            cd "$OUTDIRECTORY"
            # Save Checksum
            echo "🔐 Creating Baseline Checksum..."
            sha256sum Image > Image.sha256
            # Apply KPM
            echo "🛠️ Applying KernelPatch..."
            "$PATCHTOOL"

            # Validate Patched Image
            [[ -f "oImage" ]] || {
              echo "⚠️ Patched Image (oImage) Not Found"
              exit 1
            }

            # Replace Image
            echo "📌 Replacing Original Image with Patched Version..."
            rm -f Image
            mv oImage Image

            # Verify Modification
            echo "🔍 Checking Image Integrity..."
            if sha256sum -c Image.sha256 >/dev/null 2>&1; then
              echo "⚠️ WARNING: Image Checksum Unchanged"
            else
              echo "📌 Image Modified by Patch"
            fi

            # Copy to AnyKernel3
            if [[ -d "$AK3DIR" ]]; then
              echo "📦 Updating AnyKernel3..."
              cp -f Image "$AK3DIR/Image"
            else
              echo "⚠️ AnyKernel3 Directory Not Found, skipping copy"
            fi

            echo ""
            echo "🎉 SukiSU KernelPatch-Module Applied Successfully"

          # KernelSU-Next KernelPatch-Next Module Mode
          elif [[ "${{ inputs.KERNELPATCH }}" == "KPN" ]]; then
            echo "🧩 Using KernelSU-Next KernelPatch-Next"
            KPREPO="KernelSU-Next/KPatch-Next"
            KPFALLBACK="https://raw.githubusercontent.com/AndreiMikh/AndreiMikh-Kernel-Lab/refs/heads/${GITHUB_REF_NAME}/patches"
            # Locate Kernel Image
            IMAGE="$(
              find "${WORKSPACE}/kernel_workspace" \
                -type f \
                -name Image \
                -print \
                -quit
            )"

            if [[ -z "${IMAGE:-}" ]]; then
              echo "⚠️ Kernel Image Not Found"
              exit 1
            fi

            OUTDIR="$(dirname "$IMAGE")"
            cd "$OUTDIR"
            [[ -f Image ]] || {
              echo "⚠️ Image File Missing"
              exit 1
            }

            echo "📌 Kernel Image"
            echo "   ${IMAGE}"
            ls -lh Image

            # Save Checksum
            echo "📝 Saving Original Checksum..."
            sha256sum Image > Image.sha256
            # Resolve Latest Release
            echo "🌐 Resolving Latest KernelPatch-Next Release Tag..."
            TAG="$(
              curl -fsSL \
                -H "User-Agent: Mozilla/5.0" \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 3 \
                "https://api.github.com/repos/${KPREPO}/releases/latest" \
              | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -n1 || true
            )"

            # Fallback to Release List
            if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
              echo "⚠️ Latest release lookup failed."
              echo "🔄 Falling Back to Releases List..."
              TAG="$(
                curl -fsSL \
                  -H "User-Agent: Mozilla/5.0" \
                  --retry 5 \
                  --retry-all-errors \
                  --retry-delay 3 \
                  "https://api.github.com/repos/${KPREPO}/releases" \
                | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' \
                | head -n1 || true
              )
            fi

            # Built-in Fallback
            if [[ -z "${TAG}" || "${TAG}" == "null" ]]; then
              echo "⚠️ Unable to Determine Latest Release"
              echo "📦 Using Built-in Fallback: 0.13.5-2"
              TAG="0.13.5-2"
            fi

            BASEKPNURL="https://github.com/${KPREPO}/releases/download/${TAG}"
            echo "📦 Release Information"
            echo "------------------------------"
            echo "Repository : ${KPREPO}"
            echo "Tag        : ${TAG}"
            echo "------------------------------"

            # Download Helper
            download() {
              local FILE="$1"
              local PRIMARY="${BASEKPNURL}/${FILE}"
              local FALLBACK="${KPFALLBACK}/${FILE}"
              echo "📥 Downloading ${FILE}"
              if ! curl -fsSL \
                -H "User-Agent: Mozilla/5.0" \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 3 \
                -o "${FILE}" \
                "${PRIMARY}"
              then
                echo "⚠️ Primary Download Failed"
                echo "🔄 Trying Fallback..."
                curl -fsSL \
                  -H "User-Agent: Mozilla/5.0" \
                  --retry 5 \
                  --retry-all-errors \
                  --retry-delay 3 \
                  -o "${FILE}" \
                  "${FALLBACK}"
              fi

              [[ -s "${FILE}" ]] || {
                echo "⚠️ ${FILE} Download Failed"
                exit 1
              }
              chmod +x "${FILE}"
              echo "📥 ${FILE} Ready..."
            }

            # Download Tools
            download kptools-linux
            download kpimg-linux

            # Apply KernelPatch-Next
            echo "⚙️ Applying KernelPatch-Next..."
            ./kptools-linux \
              -p \
              -i Image \
              -k kpimg-linux \
              -o oImage
            [[ -s oImage ]] || {
              echo "⚠️ Kernel Patch Failed"
              exit 1
            }

            # Replace Image
            mv -f oImage Image
            # Verify Modification
            echo "🔍 Verifying Patched Image..."
            if sha256sum -c Image.sha256 >/dev/null 2>&1; then
              echo "⚠️ Image Checksum is Unchanged"
              echo "⚠️ KernelPatch may Not have been Applied"
            else
              echo "🎉 Kernel Image Successfully Modified"
            fi

            # Validate AnyKernel3
            [[ -d "${AK3DIR}" ]] || {
              echo "⚠️ AnyKernel3 Directory Not Found"
              exit 1
            }

            # Copy Patched Image
            cp -f Image "${AK3DIR}/Image"
            echo "📦 Patched Image Copied to AnyKernel3"
          
            echo ""
            echo "🎉 KernelSU-Next KernelPatch-Next Patch Completed"
          fi               

      - name: 💾 Save Compiler Cache
        if: ${{ steps.buildprofile.outputs.buildccache != 'Disabled' && steps.manageccache.outputs.ccachesave == 'true' && steps.cache-restoration.outputs.cache-restored != 'true' }}
        timeout-minutes: 10
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: CCache-${{ runner.os }}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.extract-info.outputs.cpu }}-${{ github.ref_name }}
      
      - name: 🏷️ Release Status Requirement
        if: ${{ steps.buildprofile.outputs.gitrelease == 'Enabled' }}
        id: ksu-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Get Latest Release Tag
          LATESTTAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")

          echo "📦 Latest Release Tag: ${LATESTTAG:-None}"
          echo "🆕 Current KSU Version: ${KSUVERSION}"

          if [[ -z "$LATESTTAG" ]]; then
            echo "⚠️ No Previous Release Found → Proceeding"
            echo "shouldrelease=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare Versions (Equality Check)
          if [[ "$LATESTTAG" == *"${KSUVERSION}"* ]]; then
            echo "⏭️ Same KSU Version Detected → Skipping Release"
            echo "shouldrelease=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New KSU Version Detected → Releasing"
            echo "shouldrelease=true" >> $GITHUB_OUTPUT
          fi
            
      - name: 🤖 AI APK Workflow Resolver
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
      
          export GH_TOKEN="$GITHUB_TOKEN"
          export GITHUB_TOKEN="$GITHUB_TOKEN"
      
          echo "🚀 AI APK Resolver Started..."
      
          KSUREPOSITORY="${{ steps.manager.outputs.ksurepo }}"
          BRANCH="${{ steps.manager.outputs.managerbranch }}"      
          MANAGERAPKDIR="${GITHUB_WORKSPACE}/ManagerAPK-${{ inputs.ROOTENGINE }}-${{ steps.rootengine.outputs.ksuversion }}"
          mkdir -p "$MANAGERAPKDIR"
          
          echo ""
          echo "------------------------------"
          echo "ℹ️ [Info] Repository       : $KSUREPOSITORY"
          echo "ℹ️ [Info] Branch           : $BRANCH"
          echo "ℹ️ [Info] Output Directory : $MANAGERAPKDIR"
          echo "------------------------------"
          echo ""
      
          echo "🔎 [Check] Fetching Latest Successful Workflow Runs..."
      
          # Safe Array of Runs
          mapfile -t runs < <(
            gh api \
              "repos/$KSUREPOSITORY/actions/runs?branch=$BRANCH&status=success&per_page=50" \
              --jq '.workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[].id'
          )
      
          if [[ ${#runs[@]} -eq 0 ]]; then
            echo "⚠️ [Error] No Successful Runs Found"
            exit 0
          fi
      
          echo "ℹ️ [Info] Found ${#runs[@]} Workflow Runs..."
          echo "🔍 [Check] Scanning Runs for APK Artifacts..."      
          selectedrun=""
          bestscore=0      
          for runid in "${runs[@]}"; do
            echo "------------------------------"
            echo "🔍 [Check] Run ID: $runid"      
            artifactnames=$(gh api \
              "repos/$KSUREPOSITORY/actions/runs/$runid/artifacts" \
              --jq '.artifacts[].name' 2>/dev/null || true)      
            if [[ -z "$artifactnames" ]] || ! echo "$artifactnames" | grep -qiE 'apk|manager|release|build'; then
              echo "⚠️ [Skip] No Relevant Artifacts"
              continue
            fi
      
            score=0
      
            # AI Scoring Engine
            if echo "$artifactnames" | grep -Eqi '\.apk($|[^a-zA-Z])'; then
              score=$((score + 50))
            fi
      
            if echo "$artifactnames" | grep -qi "manager"; then
              score=$((score + 20))
            fi
      
            if echo "$artifactnames" | grep -qi "release\|build"; then
              score=$((score + 10))
            fi
      
            echo "📊 [Info] Score for Run $runid = $score"      
            if [[ "$score" -gt "$bestscore" ]]; then
              bestscore="$score"
              selectedrun="$runid"
              echo "🏆 [New Best] Selected Run Updated → $runid"
            fi
          done
      
          if [[ -z "$selectedrun" ]]; then
            echo "⚠️ [Error] No Valid APK Workflow Found"
            exit 0
          fi

          echo ""
          echo "------------------------------"
          echo "🏁 [Result] Selected Run: $selectedrun"
          echo "🏁 [Result] Best Score  : $bestscore"
          echo "------------------------------"
          echo ""

          echo "🔍 [Verify] Checking Artifacts Inside Selected Run Before Download..."
          gh api repos/$KSUREPOSITORY/actions/runs/$selectedrun/artifacts \
            --jq '.artifacts[].name' || true
          
          echo "------------------------------"
      
          echo "📩 [Step 3] Fetching Only Manager APK Artifacts..."
          set +e    # Disable Strict Mode          
          artifacturls=$(gh api \
            "repos/$KSUREPOSITORY/actions/runs/$selectedrun/artifacts" \
            --jq '.artifacts[]
              | select(.name | test("manager"; "i"))
              | .archive_download_url' 2>/dev/null || true)
          
          echo "------------------------------"
          echo "🔍 Manager Artifact URLs:"
          echo "$artifacturls"
          echo "------------------------------"
          
          artifactcount=$(echo "$artifacturls" | grep -c "api.github.com" || true)          
          echo "📦 Manager Artifact Count: $artifactcount"          
          if [[ "$artifactcount" -eq 0 ]]; then
            echo "⚠️ No Manager APK Artifacts Found"
            exit 0
          fi
          
          i=0
          
          # Loop Safely (No Pipefail Breakage)
          while read -r url; do
            [[ -z "$url" ]] && continue          
            ((i++))
            echo "⬇️ Downloading Artifact #$i"          
            zipfile="$MANAGERAPKDIR/artifact_$i.zip"
          
            # Curl (Never Fail Pipeline)
            curl -L \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              --fail \
              --silent \
              --show-error \
              -o "$zipfile" \
              "$url" || {
                echo "⚠️ Download Failed, Skipping..."
                rm -f "$zipfile"
                continue
              }
          
            # Verify Zip
            unzip -t "$zipfile" >/dev/null 2>&1 || {
              echo "⚠️ Corrupted Artifact, Skipping..."
              rm -f "$zipfile"
              continue
            }
          
            unzip -o "$zipfile" -d "$MANAGERAPKDIR" >/dev/null 2>&1 || true
            rm -f "$zipfile"        
          done <<< "$artifacturls"
          set -e    # Re-Enable Strict Mode      
          echo "🧹 [Step 4] Cleaning Non-APK Files..."          
          find "$MANAGERAPKDIR" -type f ! -name "*.apk" -delete || true    

          # Apply Strict ARM64-V8A Filter if the Repository is ReSukiSU/ReSukiSU
          if [[ "$KSUREPOSITORY" == "ReSukiSU/ReSukiSU" ]]; then
            echo "ℹ️ [Info] ReSukiSU Repository Detected. Filtering for Standard ARM64-V88 Release APK..."
            find "$MANAGERAPKDIR" -type f -name "*.apk" ! -name "*arm64-v8a-release.apk" -delete || true
            find "$MANAGERAPKDIR" -type f -name "*spoofed*.apk" -delete || true
          fi
          
          echo "🔍 [Step 5] Verifying Output..."         
          APKCOUNT=$(find "$MANAGERAPKDIR" -type f -name "*.apk" | wc -l || true)          
          echo "📦 APK Count: $APKCOUNT"
          
          if [[ "$APKCOUNT" -gt 0 ]]; then
            echo "------------------------------"
            echo "📦 [Success] APKs Found: $APKCOUNT"
            ls -lh "$MANAGERAPKDIR"
            echo "------------------------------"
          else
            echo "⚠️ [Warning] No APK Files Found (Manager Build Likely Missing)"
          fi

          echo ""
          echo "🎉 AI APK Resolver Completed Successfully"

      - name: 📦 Validate and Collect Manager APK
        id: root-engine-apk
        shell: bash
        run: |
          set -Eeuo pipefail

          # Define APK Source and Flattened Output Directories
          echo "🔍 Checking Manager APK Directory..."
          APKSOURCE="ManagerAPK-ReSukiSU-35172"
          FLATDIR="FlatAPK"

          # Count Available Manager APKs
          APKCOUNT="$(find "$APKSOURCE" -type f -name "*.apk" 2>/dev/null | wc -l || true)"
          APKCOUNT="${APKCOUNT//[[:space:]]/}"

          echo "------------------------------"
          echo "📦 APK Count: $APKCOUNT"
          echo "------------------------------"

          if [[ "$APKCOUNT" -gt 0 ]]; then
            APKMANAGER="true"

            echo "📦 Manager APK Found"
            echo "📌 APK Manager : $APKMANAGER"
            echo "📌 APK Count   : $APKCOUNT"

            # Export to subsequent GitHub Actions Steps
            {
              echo "APKMANAGER=$APKMANAGER"
              echo "APKCOUNT=$APKCOUNT"
            } >> "$GITHUB_ENV"

            # Export APK Status and Count as Step Outputs
            {
              echo "apkmanager=$APKMANAGER"
              echo "apkcount=$APKCOUNT"
            } >> "$GITHUB_OUTPUT"

            # Flatten APKs into a Single Directory for Artifact Upload
            echo "📦 Flattening APKs..."
            mkdir -p "$FLATDIR"
            find "$APKSOURCE" \
              -type f \
              -name "*.apk" \
              -exec cp -f {} "$FLATDIR/" \;
            # Count Flattened APKs for Verification
            FLATCOUNT="$(find "$FLATDIR" -type f -name "*.apk" | wc -l || true)"
            FLATCOUNT="${FLATCOUNT//[[:space:]]/}"

            echo "------------------------------"
            echo "📦 Flat APK Count: $FLATCOUNT"
            echo "------------------------------"

            # Verify All APKs Were Successfully Flattened
            if [[ "$FLATCOUNT" -ne "$APKCOUNT" ]]; then
              echo "⚠️ APK Flattening Verification Failed"
              echo "📌 Expected: $APKCOUNT"
              echo "📌 Found   : $FLATCOUNT"
              exit 1
            fi

            echo "✔️ APK Ready for Upload"
          else
            # No Manager APKs Found
            APKMANAGER="false"
            APKCOUNT="0"

            # Export Empty APK Status and Count to Subsequent Steps
            {
              echo "APKMANAGER=$APKMANAGER"
              echo "APKCOUNT=$APKCOUNT"
            } >> "$GITHUB_ENV"

            # Export Empty APK Status and Count as Step Outputs
            {
              echo "apkmanager=$APKMANAGER"
              echo "apkcount=$APKCOUNT"
            } >> "$GITHUB_OUTPUT"

            echo "⚠️ No APK Found"
          fi

      - name: 📤 Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v7
        with:
          # Build Kernel Artifact Name
          name: "${{ steps.kernel-version-setup.outputs.fullversion }}-${{ env.KSUVERSION }}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.suffix.outputs.suffix }}"      
          # Upload Flashable Kernel Files
          path: ./AnyKernel3/*      
          # Retain Artifact for 30 Days
          retention-days: 30
          
      - name: 📤 Upload Manager APK
        if: ${{ steps.root-engine-apk.outputs.apkmanager == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          # Build Manager Artifact
          name: ManagerAPK-${{ inputs.ROOTENGINE }}-${{ steps.rootengine.outputs.ksuversion }}
          # Upload Manager APK Files
          path: FlatAPK/*.apk
          # Warn When No APK is Found        
          if-no-files-found: warn

      - name: 📤 Upload NoMount Userspace
        if: ${{ inputs.NOMOUNT != 'None' }}
        uses: actions/upload-artifact@v4
        with:
          # Build NoMount Userspace Artifact
          name: NoMount-Userspace-${{ steps.extract-info.outputs.manifestbasefile }}-${{ inputs.ROOTENGINE }}-${{ steps.rootengine.outputs.ksuversion }}
          # Upload NoMount Userspace Files
          path: ${{ github.workspace }}/kernel_workspace/nomount-userspace/
          # Warn When No ZIP is Found
          if-no-files-found: warn

      - name: 📤 Upload CCache Tarball
        if: ${{ steps.buildprofile.outputs.builccache != 'Disabled' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAR: ${{ steps.manageccache.outputs.tar }}
          TAG: ${{ steps.extract-info.outputs.cpu }}
        run: |
          set -Eeuo pipefail

          # Validate CCache Tarball
          echo "📦 CCache Tarball:"
          echo "   $TAR"

          if [[ ! -f "$TAR" ]]; then
            echo "⚠️ CCache Tarball Not Found:"
            echo "   $TAR"
            exit 1
          fi

          # Display Tarball Information
          echo "✔️ Tarball Found:"
          ls -lh "$TAR"

          # Upload Tarball to Existing GitHub Release
          echo ""
          echo "🚀 Uploading CCache tarball to release: $TAG"
          gh release upload \
            "$TAG" \
            "$TAR" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          # Confirm Successful Upload
          echo ""
          echo "🎉 CCache tarball uploaded successfully."
      
      - name: 📦 Create ZIP Package
        if: ${{ steps.buildprofile.outputs.gitrelease == 'Enabled' }}
        run: |
          set -e
      
          echo "---- 📋 Build Information ----"
          echo "🧠 Kernel Packaging Stage"
          echo "Base       : ${{ steps.extract-info.outputs.manifestbasefile }}"
          echo "Kernel     : ${{ steps.kernel-version-setup.outputs.fullversion }}"
          echo "Root       : ${KSUVERSION}"
          echo "------------------------------"
          echo ""
      
          # 📦 AnyKernel3 (Required)
          ANYKERNEL3ZIP="${{ steps.kernel-version-setup.outputs.fullversion }}-${KSUVERSION}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.suffix.outputs.suffix }}.zip"    
          if [ -d "AnyKernel3" ] && [ "$(ls -A AnyKernel3 2>/dev/null)" ]; then
            echo "📦 Creating AnyKernel3 Zip..."       
            ANYKERNEL3ZIP="${{ steps.kernel-version-setup.outputs.fullversion }}-${KSUVERSION}-${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.suffix.outputs.suffix }}.zip"     
            cd AnyKernel3
            zip -r "../$ANYKERNEL3ZIP" .
            cd ..     
            echo "ANYKERNEL3ZIP=$ANYKERNEL3ZIP" >> $GITHUB_ENV
          else
            echo "⚠️ AnyKernel3 Missing — Build Cannot Continue"
            exit 1
          fi

      - name: 📤 Upload Artifacts to Git Release
        if: ${{ steps.ksu-check.outputs.shouldrelease == 'true' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          # Release Tag
          tag_name: ${{ steps.extract-info.outputs.manifestbasefile }}

          # Release Name
          name: ${{ steps.extract-info.outputs.manifestbasefile }}-${{ steps.kernel-version-setup.outputs.fullversion }}-${{ steps.suffix.outputs.suffix }}
          body: |
            ### 📋 **INSTALLATION GUIDE**:
         
            ### 📩 **DOWNLOAD THE KERNEL ZIP FILE**:            
            ---            
            - Navigate to the Release Page & Download & Correct Kernel Zip File for Your Device & Kernel Version
            - Ensure that You Select the File that Matches Your Device's Model & the Kernel Version You're Installing
            ### 📲 **PREPARE YOUR DEVICE**:            
            ---            
            - Make Sure Your Device has an **Unlocked Bootloader** & a Compatible Custom Recovery (TWRP/OrangeFox/Etc)
            - It's Recommended to **Backup Your Data** Before Proceeding with the Installation to Avoid Any Loss
            ### 📤 **INSTALL THROUGH RECOVERY TOOL**:            
            ---            
            - Reboot Your Device Into **Recovery Mode** (TWRP/OrangeFox/Etc)
            - In the Recovery Menu, Select **Install** & Navigate to the Downloaded Kernel Zip File
            - Select the Kernel Zip File & Swipe to Confirm Installation
            - After the Installation Completes, Reboot Your Device Into the System
            ### 📥 **INSTALLATION VIA KERNELFLASHER APP**:            
            ---            
            - **Download KernelFlasher**: Get the **KernelFlasher** App from [KernelFlasher GitHub](https://github.com/fatalcoder524/KernelFlasher)
            - **Launch KernelFlasher**: Open the App & Make Sure Your **Device is Rooted**
            - **Select Kernel**: Choose the Downloaded **Kernel Zip File** Within the App
            - **Flash the Kernel**: Follow the Prompts to Flash the Kernel Directly Onto your Device
            - **Reboot**: After Flashing, the App will Prompt to Reboot the Device Into the System
            ### 📥 **INSTALLATION VIA HORIZON FLASHER APP**:            
            ---            
            - **Download Horizon Flasher**: Download the **Horizon Flasher App** from [HorizonKernelFlasher GitHub](https://github.com/libxzr/HorizonKernelFlasher/releases) 
            - **Install the App**: Once the App is Installed, Launch & Select the **Downloaded Kernel Zip File**
            - **Flash**: App will Automatically Flash the Kernel for You... It may Take Some Time, Depending on the Size of the Kernel File
            - **Reboot the System**: After Flashing, App will Prompt You to Reboot... Follow the On-Screen Instructions to Reboot Into the System   
            ### 🛠️ **TROUBLESHOOTING**:            
            ---            
            - If You Encounter Any Issues with the Installation or Booting, Here are some Common Fixes:
            - **Bootloops**: If Your Device is Stuck in a Bootloop After Installation, Try Clearing the Cache & Dalvik Cache from the Recovery Menu
            - **Kernel Panic**: This may Occur if Your Device is Incompatible with the Kernel, Try Reverting to a Different Kernel Version or Check for Device-Specific Patches
            - **Stuck on Recovery**: If You Can’t Boot Into the System After Installation, Reflash the Recovery & Reattempt the Installation        
            ### 🧩 **TIPS**:            
            ---            
            - **Root Access**: If You Need Root Access, Ensure that the Corresponding Root Manager (`ReSukiSU`, Etc) is Installed After Flashing the Kernel, Follow the Specific Instructions Provided by the Root Manager's Documentation          
            ### 🔧 **COMMON ISSUES & FIXES**:            
            ---            
            - **Issue - Kernel Does Not Boot**:
            - Fix: Make Sure You are Using a Kernel Compatible with Your Device, Review the Device-Specific Kernel Settings or Check if There are Any Custom Patches Required for Your Device Model  
            ### 📊 **AFTER INSTALLATION**:            
            ---            
            - Once Installed, You Can Verify the Kernel Version & Root Access by Using a Kernel Checker App or a Root Checker App from the Play Store
            - Enjoy the New Kernel Features & Enhancements Designed to Improve Your Device's Performance       
            
          files: |
            ${ANYKERNEL3ZIP}
            FlatAPK/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Post Build Disk Usage Check
        run: |
          echo ""
          echo "📊 Post-build Disk Usage Report..."
          df -h
    
      - name: 📋 Kernel Build Details
        run: |
          {
            echo "### 📊 Post Kernel Build Details"
            echo ""

            # Helper for Boolean Display(s)
            bool() { [[ "$1" == "true" ]] && echo "✔ Yes" || echo "✘ No"; }

            # Core Information
            echo "#### 🧩 Core Information"
            echo ""
            echo "| Category                      | Reported Value                                           |"
            echo "|-------------------------------|----------------------------------------------------------|"
            echo "| 🌏 ROM Base Variant           | \`${ROMBASE:-Unknown}\`                                  |"
            echo "| 🔐 Root / KSU Manager Variant | \`${{ inputs.ROOTENGINE }}\`                             |"
            echo "| 📱 Device Model               | \`${{ steps.extract-info.outputs.manifestbasefile }}\`   |"
            echo "| 🔧 Kernel Version             | \`${ANDROIDVERSION}-${FULLVERSION}\`                     |"
            echo "| 🏷️ Kernel Suffix              | \`${{ inputs.SUFFIX || 'Auto' }}\`                       |"
            echo "| 🕒 Kernel Build Time          | \`${{ inputs.BUILDTIME || 'Auto' }}\`                    |"
            echo ""

            # Build Configuration
            echo "#### ⚙️ Build Configuration"
            echo ""
            echo "| Feature                          | Reported Value                                      |"
            echo "|----------------------------------|-----------------------------------------------------|"
            echo "| 📦 Manifest                      | \`${{ inputs.FILE }}\`                              |"
            echo "| 🧬 SUSFS Variant                 | \`${{ inputs.SUSFSVARIANT }}\`                      |"
            echo "| 🧪 SUSFS Development Branch      | $(bool "${{ inputs.SUSFSBRANCHDEV }}")              |"
            echo "| 🩹 Kernel Patch Variant          | \`${{ inputs.KERNELPATCH }}\`                       |"
            echo "| 💾 Compiler Cache                | \`${{ steps.buildprofile.outputs.builccache }}\`    |"
            echo ""

            # System Features
            echo "#### 🧠 System Features"
            echo ""
            echo "| Feature                                          | Reported Value                                  |"
            echo "|--------------------------------------------------|-------------------------------------------------|"
            echo "| 🔰 LSM (Linux Security Module) Baseband Guard    | $(bool "${{ inputs.LSMBBG }}")                  |"
            echo "| 📡 Netfilter IP Set; IP v6 NAT Fix               | $(bool "${{ inputs.NETFILTER }}")               |"
            echo "| 🛜 TCP Congestion Control Algorithm              | \`${{ inputs.TCPALGORITHM }}\`                  |"
            echo "| 🧩 LXC (Linux Containers) Docker Support Variant | \`${{ inputs.LXCDOCKERSUPPORT }}\`              |"
            echo "| 🌀 CPU / I/O Scheduler                           | \`${{ inputs.SCHEDULERS }}\`                    |"
            echo ""

            # Memory and Performance
            echo "#### 🧮 Memory and Performance"
            echo ""
            echo "| Feature                                                                    | Reported Value                                 |"
            echo "|----------------------------------------------------------------------------|------------------------------------------------|"

            # Compression / Decompression Algorithm Formatting Output
            echo "| ⚙️ LZ4 1.10.0                                                             | \`${{ inputs.LZ4NEON }}\`                       |"
            echo "| 🌪️ Hmbird / Windspeed Patch Scheduler                                     | $(bool "${{ inputs.WINDSPEED }}")               |"
            echo ""

            # Miscellaneous
            echo "#### 🧾 Miscellaneous"
            echo ""
            echo "| Feature                                         | Reported Value                                   |"
            echo "|-------------------------------------------------|-----------------------------------------------   |"
            echo "| 🔤 Unicode Bypass Patch                         | $(bool "${{ inputs.UNICODE }}")                  |"
            echo "| 🧹 Disk Space Clean                             | \`${{ steps.buildprofile.outputs.cleanspace }}\` |"
            echo "| 📂 XUS Patch                                    | \`${{ steps.buildprofile.outputs.xus }}\`        |"
            echo "| 🔁 Re-Kernel (Use with Freezer, NoActive, Etc.) | $(bool "${{ inputs.REKERNEL }}")                 |"
            echo "| 🔤 NTSync Patch                                 | $(bool "${{ inputs.NTSYNC }}")                   |"
            echo "| 🔤 Built-in NoMount                             | $(bool "${{ inputs.NOMOUNT }}")                  |"
            echo "| 🆔 Workflow Run ID                              | \`${GITHUB_RUN_ID}\`                             |"
          } >> $GITHUB_STEP_SUMMARY
