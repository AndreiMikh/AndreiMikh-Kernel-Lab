              https://github.com/Sakion-Team/Re-Kernel.git \
              "$RKREPODIR"
            echo "✔️ Re-Kernel Cloned"
          else
            echo "⚠️ Re-Kernel Repository Already Exists"
          fi

          # Resolve Source Directory
          if [[ -d "$RKREPODIR/LKM-Source" ]]; then
