            echo "⚠️ Kernel Configuration Not Found: $KCONFIGFILE"
            exit 1
          }

          [[ -f "$MAKEFILE" ]] || {
            echo "⚠️ Makefile Not Found: $MAKEFILE"
            exit 1
          }

          # Clone Re-Kernel if Needed
          if [[ ! -d "$RKREPODIR/.git" ]]; then
