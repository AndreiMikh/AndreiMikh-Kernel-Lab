          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          PFILE="${PDIR}/HMBIRD.patch"

          echo "------------------------------"
          echo "🚀 Scheduler Conversion Stage"
          echo "📂 Kernel Version: ${KERNELVERSION}"
          echo "------------------------------"
          echo ""

          # Move Into Kernel Source Directory
          cd "$KCDIR"

          # Detect Already-Converted Scheduler
          if [[ -d "kernel/sched/hmbird" ]] || \
             [[ -d "vendor/oplus/kernel/cpu/sched_ext/hmbird" ]]; then
            echo "🔎 Hmbird Scheduler Already Present"
            echo "⏭️ Skipping Conversion Stage"
            exit 0
          fi

          # Validate Makefile
          if [[ ! -f "drivers/Makefile" ]]; then
            echo "⚠️ Drivers Makefile Not Found"
            exit 1
          fi

          echo "🔍 Checking Hmbird Conversion Patch..."

          patchstatus=0
          # Check Whether Patch Can Be Applied
          if patch -p1 --dry-run -F3 < "$PFILE" >/dev/null 2>&1; then
            echo "✔️ Hmbird Patch is Applicable"
            # Add Hmbird Build Rule
            if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
              echo "✔️ Hmbird Build Rule Already Present"
            else
              echo "🛠️ Injecting Hmbird Build Rule"
              sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
            fi

            echo "🚀 Applying Scheduler Conversion Patch..."
            patch -p1 -F3 < "$PFILE" || patchstatus=$?
            if [[ "$patchstatus" -eq 0 ]]; then
              echo "✔️ Scheduler Conversion Applied Successfully"
            else
              echo "⚠️ Scheduler Conversion Patch Failed"
            fi

          # Check Whether Patch Is Already Applied
          elif patch -p1 -R --dry-run -F3 < "$PFILE" >/dev/null 2>&1; then
            echo "✔️ Hmbird Conversion Patch is Already Applied"
            echo "⏭️ Skipping Conversion"
            # Restore Hmbird Build Rule if Missing
            if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
              echo "✔️ Hmbird Build Rule Already Present"
