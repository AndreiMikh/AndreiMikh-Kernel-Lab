name: SM-8750 Bot

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Select Workflow to Trigger"
        required: true
        default: Main V8.yml
        options:
          - Main V8
          - Test V8
      KPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
      SUSFS_REPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
      GITHUB_REPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
      ROOT_ENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: "ReSukiSU"
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Main-Spoofed
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Stable
         - KernelSU-Next-Stable-Spoofed
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
      SUSFS_VERSION:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      ZRAM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0
          - 1/lz4kd/8589934592
      ZRAM_CUSTOM:
        type: boolean
        description: "Enable LZ4 1.10.0 / ZSTD 1.5.7 if ZRAM is Off"
        required: false
        default: false
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix"
        required: false
        default: "8-andreimikhail-4k"
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
      LSM:
        type: boolean
        description: "Enable Linux Security Module?"
        required: true
        default: true
      LXCDOCKER:
        type: boolean
        description: "Enable Linux Container / Docker?"
        required: true
        default: false
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
      BBR:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: "True"
        options:
          - "True"
          - "False"
          - "Brutal"
      UNICODE:
        type: boolean
        description: "Add Unicode Fix?"
        required: true
        default: true
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi"
        required: true
        default: true
      ADIOS:
        type: boolean
        description: "Apply ADIOS I/O Scheduler"
        required: true
        default: false
      XUS:
        type: boolean
        description: "Prevent XUS Error Files"
        required: true
        default: true
      SUSFS_DEV:
        type: boolean
        description: "Apply SUSFS Meta Dev Branch"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning?"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update?"
        required: true
        default: false

permissions:
  actions: write
  contents: read

jobs:
  # =========================
  # Generate Device Matrix
  # =========================
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate device list
        id: set-matrix
        run: |
          DEVICES="oneplus_13_b oneplus_13s_b oneplus_13t_b oneplus_ace5_pro_b oneplus_ace_6 oneplus_pad_2_pro_b oneplus_pad_3_b"
          MATRIX_JSON=$(printf '%s\n' $DEVICES | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              file_short: (sub("_[a-z]$"; "")),
              enable_sched: true
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # =========================
  # Trigger Workflow per Device
  # =========================
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    outputs:
      run_ids: ${{ steps.set_run_ids.outputs.run_ids }}
    steps:
      - name: Trigger workflow
        id: trigger
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: refs/heads/LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.file }}",
              "KPATCH": "${{ github.event.inputs.KPATCH }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_REPOSITORY": "${{ github.event.inputs.SUSFS_REPOSITORY }}",
              "GITHUB_REPOSITORY": "${{ github.event.inputs.GITHUB_REPOSITORY }}",
              "ROOT_ENGINE": "${{ github.event.inputs.ROOT_ENGINE }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM_CUSTOM": "${{ github.event.inputs.ZRAM_CUSTOM }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR": "${{ github.event.inputs.BBR }}",
              "LXCDOCKER": "${{ github.event.inputs.LXCDOCKER }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "WINDSPEED": "${{ github.event.inputs.WINDSPEED }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS": "${{ github.event.inputs.XUS }}"
            }

      - name: Save Run ID for this device
        run: echo "TRIGGERED_RUN_ID_${{ matrix.file }}=${{ steps.trigger.outputs.run_id }}" >> $GITHUB_ENV

  # =========================
  # Artifacts Fetch
  # =========================
  fetch-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [oneplus_13_b, oneplus_13s_b, oneplus_13t_b, oneplus_ace5_pro_b, oneplus_ace_6, oneplus_pad_2_pro_b, oneplus_pad_3_b]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Tools
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Prepare Device Folder
        run: mkdir -p "artifacts/${{ matrix.device }}"

      - name: Wait and Download Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEVICE="${{ matrix.device }}"
          DEVICE_FOLDER="artifacts/$DEVICE"
          RUN_ID_VAR="TRIGGERED_RUN_ID_$DEVICE"
          RUN_ID="${!RUN_ID_VAR}"

          MAX_WAIT=$((60*60))
          INTERVAL=30
          ELAPSED=0

          echo "⚙️ Waiting for Artifacts for $DEVICE in run $RUN_ID..."

          while (( ELAPSED < MAX_WAIT )); do
            MATCHED_IDS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts \
              --jq ".artifacts[] | select(.name | test(\"$DEVICE\")) | .id")

            if [[ -n "$MATCHED_IDS" ]]; then
              for ID in $MATCHED_IDS; do
                NAME=$(gh api repos/${{ github.repository }}/actions/artifacts/$ID --jq '.name')
                SAFE_NAME=$(echo "$NAME" | tr ' ' '_' | tr -cd '[:alnum:]_-')
                echo "📩 Downloading $NAME → $DEVICE_FOLDER/${SAFE_NAME}.zip"
                curl -L \
                  -H "Authorization: token $GH_TOKEN" \
                  -o "$DEVICE_FOLDER/${SAFE_NAME}.zip" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ID}/zip"
              done
              echo "🎉 Artifacts downloaded for $DEVICE"
              break
            fi

            echo "⏳ Artifacts not ready yet for $DEVICE. Sleeping $INTERVAL sec..."
            sleep $INTERVAL
            ((ELAPSED+=INTERVAL))
          done

          if (( ELAPSED >= MAX_WAIT )); then
            echo "🚩 Timeout waiting for $DEVICE artifacts!"
            exit 1
          fi

      - name: Upload Device Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.device }}-artifacts"
          path: "artifacts/${{ matrix.device }}/*"
