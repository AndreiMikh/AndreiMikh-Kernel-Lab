name: Kernel Build & Artifact Bot

on:
  workflow_dispatch:
    inputs:
      BATCH:
        type: choice
        description: "Select Batch (1-4) #3 Custom SM-8750, #4 SM-8750"
        required: true
        default: "4"
        options:
          - 3
          - 4
      TARGET_WORKFLOW:
        type: choice
        description: "Select Workflow to Trigger per Device"
        required: true
        default: Main.yml
        options:
          - Main
          - Test
      KPM:
        type: choice
        description: "Kernel Patch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
      SUSFS_META:
        type: string
        description: "Rollback SUSFS (Hash, Number, or -1 to disable)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "Dynamic Repo Owner"
        required: true
        default: "AndreiMikh"
      BUILD_TIME:
        type: string
        description: "Custom Build Time ('F' for current UTC)"
        required: false
        default: "F"
      KSU_META:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
          - ReSukiSU
          - SukiSU-Ultra
          - KernelSU-Next
          - WildKSU
          - KernelSU
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
          - ReSukiSU-Main
          - ReSukiSU-Main-Spoofed
      SUSFS_VERSION:
        type: choice
        description: "SUSFS Version"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      ZRAM:
        type: string
        description: "ZRAM (0 off, 1 on) / algorithm / size"
        required: true
        default: "0"
      ZRAM_LZ4:
        type: boolean
        description: "Enable LZ4/ZSTD if ZRAM LZ4KD is off"
        required: false
        default: false
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix"
        required: false
        default: "8-andreimikhail-4k"
      SUBLEVEL:
        type: string
        description: "Custom Kernel Level Spoofing"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build"
        required: true
        default: true
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions"
        required: true
        default: true
      BBR_ECN:
        type: boolean
        description: "Enable BBR+ECN Network Optimization"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "Apply HMBIRD Scheduler"
        required: true
        default: true
      ADIOS:
        type: boolean
        description: "Apply ADIOS I/O Scheduler"
        required: true
        default: false
      XUS_FIX:
        type: boolean
        description: "Prevent XUS Error Files"
        required: true
        default: true
      SUSFS_DEV:
        type: boolean
        description: "Apply SUSFS-Dev Branch"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update"
        required: true
        default: false

permissions:
  actions: write
  contents: read

jobs:

  # -------------------------
  # Generate Device Matrix
  # -------------------------
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Device Matrix
        id: set-matrix
        run: |
          BATCH="${{ github.event.inputs.BATCH }}"
          case "$BATCH" in
            1) FILE_LIST=("oneplus_nord_ce4_v" "oneplus_nord_4_v" "oneplus_ace_3v_v" "oneplus_10_pro_v" "oneplus_10t_v" "oneplus_11r_v" "oneplus_ace2_v" "oneplus_ace_pro_v") ;;
            2) FILE_LIST=("oneplus_11_v" "oneplus_12r_v" "oneplus_ace2_pro_v" "oneplus_ace3_v" "oneplus_open_v" "oneplus_12_v" "oneplus_13r" "oneplus_ace3_pro_v" "oneplus_ace5") ;;
            3) FILE_LIST=("oneplus_13_custom" "oneplus_13s_custom" "oneplus_13t_custom") ;;
            4) FILE_LIST=("oneplus_13_b" "oneplus_13s_b" "oneplus_13t_b" "oneplus_pad_2_pro_b" "oneplus_pad_3_b" "oneplus_ace_6" "oneplus_ace5_pro_b") ;;
            *) echo "Invalid batch: $BATCH"; exit 1 ;;
          esac

          MATRIX_JSON=$(printf '%s\n' "${FILE_LIST[@]}" | jq -R -s -c '
            split("\n")[:-1] | map({
              file: .,
              file_short: (sub("_[a-z]$|_v$"; "")),
              enable_sched: (. == "oneplus_pad_2_pro" or . == "oneplus_13" or . == "oneplus_13_global" or . == "oneplus_13t" or . == "oneplus_13s" or . == "oneplus_ace5_ultra" or . == "oneplus_ace5_pro")
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # -------------------------
  # Trigger Builds Per Device
  # -------------------------
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Trigger Device Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.file }}",
              "KPM": "${{ github.event.inputs.KPM }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_META": "${{ github.event.inputs.SUSFS_META }}",
              "DYNAMIC_REPO": "${{ github.event.inputs.DYNAMIC_REPO }}",
              "KSU_META": "${{ github.event.inputs.KSU_META }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM-LZ4": "${{ github.event.inputs.ZRAM_LZ4 }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR_ECN": "${{ github.event.inputs.BBR_ECN }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "SCHED": "${{ matrix.enable_sched }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS_FIX": "${{ github.event.inputs.XUS_FIX }}"
            }

  # -------------------------
  # Fetch, Download, and Package Artifacts
  # -------------------------
  fetch-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup CLI Tools
        run: |
          sudo apt update && sudo apt install -y gh jq curl unzip zip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Prepare Device Folder
        run: mkdir -p "artifacts/${{ matrix.device.file_short }}"

      - name: Wait & Download Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEVICE="${{ matrix.device.file_short }}"
          FOLDER="artifacts/$DEVICE"
          MAX_WAIT=$((60*60))
          SECONDS=0
          INTERVAL=60

          while (( SECONDS < MAX_WAIT )); do
            ALL_ARTIFACTS=$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | {name,id}')
            MATCHED_IDS=$(echo "$ALL_ARTIFACTS" | jq -r "select(.name | contains(\"$DEVICE\")) | .id")
            if [[ -n "$MATCHED_IDS" ]]; then
              for ART_ID in $MATCHED_IDS; do
                NAME=$(echo "$ALL_ARTIFACTS" | jq -r ".[] | select(.id==$ART_ID) | .name" | tr ' ' '_' | tr -cd '[:alnum:]_-')
                echo "Downloading $NAME..."
                curl -L -H "Authorization: token $GH_TOKEN" -o "$FOLDER/${NAME}.zip" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip"
              done
              break
            fi
            echo "Artifacts not ready for $DEVICE, waiting $INTERVAL sec..."
            sleep $INTERVAL
            ((SECONDS+=INTERVAL))
          done

      - name: Upload Individual Device Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.device.file_short }}-artifacts"
          path: "artifacts/${{ matrix.device.file_short }}/*"

      - name: Package Batch Artifacts
        if: ${{ matrix.device == fromJson(needs.generate-matrix.outputs.matrix)[-1] }}
        run: |
          cd artifacts
          zip -r ../Batch-${{ github.event.inputs.BATCH }}-All-Kernels.zip ./*

      - name: Upload Combined Batch Artifact
        if: ${{ matrix.device == fromJson(needs.generate-matrix.outputs.matrix)[-1] }}
        uses: actions/upload-artifact@v4
        with:
          name: "Batch-${{ github.event.inputs.BATCH }}-All-Kernels"
          path: "Batch-${{ github.event.inputs.BATCH }}-All-Kernels.zip"
