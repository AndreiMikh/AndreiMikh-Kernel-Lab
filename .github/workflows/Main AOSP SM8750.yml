      - name: 🔧 Apply DroidSpaces / NTSync / EVDI Kernel Integration
        shell: bash
        run: |
          echo "🔧 Applying DroidSpaces Kernel Integration..."
          cd "$SOURCEDIR"

          EVDIKCONFIG="$SOURCEDIR/drivers/gpu/drm/Kconfig"
          EVDIMAKEFILE="$SOURCEDIR/drivers/gpu/drm/Makefile"
          MISCKCONFIG="$SOURCEDIR/drivers/misc/Kconfig"
          MISCMAKEFILE="$SOURCEDIR/drivers/misc/Makefile"
          SCHEDFILE="$SOURCEDIR/include/linux/sched.h"
          PIDFILE="$SOURCEDIR/kernel/pid.c"
          EXTRA="${GITHUB_WORKSPACE}/extra-files/patches/extra"

          echo "📥 Cloning Extra Files..."
          rm -rf "${GITHUB_WORKSPACE}/extra-files"
          git clone --depth=1 \
            https://github.com/GuLingguang/oneplus-sm8750-kernel-pro-build.git \
            "${GITHUB_WORKSPACE}/extra-files"
          if [ "${{ inputs.DSNTSYNCEVDI }}" = "None" ]; then
            echo "🚫 DroidSpaces Disabled"
            exit 0
          fi

          echo "📦 Installing DroidSpaces Sources..."
          cp -f "$EXTRA/drivers/misc/ntsync.c" \
            "$SOURCEDIR/drivers/misc/"
          cp -f "$EXTRA/include/uapi/linux/ntsync.h" \
            "$SOURCEDIR/include/uapi/linux/"
          rm -rf "$SOURCEDIR/drivers/gpu/drm/evdi"
          cp -r "$EXTRA/drivers/gpu/drm/evdi" \
            "$SOURCEDIR/drivers/gpu/drm/"
          echo "✔️ DroidSpaces Sources Installed"

          for FILE in \
            "$EVDIKCONFIG" \
            "$EVDIMAKEFILE" \
            "$MISCKCONFIG" \
            "$MISCMAKEFILE" \
            "$SCHEDFILE" \
            "$PIDFILE" \
            "$SOURCEDIR/drivers/misc/ntsync.c" \
            "$SOURCEDIR/include/uapi/linux/ntsync.h" \
            "$SOURCEDIR/drivers/gpu/drm/evdi/Kconfig" \
            "$SOURCEDIR/drivers/gpu/drm/evdi/Makefile"; do
            [ -f "$FILE" ] || {
              echo "⚠️ Missing: $FILE"
              exit 1
            }
          done

          echo "🔧 EVDI Kconfig..."
          if ! grep -qF 'source "drivers/gpu/drm/evdi/Kconfig"' "$EVDIKCONFIG"; then
            grep -qF 'source "drivers/gpu/drm/nouveau/Kconfig"' "$EVDIKCONFIG" || exit 1
            sed -i \
              '/source "drivers\/gpu\/drm\/nouveau\/Kconfig"/i source "drivers/gpu/drm/evdi/Kconfig"' \
              "$EVDIKCONFIG"
          fi

          echo "🔧 EVDI Makefile..."
          if ! grep -qF 'obj-$(CONFIG_DRM_LINDROID_EVDI)+= evdi/' "$EVDIMAKEFILE"; then
            grep -qF 'obj-y			+= display/' "$EVDIMAKEFILE" || exit 1
            sed -i \
              '/obj-y[[:space:]]*+= display\//a obj-$(CONFIG_DRM_LINDROID_EVDI)+= evdi/' \
              "$EVDIMAKEFILE"
          fi

          echo "🔧 NTSYNC Kconfig..."
          if ! grep -qE '^config NTSYNC$' "$MISCKCONFIG"; then
            grep -qF 'config APDS9802ALS' "$MISCKCONFIG" || exit 1
            perl -0pi -e \
              's/(\nconfig APDS9802ALS\n)/\nconfig NTSYNC\n\ttristate "NT synchronization primitive emulation"\n\tdefault m\n\thelp\n\t  This module provides kernel support for emulation of Windows NT synchronization primitives.\n\n$1/' \
              "$MISCKCONFIG"
          fi

          echo "🔧 NTSYNC Makefile..."
          if ! grep -qF 'obj-$(CONFIG_NTSYNC)' "$MISCMAKEFILE"; then
            grep -qF 'obj-$(CONFIG_SMPRO_ERRMON)' "$MISCMAKEFILE" || exit 1
            sed -i \
              '/obj-$(CONFIG_SMPRO_ERRMON)/i obj-$(CONFIG_NTSYNC)		+= ntsync.o' \
              "$MISCMAKEFILE"
          fi

          echo "🔧 SYSVIPC KABI..."
          if ! grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$SCHEDFILE"; then
            grep -qF 'struct sysv_sem			sysvsem;' "$SCHEDFILE" || exit 1
            grep -qF 'struct sysv_shm			sysvshm;' "$SCHEDFILE" || exit 1
            perl -0pi -e \
              's/\tstruct sysv_sem\s+sysvsem;\n\tstruct sysv_shm\s+sysvshm;/\t\/\/ struct sysv_sem\t\t\tsysvsem;\n\t\/\/ struct sysv_shm\t\t\tsysvshm;/' \
              "$SCHEDFILE"
            perl -0pi -e \
              's/\tANDROID_KABI_RESERVE\(6\);\n\tANDROID_KABI_RESERVE\(7\);\n\tANDROID_KABI_RESERVE\(8\);/\t#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif/' \
              "$SCHEDFILE"
          fi

          echo "👻 Ghost Task..."
          if ! grep -qF 'ghost-task-sentinel' "$PIDFILE"; then
            perl -0pi -e \
              's/(#include <uapi\/linux\/pidfd\.h>\n)/$1#include <linux\/version.h>\n#include <linux\/refcount.h>\n#include <linux\/module.h>\n/' \
              "$PIDFILE"
            perl -0pi -e \
              's/(EXPORT_SYMBOL_GPL\(init_pid_ns\);\n)/$1\nstatic struct task_struct ghost_task;\nstatic bool ghost_task_ready;\n\n#define set_task_usage(target, value) _Generic((target), refcount_t: refcount_set, atomic_t: atomic_set)(&(target), (value))\n\nvoid __init init_ghost_task(void)\n{\n\tmemcpy(\&ghost_task, \&init_task, sizeof(struct task_struct));\n\tstrncpy(ghost_task.comm, "ghost-task-sentinel", TASK_COMM_LEN);\n\tghost_task.pid = -1;\n\tghost_task.tgid = -1;\n\tset_task_usage(ghost_task.usage, 1000);\n#ifdef CONFIG_REFCOUNT_FULL\n\trefcount_set(\&ghost_task.refcount, 1000);\n#endif\n\tghost_task_ready = true;\n}\n/' \
              "$PIDFILE"
            perl -0pi -e \
              's/\treturn find_task_by_pid_ns\(vnr, task_active_pid_ns\(current\)\);/\tstruct task_struct *task;\n\tstruct module *mod;\n\tunsigned long caller_ip = _RET_IP_;\n\n\ttask = find_task_by_pid_ns(vnr, task_active_pid_ns(current));\n\tif (unlikely(!task)) {\n\t\tpreempt_disable();\n\t\tmod = __module_address(caller_ip);\n\t\tif (mod \&\& strcmp(mod->name, "oplus_bsp_midas") == 0) {\n\t\t\tpreempt_enable();\n\t\t\treturn ghost_task_ready ? \&ghost_task : \&init_task;\n\t\t}\n\t\tpreempt_enable();\n\t}\n\treturn task;/' \
              "$PIDFILE"
            perl -0pi -e \
              's/(void __init pid_idr_init\(void\)\n\{\n)/$1\tinit_ghost_task();\n/' \
              "$PIDFILE"
          fi

          echo "🔎 Verifying Integration..."
          grep -qF 'source "drivers/gpu/drm/evdi/Kconfig"' "$EVDIKCONFIG"
          grep -qF 'CONFIG_DRM_LINDROID_EVDI' "$EVDIMAKEFILE"
          grep -qE '^config NTSYNC$' "$MISCKCONFIG"
          grep -qF 'obj-$(CONFIG_NTSYNC)' "$MISCMAKEFILE"
          grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$SCHEDFILE"
          grep -qF 'ghost-task-sentinel' "$PIDFILE"
          grep -qF 'oplus_bsp_midas' "$PIDFILE"
          grep -qF 'init_ghost_task();' "$PIDFILE"
          echo "✔️ All DroidSpaces / NTSync / EVDI Modifications Verified"
          echo "🎉 DroidSpaces / NTSync / EVDI Kernel Integration Complete"
   
    
      - name: 🔧 Integrate Linux Security Module Baseband Guard
        if: ${{ inputs.BBG }}
        shell: bash
        run: |
          MAXRETRIES=3
          cd "$SOURCEDIR"

          echo "🔧 Baseband Guard Integration"
          echo "📌 Source: VC-Teahouse/Baseband-guard"
          echo "📌 Kernel: $SOURCEDIR"

          # Download and Execute Baseband Guard Setup
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          echo "📥 Fetching BBG Setup Script..."
          BBGAPPLIED=false
          for i in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL "$URLBBG" | bash -s -- main; then
              BBGAPPLIED=true
              break
            fi

            echo "⚠️ BBG Setup Failed"
            echo "🔁 Retry $i/$MAXRETRIES..."
            if [ "$i" -lt "$MAXRETRIES" ]; then
              sleep 2
            fi
          done

          if [ "$BBGAPPLIED" != "true" ]; then
            echo "⚠️ Failed to Apply BBG"
            exit 1
          fi

          echo "🎉 BBG Setup Completed"

          # Locate Baseband Guard Source
          echo "🔎 Locating Baseband Guard Source..."
          BBGPATHDIR=""
          if [ -d "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$SOURCEDIR/Baseband-guard"
          elif [ -L "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$(readlink -f "$SOURCEDIR/Baseband-guard")"
          else
            BBGPATHDIR="$(
              find "$SOURCEDIR" \
                -maxdepth 3 \
                -type d \
                -name "Baseband-guard" \
                -print \
                -quit
            )"
          fi

          if [ -z "$BBGPATHDIR" ] || [ ! -d "$BBGPATHDIR" ]; then
            echo "⚠️ Baseband Guard Directory Not Found"
            exit 1
          fi

          echo "📂 BBG Directory:"
          echo "$BBGPATHDIR"

          # Validate Baseband Guard Source
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ BBG Source Not Found"
            echo "📂 BBG Contents:"
            ls -la "$BBGPATHDIR"
            exit 1
          fi

          echo "✔️ Baseband Guard Source Detected"

          # Validate Linux Security Kconfig
          BBGCONFIGFILE="$SOURCEDIR/security/Kconfig"
          if [ ! -f "$BBGCONFIGFILE" ]; then
            echo "⚠️ Linux Security Kconfig Not Found:"
            echo "$BBGCONFIGFILE"
            exit 1
          fi

          # Add Baseband Guard to LSM Default List
          echo "⚙️ Updating Linux Security Module Configuration..."
          if grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "ℹ️ Baseband Guard Already Present"
          else
            awk '
              /^config LSM$/ {
                in_lsm=1
              }

              in_lsm && /^[[:space:]]*default[[:space:]]/ {
                if ($0 ~ /selinux/ && $0 !~ /baseband_guard/) {
                  sub(/selinux/, "selinux,baseband_guard")
                }
              }

              in_lsm && /^config[[:space:]]/ && $0 !~ /^config LSM$/ {
                in_lsm=0
              }

              {
                print
              }
            ' "$BBGCONFIGFILE" > "$BBGCONFIGFILE.tmp"
            mv -f \
              "$BBGCONFIGFILE.tmp" \
              "$BBGCONFIGFILE"
            echo "✔️ Linux Security Configuration Updated"
          fi

          # Enable Baseband Guard If Kernel Config Already Exists
          if [ -f "$SOURCEDIR/.config" ]; then
            echo "⚙️ Enabling CONFIG BBG..."
            ./scripts/config \
              --file "$SOURCEDIR/.config" \
              -e CONFIG_BBG
            echo "✔️ CONFIG BBG Enabled"
          else
            echo "ℹ️ Kernel Config Not Present Yet"
            echo "ℹ️ CONFIG BBG Will Be Resolved During Kernel Configuration"
          fi

          # Final Validation
          echo "🔎 Validating Baseband Guard Integration..."
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ Baseband Guard Source Validation Failed"
            exit 1
          fi

          if ! grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "⚠️ Baseband Guard Was Not Added To Security/Kconfig"
            exit 1
          fi

          echo "✔️ Baseband Guard Source: OK"
          echo "✔️ Baseband Guard Kconfig: OK"
          echo "🎉 Baseband Guard Fully Integrated"
    
      
      - name: 🔧 ReKernel Integration
        if: ${{ inputs.REKERNEL }}
        shell: bash
        run: |
          echo "🔧 Adding ReKernel Integration"
          REKERNELDIR="$SOURCEDIR/drivers/rekernel"

          # Prepare ReKernel Directory
          mkdir -p "$REKERNELDIR"

          # Create ReKernel Header
          cat > "$REKERNELDIR/rekernel.h" <<'EOF'
          /* SPDX-License-Identifier: GPL-2.0-only */
          /* Re:Kernel netlink server (from Sakion-Team/Re-Kernel Integrate guide) */
          #include <linux/init.h>
          #include <linux/types.h>
          #include <net/sock.h>
          #include <linux/netlink.h>
          #include <linux/proc_fs.h>
          #include <linux/freezer.h>
          #ifdef CONFIG_CGROUP_FREEZER
          #include <linux/sched/jobctl.h>
          #endif

          #define NETLINK_REKERNEL_MAX          26
          #define NETLINK_REKERNEL_MIN          22
          #define USER_PORT                    100
          #define PACKET_SIZE                  128
          #define MIN_USERAPP_UID              (10000)
          #define MAX_SYSTEM_UID               (2000)
          #define RESERVE_ORDER                17
          #define WARN_AHEAD_SPACE             (1 << RESERVE_ORDER)

          static struct sock *rekernel_netlink = NULL;
          extern struct net init_net;
          static int netlink_unit = NETLINK_REKERNEL_MIN;

          static inline bool line_is_frozen(struct task_struct *task)
          {
              return frozen(task->group_leader) || freezing(task->group_leader);
          }

          static int send_netlink_message(char *msg, uint16_t len)
          {
              struct sk_buff *skbuffer;
              struct nlmsghdr *nlhdr;

              skbuffer = nlmsg_new(len, GFP_ATOMIC);
              if (!skbuffer) {
                  printk("netlink alloc failure.\n");
                  return -1;
              }

              nlhdr = nlmsg_put(skbuffer, 0, 0, netlink_unit, len, 0);
              if (!nlhdr) {
                  printk("nlmsg_put failaure.\n");
                  nlmsg_free(skbuffer);
                  return -1;
              }

              memcpy(nlmsg_data(nlhdr), msg, len);
              return netlink_unicast(
                  rekernel_netlink,
                  skbuffer,
                  USER_PORT,
                  MSG_DONTWAIT
              );
          }

          static void netlink_rcv_msg(struct sk_buff *skbuffer)
          {
              /* Ignore recv msg */
          }

          static struct netlink_kernel_cfg rekernel_cfg = {
              .input = netlink_rcv_msg,
          };

          static int rekernel_unit_show(struct seq_file *m, void *v)
          {
              seq_printf(m, "%d\n", netlink_unit);
              return 0;
          }

          static int rekernel_unit_open(struct inode *inode, struct file *file)
          {
              return single_open(file, rekernel_unit_show, NULL);
          }

          static const struct proc_ops rekernel_unit_fops = {
              .proc_open    = rekernel_unit_open,
              .proc_read    = seq_read,
              .proc_lseek   = seq_lseek,
              .proc_release = single_release,
          };

          static struct proc_dir_entry *rekernel_dir, *rekernel_unit_entry;
          static int start_rekernel_server(void)
          {
              if (rekernel_netlink != NULL)
                  return 0;

              for (netlink_unit = NETLINK_REKERNEL_MIN;
                   netlink_unit < NETLINK_REKERNEL_MAX;
                   netlink_unit++) {
                  rekernel_netlink = (struct sock *)netlink_kernel_create(
                      &init_net,
                      netlink_unit,
                      &rekernel_cfg
                  );

                  if (rekernel_netlink != NULL)
                      break;
              }

              if (rekernel_netlink == NULL) {
                  printk("⚠️ Failed to Create ReKernel Server!\n");
                  return -1;
              }

              printk(
                  "✔️ Created ReKernel Server! Netlink Unit: %d\n",
                  netlink_unit
              );

              rekernel_dir = proc_mkdir("rekernel", NULL);

              if (!rekernel_dir)
                  printk("⚠️ Create Proc/ReKernel Failed!\n");
              else {
                  char buff[32];
                  sprintf(buff, "%d", netlink_unit);
                  rekernel_unit_entry = proc_create(
                      buff,
                      0644,
                      rekernel_dir,
                      &rekernel_unit_fops
                  );

                  if (!rekernel_unit_entry)
                      printk("create rekernel unit failed!\n");
              }
              return 0;
          }
          EOF

          # Modify Binder Source
          BINDER="$SOURCEDIR/drivers/android/binder.c"
          if ! grep -qF '#include "../rekernel/rekernel.h"' "$BINDER"; then
            perl -0pi -e '
              my $anchor = "#include <linux/file.h>\n";
              my $insert = "#include <linux/file.h>\n\n#ifdef CONFIG_REKERNEL\n#include \"../rekernel/rekernel.h\"\n#endif\n";
              die "⚠️ ReKernel Binder Source Include Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$BINDER"
          fi

          if ! grep -qF 'type=Binder,bindertype=reply' "$BINDER"; then
            perl -0pi -e '
              my $anchor =
                "trace_android_vh_binder_reply(target_proc, proc, thread, tr);\n";
              my $insert = <<'\''CODE'\'';
          trace_android_vh_binder_reply(target_proc, proc, thread, tr);

          #ifdef CONFIG_REKERNEL
          if (start_rekernel_server() == 0) {
            if (target_proc
              && (NULL != target_proc->tsk)
              && (NULL != proc->tsk)
              && (task_uid(target_proc->tsk).val <= MAX_SYSTEM_UID)
              && (proc->pid != target_proc->pid)
              && line_is_frozen(target_proc->tsk)) {
                char binder_kmsg[PACKET_SIZE];
                snprintf(binder_kmsg, sizeof(binder_kmsg), "type=Binder,bindertype=reply,oneway=0,from_pid=%d,from=%d,target_pid=%d,target=%d;", proc->pid, task_uid(proc->tsk).val, target_proc->pid, task_uid(target_proc->tsk).val);
                send_netlink_message(binder_kmsg, strlen(binder_kmsg));
            }
          }
          #endif
          CODE

              die "⚠️ ReKernel Binder Reply Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$BINDER"
          fi

          if ! grep -qF 'type=Binder,bindertype=transaction' "$BINDER"; then
            perl -0pi -e '
              my $anchor = "e->to_node = target_node->debug_id;\n";
              my $insert = <<'\''CODE'\'';
          e->to_node = target_node->debug_id;

          #ifdef CONFIG_REKERNEL
          if (start_rekernel_server() == 0) {
            if (target_proc
              && (NULL != target_proc->tsk)
              && (NULL != proc->tsk)
              && (task_uid(target_proc->tsk).val > MIN_USERAPP_UID)
              && (proc->pid != target_proc->pid)
              && line_is_frozen(target_proc->tsk)) {
                char binder_kmsg[PACKET_SIZE];
                snprintf(binder_kmsg, sizeof(binder_kmsg), "type=Binder,bindertype=transaction,oneway=%d,from_pid=%d,from=%d,target_pid=%d,target=%d;", tr->flags & TF_ONE_WAY, proc->pid, task_uid(proc->tsk).val, target_proc->pid, task_uid(target_proc->tsk).val);
                send_netlink_message(binder_kmsg, strlen(binder_kmsg));
            }
          }
          #endif
          CODE

              die "⚠️ ReKernel Binder Transaction Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$BINDER"
          fi

          # Modify Binder Alloc Source
          BINDERALLOC="$SOURCEDIR/drivers/android/binder_alloc.c"
          if ! grep -qF '#include "../rekernel/rekernel.h"' "$BINDERALLOC"; then
            perl -0pi -e '
              my $anchor = "#include <linux/slab.h>\n";
              my $insert = "#include <linux/slab.h>\n\n#ifdef CONFIG_REKERNEL\n#include \"../rekernel/rekernel.h\"\n#endif\n";
              die "⚠️ ReKernel Binder Alloc Source Include Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$BINDERALLOC"
          fi

          if ! grep -qF 'type=Binder,bindertype=free_buffer_full' "$BINDERALLOC"; then
            perl -0pi -e '
              my $anchor =
                "if (is_async && alloc->free_async_space < size) {\n";
              my $insert = <<'\''CODE'\'';
          if (is_async && alloc->free_async_space < size) {
          #ifdef CONFIG_REKERNEL
              if (alloc->free_async_space < 3 * (size + sizeof(struct binder_buffer))
                || (alloc->free_async_space < WARN_AHEAD_SPACE)) {
                  struct task_struct *proc_task = NULL;
                  rcu_read_lock();
                  proc_task = find_task_by_vpid(alloc->pid);
                  rcu_read_unlock();
                  if (proc_task != NULL && start_rekernel_server() == 0) {
                    if (line_is_frozen(proc_task)) {
                      char binder_kmsg[PACKET_SIZE];
                      snprintf(
                          binder_kmsg,
                          sizeof(binder_kmsg),
                          "type=Binder,bindertype=free_buffer_full,oneway=1,from_pid=%d,from=%d,target_pid=%d,target=%d;",
                          current->pid,
                          task_uid(current).val,
                          proc_task->pid,
                          task_uid(proc_task).val
                      );

                      send_netlink_message(
                          binder_kmsg,
                          strlen(binder_kmsg)
                      );
                    }
                  }
              }
          #endif
          CODE

              die "⚠️ ReKernel Binder Alloc Source Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$BINDERALLOC"
          fi

          # Modify Signal Source
          SIGNAL="$SOURCEDIR/kernel/signal.c"
          if ! grep -qF '#include "../drivers/rekernel/rekernel.h"' "$SIGNAL"; then
            perl -0pi -e '
              my $anchor = "#include <linux/file.h>\n";
              my $insert = "#include <linux/file.h>\n\n#ifdef CONFIG_REKERNEL\n#include \"../drivers/rekernel/rekernel.h\"\n#endif\n";
              die "⚠️ ReKernel Signal Source Include Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$SIGNAL"
          fi

          if ! grep -qF 'type=Signal,signal=' "$SIGNAL"; then
            perl -0pi -e '
              my $anchor =
                "trace_android_vh_do_send_sig_info(sig, current, p);\n";
              my $insert = <<'\''CODE'\'';
          trace_android_vh_do_send_sig_info(sig, current, p);

          #ifdef CONFIG_REKERNEL
          if (start_rekernel_server() == 0) {
            if (line_is_frozen(current) &&
                (sig == SIGKILL ||
                 sig == SIGTERM ||
                 sig == SIGABRT ||
                 sig == SIGQUIT)) {
              char binder_kmsg[PACKET_SIZE];
              snprintf(
                  binder_kmsg,
                  sizeof(binder_kmsg),
                  "type=Signal,signal=%d,killer_pid=%d,killer=%d,dst_pid=%d,dst=%d;",
                  sig,
                  task_tgid_nr(p),
                  task_uid(p).val,
                  task_tgid_nr(current),
                  task_uid(current).val
              );

              send_netlink_message(
                  binder_kmsg,
                  strlen(binder_kmsg)
              );
            }
          }
          #endif
          CODE

              die "⚠️ ReKernel Signal Source Anchor Not Found\n"
                unless index($_, $anchor) >= 0;
              s/\Q$anchor\E/$insert/;
            ' "$SIGNAL"
          fi

          # Validate ReKernel Integration
          echo "🔎 Validating ReKernel Integration"
          test -s "$REKERNELDIR/rekernel.h"
          grep -qF '#include "../rekernel/rekernel.h"' "$BINDER"
          grep -qF 'type=Binder,bindertype=reply' "$BINDER"
          grep -qF 'type=Binder,bindertype=transaction' "$BINDER"
          grep -qF '#include "../rekernel/rekernel.h"' "$BINDERALLOC"
          grep -qF 'type=Binder,bindertype=free_buffer_full' "$BINDERALLOC"
          grep -qF '#include "../drivers/rekernel/rekernel.h"' "$SIGNAL"
          grep -qF 'type=Signal,signal=' "$SIGNAL"
          echo "📂 Header               : $REKERNELDIR/rekernel.h"
          echo "📄 Binder Source        : OK"
          echo "📄 Binder Alloc Source  : OK"
          echo "📄 Signal Source        : OK"
          echo "🎉 ReKernel Integration Complete"


      - name: 🔧 NoMount Built-in Integration
        if: ${{ inputs.NOMOUNT != 'None' }}
        shell: bash
        run: |
          echo "🔧 NoMount Built-in Integration"
          NOMOUNTSOURCE="${SOURCEDIR}"
          NOMOUNTBRANCH="${{ inputs.NOMOUNT }}"
          echo "📂 Kernel Source : ${NOMOUNTSOURCE}"
          echo "📌 NoMount Branch: ${NOMOUNTBRANCH}"

          # Verify Kernel Source
          if [ ! -d "$NOMOUNTSOURCE" ]; then
            echo "⚠️ Kernel Source Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE"
            exit 1
          fi

          # Verify Kernel Filesystem Directory
          if [ ! -d "$NOMOUNTSOURCE/fs" ]; then
            echo "⚠️ Kernel Filesystem Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE/fs"
            exit 1
          fi

          cd "$NOMOUNTSOURCE"

          echo "📥 Integrating NoMount Into Kernel Source..."
          case "$NOMOUNTBRANCH" in
            Master)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : master"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -
              ;;
            Dev)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : dev"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -s -- dev
              ;;
            *)
              echo "⚠️ Unsupported NoMount Selection: $NOMOUNTBRANCH"
              exit 1
              ;;
          esac
          echo "✔️ NoMount Setup Script Completed"

          # Validate NoMount Source
          if [ ! -d "$NOMOUNTSOURCE/fs/nomount" ]; then
            echo "⚠️ NoMount Source Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE/fs/nomount"
            exit 1
          fi

          echo "📂 NoMount Source:"
          ls -la "$NOMOUNTSOURCE/fs/nomount"

          echo "🔎 Verifying NoMount Kernel Integration..."
          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Kconfig" ]; then
            echo "⚠️ NoMount Kconfig Not Found"
            exit 1
          fi

          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Makefile" ]; then
            echo "⚠️ NoMount Makefile Not Found"
            exit 1
          fi

          if ! grep -qF 'nomount' "$NOMOUNTSOURCE/fs/Kconfig"; then
            echo "⚠️ NoMount Kconfig Is Not Included From fs/Kconfig"
            exit 1
          fi

          if ! grep -qF 'nomount/' "$NOMOUNTSOURCE/fs/Makefile"; then
            echo "⚠️ NoMount Makefile Is Not Included From fs/Makefile"
            exit 1
          fi

          echo "✔️ NoMount Kconfig Integration Verified"
          echo "✔️ NoMount Makefile Integration Verified"
          echo "✔️ NoMount Source Integration Verified"
          echo "🎉 NoMount Built-in Integration Complete"


      - name: 🛠️ Configure Kbuild Build Metadata
        shell: bash
        run: |
          # Resolve Build Timestamp Input
          TIMEINPUT="${{ inputs.KERNELBUILDTIME }}"
          if [[ -n "$TIMEINPUT" ]]; then
            DATESTR="$TIMEINPUT"
            echo "🔎 Using Custom Build Time: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date '+%a %b %-d %H:%M:%S UTC %Y')"
            echo "🛠️ Using Current UTC Time: $DATESTR"
          fi

          # Validate Build Timestamp Format
          if ! date -d "$DATESTR" >/dev/null 2>&1; then
            echo "⚠️ Invalid Build Time"
            echo "📌 Value: $DATESTR"
            echo "📌 Expected: <Day> <Month> <DD> <HH:MM:SS> UTC <YYYY>"
            exit 1
          fi

          # Configure Kbuild Build Metadata
          export KBUILD_BUILD_TIMESTAMP="$DATESTR"
          export KBUILD_BUILD_VERSION="1"

          # Export Kbuild Metadata To Following Workflow Steps
          {
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
          } >> "$GITHUB_ENV"

          # Display Build Metadata
          echo "🔍 Kbuild Build Metadata"
          echo "📌 Build Timestamp : $KBUILD_BUILD_TIMESTAMP"
          echo "📌 Build Version   : $KBUILD_BUILD_VERSION"
          echo "📌 Android Base    : $ANDROIDVERSION"
          echo "📌 Kernel Base     : $KERNELVERSION"
          echo "📌 Kernel Version  : $FULLVERSION"

          # Validate Kbuild Metadata
          if [[ -z "${KBUILD_BUILD_TIMESTAMP:-}" ]]; then
            echo "⚠️ Kbuild Build Timestamp Not Set"
            exit 1
          fi

          if [[ -z "${KBUILD_BUILD_VERSION:-}" ]]; then
            echo "⚠️ Kbuild Build Version Not Set"
            exit 1
          fi
          
          echo "🎉 Kbuild Build Metadata Configured"
    
   
      - name: 🔨 Build Kernel
        if: ${{ !inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          # Configure Kernel Build Environment
          sudo sysctl -w vm.max_map_count=1048576

          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="${{ inputs.GITOWNER }}"
          export KBUILD_BUILD_HOST="${{ inputs.GITHOST }}"

          # Configure CCache Debug Logging
          if [[ "${{ inputs.DEBUGBUILDCCACHE }}" == "true" ]]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          # Validate Kbuild Build Metadata
          if [[ -z "${KBUILD_BUILD_TIMESTAMP:-}" ]]; then
            echo "⚠️ Kbuild Build Timestamp Not Set"
            exit 1
          fi

          if [[ -z "${KBUILD_BUILD_VERSION:-}" ]]; then
            echo "⚠️ Kbuild Build Version Not Set"
            exit 1
          fi

          echo "🔍 Kbuild Build Metadata"
          echo "📌 Build Time   : $KBUILD_BUILD_TIMESTAMP"
          echo "📌 Build Version: $KBUILD_BUILD_VERSION"
          echo "📌 Build User   : $KBUILD_BUILD_USER"
          echo "📌 Build Host   : $KBUILD_BUILD_HOST"

          # Define Fake Time Environment
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          # Define Build Paths
          LIBDIR="$GITHUB_WORKSPACE/lib"
          CCWRAPPER="$GITHUB_WORKSPACE/cc-wrapper"
          LDWRAPPER="$GITHUB_WORKSPACE/ld-wrapper"

          export PRELOAD_LIBS="$LIBDIR/libfakestat.so:$LIBDIR/libfaketimeMT.so"

          # Validate Build Tools
          echo "🔎 Validating Build Tools..."
          command -v clang >/dev/null || {
            echo "⚠️ clang Not Found"
            exit 1
          }
          command -v ld.lld >/dev/null || {
            echo "⚠️ ld.lld Not Found"
            exit 1
          }
          command -v ccache >/dev/null || {
            echo "⚠️ ccache Not Found"
            exit 1
          }

          # Validate Fake Time Libraries
          if [[ ! -f "$LIBDIR/libfakestat.so" ||
                ! -f "$LIBDIR/libfaketimeMT.so" ]]; then
            echo "⚠️ Fake Time Libraries Not Found"
            echo "📂 Library Directory: $LIBDIR"
            exit 1
          fi

          # Prepare Fake Time Libraries
          chmod 755 \
            "$LIBDIR/libfakestat.so" \
            "$LIBDIR/libfaketimeMT.so"

          # Create Clang Wrapper
          cd "$GITHUB_WORKSPACE"
          cat > "$CCWRAPPER" <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ccache clang "\$@"
          EOF

          # Create LLD Wrapper
          cat > "$LDWRAPPER" <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ld.lld "\$@"
          EOF

          chmod +x "$CCWRAPPER" "$LDWRAPPER"

          # Validate Wrappers
          "$CCWRAPPER" --version >/dev/null
          "$LDWRAPPER" --version >/dev/null

          # Display Build Environment
          echo
          echo "🔧 Build Environment"
          echo "📌 LLVM        : $LLVM"
          echo "📌 LLVM IAS    : $LLVM_IAS"
          echo "📌 Architecture: arm64"
          echo "📌 Build User  : $KBUILD_BUILD_USER"
          echo "📌 Build Host  : $KBUILD_BUILD_HOST"
          echo "📌 Fake Stat   : $FAKESTAT"
          echo "📌 Fake Time   : $FAKETIME"
          echo "📌 Clang       : $(clang --version | sed -n '1p')"
          echo "📌 LLD         : $(ld.lld --version | sed -n '1p')"
          echo "📌 CCache      : $(ccache --version | sed -n '1p')"

          # Move Into Kernel Source
          cd "$SOURCEDIR"
          # Validate Kernel Source
          if [[ ! -f "Makefile" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📂 Expected: $SOURCEDIR/Makefile"
            exit 1
          fi

          # Validate Kernel Configuration
          if [[ ! -f ".config" ]]; then
            echo "⚠️ Kernel Configuration Not Found"
            echo "📂 Expected: $SOURCEDIR/.config"
            exit 1
          fi

          # Configure Final Kernel Configuration
          echo "🔧 Configuring Final Kernel Configuration..."
          # Root Engine
          if [ "${{ inputs.ROOTENGINE }}" = "None" ]; then
            echo "🚫 KSU Disabled"
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          else
            echo "✔️ KSU Enabled"
            ./scripts/config --file .config \
              -e CONFIG_KSU
            # KSU Full Name Format
            ./scripts/config --file .config \
              --set-str CONFIG_KSU_FULL_NAME_FORMAT "%TAG_NAME%"
            echo "✔️ KSU Full Name Format: %TAG_NAME%"

            # SUSFS Integration
            if [ "${{ inputs.SUSFSENGINE }}" = "true" ]; then
              echo "✔️ KSU SUSFS Enabled"
              ./scripts/config --file .config \
                -e CONFIG_KSU_SUSFS
            else
              echo "🚫 KSU SUSFS Disabled"
              ./scripts/config --file .config \
                -d CONFIG_KSU_SUSFS
            fi
          fi

          # DroidSpaces / NTSync / EVDI
          if [ "${{ inputs.DSNTSYNCEVDI }}" = "None" ]; then
            echo "🚫 DroidSpaces / NTSync Disabled"
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC \
              -d CONFIG_NTSYNC \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # EVDI Only Enabled In Extended Mode
          if [ "${{ inputs.DSNTSYNCEVDI }}" != "Extend" ]; then
            echo "🚫 EVDI Disabled"
            ./scripts/config --file .config \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # BetterNetwork / Netfilter
          if [ "${{ inputs.BETTERNET }}" != "true" ]; then
            echo "🚫 BetterNetwork / Netfilter Disabled"
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          else
            echo "✔️ Better Network / Netfilter Enabled"
          fi

          # BBR TCP Congestion Control
          if [ "${{ inputs.BBR }}" = "true" ]; then
            echo "✔️ BBR TCP Congestion Control Enabled"
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          # ReKernel Binder Hook
          if [ "${{ inputs.REKERNEL }}" = "true" ]; then
            echo "✔️ ReKernel Binder Hook Enabled"
            ./scripts/config --file .config \
              -e CONFIG_REKERNEL
          fi

          # NoMount Integration
          if [ "${{ inputs.NOMOUNT }}" = "None" ]; then
            echo "🚫 NoMount Integration Disabled"
            ./scripts/config --file .config \
              -d CONFIG_NOMOUNT
          else
            echo "✔️ NoMount Integration Enabled"
            ./scripts/config --file .config \
              -e CONFIG_NOMOUNT
          fi

          # Synchronize Final Kernel Configuration
          echo "🔄 Running Old DefConfig..."
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            olddefconfig

          # Display Final KSU Configuration
          echo "🔎 Final Root Engine and SUSFS Configuration"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_FULL_NAME_FORMAT)=' \
            .config || true

          # Display Final DroidSpaces Configuration
          echo "🔎 Final DroidSpaces / NTSync / EVDI Configuration"
          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_NTSYNC|CONFIG_DRM_LINDROID_EVDI)=' \
            .config || true

          # Display Final Network Configuration
          echo "🔎 Final Network Configuration"
          grep -E \
            '^(CONFIG_IP_SET|CONFIG_BPF_STREAM_PARSER|CONFIG_IP6_NF_NAT|CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR)=' \
            .config || true

          # Display Final ReKernel Configuration
          echo "🔎 Final ReKernel Binder Hook Configuration"
          grep '^CONFIG_REKERNEL=' .config || true

          # Display Final NoMount Configuration
          echo "🔎 Final NoMount Configuration"
          grep '^CONFIG_NOMOUNT=' .config || true

          # Display Final Local Version
          echo "🔎 Final Local Version"
          grep '^CONFIG_LOCALVERSION=' .config || true

          echo ""
          echo "🎉 Final Kernel Configuration Complete"

          # Start Build Timer
          BUILDSTART="$(date +%s)"

          # Build Kernel Image
          echo "🔨 Building Kernel Image..."
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CC="$CCWRAPPER" \
            LD="$LDWRAPPER" \
            HOSTLD="$LDWRAPPER" \
            KCFLAGS+=-O2 \
            -j"$(nproc --all)" \
            Image

          # Calculate Build Duration
          BUILDEND="$(date +%s)"
          BUILDTIME="$((BUILDEND - BUILDSTART))"

          # Display CCache Status
          echo "📊 CCache Status:"
          ccache -s

          # Validate Kernel Image
          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected: $IMAGE"
            exit 1
          fi

          # Display Build Result
          echo "📦 Kernel Image:"
          ls -lh "$IMAGE"

          echo "⏱️ Build Duration: ${BUILDTIME}s"
          echo "🎉 Kernel Build Complete"

          # Generate GitHub Actions Build Summary
          CCACHESUMMARY="$(ccache -s 2>&1)"

          {
            echo "## 🧠 Compiler Cache Performance Summary"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Build Status | 🚀 Success |"
            echo "| Build Time | **${BUILDTIME}s** |"
            echo "| Cacheable Calls | $(echo "$CCACHESUMMARY" | grep "Cacheable calls:" | sed 's/.*Cacheable calls:[[:space:]]*//') |"
            echo "| Cache Hits | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Hits:" | head -n1 | sed 's/.*Hits:[[:space:]]*//') |"
            echo "| Direct Hits | $(echo "$CCACHESUMMARY" | grep "Direct:" | sed 's/.*Direct:[[:space:]]*//') |"
            echo "| Preprocessed Hits | $(echo "$CCACHESUMMARY" | grep "Preprocessed:" | sed 's/.*Preprocessed:[[:space:]]*//') |"
            echo "| Cache Misses | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Misses:" | head -n1 | sed 's/.*Misses:[[:space:]]*//') |"
            echo "| Uncacheable Calls | $(echo "$CCACHESUMMARY" | grep "Uncacheable calls:" | sed 's/.*Uncacheable calls:[[:space:]]*//') |"
            echo "| Cache Size | $(echo "$CCACHESUMMARY" | grep "Cache size" | sed 's/.*Cache size (GB):[[:space:]]*//') |"
            echo ""
            echo "### ⚡ Build Result"
            echo ""
            echo "**🎉 Build Completed Successfully**"
          } >> "$GITHUB_STEP_SUMMARY"
    
   
      - name: 🧪 Create Debug Dummy Image
        if: ${{ inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          # Define Kernel Image
          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"

          # Prepare Kernel Image Directory
          mkdir -p "$(dirname "$IMAGE")"

          # Create Dummy Kernel Image
          printf '%s\n' "DEBUG DUMMY IMAGE" > "$IMAGE"

          # Validate Dummy Kernel Image
          SIZE="$(stat -c%s "$IMAGE")"
          echo "🧪 Debug Mode: Kernel Build Skipped"
          echo "📂 Dummy Image: $IMAGE"
          echo "📦 Image Size  : ${SIZE} Bytes"
          if [[ "$SIZE" -le 0 ]]; then
            echo "⚠️ Failed to Create Dummy Image"
            exit 1
          fi
          echo "🎉 Dummy Image Created Successfully"
    
      
      - name: 🔎 Verify Kernel Build Metadata
        id: kernelverify
        shell: bash
        run: |
          # Enter Kernel Source Directory
          cd "$SOURCEDIR"

          # Display Expected Kernel Build Metadata
          echo "🔎 Verifying Kernel Build Metadata..."
          echo "📌 Expected Kernel Version : $FULLVERSION"
          echo "📌 Expected Build Time     : $KBUILD_BUILD_TIMESTAMP"

          # Define Kernel Image and UTS Header
          IMAGE="arch/arm64/boot/Image"
          UTSHEADER="include/generated/utsversion.h"

          # Validate Kernel Image
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected: $SOURCEDIR/$IMAGE"
            exit 1
          fi

          # Validate Generated UTS Header
          if [[ ! -f "$UTSHEADER" ]]; then
            echo "⚠️ UTS Version Header Not Found"
            echo "📂 Expected: $SOURCEDIR/$UTSHEADER"
            exit 1
          fi

          # Read UTS Version From Generated Header
          UTSVERSION="$(
            sed -n \
              's/^#define UTS_VERSION "\(.*\)"/\1/p' \
              "$UTSHEADER" |
              sed -n '1p'
          )"

          # Validate UTS Version
          if [[ -z "$UTSVERSION" ]]; then
            echo "⚠️ UTS Version Not Found"
            exit 1
          fi

          echo "📌 Kernel UTS Version: $UTSVERSION"

          # Verify Configured Build Timestamp
          if [[ "$UTSVERSION" == *"$KBUILD_BUILD_TIMESTAMP"* ]]; then
            echo "✔️ Kernel Build Timestamp Matches"
          else
            echo "⚠️ Kernel Build Timestamp Does Not Match"
            echo "📌 Expected: $KBUILD_BUILD_TIMESTAMP"
            echo "📌 Found   : $UTSVERSION"
            exit 1
          fi

          # Export UTS Version For Following Workflow Steps
          echo "utsversion=$UTSVERSION" >> "$GITHUB_OUTPUT"
          echo "🎉 Kernel Build Metadata Verified"
      
    
      - name: 🧩 Patch Kernel with KP-Next
        if: ${{ inputs.KERNELPATCH && !inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          cd "$SOURCEDIR/arch/arm64/boot"
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux \
            -O kptools-linux
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux \
            -O kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux \
            -p \
            -i Image \
            -k kpimg-linux \
            -o oImage
          mv -f oImage Image
          rm -f kptools-linux kpimg-linux
          echo "🎉 KPM Patched"

   
      - name: 💾 Save GitHub CCache
        if: ${{ inputs.BUILDCCACHE }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}

  
      - name: 📦 Upload Public CCache
        if: ${{ inputs.BUILDCCACHE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        shell: bash
        run: |
          echo "📦 Packaging Public CCache..."
          echo "📂 CCache Directory: $CCACHE_DIR"
          ccache -s || true
          echo "🗜️ Creating Public CCache Archive..."
          tar -I 'zstd -T0 -5' \
            -cf CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            -C "$CCACHE_DIR" .
          echo "📦 Archive Size: $(du -sh CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst | cut -f1)"
          echo "🚀 Uploading Public CCache..."
          if gh release create \
            "CCache-SM8750-${{ inputs.AOSPSOURCE }}" \
            CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            --notes 'Category: CCache | SM8750-O2-FT — Public CCache for OPlus AOSP SM8750 Kernel Builds'; then
            echo "✔️ Public CCache Release Created"
          elif gh release upload \
            "CCache-SM8750-${{ inputs.AOSPSOURCE }}" \
            CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            --clobber; then
            echo "✔️ Public CCache Release Updated"
          else
            echo "⚠️ Failed to Upload Public CCache"
            exit 1
          fi
          rm -f CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst
          echo "🎉 Public CCache Uploaded Successfully"

   
      - name: 🐞 Upload CCache Debug Log
        if: ${{ inputs.DEBUGBUILDCCACHE }}
        uses: actions/upload-artifact@v6
        with:
          name: CCache-Debug-Log
          path: ccache.log
          if-no-files-found: ignore

    
      - name: 📦 Clone & Package AnyKernel3
        id: package
        shell: bash
        run: |
          # Define AnyKernel3 Paths
          AK3DIR="${GITHUB_WORKSPACE}/anykernel3"
          PACKDIR="${GITHUB_WORKSPACE}/pack"
          OUTDIR="${GITHUB_WORKSPACE}/out"
          IMAGE="${SOURCEDIR}/arch/arm64/boot/Image"

          # Define Android Source
          AOSPSOURCE="${{ inputs.AOSPSOURCE }}"

          # Define Source Branches
          LINEAGEBRANCH=""
          CRDROIDBRANCH=""
          CRDROIDDEVICE=""
          case "$AOSPSOURCE" in
            Lineage)
              LINEAGEBRANCH="lineage-23.2"
              ;;
            CrDroid)
              CRDROIDBRANCH="16.0"
              CRDROIDDEVICE="dodge"
              ;;
          esac

          # Define Security Patch Metadata
          RELEASEPATCH="${RUNNER_TEMP}/RELEASE_PLATFORM_SECURITY_PATCH.textproto"
          CRDROIDPATCH="${RUNNER_TEMP}/crDroidOTA.json"

          # Display Package Configuration
          echo "📦 AnyKernel3 Packaging"
          echo "📂 Kernel Source     : ${SOURCEDIR}"
          echo "📂 AnyKernel3        : ${AK3DIR}"
          echo "📂 Package Directory : ${PACKDIR}"
          echo "📂 Output Directory  : ${OUTDIR}"
          echo "📌 Android Source    : ${AOSPSOURCE}"
          if [[ -n "$LINEAGEBRANCH" ]]; then
            echo "📌 LineageOS Branch  : ${LINEAGEBRANCH}"
          fi

          if [[ -n "$CRDROIDBRANCH" ]]; then
            echo "📌 CrDroid Branch    : ${CRDROIDBRANCH}"
            echo "📌 CrDroid Device    : ${CRDROIDDEVICE}"
          fi

          # Clone AnyKernel3
          echo
          echo "📥 Cloning AnyKernel3..."
          rm -rf "$AK3DIR"
          git clone \
            --depth=1 \
            --branch master \
            https://github.com/AndreiMikh/AnyKernel3.git \
            "$AK3DIR"
          echo "✔️ AnyKernel3 Cloned Successfully"

          # Validate Kernel Image
          echo
          echo "🔎 Validating Kernel Image..."
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected: $IMAGE"
            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"
          echo "✔️ Kernel Image Verified"
          echo "📌 Kernel Image Size: ${SIZE} bytes"

          # Prepare AnyKernel3 Package
          echo
          echo "📥 Preparing AnyKernel3 Package..."
          cp -a "$AK3DIR"/. "$PACKDIR"/
          cp "$IMAGE" "$PACKDIR/Image"
          echo "✔️ AnyKernel3 Package Prepared"

          # Configure AnyKernel3 Kernel Name
          echo
          echo "🔧 Configuring AnyKernel3 Kernel Name..."
          if [[ "${{ inputs.ATTR }}" == "true" ]]; then
            sed -i \
              "s#kernel.string=.*#kernel.string=AOSP ${AOSPSOURCE} Kernel | Build by ${{ inputs.GITOWNER }}#" \
              "$PACKDIR/anykernel.sh"
          else
            sed -i \
              "s#kernel.string=.*#kernel.string=${AOSPSOURCE} OPlus AOSP SM8750 Kernel#" \
              "$PACKDIR/anykernel.sh"
          fi

          echo "✔️ AnyKernel3 Kernel Name Configured"
  
          # Detect Android Security Patch Level
          echo
          echo "🔎 Detecting Android Security Patch Level..."
          AOSPPATCHFULL=""
          case "$AOSPSOURCE" in
            Lineage)
              # Define LineageOS Release Metadata
              RELEASEURL="https://raw.githubusercontent.com/LineageOS/android_build_release/${LINEAGEBRANCH}/flag_values/bp4a/RELEASE_PLATFORM_SECURITY_PATCH.textproto"
              echo "📌 Source: LineageOS"
              echo "📌 Branch: ${LINEAGEBRANCH}"
              echo "📂 Metadata: ${RELEASEURL}"
              rm -f "$RELEASEPATCH"
              # Fetch LineageOS Release Metadata
              if curl -fsSL \
                "$RELEASEURL" \
                -o "$RELEASEPATCH"; then
                echo "✔️ LineageOS Release Metadata Downloaded"

                # Extract Security Patch Level
                AOSPPATCHFULL="$(
                  awk '
                    {
                      if (match($0, /20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/)) {
                        print substr($0, RSTART, RLENGTH)
                        exit
                      }
                    }
                  ' "$RELEASEPATCH"
                )"

                if [[ -n "$AOSPPATCHFULL" ]]; then
                  echo "✔️ LineageOS Security Patch Level Found"
                  echo "📲 Detected Patch Level: ${AOSPPATCHFULL}"
                else
                  echo "⚠️ LineageOS Security Patch Level Not Found"
                fi
              else
                echo "⚠️ Failed To Fetch LineageOS Release Metadata"
              fi
              ;;
            CrDroid)
              # Define CrDroid OTA Metadata
              CRDROIDURL="https://raw.githubusercontent.com/crdroidandroid/android_vendor_crDroidOTA/${CRDROIDBRANCH}/${CRDROIDDEVICE}.json"
              echo "📌 Source: CrDroid"
              echo "📌 Branch: ${CRDROIDBRANCH}"
              echo "📌 Device: ${CRDROIDDEVICE}"
              echo "📂 Metadata: ${CRDROIDURL}"
              rm -f "$CRDROIDPATCH" 
              # Fetch CrDroid OTA Metadata
              if curl -fsSL \
                "$CRDROIDURL" \
                -o "$CRDROIDPATCH"; then
                echo "✔️ CrDroid OTA Metadata Downloaded"
                # Extract Security Patch Level
                AOSPPATCHFULL="$(
                  awk '
                    /"os_patch_level"[[:space:]]*:/ {
                      if (match($0, /20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/)) {
                        print substr($0, RSTART, RLENGTH)
                        exit
                      }
                    }
                  ' "$CRDROIDPATCH"
                )"

                if [[ -n "$AOSPPATCHFULL" ]]; then
                  echo "✔️ CrDroid Security Patch Level Found"
                  echo "📲 Detected Patch Level: ${AOSPPATCHFULL}"
                else
                  echo "⚠️ CrDroid Security Patch Level Not Found"
                fi
              else
                echo "⚠️ Failed To Fetch CrDroid OTA Metadata"
              fi
              ;;
            AOSP)
              # Handle AOSP Source
              echo "📌 Source: AOSP"
              echo "ℹ️ AOSP Release Metadata Detection Not Available"
              ;;
            *)
              # Handle Unknown Android Source
              echo "⚠️ Unknown AOSP Source: ${AOSPSOURCE}"
              ;;
          esac

          # Validate Security Patch Level
          if [[ "$AOSPPATCHFULL" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            # Convert Security Patch Level
            AOSPPATCHLEVEL="${AOSPPATCHFULL:0:7}"
            echo "✔️ Android Security Patch Level Detected"
            echo "📲 Full Patch Level : ${AOSPPATCHFULL}"
            echo "📲 Boot Patch Level : ${AOSPPATCHLEVEL}"
          else
            # Use Workflow Fallback
            echo "⚠️ Android Security Patch Level Not Found In Source"
            echo "ℹ️ Using Workflow Fallback: 2026-08"
            AOSPPATCHLEVEL="2026-08"
          fi

          # Export Security Patch Level
          echo "AOSPPATCHLEVEL=$AOSPPATCHLEVEL" >> "$GITHUB_ENV"
          echo "📲 Final Boot Patch Level: ${AOSPPATCHLEVEL}"

          # Generate AnyKernel3 Package Name
          STAMP="$(date +%Y%m%d)"
          ZIP="AK3-(${FULLVERSION})-${{ inputs.AOSPSOURCE }}(SM8750)-${{ inputs.ROOTENGINE }}(${KSUVERSION})(${STAMP}).zip"
          echo
          echo "📦 Creating AnyKernel3 ZIP..."
          echo "📌 Package: ${ZIP}"

          # Compress AnyKernel3 Package
          cd "$PACKDIR"
          zip -r9 \
            "${OUTDIR}/${ZIP}" \
            . \
            -x "*.git*" \
            >/dev/null
          cd "$GITHUB_WORKSPACE"

          # Export Package Name
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          echo "✔️ AnyKernel3 Package Created"
          ls -lh "${OUTDIR}/${ZIP}"

          # Generate Additional Artifacts
          if [[ "${{ inputs.BUILDARTIFACT }}" == "All" ]]; then
            echo "📦 Generating Additional Kernel Artifacts..."
            # Copy Raw Kernel Image
            cp "$IMAGE" "${OUTDIR}/Image"
            echo "✔️ Raw Kernel Image Generated"
            echo "📂 ${OUTDIR}/Image"

            # Generate Boot Image
            echo "📦 Generating Boot Image..."
            echo "📲 Android Security Patch Level: ${AOSPPATCHLEVEL}"
            mkbootimg \
              --kernel "$IMAGE" \
              --header_version 4 \
              --os_version 16.0.0 \
              --os_patch_level "$AOSPPATCHLEVEL" \
              --pagesize 4096 \
              --base 0x80000000 \
              -o "${OUTDIR}/boot.img"
            # Validate Boot Image
            if [[ ! -s "${OUTDIR}/boot.img" ]]; then
              echo "⚠️ Failed To Generate Boot Image"
              exit 1
            fi

            echo "✔️ Boot Image Generated"
            echo "📂 ${OUTDIR}/boot.img"

            # Display Generated Artifacts
            echo "🚀 All Mode: Image + Boot Image Generated"
            echo "📌 Generated Files:"
            ls -lh \
              "${OUTDIR}/Image" \
              "${OUTDIR}/boot.img"
            echo "📲 Boot Image Patch Level: ${AOSPPATCHLEVEL}"
          fi
          echo "🎉 AnyKernel3 Packaging Complete"


      - name: 📤 Upload Kernel Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: File-${{ inputs.AOSPSOURCE }}(${{ env.FULLVERSION }})-ReSukiSU-(${{ env.KSUVERSION }})
          path: out/*
          retention-days: 30
          if-no-files-found: error
