name: 📦 Package SukiSU Ultra Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 📦 Clone and Archive
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone Latest SukiSU Ultra
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: main
          path: SukiSU-Ultra
          fetch-depth: 1
          persist-credentials: false

      - name: 🪪 Record Source Commit
        id: source
        working-directory: SukiSU-Ultra
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 📦 Create Source ZIP
        run: |
          zip -qr SukiSU-Ultra.zip SukiSU-Ultra \
            -x "SukiSU-Ultra/.git/*"

      - name: 📤 Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Source-${{ steps.source.outputs.commit }}
          path: SukiSU-Ultra.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
