name: 📦 Package SukiSU Ultra Source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: 📦 Clone and Archive
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clone Latest SukiSU Ultra
        uses: actions/checkout@v7
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: main
          path: SukiSU-Ultra
          fetch-depth: 1
          persist-credentials: false

      - name: 🪪 Record Source Commit
        id: source
        working-directory: SukiSU-Ultra
        run: |
          # Get Current Source Commit Hash (7 Characters)
          SOURCECOMMIT=$(git rev-parse --short=7 HEAD)
          # Export Short Commit Hash For Subsequent Workflow Steps
          echo "commit=${SOURCECOMMIT}" >> "$GITHUB_OUTPUT"
          # Display Recorded Commit Hash in Build Log
          echo "└─ 🪪 Source Commit : ${SOURCECOMMIT}"

      - name: 📦 Create Source ZIP
        run: |
          # Compress SukiSU-Ultra Source Directory Into a ZIP Archive
          # Exclude Git Directory to Avoid Including Git History and Metadata
          zip -qr SukiSU-Ultra.zip SukiSU-Ultra \
            -x "SukiSU-Ultra/.git/*"
          # Display Generated Archive Information
          echo "└─ 📦 Source Archive Created : SukiSU-Ultra.zip"

      - name: 📤 Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          # Set Artifact Name with 7-Character Source Commit Hash
          name: SukiSU-Ultra-Source-${{ steps.source.outputs.commit }}
          # Specify the source ZIP archive to upload
          path: SukiSU-Ultra.zip
          # Disable Additional Compression Since ZIP is Already Compressed
          compression-level: 0
          # Fail Workflow if ZIP Archive is Missing
          if-no-files-found: error
          # Automatically Delete Artifact After 7 Days
          retention-days: 7
