name: (New) Universal OPPO/OnePlus/Realme 6.12.23 GKI Kernel Quick Build
on:
  workflow_dispatch:
    inputs:
      ROOTENGINE:
        type: choice
        description: "KSU Manager"
        required: true
        default: ReSukiSU
        options:
         - KernelSU-Next
         - KernelSU
         - ReSukiSU
         - SukiSU-Ultra         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - KernelSU-Next-Dev-SUSFS
         - KernelSU-Main
         - ReSukiSU-Main
         - ReSukiSU-Dev
         - SukiSU-Ultra-Builtin
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Aug 3 07:07:07 UTC 2026"       
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "flamingsakura-hiyuki"   
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Revision (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""        
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12, SUSFS for OPlus Kernel Image (SUSFSOKI) / SUSFS for KernelSU (SUSFSKSU)"
        required: true
        default: GKI
        options:
          - OGKI
          - GKI
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Development Branch?"
        required: true
        default: false
      LSMBBG:
        type: boolean
        description: "Critical Partition Write Protection (Linux Security Module)"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Network Feature Extensions (NetFilter)"
        required: true
        default: true        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBRV1+BBRV3+ECN
        options:
          - BBRV1+ECN
          - BBRV1+BBRV3+ECN
          - BBRV1+ECN+Brutal
          - BBRV1+BBRV3+ECN+Brutal    
          - None       
      KERNELPATCH:
        type: choice
        description: "KernelPatch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None    
      LXCDOCKERSUPPORT:
        type: choice
        description: "Linux Container Support *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Enabling Termux LXC / Docker Support)"
        required: true
        default: DroidSpacesLXC-Inject
        options:
          - DroidSpacesLXC-Inject
          - None
      REKERNEL:
        type: boolean
        description: "Re-Kernel Support"
        required: true
        default: true

      kernel_suffix:
        description: 'Kernel suffix (leave empty for default; do not add a leading hyphen, spaces, or other reserved characters that may affect command execution)'
        required: false
        type: string
        default: ""
        
permissions:
  actions: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest    
  
    env:
      # Cache Directories
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}      
      # Kernel Builds
      CCACHE_COMPILERCHECK: none
      CCACHE_NOHASHDIR: true
      CCACHE_NOHARDLINK: true
      # Kernel-Specific Optimization
      CCACHE_IS_KERNEL_COMPILING: true
      # Size
      CCACHE_MAXSIZE: 5G   
      TZ: Asia/Shanghai
    
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
   
    steps:
      - name: Maximize Build Space
        if: ${{ env.CLEANSPACE == 'Disabled' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192         # Keep 8Gib Free for OS / System
          temp-reserve-mb: 2048         # Keep 2Gib Free in Temporary Directories
          remove-dotnet: true           # Remove .NET SDKs to Free Space
          remove-android: true          # Remove Pre-Installed Android SDKs
          remove-haskell: true          # Remove Haskell Tool Chains
          remove-codeql: true           # Remove CodeQL to Free Space

      - name: Install Dependencies
        run: |
          set -euo pipefail

          sudo apt-mark hold firefox
          sudo apt-mark hold libc-bin
          sudo apt purge -y man-db
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libdw-dev

          echo "Dependencies Installed Successfully"

          # Install CCache 4.12.2
          echo "Installing CCache 4.12.2..."
          wget \
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64" \
            -O ccache
          sudo install -m 0755 ccache /usr/bin/ccache
          rm -f ccache
          echo "ccache version:"
          ccache --version

      - name: Git Identity
        shell: bash
        run: |      
          # Identity
          if ! git config --global user.name >/dev/null; then
            git config --global user.name "AndreiMikh"
          fi
          
          if ! git config --global user.email >/dev/null; then
            git config --global user.email "andreimikhail0088@gmail.com"
          fi

          WORKDIR="kernel_workspace"
          mkdir -p "$WORKDIR" || {
            echo "⚠️ Failed to Create Directory: $WORKDIR"
            exit 1
          }

          # Clone Branch
          echo ""
          echo "📥 Cloning Branch..."
          git clone --depth=1 \
            -b LiquidAndrei \
            https://github.com/AndreiMikh/AndreiMikh-Kernel-Lab.git \
            "$WORKDIR/AndreiMikh-Kernel-Lab"

          echo "⚙️ Branch Cloned Successfully"
          ls -la "$WORKDIR/AndreiMikh-Kernel-Lab"
      
          echo ""
          echo "🎉 Directory Created and Git Configuration Applied:"
          git config --global --list

      - name: Initialize Kernel Source
        run: |
          set -euo pipefail

          WS="${GITHUB_WORKSPACE}/kernel_workspace"

          rm -rf "$WS"
          mkdir -p "$WS"
          cd "$WS"

          echo "Current Repository: $GITHUB_REPOSITORY"
          echo "Current Branch: $GITHUB_REF_NAME"
          echo "Cloning Kernel Source..."
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/android16-6.12-2025-06.zip" \
            -o common.zip
          unzip -q common.zip
          mv \
            "android_gki_kernel_common-android16-6.12-2025-06" \
            common
          rm -f common.zip
          echo "Kernel Source Initialized Successfully"
          echo "Removing Dirty suffix..."
          SCRIPTS=(
            "common/scripts/setlocalversion"
          )
          for f in "${SCRIPTS[@]}"; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done
     
          echo "Kernel Source Preparation Complete"

      - name: Initialize LLVM / Clang 19 Toolchain
        run: |
          set -euo pipefail

          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          cd "$WS"

          echo "Cloning LLVM/Clang 19 toolchain..."
          mkdir -p clang19
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip" \
            -o clang.zip
          unzip -q clang.zip -d clang19
          rm -f clang.zip

          echo "LLVM / Clang 19 Initialized Successfully"
          echo "Toolchain: LLVM-Clang19-r536225"
  
      - name: Configure ccache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV

          echo "Current disk space:"
          df -h

          echo "Current kernel version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi

          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: Restore ccache for Current Kernel Version
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: Download Public Prebuilt ccache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking local ccache status..."

          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "A valid local ccache was restored. Skipping public ccache download!"
            exit 0
          fi

          echo "Cache miss. Attempting to download the latest public ccache..."
          mkdir -p ${{ env.CCACHE_DIR }}

          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi

          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "Successfully downloaded $FILE_NAME. Extracting..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "Public ccache restored successfully!"
          else
            echo "No matching ccache file was found in the public cache. A full clean build will be performed..."
          fi

      - name: 🔧 Configure and Setup Compiler Cache
        if: ${{ env.BUILDCCACHE != 'Disabled' }}
        shell: bash
        run: |
          set -euo pipefail 

          # Ensure Cache Directory Exists (Global Cache Directory)
          mkdir -p "$CCACHE_DIR"

          # Check if Compiler Cache is Installed
          if ! command -v ccache >/dev/null 2>&1; then
            echo "⚠️ Compiler Cache Not Found 🛠️ Skipping Compiler Cache Setup"
            exit 0
          fi

          echo "🚀 Using Compiler Cache at $CCACHE_DIR..."          
          
          # Set Cache Size 
          ccache -M "${{ env.CCACHE_MAXSIZE }}"

          # Export Environment Configuration
          export CCACHE_COMPILERCHECK="${{ env.CCACHE_COMPILERCHECK }}" || echo "⚠️ Compiler Check Not Found"
          export CCACHE_BASEDIR="${{ env.CCACHE_BASEDIR }}" || echo "⚠️ Base Directory Not Found"
          export CCACHE_NOHASHDIR="${{ env.CCACHE_NOHASHDIR }}" || echo "⚠️ NoHash Directory Not Found"
          export CCACHE_NOHARDLINK="${{ env.CCACHE_NOHARDLINK }}" || echo "⚠️ Cache Hardlink Not Found"   
          export CCACHE_DIR="${{ env.CCACHE_DIR }}" || echo "⚠️ Cache Dir Not Found" 
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}" || echo "⚠️ Cache Max Size Not Found" 

          # Reset Statistics for this Build
          echo "🧾 Resetting Compiler Cache Statistics..."
          ccache -z

          # Show Initial Statistics
          echo ""
          echo "📊 Compiler Cache Statistics (Before Build):"
          ccache -s

      - name: 🔧 Kernel Version Setup
        shell: bash
        run: |
          set -Eeuo pipefail

          cd kernel_workspace/kernel_platform

          echo "📂 Working Directory: $(pwd)"

          # Resolve Kernel Common Directory
          echo "🔍 Locating Kernel Common Directory..."
          if [[ -f "./common/Makefile" ]]; then
            KCDIR="./common"
          elif [[ -f "./kernel_platform/common/Makefile" ]]; then
            KCDIR="./kernel_platform/common"
          else
            echo "⚠️ ERROR: Kernel Common Makefile Not Found"
            echo "📂 Nearby Makefiles:"
            find . -maxdepth 4 -name Makefile | head -20
            exit 1
          fi

          COMMONMAKEFILE="$KCDIR/Makefile"
          echo "🚀 Kernel Common Directory Found"
          echo "📌 Using Makefile: $COMMONMAKEFILE"
          echo ""

          # Detect Kernel Module Branch
          echo "🔍 Detecting Kernel Module Branch..."
          KERNELMODULE=""

          for cfg in \
            "$KCDIR/build.config.constants" \
            "$KCDIR/build.config.common"; do
            if [[ -f "$cfg" ]]; then
              TMPBRANCH=$(grep -m1 '^BRANCH=' "$cfg" | cut -d= -f2 || true)

              if [[ -n "${TMPBRANCH:-}" ]]; then
                KERNELMODULE="$TMPBRANCH"
                break
              fi
            fi
          done

          # Fallback Using ACK SHA
          if [[ -z "${KERNELMODULE:-}" && -n "${KERNELREPOSITORY:-}" \
            && -f "./$KERNELREPOSITORY/android/ACK_SHA" ]]; then
            KERNELMODULE=$(sed -n '2p' "./$KERNELREPOSITORY/android/ACK_SHA" \
              | awk -F'-' '{print $1"-"$2}')
          fi

          # Parse Kernel Module Information
          if [[ -n "${KERNELMODULE:-}" ]]; then
            ANDROIDVERSION="${KERNELMODULE%-*}"
            KERNELVERSION="${KERNELMODULE#*-}"

            echo "🚀 Kernel Module Detected"
            echo "📌 Kernel Module   : $KERNELMODULE"
            echo "📌 Android Version : $ANDROIDVERSION"
            echo "📌 Kernel Branch   : $KERNELVERSION"
          else
            echo "⚠️ Unable to Detect Kernel Module"

            KERNELMODULE="Unknown"
            ANDROIDVERSION="Unknown"
            KERNELVERSION="Unknown"
          fi

          # Read Actual Kernel Version
          echo ""
          echo "🧾 Reading Real Kernel Version..."
          VERSION=$(grep '^VERSION[[:space:]]*=' "$COMMONMAKEFILE" \
            | head -n1 | cut -d= -f2 | tr -d ' ')
          PATCHLEVEL=$(grep '^PATCHLEVEL[[:space:]]*=' "$COMMONMAKEFILE" \
            | head -n1 | cut -d= -f2 | tr -d ' ')

          # Extract Sublevel
          SUBLEVEL=$(grep '^SUBLEVEL[[:space:]]*=' "$COMMONMAKEFILE" \
            | head -n1 | cut -d= -f2 | tr -d ' ')

          # Fallback if Empty
          VERSION="${VERSION:-0}"
          PATCHLEVEL="${PATCHLEVEL:-0}"
          SUBLEVEL="${SUBLEVEL:-0}"

          # Validate Sublevel
          if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Sublevel Detected: $SUBLEVEL — Forcing 0"
            SUBLEVEL=0
          fi

          OGVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

          echo "📌 Kernel Version : $VERSION.$PATCHLEVEL"
          echo "📌 Kernel Sublevel: $SUBLEVEL"
          echo "📌 Original Kernel Version: $OGVERSION"

          # Optional Sublevel Override
          SUBLVLINPUT="${{ github.event.inputs.SUBLEVEL }}"

          if [[ -n "${SUBLVLINPUT:-}" ]]; then
            echo ""
            echo "🛠️ Updating Kernel Sublevel..."
            echo "📌 New Sublevel: $SUBLVLINPUT"

            if ! [[ "$SUBLVLINPUT" =~ ^[0-9]+$ ]]; then
              echo "⚠️ Invalid Custom Sublevel: $SUBLVLINPUT"
              exit 1
            fi

            sed -i \
              "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLVLINPUT/" \
              "$COMMONMAKEFILE"
          else
            echo "📌 No Custom Sublevel Provided"
          fi

          # Read Updated Kernel Version
          NEWVERSION=$(awk '
            /^VERSION[[:space:]]*=/ {v=$3}
            /^PATCHLEVEL[[:space:]]*=/ {p=$3}
            /^SUBLEVEL[[:space:]]*=/ {s=$3}
            END {print v "." p "." s}
          ' "$COMMONMAKEFILE")

          echo ""
          echo "📊 Final Kernel Version: $NEWVERSION"

          if [[ "$OGVERSION" != "$NEWVERSION" ]]; then
            echo "⚙️ Kernel Version Modified"
            echo "📌 $OGVERSION → $NEWVERSION"
          else
            echo "✔️ Kernel Version Unchanged"
          fi

          # Export Environment Variables
          echo ""
          echo "📤 Exporting Environment Variables..."

          {
            echo "SUBLEVEL=$SUBLEVEL"
            echo "KERNELMODULE=$KERNELMODULE"
            echo "ANDROIDVERSION=$ANDROIDVERSION"
            echo "KERNELVERSION=$KERNELVERSION"
            echo "FULLVERSION=$NEWVERSION"
            echo "KV1=$(echo "$KERNELVERSION" | cut -d. -f1)"
            echo "KV2=$(echo "$KERNELVERSION" | tr -d '.')"
            echo "KV3=$(echo "$NEWVERSION" | tr -d '.')"
            echo "KSHORTVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2)"
            echo "KSHORTPATCHVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2 | tr '.' '_')"
          } >> "$GITHUB_ENV"

          echo "🚀 Environment Variables Exported"

          echo ""
          echo "🎉 Kernel Version Setup Complete"

      - name: 🔧 Inject Custom Kernel Version Suffix
        if: ${{ github.event.inputs.SUFFIX != '' }}
        id: inject
        continue-on-error: true
        run: |
          cd kernel_workspace

          # Inputs
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          ANDROIDVERSION="${{ env.ANDROIDVERSION }}"
          
          echo "🚀 Injecting Custom Kernel Suffix: $SUFFIX"
          
          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do          
            [ -f "$path" ] || continue       
            echo "Processing: $path"
          
            # Remove Dirty Tags
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
          
            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "📌 New Set Local Version Format Detected"          
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${ANDROIDVERSION}-${SUFFIX}\"|" "$path"        
            elif grep -q 'echo "\$res"' "$path"; then
              echo "🛠️ Dynamically Injecting Custom Suffix"          
              if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                echo "⚠️ Note: Using Bazel may limit special characters, adjust script if compilation fails"
              fi
          
              tac "$path" | \
                sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | \
                tac > "$path.tmp"          
              mv "$path.tmp" "$path"          
            else
              echo "⚠️ Unknown Format: Appending Suffix Manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi
          
            chmod +x "$path"
          done

          echo "⚙️ Committing Suffix Modifications..."
          git add -A
          git commit -m "🎉 Inject Custom Kernel Suffix and Remove Dirty Tags"

      - name: Add KernelSU
        id: ksu_version
        run: |
          cd kernel_workspace

          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            echo "Configuring ReSukiSU..."
            echo "SukiSU source has been redirected to ReSukiSU because SukiSU has not been maintained for a long time and may no longer compile correctly, while ReSukiSU remains compatible with the SukiSU Manager..."

            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main

            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig

            cd ./KernelSU

            # Generate a custom version number based on commit count.
            # Fall back to 114514 if the command fails.
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)

            # Store version in GitHub environment variables
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "Configuring KernelSU Next..."

            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

            cd KernelSU-Next
            rm -rf .git

            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)

            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild

            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')

            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild

            # Add WildKSU Manager support to KernelSU Next
            cd ../common/drivers/kernelsu

            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true

          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "Configuring original KernelSU (tiann/KernelSU)..."

            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main

            cd ./KernelSU

            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)

            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild

          else
            echo "No built-in KernelSU selected. Skipping KernelSU configuration..."
          fi

      - name: Apply KernelSU & SUSFS Patches
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace

          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "Adding SUSFS patches..."

            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}

            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

            cd ./common
            patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true

            cd ..
          else
            echo "No built-in KernelSU selected. Skipping SUSFS configuration..."
          fi

          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "Adding SUSFS patch for original KernelSU (tiann/KernelSU)..."

            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/

            cd ./KernelSU
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          fi

      - name: Apply LZ4 1.10.0 & Zstd 1.5.7 Patches
        if: inputs.lz4_enable
        run: |
          echo "Adding LZ4 1.10.0 & Zstd 1.5.7 patches..."

          cd kernel_workspace

          git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR

          cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./common/
          cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./common/

          cd ./common

          patch -p1 < 001-lz4.patch || true
          patch -p1 < 002-zstd.patch || true

      - name: Apply LZ4KD Patch
        if: inputs.lz4kd_enable
        run: |
          echo "Adding LZ4KD patch..."

          cd kernel_workspace/common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/lz4kd.patch
          patch -p1 -F 3 < lz4kd.patch || true

      - name: Add SUSFS Configuration Options
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace

          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Add KSU & Other Configuration Options
        run: |
          cd kernel_workspace

          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig

          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          # Add support for Mountify (backslashxx/mountify)
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig

          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig

            # These options are used to compile ZRAM backends.
            # Enabling or disabling them does not affect kernel compilation.
            echo "CONFIG_ZRAM_BACKEND_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_BACKEND_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi

          # Enable O2 compiler optimization
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig

          # Disable defconfig validation
          sed -i 's/check_defconfig//' ./common/build.config.gki

          # Skip unnecessary installation of standard UAPI headers into usr/include
          # to reduce build time.
          echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig

          # Rust configuration for Kernel 6.12
          echo "CONFIG_RUST=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> ./common/arch/arm64/configs/gki_defconfig

          # Apply CVE-2026-43499 fix
          cd common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cve-2026-43499-rtmutex-6.12.patch
          patch -p1 -F 3 < cve-2026-43499-rtmutex-6.12.patch

      - name: Enable Extended Networking Configuration
        if: inputs.better_net
        run: |
          cd kernel_workspace

          # Enable extended Netfilter firewall matching and IP set support.
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig

          # Enable IP set framework and multiple data structures.
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig

          # Enable IPv6 NAT
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig

          # Some devices may display:
          # "There was a problem with your device. Contact your device manufacturer..."
          # after enabling CONFIG_IP6_NF_NAT due to VINTF compatibility rules.
          #
          # Apply a configuration patch that hides CONFIG_IP6_NF_NAT=y from the
          # final configuration while keeping the corresponding functionality compiled.
          cd common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: Add BBR and Additional TCP Congestion Control Algorithms
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "Adding BBR and additional TCP congestion control algorithms..."

            cd kernel_workspace

            # Enable advanced TCP congestion control framework (required).
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig

            ########################################################################
            # BBR:
            # A model-based congestion control algorithm that does not primarily
            # rely on packet loss or latency to determine congestion.
            #
            # BBR can provide high throughput, low latency, and better loss
            # tolerance. However, on mobile devices it may increase power usage
            # and heat due to continuous bandwidth/RTT probing and additional
            # CPU/radio activity.
            #
            # Mobile networks generally have smaller buffers, and BBR's probing
            # behavior may occasionally cause throughput fluctuations or latency
            # changes during network transitions such as Wi-Fi -> 5G.
            #
            # BBR may also be less fair when competing with loss-based algorithms
            # such as CUBIC.
            #
            # Therefore, although BBR can significantly reduce queueing latency
            # and improve bandwidth utilization, Android generally uses CUBIC as
            # the default because it provides a better balance of throughput,
            # stability, compatibility, and power efficiency.
            #
            # Consider carefully whether BBR is actually beneficial for your
            # particular mobile network usage.
            ########################################################################

            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig

            # CUBIC:
            # Android's default TCP congestion control algorithm.
            # Provides a good balance between throughput, stability,
            # compatibility, fairness, and power efficiency.
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig

            # VEGAS:
            # A delay-based congestion control algorithm that uses RTT increases
            # as an indication of congestion.
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig

            # New Vegas:
            # An improved version of Vegas with improved RTT measurement
            # and fairness when competing with Reno/CUBIC.
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig

            # Westwood+:
            # Uses ACK arrival rate to estimate bandwidth and dynamically adjust
            # the congestion window and slow-start threshold.
            # Particularly suitable for wireless networks.
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig

            # HTCP:
            # A loss-based algorithm using AIMD with RTT-dependent growth,
            # targeting high-speed/high-latency networks.
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig

            # TCP Brutal:
            # An aggressive bandwidth-oriented congestion control algorithm.
            # It attempts to maintain a high sending rate and can be useful for
            # high-loss networks, cloud gaming, streaming, and similar workloads.
            #
            # However, TCP Brutal requires applications to provide bandwidth
            # parameters for each TCP connection. Most Android applications do
            # not support this, so it should not be configured as the default.
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig

            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "Setting BBR as the default TCP congestion control algorithm..."
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "Setting CUBIC as the default TCP congestion control algorithm..."
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: Enable Droidspaces Container Support
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "Enabling Droidspaces container support..."

            cd kernel_workspace/common

            # Apply required Droidspaces container compatibility patch.
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_a16-6.12.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_a16-6.12.patch || true

            # Fix oplus_bsp_midas behavior to prevent boot crashes.
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true

            # Fix out-of-bounds access in the oplus_bsp_sched_assist array
            # that may cause random runtime crashes.
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ddl_hit_hook.patch
            patch -p1 -F 3 < ddl_hit_hook.patch || true

            # Apply NTSync compatibility patch.
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true

            # Enable kernel features required by Droidspaces containers.
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig

            # Untested options that may cause bugs:
            # echo "CONFIG_CGROUP_DEVICE=y" >> ./arch/arm64/configs/gki_defconfig
            # echo "CONFIG_CGROUP_PIDS=y" >> ./arch/arm64/configs/gki_defconfig
            # echo "CONFIG_FW_LOADER_COMPRESS=y" >> ./arch/arm64/configs/gki_defconfig
            # echo "CONFIG_BRIDGE_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
            # echo "CONFIG_NF_TABLES=y" >> ./arch/arm64/configs/gki_defconfig

            # Enable NTSync
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig

            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "Enabling extended container support..."

              # Enable virtual HCI device support.
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig

              # Enable systemd-coredump support.
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig

              # Add Lindroid EVDI DRM driver.
              # wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/${{ env.KERNEL_VERSION }}/droidspaces_patch/evdi_drm.patch
              # patch -p1 -F 3 < evdi_drm.patch || true
              # echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: Enable ADIOS I/O Scheduler
        if: inputs.adios_enable
        run: |
          echo "Enabling ADIOS I/O scheduler (combining deadline-oriented scheduling with adaptive latency control to reduce I/O latency)..."

          cd kernel_workspace

          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Enable Re-Kernel Support
        if: inputs.rekernel_enable
        run: |
          echo "Enabling Re-Kernel support (for use with Freezer, NoActive, and similar applications to improve background freezing)..."

          cd kernel_workspace

          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_REKERNEL_NETWORK=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Enable Kernel-Level Baseband Protection
        if: inputs.baseband_guard
        run: |
          echo "Enabling kernel-level baseband protection..."

          cd kernel_workspace

          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig

          cd ./common

          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash

          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: Set Kernel Name
        run: |
          cd kernel_workspace

          echo "Replacing kernel version suffix..."

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "Current kernel suffix: ${{ github.event.inputs.kernel_suffix }}"

            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done

            sudo sed -i 's/-4k/-${{ github.event.inputs.kernel_suffix }}/g' ./common/arch/arm64/configs/gki_defconfig

          else
            echo "Current kernel suffix: ${{ env.KERNEL_NAME }}"

            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$f"
            done

            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig
          fi

          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion

          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          WORKDIR="$(pwd)"

          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang19/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"

          export CLANG_DIR="$WORKDIR/kernel_workspace/clang19/bin"

          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          RUSTC_VERSION="$(rustc -V 2>/dev/null | head -n1)"
          BINDGEN_VERSION="$(bindgen --version 2>/dev/null | head -n1)"

          echo "Compiler information:"
          echo "Clang version: $CLANG_VERSION"
          echo "LLD version: $LLD_VERSION"
          echo "Rustc version: $RUSTC_VERSION"
          echo "Bindgen version: $BINDGEN_VERSION"

          pahole_version=$(pahole --version 2>/dev/null | head -n1)
          [ -z "$pahole_version" ] && echo "pahole version: not installed" || echo "pahole version: $pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"

          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so

          chmod 777 ./*.so

          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV

          SO_DIR=$(pwd)

          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          export REAL_CLANG_PATH="$WORKDIR/kernel_workspace/clang19/bin/clang"

          # Create CC wrapper
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache $REAL_CLANG_PATH "$@"' >> cc-wrapper

          # Create LD wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper

          # Test time interception
          echo "--- [Wrapper Test] Creating generic time interception test script ---"

          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper internal environment check completed."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh

          chmod +x test-wrapper.sh

          echo "--- [Wrapper Test] Testing date command ---"
          ./test-wrapper.sh date

          echo "--- [Wrapper Test] Testing stat command ---"
          ./test-wrapper.sh stat ./Makefile

          echo "--- [Wrapper Test] Test completed ---"

          chmod +x cc-wrapper ld-wrapper

          echo "--- Build start time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- Build start file timestamp ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          # Kernel 6.12 build configuration:
          #
          # 1. Remap physical paths.
          #
          # Kernel 6.12 introduces Rust code. The tool used to calculate
          # kernel symbol versions is now gendwarfksyms, which cannot correctly
          # preprocess absolute paths. Therefore, absolute paths must be remapped
          # to relative paths to prevent large-scale kernel symbol checksum errors.

          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")

          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."

          # 2. Declare Rust tools.
          #
          # Without these declarations, the Rust environment pre-check script
          # scripts/rust_is_available.sh may fail, preventing Rust compilation.

          export RUSTC="rustc"
          export BINDGEN="bindgen"
          export CC="clang"
          export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang19/lib"

          # 3. Configure KCFLAGS
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"

          export KCFLAGS

          # 4. Configure additional tools and options.
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export LD=ld.lld
          export HOSTLD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export AS=clang
          export READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          # 5. Run the official environment configuration script.
          source "./_setup_env.sh" 2>/dev/null || true

          # Remove unnecessary .NET, Android NDK, Haskell, and CodeQL runtimes
          # while the kernel is being built to free disk space without blocking
          # subsequent build steps.
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig &&
          export CC="$(pwd)/cc-wrapper" &&
          export LD="$(pwd)/ld-wrapper" &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" OBJCOPY="llvm-objcopy" O=out Image

          # Verify time interception after compilation.
          echo "--- Build end time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- Build end file timestamp ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          echo "Kernel build completed!"

          if [[ "${{ github.event.inputs.ccache_debug }}" == "true" ]]; then
            echo "Packaging ccache logs and debug information..."

            cd ..

            cp ./common/out/vmlinux.symvers ./vmlinux.symvers
            cp ./common/out/.config ./config

            zip -r9 debug.zip ccache.log config vmlinux.symvers
          fi

          echo "ccache status:"
          ccache -s

          echo "Disk space after build:"
          df -h

      - name: Save New ccache Cache
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: Apply KPM and Patch Kernel Image
        if: inputs.kpm_enable
        run: |
          echo "Applying KP-N and patching kernel image..."

          cd kernel_workspace/common/out/arch/arm64/boot

          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux

          chmod +x ./kptools-linux

          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage

          rm -f Image
          mv oImage Image

      - name: Clone AnyKernel3 and Package Kernel
        id: create_zip
        run: |
          cd kernel_workspace

          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi

          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi

          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi

          zip -r ../$AK3_NAME ./*

          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          # Add build information as an AnyKernel3 ZIP comment.
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "SUSFS: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPSet: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR & Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log

          zip -z ../$AK3_NAME < ./ak3.log

      - name: Upload ccache Debug Logs
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/debug.zip
          archive: false

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Download ZIP Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: Set Environment Variables
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi

          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV

          TAG_HEAD="OPPO-OnePlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV

          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="No built-in KSU"
          fi

          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Universal OPPO / OnePlus / Realme ${{ env.KSU_TYPENAME }} sm8850 Kernel | Build Information

          - Kernel version: ${{ env.FULL_VERSION }}
          - Build time: ${{ env.TIME_FORM }}
          - Device compatibility: Universal OPPO / OnePlus / Realme Snapdragon 8 Elite Gen 5 devices using the ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} kernel
          - Kernel source: AOSP official android16-6.12-2025-06 branch
          - KSU branch: ${{ env.KSU_TYPENAME }}
          - SUSFS support: ${{ github.event.inputs.susfs_enable }}
          - KPM support: ${{ github.event.inputs.kpm_enable }}
          - LZ4 support: ${{ github.event.inputs.lz4_enable }}
          - LZ4KD support: ${{ github.event.inputs.lz4kd_enable }}
          - Extended networking support: ${{ github.event.inputs.better_net }}
          - BBR / Brutal and other congestion control algorithms: ${{ github.event.inputs.bbr_enable }}
          - Droidspaces container support: ${{ github.event.inputs.droidspaces_enable }}
          - ADIOS I/O scheduler support: ${{ github.event.inputs.adios_enable }}
          - Re-Kernel support: ${{ github.event.inputs.rekernel_enable }}
          - Kernel-level baseband protection: ${{ github.event.inputs.baseband_guard }}

          - ReSukiSU Manager: https://github.com/cctv18/ReSukiSU_CI/releases
          - SukiSU Ultra Manager: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases
          - KernelSU Next Manager: https://github.com/KernelSU-Next/KernelSU-Next/releases
          - Original KernelSU Manager: https://github.com/tiann/KernelSU/releases

          ### ⏫️ Changelog

          - Updated ${{ env.KSU_TYPENAME }} to the latest version (${{ needs.build.outputs.ksuver }})
          - (Reserved)

          ### 📋 Installation Guide | 安装方法

          1. If your phone already has a third-party recovery such as TWRP, download the corresponding AnyKernel flashable ZIP, boot into recovery mode, flash the ZIP, and reboot the device.

          2. If your phone already has root access, you can install HorizonKernelFlasher and use it to flash the AnyKernel ZIP directly from Android:
             https://github.com/libxzr/HorizonKernelFlasher/releases

          3. If you are already using a SukiSU Ultra kernel and have updated the SukiSU Ultra Manager to the latest version, you can flash the AnyKernel ZIP directly through the SukiSU Ultra Manager.

          4. If you previously used a kernel with the LZ4KD patch, disable the ZRAM module before flashing a kernel without LZ4KD to avoid compatibility issues.

          5. Due to the KernelSU upstream meta-module changes, the latest KSU Manager versions (except KernelSU Next) require a meta-module for normal module mounting.

             Available meta-modules include:
             - meta overlayfs: https://github.com/KernelSU-Modules-Repo/meta-overlayfs
             - mountify: https://github.com/backslashxx/mountify
             - meta magicmount: https://github.com/7a72/meta-magic_mount/
             - meta magicmount rs: https://github.com/Tools-cx-app/meta-magic_mount/
             - hybrid mount: https://github.com/YuzakiKokuban/meta-hybrid_mount

             If this is your first time using KSU, or you have just upgraded from an older KSU Manager, install a meta-module first. Other modules that rely on system mounting may not work correctly without one.

          6. KernelPatch Next (KPN) is an independent KPM implementation that can run in any KSU/Magisk environment. It is not compatible with APatch and cannot be used together with the built-in KPM implementation of (Re)SukiSU.

             Before using KPN, make sure your kernel does not already contain or have an integrated KPM implementation/patch.

          #### ⚠️⚠️⚠️ Flashing a kernel involves risk!

          To prevent accidental device bricking, always back up critical boot partitions such as boot before flashing a kernel. Tools such as KernelFlasher can be used for backups:

          https://github.com/capntrips/KernelFlasher

          **Flash at your own risk. Make sure you have a known-good kernel or complete partition backup available before proceeding.**
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
