name: (New) Universal OPPO/OnePlus/Realme 6.12.23 GKI Kernel Quick Build
on:
  workflow_dispatch:
    inputs:
      ROOTENGINE:
        type: choice
        description: "KSU Manager"
        required: true
        default: ReSukiSU
        options:
         - KernelSU-Next
         - KernelSU
         - ReSukiSU
         - SukiSU-Ultra         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - KernelSU-Next-Dev-SUSFS
         - KernelSU-Main
         - ReSukiSU-Main
         - ReSukiSU-Dev
         - SukiSU-Ultra-Builtin
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Aug 3 07:07:07 UTC 2026"       
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "flamingsakura-hiyuki"   
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Revision (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""        
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12, SUSFS for OPlus Kernel Image (SUSFSOKI) / SUSFS for KernelSU (SUSFSKSU)"
        required: true
        default: GKI
        options:
          - OGKI
          - GKI
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Development Branch?"
        required: true
        default: false
      LSMBBG:
        type: boolean
        description: "Critical Partition Write Protection (Linux Security Module)"
        required: true
        default: true
      LXCDOCKERSUPPORT:
        type: choice
        description: "Linux Container Support *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Enabling Termux LXC / Docker Support)"
        required: true
        default: DroidSpacesLXC-Inject
        options:
          - DroidSpacesLXC-Inject
          - None
      NTSYNC:
        type: boolean
        description: "NTSync (Custom Synchronization Feature)"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Network Feature Extensions (NetFilter)"
        required: true
        default: true        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBRV1+BBRV3+ECN
        options:
          - BBRV1+ECN
          - BBRV1+BBRV3+ECN
          - BBRV1+ECN+Brutal
          - BBRV1+BBRV3+ECN+Brutal    
          - None       
      KERNELPATCH:
        type: choice
        description: "KernelPatch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None    
      REKERNEL:
        type: boolean
        description: "Re-Kernel Support"
        required: true
        default: true
      LZ4UPDATE:
        type: choice
        description: "LZ4 1.10.0 / ZSTD 1.5.7?"
        required: false
        default: LZ4-1.10.0-Patch-Update
        options:
          - LZ4-1.10.0-Patch-Update
          - None       
      CLEANSPACE:
        type: boolean
        description: "Clean Build Space"
        required: true
        default: true
permissions:
  actions: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest    
  
    env:
      # Cache Directories
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}      
      # Kernel Builds
      CCACHE_COMPILERCHECK: none
      CCACHE_NOHASHDIR: true
      CCACHE_NOHARDLINK: true
      # Kernel-Specific Optimization
      CCACHE_IS_KERNEL_COMPILING: true
      # Size
      CCACHE_MAXSIZE: 5G   
      TZ: Asia/Shanghai
    
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
   
    steps:
      - name: Maximize Build Space
        if: ${{ github.event.inputs.CLEANSPACE == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192         # Keep 8Gib Free for OS / System
          temp-reserve-mb: 2048         # Keep 2Gib Free in Temporary Directories
          remove-dotnet: true           # Remove .NET SDKs to Free Space
          remove-android: true          # Remove Pre-Installed Android SDKs
          remove-haskell: true          # Remove Haskell Tool Chains
          remove-codeql: true           # Remove CodeQL to Free Space

      - name: Install Dependencies
        run: |
          set -euo pipefail

          sudo apt-mark hold firefox
          sudo apt-mark hold libc-bin
          sudo apt purge -y man-db
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            python-is-python3 \
            libssl-dev \
            libelf-dev \
            libdw-dev

          echo "Dependencies Installed Successfully"

          # Install CCache 4.12.2
          echo "Installing CCache 4.12.2..."
          wget \
            "https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64" \
            -O ccache
          sudo install -m 0755 ccache /usr/bin/ccache
          rm -f ccache
          echo "ccache version:"
          ccache --version

      - name: Git Identity
        shell: bash
        run: |      
          # Identity
          if ! git config --global user.name >/dev/null; then
            git config --global user.name "AndreiMikh"
          fi
          
          if ! git config --global user.email >/dev/null; then
            git config --global user.email "andreimikhail0088@gmail.com"
          fi

          WORKDIR="kernel_workspace"
          mkdir -p "$WORKDIR" || {
            echo "⚠️ Failed to Create Directory: $WORKDIR"
            exit 1
          }

          # Clone Branch
          echo ""
          echo "📥 Cloning Branch..."
          git clone --depth=1 \
            -b LiquidAndrei \
            https://github.com/AndreiMikh/AndreiMikh-Kernel-Lab.git \
            "$WORKDIR/AndreiMikh-Kernel-Lab"

          echo "⚙️ Branch Cloned Successfully"
          ls -la "$WORKDIR/AndreiMikh-Kernel-Lab"
      
          echo ""
          echo "🎉 Directory Created and Git Configuration Applied:"
          git config --global --list

      - name: Initialize Kernel Source
        run: |
          set -euo pipefail

          WS="${GITHUB_WORKSPACE}/kernel_workspace"

          rm -rf "$WS"
          mkdir -p "$WS"
          cd "$WS"

          echo "Current Repository: $GITHUB_REPOSITORY"
          echo "Current Branch: $GITHUB_REF_NAME"
          echo "Cloning Kernel Source..."
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/android16-6.12-2025-06.zip" \
            -o common.zip
          unzip -q common.zip
          mv \
            "android_gki_kernel_common-android16-6.12-2025-06" \
            common
          rm -f common.zip
          echo "Kernel Source Initialized Successfully"
          echo "Removing Dirty suffix..."
          SCRIPTS=(
            "common/scripts/setlocalversion"
          )
          for f in "${SCRIPTS[@]}"; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done
     
          echo "Kernel Source Preparation Complete"

      - name: Initialize LLVM / Clang 19 Toolchain
        run: |
          set -euo pipefail

          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          cd "$WS"

          echo "Cloning LLVM/Clang 19 toolchain..."
          mkdir -p clang19
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip" \
            -o clang.zip
          unzip -q clang.zip -d clang19
          rm -f clang.zip

          echo "LLVM / Clang 19 Initialized Successfully"
          echo "Toolchain: LLVM-Clang19-r536225"
  
      - name: Configure ccache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV

          echo "Current disk space:"
          df -h

          echo "Current kernel version: ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi

          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: Restore ccache for Current Kernel Version
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: Download Public Prebuilt ccache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking local ccache status..."

          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "A valid local ccache was restored. Skipping public ccache download!"
            exit 0
          fi

          echo "Cache miss. Attempting to download the latest public ccache..."
          mkdir -p ${{ env.CCACHE_DIR }}

          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi

          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "Successfully downloaded $FILE_NAME. Extracting..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "Public ccache restored successfully!"
          else
            echo "No matching ccache file was found in the public cache. A full clean build will be performed..."
          fi

      - name: 🔧 Configure and Setup Compiler Cache
        if: ${{ env.BUILDCCACHE != 'Disabled' }}
        shell: bash
        run: |
          set -euo pipefail 

          # Ensure Cache Directory Exists (Global Cache Directory)
          mkdir -p "$CCACHE_DIR"

          # Check if Compiler Cache is Installed
          if ! command -v ccache >/dev/null 2>&1; then
            echo "⚠️ Compiler Cache Not Found 🛠️ Skipping Compiler Cache Setup"
            exit 0
          fi

          echo "🚀 Using Compiler Cache at $CCACHE_DIR..."          
          
          # Set Cache Size 
          ccache -M "${{ env.CCACHE_MAXSIZE }}"

          # Export Environment Configuration
          export CCACHE_COMPILERCHECK="${{ env.CCACHE_COMPILERCHECK }}" || echo "⚠️ Compiler Check Not Found"
          export CCACHE_BASEDIR="${{ env.CCACHE_BASEDIR }}" || echo "⚠️ Base Directory Not Found"
          export CCACHE_NOHASHDIR="${{ env.CCACHE_NOHASHDIR }}" || echo "⚠️ NoHash Directory Not Found"
          export CCACHE_NOHARDLINK="${{ env.CCACHE_NOHARDLINK }}" || echo "⚠️ Cache Hardlink Not Found"   
          export CCACHE_DIR="${{ env.CCACHE_DIR }}" || echo "⚠️ Cache Dir Not Found" 
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}" || echo "⚠️ Cache Max Size Not Found" 

          # Reset Statistics for this Build
          echo "🧾 Resetting Compiler Cache Statistics..."
          ccache -z

          # Show Initial Statistics
          echo ""
          echo "📊 Compiler Cache Statistics (Before Build):"
          ccache -s

      - name: Detect Kernel Version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
      
          cd "${GITHUB_WORKSPACE}/kernel_workspace"
      
          echo "📂 Working Directory: $(pwd)"
          echo "📁 Kernel Workspace:"
          find . -maxdepth 2 -type d | sort
      
          # Resolve Google GKI Common Kernel Directory
          if [[ -f "./common/Makefile" ]]; then
            KCDIR="./common"
          else
            echo "ERROR: Google GKI Common / Directory Not Found"
            echo
            echo "Available directories:"
            find . -maxdepth 3 -type d | sort
            echo
            echo "Available Makefiles:"
            find . -maxdepth 4 -name Makefile -print
            exit 1
          fi
      
          COMMONMAKEFILE="${KCDIR}/Makefile"
      
          echo "🚀 Kernel Common Directory Found"
          echo "📌 KCDIR: ${KCDIR}"
          echo "📌 Makefile: ${COMMONMAKEFILE}"
      
          # Detect Branch / Kernel Module
          BRANCH=""
      
          if [[ -f "${KCDIR}/build.config.constants" ]]; then
            BRANCH=$(grep -m1 '^BRANCH=' \
              "${KCDIR}/build.config.constants" |
              cut -d'=' -f2- |
              tr -d '"' |
              xargs || true)
          fi
      
          if [[ -z "${BRANCH}" && -f "${KCDIR}/build.config.common" ]]; then
            BRANCH=$(grep -m1 '^BRANCH=' \
              "${KCDIR}/build.config.common" |
              cut -d'=' -f2- |
              tr -d '"' |
              xargs || true)
          fi
      
          if [[ -z "${BRANCH}" ]]; then
            echo "⚠️ BRANCH not found in build config"
          else
            echo "🌿 Kernel Branch: ${BRANCH}"
          fi
      
          # Kernel Version Information
          VERSION=$(awk -F= '
            /^[[:space:]]*VERSION[[:space:]]*=/ {
              gsub(/[[:space:]]/, "", $2)
              print $2
              exit
            }
          ' "$COMMONMAKEFILE")
      
          PATCHLEVEL=$(awk -F= '
            /^[[:space:]]*PATCHLEVEL[[:space:]]*=/ {
              gsub(/[[:space:]]/, "", $2)
              print $2
              exit
            }
          ' "$COMMONMAKEFILE")
      
          SUBLEVEL=$(awk -F= '
            /^[[:space:]]*SUBLEVEL[[:space:]]*=/ {
              gsub(/[[:space:]]/, "", $2)
              print $2
              exit
            }
          ' "$COMMONMAKEFILE")
      
          if [[ -z "${VERSION}" || -z "${PATCHLEVEL}" || -z "${SUBLEVEL}" ]]; then
            echo "Failed to Detect Kernel Version"
            echo "VERSION=${VERSION:-<Empty>}"
            echo "PATCHLEVEL=${PATCHLEVEL:-<Empty>}"
            echo "SUBLEVEL=${SUBLEVEL:-<Empty>}"
            exit 1
          fi
      
          KERNELVERSION="${VERSION}.${PATCHLEVEL}"
          FULLVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
      
          echo "🐧 Kernel Version: ${FULLVERSION}"
      
          # Android / Kernel Branch
          KERNELMODULE="${BRANCH:-}"
      
          if [[ -n "${KERNELMODULE}" && "${KERNELMODULE}" == *-* ]]; then
            ANDROIDVERSION="${KERNELMODULE%%-*}"
            KERNELBRANCHVERSION="${KERNELMODULE#*-}"
          else
            ANDROIDVERSION=""
            KERNELBRANCHVERSION="${KERNELVERSION}"
          fi
      
          # Extract only X.Y from branch version such as:
          # 6.12-2025-06
          KERNELBRANCHVERSION=$(echo "${KERNELBRANCHVERSION}" |
            grep -oE '^[0-9]+\.[0-9]+' || true)      
          [[ -n "${KERNELBRANCHVERSION}" ]] || KERNELBRANCHVERSION="${KERNELVERSION}"
      
          # Short Versions
          KV1="${VERSION}"
          KV2="${PATCHLEVEL}"
          KV3="${SUBLEVEL}"
      
          KSHORTVERSION="${KV1}.${KV2}"
          KSHORTPATCHVERSION="${KV1}.${KV2}.${KV3}"
      
          echo "Kernel Information"
          echo "Android Version : ${ANDROIDVERSION}"
          echo "Kernel Branch   : ${KERNELBRANCHVERSION}"
          echo "Kernel Version  : ${KSHORTVERSION}"
          echo "Full Version    : ${KSHORTPATCHVERSION}"
          echo "Branch          : ${BRANCH}"
          
          # Export
          {
            echo "VERSION=${VERSION}"
            echo "PATCHLEVEL=${PATCHLEVEL}"
            echo "SUBLEVEL=${SUBLEVEL}"
            echo "ANDROIDVERSION=${ANDROIDVERSION}"
            echo "KERNELMODULE=${KERNELMODULE}"
            echo "KERNELVERSION=${KERNELBRANCHVERSION}"
            echo "FULLVERSION=${FULLVERSION}"
            echo "KV1=${KV1}"
            echo "KV2=${KV2}"
            echo "KV3=${KV3}"
            echo "KSHORTVERSION=${KSHORTVERSION}"
            echo "KSHORTPATCHVERSION=${KSHORTPATCHVERSION}"
          } >> "${GITHUB_ENV}"

      - name: 🔧 Inject Custom Kernel Suffix
        if: ${{ github.event.inputs.SUFFIX != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
      
          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          SETLOCALVERSION="${KDIR}/scripts/setlocalversion"
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
      
          echo "🚀 Injecting Custom Kernel Suffix..."
          echo "📌 Suffix: ${SUFFIX}"
          echo "📂 Kernel Directory: ${KDIR}"
          echo "📄 SetLocalVersion: ${SETLOCALVERSION}"
      
          if [[ ! -d "$KDIR" ]]; then
            echo "Kernel Directory Not Found: $KDIR"
            exit 1
          fi
      
          if [[ ! -f "$SETLOCALVERSION" ]]; then
            echo "SetLocalVersion Not Found: $SETLOCALVERSION"
            exit 1
          fi
      
          cd "$KDIR"
      
          chmod +x "$SETLOCALVERSION"      
          echo "🧹 Removing Existing Dirty Suffix Handling..."
          sed -i 's/ -dirty//g' "$SETLOCALVERSION"      
          echo "🧹 Removing Previous Custom Suffix Injection..."
          sed -i '/# Kernel Custom Suffix Injection/,+2d' "$SETLOCALVERSION"
          echo "🔎 Detecting SetLocalVersion Format..."      
          if grep -q 'scm_version' "$SETLOCALVERSION"; then
            echo "📌 Detected SCM Version Format"
          elif grep -qE '^[[:space:]]*res=' "$SETLOCALVERSION"; then
            echo "📌 Detected Res Format"
          else
            echo "Unknown SetLocalVersion Format"
            echo "📄 File: $SETLOCALVERSION"
            exit 1
          fi
      
          echo "🔧 Injecting Kernel Suffix..."      
          sed -i "\$s|echo .*|echo \"\${KERNELVERSION}-${SUFFIX}\"|" "$SETLOCALVERSION"      
          chmod +x "$SETLOCALVERSION"      
          echo "🔎 Verifying Suffix Injection..."      
          if tail -n 1 "$SETLOCALVERSION" | grep -qF -- "-${SUFFIX}"; then
            echo "✔️ Suffix Injection Verified"
          else
            echo "Suffix Injection Verification Failed"
            echo
            echo "📄 Last 10 Lines:"
            tail -n 10 "$SETLOCALVERSION"
            exit 1
          fi
      
          echo "📝 Modified File:"
          tail -n 10 "$SETLOCALVERSION"
          echo "⚙️ Committing Suffix Modification..."
          git add -- scripts/setlocalversion
          if git diff --cached --quiet; then
            echo "ℹ️ No Changes to Commit"
          else
            git commit -m "🎉 Inject Custom Kernel Suffix"
          fi
      
          echo "🎉 Custom Kernel Suffix Injection Complete"

      - name: Auto-Generated Kernel Suffix
        if: ${{ github.event.inputs.SUFFIX == '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
      
          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          SETLOCALVERSION="${KDIR}/scripts/setlocalversion"      
          echo "🚀 Generating Random Kernel Suffix..."
      
          RANDOMDIGIT=$((RANDOM % 10))
          RANDOMHASH=$(head -c 4 /dev/urandom | xxd -p | cut -c1-7)
          AUTOSUFFIX="${RANDOMDIGIT}-g${RANDOMHASH}"      
          echo "🧾 Generated Suffix: ${AUTOSUFFIX}"
          echo "📂 Kernel Directory: ${KDIR}"
          echo "📄 SetLocalVersion: ${SETLOCALVERSION}"      
          if [[ ! -d "$KDIR" ]]; then
            echo "Kernel Directory Not Found: $KDIR"
            exit 1
          fi
      
          if [[ ! -f "$SETLOCALVERSION" ]]; then
            echo "SetLocalVersion Not Found: $SETLOCALVERSION"
            exit 1
          fi
      
          cd "$KDIR"      
          chmod +x "$SETLOCALVERSION"      
          echo "🧹 Removing Existing Dirty Suffix Handling..."
          sed -i 's/ -dirty//g' "$SETLOCALVERSION"      
          echo "🧹 Removing Previous Auto Suffix Injection..."
          sed -i '/# Kernel Auto Suffix Injection/,+2d' "$SETLOCALVERSION"
          echo "🔎 Detecting SetLocalVersion Format..."      
          if grep -q 'scm_version' "$SETLOCALVERSION"; then
            echo "📌 Detected SCM Version Format"
          elif grep -qE '^[[:space:]]*res=' "$SETLOCALVERSION"; then
            echo "📌 Detected Res Format"
          else
            echo "Unknown SetLocalVersion Format"
            echo "📄 File: $SETLOCALVERSION"
            exit 1
          fi
      
          echo "🔧 Injecting Auto-Generated Suffix..."      
          sed -i "\$s|echo .*|echo \"\${KERNELVERSION}-${AUTOSUFFIX}\"|" "$SETLOCALVERSION"      
          chmod +x "$SETLOCALVERSION"
          echo "🔎 Verifying Auto Suffix Injection..."      
          if tail -n 1 "$SETLOCALVERSION" | grep -qF -- "-${AUTOSUFFIX}"; then
            echo "✔️ Auto Suffix Injection Verified"
          else
            echo "Auto Suffix Injection Verification Failed"
            echo
            tail -n 10 "$SETLOCALVERSION"
            exit 1
          fi

          echo "📝 Modified File:"
          tail -n 10 "$SETLOCALVERSION"
          echo "⚙️ Committing Auto Suffix Modification..."      
          git add -- scripts/setlocalversion      
          if git diff --cached --quiet; then
            echo "ℹ️ No Changes to Commit"
          else
            git commit -m "🎉 Apply Auto-Generated Kernel Suffix"
          fi
      
          echo "🎉 Auto-Generated Kernel Suffix Complete"

      - name: 🔧 Solve Root Engine Source
        id: manager
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"

          MANAGERBRANCH=""
          BRANCHPATH=""
          MANAGERARTIFACT=""
          KSUREPO=""

          # Resolve Root Source
          case "$ROOTBRANCHSOURCE" in
            SukiSU-Ultra-Builtin)
              MANAGERBRANCH="main"
              BRANCHPATH="builtin"
              MANAGERARTIFACT="manager"
              ;;
            KernelSU-Next-Dev-SUSFS)
              MANAGERBRANCH="dev-susfs"
              BRANCHPATH="pershoot/KernelSU-Next"
              MANAGERARTIFACT="manager"
              ;;
            KernelSU-Next-Dev)
              MANAGERBRANCH="dev"
              BRANCHPATH="pershoot/KernelSU-Next"
              MANAGERARTIFACT="manager-spoofed"
              ;;
            KernelSU-Main)
              MANAGERBRANCH="main"
              BRANCHPATH="tiann/KernelSU"
              MANAGERARTIFACT="manager"
              ;;
            ReSukiSU-Main)
              MANAGERBRANCH="main"
              BRANCHPATH="ReSukiSU/ReSukiSU"
              MANAGERARTIFACT="Manager-release"
              ;;
            ReSukiSU-Dev)
              MANAGERBRANCH="dev"
              BRANCHPATH="ReSukiSU/ReSukiSU"
              MANAGERARTIFACT="Manager-release"
              ;;
            *)
              echo "⚠️ Unsupported Root Source: $ROOTBRANCHSOURCE"
              exit 1
              ;;
          esac

          # Resolve Root Engine Repository
          case "$ROOTENGINE" in
            SukiSU-Ultra)
              KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
              ;;
            KernelSU-Next)
              KSUREPO="KernelSU-Next/KernelSU-Next"
              ;;
            ReSukiSU)
              KSUREPO="ReSukiSU/ReSukiSU"
              ;;
            KernelSU)
              KSUREPO="tiann/KernelSU"
              ;;
            *)
              echo "⚠️ Unsupported Root Engine: $ROOTENGINE"
              exit 1
              ;;
          esac

          # Validate Resolution
          [[ -n "$MANAGERBRANCH" ]] || {
            echo "⚠️ Failed to Resolve Manager Branch"
            exit 1
          }
          [[ -n "$KSUREPO" ]] || {
            echo "⚠️ Failed to Resolve Root Engine Repository"
            exit 1
          }
          [[ -n "$BRANCHPATH" ]] || {
            echo "⚠️ Failed to Resolve Setup Repository"
            exit 1
          }
          {
            echo "MANAGERBRANCH=$MANAGERBRANCH"
            echo "BRANCHPATH=$BRANCHPATH"
            echo "MANAGERARTIFACT=$MANAGERARTIFACT"
            echo "KSUREPO=$KSUREPO"
          } >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "✔️ Root Engine Source Resolved"
          echo "📦 Engine     : $ROOTENGINE"
          echo "📂 Repository : $KSUREPO"
          echo "🌿 Branch     : $MANAGERBRANCH"
          echo "📁 Setup Repo : $BRANCHPATH"
          echo "📦 Artifact   : $MANAGERARTIFACT"
          echo "------------------------------"


      - name: 🔧 Configure Root Engine
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace"
          
          MANAGERBRANCH="${{ steps.manager.outputs.MANAGERBRANCH }}"
          BRANCHPATH="${{ steps.manager.outputs.BRANCHPATH }}"
          KSUREPO="${{ steps.manager.outputs.KSUREPO }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"
          SUSFS="${{ github.event.inputs.SUSFSREPOSITORY }}"
          
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          DEFCONFIG="${KCDIR}/arch/arm64/configs/gki_defconfig"

          # Helpers
          gitlatesttag() {
            local repo="$1"
            local tag
            tag="$(
              git ls-remote --tags --sort="v:refname" \
                "https://github.com/${repo}.git" 2>/dev/null \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -v '\^{}' \
              | tail -n1 \
              || true
            )"
            echo "${tag:-v0.0.0}"
          }
          getcommitcount() {
            git rev-list --count HEAD 2>/dev/null || echo 0
          }
          setupengine() {
            local repo="$1"
            local branch="$2"
            local argument="$3"
            echo "🔗 Setup Repository : $repo"
            echo "🌿 Setup Branch     : $branch"
            echo "📌 Setup Argument   : $argument"
            curl -fsSL \
              "https://raw.githubusercontent.com/${repo}/${branch}/kernel/setup.sh" \
              | bash -s -- "$argument"
          }

          # SukiSU-Ultra
          if [[ "$ROOTENGINE" == "SukiSU-Ultra" ]]; then
            echo "🚀 Setting Up SukiSU-Ultra..."
            setupengine \
              "$KSUREPO" \
              "$MANAGERBRANCH" \
              "$BRANCHPATH"
            cd KernelSU || {
              echo "⚠️ SukiSU-Ultra KernelSU Directory was Not Created"
              exit 1
            }

            GITHASH="$(git rev-parse --short HEAD)"
            COMMITCOUNT="$(getcommitcount)"
            echo "🌐 Fetching Latest Release Version..."
            KSU_VERSION_TAG="$(
              curl -fsSL \
                "https://api.github.com/repos/${KSUREPO}/releases/latest" \
              | grep '"tag_name":' \
              | sed -E 's/.*"tag_name":[[:space:]]*"v?([^"]+)".*/\1/' \
              | head -n1 \
              || true
            )"

            # Minimum supported fallback
            if [[ -z "$KSU_VERSION_TAG" ]] || \
              [[ "$(printf '%s\n' "$KSU_VERSION_TAG" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
              KSU_VERSION_TAG="3.1.7"
            fi

            VERSION_FULL="v${KSU_VERSION_TAG}-${GITHASH}@${BRANCHPATH}"

            {
              echo "KSU_VERSION_TAG=$KSU_VERSION_TAG"
              echo "KSU_API_VERSION=$KSU_VERSION_TAG"
            } >> "$GITHUB_ENV"

            echo "🏷️ Release Version : $KSU_VERSION_TAG"
            echo "🔖 Commit Hash     : $GITHASH"
            echo "📦 Full Version    : $VERSION_FULL"

            # Remove Old Custom Version Function
            sed -i \
              '/^define get_ksu_version_full$/,/^endef$/d' \
              kernel/Makefile

            # Set Full Version
            if grep -q '^KSU_VERSION_FULL := ' kernel/Makefile; then
              sed -i \
                "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $VERSION_FULL|" \
                kernel/Makefile
            else
              awk -v full="$VERSION_FULL" '
                /^REPO_OWNER :=/ && !done {
                  print
                  print ""
                  print "KSU_VERSION_FULL := " full
                  done=1
                  next
                }
                { print }
                END {
                  if (!done)
                    print "KSU_VERSION_FULL := " full
                }
              ' kernel/Makefile > kernel/Makefile.tmp

              mv kernel/Makefile.tmp kernel/Makefile
            fi

            # Set API Version
            if grep -q '^KSU_VERSION_API := ' kernel/Makefile; then
              sed -i \
                "s|^KSU_VERSION_API := .*|KSU_VERSION_API := $KSU_VERSION_TAG|" \
                kernel/Makefile
            else
              awk -v api="$KSU_VERSION_TAG" '
                /^KSU_VERSION_FULL :=/ && !done {
                  print
                  print "KSU_VERSION_API := " api
                  done=1
                  next
                }
                { print }
                END {
                  if (!done)
                    print "KSU_VERSION_API := " api
                }
              ' kernel/Makefile > kernel/Makefile.tmp
              mv kernel/Makefile.tmp kernel/Makefile
            fi

            # Preserve existing version scheme
            if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
              KSUVERSION=$((COMMITCOUNT + 37185))
            else
              KSUVERSION=50185
            fi

            {
              echo "KSUVERSION=$KSUVERSION"
              echo "KSUVER=$KSUVERSION"
            } >> "$GITHUB_ENV"
          
            echo "🔢 KSU Version      : $KSUVERSION"
            echo "🎉 SukiSU-Ultra Ready"

          # ReSukiSU
          elif [[ "$ROOTENGINE" == "ReSukiSU" ]]; then
            echo "🚀 Setting Up ReSukiSU..."
            setupengine \
              "$BRANCHPATH" \
              "$MANAGERBRANCH" \
              "$MANAGERBRANCH"
            cd KernelSU || {
              echo "⚠️ ReSukiSU Directory was Not Created"
              exit 1
            }

            CURRENTBRANCH="$(git branch --show-current || true)"
            CURRENTBRANCH="${CURRENTBRANCH:-HEAD}"
            COMMITCOUNT="$(getcommitcount)"
            if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
              KSUVERSION=$((COMMITCOUNT + 30700))
            else
              KSUVERSION=30700
            fi

            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"

            # Force Simple Tag-Based Full-Name Format
            if [[ -f "$DEFCONFIG" ]]; then
              sed -i '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG"
              printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"
            fi
           
            echo "🌿 Branch           : $CURRENTBRANCH"
            echo "🔢 KSU Version      : $KSUVERSION"
            echo "🎉 ReSukiSU Setup Complete"

          # KernelSU-Next
          elif [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
            echo "🚀 Setting Up KernelSU-Next..."
            setupengine \
              "$BRANCHPATH" \
              "$MANAGERBRANCH" \
              "$MANAGERBRANCH"
            cd KernelSU-Next || {
              echo "⚠️ KernelSU-Next Directory was Not Created"
              exit 1
            }
            
            COMMITCOUNT="$(getcommitcount)"
            if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
              KSUVERSION=$((COMMITCOUNT + 30000))
            else
              KSUVERSION=30000
            fi

            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"
            # Version Fallback
            if grep -q '^KSU_VERSION_FALLBACK := ' kernel/Kbuild; then
              sed -i \
                "s/^KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := $KSUVERSION/" \
                kernel/Kbuild
            fi

            # Tag fallback
            KSU_GIT_TAG="$(gitlatesttag "$KSUREPO")"
            if grep -q '^KSU_VERSION_TAG_FALLBACK := ' kernel/Kbuild; then
              sed -i \
                "s/^KSU_VERSION_TAG_FALLBACK := .*/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/" \
                kernel/Kbuild
            fi

            # KernelSU-Next SELinux Fix
            STATICSELINUX="kernel/feature/selinux_hide.c"
            if [[ -f "$STATICSELINUX" ]] && \
              grep -qE \
                '^static (int|void) security_(context_to_sid|sid_to_context|compute_av_user)_with_policy\(' \
                "$STATICSELINUX"; then
              perl -0777 -i -pe '
                s/^static int security_context_to_sid_with_policy\(/int security_context_to_sid_with_policy(/mg;
                s/^static int security_sid_to_context_with_policy\(/int security_sid_to_context_with_policy(/mg;
                s/^static void security_compute_av_user_with_policy\(/void security_compute_av_user_with_policy(/mg;
              ' "$STATICSELINUX"
              echo "✔️ KernelSU-Next SELinux Fix Applied"
            fi

            # SUSFS Inline Hook Mode
            if [[ "$SUSFS" != "-1" ]] && \
              [[ -f kernel/supercall/dispatch.c ]]; then
              perl -0777 -i -pe '
                s/#ifdef CONFIG_HAVE_SYSCALL_TRACEPOINTS.*?#endif/
                strscpy(cmd.mode, "Inline", sizeof(cmd.mode));
                /s
              ' kernel/supercall/dispatch.c
              echo "✔️ SUSFS Hook Mode Set to Inline"
            fi
            
            echo "🌿 Branch           : $MANAGERBRANCH"
            echo "🏷️ Latest Tag       : $KSU_GIT_TAG"
            echo "🔢 KSU Version      : $KSUVERSION"
            echo "🎉 KernelSU-Next Setup Complete"

          # KernelSU
          elif [[ "$ROOTENGINE" == "KernelSU" ]]; then
            echo "🚀 Setting Up KernelSU..."
            setupengine \
              "$BRANCHPATH" \
              "$MANAGERBRANCH" \
              "$MANAGERBRANCH"
            cd KernelSU || {
              echo "⚠️ KernelSU Directory was Not Created"
              exit 1
            }

            COMMITCOUNT="$(getcommitcount)"
            if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
              KSUVERSION=$((COMMITCOUNT + 30000))
            else
              KSUVERSION=30000
            fi

            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"
            # KernelSU version fallback
            if grep -q '^KSU_VERSION_FALLBACK := ' kernel/Kbuild; then
              sed -i \
                "s/^KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := $KSUVERSION/" \
                kernel/Kbuild
            fi

            # DKSU Version
            if grep -qE '^DKSU_VERSION[[:space:]]*=' kernel/Kbuild; then
              sed -i \
                -E \
                "s/^DKSU_VERSION[[:space:]]*=.*$/DKSU_VERSION=${KSUVERSION}/" \
                kernel/Kbuild
            fi
            
            echo "🌿 Branch           : $MANAGERBRANCH"
            echo "🔢 KSU Version      : $KSUVERSION"
            echo "🎉 KernelSU Setup Complete"
          else
            echo "⚠️ No Supported KSU Root Engine Selected"
            exit 1
          fi

          echo ""
          echo "------------------------------"
          echo "🎉 Root Engine Configuration Complete"
          echo "------------------------------"
          echo "📦 Engine     : $ROOTENGINE"
          echo "📂 Repository : $KSUREPO"
          echo "🌿 Branch     : $MANAGERBRANCH"
          echo "📁 Setup Repo : $BRANCHPATH"
          echo "📦 Version    : ${KSUVERSION:-Unknown}"
          echo "------------------------------"

      - name: 🔧 SUSFS Patches (Auto Official / Fallback)and Kernel Compatibility Patches
        if: ${{ github.event.inputs.SUSFSREPOSITORY != '-1' }}
        env:
          ROOTENGINE: ${{ github.event.inputs.ROOTENGINE }}
          SUSFSREPOSITORY: ${{ github.event.inputs.SUSFSREPOSITORY }}
          SUSFSVARIANT: ${{ github.event.inputs.SUSFSVARIANT }}
          SUSFSBRANCHDEV: ${{ github.event.inputs.SUSFSBRANCHDEV }}
          LZ4UPDATE: ${{ github.event.inputs.LZ4UPDATE }}
          ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
          KERNELVERSION: ${{ env.KERNELVERSION }}
          XUS: ${{ env.XUS }}
          KERNELMODULE: ${{ env.KERNELMODULE }}
          KV2: ${{ env.KV2 }}
          KV3: ${{ env.KV3 }}
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/kernel_workspace"

          # Check for Patch Reject Files
          checkrejects() {
            local SEARCHDIR="${1:-.}"
            local REJFILES         
            REJFILES=$(find "$SEARCHDIR" -name "*.rej" 2>/dev/null)
            [[ -z "$REJFILES" ]] && return 0
          
            while IFS= read -r REJFILE; do
              local ORIGFILE="${REJFILE%.rej}"
              ORIGFILE="${ORIGFILE#./}"          
              local FAILEDHUNKS
              FAILEDHUNKS=$(grep -c '^@@ ' "$REJFILE" 2>/dev/null)          
              echo "⚠️ Patch Reject Detected"
              echo "📝 Reject File  : $REJFILE"
              echo "📄 Target File  : $ORIGFILE"
              echo "⚠️ Failed Hunks : ${FAILEDHUNKS:-0}"
              echo
              cat "$REJFILE"
            done <<< "$REJFILES"
          }
          
          # Handle Patch Errors
          rejecthandler() {
            local EXITCODE=$?          
            trap - ERR          
            echo "⚠️ Patch Application Failed"
            echo "🔍 Scanning for Reject Files..."          
            checkrejects .          
            exit "$EXITCODE"
          }

          # Kernel Directory
          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          if [[ ! -d "$KDIR" ]]; then
            echo "ERROR: Google GKI Common Directory Not Found"
            echo "📂 Expected: $KDIR"
            exit 1
          fi

          if [[ ! -f "${KDIR}/Makefile" ]]; then
            echo "ERROR: Kernel Makefile Not Found"
            echo "📄 Expected: ${KDIR}/Makefile"
            exit 1
          fi

          # Save Absolute Kernel Directory
          KDIR="$(realpath "$KDIR")"
          echo "📂 Kernel Directory: $KDIR"

          # Build Derived Variables
          GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"          

          # Clone Required Patch Repositories
          echo "📥 Cloning Patch Dependencies..."                              
          # LZ4 / ZSTD Patch Sources
          case "$LZ4UPDATE" in
            "LZ4-1.10.0-Patch-Update")
              git clone --depth=1 \
                https://github.com/Numbersf/lz4_oplus.git
              ;;
          esac
             
          echo "✔️ Patch Repositories Cloned

          # Environment Information
          echo "🧾 Android Version       : $ANDROIDVERSION"
          echo "🧾 Kernel Version        : $KERNELVERSION"
          echo "🔎 Detected Kernel Base  : $GKIVERSION"
      
          # Clone SUSFS Repository
          echo "📥 Cloning SUSFS..."      
          BRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"      
          if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
            BRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"        
            if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
              BRANCH="${BRANCH}-dev"
            fi
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b "$BRANCH"      
          else           
            if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
              BRANCH="${BRANCH}-dev"
            fi
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b "$BRANCH"
          fi      
          echo "✔️ SUSFS Branch: $BRANCH"
      
          # Optional SUSFS Revision Checkout
          # Full or Short Commit Hashes
          cd susfs4ksu || exit 1
          
          # Skip if SUSFS Revision is Empty or Disabled (-1)
          if [[ -n "${SUSFSREPOSITORY:-}" && "${SUSFSREPOSITORY}" != "-1" ]]; then          
            echo "🔎 SUSFS Revision: $SUSFSREPOSITORY"          
            # Numeric Rollback Mode
            if [[ "$SUSFSREPOSITORY" =~ ^[0-9]+$ ]]; then          
              echo "📦 Fetching Additional Git History..."         
              # Deepen Unshallow Clone History
              git fetch --unshallow || git fetch --depth=1000 origin "$BRANCH"
          
              # Checkout Older SUSFS Revision
              git checkout "HEAD~$SUSFSREPOSITORY" || {
                echo "⚠️ Failed Checkout HEAD~$SUSFSREPOSITORY"
                exit 1
              }          
      
            else          
              # SUSFS Commit Hash / Tag / Branch Mode        
              # Detect SUSFS Commit Hash Format
              if [[ "$SUSFSREPOSITORY" =~ ^[0-9a-fA-F]{7,40}$ ]]; then              
                echo "📦 Expanding Shallow Clone History..."              
                # Fetch More History So Short Hashes Become Resolvable
                git fetch --unshallow origin || \
                git fetch --deepen=200 origin "$BRANCH"              
              fi
              
              # Checkout Requested SUSFS Revision
              git checkout "$SUSFSREPOSITORY" || {
                echo "⚠️ Invalid SUSFS Revision"
                exit 1
              }
            fi
          fi
          
          # Print Active Checked Out SUSFS Revision
          echo "✔️ Active SUSFS Commit: $(git rev-parse --short HEAD)" 

          # Detect SUSFS Version
          SUSFSVER="Unknown"         
          SUSFSHEADER="./kernel_patches/include/linux/susfs.h"       
          if [[ -f "$SUSFSHEADER" ]]; then
            SUSFSVER=$(
              awk -F'"' '/SUSFS_VERSION/ {print $2; exit}' "$SUSFSHEADER"
            )      
            SUSFSVER="${SUSFSVER:-Unknown}"
          fi       
          
          echo ""
          echo "📦 SUSFS Version: $SUSFSVER"
          echo "SUSFSVER=$SUSFSVER" >> "$GITHUB_ENV"
          
          cd ..
      
          # Find SUSFS Patches
          echo "🔎 Searching SUSFS Patches..."      
          shopt -s nullglob
          SUSFSPATCHLIST=(./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROIDVERSION}-${KERNELVERSION}*.patch)      
          if [[ ${#SUSFSPATCHLIST[@]} -eq 0 ]]; then
            echo "⚠️ No SUSFS Patch Found"
            ls ./susfs4ksu/kernel_patches/ || true
            exit 1
          fi      
          SUSFSPATCH="${SUSFSPATCHLIST[-1]}"

          echo "🧾 SUSFS Patch Directory: $SUSFSPATCH"
          echo ""
          if [[ "$SUSFSREPOSITORY" != "-1" ]]; then
            echo "📥 Copying SUSFS Patches..."  
            cp "$SUSFSPATCH" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
            cp -r ./susfs4ksu/kernel_patches/fs/* "$KDIR/fs/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
            cp -r ./susfs4ksu/kernel_patches/include/linux/* "$KDIR/include/linux/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
          fi

          # Navigate to Common Directory
          cd "$KDIR"

          # SUSFS Core Patch (50 SUSFS Patch)
          echo "⚙️ Applying SUSFS Core Patch (50 Add SUSFS Patch)"
          if patch -p1 < "$(basename "$SUSFSPATCH")"; then
            echo "✔️ SUSFS 50 Enable Core Patch Applied"
          else
            echo "⚠️ SUSFS Core Patch Already Applied or Failed"
          fi

          # SUSFS 10 Enable Patch for KernelSU (Only for KernelSU)
          if [[ "$ROOTENGINE" == "KernelSU" ]]; then
            echo "⚙️ Applying KernelSU SUSFS enable patch"
            if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
              PATCHBRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
            else
              PATCHBRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
            fi
            [[ "${SUSFSBRANCHDEV}" == "true" ]] && PATCHBRANCH="${PATCHBRANCH}-dev"
            case "$SUSFSVARIANT" in
              GKI)
                SUSFS10URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
                ;;
              OGKI)
                SUSFS10URL="https://raw.githubusercontent.com/cctv18/susfs4oki/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
                ;;
              *)
                echo "⚠️ Invalid SUSFS Variant"
                exit 1
                ;;
            esac

            # Verify the Patch URL Exists
            echo "🔍 Checking Patch URL..."
            if ! wget --spider "$SUSFS10URL"; then
              echo "⚠️ ERROR: Patch does Not Exist:"
              echo "$SUSFS10URL"
              exit 1
            fi

            echo "🌐 Downloading Patch: $SUSFS10URL"
            if ! wget "$SUSFS10URL" -O enable.patch; then
              echo "⚠️ ERROR: Failed to Download SUSFS Enable Patch"
              exit 1
            fi
            
            APPLIED=false
            # Save Current Directory
            ORIGDIR="$(pwd)"

            # KernelSU Source Directory
            KSUDIR="$(dirname "$KDIR")/KernelSU"
            echo "📂 Current Directory: $(pwd)"
            echo "🔧 Applying SUSFS Enable Patch..."
            
            if [[ ! -d "$KSUDIR" ]]; then
              echo "⚠️ ERROR: KernelSU Directory Not Found:"
              echo "   $KSUDIR"
              rm -f "$ORIGDIR/enable.patch"
              exit 1
            fi
          
            echo "📂 Entering KernelSU Directory..."
            cd "$KSUDIR" || exit 1
          
            echo "📂 Current Directory: $(pwd)"
            echo "🔧 Applying SUSFS Enable Patch..."
          
            if patch -p1 < "$ORIGDIR/enable.patch"; then
              APPLIED=true
              echo "✔️ SUSFS Enable Patch Applied Successfully"
            else
              echo "⚠️ SUSFS Enable Patch Is Not Compatible with This KernelSU Source Tree"
              echo "ℹ️ Skipping SUSFS Enable Patch"
            fi
          
            echo "📂 Returning to Original Directory..."
            cd "$ORIGDIR" || exit 1
          
            rm -f "$ORIGDIR/enable.patch"
          
            if [[ "$APPLIED" == "true" ]]; then
              echo "✔️ KernelSU SUSFS Enable Patch Completed"
            else
              echo "⚠️ KernelSU SUSFS Enable Patch Skipped"
            fi          
          else
            echo "⚠️ Skipping KernelSU SUSFS Enable Patch (Root = $ROOTENGINE)"
          fi

          # Verify Reject Files
          checkrejects .

          echo "🎉 SUSFS Patches Complete"

      - name: Apply LZ4 OPlus Patch Update
        if: ${{ github.event.inputs.LZ4UPDATE == 'LZ4-1.10.0-Patch-Update' }}
        shell: bash
        run: |
          set -Eeuo pipefail
      
          LZ4PATCHUPDATE="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"      
          echo "🚀 Running LZ4 Patch Update Script..."
          echo "📂 LZ4 Patch Directory: ${LZ4PATCHUPDATE}"    
          if [[ ! -d "$LZ4PATCHUPDATE" ]]; then
            echo "LZ4 Patch Directory Not Found"
            echo "📂 Expected: ${LZ4PATCHUPDATE}"
            exit 1
          fi
      
          LZ4SCRIPT="${LZ4PATCHUPDATE}/apply_lz4_oplus.sh"   
          if [[ ! -f "$LZ4SCRIPT" ]]; then
            echo "⚠️ LZ4 OPlus Shell Script File Not Found"
            echo "📄 Expected: ${LZ4SCRIPT}"
            exit 1
          fi
      
          chmod +x "$LZ4SCRIPT"      
          echo "⚙️ Executing LZ4 OPlus Patch Script..."     
          bash "$LZ4SCRIPT"
      
          echo "🎉 LZ4 OPlus Shell Script Completed Successfully"

      - name: 🔧 Linux Security Module Baseband Guard
        if: ${{ github.event.inputs.LSMBBG == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
      
          KDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          MAXRETRIES=3
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
      
          echo "🚀 Enabling Linux Security Module Baseband Guard..."
          echo "📂 Kernel Directory: ${KDIR}"
      
          if [[ ! -d "$KDIR" ]]; then
            echo "Kernel Directory Not Found"
            echo "📂 Expected: ${KDIR}"
            exit 1
          fi
      
          cd "$KDIR"      
          echo "➡️ Working Directory: $(pwd)"
          echo "🌐 Fetching Baseband Guard Setup Script..."    
          SETUPSUCCESS=false      
          for i in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL "$URLBBG" | bash -s -- main; then
              SETUPSUCCESS=true
              break
            fi      
            
            echo "⚠️ Download / Setup Failed, Retry ${i}/${MAXRETRIES}..."      
            if [[ "$i" -lt "$MAXRETRIES" ]]; then
              sleep 2
            fi
          done
      
          if [[ "$SETUPSUCCESS" != "true" ]]; then
            echo "Baseband Guard Setup Failed After ${MAXRETRIES} Attempts"
            exit 1
          fi
      
          echo "✔️ Baseband Guard Patch Script Applied"      
          echo "⚙️ Updating Linux Security Configuration..."      
          BBGCONFIGFILE="${KDIR}/security/Kconfig"
    
          if [[ ! -f "$BBGCONFIGFILE" ]]; then
            echo "Kernel Configuration File Not Found"
            echo "📄 Expected: ${BBGCONFIGFILE}"
            exit 1
          fi
      
          awk '
            BEGIN {
              in_lsm_block = 0
            }
      
            /^config LSM$/ {
              in_lsm_block = 1
              print
              next
            }
      
            in_lsm_block && /^[[:space:]]*default[[:space:]]/ {
              if ($0 !~ /baseband_guard/) {
                sub(/selinux/, "selinux,baseband_guard")
              }
              print
              next
            }
      
            in_lsm_block && /^[[:space:]]*config[[:space:]]/ {
              in_lsm_block = 0
            }
      
            {
              print
            }
          ' "$BBGCONFIGFILE" > "${BBGCONFIGFILE}.tmp"     
          mv "${BBGCONFIGFILE}.tmp" "$BBGCONFIGFILE"      
          echo "✔️ Linux Security Configuration Updated"      
          echo "🔎 Locating Baseband Guard Source..."      
          
          BBGPATHDIR=""      
          if [[ -L "${KDIR}/Baseband-guard" ]]; then
            BBGPATHDIR="$(readlink -f "${KDIR}/Baseband-guard")"
          elif [[ -d "${KDIR}/Baseband-guard" ]]; then
            BBGPATHDIR="${KDIR}/Baseband-guard"
          else
            BBGPATHDIR="$(
              find "$KDIR" \
                -maxdepth 3 \
                -type d \
                -iname "Baseband-guard" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi
      
          if [[ -z "$BBGPATHDIR" || ! -d "$BBGPATHDIR" ]]; then
            echo "Baseband Guard Directory Not Found"
            echo "⚠️ Baseband Guard Setup may have Failed"
            echo "📂 Searching Kernel Tree..."
            find "$KDIR" \
              -maxdepth 3 \
              -iname "*baseband*" \
              -print \
              2>/dev/null || true      
            exit 1
          fi
      
          echo "📂 Baseband Guard Directory: ${BBGPATHDIR}"     
          if [[ -f "${BBGPATHDIR}/baseband_guard.c" ]]; then
            echo "✔️ Baseband Guard Source Detected"
            echo "📄 ${BBGPATHDIR}/baseband_guard.c"
          else
            echo "⚠️ Baseband Guard C Not Found"
            echo
            echo "📂 Baseband Guard Directory Contents:"
            ls -la "$BBGPATHDIR" || true
            exit 1
          fi

          echo "🔎 Verifying Baseband Guard Configuration..."      
          if grep -q "baseband_guard" "$BBGCONFIGFILE"; then
            echo "✔️ Baseband Guard Found in Security/Kconfig"
          else
            echo "Baseband Guard Not Found in Security/Kconfig"
            exit 1
          fi
      
          echo "📊 Baseband Guard Status:"
          echo "📂 Kernel: ${KDIR}"
          echo "📄 Kconfig: ${BBGCONFIGFILE}"
          echo "📂 Source: ${BBGPATHDIR}"
      
          echo "🎉 Baseband Guard Fully Applied and Configured"

      - name: 🔧 DroidSpacesLXC Injection + Wild NT Synchonization (Primitives) Patches
        if: ${{ github.event.inputs.LXCDOCKERSUPPORT == 'DroidSpacesLXC-Inject' }}
        shell: bash
        env:
          KERNELMODULE: ${{ env.KERNELMODULE }}
        run: |
          set -euo pipefail

          # Paths
          NTSYNC="${{ github.event.inputs.NTSYNC }}"
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
          TARGETPATH="${GITHUB_WORKSPACE}/kernel_workspace/common"

          if [[ ! -d "$TARGETPATH" ]]; then
            echo "⚠️ Directory Not Found: $TARGETPATH"
            exit 1
          fi

          cd "$TARGETPATH"

          # Function: Patch Apply
          apply() {
            local patchfile="$1"
            if patch -R -p1 --dry-run < "$patchfile" >/dev/null 2>&1; then
              echo "🎉 Already Applied: $(basename "$patchfile")"
              return
            fi

            if patch -p1 --dry-run < "$patchfile" >/dev/null 2>&1; then
              patch -p1 --forward < "$patchfile"
              echo "✔️ Applied: $(basename "$patchfile")"
            else
              echo "⚠️ Failed Applying: $(basename "$patchfile")"
              exit 1
            fi
          }

          SCHEDFILE="include/linux/sched.h"
          USERFILE="include/linux/sched/user.h"

          if [[ ! -f "$SCHEDFILE" ]]; then
            echo "⚠️ Missing Scheduler Header File: $SCHEDFILE"
            exit 1
          fi
       
          echo "⚙️ Disabling Original System V IPC Struct Fields..."
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' "$SCHEDFILE"
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' "$SCHEDFILE"

          # Android 12.5.10 Special Handling
          if [ "${KERNELMODULE:-}" = "android12-5.10" ]; then
            echo "🔧 Fixing System V IPC Kernel ABI + POSIX MQUEUE ABI Padding for Android12-5.10..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' "$SCHEDFILE"
            sed -i 's/^\tunsigned long mq_bytes;/\/\/unsigned long mq_bytes;/' "$USERFILE"
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' "$USERFILE"

          # ABI Layout Detection (Shared Logic)
          elif grep -q "sched_dl_entity.*\*dl_server" "$SCHEDFILE"; then
            echo "♻️ Detected DL Server Pointer — ☘️ Using Packed Union Strategy"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_USE(1," "$SCHEDFILE"; then
            echo "♻️ Detected Kernel ABI USE(1) — ☘️ Using Slots 6, 7 and 8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_RESERVE(1);" "$SCHEDFILE"; then
            echo "♻️ Detected Legacy Kernel ABI — ☘️ Using Slots 1, 2 and 3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' "$SCHEDFILE"
          elif grep -q "ANDROID_KABI_RESERVE(3);" "$SCHEDFILE"; then
            echo "♻️ Fallback Kernel ABI Detected — ☘️ Using Slots 3, 4 and 5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' "$SCHEDFILE"
          else
            echo "⚠️ Unable to Determine Compatible Kernel ABI Layout — Aborting..."
            exit 9
          fi

          # Verification
          echo "🔎 Verifying Injection..."
          grep -q "struct sysv_sem" "$SCHEDFILE" || {
            echo "⚠️ Missing SYS V SEM Injection"
            exit 1
          }

          grep -q "struct sysv_shm" "$SCHEDFILE" || {
            echo "⚠️ Missing SYS V SHM Injection"
            exit 1
          }

          grep -q "CONFIG_SYSVIPC" "$SCHEDFILE" || {
            echo "⚠️ Missing Configuration SYS V IPC Guard"
            exit 1
          }

          echo "✔️ Injection Verification Passed"

          # Restore MIDAS Fix
          echo "🔧 Applying Ghost Task Fix Patch for OPlus BSP Midas..."
          apply "${PDIR}/001-Ghost-Task-Midas.patch"

          # Disable Rollback Protection Before Exit
          RESTORE=0        
          echo ""
          echo "🎉 DroidSpaces System V IPC Injection Completed Successfully"

          # NT Synchronization (NTSync) Primitives
          if [[ "${NTSYNC:-}" == "true" ]]; then
            echo "🧠 NTSync Enabled"

            # Validate Required Variables Early
            if [[ -z "${KERNELMODULE:-}" ]]; then
              echo "⚠️ Kernel Module Version is Not Set, Aborting..."
              exit 1
            fi

            echo "🔄 Target Kernel Module Version: $KERNELMODULE"

            # Android 16 / Kernel 6.12 Compatibility
            if [[ "${KERNELMODULE:-}" == "android16-6.12" ]]; then
              echo "🔧 Applying Android16-6.12 Compatibility Fixes..."
              
              # Remove Conflicting NT Synchronization Sources
              [[ -f include/uapi/linux/ntsync.h ]] && rm -f include/uapi/linux/ntsync.h
              [[ -f drivers/misc/ntsync.c ]] && rm -f drivers/misc/ntsync.c
              
              # Export IPC Namespace Symbols Safely (Avoid Duplicates)
              if ! grep -q "put_ipc_ns" ipc/namespace.c; then
                echo "EXPORT_SYMBOL_GPL(put_ipc_ns);" >> ipc/namespace.c
              fi
              
              if ! grep -q "init_ipc_ns" ipc/msgutil.c; then
                echo "EXPORT_SYMBOL_GPL(init_ipc_ns);" >> ipc/msgutil.c
              fi
            fi

            echo "🛠️ Applying NT Synchronization Patches..."
            # Define NT Synchronization Paths
            NTSYNCDIR="$GITHUB_WORKSPACE/kernel_workspace/WildKernels/common/ntsync"
            NTSYNCCOMPATPATCH="ntsync_compat_${KERNELMODULE}.patch"
            NTSYNCBASEPATCH="ntsync_base.patch"

            echo "📂 Patch Directory: $NTSYNCDIR"
            # Ensure Patch Repository Exists
            if [[ ! -d "$NTSYNCDIR" ]]; then
              echo "📥 NT Synchronization Patch Directory Missing, Cloning Repository..."
              rm -rf "$GITHUB_WORKSPACE/kernel_workspace/WildKernels"
              git clone --depth=1 \
                https://github.com/WildKernels/kernel_patches.git \
                "$GITHUB_WORKSPACE/kernel_workspace/WildKernels"
            fi

            if [[ ! -d "$NTSYNCDIR" ]]; then
              echo "⚠️ Failed to Locate NT Synchronization Patch Directory After Clone..."
              exit 1
            fi

            echo "📄 Available Patches:"
            ls -la "$NTSYNCDIR"
            # Function Patch Helper: Apply Patch
            applyntsyncpatch() {
              local ntsyncpatchfile="$1"
              if [[ ! -f "$NTSYNCDIR/$ntsyncpatchfile" ]]; then
                echo "⚠️ Missing Patch: $ntsyncpatchfile"
                return 0
              fi

              cp "$NTSYNCDIR/$ntsyncpatchfile" ./
              echo "➡️ Applying $ntsyncpatchfile"
              if ! patch -p1 < "$ntsyncpatchfile"; then
                echo "⚠️ Patch Failed: $ntsyncpatchfile"
                exit 1
              fi

              rm -f "$ntsyncpatchfile"
              echo "🧹 Cleaned: $ntsyncpatchfile"
            }

            # Apply Patches
            applyntsyncpatch "$NTSYNCCOMPATPATCH"
            applyntsyncpatch "$NTSYNCBASEPATCH"
            echo "☘️ NT Synchronization Patch Process Completed Successfully"
          fi

          echo ""
          echo "🎉 NT Synchronization (Primitives) Done!"

      - name: Build Kernel
        run: |
          WORKDIR="$(pwd)"

          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang19/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"

          export CLANG_DIR="$WORKDIR/kernel_workspace/clang19/bin"

          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          RUSTC_VERSION="$(rustc -V 2>/dev/null | head -n1)"
          BINDGEN_VERSION="$(bindgen --version 2>/dev/null | head -n1)"

          echo "Compiler information:"
          echo "Clang version: $CLANG_VERSION"
          echo "LLD version: $LLD_VERSION"
          echo "Rustc version: $RUSTC_VERSION"
          echo "Bindgen version: $BINDGEN_VERSION"

          pahole_version=$(pahole --version 2>/dev/null | head -n1)
          [ -z "$pahole_version" ] && echo "pahole version: not installed" || echo "pahole version: $pahole_version"

          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"

          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so

          chmod 777 ./*.so

          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV

          SO_DIR=$(pwd)

          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          export REAL_CLANG_PATH="$WORKDIR/kernel_workspace/clang19/bin/clang"

          # Create CC wrapper
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache $REAL_CLANG_PATH "$@"' >> cc-wrapper

          # Create LD wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper

          # Test time interception
          echo "--- [Wrapper Test] Creating generic time interception test script ---"

          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper internal environment check completed."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh

          chmod +x test-wrapper.sh

          echo "--- [Wrapper Test] Testing date command ---"
          ./test-wrapper.sh date

          echo "--- [Wrapper Test] Testing stat command ---"
          ./test-wrapper.sh stat ./Makefile

          echo "--- [Wrapper Test] Test completed ---"

          chmod +x cc-wrapper ld-wrapper

          echo "--- Build start time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- Build start file timestamp ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          # Kernel 6.12 build configuration:
          #
          # 1. Remap physical paths.
          #
          # Kernel 6.12 introduces Rust code. The tool used to calculate
          # kernel symbol versions is now gendwarfksyms, which cannot correctly
          # preprocess absolute paths. Therefore, absolute paths must be remapped
          # to relative paths to prevent large-scale kernel symbol checksum errors.

          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")

          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."

          # 2. Declare Rust tools.
          #
          # Without these declarations, the Rust environment pre-check script
          # scripts/rust_is_available.sh may fail, preventing Rust compilation.

          export RUSTC="rustc"
          export BINDGEN="bindgen"
          export CC="clang"
          export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang19/lib"

          # 3. Configure KCFLAGS
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"

          export KCFLAGS

          # 4. Configure additional tools and options.
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export LD=ld.lld
          export HOSTLD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export AS=clang
          export READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export OBJSIZE=llvm-size
          export STRIP=llvm-strip

          # 5. Run the official environment configuration script.
          source "./_setup_env.sh" 2>/dev/null || true

          # Remove unnecessary .NET, Android NDK, Haskell, and CodeQL runtimes
          # while the kernel is being built to free disk space without blocking
          # subsequent build steps.
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig &&
          export CC="$(pwd)/cc-wrapper" &&
          export LD="$(pwd)/ld-wrapper" &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" OBJCOPY="llvm-objcopy" O=out Image

          # Verify time interception after compilation.
          echo "--- Build end time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"

          echo "--- Build end file timestamp ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          echo "Kernel build completed!"

          if [[ "${{ github.event.inputs.ccache_debug }}" == "true" ]]; then
            echo "Packaging ccache logs and debug information..."

            cd ..

            cp ./common/out/vmlinux.symvers ./vmlinux.symvers
            cp ./common/out/.config ./config

            zip -r9 debug.zip ccache.log config vmlinux.symvers
          fi

          echo "ccache status:"
          ccache -s

          echo "Disk space after build:"
          df -h

      - name: Save New ccache Cache
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: Apply KPM and Patch Kernel Image
        if: inputs.kpm_enable
        run: |
          echo "Applying KP-N and patching kernel image..."

          cd kernel_workspace/common/out/arch/arm64/boot

          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux

          chmod +x ./kptools-linux

          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage

          rm -f Image
          mv oImage Image

      - name: Clone AnyKernel3 and Package Kernel
        id: create_zip
        run: |
          cd kernel_workspace

          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          cd AnyKernel3

          cp ../common/out/arch/arm64/boot/Image ./Image

          if [[ ! -f ./Image ]]; then
            echo "Kernel image not found. The build may have failed."
            exit 1
          fi

          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi

          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi

          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi

          zip -r ../$AK3_NAME ./*

          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          # Add build information as an AnyKernel3 ZIP comment.
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi

          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "SUSFS: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPSet: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR & Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log

          zip -z ../$AK3_NAME < ./ak3.log

      - name: Upload ccache Debug Logs
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/debug.zip
          archive: false

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Download ZIP Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: Set Environment Variables
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"

          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi

          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV

          TAG_HEAD="OPPO-OnePlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV

          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="No built-in KSU"
          fi

          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 Universal OPPO / OnePlus / Realme ${{ env.KSU_TYPENAME }} sm8850 Kernel | Build Information

          - Kernel version: ${{ env.FULL_VERSION }}
          - Build time: ${{ env.TIME_FORM }}
          - Device compatibility: Universal OPPO / OnePlus / Realme Snapdragon 8 Elite Gen 5 devices using the ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} kernel
          - Kernel source: AOSP official android16-6.12-2025-06 branch
          - KSU branch: ${{ env.KSU_TYPENAME }}
          - SUSFS support: ${{ github.event.inputs.susfs_enable }}
          - KPM support: ${{ github.event.inputs.kpm_enable }}
          - LZ4 support: ${{ github.event.inputs.lz4_enable }}
          - LZ4KD support: ${{ github.event.inputs.lz4kd_enable }}
          - Extended networking support: ${{ github.event.inputs.better_net }}
          - BBR / Brutal and other congestion control algorithms: ${{ github.event.inputs.bbr_enable }}
          - Droidspaces container support: ${{ github.event.inputs.droidspaces_enable }}
          - ADIOS I/O scheduler support: ${{ github.event.inputs.adios_enable }}
          - Re-Kernel support: ${{ github.event.inputs.rekernel_enable }}
          - Kernel-level baseband protection: ${{ github.event.inputs.baseband_guard }}

          - ReSukiSU Manager: https://github.com/cctv18/ReSukiSU_CI/releases
          - SukiSU Ultra Manager: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases
          - KernelSU Next Manager: https://github.com/KernelSU-Next/KernelSU-Next/releases
          - Original KernelSU Manager: https://github.com/tiann/KernelSU/releases

          ### ⏫️ Changelog

          - Updated ${{ env.KSU_TYPENAME }} to the latest version (${{ needs.build.outputs.ksuver }})
          - (Reserved)

          ### 📋 Installation Guide | 安装方法

          1. If your phone already has a third-party recovery such as TWRP, download the corresponding AnyKernel flashable ZIP, boot into recovery mode, flash the ZIP, and reboot the device.

          2. If your phone already has root access, you can install HorizonKernelFlasher and use it to flash the AnyKernel ZIP directly from Android:
             https://github.com/libxzr/HorizonKernelFlasher/releases

          3. If you are already using a SukiSU Ultra kernel and have updated the SukiSU Ultra Manager to the latest version, you can flash the AnyKernel ZIP directly through the SukiSU Ultra Manager.

          4. If you previously used a kernel with the LZ4KD patch, disable the ZRAM module before flashing a kernel without LZ4KD to avoid compatibility issues.

          5. Due to the KernelSU upstream meta-module changes, the latest KSU Manager versions (except KernelSU Next) require a meta-module for normal module mounting.

             Available meta-modules include:
             - meta overlayfs: https://github.com/KernelSU-Modules-Repo/meta-overlayfs
             - mountify: https://github.com/backslashxx/mountify
             - meta magicmount: https://github.com/7a72/meta-magic_mount/
             - meta magicmount rs: https://github.com/Tools-cx-app/meta-magic_mount/
             - hybrid mount: https://github.com/YuzakiKokuban/meta-hybrid_mount

             If this is your first time using KSU, or you have just upgraded from an older KSU Manager, install a meta-module first. Other modules that rely on system mounting may not work correctly without one.

          6. KernelPatch Next (KPN) is an independent KPM implementation that can run in any KSU/Magisk environment. It is not compatible with APatch and cannot be used together with the built-in KPM implementation of (Re)SukiSU.

             Before using KPN, make sure your kernel does not already contain or have an integrated KPM implementation/patch.

          #### ⚠️⚠️⚠️ Flashing a kernel involves risk!

          To prevent accidental device bricking, always back up critical boot partitions such as boot before flashing a kernel. Tools such as KernelFlasher can be used for backups:

          https://github.com/capntrips/KernelFlasher

          **Flash at your own risk. Make sure you have a known-good kernel or complete partition backup available before proceeding.**
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
