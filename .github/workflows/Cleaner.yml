name: 🧹 Cleaner

on:
  workflow_dispatch:
    inputs:
      workflowname:
        type: choice
        description: 'Name of the Workflow ID to Clean'
        required: true
        default: ☘️ Main
        options:
          - All Workflows
          - ☘️ Main
          - ☘️ Test
          - ☘️ AOSP
          - ☘️ AOSP Test
          - ☘️ Dispatch & Fetch SM8750
      cachemode:
        type: choice
        description: 'Type of Cache to Clean'
        required: false
        default: 'None'
        options:
          - None
          - All
          - CCache
          - APT-Cache          
      count:
        description: 'Maximum Number of Runs to Access'
        required: false
        default: '10'
      dryrun:
        description: 'Preview Only (No Deletion)'
        required: false
        type: boolean
        default: false         
      deletefailed:
        description: 'Delete Failed Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      deletesuccess:
        description: 'Delete Successful Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: false        
      deletecancelled:
        description: 'Delete Cancelled Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      reverseorder:
        description: 'Clean from Oldest to Newest?'
        required: false
        type: boolean
        default: true       
      cancelall:
        description: 'Cancel All Runs of the Specified Workflow at Once?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ inputs.cancelall
     || inputs.deletefailed
     || inputs.deletesuccess
     || inputs.deletecancelled
     || inputs.dryrun }}
     
    steps:
      # Install Dependencies
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      # Authenticate GitHub CLI
      - name: 🔧 Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # Clean Workflow Runs
      - name: 🔧 Clean Workflow Runs
        env:
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DRYRUN: ${{ inputs.dryrun }}
          DELETEFAILED: ${{ inputs.deletefailed }}
          DELETESUCCESS: ${{ inputs.deletesuccess }}
          DELETECANCELLED: ${{ inputs.deletecancelled }}
          REVERSEORDER: ${{ inputs.reverseorder }}
          CANCELALL: ${{ inputs.cancelall }}
          WORKFLOWNAME: ${{ inputs.workflowname }}
          CURRENTRUNID: ${{ github.run_id }}
          CACHEMODE: ${{ inputs.cachemode }}
        run: |
          set -e
          # Counters Initialization
          TOTALRUNS=0
          MATCHEDCOUNT=0
          DELETEDCOUNT=0
          CANCELCOUNT=0        
          # Save Original Input
          ORIGINALCOUNT="${COUNT:-}"
          # Apply Default if Empty
          COUNT=${COUNT:-100}
          # Validate Numeric
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            COUNT=100
          fi

          # Warn if Changed
          if [[ "$COUNT" != "$ORIGINALCOUNT" ]]; then
            echo "⚠️ Invalid Count Input (${ORIGINALCOUNT:-Empty}), Defaulting to $COUNT"
          fi  
          
          echo "📌 Using COUNT=$COUNT"
          # Determine whether to scan one workflow or every workflow.
          if [[ "$WORKFLOWNAME" == "All Workflows" ]]; then
            echo "🔎 Scanning all GitHub Actions workflows..."
            RUNSENDPOINT="repos/$REPO/actions/runs"
          else
            echo "🔎 Finding Workflow ID For \"$WORKFLOWNAME\"..."
            WORKFLOWJSON=$(gh api "repos/$REPO/actions/workflows")
            if ! echo "$WORKFLOWJSON" | jq -e \
              '.workflows | type == "array"' >/dev/null; then
              echo "⚠️ Unable to Retrieve Workflows..."
              exit 1
            fi

            # Try Exact Workflow Name Match First
            WORKFLOWID=$(echo "$WORKFLOWJSON" | jq -r \
              --arg name "$WORKFLOWNAME" \
              '.workflows[] | select(.name == $name) | .id' | head -n1)
            # Fallback to Partial Match
            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Exact Match Failed; Trying Partial Match..."
              WORKFLOWID=$(echo "$WORKFLOWJSON" | jq -r \
                --arg name "$WORKFLOWNAME" \
                '.workflows[] | select(.name | contains($name)) | .id' \
                | head -n1)
            fi

            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Workflow Not Found: $WORKFLOWNAME"
              exit 1
            fi

            echo "✔️ Using Workflow ID: $WORKFLOWID"
            RUNSENDPOINT="repos/$REPO/actions/workflows/$WORKFLOWID/runs"
          fi

          # Fetch Runs Page by Page
          echo "🔎 Fetching Workflow Runs..."
          PERPAGE=100
          PAGE=1
          ALLRUNS="[]"
          while true; do
            RESP=$(gh api \
              "$RUNSENDPOINT?per_page=$PERPAGE&page=$PAGE" 2>/dev/null) || {
                echo "⚠️ Failed to Fetch Workflow Runs (Page $PAGE)"
                exit 1
              }
            if ! echo "$RESP" | jq -e \
              '.workflow_runs | type == "array"' >/dev/null; then
              echo "⚠️ Invalid Workflow Runs API Response"
              exit 1
            fi

            RUNS=$(echo "$RESP" | jq '.workflow_runs')
            COUNTPAGE=$(echo "$RUNS" | jq 'length')
            if [[ "$COUNTPAGE" -eq 0 ]]; then
              break
            fi

            ALLRUNS=$(jq -cn \
              --argjson old "$ALLRUNS" \
              --argjson new "$RUNS" \
              '$old + $new')
            echo "📄 Retrieved Page $PAGE ($COUNTPAGE Runs)"
            PAGE=$((PAGE + 1))
            
          done
                
          # Count All Retrieved Runs
          TOTALRUNS=$(wc -l < "$RUNSFILE")
          echo "📌 Total Runs Fetched : $TOTALRUNS"
          # Cancel In-Progress or Pending Runs
          if [[ "$CANCELALL" == "true" ]]; then
            echo "⚙️ Cancelling In-Progress or Pending Runs..."
            while IFS= read -r run; do
              ID=$(printf '%s\n' "$run" | jq -r '.id')
              if [[ "$ID" == "$CURRENTRUNID" ]]; then
                continue
              fi

              if [[ "$DRYRUN" == "true" ]]; then
                echo "🔍 Would Cancel Run ID : $ID"
                CANCELCOUNT=$((CANCELCOUNT + 1))
              else
                echo "♻️ Cancelling Run ID : $ID"
                if gh api -X POST "repos/$REPO/actions/runs/$ID/cancel"; then
                  CANCELCOUNT=$((CANCELCOUNT + 1))
                fi
              fi
              
            done < <(
            
              jq -c '
                select(
                  .status == "in_progress" or
                  .status == "queued" or
                  .status == "pending" or
                  .status == "requested" or
                  .status == "waiting"
                )
              ' "$RUNSFILE"
            )
            echo "📌 Cancelled $CANCELCOUNT Runs"
          fi

          # Process Runs For Deletion
          echo "⚙️ Processing Delete Logic..."
          if [[ "$REVERSEORDER" == "true" ]]; then
            SORTEXPR='sort_by(.run_started_at) | .[0:$count][]'
          else
            SORTEXPR='sort_by(.run_started_at) | reverse | .[0:$count][]'
          fi

          while IFS= read -r run; do
            ID=$(printf '%s\n' "$run" | jq -r '.id')
            STATUS=$(printf '%s\n' "$run" | jq -r '.conclusion')
            STATE=$(printf '%s\n' "$run" | jq -r '.status')
            # Skip Active Runs
            if [[ "$STATE" == "in_progress" ||
                  "$STATE" == "queued" ||
                  "$STATE" == "pending" ||
                  "$STATE" == "requested" ||
                  "$STATE" == "waiting" ]]; then
              continue
            fi

            # Filter by Selected Conclusion
            if [[ "$STATUS" == "failure" && "$DELETEFAILED" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" == "success" && "$DELETESUCCESS" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" == "cancelled" && "$DELETECANCELLED" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" != "failure" &&
                  "$STATUS" != "success" &&
                  "$STATUS" != "cancelled" ]]; then
              continue
            fi

            MATCHEDCOUNT=$((MATCHEDCOUNT + 1))
            if [[ "$DRYRUN" == "true" ]]; then
              echo "🔍 Would Delete Run ID : $ID ($STATUS)"
              DELETEDCOUNT=$((DELETEDCOUNT + 1))
            else
              echo "🔧 Deleting Run ID : $ID ($STATUS)"
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                DELETEDCOUNT=$((DELETEDCOUNT + 1))
              else
                echo "⚠️ Delete Failed : $ID"
              fi
            fi
            
          done < <(
            jq -s --argjson count "$COUNT" "$SORTEXPR" "$RUNSFILE"
          )                    
          if [[ "$WORKFLOWNAME" != "All Workflows" ]]; then
            echo "🧹 Cleaning Cleaner Workflow Runs (📃 Excluding Cleaner Workflow Current Run)..."
            # Get the Workflow ID of this Cleaner Workflow
            SELFWORKFLOWID=$(gh api repos/$REPO/actions/workflows 2>/dev/null \
              | jq -r '.workflows[] | select(.name == "🧹 Cleaner") | .id')
            # Check if Cleaner Workflow Exists
            if [[ -n "$SELFWORKFLOWID" ]]; then
              # Fetch Latest Runs of Cleaner Workflow (Limit: 50)
              # Suppress API + JQ Errors to Avoid Breaking Script
              SELFRUN=$(gh api "repos/$REPO/actions/workflows/$SELFWORKFLOWID/runs?per_page=50" 2>/dev/null \
                | jq -c '.workflow_runs[]?' 2>/dev/null || true)
              # Only Proceed if Runs Exist
              if [[ -n "$SELFRUN" ]]; then
                # Loop Through Each Run
                while IFS= read -r run; do
                  # Extract Run ID
                  ID=$(echo "$run" | jq -r '.id')
                  # Skip Current Running Workflow (Important Safety Check)
                  if [[ "$ID" == "$CURRENTRUNID" ]]; then
                    continue
                  fi

                  # Log / Dry Run Handling
                  if [[ "$DRYRUN" == "true" ]]; then
                    echo "🔍 Would Delete Cleaner Run ID: $ID"
                    DELETEDCOUNT=$((DELETEDCOUNT + 1))
                  else
                    echo "📌 Deleting Cleaner Previous Workflow Run ID: $ID"
                    if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                      DELETEDCOUNT=$((DELETEDCOUNT + 1))
                    else
                      echo "⚠️ Delete Failed"
                    fi
                  fi             

                done < <(echo "$SELFRUN")

              else
                # No Runs Found Case
                echo "⚠️ No Previous Cleaner Runs Found"
              fi

            else
              # Cleaner Workflow Not Found Case
              echo "⚠️ Cleaner Workflow ID Not Found"
            fi
          fi
       
          # Format Status
          formatcount() {
            local value="$1"
            if [[ -z "$value" ]]; then
              echo "⚠️ Unknown"
            elif [[ "$value" -eq 0 ]]; then
              echo "✔️ None"
            else
              echo "$value"
            fi
          }
          TOTALDISPLAY=$(formatcount "$TOTALRUNS")
          MATCHEDDISPLAY=$(formatcount "$MATCHEDCOUNT")
          DELETEDDISPLAY=$(formatcount "$DELETEDCOUNT")
          CANCELDISPLAY=$(formatcount "$CANCELCOUNT")          
          if [[ "$DRYRUN" == "true" ]]; then
            DRYRUNSTATUS="✔️ Enabled"
          else
            DRYRUNSTATUS="⚠️ Disabled"
          fi
          
          # Workflow Cleanup Summary
          {
            echo "## 🧹 Workflow Cleanup Summary"
            echo ""
            echo "| Metric Description | Reported Value |"
            echo "|--------------------|----------------|"
            echo "| Selected Workflow Name | $WORKFLOWNAME |"
            echo "| Total Number of Workflow Runs Retrieved | $TOTALDISPLAY |"
            echo "| Number of Runs Evaluated for Cleanup | $MATCHEDDISPLAY |"
            echo "| Number of Workflow Runs Successfully Deleted | $DELETEDDISPLAY |"
            echo "| Number of Workflow Runs Cancelled (Ongoing / Pending) | $CANCELDISPLAY |"
            echo "| Dry Run Mode Enabled (No Changes Applied) | $DRYRUNSTATUS |"
          } >> $GITHUB_STEP_SUMMARY

  clean-caches:
    runs-on: ubuntu-latest
    if: ${{ inputs.cachemode && inputs.cachemode != 'None' }}
    permissions:
      actions: write
    steps:
      - name: 🔧 Clean Caches Based on Selected Mode
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.CACHEMODE || '${{ inputs.cachemode }}';           
            console.log(`🧹 Current Cache Clean Mode: ${mode}`);
            let totalDeleted = 0;
            let totalFound = 0;
            let page = 1;
            while (true) {
              const res = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page
              });
              const caches = res.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }
              let matchedThisPage = 0;
              for (const cache of caches) {
                const key = cache.key;
                let matched = false;
                switch (mode) {
                  case 'All':
                    matched = true;
                    break;            
                  case 'CCache':
                    matched = key.startsWith('CCache-');
                    break;            
                  case 'APT-Cache':
                    matched = key.includes('APT-Cache') || key.includes('APT');
                    break;             
                  default:
                    console.log(`⚠️ Unknown Cache Clean Mode: ${mode}`);
                    return;
                }
                if (!matched) {
                  continue;
                }
                matchedThisPage++;
                totalFound++;
                console.log(`🧹 Deleting Cache: ${key}`);
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id
                  });
                  totalDeleted++;
                  console.log(`✔️ Deleted: ${key}`);
                } catch (err) {
                  console.log(`⚠️ Failed To Delete: ${key}`);
                  console.log(`   ${err.message}`);
                }
              }
              if (matchedThisPage === 0) {
                break;
              }
            }
            if (totalFound === 0) {
              console.log("⚠️ No Caches Found Matching The Criteria");
            } else {
              console.log(
                `🔎 Found ${totalFound} Matching Caches, Successfully Deleted ${totalDeleted}`
              );
            }
