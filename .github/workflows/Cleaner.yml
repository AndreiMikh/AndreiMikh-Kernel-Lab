name: 🧹 Cleaner
on:
  workflow_dispatch:
    inputs:
      workflowname:
        type: choice
        description: 'Name of the Workflow ID to Clean'
        required: true
        default: ☘️ Main
        options:
          - All Workflows
          - ☘️ Main
          - ☘️ Test
          - ☘️ AOSP
          - ☘️ AOSP Test
          - ☘️ Dispatch & Fetch SM8750
      cachemode:
        type: choice
        description: 'Type of Cache to Clean'
        required: false
        default: 'None'
        options:
          - None
          - All
          - CCache
          - APT-Cache
      count:
        description: 'Maximum Number of Runs to Access'
        required: false
        default: '10'
      dryrun:
        description: 'Preview Only (No Deletion)'
        required: false
        type: boolean
        default: false
      deletefailed:
        description: 'Delete Failed Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true
      deletesuccess:
        description: 'Delete Successful Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: false
      deletecancelled:
        description: 'Delete Cancelled Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true
      reverseorder:
        description: 'Clean from Oldest to Newest?'
        required: false
        type: boolean
        default: true
      cancelall:
        description: 'Cancel All Runs of the Specified Workflow at Once?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: >-
      ${{
        inputs.cancelall ||
        inputs.deletefailed ||
        inputs.deletesuccess ||
        inputs.deletecancelled ||
        inputs.dryrun
      }}

    steps:
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: 🔧 Clean Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DRYRUN: ${{ inputs.dryrun }}
          DELETEFAILED: ${{ inputs.deletefailed }}
          DELETESUCCESS: ${{ inputs.deletesuccess }}
          DELETECANCELLED: ${{ inputs.deletecancelled }}
          REVERSEORDER: ${{ inputs.reverseorder }}
          CANCELALL: ${{ inputs.cancelall }}
          WORKFLOWNAME: ${{ inputs.workflowname }}
          CURRENTRUNID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Counters
          TOTALRUNS=0
          MATCHEDCOUNT=0
          DELETEDCOUNT=0
          CANCELCOUNT=0
          # Validate COUNT
          ORIGINALCOUNT="${COUNT:-10}"
          if [[ "$ORIGINALCOUNT" =~ ^[0-9]+$ ]]; then
            COUNT=$((10#$ORIGINALCOUNT))
          else
            echo "⚠️ Invalid Count '$ORIGINALCOUNT'; Using 10"
            COUNT=10
          fi

          echo "📌 Using COUNT=$COUNT"
          # Resolve workflow endpoint
          if [[ "$WORKFLOWNAME" == "All Workflows" ]]; then
            echo "🔎 Scanning All GitHub Actions Workflows..."
            RUNSENDPOINT="repos/$REPO/actions/runs"
          else
            echo "🔎 Finding Workflow ID For \"$WORKFLOWNAME\"..."
            WORKFLOWJSON=$(gh api \
              "repos/$REPO/actions/workflows?per_page=100")
            WORKFLOWID=$(jq -r \
              --arg name "$WORKFLOWNAME" \
              '.workflows[] | select(.name == $name) | .id' \
              <<< "$WORKFLOWJSON" | head -n 1)
            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Exact Match Failed; Trying Partial Match..."
              WORKFLOWID=$(jq -r \
                --arg name "$WORKFLOWNAME" \
                '.workflows[] | select(.name | contains($name)) | .id' \
                <<< "$WORKFLOWJSON" | head -n 1)
            fi

            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Workflow Not Found : $WORKFLOWNAME"
              exit 1
            fi

            echo "🧾 Using Workflow ID : $WORKFLOWID"
            RUNSENDPOINT="repos/$REPO/actions/workflows/$WORKFLOWID/runs"
          fi

          # Temporary Files: Never Aggregate All Runs in a Shell Variable
          RUNSFILE=$(mktemp)
          RESPFILE=$(mktemp)
          SORTEDFILE=$(mktemp)
          CANDIDATEFILE=$(mktemp)
          CANCELFILE=$(mktemp)
          SELFRUNFILE=$(mktemp)
          cleanuptempfiles() {
            rm -f \
              "$RUNSFILE" \
              "$RESPFILE" \
              "$SORTEDFILE" \
              "$CANDIDATEFILE" \
              "$CANCELFILE" \
              "$SELFRUNFILE"
          }
          trap cleanuptempfiles EXIT
          # Fetch Every Page Into JSON Lines
          echo "🔎 Fetching Workflow Runs..."
          PERPAGE=100
          PAGE=1
          while true; do
            if ! gh api \
              "$RUNSENDPOINT?per_page=$PERPAGE&page=$PAGE" \
              > "$RESPFILE"; then
              echo "⚠️ Failed to Fetch Workflow Runs on Page $PAGE"
              exit 1
            fi

            if ! jq -e \
              '.workflow_runs | type == "array"' \
              "$RESPFILE" >/dev/null; then
              echo "⚠️ Invalid Workflow Runs API Response"
              exit 1
            fi

            COUNTPAGE=$(jq '.workflow_runs | length' "$RESPFILE")
            if (( COUNTPAGE == 0 )); then
              break
            fi

            jq -c '.workflow_runs[]' "$RESPFILE" >> "$RUNSFILE"
            echo "📄 Retrieved Page $PAGE ($COUNTPAGE Runs)"
            PAGE=$((PAGE + 1))
            
          done

          # Validate every record before performing any changes.
          if ! jq -s -e \
            'all(.[]; type == "object" and has("id"))' \
            "$RUNSFILE" >/dev/null; then
            echo "⚠️ Fetched Run Data Failed Validation, No Cleanup Performed"
            exit 1
          fi

          TOTALRUNS=$(wc -l < "$RUNSFILE")
          echo "📌 Total Runs Fetched : $TOTALRUNS"
          # Cancel Active Runs When Requested
          if [[ "$CANCELALL" == "true" ]]; then
            echo "⚙️ Finding In-Progress or Pending Runs..."
            jq -c '
              select(
                .status == "in_progress" or
                .status == "queued" or
                .status == "pending" or
                .status == "requested" or
                .status == "waiting"
              )
            ' "$RUNSFILE" > "$CANCELFILE"
            while IFS= read -r run; do
              [[ -n "$run" ]] || continue
              ID=$(jq -r '.id' <<< "$run")
              if [[ "$ID" == "$CURRENTRUNID" ]]; then
                continue
              fi

              if [[ "$DRYRUN" == "true" ]]; then
                echo "🔍 Would Cancel Run ID : $ID"
                CANCELCOUNT=$((CANCELCOUNT + 1))
              else
                echo "♻️ Cancelling Run ID : $ID"
                if gh api -X POST \
                  "repos/$REPO/actions/runs/$ID/cancel"; then
                  CANCELCOUNT=$((CANCELCOUNT + 1))
                else
                  echo "⚠️ Failed to Cancel Run ID : $ID"
                fi
              fi
              
            done < "$CANCELFILE"
     
            echo "📌 Runs Cancelled / Selected for Cancellation : $CANCELCOUNT"
          fi

          # Sort Runs Into Separate File
          echo "⚙️ Sorting Workflow Runs..."
          if [[ "$REVERSEORDER" == "true" ]]; then
            # Oldest to Newest
            jq -s -c \
              'sort_by(.run_started_at // "")[]' \
              "$RUNSFILE" > "$SORTEDFILE"
          else
            # Newest to Oldest
            jq -s -c \
              'sort_by(.run_started_at // "") | reverse | .[]' \
              "$RUNSFILE" > "$SORTEDFILE"
          fi

          # Select at Most Count Runs Before Conclusion Filtering
          head -n "$COUNT" "$SORTEDFILE" > "$CANDIDATEFILE"
          echo "📌 Runs Selected for Inspection : $(wc -l < "$CANDIDATEFILE")"
          echo "⚙️ Processing Delete Logic..."
          # Read From a Completed File, Not a JQ Process Substitution
          while IFS= read -r run; do
            [[ -n "$run" ]] || continue
            ID=$(jq -r '.id' <<< "$run")
            STATUS=$(jq -r '.conclusion // ""' <<< "$run")
            STATE=$(jq -r '.status // ""' <<< "$run")
            # Never Delete Active Runs
            if [[ "$STATE" == "in_progress" ||
                  "$STATE" == "queued" ||
                  "$STATE" == "pending" ||
                  "$STATE" == "requested" ||
                  "$STATE" == "waiting" ]]; then
              continue
            fi

            # Only Process Selected Conclusions
            if [[ "$STATUS" == "failure" && "$DELETEFAILED" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" == "success" && "$DELETESUCCESS" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" == "cancelled" && "$DELETECANCELLED" != "true" ]]; then
              continue
            fi

            if [[ "$STATUS" != "failure" &&
                  "$STATUS" != "success" &&
                  "$STATUS" != "cancelled" ]]; then
              continue
            fi

            MATCHEDCOUNT=$((MATCHEDCOUNT + 1))
            if [[ "$DRYRUN" == "true" ]]; then
              echo "🔍 Would Delete Run ID : $ID ($STATUS)"
              DELETEDCOUNT=$((DELETEDCOUNT + 1))
            else
              echo "🗑️ Deleting Run ID : $ID ($STATUS)"
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                DELETEDCOUNT=$((DELETEDCOUNT + 1))
              else
                echo "⚠️ Failed to Delete Run ID : $ID"
              fi
            fi
            
          done < "$CANDIDATEFILE"

          # Preserve Existing Behavior of Cleaning Previous Cleaner
          # Runs Only When a Specific Workflow, Rather Than All Workflows Was Selected
          if [[ "$WORKFLOWNAME" != "All Workflows" ]]; then
            echo "🧹 Checking Previous Cleaner Workflow Runs..."
            SELFWORKFLOWID=$(gh api \
              "repos/$REPO/actions/workflows?per_page=100" \
              | jq -r \
                '.workflows[] | select(.name == "🧹 Cleaner") | .id' \
              | head -n 1)
            if [[ -n "$SELFWORKFLOWID" ]]; then
              if gh api \
                "repos/$REPO/actions/workflows/$SELFWORKFLOWID/runs?per_page=50" \
                > "$SELFRUNFILE"; then
                while IFS= read -r run; do
                  [[ -n "$run" ]] || continue
                  ID=$(jq -r '.id' <<< "$run")
                  if [[ "$ID" == "$CURRENTRUNID" ]]; then
                    continue
                  fi

                  if [[ "$DRYRUN" == "true" ]]; then
                    echo "🔍 Would Delete Previous Cleaner Run ID : $ID"
                    DELETEDCOUNT=$((DELETEDCOUNT + 1))
                  else
                    echo "🗑️ Deleting Previous Cleaner Run ID : $ID"
                    if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                      DELETEDCOUNT=$((DELETEDCOUNT + 1))
                    else
                      echo "⚠️ Failed to Delete Cleaner Run ID : $ID"
                    fi
                  fi
                done < <(
                  jq -c '.workflow_runs[]?' "$SELFRUNFILE"
                )
              else
                echo "⚠️ Unable to Fetch Previous Cleaner Runs"
              fi
            else
              echo "⚠️ Cleaner Workflow Not Found"
            fi
          fi

          # Format summary values.
          formatcount() {
            local value="$1"
            if [[ -z "$value" ]]; then
              echo "Unknown"
            elif [[ "$value" -eq 0 ]]; then
              echo "0"
            else
              echo "$value"
            fi
          }
          TOTALDISPLAY=$(formatcount "$TOTALRUNS")
          MATCHEDDISPLAY=$(formatcount "$MATCHEDCOUNT")
          DELETEDDISPLAY=$(formatcount "$DELETEDCOUNT")
          CANCELDISPLAY=$(formatcount "$CANCELCOUNT")
          if [[ "$DRYRUN" == "true" ]]; then
            DRYRUNSTATUS="Enabled"
          else
            DRYRUNSTATUS="Disabled"
          fi

          {
            echo "## 🧹 Workflow Cleanup Summary"
            echo ""
            echo "| Metric Description | Reported Value |"
            echo "|--------------------|----------------|"
            echo "| Selected Workflow Name | $WORKFLOWNAME |"
            echo "| Total Number of Workflow Runs Retrieved | $TOTALDISPLAY |"
            echo "| Number of Runs Evaluated for Cleanup | $MATCHEDDISPLAY |"
            echo "| Number of Workflow Runs Successfully Deleted | $DELETEDDISPLAY |"
            echo "| Number of Workflow Runs Cancelled / Selected | $CANCELDISPLAY |"
            echo "| Dry Run Mode Enabled | $DRYRUNSTATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

  clean-caches:
    runs-on: ubuntu-latest
    if: ${{ inputs.cachemode != 'None' }}
    permissions:
      actions: write

    steps:
      - name: 🔧 Clean Caches Based on Selected Mode
        uses: actions/github-script@v9
        env:
          CACHEMODE: ${{ inputs.cachemode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.CACHEMODE;
            console.log(`🧹 Cache Clean Mode : ${mode}`);
            let page = 1;
            const matches = [];
            // Collect Matching Caches First, Do Not Delete While Paging
            // Because Feleting Entries Can Shift Later Pages
            while (true) {
              const res = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page
              });
              const caches = res.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }
              for (const cache of caches) {
                const key = cache.key || '';
                let matched = false;
                switch (mode) {
                  case 'All':
                    matched = true;
                    break;
                  case 'CCache':
                    matched = key.startsWith('CCache-') || key.startsWith('Cache-');
                    break;
                  case 'APT-Cache':
                    matched =
                      key.includes('APT-Cache') ||
                      key.includes('APT');
                    break;
                  default:
                    core.setFailed(`Unknown Cache Mode : ${mode}`);
                    return;
                }
                if (matched) {
                  matches.push(cache);
                }
              }
              page++;
            }
            console.log(`🔎 Found ${matches.length} Matching Caches`);
            let totalDeleted = 0;
            for (const cache of matches) {
              console.log(`🧹 Deleting Cache : ${cache.key}`);
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id
                });
                totalDeleted++;
                console.log(`📌 Deleted : ${cache.key}`);
              } catch (err) {
                console.log(`⚠️ Failed : ${cache.key}`);
                console.log(err.message);
              }
            }
            console.log(
              `🔎 Found ${matches.length} Matching Caches; Deleted ${totalDeleted}`
            );
