name: 🧹 Cleaner
on:
  workflow_dispatch:
    inputs:
      workflowname:
        type: choice
        description: 'Name of the Workflow ID to Clean'
        required: true
        default: ☘️ Main
        options:
          - All Workflows
          - ☘️ Main
          - ☘️ Test
          - ☘️ AOSP
          - ☘️ AOSP Test
          - ☘️ Dispatch & Fetch SM8750
      cachemode:
        type: choice
        description: 'Type of Cache to Clean'
        required: false
        default: 'None'
        options:
          - None
          - All
          - CCache
          - APT-Cache          
      count:
        description: 'Maximum Number of Runs to Access'
        required: false
        default: '10'
      dryrun:
        description: 'Preview Only (No Deletion)'
        required: false
        type: boolean
        default: false         
      deletefailed:
        description: 'Delete Failed Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      deletesuccess:
        description: 'Delete Successful Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: false        
      deletecancelled:
        description: 'Delete Cancelled Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      reverseorder:
        description: 'Clean from Oldest to Newest?'
        required: false
        type: boolean
        default: true       
      cancelall:
        description: 'Cancel All Runs of the Specified Workflow at Once?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ inputs.cancelall
     || inputs.deletefailed
     || inputs.deletesuccess
     || inputs.deletecancelled
     || inputs.dryrun }}
     
    steps:
      # Install Dependencies
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      # Authenticate GitHub CLI
      - name: 🔧 Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # Clean Workflow Runs
      - name: 🔧 Clean Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DRYRUN: ${{ inputs.dryrun }}
          DELETEFAILED: ${{ inputs.deletefailed }}
          DELETESUCCESS: ${{ inputs.deletesuccess }}
          DELETECANCELLED: ${{ inputs.deletecancelled }}
          REVERSEORDER: ${{ inputs.reverseorder }}
          CANCELALL: ${{ inputs.cancelall }}
          WORKFLOWNAME: ${{ inputs.workflowname }}
          CURRENTRUNID: ${{ github.run_id }}
          CACHEMODE: ${{ inputs.cachemode }}
        run: |
          set -e
          # Initialize Workflow Run Counters
          TOTALRUNS=0
          MATCHEDCOUNT=0
          DELETEDCOUNT=0
          CANCELCOUNT=0
          # Save Original Count and Apply Default
          ORIGINALCOUNT="${COUNT:-}"
          COUNT="${COUNT:-100}"
          # Validate Count to Prevent Invalid Numeric Input
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || (( COUNT < 1 )); then
            COUNT=100
            echo "⚠️ Invalid Count Input (${ORIGINALCOUNT:-Empty}), Defaulting to $COUNT"
          fi

          echo "📌 Using COUNT=$COUNT"
          # Create Temporary Storage to Avoid Oversized JSON Arguments
          TEMPDIR=$(mktemp -d)
          trap 'rm -rf "$TEMPDIR"' EXIT
          # Define Files for Retrieved, Pending, and Selected Runs
          RUNSFILE="$TEMPDIR/runs.jsonl"
          CANCELFILE="$TEMPDIR/cancel.jsonl"
          DELETEFILE="$TEMPDIR/delete.jsonl"
          # Initialize Workflow Run Storage
          : > "$RUNSFILE"
          # Select the Workflow Runs API Endpoint
          if [[ "$WORKFLOWNAME" == "All Workflows" ]]; then
            echo "🔎 Scanning all GitHub Actions workflows..."
            RUNSENDPOINT="repos/$REPO/actions/runs"
          else
            echo "🔎 Finding Workflow ID For \"$WORKFLOWNAME\"..."
            # Retrieve Available Workflows
            WORKFLOWJSON=$(gh api "repos/$REPO/actions/workflows")
            # Validate the Workflow API Response
            if ! jq -e '.workflows | type == "array"' <<< "$WORKFLOWJSON" >/dev/null; then
              echo "⚠️ Unable to Retrieve Workflows"
              exit 1
            fi

            # Attempt an Exact Workflow Name Match
            WORKFLOWID=$(jq -r --arg name "$WORKFLOWNAME" \
              '[.workflows[] | select(.name == $name) | .id][0] // empty' \
              <<< "$WORKFLOWJSON")
            # Fall Back to a Partial Workflow Name Match
            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Exact Match Failed; Trying Partial Match..."
              WORKFLOWID=$(jq -r --arg name "$WORKFLOWNAME" \
                '[.workflows[] | select(.name | contains($name)) | .id][0] // empty' \
                <<< "$WORKFLOWJSON")
            fi

            # Stop if Requested Workflow Cannot Be Found
            if [[ -z "$WORKFLOWID" ]]; then
              echo "⚠️ Workflow Not Found: $WORKFLOWNAME"
              exit 1
            fi

            echo "✔️ Using Workflow ID: $WORKFLOWID"
            # Restrict the API Endpoint to the Selected Workflow
            RUNSENDPOINT="repos/$REPO/actions/workflows/$WORKFLOWID/runs"
          fi

          # Retrieve Workflow Runs One Page at a Time
          echo "🔎 Fetching Workflow Runs..."
          PERPAGE=100
          PAGE=1
          while true; do
            # Store Each API Response on Disk Instead of a Large Shell Variable
            RESPFILE="$TEMPDIR/response.json"
            # Fetch the Current Page of Workflow Runs
            if ! gh api "$RUNSENDPOINT?per_page=$PERPAGE&page=$PAGE" > "$RESPFILE"; then
              echo "⚠️ Failed to Fetch Workflow Runs (Page $PAGE)"
              exit 1
            fi

            # Validate the Retrieved Runs
            if ! jq -e '.workflow_runs | type == "array"' "$RESPFILE" >/dev/null; then
              echo "⚠️ Invalid Workflow Runs API Response"
              exit 1
            fi

            # Count Runs Returned on Page
            COUNTPAGE=$(jq '.workflow_runs | length' "$RESPFILE")
            # Stop When No More Runs Available
            if (( COUNTPAGE == 0 )); then
              break
            fi

            # Append Each Run as a Separate JSON Line
            jq -c '.workflow_runs[]' "$RESPFILE" >> "$RUNSFILE"
            echo "📄 Retrieved Page $PAGE ($COUNTPAGE Runs)"
            # Stop After Final Partial Page
            if (( COUNTPAGE < PERPAGE )); then
              break
            fi

            # Advance to the Next API Page
            PAGE=$((PAGE + 1))
            
          done

          # Calculate Total Number of Retrieved Runs
          TOTALRUNS=$(wc -l < "$RUNSFILE")
          echo "📌 Total Runs Fetched: $TOTALRUNS"
          # Cancel All In-Progress or Pending Runs When Requested
          if [[ "$CANCELALL" == "true" ]]; then
            echo "⚙️ Cancelling In-Progress or Pending Runs..."
            # Select Runs That Can Be Cancellation Candidates
            jq -c '
              select(
                .status == "in_progress" or
                .status == "queued" or
                .status == "pending" or
                .status == "requested" or
                .status == "waiting"
              )
            ' "$RUNSFILE" > "$CANCELFILE"
            # Process Each Cancellation Candidate
            while IFS= read -r RUN; do
              [[ -z "$RUN" ]] && continue
              # Extract Workflow Run ID
              ID=$(jq -r '.id' <<< "$RUN")
              # Never Cancel Current Cleaner Workflow Run
              if [[ "$ID" == "$CURRENTRUNID" ]]; then
                continue
              fi

              # Preview Cancellation Without Changing GitHub
              if [[ "$DRYRUN" == "true" ]]; then
                echo "🔍 Would Cancel Run ID: $ID"
                CANCELCOUNT=$((CANCELCOUNT + 1))
              else
                # Cancel Selected Workflow Run
                echo "♻️ Cancelling Run ID: $ID"

                if gh api -X POST "repos/$REPO/actions/runs/$ID/cancel"; then
                  CANCELCOUNT=$((CANCELCOUNT + 1))
                else
                  echo "⚠️ Failed to Cancel Run ID: $ID"
                fi
              fi
              
            done < "$CANCELFILE"

            echo "📌 Cancelled $CANCELCOUNT Runs"
          fi

          # Select Workflow Runs For Deletion
          echo "⚙️ Processing Delete Logic..."
          # Sort Runs by Start Time and Apply Requested Count Limit
          if [[ "$REVERSEORDER" == "true" ]]; then
            # Select the Oldest Runs First
            jq -s -c --argjson count "$COUNT" '
              sort_by(.run_started_at // .created_at // "") |
              .[0:$count][]
            ' "$RUNSFILE" > "$DELETEFILE"
          else
            # Select Newest Runs First
            jq -s -c --argjson count "$COUNT" '
              sort_by(.run_started_at // .created_at // "") |
              reverse |
              .[0:$count][]
            ' "$RUNSFILE" > "$DELETEFILE"
          fi

          # Evaluate Each Selected Run Against Deletion Rules
          while IFS= read -r RUN; do
            [[ -z "$RUN" ]] && continue
            # Extract Run ID, Conclusion, and Current State
            ID=$(jq -r '.id' <<< "$RUN")
            STATUS=$(jq -r '.conclusion // ""' <<< "$RUN")
            STATE=$(jq -r '.status // ""' <<< "$RUN")
            # Protect Current Cleaner Workflow Run
            if [[ "$ID" == "$CURRENTRUNID" ]]; then
              continue
            fi

            # Only Delete Completed Workflow Runs
            if [[ "$STATE" != "completed" ]]; then
              continue
            fi

            # Respect Selected Deletion Categories
            case "$STATUS" in
              failure)
                [[ "$DELETEFAILED" == "true" ]] || continue
                ;;
              success)
                [[ "$DELETESUCCESS" == "true" ]] || continue
                ;;
              cancelled)
                [[ "$DELETECANCELLED" == "true" ]] || continue
                ;;
              *)
                # Preserve Runs With Other Conclusions
                continue
                ;;
            esac
            MATCHEDCOUNT=$((MATCHEDCOUNT + 1))
            # Preview Deletion Without Changing GitHub
            if [[ "$DRYRUN" == "true" ]]; then
              echo "🔍 Would Delete Run ID: $ID"
              DELETEDCOUNT=$((DELETEDCOUNT + 1))
            else
              # Delete the Selected Workflow Run
              echo "🔧 Deleting Run ID: $ID"
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                DELETEDCOUNT=$((DELETEDCOUNT + 1))
              else
                echo "⚠️ Delete Failed: $ID"
              fi
            fi
            
          done < "$DELETEFILE"
          
          # Clean Previous Cleaner Runs Only When a Specific Workflow Was Selected
          if [[ "$WORKFLOWNAME" != "All Workflows" ]]; then
            echo "🧹 Cleaning Previous Cleaner Workflow Runs..."
            # Resolve the Cleaner Workflow ID
            SELFWORKFLOWID=$(gh api "repos/$REPO/actions/workflows" \
              | jq -r '[.workflows[] | select(.name == "🧹 Cleaner") | .id][0] // empty')
            # Continue Only if Cleaner Workflow Exists
            if [[ -n "$SELFWORKFLOWID" ]]; then
              # Initialize Temporary Storage for Cleaner Runs
              SELFFILE="$TEMPDIR/cleaner-runs.jsonl"
              SELFPAGE=1
              : > "$SELFFILE"
              # Retrieve Cleaner Runs Using Pagination
              while true; do
                RESPFILE="$TEMPDIR/cleaner-response.json"
                # Fetch Current Cleaner Runs Page
                if ! gh api \
                  "repos/$REPO/actions/workflows/$SELFWORKFLOWID/runs?per_page=100&page=$SELFPAGE" \
                  > "$RESPFILE"; then
                  echo "⚠️ Failed to Fetch Previous Cleaner Runs"
                  break
                fi

                # Validate Cleaner Runs API Response
                if ! jq -e '.workflow_runs | type == "array"' "$RESPFILE" >/dev/null; then
                  echo "⚠️ Invalid Cleaner Runs API Response"
                  break
                fi

                # Count Cleaner Runs on Page
                SELFCOUNT=$(jq '.workflow_runs | length' "$RESPFILE")
                # Stop When No More Cleaner Runs Exist
                if (( SELFCOUNT == 0 )); then
                  break
                fi

                # Append Cleaner Runs to Temporary Storage
                jq -c '.workflow_runs[]' "$RESPFILE" >> "$SELFFILE"
                # Stop After Final Partial Page
                if (( SELFCOUNT < 100 )); then
                  break
                fi

                # Advance to Next Cleaner Runs Page
                SELFPAGE=$((SELFPAGE + 1))
              done

              # Process Previously Retrieved Cleaner Runs
              while IFS= read -r RUN; do
                [[ -z "$RUN" ]] && continue
                # Extract Cleaner Run ID
                ID=$(jq -r '.id' <<< "$RUN")
                # Never Delete Current Cleaner Workflow Run
                if [[ "$ID" == "$CURRENTRUNID" ]]; then
                  continue
                fi

                # Preview Cleaner Run Deletion When Dry Run is Enabled
                if [[ "$DRYRUN" == "true" ]]; then
                  echo "🔍 Would Delete Cleaner Run ID: $ID"
                  DELETEDCOUNT=$((DELETEDCOUNT + 1))
                else
                  # Delete the Previous Cleaner Workflow Run
                  echo "📌 Deleting Previous Cleaner Run ID: $ID"
                  if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                    DELETEDCOUNT=$((DELETEDCOUNT + 1))
                  else
                    echo "⚠️ Delete Failed: $ID"
                  fi
                fi
              done < "$SELFFILE"
            else
              echo "⚠️ Cleaner Workflow ID Not Found"
            fi
          fi

          # Format Counter Values for Summary
          formatcount() {
            local value="$1"
            if [[ -z "$value" ]]; then
              echo "⚠️ Unknown"
            elif [[ "$value" -eq 0 ]]; then
              echo "✔️ None"
            else
              echo "$value"
            fi
          }

          # Prepare Final Summary Values
          TOTALDISPLAY=$(formatcount "$TOTALRUNS")
          MATCHEDDISPLAY=$(formatcount "$MATCHEDCOUNT")
          DELETEDDISPLAY=$(formatcount "$DELETEDCOUNT")
          CANCELDISPLAY=$(formatcount "$CANCELCOUNT")
          # Report Whether Dry Run Was Enabled
          if [[ "$DRYRUN" == "true" ]]; then
            DRYRUNSTATUS="✔️ Enabled"
          else
            DRYRUNSTATUS="⚠️ Disabled"
          fi

          # Write Workflow Cleanup Summary to GitHub Actions
          {
            echo "## 🧹 Workflow Cleanup Summary"
            echo ""
            echo "| Metric Description | Reported Value |"
            echo "|--------------------|----------------|"
            echo "| Selected Workflow Name | $WORKFLOWNAME |"
            echo "| Total Number of Workflow Runs Retrieved | $TOTALDISPLAY |"
            echo "| Number of Runs Evaluated for Cleanup | $MATCHEDDISPLAY |"
            echo "| Number of Workflow Runs Successfully Deleted | $DELETEDDISPLAY |"
            echo "| Number of Workflow Runs Cancelled (Ongoing / Pending) | $CANCELDISPLAY |"
            echo "| Dry Run Mode Enabled (No Changes Applied) | $DRYRUNSTATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

  clean-caches:
    runs-on: ubuntu-latest
    if: ${{ inputs.cachemode && inputs.cachemode != 'None' }}
    permissions:
      actions: write
    steps:
      - name: 🔧 Clean Caches Based on Selected Mode
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.CACHEMODE || '${{ inputs.cachemode }}';           
            console.log(`🧹 Current Cache Clean Mode: ${mode}`);
            let totalDeleted = 0;
            let totalFound = 0;
            let page = 1;
            while (true) {
              const res = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page
              });
              const caches = res.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }
              let matchedThisPage = 0;
              for (const cache of caches) {
                const key = cache.key;
                let matched = false;
                switch (mode) {
                  case 'All':
                    matched = true;
                    break;            
                  case 'CCache':
                    matched = key.startsWith('CCache-');
                    break;            
                  case 'APT-Cache':
                    matched = key.includes('APT-Cache') || key.includes('APT');
                    break;             
                  default:
                    console.log(`⚠️ Unknown Cache Clean Mode: ${mode}`);
                    return;
                }
                if (!matched) {
                  continue;
                }
                matchedThisPage++;
                totalFound++;
                console.log(`🧹 Deleting Cache: ${key}`);
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id
                  });
                  totalDeleted++;
                  console.log(`✔️ Deleted: ${key}`);
                } catch (err) {
                  console.log(`⚠️ Failed to Delete: ${key}`);
                  console.log(`   ${err.message}`);
                }
              }
              if (matchedThisPage === 0) {
                break;
              }
            }
            if (totalFound === 0) {
              console.log("⚠️ No Caches Found Matching The Criteria");
            } else {
              console.log(
                `🔎 Found ${totalFound} Matching Caches, Successfully Deleted ${totalDeleted}`
              );
            }
