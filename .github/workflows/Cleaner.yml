name: 🧹 Cleaner

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        type: choice
        description: 'Name of the Workflow ID to Clean'
        required: true
        default: '☘️ Main'
        options:
          - ☘️ OTA Image Partition Dumper & Analysis
          - ☘️ Main
          - ☘️ Master
          - ☘️ Test
          - 🍃 Monitor          
      cachemode:
        type: choice
        description: 'Type of Cache to Clean'
        required: false
        default: 'None'
        options:
          - None
          - All
          - CCache
          - APT-Cache          
      count:
        description: 'Maximum Number of Runs to Access'
        required: false
        default: '100'
      dryrun:
        description: 'Preview Only (No Deletion)'
        required: false
        type: boolean
        default: false         
      deletefailed:
        description: 'Delete Failed Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      deletesuccess:
        description: 'Delete Successful Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: false        
      deletecancelled:
        description: 'Delete Cancelled Runs of the Specified Workflow?'
        required: false
        type: boolean
        default: true        
      reverseorder:
        description: 'Clean from Oldest to Newest?'
        required: false
        type: boolean
        default: true       
      cancelall:
        description: 'Cancel All Runs of the Specified Workflow at Once?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ inputs.cancelall
     || inputs.deletefailed
     || inputs.deletesuccess
     || inputs.deletecancelled
     || inputs.dryrun }}
     
    steps:
      # ==============================
      # Install Dependencies
      # ==============================
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      # ==============================
      # Authenticate GitHub CLI
      # ==============================
      - name: 🔧 Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # ==============================
      # Clean Workflow Runs
      # ==============================
      - name: 🔧 Clean Workflow Runs
        env:
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DRYRUN: ${{ inputs.dryrun }}
          DELETEFAILED: ${{ inputs.deletefailed }}
          DELETESUCCESS: ${{ inputs.deletesuccess }}
          DELETECANCELLED: ${{ inputs.deletecancelled }}
          REVERSEORDER: ${{ inputs.reverseorder }}
          CANCELALL: ${{ inputs.cancelall }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CURRENTRUNID: ${{ github.run_id }}
          CACHEMODE: ${{ inputs.cachemode }}
        run: |
          set -e

          # Counters Initialization
          TOTALRUNS=0
          MATCHEDCOUNT=0
          DELETEDCOUNT=0
          CANCELCOUNT=0
          
          # Save Original Input
          ORIGINALCOUNT="${COUNT:-}"

          # Apply Default if Empty
          COUNT=${COUNT:-100}

          # Validate Numeric
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            COUNT=100
          fi

          # Warn if Changed
          if [[ "$COUNT" != "$ORIGINALCOUNT" ]]; then
            echo "⚠️ Invalid Count Input (${ORIGINALCOUNT:-Empty}), Defaulting to $COUNT"
          fi

          echo "📌 Using COUNT=$COUNT"

          echo "Finding Workflow ID for \"$WORKFLOW_NAME\"..."
          WORKFLOWJSON=$(gh api repos/$REPO/actions/workflows || true)
          
          if ! echo "$WORKFLOWJSON" | jq -e '.workflows | type=="array"' >/dev/null 2>&1; then
            echo "⚠️ Unable to Get Workflows (GitHub API Returned Non-JSON)"
            exit 1
          fi
          
          # Try Exact Match First
          WORKFLOWID=$(echo "$WORKFLOWJSON" | jq -r ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id")

          # Fallback to Partial Match if Exact Fails
          if [ -z "$WORKFLOWID" ]; then
            echo "⚠️ Exact Match Failed, Trying Partial Match..."
            WORKFLOWID=$(echo "$WORKFLOWJSON" | jq -r ".workflows[] | select(.name | contains(\"$WORKFLOW_NAME\")) | .id" | head -n1)
          fi

          # Final Check
          if [ -z "$WORKFLOWID" ]; then
            echo "⚠️ Workflow \"$WORKFLOW_NAME\" Not Found"
            exit 1
          fi

          echo "✔️ Using Workflow ID: $WORKFLOWID"

          echo "🔎 Fetching All Workflow Runs Page by Page..."
          PER_PAGE=100
          PAGE=1
          ALLRUNS="[]"
          while true; do
            # Fetch Workflow Runs (Paginated)
            RESP=$(gh api "repos/$REPO/actions/workflows/$WORKFLOWID/runs?per_page=$PER_PAGE&page=$PAGE" 2>/dev/null || true)

            # Validate API Response Structure Before Processing
            if ! echo "$RESP" | jq -e '.workflow_runs and (.workflow_runs | type=="array")' >/dev/null 2>&1; then
              echo "⚠️ Invalid or Empty API Response, Stopping Pagination"
              break
            fi

            RUNS=$(echo "$RESP" | jq '.workflow_runs')
            COUNTPAGE=$(echo "$RUNS" | jq 'length')
            if [ "$COUNTPAGE" -eq 0 ]; then break; fi
            ALLRUNS=$(jq -s 'add' <(echo "$ALLRUNS") <(echo "$RUNS"))
            PAGE=$((PAGE + 1))
          done

          TOTALRUNS=$(echo "$ALLRUNS" | jq 'length')
          echo "📌 Total Runs Fetched: $TOTALRUNS"
          if [[ "$CANCELALL" == "true" ]]; then
            echo "⚙️ Cancelling in Progress or Queued Runs..."
            CANCELCOUNT=0
            while IFS= read -r run; do
              ID=$(echo "$run" | jq -r '.id')
              # Skip Current Workflow Run (Safety)
              if [[ "$ID" == "$CURRENTRUNID" ]]; then
                continue
              fi
              
              # Dry Run Support
              if [[ "$DRYRUN" == "true" ]]; then
                echo "🔍 Would Cancel Run ID: $ID"
                CANCELCOUNT=$((CANCELCOUNT + 1))
              else
                echo "♻️ Cancelling Run ID: $ID"
                if gh api -X POST "repos/$REPO/actions/runs/$ID/cancel"; then
                  CANCELCOUNT=$((CANCELCOUNT + 1))
                fi
              fi
           
            done < <(echo "$ALLRUNS" | jq -c '.[] | select((.status == "in_progress") or (.status == "queued"))')            
            echo "📌 Cancelled $CANCELCOUNT Runs"
          fi

          echo "⚙️ Processing Delete Logic..."
          if [[ "$REVERSEORDER" == "true" ]]; then
            SORTED_RUNS=$(echo "$ALLRUNS" | jq 'sort_by(.run_started_at)')
          else
            SORTED_RUNS=$(echo "$ALLRUNS" | jq 'sort_by(.run_started_at) | reverse')
          fi

          TO_DELETE_RUNS=$(echo "$SORTED_RUNS" | jq ".[0:${COUNT}]")

          while IFS= read -r run; do
            ID=$(echo "$run" | jq -r '.id')
            STATUS=$(echo "$run" | jq -r '.conclusion')
            STATE=$(echo "$run" | jq -r '.status')

            if [[ "$STATE" == "in_progress" || "$STATE" == "queued" ]]; then continue; fi
            if [[ "$STATUS" == "failure" && "$DELETEFAILED" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "success" && "$DELETESUCCESS" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "cancelled" && "$DELETECANCELLED" != "true" ]]; then continue; fi

            MATCHEDCOUNT=$((MATCHEDCOUNT + 1))

            if [[ "$DRYRUN" == "true" ]]; then
              echo "🔍 Would Delete Run ID: $ID"
              DELETEDCOUNT=$((DELETEDCOUNT + 1))
            else
              echo "🔧 Deleting Run ID: $ID"
              if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                DELETEDCOUNT=$((DELETEDCOUNT + 1))
              else
                echo "⚠️ Delete Failed"
              fi
            fi
            
          done < <(echo "$TO_DELETE_RUNS" | jq -c '.[]')

          echo "🧹 Cleaning this Workflow's Runs (📃 Excluding Current Run)..."

          # Get the Workflow ID of this Cleaner Workflow
          SELF_WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows 2>/dev/null \
            | jq -r '.workflows[] | select(.name == "🧹 Cleaner") | .id')

          # Check if Cleaner Workflow Exists
          if [[ -n "$SELF_WORKFLOW_ID" ]]; then

            # Fetch Latest Runs of Cleaner Workflow (Limit: 50)
            # Suppress API + JQ Errors to Avoid Breaking Script
            SELFRUN=$(gh api "repos/$REPO/actions/workflows/$SELF_WORKFLOW_ID/runs?per_page=50" 2>/dev/null \
              | jq -c '.workflow_runs[]?' 2>/dev/null || true)

            # Only Proceed if Runs Exist
            if [[ -n "$SELFRUN" ]]; then

              # Loop Through Each Run
              while IFS= read -r run; do
                # Extract Run ID
                ID=$(echo "$run" | jq -r '.id')

                # Skip Current Running Workflow (Important Safety Check)
                if [[ "$ID" == "$CURRENTRUNID" ]]; then
                  continue
                fi

                # Log / Dry Run Handling
                if [[ "$DRYRUN" == "true" ]]; then
                  echo "🔍 Would Delete Cleaner Run ID: $ID"
                  DELETEDCOUNT=$((DELETEDCOUNT + 1))
                else
                  echo "📌 Deleting Cleaner Previous Workflow Run ID: $ID"
                  if gh api -X DELETE "repos/$REPO/actions/runs/$ID"; then
                    DELETEDCOUNT=$((DELETEDCOUNT + 1))
                  else
                    echo "⚠️ Delete Failed"
                  fi
                fi

              done < <(echo "$SELFRUN")

            else
              # No Runs Found Case
              echo "⚠️ No Previous Cleaner Runs Found"
            fi

          else
            # Cleaner Workflow Not Found Case
            echo "⚠️ Cleaner Workflow ID Not Found"
          fi

          # Format Status
          format_count() {
            local value="$1"
            if [[ -z "$value" ]]; then
              echo "⚠️ Unknown"
            elif [[ "$value" -eq 0 ]]; then
              echo "✔️ None"
            else
              echo "$value"
            fi
          }

          TOTALDISPLAY=$(format_count "$TOTALRUNS")
          MATCHEDDISPLAY=$(format_count "$MATCHEDCOUNT")
          DELETEDDISPLAY=$(format_count "$DELETEDCOUNT")
          CANCELDISPLAY=$(format_count "$CANCELCOUNT")
          
          if [[ "$DRYRUN" == "true" ]]; then
            DRYRUNSTATUS="✔️ Enabled"
          else
            DRYRUNSTATUS="⚠️ Disabled"
          fi
          
          # Workflow Cleanup Summary
          {
            echo "## 🧹 Workflow Cleanup Summary"
            echo ""
            echo "| Metric Description | Reported Value |"
            echo "|--------------------|----------------|"
            echo "| Selected Workflow Name | $WORKFLOW_NAME |"
            echo "| Total Number of Workflow Runs Retrieved | $TOTALDISPLAY |"
            echo "| Number of Runs Evaluated for Cleanup | $MATCHEDDISPLAY |"
            echo "| Number of Workflow Runs Successfully Deleted | $DELETEDDISPLAY |"
            echo "| Number of Workflow Runs Cancelled (In Progress / Queued) | $CANCELDISPLAY |"
            echo "| Dry Run Mode Enabled (No Changes Applied) | $DRYRUNSTATUS |"
          } >> $GITHUB_STEP_SUMMARY

  clean-caches:
    runs-on: ubuntu-latest
    if: ${{ inputs.cachemode && inputs.cachemode != 'None' }}
    permissions:
      actions: write
    steps:
      - name: 🔧 Clean Caches Based on Selected Mode
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.CACHEMODE || '${{ inputs.cachemode }}';
            
            console.log(`🧹 Current Cache Clean Mode: ${mode}`);

            let totalDeleted = 0;
            let totalFound = 0;
            let page = 1;

            while (true) {
              const res = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page
              });

              const caches = res.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }

              let matchedThisPage = 0;

              for (const cache of caches) {
                const key = cache.key;
                let matched = false;

                switch (mode) {
                  case 'All':
                    matched = true;
                    break;
                
                  case 'CCache':
                    matched = key.startsWith('CCache-');
                    break;
             
                  case 'APT-Cache':
                    matched = key.includes('APT-Cache') || key.includes('APT');
                    break;
             
                  default:
                    console.log(`⚠️ Unknown Cache Clean Mode: ${mode}`);
                    return;
                }

                if (!matched) {
                  continue;
                }

                matchedThisPage++;
                totalFound++;

                console.log(`🧹 Deleting Cache: ${key}`);

                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id
                  });

                  totalDeleted++;
                  console.log(`✔️ Deleted: ${key}`);
                } catch (err) {
                  console.log(`⚠️ Failed To Delete: ${key}`);
                  console.log(`   ${err.message}`);
                }
              }

              if (matchedThisPage === 0) {
                break;
              }
            }

            if (totalFound === 0) {
              console.log("⚠️ No Caches Found Matching The Criteria");
            } else {
              console.log(
                `🔎 Found ${totalFound} Matching Caches, Successfully Deleted ${totalDeleted}`
              );
            }
