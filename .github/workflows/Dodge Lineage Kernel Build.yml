name: ☘️ Dodge Lineage Kernel Build

on:
  workflow_dispatch:
    inputs:
      KSU:
        description: "KernelSU Variant"
        required: true
        type: choice
        default: "KernelSU-Next"
        options:
          - KernelSU-Next
          - Pershoot-KernelSU-Next
          - None
          
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""

      SUSFS:
        description: "SUSFS Variant"
        required: true
        type: choice
        default: "SUSFS-OKI"
        options:
          - SUSFS-OKI
          - SUSFS-GKI
          - None 

env:
  TZ: Asia/Shanghai
  WORKSPACE: ${{ github.workspace }}/kernel_workspace
  KDIR: sm8750
  CLANG_VERSION: clang-r547379

jobs:
  build:
    name: Build Kernel SM-8750 - ${{ github.actor }}
    runs-on: ubuntu-latest

    steps:
    # =========================
    # Checkout
    # =========================
    - uses: actions/checkout@v6

    # =========================
    # Swap Space
    # =========================
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    # =========================
    # Dependencies
    # =========================
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget ccache flex bison \
          build-essential libssl-dev libelf-dev bc \
          device-tree-compiler python3 libncurses5-dev

        mkdir -p "$WORKSPACE"
        echo "BUILDTIME=$(date '+%y%m%d')" >> $GITHUB_ENV

    # =========================
    # Repository Tool
    # =========================
    - name: Repository Tool
      shell: bash
      run: |    
        BIN="/usr/local/bin/repo"
        GOOGLE="https://storage.googleapis.com/git-repo-downloads/repo"
        GITHUB="https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo"
    
        echo "🚀 Checking Repository Tool Installation..."
    
        if command -v repo &>/dev/null; then
          echo "🎉 Repository Already Installed"
        else
          download() {
            curl -fL --retry 3 --retry-delay 5 "$1" -o repo
          }
    
          echo "🚀 Installing Repository Tool..."
    
          if ! download "$GOOGLE"; then
            echo "⚠️ Google Failed, Trying GitHub..."
            download "$GITHUB"
          fi
    
          chmod +x repo
          sudo mv repo "$BIN"
        fi
    
        repo --version
        echo "🎉 Google Repository Ready"

    # =========================
    # Cache CCache
    # =========================
    - name: Cache CCache
      uses: actions/cache@v4
      with:
        path: kernel_workspace/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('**/*.c', '**/*.h') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # =========================
    # Restore Cache Clang Toolchain
    # =========================
    - name: Restore Cache Clang Toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ env.WORKSPACE }}/clang-aosp
        key: ${{ env.CLANG_VERSION }}

    # =========================
    # Configure Git Identity
    # =========================
    - name: 🔧 Configure Git Identity
      shell: bash
      run: |
          if ! git config --global user.name >/dev/null; then
            git config --global user.name "AndreiMikh"
          fi
          
          if ! git config --global user.email >/dev/null; then
            git config --global user.email "andreimikhail0088@gmail.com"
          fi

          echo ""
          echo "🎉 Git Configuration Applied:"
          git config --global --list

    # =========================
    # Download Clang Toolchain
    # =========================
    - name: Download Clang Toolchain
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$WORKSPACE/clang-aosp"
        cd "$WORKSPACE"

        wget -q -O clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz

        tar -xzf clang.tar.gz -C clang-aosp
        rm clang.tar.gz

    # =========================
    # Clone Kernel Sources
    # =========================
    - name: Clone Kernel Sources
      run: |
        cd "$WORKSPACE"

        git clone --depth=1 --single-branch \
          https://github.com/LineageOS/android_kernel_oneplus_sm8750 \
          "$KDIR" &

        git clone --depth=1 --single-branch \
          https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules \
          sm8750-modules &

        wait

    # =========================
    # Kernel Version Setup
    # =========================
    - name: Kernel Version Setup
      run: |
        echo "🔎 Setup Kernel Version..."
    
        if [[ -z "${WORKSPACE:-}" || -z "${KDIR:-}" ]]; then
          echo "⚠️ Workspace or Kernel Directory Not Set"
          exit 1
        fi

        KROOT="$WORKSPACE/$KDIR"

        if [[ ! -d "$KROOT" ]]; then
          echo "⚠️ Kernel Root Not Found: $KROOT"
          echo "📂 Workspace Contents:"
          ls -la "$WORKSPACE"
          exit 1
        fi

        echo "📁 Kernel Root: $KROOT"
        echo "🔎 Detecting Kernel System Type..."
        KTYPE="Unknown"

        if [[ -f "$KROOT/build.config.gki" ]]; then
          KTYPE="GKI"
        elif [[ -f "$KROOT/android/ACK_SHA" ]]; then
          KTYPE="ACK"
        elif grep -qi "lineage" "$KROOT/Makefile" 2>/dev/null; then
          KTYPE="LINEAGE"
        elif [[ -d "$KROOT/vendor" ]] || grep -qi "oplus\|oneplus" "$KROOT/Makefile" 2>/dev/null; then
          KTYPE="OEM"
        else
          KTYPE="GENERIC"
        fi

        echo "📌 Kernel Type: $KTYPE"
        echo "KTYPE=$KTYPE" >> $GITHUB_ENV
        echo "🔎 Resolving Kernel Makefile..."
        MAKEFILE=""

        case "$KTYPE" in
          GKI|ACK|LINEAGE)
            if [[ -f "$KROOT/Makefile" ]]; then
              MAKEFILE="$KROOT/Makefile"
            fi
            ;;  
          OEM)
            if [[ -f "$KROOT/Makefile" ]]; then
              MAKEFILE="$KROOT/Makefile"
            elif [[ -f "$KROOT/kernel/Makefile" ]]; then
              MAKEFILE="$KROOT/kernel/Makefile"
            elif [[ -f "$KROOT/common/Makefile" ]]; then
              MAKEFILE="$KROOT/common/Makefile"
            fi
            ;;
          *)
            MAKEFILE="$KROOT/Makefile"
            ;;
        esac

        if [[ -z "$MAKEFILE" ]]; then
          echo "⚠️ Fallback Scan Activated..."

          MAKEFILE=$(find "$KROOT" -maxdepth 3 -type f -name "Makefile" \
            ! -path "*/drivers/*" \
            ! -path "*/net/*" \
            ! -path "*/virt/*" \
            ! -path "*/fs/*" \
            | head -n 1)
        fi

        if [[ -z "$MAKEFILE" || ! -f "$MAKEFILE" ]]; then
          echo "⚠️ No Valid Kernel Makefile Found"
          find "$KROOT" -maxdepth 2 -type f | head -n 50
          exit 1
        fi

        echo "📄 Selected Makefile: $MAKEFILE"

        if ! grep -qE "^(VERSION|PATCHLEVEL|SUBLEVEL)" "$MAKEFILE"; then
          echo "⚠️ Invalid Kernel Makefile Detected"
          head -n 20 "$MAKEFILE"
          exit 1
        fi

        echo "🧾 Parsing Kernel Version..."

        OGVERSION=$(awk '
          /^VERSION =/ {v=$3}
          /^PATCHLEVEL =/ {p=$3}
          /^SUBLEVEL =/ {s=$3}
          END {print v"."p"."s}
        ' "$MAKEFILE")

        if [[ -z "$OGVERSION" || "$OGVERSION" == ".." ]]; then
          echo "⚠️ Kernel Version Parsing Failed"
          exit 1
        fi

        echo "📌 Original Kernel Version: $OGVERSION"

        INPUTSUBLEVEL="${{ github.event.inputs.SUBLEVEL }}"

        if [[ -n "$INPUTSUBLEVEL" ]]; then
          echo "🧾 Applying Sublevel Override: $INPUTSUBLEVEL"
          sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$INPUTSUBLEVEL/" "$MAKEFILE"
        else
          echo "📌 No Sublevel Override Applied"
        fi

        NEWVERSION=$(awk '
          /^VERSION =/ {v=$3}
          /^PATCHLEVEL =/ {p=$3}
          /^SUBLEVEL =/ {s=$3}
          END {print v"."p"."s}
        ' "$MAKEFILE")

        echo "📊 Final Kernel Version: $NEWVERSION"

        echo "FULLVERSION=$NEWVERSION" >> $GITHUB_ENV

        echo "KV1=$(echo "$NEWVERSION" | cut -d. -f1)" >> $GITHUB_ENV
        echo "KV2=$(echo "$NEWVERSION" | tr -d '.')" >> $GITHUB_ENV
        echo "KV3=$(echo "$NEWVERSION" | tr -d '.')" >> $GITHUB_ENV

        echo "KSHORTVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2)" >> $GITHUB_ENV
        echo "KSHORTPATCHVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

        echo ""
        echo "🎉 Kernel Version System Complete"
        echo "➡ Type: $KTYPE"
        echo "➡ Version: $NEWVERSION"
    
    # =========================
    # KernelSU Next
    # =========================
    - name: KernelSU-Next
      if: ${{ github.event.inputs.KSU != 'None' }}
      run: |
        cd "$WORKSPACE/$KDIR"

        if [ "${{ github.event.inputs.KSU }}" = "Pershoot-KernelSU-Next" ]; then
          curl -LSs https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs
          cd KernelSU-Next
          rm -rf .git
          KSU_VERSION=$(expr $(curl -sI \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=dev&per_page=1" \
            | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') + 30000)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild
          KSU_TAG=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags \
            | grep -o '"name": *"[^"]*"' | head -n1 | cut -d'"' -f4)
          sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_TAG/" kernel/Kbuild
          echo "🎉 Pershoot KernelSU-Next Setup Complete"
       
        elif [ "${{ github.event.inputs.KSU }}" = "KernelSU-Next" ]; then
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh \
            | bash -s dev
          cd KernelSU-Next
          rm -rf .git
          KSU_VERSION=$(expr $(curl -sI \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/commits?sha=dev&per_page=1" \
            | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') + 30000)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild
          KSU_TAG=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags \
            | grep -o '"name": *"[^"]*"' | head -n1 | cut -d'"' -f4)
          sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_TAG/" kernel/Kbuild
          echo "🎉 KernelSU-Next Setup Complete" 
        else
          echo "⚠️ KSU Setup Disabled"  
        fi

    # =========================
    # SUSFS GKI (Android 15 / 6.6)
    # =========================
    - name: SUSFS GKI
      if: ${{ github.event.inputs.SUSFS == 'SUSFS-GKI' }}
      run: |    
        cd "$WORKSPACE"
    
        echo "📥 Cloning SUSFS GKI..."
        git clone --depth=1 -b gki-android15-6.6 \
          https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
    
        SUSDIR="$WORKSPACE/$KDIR"
    
        if [ ! -f "$SUSDIR/.SUSFSGKI" ]; then
          echo "🔧 Preparing Kernel Directories..."
          mkdir -p "$SUSDIR/fs"
          mkdir -p "$SUSDIR/include/linux"
    
          echo "📦 Copying SUSFS sources..."
          cp -r susfs4ksu/kernel_patches/fs/. "$SUSDIR/fs/" || true
          cp -r susfs4ksu/kernel_patches/include/linux/. "$SUSDIR/include/linux/" || true
    
          SUSPATCHFILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
    
          if [ ! -f "$SUSPATCHFILE" ]; then
            echo "⚠️ SUSFS Patch Not Found: $SUSPATCHFILE"
            exit 1
          fi
    
          echo "📥 Applying SUSFS Patch: $SUSPATCHFILE"
    
          applied=false
    
          for level in 0 1 2 3; do
            echo "🧪 Trying Patch Level $level..."
    
            if patch -d "$SUSDIR" -p$level --dry-run < "$SUSPATCHFILE" >/dev/null 2>&1; then
              echo "✔ Patch Level Detected: -P$level"
    
              patch -d "$SUSDIR" -p$level --forward --ignore-whitespace < "$SUSPATCHFILE" || true
              applied=true
              break
            fi
          done
    
          if [ "$applied" = false ]; then
            echo "⚠️ SUSFS Patch Did Not Apply Cleanly (Continuing Anyway)"
          fi
    
          touch "$SUSDIR/.SUSFSGKI"
        else
          echo "⚠️ SUSFS GKI Already Applied, Skipping"
        fi
    
    # =========================
    # SUSFS OKI (Android 15 / 6.6)
    # =========================
    - name: SUSFS OKI
      if: ${{ github.event.inputs.SUSFS == 'SUSFS-OKI' }}
      run: |    
        cd "$WORKSPACE"
    
        echo "📥 Cloning SUSFS OKI..."
        git clone --depth=1 -b oki-android15-6.6 \
          https://github.com/cctv18/susfs4oki.git susfs4ksu
    
        SUSDIR="$WORKSPACE/$KDIR"
    
        if [ ! -f "$SUSDIR/.SUSFSOKI" ]; then
          echo "🔧 Preparing Kernel Directories..."
          mkdir -p "$SUSDIR/fs"
          mkdir -p "$SUSDIR/include/linux"
    
          echo "📦 Copying SUSFS Sources..."
          cp -r susfs4ksu/kernel_patches/fs/. "$SUSDIR/fs/" || true
          cp -r susfs4ksu/kernel_patches/include/linux/. "$SUSDIR/include/linux/" || true
    
          SUSPATCHFILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
    
          if [ ! -f "$SUSPATCHFILE" ]; then
            echo "⚠️ SUSFS Patch Not Found: $SUSPATCHFILE"
            exit 1
          fi
    
          echo "📥 Applying SUSFS Patch: $SUSPATCHFILE"
    
          applied=false
    
          for level in 0 1 2 3; do
            echo "🧪 Trying Patch Level $level..."
    
            if patch -d "$SUSDIR" -p$level --dry-run < "$SUSPATCHFILE" >/dev/null 2>&1; then
              echo "✔ Patch Level Detected: -P$level"
    
              patch -d "$SUSDIR" -p$level --forward --ignore-whitespace < "$SUSPATCHFILE" || true
              applied=true
              break
            fi
          done
    
          if [ "$applied" = false ]; then
            echo "⚠️ SUSFS Patch Did Not Apply Cleanly (Continuing Anyway)"
          fi
    
          touch "$SUSDIR/.SUSFSOKI"
        else
          echo "⚠️ SUSFS OKI Already Applied, Skipping"
        fi

    # =========================
    # WildKernels Patches
    # =========================
    - name: WildKernels Patches
      if: ${{ github.event.inputs.KSU != 'None' }}
      run: |
        cd "$WORKSPACE/$KDIR"
        
        KSUPATH=$(find . -maxdepth 2 -type d -name "KernelSU*" | head -n1)
        
        if [ -z "$KSUPATH" ]; then
          echo "⚠️ KernelSU Directory Not Found, Skipping Wild Patches"
          exit 0
        fi
        
        cd "$KSUPATH"

        echo "📥 Cloning Wild Patches..."
        git clone https://github.com/Liam314839/wildpatches

        PATCHDIR="wildpatches"

        if [ ! -d "$PATCHDIR" ]; then
          echo "⚠️ Patch Directory Not Found!"
          exit 0
        fi

        echo "🔧 Applying WildKernels Patches with Auto-Detect Patch Level..."

        for patch in "$PATCHDIR"/*.patch; do
          echo "📦 Applying $patch"

          applied=false

          for level in 0 1 2; do
            if patch -p$level --dry-run < "$patch" >/dev/null 2>&1; then
              echo "✔ Detected Patch Level: -p$level"

              if patch -p$level < "$patch"; then
                echo "🔧 Applied with Level $level"
                applied=true
                break
              fi
            fi
          done

          if [ "$applied" = false ]; then
            echo "⚠️ Skipped $patch (No Matching Patch Level or Failed Apply)"
          fi
        done

        echo "🎉 WildKernels Patches Process Finished"
   
    # =========================
    # Build Kernel
    # =========================
    - name: Build Kernel
      run: |
        set -e
    
        cd "$WORKSPACE/$KDIR"
    
        # Fix "Source Tree Not Clean"
        rm -rf out
    
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH"
    
        export KBUILD_BUILD_HOST="Github-Action"
        export KBUILD_BUILD_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"
    
        AR_CMD="ARCH=${ARCH} SUBARCH=${SUBARCH} HEADER_ARCH=${HEADER_ARCH}"
        CC_CMD="CC=clang CXX=clang++"
        LLVM_CMD="LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip LLVM=1 LLVM_IAS=1"
    
        DEFCONFIG="gki_defconfig vendor/oplus/sun_perf.config"
    
        echo "📌 Running Default Config..."
        make O=out $AR_CMD $CC_CMD $LLVM_CMD $DEFCONFIG
    
        echo "🔄 Resolving Base Config..."
        make O=out $AR_CMD $CC_CMD $LLVM_CMD olddefconfig
    
        echo "🔧 Building Scripts/Config"
        make O=out $AR_CMD $CC_CMD $LLVM_CMD scripts/config
    
        # Config Tool
        CONFIGTOOL="out/scripts/config"
    
        if [ ! -f "$CONFIGTOOL" ]; then
          echo "⚠️ Scripts/Config Not Found"
          ls -R out/scripts || true
          exit 1
        fi
    
        chmod +x "$CONFIGTOOL"
        echo "📌 Using Config Tool = $CONFIGTOOL"
    
        # KSU Handling
        echo "🔧 Checking KSU Support..."
        if grep -q "^CONFIG_KSU=y" out/.config; then
          echo "🎉 KSU Supported"
          $CONFIGTOOL --file out/.config -e CONFIG_KSU
        else
          echo "⚠️ KSU Not Supported → Skipping"
        fi
    
        # SUSFS Handling
        if [ "${{ github.event.inputs.SUSFS }}" = "SUSFS-GKI" ] || \
           [ "${{ github.event.inputs.SUSFS }}" = "SUSFS-OKI" ]; then
    
          echo "🔧 Checking SUSFS Support..."
    
          if grep -q "^CONFIG_KSU_SUSFS=y" out/.config || grep -q "^CONFIG_SUSFS=y" out/.config; then
            echo "🎉 SUSFS Supported"
    
            $CONFIGTOOL --file out/.config -e CONFIG_KSU_SUSFS || true
            $CONFIGTOOL --file out/.config -e CONFIG_SUSFS || true
          else
            echo "⚠️ SUSFS Not Supported → Skipping"
          fi
        fi
    
        # FS Configs
        $CONFIGTOOL --file out/.config \
          -e CONFIG_OVERLAY_FS \
          -e CONFIG_TMPFS \
          -e CONFIG_TMPFS_XATTR \
          -e CONFIG_TMPFS_POSIX_ACL
    
        # LTO
        echo "⚙️ Enforcing LTO Config..."
        $CONFIGTOOL --file out/.config \
          -e LTO_CLANG \
          -d LTO_NONE \
          -e LTO_CLANG_THIN \
          -d LTO_CLANG_FULL \
          -e THINLTO
    
        echo "🔄 Finalizing Config..."
        make O=out $AR_CMD $CC_CMD $LLVM_CMD olddefconfig
    
        echo "🔧 Preparing Kernel..."
        make -j$(nproc) O=out $AR_CMD $CC_CMD $LLVM_CMD prepare modules_prepare
    
        echo "🔍 Final Config Check:"
        grep -i "CONFIG_KSU=" out/.config || echo "⚠️ KSU Not Enabled"
        grep -i "SUSFS" out/.config || echo "⚠️ SUSFS Not Enabled"
    
        echo "🚀 Building Kernel..."
        make -j$(nproc --all) O=out $AR_CMD $CC_CMD $LLVM_CMD

    # =========================
    # Validate Output
    # =========================
    - name: Validate Output
      run: |
        echo "🔍 Checking Kernel Output Images..."
    
        OUTPUTDIR="$WORKSPACE/$KDIR/out/arch/arm64/boot"
    
        IMAGEFOUND=$(find "$OUTPUTDIR" -name "Image*" | head -n 1)
    
        if [ -n "$IMAGEFOUND" ]; then
          echo "🚀 Kernel Image Found: $IMAGEFOUND"
          echo "IMAGEPATH=true" >> $GITHUB_ENV
          echo "IMAGEFILE=$IMAGEFOUND" >> $GITHUB_ENV
        else
          echo "⚠️ Kernel Build Failed: No Image* found"
          ls -la "$OUTPUTDIR"
          exit 1
        fi

    # =========================
    # Package AnyKernel3
    # =========================
    - name: Package AnyKernel3
      if: env.IMAGEPATH == 'true'
      run: |
        cd "$WORKSPACE"
    
        git clone --depth=1 https://github.com/AndreiMikh/AnyKernel3
        rm -rf AnyKernel3/.git
    
        cp "$IMAGEFILE" AnyKernel3/

    # =========================
    # Upload Kernel Image
    # =========================
    - name: Upload Kernel Image
      if: env.IMAGEFILE != ''
      uses: actions/upload-artifact@v7
      with:
        name: Boot-Image-Dodge-${{ env.FULLVERSION }}-${{ github.event.inputs.KSU }}
        path: ${{ env.IMAGEFILE }}
        compression-level: 0

    # =========================
    # Upload AnyKernel3
    # =========================
    - name: Upload AnyKernel3
      if: env.IMAGEPATH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: AnyKernel3-Dodge-${{ env.FULLVERSION }}-${{ github.event.inputs.KSU }}
        path: ${{ env.WORKSPACE }}/AnyKernel3
        compression-level: 0
