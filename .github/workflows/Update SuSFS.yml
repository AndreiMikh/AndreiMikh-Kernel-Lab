name: Sync Upstream SUSFS Patch to SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: SUSFS4KSU branch to use as the source of truth
        required: true
        default: gki-android15-6.6
        type: choice
        options:
          - gki-android15-6.6
          - gki-android14-6.1
          - gki-android16-6.12
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sukisu-susfs-patch
  cancel-in-progress: false

jobs:
  sync-patch:
    name: Three-way port upstream SUSFS changes to SukiSU-Ultra
    runs-on: ubuntu-latest

    env:
      SUKISU_REPOSITORY: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
      SUKISU_REF: main
      KERNELSU_BASE_REPOSITORY: https://github.com/tiann/KernelSU.git
      KERNELSU_BASE_REF: main
      SUSFS_REPOSITORY: https://github.com/AndreiMikh/susfs4ksu.git
      SUSFS_BRANCH: ${{ inputs.susfs_branch || 'gki-android15-6.6' }}
      SUSFS_PATCH_RELATIVE: kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
      OUTPUT_PATCH: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
      TARGET_BRANCH: LiquidAndrei

    steps:
      - name: Checkout kernel repository
        uses: actions/checkout@v4
        with:
          ref: LiquidAndrei
          fetch-depth: 0

      - name: Fetch upstream SUSFS source patch
        id: susfs
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_DIR="$RUNNER_TEMP/susfs4ksu"
          git clone --no-checkout "$SUSFS_REPOSITORY" "$SUSFS_DIR"
          git -C "$SUSFS_DIR" fetch --no-tags origin "$SUSFS_BRANCH"
          git -C "$SUSFS_DIR" checkout --detach FETCH_HEAD

          SUSFS_SHA="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
          SUSFS_PATCH="$SUSFS_DIR/$SUSFS_PATCH_RELATIVE"

          if [[ ! -s "$SUSFS_PATCH" ]]; then
            echo "::error::Upstream SUSFS patch not found: $SUSFS_PATCH_RELATIVE"
            exit 1
          fi

          grep -q '^diff --git ' "$SUSFS_PATCH" || {
            echo "::error::The upstream SUSFS file is not a Git-format patch."
            exit 1
          }

          echo "sha=$SUSFS_SHA" >> "$GITHUB_OUTPUT"
          echo "patch=$SUSFS_PATCH" >> "$GITHUB_OUTPUT"
          echo "SUSFS source: $SUSFS_REPOSITORY"
          echo "SUSFS branch: $SUSFS_BRANCH"
          echo "SUSFS commit: $SUSFS_SHA"

      - name: Fetch SukiSU-Ultra main
        id: sukisu
        shell: bash
        run: |
          set -euo pipefail

          SUKISU_DIR="$RUNNER_TEMP/SukiSU-Ultra"
          git clone --no-tags --no-single-branch "$SUKISU_REPOSITORY" "$SUKISU_DIR"
          git -C "$SUKISU_DIR" checkout --detach "origin/$SUKISU_REF"

          SUKISU_SHA="$(git -C "$SUKISU_DIR" rev-parse HEAD)"
          echo "sha=$SUKISU_SHA" >> "$GITHUB_OUTPUT"
          echo "SUKISU_DIR=$SUKISU_DIR" >> "$GITHUB_ENV"
          echo "SUKISU_SHA=$SUKISU_SHA" >> "$GITHUB_ENV"
          echo "SukiSU ref: $SUKISU_REF"
          echo "SukiSU commit: $SUKISU_SHA"

      - name: Import original KernelSU base objects
        id: base
        shell: bash
        run: |
          set -euo pipefail

          # The SUSFS patch was generated against tiann/KernelSU. Its index
          # hashes identify the original pre-patch blobs. Fetching this history
          # places those blobs in the SukiSU repository's object database so
          # git apply --3way can perform a real three-way merge.
          git -C "$SUKISU_DIR" fetch --no-tags "$KERNELSU_BASE_REPOSITORY" "$KERNELSU_BASE_REF"

          KERNELSU_BASE_SHA="$(git -C "$SUKISU_DIR" rev-parse FETCH_HEAD)"
          echo "sha=$KERNELSU_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "KernelSU base repository: $KERNELSU_BASE_REPOSITORY"
          echo "KernelSU base ref: $KERNELSU_BASE_REF"
          echo "KernelSU base commit: $KERNELSU_BASE_SHA"

      - name: Verify every upstream patch base blob is available
        shell: bash
        env:
          SUSFS_PATCH: ${{ steps.susfs.outputs.patch }}
        run: |
          set -euo pipefail

          python3 - "$SUSFS_PATCH" "$SUKISU_DIR" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          patch_path = Path(sys.argv[1])
          repo = sys.argv[2]
          patch = patch_path.read_text(encoding="utf-8", errors="replace")
          base_ids = re.findall(r"^index ([0-9a-f]+)\.\.[0-9a-f]+(?: [0-7]{6})?$", patch, re.M)
          if not base_ids:
              raise SystemExit("No Git blob index entries found in the upstream patch.")

          missing = []
          for blob in sorted(set(base_ids)):
              result = subprocess.run(
                  ["git", "-C", repo, "cat-file", "-e", f"{blob}^{{blob}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode:
                  missing.append(blob)

          print(f"Found {len(set(base_ids))} distinct upstream base blobs in patch metadata.")
          if missing:
              print("Missing original blobs:")
              for blob in missing:
                  print(f"  {blob}")
              raise SystemExit(
                  "The fetched KernelSU history does not contain every patch base blob. "
                  "Refusing to attempt an unreliable merge."
              )
          print("All upstream base blobs are available for three-way application.")
          PY

      - name: Three-way apply upstream SUSFS patch to SukiSU
        id: port
        shell: bash
        env:
          SUSFS_PATCH: ${{ steps.susfs.outputs.patch }}
        run: |
          set -euo pipefail

          if ! git -C "$SUKISU_DIR" apply --3way --index "$SUSFS_PATCH"; then
            echo "::error::The upstream SUSFS patch has source conflicts against SukiSU-Ultra."
            echo "Git now has the original KernelSU base blobs, so this is a genuine merge conflict rather than a missing-blob error."
            echo "Conflicting/unmerged paths:"
            git -C "$SUKISU_DIR" ls-files -u || true
            echo "Working tree status:"
            git -C "$SUKISU_DIR" status --short || true
            exit 1
          fi

          if [[ -n "$(git -C "$SUKISU_DIR" ls-files -u)" ]]; then
            echo "::error::Unmerged index entries remain after three-way application."
            git -C "$SUKISU_DIR" ls-files -u
            exit 1
          fi

          if ! git -C "$SUKISU_DIR" diff --quiet; then
            echo "::error::Unexpected unstaged changes remain after --index application."
            git -C "$SUKISU_DIR" diff --stat
            exit 1
          fi

          git -C "$SUKISU_DIR" diff --cached --check
          git -C "$SUKISU_DIR" diff --cached --quiet "$SUKISU_SHA" && {
            echo "::error::The SUSFS patch produced no changes."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/$(dirname "$OUTPUT_PATCH")"
          OUTPUT_FILE="$GITHUB_WORKSPACE/$OUTPUT_PATCH"
          git -C "$SUKISU_DIR" diff --cached --binary --full-index "$SUKISU_SHA" -- > "$OUTPUT_FILE"

          if [[ ! -s "$OUTPUT_FILE" ]]; then
            echo "::error::Generated SukiSU patch is empty."
            exit 1
          fi

          echo "Generated SukiSU patch: $OUTPUT_PATCH"
          echo "Generated patch size: $(wc -c < "$OUTPUT_FILE") bytes"

      - name: Verify generated patch on a pristine SukiSU checkout
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/SukiSU-Ultra-Verify"
          OUTPUT_FILE="$GITHUB_WORKSPACE/$OUTPUT_PATCH"

          git -C "$SUKISU_DIR" worktree add --detach "$VERIFY_DIR" "$SUKISU_SHA"
          git -C "$VERIFY_DIR" apply --check "$OUTPUT_FILE"
          git -C "$VERIFY_DIR" apply --index "$OUTPUT_FILE"
          git -C "$VERIFY_DIR" diff --cached --check

          SOURCE_TREE="$(git -C "$SUKISU_DIR" write-tree)"
          VERIFY_TREE="$(git -C "$VERIFY_DIR" write-tree)"
          if [[ "$SOURCE_TREE" != "$VERIFY_TREE" ]]; then
            echo "::error::Clean-checkout application did not reproduce the generated SukiSU tree."
            echo "Expected tree: $SOURCE_TREE"
            echo "Actual tree:   $VERIFY_TREE"
            exit 1
          fi

          echo "Generated patch applies cleanly and reproduces the merged SukiSU tree."

      - name: Create sync report
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/susfs-report"
          {
            echo "SukiSU-Ultra SUSFS three-way port report"
            echo
            echo "- SUSFS repository: $SUSFS_REPOSITORY"
            echo "- SUSFS branch: $SUSFS_BRANCH"
            echo "- SUSFS commit: ${{ steps.susfs.outputs.sha }}"
            echo "- Upstream patch: $SUSFS_PATCH_RELATIVE"
            echo "- KernelSU base repository: $KERNELSU_BASE_REPOSITORY"
            echo "- KernelSU base ref: $KERNELSU_BASE_REF"
            echo "- KernelSU base commit: ${{ steps.base.outputs.sha }}"
            echo "- SukiSU repository: $SUKISU_REPOSITORY"
            echo "- SukiSU ref: $SUKISU_REF"
            echo "- SukiSU commit: ${{ steps.sukisu.outputs.sha }}"
            echo "- Output patch: $OUTPUT_PATCH"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "- Three-way application: passed"
              echo "- Clean-checkout verification: passed"
            else
              echo "- Result: failed; inspect the workflow log for missing blobs or merge conflicts"
            fi
            echo
            echo "Patch application is not a kernel build or runtime test."
          } > "$RUNNER_TEMP/susfs-report/report.txt"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SUSFS-Three-Way-Port-Report
          path: ${{ runner.temp }}/susfs-report/report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request with generated patch
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-sukisu-susfs-patch
          base: LiquidAndrei
          delete-branch: true
          add-paths: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
          commit-message: "sync: port upstream SUSFS patch to SukiSU-Ultra"
          title: "sync: update SukiSU-Ultra SUSFS patch"
          body: |
            This pull request was generated by applying the upstream SUSFS4KSU patch to SukiSU-Ultra using Git's three-way merge.

            - SUSFS source: https://github.com/AndreiMikh/susfs4ksu
            - SUSFS branch: `${{ env.SUSFS_BRANCH }}`
            - SUSFS commit: `${{ steps.susfs.outputs.sha }}`
            - KernelSU base objects: https://github.com/tiann/KernelSU (`${{ env.KERNELSU_BASE_REF }}`)
            - SukiSU source: https://github.com/SukiSU-Ultra/SukiSU-Ultra (`${{ env.SUKISU_REF }}`)
            - SukiSU commit: `${{ steps.sukisu.outputs.sha }}`
            - Generated patch: `${{ env.OUTPUT_PATCH }}`

            The workflow refuses to publish if any original patch base blob is missing, if Git reports a merge conflict, or if the generated patch does not reproduce the merged tree on a clean SukiSU checkout.

            Patch application is validated; no kernel build or runtime test is performed.
