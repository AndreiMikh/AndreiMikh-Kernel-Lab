name: OTA Image Partition Dumper & Analysis

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device Model'
        required: true
        type: choice
        options:
          - OP 10 PRO
          - OP 11
          - OP 11R
          - OP 12
          - OP 12R
          - OP 13
          - OP 13R
          - OP 13S
          - OP 13T
          - OP 15
          - OP 15R
          - OP 15T
          - OP ACE 3
          - OP ACE 3 PRO
          - OP ACE 3V
          - OP ACE 5
          - OP ACE 5 PRO
          - OP ACE 5 ULTRA
          - OP ACE 5 RACING
          - OP ACE 6
          - OP ACE 6T
          - OP TURBO 6
          - OP TURBO 6V
          - OP NORD 4
          - OP NORD CE4
          - OP NORD 5
          - OP NORD CE5
          - OP PAD
          - OP PAD LITE
          - OP PAD2
          - OP PAD2 PRO
          - OP PAD3
          - OP PAD GO 2
          - OP OPEN
          - OPPO FIND N5
          - OPPO FIND X8
          - OPPO FIND X8 PRO
          - OPPO FIND X8 ULTRA
          - OPPO FIND X9
          - OPPO FIND X9 PRO
          - OPPO RENO 15 PRO
          - Realme GT5 PRO
          - Realme GT7 PRO
          - Realme GT8 PRO
        default: 'OP 13'
        
      region:
        description: 'Regional Version'
        required: true
        type: choice
        options:
          - GLO
          - EU
          - IN
          - CN
          - NA
        default: 'GLO'
        
      version_index:
        description: 'Version Index (0=Latest, 1=Second Latest & So-on Etc)'
        required: true
        type: number
        default: 0
        
      partitions:
        description: 'Partitions to Extract (Comma Separated, Leave Empty to Extract Default Value)'
        required: false
        type: string
        default: 'boot,init_boot,vendor_boot,vbmeta'
        
      extract_kernel_info:
        description: 'Extract Kernel Build Time & Name'
        required: false
        type: boolean
        default: true
        
      workers:
        description: 'Number of Parallel Working Threads'
        required: false
        type: number
        default: 4

jobs:
  extract:
    name: 👾 Extract Partitions
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2  # Install aria2 as a system package
          pip install httpx beautifulsoup4  # Install Python dependencies

      - name: 🔗 Get OTA Download URL
        id: get_ota
        run: |
          python3 << 'PYEOF'
          import httpx
          import json
          import os
          import re
          from bs4 import BeautifulSoup

          device = "${{ inputs.device }}"
          region = "${{ inputs.region }}"
          version_index = ${{ inputs.version_index }}

          url = "https://roms.danielspringer.at/index.php?view=ota"
          resp = httpx.get(url, follow_redirects=True)
          resp.raise_for_status()

          soup = BeautifulSoup(resp.text, 'html.parser')
          select = soup.find('select', id='device')
          devices = json.loads(select['data-devices'])

          if device not in devices:
              raise Exception(f"Device '{device}' not found")

          device_regions = devices[device]
          if region not in device_regions:
              raise Exception(f"Region '{region}' not available for '{device}'")

          versions = device_regions[region]
          if not versions:
              raise Exception(f"No versions for '{device}' in '{region}'")

          if version_index >= len(versions):
              raise Exception(f"Version index {version_index} out of range (0-{len(versions)-1})")

          version = versions[version_index]
          print(f"Selected: {device} | {region} | {version}")

          post_data = {
              "device": device,
              "region": region,
              "version_index": str(version_index)
          }

          post_resp = httpx.post(url, data=post_data, follow_redirects=True)
          post_resp.raise_for_status()

          post_soup = BeautifulSoup(post_resp.text, 'html.parser')

          download_url = None
          for a in post_soup.find_all('a', href=True):
              href = a['href']
              if any(kw in href.lower() for kw in ['download', 'ota', 'firmware', 'update', '.zip']):
                  if href.startswith('http'):
                      download_url = href
                      break

          if not download_url:
              with open('response_debug.html', 'w') as f:
                  f.write(post_resp.text)
              raise Exception("Could not find download URL. Check response_debug.html")

          print(f"Download URL: {download_url}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ota_url={download_url}\n')
              f.write(f'version={version}\n')
          PYEOF

      - name: 📋 Show OTA Information
        run: |
          echo "📱 Device Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- *Device*: ${{ inputs.device }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Region*: ${{ inputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Version*: ${{ steps.get_ota.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- *OTA URL*: \`${{ steps.get_ota.outputs.ota_url }}\`" >> $GITHUB_STEP_SUMMARY

      - name: 🛠️ Install Payload-Dumper
        run: pip install git+https://github.com/5ec1cff/payload-dumper

      - name: 📂 Download OTA and Extract Specified Partitions
        run: |
          OTA_URL="${{ steps.get_ota.outputs.ota_url }}"
          if [ -z "$OTA_URL" ]; then
            echo "⚠️ OTA URL is Empty, Cannot Proceed"
            exit 1
          fi

          PARTITIONS_ARG=""
          if [ -n "${{ inputs.partitions }}" ]; then
            PARTITIONS_ARG="--partitions ${{ inputs.partitions }}"
          fi

          # ⚙️ Use Caching Mechanism to Store Downloaded OTA after the First Download
          if [ -f "./output/ota.zip" ]; then
            echo "📩 OTA Already Downloaded, Skipping Download"
          else
            aria2c -x 16 -s 16 -j 4 -d ./output -o ota.zip "$OTA_URL"  # Download OTA file with aria2c for speed
          fi

          payload_dumper \
            $PARTITIONS_ARG \
            --workers ${{ inputs.workers }} \
            --out ./output \
            ./output/ota.zip

      - name: 🧹 Clean Up
        run: |
          echo "🧹 Cleaning Up Downloaded OTA File..."
          rm -f ./output/ota.zip  # Remove the Downloaded OTA File After Extraction
          echo "✔️ Clean Up Complete"

      - name: 🔍 Extract Kernel Build Information
        id: kernel_info
        if: inputs.extract_kernel_info == true
        run: |
          BOOT_IMG="output/boot.img"

          if [ ! -f "$BOOT_IMG" ]; then
            echo "⚠️ Boot Image Not Found, Skipping Kernel Info Extraction"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "found=true" >> $GITHUB_OUTPUT

          # 🧾 Extract Kernel Information using strings and regex
          python3 << 'PYEOF'
          import subprocess
          import re
          import os

          boot_img_path = "./output/boot.img"
          kernel_version = None
          kernel_time = None
          full_string = None

          def search_version(text):
              global kernel_version, kernel_time, full_string
              
              match = re.search(
                  r'Linux version (\S+)\s+\([^)]+\)\s+\([^)]+\)\s+#1\s+SMP\s+PREEMPT\s+(.+)',
                  text
              )
              if match:
                  kernel_version = match.group(1)
                  kernel_time = match.group(2).strip()
                  full_string = f"Linux version {kernel_version} ... #1 SMP PREEMPT {kernel_time}"
                  return True
              
              ver_match = re.search(r'Linux\s+version\s+(\d+\.\d+\.\d+-[^\s]+)', text)
              if not ver_match:
                  ver_match = re.search(r'(\d+\.\d+\.\d+-android\d+-[^\s]+)', text)
              
              if ver_match:
                  kernel_version = ver_match.group(1)
                  time_match = re.search(
                      r'#1\s+SMP\s+PREEMPT\s+((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+\w+\s+\d+\s+[\d:]+\s+\w+\s+\d{4})',
                      text
                  )
                  if time_match:
                      kernel_time = time_match.group(1)
                  full_string = f"Linux version {kernel_version} ... #1 SMP PREEMPT {kernel_time or 'Unknown'}"
                  return True
              return False

          result = subprocess.run(['strings', boot_img_path], capture_output=True, text=True)
          if search_version(result.stdout):
              print("📂 Kernel Version Found: ", kernel_version)
              print("📂 Kernel Build Time: ", kernel_time)
          else:
              print("⚠️ Could Not Extract Kernel Information")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'kernel_version={kernel_version}\n')
              f.write(f'kernel_time={kernel_time or "Unknown"}\n')
          PYEOF

      - name: 🌏 Detect Region from Boot Image
        id: detect_region
        run: |
          BOOT_IMG="output/boot.img"

          VARIANT="Unknown"
          CONFIDENCE="Low"

          if [[ ! -f "$BOOT_IMG" ]]; then
            echo "⚠️ Boot Image Not Found → Cannot Detect Region"
            echo "variant=$VARIANT" >> $GITHUB_OUTPUT
            echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Scanning boot.img for region markers..."

          # Extract strings once (optimized)
          STRINGS_OUTPUT=$(strings "$BOOT_IMG" 2>/dev/null || true)
          LOWER_STRINGS=$(printf "%s" "$STRINGS_OUTPUT" | tr '[:upper:]' '[:lower:]')

          echo "🔎 Debug Matches:"
          printf "%s\n" "$STRINGS_OUTPUT" \
            | grep -iE "androidboot|fingerprint|oplus|coloros|oxygen" \
            | head -n 10 || true

          echo "------------------------------"
          echo "🧠 Detecting Region..."
          echo "------------------------------"

          # HIGH CONFIDENCE (boot markers)
          if [[ "$LOWER_STRINGS" == *coloros* ]]; then
            VARIANT="🇨🇳 China"
            CONFIDENCE="High"
            echo "🇨🇳 ColorOS detected → China"

          elif [[ "$LOWER_STRINGS" == *oxygen* ]]; then
            VARIANT="🌍 Global"
            CONFIDENCE="High"
            echo "🌍 OxygenOS detected → Global"

          elif [[ "$LOWER_STRINGS" == *europe* || "$LOWER_STRINGS" == *eea* ]]; then
            VARIANT="🇪🇺 Europe"
            CONFIDENCE="High"
            echo "🇪🇺 EU markers detected → Europe"

          elif [[ "$LOWER_STRINGS" == *india* ]]; then
            VARIANT="🇮🇳 India"
            CONFIDENCE="High"
            echo "🇮🇳 India markers detected → India"

          else
            echo "⚠️ No Strong Boot Markers Found → Using Input Region"

            # FALLBACK: use workflow input (medium confidence)
            case "${{ inputs.region }}" in
              CN)
                VARIANT="🇨🇳 China"
                ;;
              GLO|NA)
                VARIANT="🌍 Global"
                ;;
              EU)
                VARIANT="🇪🇺 Europe"
                ;;
              IN)
                VARIANT="🇮🇳 India"
                ;;
              *)
                VARIANT="Unknown"
                ;;
            esac

            CONFIDENCE="Medium"
            echo "📦 Fallback → Using Input Region: $VARIANT"
          fi

          echo "------------------------------"
          echo "📌 Final Variant: $VARIANT"
          echo "🎯 Confidence: $CONFIDENCE"
          echo "------------------------------"

          echo "variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT

      - name: 📊 Build Summary
        run: |
          echo "### 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌏 Variant | \`${{ steps.detect_region.outputs.variant }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Confidence | \`${{ steps.detect_region.outputs.confidence }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Kernel Version | \`${{ steps.kernel_info.outputs.kernel_version || 'Unknown' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕒 Build Time | \`${{ steps.kernel_info.outputs.kernel_time || 'Unknown' }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Extracted Partitions as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Partitions
          path: ./output/*.img
          retention-days: 30
