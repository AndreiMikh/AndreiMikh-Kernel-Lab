name: ☘️ OTA Image Partition Dumper & Analysis

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device Model'
        required: true
        type: choice
        default: 'OP 13'      
        options:
          - OP 10 PRO
          - OP 11
          - OP 11R
          - OP 12
          - OP 12R
          - OP 13
          - OP 13R
          - OP 13S
          - OP 13T
          - OP 15
          - OP 15R
          - OP 15T
          - OP ACE 3
          - OP ACE 3 PRO
          - OP ACE 3V
          - OP ACE 5
          - OP ACE 5 PRO
          - OP ACE 5 ULTRA
          - OP ACE 5 RACING
          - OP ACE 6
          - OP ACE 6T
          - OP TURBO 6
          - OP TURBO 6V
          - OP NORD 4
          - OP NORD CE4
          - OP NORD 5
          - OP NORD CE5
          - OP PAD
          - OP PAD LITE
          - OP PAD2
          - OP PAD2 PRO
          - OP PAD3
          - OP PAD GO 2
          - OP OPEN
          - OPPO FIND N5
          - OPPO FIND X8
          - OPPO FIND X8 PRO
          - OPPO FIND X8 ULTRA
          - OPPO FIND X9
          - OPPO FIND X9 PRO
          - OPPO RENO 15 PRO
          - Realme GT5 PRO
          - Realme GT7 PRO
          - Realme GT8 PRO       
      region:
        description: 'Regional Version'
        required: true
        type: choice
        default: 'GLO'
        options:
          - GLO
          - EU
          - IN
          - CN
          - NA              
      indexversion:
        description: 'Version Index (0=Latest, 1=Second Latest & So-on Etc)'
        required: true
        type: number
        default: 0       
      partitions:
        description: 'Partitions to Extract (Comma Separated, Leave Empty to Extract Default Value)'
        required: false
        type: string
        default: 'boot,dtbo,init_boot,vendor_boot,vbmeta'        
      kernelinfo:
        description: 'Extract Kernel Build Time & Name'
        required: false
        type: boolean
        default: true     
      workers:
        description: 'Number of Parallel Working Threads'
        required: false
        type: number
        default: 4
jobs:
  extract:
    name: 👾 Extract Partitions
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🔧 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2  # Install Aria2 as a System Package
          pip install httpx beautifulsoup4  # Install Python Dependencies

      - name: 🔗 Get OTA Download URL
        id: ota-dl-url
        run: |
          python3 << 'PYEOF'
          import httpx
          import json
          import os
          from bs4 import BeautifulSoup     
          device = "${{ inputs.device }}"
          region = "${{ inputs.region }}"
          indexversion = ${{ inputs.indexversion }}      
          url = "https://roms.danielspringer.at/index.php?view=ota"      
          resp = httpx.get(
              url,
              followredirects=True
          )
          resp.raise_for_status()      
          soup = BeautifulSoup(
              resp.text,
              'html.parser'
          )     
          select = soup.find(
              'select',
              id='device'
          )      
          devices = json.loads(
              select['data-devices']
          )    
          if device not in devices:
              raise Exception(
                  f"Device '{device}' not found"
              )    
          deviceregions = devices[device]     
          if region not in deviceregions:
              raise Exception(
                  f"Region '{region}' not available for '{device}'"
              )    
          versions = deviceregions[region]      
          if not versions:
              raise Exception(
                  f"No versions for '{device}' in '{region}'"
              )      
          if indexversion >= len(versions):
              raise Exception(
                  f"Version index {indexversion} "
                  f"out of range (0-{len(versions) - 1})"
              )      
          version = versions[indexversion]      
          print(
              f"Selected: {device} | {region} | {version}"
          )      
          postdata = {
              "device": device,
              "region": region,
              "indexversion": str(indexversion)
          }      
          postresp = httpx.post(
              url,
              data=postdata,
              followredirects=True
          )
          postresp.raise_for_status()      
          postsoup = BeautifulSoup(
              postresp.text,
              'html.parser'
          )    
          downloadurl = None      
          for a in postsoup.find_all(
              'a',
              href=True
          ):
              href = a['href']
              hreflower = href.lower()   
              if any(
                  kw in hreflower
                  for kw in [
                      'download',
                      'ota',
                      'firmware',
                      'update',
                      '.zip'
                  ]
              ):
                  if href.startswith('http'):
                      downloadurl = href
                      break      
          if not downloadurl:
              debugfile = 'responsedebug.html'     
              with open(
                  debugfile,
                  'w'
              ) as f:
                  f.write(postresp.text)  
              raise Exception(
                  "Could Not Find Download URL - "
                  "Check Responsedebug.html"
              )      
          print(
              f"Download URL: {downloadurl}"
          )     
          with open(
              os.environ['GITHUB_OUTPUT'],
              'a'
          ) as f:
              f.write(
                  f'otadlurl={downloadurl}\n'
              )
              f.write(
                  f'version={version}\n'
              )
          PYEOF
     
      - name: 📋 Show OTA Information
        run: |
          echo "📱 Device Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- *Device*: ${{ inputs.device }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Region*: ${{ inputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- *Version*: ${{ steps.ota-dl-url.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- *OTA URL*: \`${{ steps.ota-dl-url.outputs.otadlurl }}\`" >> $GITHUB_STEP_SUMMARY

      - name: 🛠️ Install Payload-Dumper
        run: pip install git+https://github.com/5ec1cff/payload-dumper

      - name: 📁 Prepare Output Directory
        run: mkdir -p ./output

      - name: 📂 Download OTA and Extract Specified Partitions
        run: |
          OTADLURL="${{ steps.ota-dl-url.outputs.otadlurl }}"
          if [ -z "$OTADLURL" ]; then
            echo "⚠️ OTA URL is Empty, Cannot Proceed"
            exit 1
          fi

          # ⚙️ Use Caching Mechanism to Store Downloaded OTA After the First Download
          if [ -f "./output/ota.zip" ]; then
            echo "📩 OTA Already Downloaded, Skipping Download"
          else
            aria2c -x 16 -s 16 -j 4 -d ./output -o ota.zip "$OTADLURL"  # Download OTA File With Aria2c For Speed
          fi

          # Handle Partitions Safely
          PARTITIONS="${{ inputs.partitions }}"
          # If Empty → Use Default
          if [[ -z "$PARTITIONS" ]]; then
            PARTITIONS="boot,dtbo,init_boot,vendor,vendor_boot,vbmeta"
          fi

          # Remove .IMG if User Inputs File Names
          PARTITIONS=$(echo "$PARTITIONS" | sed 's/\.img//g')
          # Always Ensure Vendor is Included
          if [[ ",$PARTITIONS," != *",vendor,"* ]]; then
            echo "⚠️ Vendor Image Not Included — Auto-Adding for ROM Detection"
            PARTITIONS="${PARTITIONS},vendor"
          fi

          echo "📦 Final Partitions: $PARTITIONS"
          payload_dumper \
            --partitions "$PARTITIONS" \
            --workers ${{ inputs.workers }} \
            --out ./output \
            ./output/ota.zip

      - name: 🧹 Cleanup
        run: |
          echo "🧹 Cleaning Up Downloaded OTA File..."
          rm -f ./output/ota.zip  # Remove the Downloaded OTA File After Extraction
          echo "✔️ Cleanup Complete"

      - name: 🔍 Extract Kernel Build Information
        id: kernel-info
        if: ${{ inputs.kernelinfo == true }}
        run: |
          BOOTIMAGE="output/boot.img"
          if [ ! -f "$BOOTIMAGE" ]; then
            echo "⚠️ Boot Image Not Found, Skipping Kernel Info Extraction"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "found=true" >> $GITHUB_OUTPUT
          # 🧾 Extract Kernel Information Using Strings and Regex
          python3 << 'PYEOF'
          import subprocess
          import re
          import os
          bootimagepath = "./output/boot.img"
          kernelversion = None
          kerneltime = None
          fullstring = None
          def searchversion(text):
              global kernelversion, kerneltime, fullstring           
              match = re.search(
                  r'Linux version (\S+)\s+\([^)]+\)\s+\([^)]+\)\s+#1\s+SMP\s+PREEMPT\s+(.+)',
                  text
              )
              if match:
                  kernelversion = match.group(1)
                  kerneltime = match.group(2).strip()
                  fullstring = f"Linux version {kernelversion} ... #1 SMP PREEMPT {kerneltime}"
                  return True            
              versionmatch = re.search(r'Linux\s+version\s+(\d+\.\d+\.\d+-[^\s]+)', text)
              if not versionmatch:
                  versionmatch = re.search(r'(\d+\.\d+\.\d+-android\d+-[^\s]+)', text)            
              if versionmatch:
                  kernelversion = versionmatch.group(1)
                  timematch = re.search(
                      r'#1\s+SMP\s+PREEMPT\s+((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+\w+\s+\d+\s+[\d:]+\s+\w+\s+\d{4})',
                      text
                  )
                  if timematch:
                      kerneltime = timematch.group(1)
                  fullstring = f"Linux version {kernelversion} ... #1 SMP PREEMPT {kerneltime or 'Unknown'}"
                  return True
              return False
          result = subprocess.run(['strings', bootimagepath], capture_output=True, text=True)
          if searchversion(result.stdout):
              print("📂 Kernel Version Found: ", kernelversion)
              print("📂 Kernel Build Time: ", kerneltime)
          else:
              print("⚠️ Could Not Extract Kernel Information")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'kernelversion={kernelversion}\n')
              f.write(f'kerneltime={kerneltime or "Unknown"}\n')
          PYEOF

      - name: 🧰 Install Android Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils

      - name: 🌏 Advanced ROM Base Detection
        id: detect-region
        run: |
          echo "🔍 Detecting ROM Base..."
          # Multi-Source String Extraction
          OUTPUTSTRINGS=""
          # Extract Vendor Image
          if [[ -f "output/vendor.img" ]]; then
            echo "🔧 Extracting Vendor Image..."
            mkdir -p vendormount
            # Convert Sparse → Raw (If Needed)
            simg2img output/vendor.img vendor_raw.img 2>/dev/null || cp output/vendor.img vendor_raw.img
            # Mount
            if sudo mount -o loop vendor_raw.img vendormount; then
              echo "✔️ Vendor Mounted Successfully"
              # Find All Build Properties Locations
              echo "🔍 Searching for build.prop files:"
              find vendormount -iname "*build.prop" 2>/dev/null || echo "⚠️ No Build Properties Found"               
              # Debug
              echo "📂 Checking extracted files:"
              ls -lh output/ || echo "⚠️ Output / Folder Missing"
              # Direct Vendor Property Check (All Locations)
              echo "🔎 Direct Vendor Property Check (All Files):"
              find vendormount -iname "*build.prop" 2>/dev/null | while read -r file; do
                echo "📄 Checking: $file"
                sudo grep -iE "oplus.region|product.locale|ro.boot.hwc|androidboot.hwc" "$file" 2>/dev/null || true
              done
            
              # Reading Vendor Build Properties in All Locations
              echo "📦 Reading Vendor Build Properties (All Locations)"
              while IFS= read -r file; do
                echo "📄 Reading: $file"
                OUTPUTSTRINGS+="$(sudo cat "$file" 2>/dev/null || true)\n"
              done < <(find vendormount -iname "*build.prop" 2>/dev/null)
              echo "🔬 Vendor Region Properties:"
              echo "$OUTPUTSTRINGS" | grep -iE "oplus.region|product.locale|ro.boot.hwc|androidboot.hwc" || echo "⚠️ No Region Properties Found"
            else
              echo "⚠️ Vendor Mount Failed — Skipping Vendor Detection"
            fi
          fi
          
          if [[ -f "output/vendor_boot.img" ]]; then
            echo "📦 Using Vendor Boot Image (Primary Source)"
            OUTPUTSTRINGS+="$(strings output/vendor_boot.img 2>/dev/null || true)\n"
          fi

          if [[ -f "output/boot.img" ]]; then
            echo "📦 Using Boot Image (Secondary Source)"
            OUTPUTSTRINGS+="$(strings output/boot.img 2>/dev/null || true)\n"
          fi

          if [[ -f "output/dtbo.img" ]]; then
            echo "📦 Using DTBO Image (Cmdline Source)"
            OUTPUTSTRINGS+="$(strings output/dtbo.img 2>/dev/null || true)\n"
          fi

          if [[ -z "$OUTPUTSTRINGS" ]]; then
            echo "⚠️ No Valid Images Found"
            echo "variant=Unknown" >> $GITHUB_OUTPUT
            echo "confidence=Low" >> $GITHUB_OUTPUT
            echo "romtype=Unknown" >> $GITHUB_OUTPUT
            exit 0
          fi

          LOWERSTRINGS=$(printf "%b" "$OUTPUTSTRINGS" 2>/dev/null \
            | tr '[:upper:]' '[:lower:]' \
            | tr -s '[:space:]' ' ')
          # Default
          REGION="UNKNOWN"
          # Normalize Detection Source Once
          REGIONSRC="$LOWERSTRINGS"
          # Extract Region Using Regex (Single Pass)
          if [[ "$REGIONSRC" =~ (ro\.oplus\.region|ro\.vendor\.oplus\.region|androidboot\.hwc)=(cn|global|eu|india) ]]; then
            DETECTEDREGION="${BASH_REMATCH[2]}"
            case "$DETECTEDREGION" in
              cn)
                REGION="🇨🇳 China"
                ;;
              global)
                REGION="🇺🇸 Global"
                ;;
              eu)
                REGION="🇪🇺 Europe"
                ;;
              india)
                REGION="🇮🇳 India"
                ;;
            esac
          fi

          # OSSI Detection (Modern OPlus Unified ROM)
          if [[ "$LOWERSTRINGS" =~ oplus/ossi ]]; then
            echo "🧠 Detected OPlus System Software Integration-Based (AOSP-Based Vendor)"
            REGION="🌐 OPlus System Software Integration (OSSI) (Modern OPlus Unified ROM)"
          fi

          # Fingerprint-Based Region Hint (OSSI Fallback)
          if [[ "$LOWERSTRINGS" =~ fingerprint ]]; then
            if [[ "$LOWERSTRINGS" =~ cn ]]; then
              echo "🌏 Hint: Possible China-Based OPlus System Software Integration"
            elif [[ "$LOWERSTRINGS" =~ global ]]; then
              echo "🌏 Hint: Possible Global-Based OPlus System Software Integration"
            fi
          fi

          # Conversion Detection (Debug)
          if [[ "$REGION" == *"China"* && "$LOWERSTRINGS" =~ oxygen ]]; then
            echo "⚠️ Detected CN base with Oxygen Components (Converted ROM)"
          fi
          
          echo "🔬 HWC / Cmdline Detection:"
          echo "$LOWERSTRINGS" | grep -iE "androidboot\.hwc|hwc=" || echo "⚠️ No HWC Found"          
          echo "🔎 Debug Matches (Top 20 Relevant Lines):"
          printf "%b" "$OUTPUTSTRINGS" \
            | grep -iE "androidboot|fingerprint|oplus|coloros|oxygen|hwc|build" \
            | head -n 20 || true
          echo "🧠 Analyzing Kernel Strings..."
          COLORSCORE=0
          OXYGENSCORE=0
          # Strong Vendor Signals (Highest Priority)
          # China Variant Detection
          [[ "$LOWERSTRINGS" =~ ro\.oplus\.region=cn ]] && ((COLORSCORE+=20))
          [[ "$LOWERSTRINGS" =~ ro\.vendor\.oplus\.region=cn ]] && ((COLORSCORE+=20))
          [[ "$LOWERSTRINGS" =~ ro\.product\.locale=zh-cn ]] && ((COLORSCORE+=10))
          # Global / Europe / India Variant Detection
          [[ "$LOWERSTRINGS" =~ ro\.oplus\.region=global ]] && ((OXYGENSCORE+=20))
          [[ "$LOWERSTRINGS" =~ ro\.oplus\.region=eu ]] && ((OXYGENSCORE+=20))
          [[ "$LOWERSTRINGS" =~ ro\.oplus\.region=india ]] && ((OXYGENSCORE+=20))        
          # Strong Cmdline Signals (DTBO / Bootloader)
          [[ "$LOWERSTRINGS" =~ androidboot\.hwc=cn ]] && ((COLORSCORE+=15))
          [[ "$LOWERSTRINGS" =~ androidboot\.hwc=global ]] && ((OXYGENSCORE+=15))
          [[ "$LOWERSTRINGS" =~ androidboot\.hwc=eu ]] && ((OXYGENSCORE+=15))
          [[ "$LOWERSTRINGS" =~ androidboot\.hwc=india ]] && ((OXYGENSCORE+=15))
          # Medium Signals
          [[ "$LOWERSTRINGS" =~ coloros ]] && ((COLORSCORE+=4))
          [[ "$LOWERSTRINGS" =~ oxygenos ]] && ((OXYGENSCORE+=4))
          # OSSI Detection (OPlus Unified Base)
          if [[ "$LOWERSTRINGS" =~ oplus/ossi ]]; then
            ((COLORSCORE+=5))
            ((OXYGENSCORE+=5))
          fi
          
          # Weak Vendor Presence (Neutral)
          if [[ "$LOWERSTRINGS" =~ oplus ]]; then
            ((COLORSCORE+=1))
            ((OXYGENSCORE+=1))
          fi
         
          # Fingerprint Hints
          if echo "$LOWERSTRINGS" | grep -q "fingerprint"; then
            echo "🔍 Found Build Fingerprint Hints..."
            [[ "$LOWERSTRINGS" =~ user/release-keys ]] && ((OXYGENSCORE+=1))
            [[ "$LOWERSTRINGS" =~ oppo || "$LOWERSTRINGS" =~ oplus ]] && ((COLORSCORE+=1))
          fi

          # Region Override (Highest Authority)
          if [[ "$REGION" == *"China"* ]]; then
            ROMBASE="🇨🇳 ColorOS"
            MAXSCORES=999
          elif [[ "$REGION" == *"Global"* || "$REGION" == *"Europe"* || "$REGION" == *"India"* ]]; then
            ROMBASE="🇺🇸 OxygenOS"
            MAXSCORES=999
          elif [[ "$REGION" == *"OSSI"* ]]; then
            ROMBASE="🌐 AOSP-Based Vendor (OPlus OSSI)"
            MAXSCORES=999
          else
            # Fallback Decision Logic
            if (( COLORSCORE > OXYGENSCORE )); then
              ROMBASE="🇨🇳 ColorOS"
              MAXSCORES=$COLORSCORE
            elif (( OXYGENSCORE > COLORSCORE )); then
              ROMBASE="🇺🇸 OxygenOS"
              MAXSCORES=$OXYGENSCORE
            elif (( COLORSCORE == 0 && OXYGENSCORE == 0 )); then
              ROMBASE="🌐 AOSP / ❓ Unknown"
              MAXSCORES=0
            elif (( COLORSCORE <= 3 && OXYGENSCORE <= 3 )); then
              ROMBASE="🌐 AOSP / 🏳️ OEM Neutral"
              MAXSCORES=$COLORSCORE
            else
              ROMBASE="🌏 Hybrid"
              MAXSCORES=$COLORSCORE
            fi
          fi

          # Confidence Calculation
          if (( MAXSCORES == 999 )); then
            CONFIDENCE="Very High (Region Override)"
          elif (( MAXSCORES >= 5 )); then
            CONFIDENCE="High"
          elif (( MAXSCORES >= 3 )); then
            CONFIDENCE="Medium"
          else
            CONFIDENCE="Low"
          fi

          echo "📊 Score Breakdown:"
          echo "🇨🇳 ColorOS : $COLORSCORE"
          echo "🇺🇸 OxygenOS: $OXYGENSCORE"
          echo "📌 Final ROM Base: $ROMBASE"
          echo "🎯 Confidence Level: $CONFIDENCE"
          echo "variant=$ROMBASE" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "romtype=$ROMBASE" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          # Cleanup
          mountpoint -q vendormount && sudo umount vendormount || true
          rm -rf vendormount vendor_raw.img 2>/dev/null || true
          # Remove Large Vendor Image After Analysis
          rm -f output/vendor.img 2>/dev/null || true

      - name: 📊 Build Summary
        run: |
          KV="${{ steps.kernel-info.outputs.kernel_version }}"
          KT="${{ steps.kernel-info.outputs.kernel_time }}"      
          KV=${KV:-Unknown}
          KT=${KT:-Unknown}      
          echo "### 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 ROM Type | \`${{ steps.detect-region.outputs.romtype }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌏 Variant | \`${{ steps.detect-region.outputs.variant }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Confidence Level | \`${{ steps.detect-region.outputs.confidence }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Kernel Version | \`$KV\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕒 Build Time | \`$KT\` |" >> $GITHUB_STEP_SUMMARY
          
      - name: 📤 Upload Extracted Partitions as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extracted-Partitions
          path: |
            ./output/*.img
            !./output/vendor.img
          retention-days: 30
