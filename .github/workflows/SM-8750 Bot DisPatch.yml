name: SM-8750 Bot DisPatch

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Select Workflow to Trigger"
        required: true
        default: Stable V8.yml
        options:
          - Stable V8.yml
          - Test V8.yml

      KPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFS_REPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      GITHUB_REPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
        
      ROOT_ENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: "ReSukiSU"
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Main-Spoofed
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Stable
         - KernelSU-Next-Stable-Spoofed
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFS_VERSION:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/lz4kd/8589934592     # 08Gi    

      ZRAM_CUSTOM:
        type: boolean
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off (Applicable for Dynamic Owner Custom Manifest)"
        required: false
        default: false
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection (Linux Security Module)?"
        required: true
        default: true

      LXCDOCKER:
        type: boolean
        description: "Enable Linux Container / Docker? (Consider Disabling BBG Linux Security Module if Using or Enabling Linux Containers / Docker)"
        required: true
        default: false
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
        
      BBR:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: "True"
        options:
          - "True"     # Base BBR + ECN Settings, Safe Default
          - "False"    # Skip BBR + ECN Configuration
          - "Brutal"   # Apply Brutal as Default + Cubic Fallback
        
      UNICODE:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
        
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi (Oryon Platform SM-8750)?"
        required: true
        default: true

      ADIOS:
        type: boolean
        description: "Apply ADIOS I/O Scheduler (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: false
        
      XUS:
        type: boolean
        description: "Prevent the Generation of XUS Error Files?"
        required: true
        default: true
        
      SUSFS_DEV:
        type: boolean
        description: "Extract and Apply SUSFS Meta Development Branch?"
        required: true
        default: false

      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: false
        
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning?"
        required: true
        default: false
        
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update?"
        required: true
        default: false

permissions:
  actions: write
  contents: read

# =========================
# DEVICE MATRIX
# =========================
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          DEVICES="oneplus_13_b oneplus_13s_b oneplus_13t_b oneplus_ace5_pro_b oneplus_ace_6 oneplus_pad_2_pro_b oneplus_pad_3_b"

          MATRIX=$(printf '%s\n' $DEVICES | jq -R -s -c '
            split("\n")[:-1] |
            map({ file: ., short: (sub("_[a-z]$"; "")) })
          ')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

# =========================
# DISPATCH BUILDS
# =========================
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Trigger workflow
        id: trigger
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: refs/heads/LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.file }}",
              "KPATCH": "${{ github.event.inputs.KPATCH }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_REPOSITORY": "${{ github.event.inputs.SUSFS_REPOSITORY }}",
              "GITHUB_REPOSITORY": "${{ github.event.inputs.GITHUB_REPOSITORY }}",
              "ROOT_ENGINE": "${{ github.event.inputs.ROOT_ENGINE }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM_CUSTOM": "${{ github.event.inputs.ZRAM_CUSTOM }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR": "${{ github.event.inputs.BBR }}",
              "LXCDOCKER": "${{ github.event.inputs.LXCDOCKER }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "WINDSPEED": "${{ github.event.inputs.WINDSPEED }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS": "${{ github.event.inputs.XUS }}"
            }
      - name: Save Run Meta-Data
        run: |
          mkdir meta
          echo "${{ matrix.file }}" > meta/device.txt
          echo "${{ steps.trigger.outputs.run_id }}" > meta/run_id.txt

      - name: Upload Meta-Data
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.file }}
          path: meta/

# =========================
# MERGE RUN IDS
# =========================
  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      run_ids: ${{ steps.merge.outputs.run_ids }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: merge
        run: |
          JSON="{}"
          
          for d in meta/meta-*; do
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")
          
            # Skip Empty Run ID (Important)
            if [[ -z "$ID" ]]; then
              echo "⚠️ Skipping $DEV (empty run_id)"
              continue
            fi
          
            JSON=$(echo "$JSON" | jq --arg dev "$DEV" --arg id "$ID" '. + {($dev): $id}')
          done
          
          # Compact JSON (Single Line = Safer)
          JSON=$(echo "$JSON" | jq -c .)
          
          # Proper Multi-Line-Safe Output
          echo "run_ids<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

# =========================
# FETCH ARTIFACTS (SMART)
# =========================
  fetch:
    needs: merge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [oneplus_13_b, oneplus_13s_b, oneplus_13t_b, oneplus_ace5_pro_b, oneplus_ace_6, oneplus_pad_2_pro_b, oneplus_pad_3_b]

    steps:
      - uses: actions/checkout@v5

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Resolve Run ID
        id: resolve
        run: |
          RUN_ID=$(echo '${{ needs.merge.outputs.run_ids }}' | jq -r '."${{ matrix.device }}"')
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for Completion
        run: |
          for i in {1..40}; do
            STATUS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID --jq .status)
            CONCLUSION=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID --jq .conclusion)

            echo "Attempt $i → $STATUS / $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              break
            fi

            sleep 20
          done

      - name: Download Artifacts
        run: |
          mkdir -p artifacts/${{ matrix.device }}

          gh run download $RUN_ID \
            --dir artifacts/${{ matrix.device }} \
            --repo ${{ github.repository }}

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.device }}
          path: artifacts/${{ matrix.device }}
