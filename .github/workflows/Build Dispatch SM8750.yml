          fi

          # 5. Idempotent Check
          set +e
          gh release view "$TAG" >/dev/null 2>&1
          EXISTS=$?
          set -e

          if [[ "$EXISTS" -eq 0 ]]; then
            echo "♻️ Release Already Exists → Skipping"
            exit 0
          fi

          # 6. Create Release
          echo "🚀 Creating Release: $TAG"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file Release.txt \
            --prerelease=$PRERELEASE \
            --latest=$LATEST \
            "${ASSETS[@]}"
