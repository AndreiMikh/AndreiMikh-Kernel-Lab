name: Dispatch & Fetch Artifacts SM8750

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Main V9.2.yml
        options:
          - Stable V9.1.yml
          - Main V9.2.yml

      RELEASECHANNEL:
        type: choice
        description: "Release Channel (Stable / Beta / Nightly)"
        required: true
        default: nightly
        options:
          - Stable
          - Beta
          - Nightly

      KERNELPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      GITHUBREPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
        
      ROOTENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      ROOTBRANCHSOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAMALGORITHM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/LZ4KD/8589934592     # 08Gib   

      ZRAMCUSTOMPATCH:
        type: choice
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off"
        required: false
        default: None
        options:
          - None
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0+LZ4KD  
          - LZ4-1.10.0-Patch
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FASTBUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSMBBG:
        type: boolean
        description: "Enable Critical Partition Write Protection (Linux Security Module)?"
        required: true
        default: true

      LXCDOCKERSUPPORT:
        type: choice
        description: "Enable Linux Container? *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Using or Enabling Linux Containers / Docker)"
        required: true
        default: None
        options:
          - DroidSpacesLXC
          - TermuxLXC
          - None
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBR+ECN
        options:
          - BBR+ECN            # Base BBR + ECN Settings, Safe Default
          - BBR+ECN+Brutal     # Apply Brutal as Default + Cubic Fallback
          - None               # Skip BBR + ECN Configuration

        
      UNICODE:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
        
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi (Oryon Platform SM-8750)?"
        required: true
        default: false

      SCHEDULERS:
        type: choice
        description: "Apply CPU or I/O Scheduler? ADIOS = SM-8750* ; SSG = SM-8650* ; BORE = for Testing (Unstable)*"
        required: true
        default: None
        options:
          - ADIOS
          - BORE
          - SSG
          - None
        
      XUS:
        type: boolean
        description: "Prevent the Generation of XUS Error Files?"
        required: true
        default: true
        
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Meta Development Branch?"
        required: true
        default: false

      REKERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: true
        
      BUILDPROFILE:
        type: choice
        description: "Pre-Defined Build Preset"
        required: true
        default: Performance
        options:
          - Performance
          - Experimental

permissions:
  actions: write
  contents: write
  id-token: write

# --------------------------
# Device Matrix
# --------------------------
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )

          printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]' > devices.json
          echo "devices=$(cat devices.json)" >> $GITHUB_OUTPUT

# --------------------------
# Dispatch Builds
# --------------------------
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v4
        
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          
      - name: ⚙️ Set Build Profile Flags
        run: |
          PROFILE="${{ github.event.inputs.BUILDPROFILE }}"
      
          case "$PROFILE" in
            Performance)
              CLEANSPACE=false
              BUILDCCACHE=false
              ;;
            Experimental)
              CLEANSPACE=true
              BUILDCCACHE=true
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=false
              ;;
          esac
      
          echo "PROFILE=$PROFILE"
          echo "CLEANSPACE=$CLEANSPACE"
          echo "BUILDCCACHE=$BUILDCCACHE"
      
          echo "CLEANSPACE=$CLEANSPACE" >> $GITHUB_ENV
          echo "BUILDCCACHE=$BUILDCCACHE" >> $GITHUB_ENV

      - name: 🚀 Trigger Build (CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW="${{ github.event.inputs.TARGET_WORKFLOW }}"

          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"

          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f ZRAMALGORITHM="${{ github.event.inputs.ZRAMALGORITHM }}" \
            -f ZRAMCUSTOMPATCH="${{ github.event.inputs.ZRAMCUSTOMPATCH }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f FASTBUILD="${{ github.event.inputs.FASTBUILD }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LXCDOCKERSUPPORT="${{ github.event.inputs.LXCDOCKERSUPPORT }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f UNICODE="${{ github.event.inputs.UNICODE }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SCHEDULERS="${{ github.event.inputs.SCHEDULERS }}" \
            -f XUS="${{ github.event.inputs.XUS }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f CLEANSPACE="${{ env.CLEANSPACE }}" \
            -f BUILDCCACHE="${{ env.BUILDCCACHE }}"
        
          sleep 8

          RUN_ID=$(gh run list \
            --workflow "$WORKFLOW" \
            --branch LiquidAndrei \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,createdAt,headBranch \
            | jq -r '
                map(select(.headBranch == "LiquidAndrei"))
                | sort_by(.createdAt)
                | reverse
                | .[0].databaseId
              ')

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ RUN_ID=$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
      - name: 🔍 Debug Run ID
        run: |
          echo "RUN_ID=${{ env.RUN_ID }}"
    
      - name: 💾 Save Run ID
        run: |
          mkdir -p meta
          echo "${{ matrix.device }}" > meta/device.txt

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "⚠️ Failed to get Run ID"
            exit 1
          fi

          echo "$RUN_ID" > meta/run_id.txt

      - name: 🏗️ Solve Device Name (Meta)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ env.DEVICE_NAME }}
          path: meta/

# --------------------------
# Merge Run IDs
# --------------------------
  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: map
        run: |
          JSON="{}"

          for d in meta/meta-*; do
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")

            [[ -z "$ID" || "$ID" == "null" ]] && continue

            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

# --------------------------
# Fetch Artifacts (30 Min Robust)
# --------------------------
  fetch:
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}
        
    steps:
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🔍 Resolve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'

          RUN_ID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')

          [[ -z "$RUN_ID" ]] && exit 1

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: ⏳ Wait for Completion (30 Mins Max)
        run: |
          MAX=90
          SLEEP=20

          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)

            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)

            echo "$i/$MAX → $STATUS | $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep $SLEEP
          done

          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          mkdir -p artifacts/${{ matrix.device }}

          gh run download $RUN_ID \
            --dir artifacts/${{ matrix.device }} \
            --repo ${{ github.repository }}

      - name: 📊 Device Build Summary
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")

          if [[ -d "artifacts/${{ matrix.device }}" ]] && [[ $(ls -A artifacts/${{ matrix.device }}) ]]; then
            STATUS="✔️ Success"
            COUNT=$(ls -1 artifacts/${{ matrix.device }} | wc -l)
          else
            STATUS="❌ Failed"
            COUNT=0
          fi

          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Status | Run ID | Artifacts |"
            echo "|--------|--------|--------|-----------|"
            echo "| $DEVICE_NAME | $STATUS | $GITHUB_RUN_NUMBER | $COUNT File(s) |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 🏗️ Re-Solve Device Name (Final)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ env.DEVICE_NAME }}
          path: artifacts/${{ matrix.device }}

# --------------------------
# Final Bundle
# --------------------------
  bundle:
    needs: fetch
    runs-on: ubuntu-latest

    steps:
      - name: 📩 Checkout Repository
        uses: actions/checkout@v4
   
      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize
        run: |
          mkdir -p final_bundle

          for dir in bundle/final-*; do
            dev=$(basename "$dir" | sed 's/final-//')
            mkdir -p final_bundle/$dev
            cp -r "$dir"/. final_bundle/$dev/ || true
          done

      - name: 🗜️ Create Zip
        run: |
          ZIP="SM8750-Kernel-Bundle-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$ZIP" final_bundle
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SM8750-Kernel-Bundle
          path: ${{ env.ZIP }}

      - name: 🏷️ Generate Release Tag (Channel Aware)
        run: |
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"

          case "$CHANNEL" in
            stable)
              TAG="SM8750-Stable-${RUN}"
              ;;
            beta)
              TAG="SM8750-Beta-${RUN}"
              ;;
            nightly|*)
              TAG="SM8750-Nightly-${RUN}"
              ;;
          esac

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

      - name: 🚀 Publish Channel-Based Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
      
          cd "$GITHUB_WORKSPACE"
      
          echo "Repo (env): $GITHUB_REPOSITORY"
      
          # 🔍 Debug (Safe, Non-Fatal)
          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" || true
      
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
      
          CHANNEL_LOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
      
          case "$CHANNEL_LOWER" in
            stable)
              TAG="SM8750-Stable-${RUN}"
              PRERELEASE="false"
              LATEST="true"
              ;;
            beta)
              TAG="SM8750-Beta-${RUN}"
              PRERELEASE="true"
              LATEST="false"
              ;;
            nightly|*)
              TAG="SM8750-Nightly-${RUN}"
              PRERELEASE="true"
              LATEST="false"
              ;;
          esac
      
          echo "TAG=$TAG"
          TITLE="🚀 SM8750 ${CHANNEL} Build No.:${RUN}"
      
          # Debug
          echo "Checking Release Inputs..."
          ls -lah
          
          # Detect Zip Safely
          ZIP_FILE=$(find . -type f -name "*.zip" | sort | head -n 1)
          
          if [[ -z "$ZIP_FILE" ]]; then
            echo "❌ No Zip Found"
            exit 1
          fi
          
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "❌ Zip Exists but is Empty"
            exit 1
          fi
          
          echo "📦 Selected Zip: $ZIP_FILE"
          
          # Release Notes Safely
          if [[ ! -s release_notes.txt ]]; then
            echo "⚠️ Missing Release Notes → Generating Fallback"
          
            cat > release_notes.txt <<EOF
          SM8750 Kernel Release
          
          Build: ${RUN}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          
          Auto-Generated Notes (Idempotent Mode)
          EOF
          fi
          
          echo "📄 Release Notes OK"
          
          # Idempotent Release Logic
          set +e
          gh release view "$TAG" >/dev/null 2>&1
          RELEASE_EXISTS=$?
          set -e
          
          if [[ "$RELEASE_EXISTS" -eq 0 ]]; then
            echo "♻️ Release Already Exists → Skipping Creation"
            exit 0
          fi
          
          # Create Release
          echo "🚀 Creating Release: $TAG"
          
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file release_notes.txt \
            --prerelease=$PRERELEASE \
            --latest=$LATEST \
            "$ZIP_FILE"
