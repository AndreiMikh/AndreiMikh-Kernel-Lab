name: Dispatch & Fetch Artifacts SM8750

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Stable V9.1.yml
        options:
          - Stable V9.1.yml
          - Main V9.1.yml

      KPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFS_REPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      GITHUB_REPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
        
      ROOT_ENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: "ReSukiSU"
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFS_VERSION:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/lz4kd/8589934592     # 08Gib   

      ZRAM_CUSTOM:
        type: choice
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off"
        required: false
        default: "None"
        options:
          - None
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0+LZ4KD  
          - LZ4-1.10.0-Patch
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection (Linux Security Module)?"
        required: true
        default: true

      LXCDOCKER:
        type: choice
        description: "Enable Linux Container? *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Using or Enabling Linux Containers / Docker)"
        required: true
        default: "None"
        options:
          - DroidspaceLXC
          - TermuxLXC
          - None
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
        
      BBR:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: "True"
        options:
          - True     # Base BBR + ECN Settings, Safe Default
          - False    # Skip BBR + ECN Configuration
          - Brutal   # Apply Brutal as Default + Cubic Fallback
        
      UNICODE:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
        
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi (Oryon Platform SM-8750)?"
        required: true
        default: false

      SCHEDULERS:
        type: choice
        description: "Apply CPU or I/O Scheduler? ADIOS = SM-8750* ; SSG = SM-8650* ; BORE = for Testing (Unstable)*"
        required: true
        default: "None"
        options:
          - ADIOS
          - BORE
          - SSG
          - None
        
      XUS:
        type: boolean
        description: "Prevent the Generation of XUS Error Files?"
        required: true
        default: true
        
      SUSFS_DEV:
        type: boolean
        description: "Extract and Apply SUSFS Meta Development Branch?"
        required: true
        default: false

      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: true
        
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning?"
        required: true
        default: false
        
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update?"
        required: true
        default: false


permissions:
  actions: write
  contents: read

# =========================
# DEVICE MATRIX
# =========================
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )

          printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]' > devices.json
          echo "devices=$(cat devices.json)" >> $GITHUB_OUTPUT

# =========================
# DISPATCH BUILDS
# =========================
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v4
        
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🚀 Trigger Build (CLI)
        run: |
          WORKFLOW="${{ github.event.inputs.TARGET_WORKFLOW }}"

          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"

          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f KPATCH="${{ github.event.inputs.KPATCH }}" \
            -f MANAGER_SOURCE="${{ github.event.inputs.MANAGER_SOURCE }}" \
            -f SUSFS_REPOSITORY="${{ github.event.inputs.SUSFS_REPOSITORY }}" \
            -f GITHUB_REPOSITORY="${{ github.event.inputs.GITHUB_REPOSITORY }}" \
            -f ROOT_ENGINE="${{ github.event.inputs.ROOT_ENGINE }}" \
            -f ZRAM="${{ github.event.inputs.ZRAM }}" \
            -f ZRAM_CUSTOM="${{ github.event.inputs.ZRAM_CUSTOM }}" \
            -f BUILD_TIME="${{ github.event.inputs.BUILD_TIME }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUSFS_VERSION="${{ github.event.inputs.SUSFS_VERSION }}" \
            -f LSM="${{ github.event.inputs.LSM }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f BBR="${{ github.event.inputs.BBR }}" \
            -f LXCDOCKER="${{ github.event.inputs.LXCDOCKER }}" \
            -f SCHEDULERS="${{ github.event.inputs.SCHEDULERS }}" \
            -f SUSFS_DEV="${{ github.event.inputs.SUSFS_DEV }}" \
            -f RE_KERNEL="${{ github.event.inputs.RE_KERNEL }}" \
            -f FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SPACE_NOCLEAN="${{ github.event.inputs.SPACE_NOCLEAN }}" \
            -f BUILD_NOCCACHE="${{ github.event.inputs.BUILD_NOCCACHE }}" \
            -f XUS="${{ github.event.inputs.XUS }}"

          sleep 8

          RUN_ID=$(gh run list \
            --workflow "$WORKFLOW" \
            --branch LiquidAndrei \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,createdAt,headBranch \
            | jq -r '
                map(select(.headBranch == "LiquidAndrei"))
                | sort_by(.createdAt)
                | reverse
                | .[0].databaseId
              ')

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ RUN_ID=$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
      - name: 🔍 Debug Run ID
        run: |
          echo "RUN_ID=${{ env.RUN_ID }}"
    
      - name: 💾 Save Run ID
        run: |
          mkdir -p meta
          echo "${{ matrix.device }}" > meta/device.txt

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "⚠️ Failed to get Run ID"
            exit 1
          fi

          echo "$RUN_ID" > meta/run_id.txt

      - name: 🏗️ Solve Device Name (Meta)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Meta-${{ env.DEVICE_NAME }}
          path: meta/

# =========================
# MERGE RUN IDS
# =========================
  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: map
        run: |
          JSON="{}"

          for d in meta/Meta-*; do
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")

            [[ -z "$ID" || "$ID" == "null" ]] && continue

            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

# =========================
# FETCH ARTIFACTS (30 MIN ROBUST)
# =========================
  fetch:
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}
        
    steps:
      - name: ⚙️ Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🔍 Resolve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'

          RUN_ID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')

          [[ -z "$RUN_ID" ]] && exit 1

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: ⏳ Wait for Completion (30 Mins Max)
        run: |
          MAX=90
          SLEEP=20

          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)

            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)

            echo "$i/$MAX → $STATUS | $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep $SLEEP
          done

          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          mkdir -p artifacts/${{ matrix.device }}

          gh run download $RUN_ID \
            --dir artifacts/${{ matrix.device }} \
            --repo ${{ github.repository }}

      - name: 📊 Device Build Summary
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"

          if [[ -d "artifacts/${{ matrix.device }}" ]] && [[ $(ls -A artifacts/${{ matrix.device }}) ]]; then
            STATUS="✔️ Success"
            COUNT=$(ls -1 artifacts/${{ matrix.device }} | wc -l)
          else
            STATUS="❌ Failed"
            COUNT=0
          fi

          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Status | Run | Artifacts |"
            echo "|--------|--------|-----|-----------|"
            echo "| $DEVICE_NAME | $STATUS | [$RUN_ID]($RUN_URL) | $COUNT Files |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 🏗️ Re-Solve Device Name (Final)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Final-${{ env.DEVICE_NAME }}
          path: artifacts/${{ matrix.device }}

# =========================
# FINAL BUNDLE
# =========================
  bundle:
    needs: fetch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize
        run: |
          mkdir -p final_bundle

          for dir in bundle/Final-*; do
            [ -d "$dir" ] || continue
            dev=$(basename "$dir" | sed 's/Final-//')
            mkdir -p final_bundle/$dev
            cp -r "$dir"/. final_bundle/$dev/ || true
          done

      - name: 🗜️ Create ZIP
        run: |
          ZIP="SM8750-Kernel-Bundle-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$ZIP" final_bundle
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SM8750-Kernel-Bundle
          path: ${{ env.ZIP }}
