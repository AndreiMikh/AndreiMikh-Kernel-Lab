name: ☘️ Dispatch & Fetch Artifacts SM8750

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Main.yml
        options:
          - Main.yml        

      UNIQUE:
        description: "Unique Identifier for Dispatch Run"
        required: false

      RELEASECHANNEL:
        type: choice
        description: "Release Channel (Stable / Beta / Nightly)"
        required: true
        default: Nightly
        options:
          - Stable
          - Beta
          - Nightly

      KERNELPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      GITHUBREPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
        
      ROOTENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Dev-SUSFS
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAMALGORITHM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/LZ4KD/8589934592     # 08Gib   

      ZRAMCUSTOMPATCH:
        type: choice
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off"
        required: false
        default: None
        options:
          - None
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0+LZ4KD  
          - LZ4-1.10.0-Patch
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FASTBUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSMBBG:
        type: boolean
        description: "Enable Critical Partition Write Protection (Linux Security Module)?"
        required: true
        default: true

      LXCDOCKERSUPPORT:
        type: choice
        description: "Enable Linux Container? *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Using or Enabling Linux Containers / Docker)"
        required: true
        default: None
        options:
          - DroidSpacesLXC
          - DroidSpacesLXC-Inject
          - TermuxLXC
          - None
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBR+ECN
        options:
          - BBR+ECN            # Base BBR + ECN Settings, Safe Default
          - BBR+ECN+Brutal     # Apply Brutal as Default + Cubic Fallback
          - None               # Skip BBR + ECN Configuration
        
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi (Oryon Platform SM-8750)?"
        required: true
        default: false

      SCHEDULERS:
        type: choice
        description: "Apply CPU or I/O Scheduler? ADIOS = SM-8750* ; SSG = SM-8650* ; BORE = for Testing (Unstable)*"
        required: true
        default: None
        options:
          - ADIOS
          - BORE
          - SSG
          - None
        
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Meta Development Branch?"
        required: true
        default: false

      REKERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: true
        
      PROFILE:
        type: choice
        description: "Pre-Defined Build Preset"
        required: true
        default: Balance
        options:
          - Experimental
          - Balance
          - Disable

permissions:
  actions: write
  contents: write
  id-token: write

# --------------------------
# Device Matrix
# --------------------------
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )

          echo "devices=$(printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

# --------------------------
# Dispatch Builds
# --------------------------
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v4
        
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          
      - name: ⚙️ Set Build Profile Flags
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"
      
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              UNICODE=true
              NTSYNC=false
              ;;
            Experimental)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              UNICODE=false
              NTSYNC=true
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              UNICODE=false
              NTSYNC=false
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              XUS=false
              UNICODE=true
              NTSYNC=false
              ;;
          esac
      
          echo "PROFILE=$PROFILE"
          echo "CLEANSPACE=$CLEANSPACE"
          echo "BUILDCCACHE=$BUILDCCACHE"
          echo "XUS=$XUS"
          echo "UNICODE=$UNICODE"
          echo "NTSYNC=$NTSYNC"
          
          echo "CLEANSPACE=$CLEANSPACE" >> $GITHUB_ENV
          echo "BUILDCCACHE=$BUILDCCACHE" >> $GITHUB_ENV
          echo "XUS=$XUS" >> $GITHUB_ENV
          echo "UNICODE=$UNICODE" >> $GITHUB_ENV
          echo "NTSYNC=$NTSYNC" >> $GITHUB_ENV

      # --------------------------
      # 🚀 Trigger Build CLI
      # --------------------------
      - name: 🚀 Trigger Build CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW="${{ github.event.inputs.TARGET_WORKFLOW }}"

          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"

          # Capture Timestamp Before Dispatch
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Unique Tag
          INPUTUNIQUE="${{ github.event.inputs.UNIQUE }}"
          
          if [[ -n "$INPUTUNIQUE" ]]; then
            UNIQUE="$INPUTUNIQUE"
          else
            UNIQUE="${{ matrix.device }}-${GITHUB_RUN_ID}"
          fi
          
          echo "UNIQUE=$UNIQUE"
          echo "UNIQUE=$UNIQUE" >> $GITHUB_ENV

          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f ZRAMALGORITHM="${{ github.event.inputs.ZRAMALGORITHM }}" \
            -f ZRAMCUSTOMPATCH="${{ github.event.inputs.ZRAMCUSTOMPATCH }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f FASTBUILD="${{ github.event.inputs.FASTBUILD }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LXCDOCKERSUPPORT="${{ github.event.inputs.LXCDOCKERSUPPORT }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SCHEDULERS="${{ github.event.inputs.SCHEDULERS }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f PROFILE="${{ github.event.inputs.PROFILE }}" \
            -f UNIQUE="$UNIQUE"

          echo "⏳ Waiting for Run to Register..."

          sleep 3

          # Fetch Latest Matching Run After Timestamp
          echo "⏳ Resolving Run ID via API..."

          RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            | jq -r --arg time "$START_TIME" '
                .workflow_runs
                | map(select(.created_at > $time))
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ')

          # Validate
          if [[ -z "$RUN_ID" ]]; then
            echo "❌ Failed to Re-Solve Run ID"
            exit 1
          fi

          echo "✔️ Run ID=$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # --------------------------
      # 🔍 Debug Run ID
      # --------------------------
      - name: 🔍 Debug Run ID
        run: |
          set -euo pipefail

          RUN_ID="${{ env.RUN_ID }}"

          echo "Run ID (Environment Context): $RUN_ID"
  
      # --------------------------
      # 💾 Save Run ID
      # --------------------------    
      - name: 💾 Save Run ID
        run: |
          set -euo pipefail

          mkdir -p meta
          echo "${{ matrix.device }}" > meta/device.txt

          # Read from GitHub Environment Properly
          RUN_ID="${{ env.RUN_ID }}"

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "❌ Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ Saving Run ID: $RUN_ID"
          echo "$RUN_ID" > meta/run_id.txt
 
      # --------------------------
      # 🏗️ Solve Device Name (Meta)
      # --------------------------    
      - name: 🏗️ Solve Device Name (Meta)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ env.DEVICE_NAME }}
          path: meta/

# --------------------------
# Merge Run IDs
# --------------------------
  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: map
        run: |
          JSON="{}"

          for d in meta/meta-*; do
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")

            [[ -z "$ID" || "$ID" == "null" ]] && continue

            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

# --------------------------
# Fetch Artifacts (30 Min Robust)
# --------------------------
  fetch:
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}
        
    steps:
    
      # --------------------------
      # ⚙️ Setup GH CLI
      # --------------------------
      - name: ⚙️ Setup GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt update -y
          sudo apt install -y gh jq
     
      # --------------------------
      # 🔍 Resolve Run ID
      # --------------------------
      - name: 🔍 Resolve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'

          RUN_ID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')

          [[ -z "$RUN_ID" ]] && exit 1

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # --------------------------
      # ⏳ Wait for Completion (40 Mins Max)
      # --------------------------
      - name: ⏳ Wait for Completion (40 Mins Max)
        run: |
          MAX=120
          SLEEP=20

          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)

            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)

            echo "$i/$MAX → $STATUS | $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep $SLEEP
          done

          echo "⚠️ Timeout"
          exit 1

      # --------------------------
      # 📦 Download Artifacts
      # --------------------------
      - name: 📦 Download Artifacts
        run: |
          set -euo pipefail

          # Use Existing Run ID from Environment
          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "❌ Run ID is Missing"
            exit 1
          fi

          echo "📥 Downloading Artifacts for Run ID=$RUN_ID"

          mkdir -p artifacts/${{ matrix.device }}

          gh run download "$RUN_ID" \
            --dir "artifacts/${{ matrix.device }}" \
            --repo "$GITHUB_REPOSITORY"
   
      # --------------------------
      # 📊 Device Build Summary
      # --------------------------
      - name: 📊 Device Build Summary
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")

          if [[ -d "artifacts/${{ matrix.device }}" ]] && [[ $(ls -A artifacts/${{ matrix.device }}) ]]; then
            STATUS="✔️ Success"
            COUNT=$(ls -1 artifacts/${{ matrix.device }} | wc -l)
          else
            STATUS="❌ Failed"
            COUNT=0
          fi

          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Status | Run | Artifacts |"
            echo "|--------|--------|-----|-----------|"
            echo "| $DEVICE_NAME | $STATUS | [View](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) | $COUNT File(s) |"
          } >> $GITHUB_STEP_SUMMARY
  
      # --------------------------
      # 🏗️ Re-Solve Device Name (Final)
      # --------------------------
      - name: 🏗️ Re-Solve Device Name (Final)
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ env.DEVICE_NAME }}
          path: artifacts/${{ matrix.device }}

# --------------------------
# Final Bundle
# --------------------------
  bundle:
    needs: fetch
    runs-on: ubuntu-latest

    steps:

      # --------------------------
      # 📩 Checkout Repository
      # --------------------------
      - name: 📩 Checkout Repository
        uses: actions/checkout@v4
   
      - uses: actions/download-artifact@v4
        with:
          path: bundle
     
      # --------------------------
      # 📂 Organize
      # --------------------------
      - name: 📂 Organize
        run: |
          mkdir -p final_bundle

          for dir in bundle/final-*; do
            dev=$(basename "$dir" | sed 's/final-//')
            mkdir -p final_bundle/$dev
            cp -r "$dir"/. final_bundle/$dev/ || true
          done
    
      # --------------------------
      # 🗜️ Create Zip
      # --------------------------
      - name: 🗜️ Create Zip
        run: |
          ZIP="SM8750-Kernel-Bundle-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$ZIP" final_bundle
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SM8750-Kernel-Bundle
          path: ${{ env.ZIP }}

      # --------------------------
      # 🏷️ Generate Release Tag (Channel Aware)
      # --------------------------
      - name: 🏷️ Generate Release Tag (Channel Aware)
        run: |
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"

          # Normalize Channel to Lowercase
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable-BuildNumber-${RUN}"
              ;;
            beta)
              TAG="SM8750-Beta-BuildNumber-${RUN}"
              ;;
            nightly|*)
              TAG="SM8750-Nightly-BuildNumber-${RUN}"
              ;;
          esac

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

      # --------------------------
      # 🚀 Publish Channel-Based Release
      # --------------------------
      - name: 🚀 Publish Channel-Based Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "Repo: $GITHUB_REPOSITORY"

          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" || true

          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"

          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')

          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable-BuildNumber-${RUN}"
              PRERELEASE="false"
              LATEST="true"
              ;;
            beta)
              TAG="SM8750-Beta-BuildNumber-${RUN}"
              PRERELEASE="true"
              LATEST="false"
              ;;
            nightly|*)
              TAG="SM8750-Nightly-BuildNumber-${RUN}"
              PRERELEASE="true"
              LATEST="false"
              ;;
          esac

          echo "TAG=$TAG"
          TITLE="🚀 SM8750 ${CHANNEL} | Build Number ${RUN}"

          echo "🔍 Scanning Release Assets..."

          ASSETS=()

          # 1. Add Bundle Zip
          BUNDLE_ZIP=$(find . -type f -name "SM8750-Kernel-Bundle-*.zip" | head -n 1)

          if [[ -z "$BUNDLE_ZIP" || ! -s "$BUNDLE_ZIP" ]]; then
            echo "❌ Missing Bundle Zip"
            exit 1
          fi

          ASSETS+=("$BUNDLE_ZIP")
          echo "📦 Bundle: $BUNDLE_ZIP"

          # 2. Add All Final Device Zips
          echo "📦 Collecting Final Device Zips..."

          while IFS= read -r zip; do
            ASSETS+=("$zip")
          done < <(
            find . -type f -name "*.zip" \
              ! -name "SM8750-Kernel-Bundle-*.zip" \
              | sort
          )

          # 3. Safety Check
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "❌ No Release Assets Found"
            exit 1
          fi

          echo "📦 Assets to Upload:"
          printf '%s\n' "${ASSETS[@]}"

          # 4. Release Notes
          if [[ ! -s Release.txt ]]; then
            cat > Release.txt <<EOF
          SM8750 Kernel Release
          ---   
          Build: ${RUN}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}          
          ---   
          📦 Build Configuration
          ---   
          📞 Device                       : ${{ env.DEVICE_NAME }}
          ☘️ KernelPatch                  : ${{ github.event.inputs.KERNELPATCH }}
          🔥 SUSFS                        : ${{ github.event.inputs.SUSFSREPOSITORY }}
          🔥 SUSFS Variant                : ${{ github.event.inputs.SUSFSVARIANT }}
          🔥 SUSFS Dev Branch             : ${{ github.event.inputs.SUSFSBRANCHDEV }}
          💾 Git Repository               : ${{ github.event.inputs.GITHUBREPOSITORY }}
          ---   
          🧰 Root                         : ${{ github.event.inputs.ROOTENGINE }}
          🧰 Manager / Branch Source      : ${{ github.event.inputs.ROOTBRANCHSOURCE }}
          ---   
          🖇️ ZRAM Module / Algorithm      : ${{ github.event.inputs.ZRAMALGORITHM }}
          📎 LZ4 Patch                    : ${{ github.event.inputs.ZRAMCUSTOMPATCH }}
          ---   
          📱 Kernel Suffix                : ${{ github.event.inputs.SUFFIX }}
          📱 Kernel Sub-Level             : ${{ github.event.inputs.SUBLEVEL }}
          📱 Kernel Build Time            : ${{ github.event.inputs.BUILDTIME }}         
          ---   
          🔰 LSM-Baseband Guard           : ${{ github.event.inputs.LSMBBG }}
          📊 Linux Container Support      : ${{ github.event.inputs.LXCDOCKERSUPPORT }}
          ---   
          🔨 Netfilter IP Set / IPv6 NAT  : ${{ github.event.inputs.NETFILTER }}
          🛜 TCP Congestion Control       : ${{ github.event.inputs.TCPALGORITHM }}
          ---   
          🔠 Unicode Bypass               : ${{ github.event.inputs.UNICODE }}
          🚀 Hmbird / Windspeed           : ${{ github.event.inputs.WINDSPEED }}
          🗓️ Schedulers                   : ${{ github.event.inputs.SCHEDULERS }}
          ---   
          ⚙️ XUS Error Fix                : ${{ env.XUS }}
          ⛓️‍💥 Re-Kernel                    : ${{ github.event.inputs.REKERNEL }}
          ---             
          🔧 Clean Build Space            : ${{ env.CLEANSPACE }}
          🔧 Compiler Cache               : ${{ env.BUILDCCACHE }}          
          ---   
          ### 📋 Installation Guide:
          #### **Download the Zip File**:
               - Navigate to the Release Page and Download the Correct Zip File for your Device and Kernel Version
               - Ensure that you Select the File that Matches your Device's Model and the Kernel Version you're Installing
          ---   
          #### **Prepare Your Device**:
               - Make sure your Device has an **Unlocked Bootloader** and a Compatible Custom Recovery (TWRP or OrangeFox)
               - It's Recommended to **Backup your Data** Before Proceeding with the Installation to Avoid any Loss
          ---   
          #### **Install through Recovery Tool**:
               - Reboot your device into **Recovery Mode** (TWRP/OrangeFox/etc.).
               - In the Recovery Menu, Select **Install** and Navigate to the Downloaded Zip File
               - Select the Zip File and Swipe to Confirm Installation
               - After the Installation Completes, Reboot your Device into the System
          ---   
          #### **Installation via KernelFlasher App**:
               - **Download KernelFlasher**: Get the **KernelFlasher** App from [KernelFlasher GitHub](https://github.com/fatalcoder524/KernelFlasher)
