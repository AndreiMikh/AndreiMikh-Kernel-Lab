name: 🔄 Generate BakaSU Sync-Up Integration Patch

on:
  workflow_dispatch:

# Read-Only Access
permissions:
  contents: read

# Prevent Overlapping Runs
concurrency:
  group: bakasu-sync-up-to-main-patch
  cancel-in-progress: true

jobs:
  generate-patch:
    name: 🧬 Compare Main And Sync-Up
    runs-on: ubuntu-latest

    steps:
      # Clone The Actual BakaSU Repository
      - name: 📥 Checkout BakaSU Repository
        uses: actions/checkout@v7
        with:
          repository: Baka-SU/BakaSU
          ref: main
          fetch-depth: 0
          path: BakaSU

      # Fetch And Verify Both Branches
      - name: 🔄 Fetch BakaSU Branches
        shell: bash
        working-directory: BakaSU
        run: |
          set -euo pipefail

          echo "Checking Available Remote Branches..."

          git ls-remote --heads origin

          # Fetch Main And Sync-Up
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/sync-up:refs/remotes/origin/sync-up

          # Verify Both Branches Exist
          git rev-parse --verify origin/main
          git rev-parse --verify origin/sync-up

          echo "Both Branches Fetched Successfully"

      # Generate Complete Integration Patch
      - name: 📝 Generate Sync-Up Integration Patch
        shell: bash
        working-directory: BakaSU
        run: |
          set -euo pipefail

          PATCH="BakaSU-sync-up-to-main.patch"
          SUMMARY="BakaSU-sync-up-to-main-summary.txt"

          # Initialize Included File List
          INCLUDED_PATHS=()

          echo "Scanning Changed Files..."

          # Collect Changed Files And Apply Exclusions
          while IFS= read -r -d '' path; do
            lower_path="${path,,}"

            case "$lower_path" in
              js/readme.md)
                echo "Excluded: $path"
                continue
                ;;

              .github/workflows/*)
                echo "Excluded: $path"
                continue
                ;;

              *.kt|*.json|*.xml|*.ts|*.rs|*.py|*.js)
                echo "Excluded: $path"
                continue
                ;;

              *waitsys*)
                echo "Excluded: $path"
                continue
                ;;
            esac

            # Preserve Exact File Paths
            INCLUDED_PATHS+=(":(literal)$path")

          done < <(
            git diff --name-only -z origin/main origin/sync-up
          )

          echo
          echo "File Exclusion Scan Completed"
          echo "Included Files: ${#INCLUDED_PATHS[@]}"

          # Check For Remaining Differences
          if (( ${#INCLUDED_PATHS[@]} == 0 )); then
            echo "::error::No Differences Found After Exclusions"
            exit 1
          fi

          # Generate Complete Binary-Safe Patch
          git diff \
            --binary \
            --full-index \
            --no-ext-diff \
            origin/main origin/sync-up \
            -- "${INCLUDED_PATHS[@]}" \
            > "$PATCH"

          # Verify Generated Patch
          if [[ ! -s "$PATCH" ]]; then
            echo "::error::Generated Patch Is Empty"
            exit 1
          fi

          # Verify Excluded Files Are Not In Patch
          python3 - "$PATCH" <<'PY'
          import re
          import sys

          patch_file = sys.argv[1]

          excluded_extensions = (
              ".kt",
              ".json",
              ".xml",
              ".ts",
              ".rs",
              ".py",
              ".js",
          )

          excluded_paths = []

          with open(patch_file, "r", encoding="utf-8", errors="replace") as patch:
              for line in patch:
                  if not line.startswith("diff --git "):
                      continue

                  match = re.match(
                      r"diff --git a/(.*?) b/(.*?)$",
                      line.rstrip("\n")
                  )

                  if not match:
                      continue

                  old_path, new_path = match.groups()

                  for path in (old_path, new_path):
                      lower_path = path.lower()

                      if (
                          lower_path == "js/readme.md"
                          or lower_path.startswith(".github/workflows/")
                          or lower_path.endswith(excluded_extensions)
                          or "waitsys" in lower_path
                      ):
                          excluded_paths.append(path)

          if excluded_paths:
              print("::error::Excluded Files Were Found In Patch")

              for path in sorted(set(excluded_paths)):
                  print(f"  {path}")

              sys.exit(1)

          print("Patch Exclusion Verification Passed")
          PY

          # Generate Change Summary
          {
            echo "BakaSU Sync-Up Integration Patch"
            echo "================================"
            echo
            echo "Repository: Baka-SU/BakaSU"
            echo "Direction: sync-up → main"
            echo
            echo "Excluded Paths:"
            echo "  js/README.md"
            echo "  .github/workflows/**"
            echo "  **/*.kt"
            echo "  **/*.json"
            echo "  **/*.xml"
            echo "  **/*.ts"
            echo "  **/*.rs"
            echo "  **/*.py"
            echo "  **/*.js"
            echo "  **/*waitsys*"
            echo
            echo "Main Commit:"
            git rev-parse origin/main
            echo
            echo "Sync-Up Commit:"
            git rev-parse origin/sync-up
            echo
            echo "Changed Files:"
            git diff --name-status origin/main origin/sync-up -- "${INCLUDED_PATHS[@]}"
            echo
            echo "Change Statistics:"
            git diff --stat origin/main origin/sync-up -- "${INCLUDED_PATHS[@]}"
            echo
            echo "Patch SHA256:"
            sha256sum "$PATCH"
          } | tee "$SUMMARY"

          # Export Artifact File Names
          echo "PATCHFILE=$PATCH" >> "$GITHUB_ENV"
          echo "SUMMARYFILE=$SUMMARY" >> "$GITHUB_ENV"

          echo
          echo "Integration Patch Generated Successfully"

      # Validate Patch Against Main
      - name: 🧪 Validate Patch Against Main
        shell: bash
        working-directory: BakaSU
        run: |
          set -euo pipefail

          # Create A Clean Main Worktree
          git worktree add --detach /tmp/bakasu-main origin/main

          # Verify Patch Can Be Applied
          if git -C /tmp/bakasu-main apply --check \
            "$GITHUB_WORKSPACE/BakaSU/$PATCHFILE"; then
            echo "Patch Applies Cleanly Against Main"
          else
            echo "::error::Patch Validation Failed Against Main"
            exit 1
          fi

          # Simulate Patch Application
          git -C /tmp/bakasu-main apply \
            "$GITHUB_WORKSPACE/BakaSU/$PATCHFILE"

          echo "Patch Successfully Applied To Temporary Main Worktree"

          # Check Whitespace Without Rejecting Upstream Changes
          if git -C /tmp/bakasu-main diff --check; then
            echo "No Whitespace Issues Found"
          else
            echo "::warning::Upstream Patch Contains Whitespace Issues"
            echo "::warning::Review Reported Files And Lines Above"
          fi

          # Verify Applied Changes Exist
          if [[ -z "$(git -C /tmp/bakasu-main status --porcelain)" ]]; then
            echo "::error::No Changes Detected After Patch Application"
            exit 1
          fi

          echo "Patch Application Validation Passed"

      # Upload Generated Patch And Summary
      - name: 📦 Upload Integration Patch
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-Sync-Up-To-Main-Patch
          path: |
            BakaSU/BakaSU-sync-up-to-main.patch
            BakaSU/BakaSU-sync-up-to-main-summary.txt
          if-no-files-found: error
          retention-days: 30

      # Final Result
      - name: 🎉 Patch Generation Complete
        shell: bash
        run: |
          echo "BakaSU Sync-Up Integration Patch Ready"
          echo "Patch: BakaSU/$PATCHFILE"
          echo "Summary: BakaSU/$SUMMARYFILE"
          echo "Artifact: BakaSU-Sync-Up-To-Main-Patch"
