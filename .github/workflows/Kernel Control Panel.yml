name: Kernel Control Panel

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 📥 Checkout Repository
      # ==============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          REPO="${{ github.repository }}"

          printf "%s\n" \
          '<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>⚡ Kernel Control Panel </title>
          
            <style>
              body {
                background: #0d1117;
                color: #c9d1d9;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
              }
          
              h1 { text-align: center; }
          
              .card {
                background: #161b22;
                padding: 16px;
                border-radius: 12px;
                margin: 12px auto;
                max-width: 900px;
              }
          
              .release {
                padding: 12px 0;
                border-bottom: 1px solid #30363d;
              }
          
              .btn {
                display: inline-block;
                padding: 8px 10px;
                background: #238636;
                color: white;
                border-radius: 6px;
                text-decoration: none;
              }
          
              pre {
                background: #0d1117;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #30363d;
                white-space: pre-wrap;
              }
            </style>
          </head>
          
          <body>
          
          <h1>⚡ Kernel Control Panel </h1>
          
          <div class="card" id="latest">
            Loading Latest Release...
          </div>
          
          <div class="card">
            <h2>📦 All Releases</h2>
            <div id="list">Loading...</div>
          </div>
          
          <script>
          const repo = "'"$REPO"'";
          
          /* ==============================
             📦 Release Dashboard
             ============================== */
          
          async function loadReleases() {
            const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
            const data = await res.json();
          
            if (!Array.isArray(data) || data.length === 0) return;
          
            const latest = data[0];
          
            document.getElementById("latest").innerHTML = `
              <h2>⚡ Latest Release</h2>
              <h3>${latest.name || "Unnamed Release"}</h3>
              <a class="btn" href="${latest.assets?.[0]?.browser_download_url || '#'}">
                ⬇️ Download Release
              </a>
              <pre>${latest.body || "No Changelog Available"}</pre>
            `;
          
            let html = "";
          
            data.forEach(r => {
              html += `
                <div class="release">
                  <h3>${r.name || "Kernel Release"}</h3>
                  <a class="btn" href="${r.assets?.[0]?.browser_download_url || '#'}">Download</a>
                  <pre>${r.body || ""}</pre>
                </div>
              `;
            });
          
            document.getElementById("list").innerHTML = html;
          }

          /* ==============================
             🚀 Latest Successful Build Button
             ============================== */
          
          async function loadLatestBuild() {
            const api = `https://api.github.com/repos/${repo}/actions/runs?status=success&per_page=1`;
          
            const res = await fetch(api);
            const data = await res.json();
          
            const run = data.workflow_runs?.[0];
            if (!run) return;
          
            const url = run.html_url;
          
            document.getElementById("latest").innerHTML += `
              <br><br>
              <a class="btn" href="${url}" target="_blank">
                ⬇️ Download Latest Successful Build
              </a>
            `;
          }
          
          /* ============================== */
          
          loadReleases();
          loadLatestBuild();
          
          </script>
          
          </body>
          </html>' > public/index.html

      # ==============================
      # 📦 Upload Pages Artifact
      # ==============================
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
