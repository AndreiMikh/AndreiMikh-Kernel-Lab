name: 🌏 Kernel Control Panel

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["Stable V9.3"]
    types: [completed]

concurrency:
  group: kernel-control-panel
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read


# ==============================
# 🧠 Job 1: Build
# ==============================
jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      changelog: ${{ steps.changelog.outputs.msg }}
      artifacts: ${{ steps.scanner.outputs.paths }}

    steps:

      # ==============================
      # 🔧 Checkout Full History
      # ==============================
      - name: 🔧 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # ==============================
      # 📜 Changelog Engine
      # ==============================
      - name: 📜 Changelog Engine
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          # Fetch the Tags and Prune
          git fetch --tags --prune --no-recurse-submodules || true

          # Get the Previous Commit Hash, Fallback to the Initial Commit if None
          PREV="${{ github.event.before || '' }}"

          if [[ -z "$PREV" || "$PREV" == "0000000000000000000000000000000000000000" ]]; then
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi
   
          # Get the Log of Commits between Prev and Head (Current State)
          LOG=$(git log --no-merges --pretty=format:"%s" "$PREV..HEAD" || echo "")

          # If No Commits, Provide a Default Message
          [[ -z "$LOG" ]] && LOG="🔥 Automated Kernel Build"

          # Pass the Changelog to the GitHub Output
          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ==============================
      # 📁 Output Directories
      # ==============================
      - name: 📁 Output Directories
        run: mkdir -p AnyKernel3 flat_apk ZRAM-Module

      # ==============================
      # 📦 Artifact Scanner
      # ==============================
      - name: 📦 Artifact Scanner
        id: scanner
        shell: bash
        run: |
          set -euo pipefail

          PATHS=""

          # Check if AnyKernel3 and Manager APK Directories Contain Files
          for d in AnyKernel3 flat_apk; do
            if [[ -d "$d" ]] && [[ -n "$(find "$d" -type f -print -quit)" ]]; then
              PATHS+="$d/**/* "
            fi
          done

          # Check if ZRAM-Module Contains Files
          if [[ -d "ZRAM-Module" ]] && [[ -n "$(find ZRAM-Module -type f -print -quit)" ]]; then
            PATHS+="ZRAM-Module/**/* "
          fi

          # Debugging: If No Artifacts Found, Print a Warning Message
          if [[ -z "$PATHS" ]]; then
            echo "⚠️ No Artifacts Found!"
          else
            echo "📌 Artifacts Found: $PATHS"
          fi

          # Cleanup and Prepare the Paths for Output
          PATHS="$(echo "$PATHS" | xargs)"
          echo "paths=$PATHS" >> $GITHUB_OUTPUT

# ==============================
# 🚀 Job 2: Release
# ==============================
  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      actions: read

    steps:

      - name: 🔧 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ github.run_number }}"
          name: "🔥 Kernel Build #${{ github.run_number }}"

          body: |
            ## 📦 Kernel Release

            ### 📜 Changelog
            <details>
              <summary>🖲️ Click to View Changelog</summary>
        
              ${{ needs.build.outputs.changelog }}

            </details>
          artifacts: ${{ needs.build.outputs.artifacts }}
          draft: false
          prerelease: false
          allowUpdates: true

# ==============================
# 🌐 Job 3: Dashboard (GitHub Pages)
# ==============================
  dashboard:
    needs: release
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public
          REPO="${{ github.repository }}"
          if [[ -z "$REPO" ]]; then
            echo "⚠️ Error: Repository Variable is Not Set!"
            exit 1
          fi

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>🔥 Kernel Control Panel</title>
    
          <style>
          body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial;
            padding: 30px;
          }
          .card {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 900px;
          }
          .btn {
            display: inline-block;
            padding: 10px 14px;
            background: #238636;
            color: white;
            border-radius: 6px;
            text-decoration: none;
          }
          pre {
            white-space: pre-wrap;
          }
          </style>
          </head>
    
          <body>
    
          <h1>🔥 Kernel Control Panel</h1>
    
          <div id="app" class="card">
            <h2>⚡ Loading Builds...</h2>
          </div>
    
          <script>
          const repo = "${REPO}";
    
          async function getRuns() {
            try {
              const res = await fetch(\`https://api.github.com/repos/\${repo}/actions/runs?per_page=10\`);
              const data = await res.json();
              return data.workflow_runs || [];
            } catch (err) {
              console.error("⚠️ Failed to Fetch Runs:", err);
              return [];
            }
          }

          async function getRelease() {
            try {
              const res = await fetch(\`https://api.github.com/repos/\${repo}/releases/latest\`);
              return await res.json();
            } catch (err) {
              console.error("⚠️ Failed to Fetch Release:", err);
              return { body: "⚠️ No Release Notes Available" };
            }
          }

          function card(title, text) {
            return \`
              <div class="card">
                <h3>\${title}</h3>
                <pre>\${text}</pre>
              </div>
            \`;
          }
    
          async function load() {
            const runs = await getRuns();
            const release = await getRelease();
    
            document.getElementById("app").innerHTML = \`
              \${card("📜 Latest Release Notes", release.body || "No release notes")}
              \${card("📊 Recent Build Runs", JSON.stringify(runs.slice(0,5), null, 2))}
            \`;
          }
    
          load();
          </script>
    
          </body>
          </html>
          EOF

          if [[ ! -f "public/index.html" ]]; then
            echo "⚠️ Error: Dashboard HTML was Not Created!"
            exit 1
          fi

      # ==============================
      # 📦 Upload Pages
      # ==============================
      - name: 📦 Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
