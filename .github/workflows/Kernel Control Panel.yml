name: 🌐 Kernel Control Panel 🌐

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["Stable V9.3"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kernel-control-panel
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 📥 Checkout
      # ==============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public
          REPO="${{ github.repository }}"

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>🔥 Kernel Control Panel </title>
          
          <style>
          body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            padding: 30px;
          }
          
          h1 { text-align: center; }
          
          .card {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 900px;
          }
          
          .btn {
            display: inline-block;
            padding: 10px 14px;
            background: #238636;
            color: white;
            border-radius: 6px;
            text-decoration: none;
          }
          pre {
            white-space: pre-wrap;
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
          }
          </style>
          </head>
          
          <body>
          
          <h1>🔥 Kernel Control Panel </h1>
          
          <div id="app" class="card">
            <h2>⚡ Loading Builds...</h2>
          </div>
          
          <script>
          const repo = "${REPO}";

          /* ==============================
             Fetch Workflow Runs
             ============================== */
          async function getRuns() {
            const res = await fetch(
              `https://api.github.com/repos/${repo}/actions/runs?per_page=20`
            );
            const data = await res.json();
            return data.workflow_runs || [];
          }
          
          /* ==============================
             Artifact Resolver
             ============================== */
          async function getArtifact(run) {
            try {
              const res = await fetch(run.artifacts_url);
              const data = await res.json();
          
              return (
                data.artifacts?.find(a => a.name.includes("AnyKernel3")) ||
                data.artifacts?.find(a => a.name.includes("Kernel")) ||
                data.artifacts?.[0] ||
                null
              );
            } catch {
              return null;
            }
          }
          
          /* ==============================
             Feature Detector
             ============================== */
          function detectFeatures(text) {
            const t = (text || "").toLowerCase();
          
            const f = [];
            if (t.includes("sched")) f.push("🧠 Scheduler");
            if (t.includes("zram")) f.push("🧩 ZRAM");
            if (t.includes("lz4")) f.push("⚡ LZ4");
            if (t.includes("tcp") || t.includes("bbr")) f.push("📡 TCP");
            if (t.includes("lxc") || t.includes("docker")) f.push("📦 Containers");
            if (t.includes("ksu")) f.push("🧬 KernelSU");
          
            return f.length ? f.join(" • ") : "🧩 Standard Kernel";
          }
          
          /* ==============================
             Git Diff Engine (Real)
             ============================== */
          async function getDiff(base, head) {
            try {
              const res = await fetch(
                `https://api.github.com/repos/${repo}/compare/${base}...${head}`
              );
              const data = await res.json();
          
              return (data.commits || [])
                .slice(0, 8)
                .map(c => `• ${c.sha.slice(0,7)}: ${c.commit.message.split("\\n")[0]}`)
                .join("\\n");
            } catch {
              return "Diff Unavailable";
            }
          }
          
          /* ==============================
             Card UI
             ============================== */
          function card(title, run, artifact) {
            if (!run || !artifact) {
              return `<div class="card"><h3>${title}</h3><p>No Build Found</p></div>`;
            }
          
            return `
              <div class="card">
                <h3>${title}</h3>
                <p><b>Workflow:</b> ${run.name}</p>
                <p><b>Features:</b> ${detectFeatures(run.head_commit?.message)}</p>
          
                <a class="btn" href="${artifact.archive_download_url}">
                  ⬇️ Download Build
                </a>
              </div>
            `;
          }
          
          /* ==============================
             Main Loader
             ============================== */
          async function load() {
            try {
              const runs = await getRuns();
          
              const stable = runs.find(r =>
                r.conclusion === "success" &&
                !r.name.toLowerCase().includes("test")
              );
          
              const exp = runs.find(r =>
                r.conclusion === "success" &&
                r.name.toLowerCase().includes("test")
              );
          
              const stableArt = await getArtifact(stable);
              const expArt = await getArtifact(exp);
          
              let diffText = "No diff available";
          
              if (runs.length > 1) {
                const latest = runs[0];
                const prev = runs[1];
          
                diffText = await getDiff(prev.head_sha, latest.head_sha);
              }
          
              document.getElementById("app").innerHTML = `
                ${card("⚡ Latest Stable Build", stable, stableArt)}
                ${card("🧪 Experimental Build", exp, expArt)}
          
                <div class="card">
                  <h3>📜 OEM Kernel Diff Changelog</h3>
                  <pre>${diffText}</pre>
                </div>
              `;
          
            } catch (e) {
              console.error(e);
              document.getElementById("app").innerHTML =
                "<h3>❌ Dashboard Failed</h3>";
            }
          }
          
          load();
          </script>
          
          </body>
          </html>
          EOF

      # ==============================
      # 📦 Upload Pages
      # ==============================
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
