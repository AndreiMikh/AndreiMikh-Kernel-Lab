name: 🌐 Kernel Control Panel v2

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["Stable V9.3"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 📥 Checkout Repository
      # ==============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          REPO="${{ github.repository }}"

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>🔥 Kernel Control Panel </title>
          
          <style>
          body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            padding: 30px;
          }
          
          h1 { text-align: center; }
          
          .card {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 900px;
          }
          
          .btn {
            display: inline-block;
            padding: 10px 14px;
            background: #238636;
            color: white;
            border-radius: 6px;
            text-decoration: none;
          }
          </style>
          </head>
          
          <body>
          
          <h1>🔥 Kernel Control Panel </h1>
          
          <div class="card" id="latest">
            <h2>⚡ Loading Latest Build...</h2>
          </div>
          
          <script>
          const repo = "${REPO}";
          
          async function loadDashboard() {
            try {
          
              // ==============================
              // 1. Fetch Recent Workflow Runs
              // ==============================
              const runsRes = await fetch(
                `https://api.github.com/repos/${repo}/actions/runs?per_page=20`
              );
          
              const runsData = await runsRes.json();
              const runs = runsData.workflow_runs || [];
          
              if (!runs.length) {
                document.getElementById("latest").innerHTML =
                  "<h3>No Builds Found</h3>";
                return;
              }
          
              // ==============================
              // 2. Classify Builds
              // ==============================
              const stableRuns = runs.filter(r =>
                r.conclusion === "success" &&
                !r.name.toLowerCase().includes("test")
              );
          
              const experimentalRuns = runs.filter(r =>
                r.conclusion === "success" &&
                r.name.toLowerCase().includes("test")
              );
          
              const latestStable = stableRuns[0];
              const latestExp = experimentalRuns[0];
          
              // ==============================
              // 3. Smart Artifact Resolver
              // ==============================
              async function getArtifact(run) {
                if (!run) return null;
          
                const res = await fetch(run.artifacts_url);
                const data = await res.json();
          
                return (
                  data.artifacts?.find(a => a.name.includes("AnyKernel3")) ||
                  data.artifacts?.find(a => a.name.includes("Kernel")) ||
                  data.artifacts?.[0] ||
                  null
                );
              }
          
              const stableArtifact = await getArtifact(latestStable);
              const expArtifact = await getArtifact(latestExp);
          
              // ==============================
              // 4. Render UI
              // ==============================
          
              function renderBuild(title, run, artifact) {
                if (!run || !artifact) return `<p>No ${title} Build</p>`;
          
                return `
                  <div class="card">
                    <h2>${title}</h2>
                    <p><b>Run:</b> ${run.name}</p>
                    <p><b>ID:</b> ${run.id}</p>
                    <a class="btn" href="${artifact.archive_download_url}">
                      ⬇️ Download
                    </a>
                  </div>
                `;
              }
          
              document.getElementById("latest").innerHTML = `
                ${renderBuild("⚡ Latest Stable Build", latestStable, stableArtifact)}
                ${renderBuild("🧪 Latest Experimental Build", latestExp, expArtifact)}
              `;
          
            } catch (e) {
              console.error(e);
              document.getElementById("latest").innerHTML =
                "<h3>Dashboard Failed to Load</h3>";
            }
          }
          
          loadDashboard();
          </script>
          
          </body>
          </html>
          EOF

      # ==============================
      # 📦 Upload Pages
      # ==============================
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
