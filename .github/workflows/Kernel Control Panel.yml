name: 🌐 Kernel Control Panel v2

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["Stable V9.3"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 📥 Checkout Repository
      # ==============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      # ==============================
      # 📊 Generate Dashboard
      # ==============================
      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          REPO="${{ github.repository }}"

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>🔥 Kernel Control Panel </title>
          
          <style>
          body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            padding: 30px;
          }
          
          h1 { text-align: center; }
          
          .card {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 900px;
          }
          
          .btn {
            display: inline-block;
            padding: 10px 14px;
            background: #238636;
            color: white;
            border-radius: 6px;
            text-decoration: none;
          }
          </style>
          </head>
          
          <body>
          
          <h1>🔥 Kernel Control Panel </h1>
          
          <div class="card" id="latest">
            <h2>⚡ Loading Latest Build...</h2>
          </div>
          
          <script>
          const repo = "${REPO}";
          
          async function loadLatestBuild() {
            try {
          
              // ==============================
              // 1. Get Latest Successful Run
              // ==============================
              const runsRes = await fetch(
                `https://api.github.com/repos/${repo}/actions/runs?status=success&per_page=10`
              );
          
              const runsData = await runsRes.json();
          
              const run = runsData.workflow_runs?.find(r =>
                r.conclusion === "success"
              );
          
              if (!run) {
                document.getElementById("latest").innerHTML =
                  "<h3>No Successful Builds Found</h3>";
                return;
              }
          
              // ==============================
              // 2. Get Artifacts
              // ==============================
              const artRes = await fetch(run.artifacts_url);
              const artData = await artRes.json();
          
              if (!artData.artifacts?.length) {
                document.getElementById("latest").innerHTML =
                  "<h3>No artifacts found</h3>";
                return;
              }
          
              // ==============================
              // 3. Smart Artifact Selection
              // ==============================
              const artifact =
                artData.artifacts.find(a => a.name.includes("AnyKernel3")) ||
                artData.artifacts.find(a => a.name.includes("Kernel")) ||
                artData.artifacts[0];
          
              const downloadUrl = artifact.archive_download_url;
          
              // ==============================
              // 4. Render UI
              // ==============================
              document.getElementById("latest").innerHTML = `
                <h2>⚡ Latest Successful Build</h2>
                <p><b>Run ID:</b> ${run.id}</p>
                <p><b>Workflow:</b> ${run.name}</p>
                <a class="btn" href="${downloadUrl}">
                  ⬇️ Download Latest Kernel Build
                </a>
              `;
          
            } catch (e) {
              console.error(e);
              document.getElementById("latest").innerHTML =
                "<h3>Failed to Load Build</h3>";
            }
          }
          
          loadLatestBuild();
          </script>
          
          </body>
          </html>
          EOF

      # ==============================
      # 📦 Upload Pages
      # ==============================
      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ==============================
      # 🚀 Deploy Pages
      # ==============================
      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
