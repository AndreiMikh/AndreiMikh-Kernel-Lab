name: 🧰 Clang & Android Build Tools Cache

on:
  workflow_dispatch:
    inputs:
      FILE:
        description: "Select Kernel Manifest"
        required: true
        type: choice
        options:
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_pad_lite_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_12_b
          - oneplus_12_custom
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_6.6.66_cn
          - oneplus_13_b
          - oneplus_13_custom
          - oneplus_13_wild
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_ace_6t_canary
          - oneplus_15r
          - oneplus_15r_canary
          - oneplus_15
          - oneplus_15_canary
          - oneplus_15_w
          - oneplus_15t
          - oneplus_15t_canary
          - oneplus_pad3_pro_canary
          - oneplus_pad_4
          - oneplus_pad_4_canary
          - oneplus_sm8750_lineage_aosp
          - oneplus_sm8750_crdroid_aosp

  schedule:
    - cron: "0 3 */3 * *"

permissions:
  contents: write
  actions: write

env:
  REPO_ROOT: "${{ github.workspace }}/toolchain-source"
  CACHE_ROOT: "${{ github.workspace }}/toolchain-cache"
  TOOLCHAIN_RELEASE_TAG: "clang-build-tools-cache"

jobs:

  prepare:
    name: 🧩 Prepare Manifest Matrix
    runs-on: ubuntu-latest

    outputs:
      manifests: ${{ steps.matrix.outputs.manifests }}

    steps:
      - name: 🧩 Generate Manifest Matrix
        id: matrix
        shell: bash
        env:
          DISPATCH_FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -z "${DISPATCH_FILE:-}" ]]; then
              echo "::error::No manifest was selected."
              exit 1
            fi

            python3 - "$DISPATCH_FILE" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          print(
              "manifests=" +
              json.dumps(
                  [sys.argv[1]],
                  separators=(",", ":")
              )
          )
          PY

            exit 0
          fi

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json

          manifests = [
              "oneplus_10_pro_b",
              "oneplus_10t_v",
              "oneplus_11r_b",
              "oneplus_ace2_b",
              "oneplus_11_b",
              "oneplus_12r_b",
              "oneplus_pad_lite_b",
              "oneplus_ace2_pro_b",
              "oneplus_ace3_b",
              "oneplus_open_b",
              "oneplus_nord_ce4_b",
              "oneplus_nord_ce4_lite_5g_b",
              "oneplus_nord_4_b",
              "oneplus_ace_3v_b",
              "oneplus_12_b",
              "oneplus_12_custom",
              "oneplus_13r_b",
              "oneplus_ace3_pro_b",
              "oneplus_ace5_b",
              "oneplus_pad_pro_b",
              "oneplus_pad2_b",
              "oneplus_nord_5_b",
              "oneplus_ace5_pro_b",
              "oneplus_13_6.6.66_cn",
              "oneplus_13_b",
              "oneplus_13_custom",
              "oneplus_13_wild",
              "oneplus_13t_b",
              "oneplus_13s_b",
              "oneplus_pad_2_pro_b",
              "oneplus_pad_3_b",
              "oneplus_ace_6",
              "oneplus_turbo_6",
              "oneplus_nord_6",
              "oneplus_ace_6t",
              "oneplus_ace_6t_canary",
              "oneplus_15r",
              "oneplus_15r_canary",
              "oneplus_15",
              "oneplus_15_canary",
              "oneplus_15_w",
              "oneplus_15t",
              "oneplus_15t_canary",
              "oneplus_pad3_pro_canary",
              "oneplus_pad_4",
              "oneplus_pad_4_canary",
              "oneplus_sm8750_lineage_aosp",
              "oneplus_sm8750_crdroid_aosp"
          ]

          print(
              "manifests=" +
              json.dumps(
                  manifests,
                  separators=(",", ":")
              )
          )
          PY

  cache-tools:
    name: 🧰 Build Tools — ${{ matrix.file }}
    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        file: ${{ fromJson(needs.prepare.outputs.manifests) }}

    runs-on: ubuntu-latest

    concurrency:
      group: clang-build-tools-${{ matrix.file }}
      cancel-in-progress: false

    env:
      FILE: ${{ matrix.file }}
      GITREPOSITORYINPUT: ""

    steps:

      - name: 📥 Checkout Workflow Repository
        uses: actions/checkout@v5

      - name: 🧰 Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            jq \
            rsync \
            zstd \
            unzip \
            zip \
            python3 \
            ca-certificates

          git config --global user.name \
            "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🛠️ Install Repo Tool
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "📦 Installing Android Repo tool..."

          sudo curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod 0755 /usr/local/bin/repo

          if ! command -v repo >/dev/null 2>&1; then
            echo "::error::Repo tool installation failed."
            exit 1
          fi

          echo "Repo executable:"
          command -v repo

          echo "Repo version:"
          repo --version

      - name: 🔎 Validate Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${FILE:-}" ]]; then
            echo "::error::FILE is empty."
            exit 1
          fi

          echo "Selected manifest: $FILE"

      - name: 🧹 Prepare Workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf \
            "$REPO_ROOT" \
            "$CACHE_ROOT"

          mkdir -p \
            "$REPO_ROOT" \
            "$CACHE_ROOT" \
            "$CACHE_ROOT/toolchain"

      - name: 🔍 Discover Kernel Manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT"

          echo "🔍 Searching for manifest: ${FILE}.xml"

          MANIFESTFILECONFIG="$FILE"

          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            MANIFESTFILECONFIG="${BASH_REMATCH[1]}"
          fi

          MANIFESTBASEFILE=$(echo "$MANIFESTFILECONFIG" | sed -E '
            s/_aosp/AOSP/g;
            s/_custom/CustomBuild/g;
            s/_([a-zA-Z0-9])/\U\1/g;
            s/^oneplus/1+/;
            s/^realme/RealMe/;
            s/^oppo/Oppo/
          ')

          echo "Manifest config: $MANIFESTFILECONFIG"
          echo "Manifest base: $MANIFESTBASEFILE"

          REPOS=(
            "AndreiMikh|Kernel-Manifest"
            "AndreiMikh|AndreiMikh-Kernel-Lab"
          )

          if [[ -n "${GITREPOSITORYINPUT:-}" &&
                "$GITREPOSITORYINPUT" == */* ]]; then

            EXTRA_OWNER="${GITREPOSITORYINPUT%%/*}"
            EXTRA_REPO="${GITREPOSITORYINPUT#*/}"

            REPOS+=(
              "$EXTRA_OWNER|$EXTRA_REPO"
            )
          fi

          MANIFESTREPO=""
          MANIFESTREPONAME=""
          MANIFESTBRANCH=""
          XMLPATH=""

          for ENTRY in "${REPOS[@]}"; do
            OWNER="${ENTRY%%|*}"
            REPO_NAME="${ENTRY#*|}"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking ${OWNER}/${REPO_NAME}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            BRANCHES=()

            API_URL="https://api.github.com/repos/${OWNER}/${REPO_NAME}/branches?per_page=100"

            mapfile -t API_BRANCHES < <(
              curl -fsSL \
                --retry 3 \
                --connect-timeout 10 \
                --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "$API_URL" |
              jq -r '.[].name' 2>/dev/null || true
            )

            BRANCHES+=("${API_BRANCHES[@]}")

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              mapfile -t PUBLIC_BRANCHES < <(
                curl -fsSL \
                  --retry 3 \
                  --connect-timeout 10 \
                  --max-time 30 \
                  -H "Accept: application/vnd.github+json" \
                  "$API_URL" |
                jq -r '.[].name' 2>/dev/null || true
              )

              BRANCHES+=("${PUBLIC_BRANCHES[@]}")
            fi

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              mapfile -t REMOTE_BRANCHES < <(
                git ls-remote --heads \
                  "https://github.com/${OWNER}/${REPO_NAME}.git" |
                awk '{
                  sub("refs/heads/", "", $2)
                  print $2
                }' || true
              )

              BRANCHES+=("${REMOTE_BRANCHES[@]}")
            fi

            mapfile -t UNIQUE_BRANCHES < <(
              printf '%s\n' "${BRANCHES[@]}" |
              sed '/^$/d' |
              sort -u
            )

            for BRANCH in "${UNIQUE_BRANCHES[@]}"; do

              RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"

              echo "Checking branch: $BRANCH"

              if curl -fsSL \
                --retry 3 \
                --connect-timeout 10 \
                --max-time 30 \
                "$RAW_URL" \
                -o candidate.xml; then

                if [[ -s candidate.xml ]] &&
                   grep -q '<manifest' candidate.xml; then

                  MANIFESTREPO="${OWNER}/${REPO_NAME}"
                  MANIFESTREPONAME="$REPO_NAME"
                  MANIFESTBRANCH="$BRANCH"

                  XMLPATH="$REPO_ROOT/${FILE}.xml"

                  cp candidate.xml "$XMLPATH"

                  echo "✅ Manifest found."
                  echo "Repository: $MANIFESTREPO"
                  echo "Branch: $MANIFESTBRANCH"
                  echo "Manifest: $FILE.xml"

                  break 2
                fi
              fi
            done

            rm -f candidate.xml
          done

          if [[ -z "$MANIFESTREPO" ||
                -z "$MANIFESTBRANCH" ||
                -z "$XMLPATH" ]]; then

            echo "::error::Unable to locate ${FILE}.xml"
            exit 1
          fi

          MANIFESTSHA256=$(sha256sum "$XMLPATH" |
            awk '{print $1}')

          {
            echo "MANIFESTREPO=$MANIFESTREPO"
            echo "MANIFESTREPONAME=$MANIFESTREPONAME"
            echo "MANIFESTBRANCH=$MANIFESTBRANCH"
            echo "MANIFESTFILE=$FILE.xml"
            echo "MANIFESTFILECONFIG=$MANIFESTFILECONFIG"
            echo "MANIFESTBASEFILE=$MANIFESTBASEFILE"
            echo "MANIFESTSHA256=$MANIFESTSHA256"
            echo "XMLPATH=$XMLPATH"
          } >> "$GITHUB_ENV"

      - name: 🧬 Parse Kernel Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          XMLPATH="$REPO_ROOT/${FILE}.xml"

          REVISION=$(grep -m1 '<project ' "$XMLPATH" |
            sed -nE 's/.*revision="([^"]+)".*/\1/p' ||
            true)

          CPU=""

          if [[ -n "$REVISION" ]]; then
            CPU=$(echo "$REVISION" |
              grep -oE 'sm[0-9]+' |
              head -n1 ||
              true)
          fi

          if [[ -z "$CPU" ]]; then
            CPU=$(grep -oE 'sm[0-9]+' "$XMLPATH" |
              head -n1 ||
              true)
          fi

          VANDROID=$(grep -oE 'android[0-9]+' "$XMLPATH" |
            head -n1 ||
            true)

          ASHORTVERSION=$(grep -oE \
            '[0-9]+\.[0-9]+\.[0-9]+' \
            "$XMLPATH" |
            head -n1 ||
            true)

          CPU="${CPU:-Unknown}"
          VANDROID="${VANDROID:-Unknown}"
          ASHORTVERSION="${ASHORTVERSION:-Unknown}"

          echo "CPU: $CPU"
          echo "Android: $VANDROID"
          echo "Kernel version: $ASHORTVERSION"

          {
            echo "CPU=$CPU"
            echo "VANDROID=$VANDROID"
            echo "ASHORTVERSION=$ASHORTVERSION"
          } >> "$GITHUB_ENV"

      - name: 🔑 Generate Toolchain Cache Identity
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFESTHASH="${MANIFESTSHA256:0:16}"

          SAFE_BRANCH=$(printf '%s' "$MANIFESTBRANCH" |
            sed 's#[^A-Za-z0-9._-]#-#g')

          CACHEKEY="CLANG-TOOLS-${{ runner.os }}-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          RELEASEASSETNAME="CLANG-TOOLS-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          echo "Cache key:"
          echo "$CACHEKEY"

          echo "Release asset:"
          echo "$RELEASEASSETNAME"

          {
            echo "CACHEKEY=$CACHEKEY"
            echo "RELEASEASSETNAME=$RELEASEASSETNAME"
          } >> "$GITHUB_ENV"

      - name: 🚀 Initialize Repo
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT"

          mkdir -p kernel_workspace

          cd kernel_workspace

          echo "Initializing repository..."

          repo init \
            -u "https://github.com/${MANIFESTREPO}.git" \
            -b "$MANIFESTBRANCH" \
            -m "$MANIFESTFILE" \
            --depth=1 \
            --no-repo-verify

          echo "✅ Repo initialization completed."

      - name: 🧹 Clean Obsolete Manifest Entries
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"

          MANIFEST_PATH=".repo/manifests/${MANIFESTFILE}"

          if [[ ! -f "$MANIFEST_PATH" ]]; then
            echo "::warning::Manifest not found at $MANIFEST_PATH"
            exit 0
          fi

          sed -i \
            '/ks-kernel\.lnx\.5\.0\.r3-rel/d' \
            "$MANIFEST_PATH"

      - name: 🔄 Sync Kernel Repository
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPO_ROOT/kernel_workspace"

          SYNCFLAGS=(
            -c
            --force-sync
            --no-clone-bundle
            --no-tags
            --optimized-fetch
            --prune
            --retry-fetches=5
            --verbose
            "-j$(nproc)"
          )

          SYNC_LOG="$CACHE_ROOT/repo-sync.log"

          echo "Starting repo sync..."

          (
            repo sync "${SYNCFLAGS[@]}"
          ) > "$SYNC_LOG" 2>&1 &

          SYNC_PID=$!

          START_TIME=$(date +%s)
          LAST_REPORT=$START_TIME

          while kill -0 "$SYNC_PID" 2>/dev/null; do
            sleep 60

            NOW=$(date +%s)

            if (( NOW - LAST_REPORT >= 60 )); then
              ELAPSED=$((NOW - START_TIME))

              echo "⏱️ Repo sync running: ${ELAPSED}s"

              tail -n 20 "$SYNC_LOG" || true

              LAST_REPORT=$NOW
            fi

            if (( NOW - START_TIME >= 1800 )); then
              echo "::error::Repo sync exceeded 30 minutes."

              kill "$SYNC_PID" 2>/dev/null || true
              wait "$SYNC_PID" 2>/dev/null || true

              exit 1
            fi
          done

          if ! wait "$SYNC_PID"; then
            echo "::error::repo sync failed."

            tail -n 100 "$SYNC_LOG" || true

            exit 1
          fi

          echo "✅ Repo sync completed."

      - name: 🔎 Detect Build Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_PLATFORM="$REPO_ROOT/kernel_workspace/kernel_platform"

          if [[ ! -d "$KERNEL_PLATFORM" ]]; then
            echo "::error::kernel_platform directory was not found."
            exit 1
          fi

          echo "Kernel platform:"
          echo "$KERNEL_PLATFORM"

          TOOLCHAIN_PATHS=()

          add_path_if_exists() {
            local path="$1"

            if [[ -d "$path" ]]; then
              echo "✅ Found: $path"
              TOOLCHAIN_PATHS+=("$path")
            else
              echo "ℹ️ Not found: $path"
            fi
          }

          echo ""
          echo "🔍 Searching for Clang..."

          shopt -s nullglob

          CLANG_DIRS=(
            "$KERNEL_PLATFORM"/prebuilts/clang/host/linux-x86/clang-*
          )

          if [[ ${#CLANG_DIRS[@]} -gt 0 ]]; then
            for DIR in "${CLANG_DIRS[@]}"; do
              if [[ -d "$DIR" ]]; then
                echo "✅ Clang: $DIR"
                TOOLCHAIN_PATHS+=("$DIR")
              fi
            done
          else
            echo "ℹ️ No versioned Clang directory found."
          fi

          shopt -u nullglob

          echo ""
          echo "🔍 Searching for Rust..."

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/rust"

          echo ""
          echo "🔍 Searching for kernel build tools..."

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/kernel-build-tools"

          echo ""
          echo "🔍 Searching for Android build tools..."

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/build-tools"

          echo ""
          echo "🔍 Searching for other toolchain directories..."

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/clang-tools"

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/gcc"

          add_path_if_exists \
            "$KERNEL_PLATFORM/prebuilts/gcc/linux-x86"

          if [[ ${#TOOLCHAIN_PATHS[@]} -eq 0 ]]; then
            echo "::error::No Clang, Rust, or build-tool directories were found."
            exit 1
          fi

          TOOLCHAIN_LIST="$CACHE_ROOT/toolchain-paths.txt"

          : > "$TOOLCHAIN_LIST"

          for PATH_ENTRY in "${TOOLCHAIN_PATHS[@]}"; do
            REAL_PATH=$(realpath --relative-to="$KERNEL_PLATFORM" "$PATH_ENTRY")

            echo "$REAL_PATH" >> "$TOOLCHAIN_LIST"
          done

          sort -u "$TOOLCHAIN_LIST" -o "$TOOLCHAIN_LIST"

          echo ""
          echo "📋 Toolchain directories to cache:"
          cat "$TOOLCHAIN_LIST"

          {
            echo "TOOLCHAIN_COUNT=${#TOOLCHAIN_PATHS[@]}"
            echo "TOOLCHAIN_ROOT=$KERNEL_PLATFORM"
          } >> "$GITHUB_ENV"

      - name: 📦 Create Toolchain Cache Archive
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNEL_PLATFORM="$REPO_ROOT/kernel_workspace/kernel_platform"

          OUTPUT_DIR="$CACHE_ROOT/toolchain"

          TEMP_ARCHIVE="$OUTPUT_DIR/toolchain-cache.tar.zst.tmp"
          FINAL_ARCHIVE="$OUTPUT_DIR/toolchain-cache.tar.zst"

          rm -f \
            "$TEMP_ARCHIVE" \
            "$FINAL_ARCHIVE"

          mapfile -t TOOLCHAIN_PATHS < \
            "$CACHE_ROOT/toolchain-paths.txt"

          if [[ ${#TOOLCHAIN_PATHS[@]} -eq 0 ]]; then
            echo "::error::No toolchain paths were selected."
            exit 1
          fi

          echo "📦 Creating Clang/build-tools cache..."

          echo ""
          echo "Including:"

          for PATH_ENTRY in "${TOOLCHAIN_PATHS[@]}"; do
            if [[ ! -e "$KERNEL_PLATFORM/$PATH_ENTRY" ]]; then
              echo "::warning::Skipping disappeared path: $PATH_ENTRY"
              continue
            fi

            echo "  • $PATH_ENTRY"
          done

          cd "$KERNEL_PLATFORM"

          EXISTING_PATHS=()

          for PATH_ENTRY in "${TOOLCHAIN_PATHS[@]}"; do
            if [[ -e "$PATH_ENTRY" ]]; then
              EXISTING_PATHS+=("$PATH_ENTRY")
            fi
          done

          if [[ ${#EXISTING_PATHS[@]} -eq 0 ]]; then
            echo "::error::All selected toolchain paths disappeared."
            exit 1
          fi

          tar \
            --use-compress-program="zstd -T0 -19" \
            -cf "$TEMP_ARCHIVE" \
            "${EXISTING_PATHS[@]}"

          mv \
            "$TEMP_ARCHIVE" \
            "$FINAL_ARCHIVE"

          if [[ ! -s "$FINAL_ARCHIVE" ]]; then
            echo "::error::Toolchain cache archive was not created."
            exit 1
          fi

          echo ""
          echo "✅ Toolchain cache created:"
          ls -lh "$FINAL_ARCHIVE"

          echo ""
          echo "📊 Archive contents:"

          tar \
            --use-compress-program="zstd -T0" \
            -tf "$FINAL_ARCHIVE" |
            head -n 100

      - name: 🧾 Generate Toolchain Metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="$CACHE_ROOT/toolchain/toolchain-cache.tar.zst"
          METADATA="$CACHE_ROOT/toolchain/metadata.txt"

          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" |
            awk '{print $1}')

          ARCHIVE_SIZE=$(stat -c '%s' "$ARCHIVE")

          cat > "$METADATA" <<EOF
          Clang & Android Build Tools Cache
          =================================

          Manifest
          --------
          File: $MANIFESTFILE
          Repository: $MANIFESTREPO
          Repository Name: $MANIFESTREPONAME
          Branch: $MANIFESTBRANCH
          SHA256: $MANIFESTSHA256
          Base Name: $MANIFESTBASEFILE

          Kernel
          ------
          CPU: $CPU
          Android: $VANDROID
          Kernel Version: $ASHORTVERSION

          Toolchain
          ---------
          Cached Directories:
          $(sed 's/^/  - /' "$CACHE_ROOT/toolchain-paths.txt")

          Cache
          -----
          Cache Key: $CACHEKEY
          Archive: toolchain-cache.tar.zst
          Archive Size: $ARCHIVE_SIZE bytes
          Archive SHA256: $ARCHIVE_SHA256

          Release
          -------
          Tag: $TOOLCHAIN_RELEASE_TAG
          Asset: $RELEASEASSETNAME.tar.zst

          Generated
          ---------
          Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Repository: $GITHUB_REPOSITORY
          Workflow: $GITHUB_WORKFLOW
          Run ID: $GITHUB_RUN_ID
          SHA: $GITHUB_SHA
          Ref: $GITHUB_REF
          EOF

      - name: 🔐 Generate SHA256 Checksums
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$CACHE_ROOT/toolchain"

          sha256sum \
            toolchain-cache.tar.zst \
            metadata.txt \
            > SHA256SUMS

          echo "Generated checksums:"
          cat SHA256SUMS

      - name: 💾 Save Toolchain Actions Cache
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CACHE_ROOT }}/toolchain
          key: ${{ env.CACHEKEY }}

      - name: 🚀 Upload Toolchain Cache to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_TAG="$TOOLCHAIN_RELEASE_TAG"

          ARCHIVE="$CACHE_ROOT/toolchain/toolchain-cache.tar.zst"
          METADATA="$CACHE_ROOT/toolchain/metadata.txt"
          CHECKSUMS="$CACHE_ROOT/toolchain/SHA256SUMS"

          RELEASE_DIR="$CACHE_ROOT/release"

          mkdir -p "$RELEASE_DIR"

          RELEASE_ARCHIVE="$RELEASE_DIR/${RELEASEASSETNAME}.tar.zst"
          RELEASE_METADATA="$RELEASE_DIR/${RELEASEASSETNAME}-metadata.txt"
          RELEASE_CHECKSUMS="$RELEASE_DIR/${RELEASEASSETNAME}-SHA256SUMS"

          cp "$ARCHIVE" "$RELEASE_ARCHIVE"
          cp "$METADATA" "$RELEASE_METADATA"
          cp "$CHECKSUMS" "$RELEASE_CHECKSUMS"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "✅ Release exists: $RELEASE_TAG"
          else
            echo "🚀 Creating release: $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              --title "🧰 Clang & Android Build Tools Cache" \
              --notes "Automatically generated Clang, Rust, GCC and Android kernel build-tool caches.

          Cache identity is based on:
          - Kernel manifest
          - CPU
          - Manifest branch
          - Manifest SHA256

          The cache contains build tools only.
          The .repo directory and kernel source tree are not included."
          fi

          gh release upload "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_METADATA" \
            "$RELEASE_CHECKSUMS" \
            --clobber

          echo "✅ Toolchain cache uploaded."

      - name: 📤 Upload Toolchain Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLANG-TOOLS-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-${{ env.MANIFESTSHA256 }}
          path: |
            ${{ env.CACHE_ROOT }}/toolchain/toolchain-cache.tar.zst
            ${{ env.CACHE_ROOT }}/toolchain/metadata.txt
            ${{ env.CACHE_ROOT }}/toolchain/SHA256SUMS
            ${{ env.CACHE_ROOT }}/toolchain-paths.txt
            ${{ env.CACHE_ROOT }}/repo-sync.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: 📊 Cache Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🧰 Clang & Android Build Tools Cache"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Manifest | \`${FILE}.xml\` |"
            echo "| Repository | \`${MANIFESTREPO:-Unknown}\` |"
            echo "| Branch | \`${MANIFESTBRANCH:-Unknown}\` |"
            echo "| Manifest SHA256 | \`${MANIFESTSHA256:-Unknown}\` |"
            echo "| CPU | \`${CPU:-Unknown}\` |"
            echo "| Android | \`${VANDROID:-Unknown}\` |"
            echo "| Kernel | \`${ASHORTVERSION:-Unknown}\` |"
            echo "| Toolchain Paths | \`${TOOLCHAIN_COUNT:-Unknown}\` |"
            echo "| Cache Key | \`${CACHEKEY:-Unknown}\` |"
            echo "| Release | \`${TOOLCHAIN_RELEASE_TAG}\` |"
            echo "| Release Asset | \`${RELEASEASSETNAME:-Unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
