name: Dispatch & Fetch Artifacts SM8750 Test

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Stable V9.1.yml
        options:
          - Stable V9.1.yml
          - Main V9.1.yml

      KERNELPATCH:
        type: choice
        description: "Kernel Patches Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Meta (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      GITHUBREPOSITORY:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"
        
      ROOTENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      ROOTBRANCHSOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12 (SUSFSOKI)? / SUSFS-GKI (SUSFSKSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAMALGORITHM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/LZ4KD/8589934592     # 08Gib   

      ZRAMCUSTOMPATCH:
        type: choice
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off"
        required: false
        default: None
        options:
          - None
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0+LZ4KD  
          - LZ4-1.10.0-Patch
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FASTBUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSMBBG:
        type: boolean
        description: "Enable Critical Partition Write Protection (Linux Security Module)?"
        required: true
        default: true

      LXCDOCKERSUPPORT:
        type: choice
        description: "Enable Linux Container? *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Using or Enabling Linux Containers / Docker)"
        required: true
        default: None
        options:
          - DroidspaceLXC
          - TermuxLXC
          - None
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (NetFilter)?"
        required: true
        default: true
        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBR+ECN
        options:
          - BBR+ECN    # Base BBR + ECN Settings, Safe Default
          - BBR+ECN+Brutal     # Apply Brutal as Default + Cubic Fallback
          - None       # Skip BBR + ECN Configuration

        
      UNICODE:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
        
      WINDSPEED:
        type: boolean
        description: "Apply Hmbird / Windspeed / Fengchi (Oryon Platform SM-8750)?"
        required: true
        default: false

      SCHEDULERS:
        type: choice
        description: "Apply CPU or I/O Scheduler? ADIOS = SM-8750* ; SSG = SM-8650* ; BORE = for Testing (Unstable)*"
        required: true
        default: None
        options:
          - ADIOS
          - BORE
          - SSG
          - None
        
      XUS:
        type: boolean
        description: "Prevent the Generation of XUS Error Files?"
        required: true
        default: true
        
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Meta Development Branch?"
        required: true
        default: false

      REKERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Dynamic Owner Custom Manifest)"
        required: true
        default: true
        
      CLEANSPACE:
        type: boolean
        description: "Disable Space Cleaning?"
        required: true
        default: false
        
      BUILDCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update?"
        required: true
        default: false

permissions:
  actions: write
  contents: read

# ===========================
# Device Matrix
# ===========================
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )

          printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]' > devices.json
          echo "devices=$(cat devices.json)" >> $GITHUB_OUTPUT

# ===========================
# Dispatch Builds
# ===========================
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v4
        
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🚀 Trigger Build (CLI)
        run: |
          set -e

          WORKFLOW="${{ github.event.inputs.TARGET_WORKFLOW }}"

          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"

          # Trigger Workflow
          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f DISPATCH_ID="${{ matrix.device }}-${{ github.run_number }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f ZRAMALGORITHM="${{ github.event.inputs.ZRAMALGORITHM }}" \
            -f ZRAMCUSTOMPATCH="${{ github.event.inputs.ZRAMCUSTOMPATCH }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f FASTBUILD="${{ github.event.inputs.FASTBUILD }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LXCDOCKERSUPPORT="${{ github.event.inputs.LXCDOCKERSUPPORT }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f UNICODE="${{ github.event.inputs.UNICODE }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SCHEDULERS="${{ github.event.inputs.SCHEDULERS }}" \
            -f XUS="${{ github.event.inputs.XUS }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f CLEANSPACE="${{ github.event.inputs.CLEANSPACE }}" \
            -f BUILDCCACHE="${{ github.event.inputs.BUILDCCACHE }}"

          echo "⏳ Waiting for Run to Register..."
          sleep 15

          # Fix: Get Correct Run Safely (No Race Garbage)
          RUN_ID=$(gh run list \
            --workflow "$WORKFLOW" \
            --branch LiquidAndrei \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,createdAt,displayTitle \
          | jq -r --arg id "${{ matrix.device }}-${{ github.run_number }}" '
              [ .[]
                | select(.displayTitle != null)
                | select(.displayTitle | contains($id))
              ]
              | sort_by(.createdAt)
              | last
              | .databaseId
          ')
          
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ RUN_ID=$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          
      - name: 🔍 Debug Run ID
        run: |
          echo "RUN_ID=${{ env.RUN_ID }}"
    
      - name: 💾 Save Run ID
        run: |
          mkdir -p meta
          echo "${{ matrix.device }}" > meta/device.txt

          if [[ -z "${RUN_ID:-}" || "$RUN_ID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi

          echo "$RUN_ID" > meta/run_id.txt

      - name: 🧠 Re-Solve Device Name
        id: dev
        run: |
          set -e
      
          DEVICE_NAME=$(case "${{ matrix.device }}" in
            oneplus_13_b) echo "OnePlus13" ;;
            oneplus_13s_b) echo "OnePlus13S" ;;
            oneplus_13t_b) echo "OnePlus13T" ;;
            oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
            oneplus_ace_6) echo "OnePlusAce6" ;;
            oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
            oneplus_pad_3_b) echo "OnePlusPad3" ;;
            *) echo "${{ matrix.device }}" ;;
          esac)
      
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "device_name=$DEVICE_NAME" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ env.DEVICE_NAME }}
          path: meta/

# ===========================
# Merge Run IDs
# ===========================
  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: map
        run: |
          JSON="{}"
          
          for d in meta/*; do
            [[ ! -d "$d" ]] && continue
          
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")
          
            [[ -z "$ID" || "$ID" == "null" ]] && continue
          
            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done
          
          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

# ===========================
# Fetch Artifacts (30 Min Robust)
# ===========================
  fetch:
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}
        
    steps:
      - name: ⚙️ Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🧠 Solve Device Name
        run: |
          set -e
      
          DEVICE_NAME=$(case "${{ matrix.device }}" in
            oneplus_13_b) echo "OnePlus13" ;;
            oneplus_13s_b) echo "OnePlus13S" ;;
            oneplus_13t_b) echo "OnePlus13T" ;;
            oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
            oneplus_ace_6) echo "OnePlusAce6" ;;
            oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
            oneplus_pad_3_b) echo "OnePlusPad3" ;;
            *) echo "${{ matrix.device }}" ;;
          esac)
      
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV

      - name: 🔍 Solve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'

          RUN_ID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')

          [[ -z "$RUN_ID" ]] && exit 1

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: ⏳ Wait for Completion (30 Mins Max)
        run: |
          MAX=90
          SLEEP=20

          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)

            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)

            echo "$i/$MAX → $STATUS | $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep $SLEEP
          done

          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download and Normalize + Zip Artifacts
        run: |
          set -e
      
          DEVICE_DIR="artifacts/${{ matrix.device }}"
          RAW_DIR="$DEVICE_DIR/raw"
          NORM_DIR="$DEVICE_DIR/normalized"
      
          mkdir -p "$RAW_DIR" "$NORM_DIR"
      
          gh run download "$RUN_ID" \
            --dir "$RAW_DIR" \
            --repo "${{ github.repository }}"
      
          echo "📦 Normalizing Artifacts..."
      
          find "$RAW_DIR" -type f | while read -r file; do
            filename=$(basename "$file")
      
            if [[ -f "$NORM_DIR/$filename" ]]; then
              filename="${{ matrix.device }}-$filename"
            fi
      
            cp "$file" "$NORM_DIR/$filename"
          done
      
          echo "🧱 Creating Per-Device Zip..."
      
          map_device() {
            case "${{ matrix.device }}" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "${{ matrix.device }}" ;;
            esac
          }
          
          DEVICE_NAME=$(map_device)
          
          cd "$NORM_DIR"
          
          ZIP_NAME="${DEVICE_NAME}.zip"
          if [ "$(ls -A .)" ]; then
            zip -r "../$ZIP_NAME" .
          else
            echo "No artifacts to zip"
            exit 1
          fi
          cd ..
          
          echo "Created $ZIP_NAME"
      
      - name: 📊 Device Build Summary
        run: |
          map_device() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }

          DEVICE_NAME=$(map_device "${{ matrix.device }}")

          if [[ -d "artifacts/${{ matrix.device }}" ]] && [[ $(ls -A artifacts/${{ matrix.device }}) ]]; then
            STATUS="✔️ Success"
            COUNT=$(ls -1 artifacts/${{ matrix.device }} | wc -l)
          else
            STATUS="❌ Failed"
            COUNT=0
          fi

          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Status | Run | Artifacts |"
            echo "|--------|--------|-----|-----------|"
            echo "| $DEVICE_NAME | $STATUS | $RUN_ID | $COUNT File(s) |"
          } >> $GITHUB_STEP_SUMMARY

      - name: 🧠 Re-Solve Device Name
        id: dev
        run: |
          set -e
      
          DEVICE_NAME=$(case "${{ matrix.device }}" in
            oneplus_13_b) echo "OnePlus13" ;;
            oneplus_13s_b) echo "OnePlus13S" ;;
            oneplus_13t_b) echo "OnePlus13T" ;;
            oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
            oneplus_ace_6) echo "OnePlusAce6" ;;
            oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
            oneplus_pad_3_b) echo "OnePlusPad3" ;;
            *) echo "${{ matrix.device }}" ;;
          esac)
      
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "device_name=$DEVICE_NAME" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ steps.dev.outputs.device_name }}
          path: artifacts/${{ matrix.device }}/*.zip

# ===========================
# Final Bundle
# ===========================
  bundle:
    needs: fetch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize Clean Bundle
        run: |
          set -e
      
          mkdir -p final_bundle
      
          echo "📦 Collecting Device Zips..."
      
          find bundle -type f -name "*.zip" | while read -r zip; do
            echo "Adding: $zip"
            cp "$zip" final_bundle/
          done

      - name: 🧾 Create Final Release Zip
        id: zip
        run: |
          set -e
          ZIP="SM8750-Kernel-Bundle-${GITHUB_RUN_NUMBER}.zip"
      
          zip -r "$ZIP" final_bundle
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: 📤 Upload Final Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SM8750-Kernel-Bundle
          path: ${{ steps.zip.outputs.zip }}
          
