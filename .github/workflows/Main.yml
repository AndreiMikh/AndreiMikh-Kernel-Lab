           # Helper: Print Unicode Codepoints
           printunicode() {
             local LABEL="$1"
             local VALUE="$2"

             echo -n "$LABEL Unicode: "

             python3 <<EOF
          import unicodedata
          value = """$VALUE"""
          output = []
          for c in value:
              code = f"U+{ord(c):04X}"
              if c.isspace() or unicodedata.category(c) == "Cf":
                  output.append(f"\033[31m{code}\033[0m")
              else:
                  output.append(code)
          print(" ".join(output))
          EOF
                echo
              }
              
              # Github Environment Variables (Parsed from Manifest) 
