      - name: 🔧 Swap Disk Space
        shell: bash
        run: |      
          echo "📌 Filesystem Disk Usage:"
          df -h

          echo "📌 Workspace Directory Size:"
          du -sh $GITHUB_WORKSPACE 2>/dev/null || true

          echo "🔎 Top 10 Largest Directories:"
          du -h --max-depth=1 $GITHUB_WORKSPACE 2>/dev/null | sort -hr | head -n 10
      
          echo ""
          echo "🎉 Done!"

      - name: 🔧 Setup Swap File
        shell: bash
        run: |
          set -euo pipefail
                
          SWAPFILE="/swapfile"
          SWAPSIZE="4G"
          
          if swapon --show | grep -q "$SWAPFILE"; then
            echo "ℹ️ Swap Already Active"
            free -h
            exit 0
          fi
          
          echo "📦 Creating Swap ($SWAPSIZE)..."
          
          # Try Fallocate First, Fallback to DD
          if ! sudo fallocate -l "$SWAPSIZE" "$SWAPFILE"; then
            echo "⚠️ Fallocate Failed → Using DD"
            sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096
          fi
          
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          
          echo "🎉 Swap Enabled"
          free -h
          
