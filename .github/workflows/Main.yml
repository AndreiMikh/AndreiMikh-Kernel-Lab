          else
            PFILE="$PDIR/Unicode-Bypass-Fix-6.1+.patch"
            echo "📊 Using Patch: Kernel ≥ 6.1"
          fi
      
          # Validate Patch File
          if [[ ! -f "$PFILE" ]]; then
            echo "⚠️ Patch File Not Found:"
            echo "$PFILE"
            echo "⏭️ Skipping Unicode Bypass Stage"
            exit 0
          fi
      
          echo "📦 Patch File: $(basename "$PFILE")"
      
          # Pre-Check Before Applying
          echo "🔍 Checking Patch Applicability..."
      
          if patch -p1 --dry-run < "$PFILE" >/dev/null 2>&1; then
            echo "🛠️ Applying Unicode Bypass Patch..."
            patch -p1 --forward < "$PFILE"
            echo "✔️ Patch Applied Successfully"
          else
            echo "✔️ Patch Already Applied or Not Required"
          fi
      
          echo ""
          echo "🎉 Unicode Bypass Stage Completed"
                            
      - name: 🔧 Apply Fengchi / Windspeed Scheduler
        if: ${{ github.event.inputs.WINDSPEED == 'true' }}
        env:
          FILE: ${{ github.event.inputs.FILE }}
          CPU: ${{ env.CPU }}
          CPUD: ${{ env.CPUD }}
        run: |
          set -Eeuo pipefail

          # Check for Patch Reject Files
          checkrejects() {
            local SEARCHDIR="${1:-.}"
            local REJFILES         
            REJFILES=$(find "$SEARCHDIR" -name "*.rej" 2>/dev/null)
            [[ -z "$REJFILES" ]] && return 0
          
            while IFS= read -r REJFILE; do
              local ORIGFILE="${REJFILE%.rej}"
              ORIGFILE="${ORIGFILE#./}"          
              local FAILEDHUNKS
              FAILEDHUNKS=$(grep -c '^@@ ' "$REJFILE" 2>/dev/null)          
              echo "⚠️ Patch Reject Detected"
              echo "📝 Reject File  : $REJFILE"
              echo "📄 Target File  : $ORIGFILE"
              echo "⚠️ Failed Hunks : ${FAILEDHUNKS:-0}"
              echo
              cat "$REJFILE"
            done <<< "$REJFILES"
          }
          
          # Handle Patch Errors
          rejecthandler() {
            local EXITCODE=$?          
            trap - ERR          
            echo "⚠️ Patch Application Failed"
            echo "🔍 Scanning for Reject Files..."          
            checkrejects .          
            exit "$EXITCODE"
          }
      
          # Enter Kernel Source Directory
          cd kernel_workspace/kernel_platform/common
      
          # Resolve CPU Branch and Patch Name
          CPU="${CPU:-${CPUD:-}}"
          CFILE="${FILE//_bak/}"
      
          # Check if Fengchi Scheduler Already Exists
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [[ -e "$p" ]] && {
              echo "🎉 Fengchi Scheduler Already Exists"
              echo "⏭️ Skipping Patch..."
              exit 0
            }
          done
      
          # Clone Fengchi Patch Repository
          rm -rf SCHED_PATCH
          echo "📥 Cloning Fengchi Patch Repository..."
      
          git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git -b "$CPU" || {
            echo "⚠️ CPU Branch '$CPU' Does Not Exist"
            echo "⚠️ Fengchi Does Not Support This Device Yet"
            exit 11
          }
      
          # Locate Fengchi Patch
          PFILE="fengchi_${CFILE}.patch"
          PPATH="./SCHED_PATCH/${PFILE}"
      
          [[ -f "$PPATH" ]] || {
            echo "⚠️ Patch '$PFILE' Not Found"
            echo "⚠️ Fengchi Does Not Support This Device Yet"
            exit 12
          }
      
          # Copy and Apply Patch
          echo "🔧 Applying Fengchi Scheduler Patch..."
      
          cp "$PPATH" ./
          dos2unix "$PFILE" 2>/dev/null || true
          patch -p1 --forward -F3 < "$PFILE"
      
          # Cleanup
          rm -f "$PFILE"
          rm -rf SCHED_PATCH

          # Verify Reject Files
          checkrejects .
      
          echo ""
          echo "🚀 Fengchi Patch Applied Successfully"

      - name: 🔧 RTMutex CVE (Kernel 6.1 - 6.6 - 6.12)
