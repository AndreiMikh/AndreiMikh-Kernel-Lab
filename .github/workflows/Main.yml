      - name: 🔧 Install and Configure Cache-ECS
        run: |
          set -euo pipefail

          # Define Paths
          ECSURL="https://github.com/WildKernels/kernel_patches/raw/refs/heads/main/ccache/ccache-x86-64"
          SYSCCACHE="/usr/bin/ccache"  # System Compiler Cache Path

          # Download Cache-ECS Binary, Retry on Failure but Avoid Unnecessary Retry Delays
          echo "📥 Downloading Cache-ECS Binary from $ECSURL..."
          curl -LfsS --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --tcp-fastopen \
               -H "User-Agent: Mozilla/5.0" "$ECSURL" -o ccache

          # Check if the Download was Successful
          if [ ! -f "./ccache" ]; then
            echo "⚠️ Download Failed or File Not Found!"
            exit 1
          fi

          # Check if System Compiler Cache Exists (Do not overwrite)
          if [ -f "$SYSCCACHE" ]; then
            echo "🔄 Found Existing System Compiler Cache at $SYSCCACHE, It will NOT be Overwritten..."
          else
            # Install Cache-ECS
            echo "🔧 Installing Cache-ECS to $SYSCCACHE..."
            sudo cp -f ./ccache "$SYSCCACHE"
            sudo chmod +x "$SYSCCACHE"
            echo "🎯 Cache-ECS Installed as Compiler Cache!"
          fi

          rm -f ./ccache  # Clean up Temporary Binary File

          # Set Environment Variables to Use Cache-ECS
          echo "🎯 Configuring System to Use Cache-ECS as Compiler Cache..."
          export PATH="/usr/bin:$PATH"

          # Verify the Installation and Configuration
          echo "📜 Cache ECS Version: $(/usr/bin/ccache --version)"

          echo ""
          echo "🎉 Cache-ECS Setup Complete"

      - name: 🔧 Release Cache Restoration
        id: cache-restoration
        if: ${{ env.BUILDCCACHE != 'Disabled' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
      
          # Default Output
          # Always Define the Output so Later Workflow
          # Steps can Safely Check the Restoration State
          echo "cache-restored=false" >> "$GITHUB_OUTPUT"
      
          # Variables
          TAG="${{ env.CPU }}"
          FILE="CCache-${{ env.MANIFESTBASEFILE }}-${{ runner.os }}.tar.zst"
          REPO="${{ github.repository }}"
          CACHE_DIR="${{ env.CCACHE_DIR }}"
      
          echo "📦 Release Tag : $TAG"
          echo "📁 Cache File  : $FILE"
          echo "📂 Cache Path  : $CACHE_DIR"
          echo ""
      
          # Prepare Cache Directory
          echo "📂 Preparing Cache Directory..."      
          mkdir -p "$CACHE_DIR"
          chmod -R 775 "$CACHE_DIR"
      
          # Fetch Release Asset Metadata
          echo "📩 Fetching Release Asset Metadata..."      
          ASSETJSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG") || {
              echo "⚠️ Failed to Fetch Release Metadata"
              exit 0
            }      
          ASSETURL=$(echo "$ASSETJSON" | jq -r \
            ".assets[] | select(.name == \"$FILE\") | .url")
      
          # Validate Asset Existence
          if [[ -z "${ASSETURL:-}" || "$ASSETURL" == "null" ]]; then
            echo "⚠️ Cache Asset Not Found"
            echo "➡️ Continuing Without Release Cache"
            exit 0
          fi
      
          echo "🚀 Cache Asset Located"
          echo ""
      
          # Download Cache Archive
          echo "🌐 Downloading Cache Archive..."   
          DLSUCCESS=false     
          for ATTEMPT in 1 2 3; do
            echo "⬇️ Download Attempt: $ATTEMPT"     
            if curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -A "Mozilla/5.0" \
              --retry 3 \
              --retry-delay 3 \
              --connect-timeout 30 \
              "$ASSETURL" \
              -o "$FILE"; then      
              DLSUCCESS=true
              break
            fi      
            echo "⚠️ Download Attempt Failed"
            sleep 2
          done
      
          # Validate Download Result
          if [[ "$DLSUCCESS" != "true" ]]; then
            echo "⚠️ Failed to Download Cache Archive"
            rm -f "$FILE"
            exit 0
          fi
      
          echo ""
          echo "📦 Download Completed"
      
          # Validate File Existence
          if [[ ! -f "$FILE" ]]; then
            echo "⚠️ Downloaded File Does Not Exist"
            exit 0
          fi
      
          if [[ ! -s "$FILE" ]]; then
            echo "⚠️ Downloaded File is Empty"
            rm -f "$FILE"
            exit 0
          fi
      
          # File Information
          echo "📊 Archive Information:"
          ls -lh "$FILE"
      
          # Verify Archive Integrity
          echo "🔍 Testing Archive Integrity..."     
          if ! zstd --long=30 -t "$FILE"; then
            echo "⚠️ Archive Integrity Test Failed"
            echo "🗑️ Removing Corrupted Archive"      
            rm -f "$FILE"
            exit 0
          fi
      
          echo "🚀 Archive Integrity Verified"
      
          # Extract Cache Archive
          echo "📦 Extracting Cache Archive..."      
          if ! tar \
            --use-compress-program="unzstd --long=30" \
            -xf "$FILE" \
            -C "$CACHE_DIR"; then    
            echo "⚠️ Cache Extraction Failed"
            echo "🗑️ Removing Invalid Archive"      
            rm -f "$FILE"
            exit 0
          fi
      
          echo "🚀 Cache Extraction Completed"
      
          # Validate Extracted Cache
          echo "🔎 Validating Extracted Cache..."      
          if [[ -n "$(find "$CACHE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "👾 Cache Restored Successfully"
            echo "cache-restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Cache Directory is Empty After Extraction"
            echo "🗑️ Cleaning Cache Directory"
      
            rm -rf "$CACHE_DIR"
            mkdir -p "$CACHE_DIR"
          fi
      
          # Cleanup Archive
          echo "🧹 Cleaning Temporary Archive..."
          rm -f "$FILE"
      
          echo ""
          echo "🎉 Release Cache Restoration Completed"
    
      - name: 🔧 Local Cache Restoration (Fallback)
        id: ccache-restore
        if: ${{ env.BUILDCCACHE != 'Disabled' && steps.cache-restoration.outputs.cache-restored != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}          
          key: CCache-${{ runner.os }}-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-${{ github.ref_name }}

          # Restore Hierarchy for Partial Cache Reuse
          restore-keys: |
            CCache-${{ runner.os }}-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-${{ github.ref_name }}
            CCache-${{ runner.os }}-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-
            CCache-${{ runner.os }}-${{ env.MANIFESTBASEFILE }}-
            CCache-${{ runner.os }}-
            CCache-
  
      - name: 🔧 Configure and Setup Compiler Cache
        if: ${{ env.BUILDCCACHE != 'Disabled' }}
        shell: bash
        run: |
          set -euo pipefail 

          # Ensure Cache Directory Exists (Global Cache Directory)
          mkdir -p "$CCACHE_DIR"

          # Check if Compiler Cache is Installed
          if ! command -v ccache >/dev/null 2>&1; then
            echo "⚠️ Compiler Cache Not Found 🛠️ Skipping Compiler Cache Setup"
            exit 0
          fi

          echo "🚀 Using Compiler Cache at $CCACHE_DIR..."          
          
          # Set Cache Size 
          ccache -M "${{ env.CCACHE_MAXSIZE }}"

          # Export Environment Configuration
          export CCACHE_COMPILERCHECK="${{ env.CCACHE_COMPILERCHECK }}" || echo "⚠️ Compiler Check Not Found"
          export CCACHE_BASEDIR="${{ env.CCACHE_BASEDIR }}" || echo "⚠️ Base Directory Not Found"
          export CCACHE_NOHASHDIR="${{ env.CCACHE_NOHASHDIR }}" || echo "⚠️ NoHash Directory Not Found"
          export CCACHE_NOHARDLINK="${{ env.CCACHE_NOHARDLINK }}" || echo "⚠️ Cache Hardlink Not Found"    
          
          # Make Compiler Cache Global for System Cache
          export PATH="/usr/lib/ccache:$PATH"
          echo "🎉 Compiler Cache Ready!"

          # Reset Statistics for this Build
          echo "🧾 Resetting Compiler Cache Statistics..."
          ccache -z

          # Show Initial Statistics
          echo ""
          echo "📊 Compiler Cache Statistics (Before Build):"
          ccache -s
           
      - name: 🔧 Cache Key and Status
        if: ${{ env.BUILDCCACHE != 'Disabled' }}
        run: |
          set -euo pipefail
          
          CACHEKEY="CCache-${{ runner.os }}-${{ env.MANIFESTBASEFILE }}-${{ env.CPU }}-${{ github.ref_name }}"
          LOCAL="${{ steps.ccache-restore.outputs.cache-hit }}"
          RELEASE="${{ steps.cache-restoration.outputs.cache-restored }}"
          
          echo "🔑 Cache Key : $CACHEKEY"
          echo ""
      
          echo "🎯 Local Cache Hit   : ${LOCAL:-false}"
          echo "🎯 Release Cache Hit : ${RELEASE:-false}"

          echo "### 🧠 Compiler Cache Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          if [[ "$LOCAL" == 'true' ]]; then
            STATUS="✔️ Exact Cache Match Restored from Local (Fully Matched Cache Key with Identical Build Signature for Maximum Reuse Efficiency)"
            echo "🎉 Exact Cache Hit!"
          elif [[ "$RELEASE" == 'true' ]]; then
            STATUS="✔️ Exact Cache Match Restored from Release (Fully Matched Cache Key with Identical Build Signature for Maximum Reuse Efficiency)"
            echo "🎉 Exact Cache Hit!"
          elif [[ -d "$CCACHE_DIR" && "$(ls -A "$CCACHE_DIR")" ]]; then
            STATUS="♻️ Partial Cache Restored (Fallback Cache Retrieved via Restore Keys — May Result in Lower but Still Effective Cache Hit Rate)"
            echo "♻️ Partial Cache Found via Restore Keys"
          else
            STATUS="⚠️ No Cache Available (Cold Build — All Compilation Requests Will Be Processed Without Any Cached Objects)"
            echo "⚠️ No Cache Found — Cold Build"
          fi
          
          echo ""
          echo "| Cache | $STATUS |" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "📦 Final Cache Status:"
          echo "$STATUS"

      - name: 🔧 Install Repository Tool
        shell: bash
        run: |
          set -euo pipefail

          # Already Installed
          if command -v repo >/dev/null 2>&1; then
            echo "🎉 Repository Tool Already Installed"
            repo --version
            exit 0
          fi

          # Primary Method: Pip
          echo "📦 Attempting Installation via Pip..."
          if python3 -m pip install --upgrade pip && \
             python3 -m pip install git-repo; then
            echo "🎉 Pip Installation Successful"
          else
            echo "⚠️ Pip Installation Failed"
            echo "🔄 Falling Back to Manual Download..."

            BIN="/usr/local/bin/repo"
            GOOGLE="https://storage.googleapis.com/git-repo-downloads/repo"
            GITHUB="https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo"
            download() {
              local URL="$1"
              echo "🌐 Downloading: $URL"
              curl -fL \
                --retry 5 \
                --retry-delay 3 \
                --connect-timeout 15 \
                "$URL" -o repo
            }

            # Google Source
            if download "$GOOGLE"; then
              echo "🎉 Downloaded from Google"
            else
              echo "⚠️ Google Download Failed"
              echo "🔄 Trying GitHub Mirror..."
              download "$GITHUB" || {
                echo "⚠️ Failed to Download Repository Tool"
                exit 1
              }
            fi

            chmod +x repo
            sudo mv repo "$BIN"

            echo "🎉 Fallback Installation Complete"
          fi

          echo ""
          echo "📦 Repository Tool Path:"
          command -v repo

          echo ""
          echo "📜 Repository Version:"
          repo --version

          echo ""
          echo "🎉 Repository Tool Ready"
   
      - name: 🔧 Initialize and Sync Repository
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -euo pipefail

          # Set Timezone (UTC+8 - Asia / Shanghai)
          export TZ=Asia/Shanghai
          timezone() { date '+%Y-%m-%d %H:%M:%S %Z'; }      
          echo "🕒 Start Time: $(timezone)"
          echo ""

          # Git Performance Tweaks
          echo "⚙️ Applying Git Performance Tweaks..."
          git config --global fetch.parallel 16
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global protocol.version 2

          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=0
          export GIT_HTTP_LOW_SPEED_TIME=999999
          export GIT_RETRY_COUNT=5

          # Workspace Setup
          WORKDIR="kernel_workspace"
          cd "$WORKDIR"

          # Manifest Preparation
          MANIFESTBASE="https://github.com/${MANIFESTREPO}/${MANIFESTREPONAME}.git"

          # Repository Initialize
          echo "🚀 Initializing Repository..."
          
          if [[ ! -d ".repo" ]] || \
             [[ ! -f ".repo/manifests/${FILE}.xml" ]]; then        
            echo "🔄 Running Repository Init (Missing or New Manifest)..."
            repo init -u "$MANIFESTBASE" -b "$MANIFESTBRANCH" -m "${FILE}.xml" \
              --depth=1 \
              --no-clone-bundle \
              --no-tags
          else
            echo "⚡ Repository Initialized, Skipping Init"
          fi

          # Fallback Manifest Injection
          echo "📥 Enforcing Fallback Manifest..."
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" \
             ".repo/manifests/${FILE}.xml"

          # Remove 'KS-Kernel.LNX.5.0.R3-Rel' Prebuilts Entries
          echo "🧹 Removing ks-kernel.lnx.5.0.r3-rel manifest entries..."
          sed -i \
            -e '/prebuilts\/asuite"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' \
            -e '/tools\/tradefederation\/prebuilts"/{/ks-kernel\.lnx\.5\.0\.r3-rel/d}' \
            ".repo/manifests/${FILE}.xml"
  
          echo "📃 Repository List:"
          repo list || true

          # Sync Jobs Control      
          echo "📁 Syncing Repository..."          
          SYNCFLAGS="-c --force-sync --no-clone-bundle --no-tags \
          --optimized-fetch --prune --retry-fetches=5 --verbose \
          -j$(nproc)"          
          echo "⚡ Using $(nproc) Parallel Jobs"     
          # Watchdog
          (
            while true; do
              echo "⏳ Sync Alive... $(timezone)"
              sleep 60
            done
          ) &
          WATCHDOGPID=$!      
          timeout 25m repo sync $SYNCFLAGS
          SYNCSTATUS=$?

          # Cleanup Watchdog
          kill "$WATCHDOGPID" >/dev/null 2>&1 || true
          wait "$WATCHDOGPID" 2>/dev/null || true

          # Final Check
          if [[ $SYNCSTATUS -ne 0 ]]; then
            echo "⚠️ Repository Sync Failed"
            exit 1
          fi
      
          echo "⚡ Repository Sync Completed"

          # Inspection
          echo "📂 Inspecting Repository Directory..."
          echo "------------ Root ------------"
          ls -la .repo/ || true          
          echo "---------- Manifest ----------"
          ls -la .repo/manifests* || true          
          echo "------------ Tool ------------"
          ls -la .repo/repo || true          
          echo "📊 Repository Breakdown:"
          du -sh .repo/* 2>/dev/null || true
          echo "📊 Repository Size Summary:"
          du -sh .repo || true
         
          # Kernel Repository Detection
          echo "🔎 Detecting Kernel Repository..."
          KREPOSPATH=$(find . -type f -name "build.config*" \
            -not -path "*/.repo/*" \
            -print -quit)
      
          if [[ -z "$KREPOSPATH" ]]; then
            echo "⚠️ ERROR: No Build Configuration Found"
            exit 1
          fi
      
          echo "📌 Build Configuration Found: $KREPOSPATH"      
          KERNELREPOSITORY=$(dirname "${KREPOSPATH#./}")      
          echo "🔎 Detected Kernel Repository: $KERNELREPOSITORY"      
          echo "KERNELREPOSITORY=$KERNELREPOSITORY" >> $GITHUB_ENV

          # Cleanup ABI Protected Exports
          echo "🧹 Cleaning ABI Protected Exports..."          
          for directory in kernel_platform/common kernel_platform/msm-kernel; do
            [[ -d "$directory" ]] || continue          
            file="$directory/BUILD.bazel"          
            if [[ -f "$file" ]]; then
              grep -q "protected_exports_list" "$file" && \
                sed -i '/protected_exports_list/d' "$file"
            fi          
            rm -f "$directory/android/abi_gki_protected_exports_"* || true
          done

          # Disable Default Config Checks
          echo "🧹 Disabling Defconfig Checks..."

          # Remove all Default Config Checks references from Build Config GKI
          # Prevents CI or Build Failures Caused by Default Config Validation
          find . -type f -name "build.config.gki" \
            -exec grep -q "check_defconfig" {} \; \
            -exec sed -i '/check_defconfig/d' {} \; \
            2>/dev/null || true

          # Patch KLeaf Configuration, Convert Default Config Checks into an Explicit Disabled State
          find . -type f -name "common_kernels.bzl" \
            -exec sed -i \
            's/check_defconfig *= *None,/check_defconfig = "disabled",/g' {} + \
            2>/dev/null || true

          # Disable the KLeaf Conditional Check Entirely
          # Original: if Default Config Checks is None
          # Patched: if Default Config Checks is False
          find . -type f -name "common_kernels.bzl" \
            -exec sed -i \
            's/if check_defconfig == None:/if False:  # Disabled by CI/g' {} + \
            2>/dev/null || true
          
          echo ""
          echo "🎉 Default Config Checks Disabled"    
          echo "🎉 Kernel Repository Pipeline Complete"

      - name: 🔧 Kernel Version Setup
        shell: bash
        run: |
          set -Eeuo pipefail
      
          cd kernel_workspace/kernel_platform
      
          echo "📂 Working Directory: $(pwd)"
      
          # Resolve Kernel Common Directory
          echo "🔍 Locating Kernel Common Directory..."      
          if [[ -f "./common/Makefile" ]]; then
            KCDIR="./common"      
          elif [[ -f "./kernel_platform/common/Makefile" ]]; then
            KCDIR="./kernel_platform/common"     
          else
            echo "⚠️ ERROR: Kernel Common Makefile Not Found"   
            echo "📂 Nearby Makefiles:"
            find . -maxdepth 4 -name Makefile | head -20      
            exit 1
          fi
      
          COMMONMAKEFILE="$KCDIR/Makefile"      
          echo "🚀 Kernel Common Directory Found"
          echo "📌 Using Makefile: $COMMONMAKEFILE"
          echo ""
      
          # Detect Kernel Module Branch
          echo "🔍 Detecting Kernel Module Branch..."      
          KERNELMODULE=""      
          # Try Standard Build Configurations
          for cfg in \
            "$KCDIR/build.config.constants" \
            "$KCDIR/build.config.common"; do      
            if [[ -f "$cfg" ]]; then
              TMPBRANCH=$(grep -m1 '^BRANCH=' "$cfg" | cut -d= -f2 || true)   
              if [[ -n "${TMPBRANCH:-}" ]]; then
                KERNELMODULE="$TMPBRANCH"
                break
              fi
            fi
          done
      
          # Fallback Using ACK SHA
          if [[ -z "${KERNELMODULE:-}" && -n "${KERNELREPOSITORY:-}" \
            && -f "./$KERNELREPOSITORY/android/ACK_SHA" ]]; then      
            KERNELMODULE=$(sed -n '2p' "./$KERNELREPOSITORY/android/ACK_SHA" \
              | awk -F'-' '{print $1"-"$2}')
          fi
      
          # Parse Kernel Module Information
          if [[ -n "${KERNELMODULE:-}" ]]; then      
            ANDROIDVERSION="${KERNELMODULE%-*}"
            KERNELVERSION="${KERNELMODULE#*-}"      
            echo "🚀 Kernel Module Detected"
            echo "📌 Kernel Module   : $KERNELMODULE"
            echo "📌 Android Version : $ANDROIDVERSION"
            echo "📌 Kernel Branch   : $KERNELVERSION"      
          else
            echo "⚠️ Unable to Detect Kernel Module"      
            KERNELMODULE="Unknown"
            ANDROIDVERSION="Unknown"
            KERNELVERSION="Unknown"
          fi
      
          # Read Actual Kernel Version
          echo "🧾 Reading Real Kernel Version..."
      
          VERSION=$(awk '/^VERSION =/ {print $3}' "$COMMONMAKEFILE")
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' "$COMMONMAKEFILE")
          SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' "$COMMONMAKEFILE")      
          OGVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"      
          echo "📌 Original Kernel Version: $OGVERSION"
      
          # Optional Sublevel Override
          SUBLVLINPUT="${{ github.event.inputs.SUBLEVEL }}"    
          if [[ -n "${SUBLVLINPUT:-}" ]]; then      
            echo "🛠️ Updating Kernel Sublevel..."
            echo "📌 New Sublevel: $SUBLVLINPUT"      
            sed -i \
              "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLVLINPUT/" \
              "$COMMONMAKEFILE"      
          else
            echo "📌 No Custom Sublevel Provided"
          fi
      
          # Read Updated Kernel Version
          NEWVERSION=$(awk '
            /^VERSION =/ {v=$3}
            /^PATCHLEVEL =/ {p=$3}
            /^SUBLEVEL =/ {s=$3}
            END {print v "." p "." s}
          ' "$COMMONMAKEFILE")
      
          echo "📊 Final Kernel Version: $NEWVERSION"      
          if [[ "$OGVERSION" != "$NEWVERSION" ]]; then
            echo "⚙️ Kernel Version Modified"
            echo "📌 $OGVERSION → $NEWVERSION"
          else
            echo "✔️ Kernel Version Unchanged"
          fi
      
          # Export Environment Variables
          echo "📤 Exporting Environment Variables..."
      
          {
            echo "KERNELMODULE=$KERNELMODULE"
            echo "ANDROIDVERSION=$ANDROIDVERSION"
            echo "KERNELVERSION=$KERNELVERSION"   
            echo "FULLVERSION=$NEWVERSION"      
            echo "KV1=$(echo "$KERNELVERSION" | cut -d. -f1)"
            echo "KV2=$(echo "$KERNELVERSION" | tr -d '.')"
            echo "KV3=$(echo "$NEWVERSION" | tr -d '.')"      
            echo "KSHORTVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2)"
            echo "KSHORTPATCHVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2 | tr '.' '_')"
          } >> "$GITHUB_ENV"
      
          echo "🚀 Environment Variables Exported"
      
          echo ""
          echo "🎉 Kernel Version Setup Complete"
  
      - name: 🔧 Detect Rust Compiler Requirement
        shell: bash
        run: |
          set -Eeuo pipefail
      
          # Paths
          KDIR="kernel_workspace/kernel_platform"
          FCONFIG="${KDIR}/common/build.config.constants"
          RUSTBIN="${KDIR}/prebuilts/rust/linux-x86/bin/rustc"
      
          # State
          ENABLERUSTC="false"
          VERSIONRUSTC=""
          RAWRUSTC=""
      
          # Validate Kernel Directory
          if [[ ! -d "$KDIR" ]]; then
            echo "⚠️ Kernel Directory Not Found: $KDIR"
            exit 1
          fi
      
          cd "$KDIR"
      
          # Detect RUST from Build Configuration Constants
          if [[ -f "$FCONFIG" ]]; then      
            echo "🔎 Checking Build Configuration Constants..."      
            # Prefer Modern AOSP Key: RUSTC Version
            RAWRUSTC="$(
              awk -F= '/^RUSTC_VERSION=/{print $2}' "$FCONFIG" \
              | tr -d '"' \
              | head -n1
            )"
      
            # Fallback to legacy/custom key: VERSIONRUSTC
            if [[ -z "$RAWRUSTC" ]]; then
              RAWRUSTC="$(
                awk -F= '/^VERSIONRUSTC=/{print $2}' "$FCONFIG" \
                | tr -d '"' \
                | head -n1
              )"
            fi
      
            if [[ -n "$RAWRUSTC" ]]; then      
              echo "📌 RUST Version from Configuration (Raw): $RAWRUSTC"      
              # Extract Path-Safe Version (1.81.0 from 1.81.0-Google)
              VERSIONRUSTC="$(
                echo "$RAWRUSTC" \
                | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+'
              )"
      
              # Fallback if Extraction Fails
              [[ -z "$VERSIONRUSTC" ]] && VERSIONRUSTC="$RAWRUSTC"      
              echo "📁 RUST Version for Paths: $VERSIONRUSTC"      
              ENABLERUSTC="true"      
            else
              echo "⚠️ No RUST Compiler Version Found in Configuration"
            fi      
          else
            echo "⚠️ Missing Build Configuration Constants"
          fi
      
          # Fallback: Toolchain Detection
          if [[ "$ENABLERUSTC" == "false" ]]; then      
            if [[ -x "$RUSTBIN" ]]; then      
              echo "📦 Rust Toolchain Detected (Fallback)"      
              RAWRUSTC="$("$RUSTBIN" --version | awk '{print $2}')"      
              VERSIONRUSTC="$(
                echo "$RAWRUSTC" \
                | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+'
              )"
      
              [[ -z "$VERSIONRUSTC" ]] && VERSIONRUSTC="$RAWRUSTC"      
              echo "🔍 Detected Rustc Version: $RAWRUSTC"
              echo "📁 RUST Version for Paths: $VERSIONRUSTC"      
              ENABLERUSTC="true"      
            else
              echo "⚠️ RUST Toolchain Not Found"
            fi
          fi
      
          # Final Defaults
          if [[ "$ENABLERUSTC" != "true" ]]; then
            VERSIONRUSTC="None"
            RAWRUSTC="None"
          fi
      
          # Export to GitHub Environment
          echo "ENABLERUSTC=$ENABLERUSTC" >> "$GITHUB_ENV"
          echo "VERSIONRUSTC=$VERSIONRUSTC" >> "$GITHUB_ENV"
          echo "RAWRUSTC=$RAWRUSTC" >> "$GITHUB_ENV"
      
          # Final Summary
          echo ""
          echo "------------------------------"
          echo "🦀 RUST Detection Result"
          echo "------------------------------"
          echo "Enabled      : $ENABLERUSTC"
          echo "Raw Version  : $RAWRUSTC"
          echo "Path Version : $VERSIONRUSTC"
          echo "------------------------------"
          
      - name: 🔧 Inject Custom Kernel Version Suffix
        if: ${{ github.event.inputs.SUFFIX != '' }}
        id: inject
        continue-on-error: true
        run: |
          cd kernel_workspace

          # Inputs
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          ANDROIDVERSION="${{ env.ANDROIDVERSION }}"
          FASTBUILD="${{ github.event.inputs.FASTBUILD }}"

          echo "🚀 Injecting Custom Kernel Suffix: $SUFFIX"
          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do
            [ -f "$path" ] || continue
            echo "Processing: $path"

            # Remove Dirty Tags
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "📌 New Set Local Version Format Detected"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${ANDROIDVERSION}-${SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Old Set Local Version Format Detected"
              if [ "$FASTBUILD" = "true" ]; then
                echo "✔️ Fast Build Enabled: Setting Static Res Value"
                sed -i "s/^res=.*/res=\"-${ANDROIDVERSION}-${SUFFIX}\"/" "$path"
              else
                echo "🛠️ Standard Build: Dynamically Injecting Suffix"
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "⚠️ Note: Using Bazel may Limit Special Characters, Adjust Script if Compilation Fails"
                fi
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp"
                mv "$path.tmp" "$path"
              fi

            else
              echo "⚠️ Unknown Format: Appending Suffix Manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi
            chmod +x "$path"
          done

          echo "⚙️ Committing Suffix Modifications..."
          git add -A
          git commit -m "🎉 Inject Custom Kernel Suffix and Remove Dirty Tags"

      - name: 🔧 Fallback - Inject Local Kernel Version Suffix (Bazel Safe)
        if: ${{ steps.inject.conclusion == 'failure' && github.event.inputs.SUFFIX != '' }}
        run: |
          cd kernel_workspace

          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          ANDROIDVERSION="${{ env.ANDROIDVERSION }}"
          FINALSUFFIX="-${ANDROIDVERSION}-${SUFFIX}"
          echo "⚠️ Fallback Triggered → Using Local Version: $FINALSUFFIX"
          echo ""

          # Persist to Next Steps
          echo "LOCALVERSION=$FINALSUFFIX" >> $GITHUB_ENV
          echo "KBUILDVERSION=$FINALSUFFIX" >> $GITHUB_ENV

          # Also for Current Shell
          export LOCALVERSION="$FINALSUFFIX"
          export KBUILDVERSION="$FINALSUFFIX"

          echo ""
          echo "🎉 Local Version is Set to: $LOCALVERSION"

      - name: 🔧 Auto-Generated Kernel Suffix
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace

          # Inputs and Variables
          ANDROIDVERSION="${{ env.ANDROIDVERSION }}"
          FASTBUILD="${{ github.event.inputs.FASTBUILD }}"
          echo "🚀 Generating Random Kernel Suffix..."
          
          # Random Generation
          RANDOMDIGIT=$((RANDOM % 10))
          RANDOMHASH=$(head -c 7 /dev/urandom | xxd -p)
      
          AUTOSUFFIX="${RANDOMDIGIT}-g${RANDOMHASH}"      
          echo "🧾 Suffix: $AUTOSUFFIX"      
          FILES=(
            kernel_platform/common/scripts/setlocalversion
            kernel_platform/msm-kernel/scripts/setlocalversion
            kernel_platform/external/dtc/scripts/setlocalversion
          )
      
          for path in "${FILES[@]}"; do
            [[ -f "$path" ]] || continue
            echo "⚙️ Processing: $path"      
            # Ensure Executable
            chmod +x "$path"      
            # Remove Dirty Markers
            sed -i 's/ -dirty//g' "$path"      
            # Append Suffix Logic in a Safe Way (No Rewriting Core Logic)
            if ! grep -q "Kernel Auto Suffix Injection" "$path"; then
              cat >> "$path" <<EOF              
              # Kernel Auto Suffix Injection
              if [ -n "\$res" ]; then
                case "\$res" in
                  *"-${AUTOSUFFIX}"*) ;;
                  *)
                    res="\$res-${ANDROIDVERSION}-${AUTOSUFFIX}"
                    ;;
                esac
              fi
              EOF
            fi
      
          done      
          echo "⚙️ Committing changes..."    
          git add -A
      
          if git diff --cached --quiet; then
            echo "✔️ No changes to commit"
          else
            git commit -m "🎉 Apply Auto-Generated Kernel Suffix"
          fi

      - name: 🔧 Solve Root Engine Source
        id: manager
        run: |
          ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"

          # Solve KSU Meta Downloader Branch + Artifact
          case "$ROOTBRANCHSOURCE" in
            SukiSU-Ultra-Main)
              MANAGERBRANCH="main"
              BRANCHPATH="builtin"
              MANAGERARTIFACT="manager"
              ;;
            SukiSU-Ultra-Builtin)
              MANAGERBRANCH="main"
              BRANCHPATH="builtin"
              MANAGERARTIFACT="manager"
              ;;
            KernelSU-Next-Dev-SUSFS)
              MANAGERBRANCH="dev-susfs"
              MANAGERARTIFACT="manager"
              ;;
            KernelSU-Next-Dev)
              MANAGERBRANCH="dev"
              MANAGERARTIFACT="manager-spoofed"
              ;;
            KernelSU-Main)
              MANAGERBRANCH="main"
              MANAGERARTIFACT="manager"
              ;;
            ReSukiSU-Main)
              MANAGERBRANCH="main"
              MANAGERARTIFACT="Manager-release"
              ;;
            ReSukiSU-Main-Spoofed)
              MANAGERBRANCH="main"
              MANAGERARTIFACT="Spoofed-Manager-release"
              ;;
          esac

          # Re-Solve Actual Repository (Critical Fix)
          case "$ROOTENGINE" in
            SukiSU-Ultra)
              KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
              ;;
            KernelSU-Next)
              BRANCHPATH="pershoot/KernelSU-Next"
              KSUREPO="KernelSU-Next/KernelSU-Next"
              ;;
            ReSukiSU)
              KSUREPO="ReSukiSU/ReSukiSU"
              ;;
            KernelSU)
              KSUREPO="tiann/KernelSU"
              ;;              
            *)
              echo "⚠️ Unsupported KSU Meta: $ROOTENGINE"
              exit 1
              ;;
          esac

          echo "MANAGERBRANCH=$MANAGERBRANCH" >> "$GITHUB_OUTPUT"
          echo "BRANCHPATH=${BRANCHPATH:-}" >> "$GITHUB_OUTPUT"
          echo "MANAGERARTIFACT=$MANAGERARTIFACT" >> "$GITHUB_OUTPUT"
          echo "KSUREPO=$KSUREPO" >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "✔️ Resolved:"
          echo "📂 Repository  : $KSUREPO"
          echo "📂 Branch      : $MANAGERBRANCH"
          echo "📂 Artifact    : $MANAGERARTIFACT"
          echo "------------------------------"
          echo ""

      - name: 🔧 Configure Root Engine
        run: |
          set -euo pipefail
      
          # Enter Kernel Workspace
          cd kernel_workspace/kernel_platform || exit 1

          # Set Github Inputs and Outputs
          MANAGERBRANCH="${{ steps.manager.outputs.MANAGERBRANCH }}"
          BRANCHPATH="${{ steps.manager.outputs.BRANCHPATH }}"
          KSUREPO="${{ steps.manager.outputs.KSUREPO }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"
          ROOTBRANCH="${{ github.event.inputs.ROOTBRANCHSOURCE }}"
          SUSFS="${{ github.event.inputs.SUSFSREPOSITORY }}"

          # Kernel and Patch Directories
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          DEFCONFIG="${KCDIR}/arch/arm64/configs/gki_defconfig" 
          
          # Helper Functions      
          # Get Commit-Count-Based Version
          gitcommitcountversion() {
            local KSUREPO="$1"
            local MANAGERBRANCH="$2"
            local OFFSET="$3"          
            local LASTPAGE          
            LASTPAGE=$(
              curl -sI \
                "https://api.github.com/repos/${KSUREPO}/commits?sha=${MANAGERBRANCH}&per_page=1" \
              | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p'
            )          
            [[ "$LASTPAGE" =~ ^[0-9]+$ ]] || LASTPAGE=0         
            echo $((LASTPAGE + OFFSET))
          }
      
          # Get Latest Git Tag
          gitlatesttag() {
            local KSUREPO="$1"          
            local TAG
            TAG=$(git ls-remote --tags --sort="v:refname" "https://github.com/${KSUREPO}.git" \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -v '\^{}' \
              | tail -n1)          
            if [[ -z "$TAG" ]]; then
              echo "v0.0.0"
            else
              echo "$TAG"
            fi
          }

          downloadsetup() {
            local urlsource1="$1"
            local urlsource2="${2:-}"
            local setupfile="setup.sh"
            local temporaryfile    
            temporaryfile="$(mktemp)"
            urlfetch() {
              local url="$1"
              echo "🌐 Using Source: $url"          
              for i in {1..5}; do
                echo "📥 Attempt $i/5: $url"          
                if curl -fsSL \
                  --retry 3 \
                  --retry-delay 2 \
                  --connect-timeout 10 \
                  --max-time 60 \
                  "$url" -o "$temporaryfile"; then          
                  # Validation
                  if [[ -s "$temporaryfile" ]] \
                    && head -n1 "$temporaryfile" | grep -q "^#"; then          
                    # Reject HTML
                    if ! grep -qi "<html" "$temporaryfile"; then
                      mv "$temporaryfile" "$setupfile"
                      return 0
                    fi
                  fi
                fi          
                sleep $((i * 2))
              done      
              return 1
            }
          
            if urlfetch "$urlsource1"; then
              echo "📃 Primary Setup Downloaded"
            elif [[ -n "$urlsource2" ]] && urlfetch "$urlsource2"; then
              echo "📃 Fallback Setup Downloaded"
            else
              echo "⚠️ Failed to Download Setup Script from All Sources"
              exit 1
            fi
          
            [[ -s "$setupfile" ]] || { echo "⚠️ Empty Script"; exit 1; }         
            chmod +x "$setupfile"          
            echo "🔧 Executing Setup Script..."
            bash "$setupfile" "$MANAGERBRANCH" "${MANAGERPATH-}"
          }

          downloadfile() {
            local url="$1"
            local output="$2"
            for i in {1..5}; do
              echo "📥 Attempt $i/5: $url"
              if curl -fsSL \
                --retry 3 \
                --retry-delay 2 \
                --connect-timeout 10 \
                --max-time 60 \
                "$url" -o "$output"; then
                [[ -s "$output" ]] && return 0
              fi
              sleep $((i * 2))
            done
            return 1
          }
      
          # SukiSU-Ultra Setup
          if [[ "$ROOTENGINE" == "SukiSU-Ultra"* ]]; then
            echo "🚀 Setting Up SukiSU-Ultra..."      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${BRANCHPATH}/kernel/setup.sh"
            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${BRANCHPATH}/kernel/setup.sh"
              
            cd KernelSU || exit 1
      
            # Fetch KSU API Version (Retry Up to 3 Times)
            for i in {1..3}; do
              RAW=$(curl -fsSL \
                "https://raw.githubusercontent.com/${KSUREPO}/${BRANCHPATH}/kernel/Makefile" \
                2>/dev/null || true)            
              KSU_API_VERSION=$(
                grep -m1 "KSU_VERSION_API" <<< "$RAW" 2>/dev/null \
                | cut -d '=' -f2 \
                | tr -d '[:space:]'
              ) || true          
              # SukiSU-Ultra Builtin Fallback -> Main
              if [[ -z "${KSU_API_VERSION:-}" ]]; then
                echo "⚠️ ${ROOTENGINE} API Version Not Found in '${BRANCHPATH}', Falling Back to '${MANAGERBRANCH}'"          
                RAW=$(curl -fsSL \
                  "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/Makefile" \
                  2>/dev/null || true)            
                KSU_API_VERSION=$(
                  grep -m1 "KSU_VERSION_API" <<< "$RAW" 2>/dev/null \
                  | cut -d '=' -f2 \
                  | tr -d '[:space:]'
                ) || true
              fi           
              echo "Fetched API Version: ${KSU_API_VERSION:-EMPTY}"            
              [[ -n "${KSU_API_VERSION:-}" ]] && break || sleep 1
            done            
            # Final Fallback
            KSU_API_VERSION="${KSU_API_VERSION:-3.1.7}"
            echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV   
            # Define Version Format
            VERSION_DEFINITIONS=$(
              printf '%s\n' \
              'define get_ksu_version_full' \
              'v$1' \
              'endef' \
              '' \
              "KSU_VERSION_API := ${KSU_API_VERSION}" \
              "KSU_VERSION_FULL := v${KSU_API_VERSION}"
            )             
            # Clean Old Definitions
            sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile || true
            sed -i '/KSU_VERSION_API :=/d' kernel/Makefile || true
            sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile || true      
            # Insert New Definitions safely
            awk -v def="$VERSION_DEFINITIONS" '
              /REPO_OWNER :=/ {print; print def; inserted=1; next}
              1
              END {if (!inserted) print def}
            ' kernel/Makefile > kernel/Makefile.tmp || true
            mv kernel/Makefile.tmp kernel/Makefile || true    
            # Generate Custom Version Number (Based on Commit Count) Fallback
            KSUVERSION=$(( $(git rev-list --count main 2>/dev/null || echo 114514) + 37185 ))
            echo "KSUVERSION=$KSUVERSION" >> $GITHUB_ENV      
            # Verify (Non-Fatal)
            echo "Checking Repo Owner Section..."
            grep -A10 "REPO_OWNER" kernel/Makefile || echo "⚠️ ${ROOTENGINE} Repository Owner Not Found"            
            echo "Checking KSU version..."
            grep "KSU_VERSION_FULL" kernel/Makefile || echo "⚠️ ${ROOTENGINE} Version Not Found"        
            echo "SukiSU Version: v${KSU_API_VERSION}"        
            echo "🎉 SukiSU-Ultra Ready"
      
          # ReSukiSU Setup
          elif [[ "$ROOTENGINE" == "ReSukiSU" ]]; then
            echo "🚀 Setting Up ReSukiSU..."    
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd KernelSU || exit 1
      
            # Generate Version
            CURRENTBRANCH=$(git branch --show-current)
            KSUVERSION=$(( $(git rev-list --count "$CURRENTBRANCH") + 30700 ))
            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"
      
            # Clean Old Entry and Add New Format
            sed -i '/CONFIG_KSU_FULL_NAME_FORMAT/d' "$DEFCONFIG"
            printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"     
            echo "🎉 ReSukiSU Setup Complete"
      
          # KernelSU-Next Setup
          elif [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
            echo "🚀 Setting Up KernelSU-Next..."
            # Download and Run Setup Script
            echo "🌐 Using Fork Source Only for KernelSU-Next"
            echo "🌐 URL: https://raw.githubusercontent.com/${BRANCHPATH}/${MANAGERBRANCH}/kernel/setup.sh"            
            downloadsetup \
              "https://raw.githubusercontent.com/${BRANCHPATH}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd KernelSU-Next || exit 1
      
            KSUVERSION=$(gitcommitcountversion "$KSUREPO" "$MANAGERBRANCH" 30000)
            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"      
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSUVERSION/" kernel/Kbuild      
            KSU_GIT_TAG=$(gitlatesttag "$KSUREPO")
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/" kernel/Kbuild

            # Static SELinux Patch
            STATICSELINUX="kernel/feature/selinux_hide.c"            
            # Ensure Target Source File Exists Before Modifying
            if [[ -f "$STATICSELINUX" ]]; then
              echo "🔧 Checking KernelSU-Next SELinux Fix..."            
              # Apply Fix Only If Any Static Declaration Exists
              if grep -qE '^static (int|void) security_(context_to_sid|sid_to_context|compute_av_user)_with_policy\(' "$STATICSELINUX"; then
                perl -0777 -i -pe '
                  s/^static int security_context_to_sid_with_policy\(/int security_context_to_sid_with_policy(/mg;
                  s/^static int security_sid_to_context_with_policy\(/int security_sid_to_context_with_policy(/mg;
                  s/^static void security_compute_av_user_with_policy\(/void security_compute_av_user_with_policy(/mg;
                ' "$STATICSELINUX"            
                echo "✔️ KernelSU-Next SELinux Fix Applied"
              else
                echo "ℹ️ KernelSU-Next SELinux Fix Already Applied"
              fi
            else
              echo "⚠️ ${STATICSELINUX} Not Found, Skipping KernelSU-Next SELinux Fix..."
            fi

            # Report SUSFS Inline Hook Mode
            if [[ "$SUSFS" != "-1" && -f kernel/supercall/dispatch.c ]]; then
              echo "🔧 Setting Hook Mode to Inline..."
              perl -0777 -i -pe '
                s/#ifdef CONFIG_HAVE_SYSCALL_TRACEPOINTS.*?#endif/
                strscpy(cmd.mode, "Inline", sizeof(cmd.mode));
                /s
              ' kernel/supercall/dispatch.c
              echo "✔️ Hook Mode Updated..."
            fi
           
            echo "🎉 KernelSU-Next Setup Complete"
      
          # Official KernelSU Setup
          elif [[ "$ROOTENGINE" == "KernelSU" ]]; then
            echo "🚀 Setting Up KernelSU..."      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd KernelSU || exit 1
      
            KSUVERSION=$(gitcommitcountversion "$KSUREPO" "$MANAGERBRANCH" 30000)
            echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"      
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSUVERSION/" kernel/Kbuild
            sed -i \
              -E "s/^DKSU_VERSION *= *[0-9]+$/DKSU_VERSION=${KSUVERSION}/" \
              kernel/Kbuild
            echo "🎉 KernelSU Setup Complete"
      
          # No Selection
          else
            echo "⚠️ No KSU Meta Root Engine Selected, Skipping..."
          fi
          
          echo "------------------------------"
          echo "🎉 Root Engine Configuration Complete"
          echo "------------------------------"
          echo "📦 Engine     : $ROOTENGINE"
          echo "📦 Branch     : $MANAGERBRANCH"
          echo "📦 Version    : ${KSUVERSION:-Unknown}"
          echo "------------------------------"
          echo ""
          
      - name: 🔧 SUSFS Patches (Auto Official / Fallback)and Kernel Compatibility Patches
        if: ${{ github.event.inputs.SUSFSREPOSITORY != '-1' }}
        env:
          ROOTENGINE: ${{ github.event.inputs.ROOTENGINE }}
          SUSFSREPOSITORY: ${{ github.event.inputs.SUSFSREPOSITORY }}
          SUSFSVARIANT: ${{ github.event.inputs.SUSFSVARIANT }}
          SUSFSBRANCHDEV: ${{ github.event.inputs.SUSFSBRANCHDEV }}
          FILE: ${{ github.event.inputs.FILE }}
          ZRAMPATCH: ${{ github.event.inputs.ZRAMCUSTOMPATCH }}
          ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
          KERNELVERSION: ${{ env.KERNELVERSION }}
          XUS: ${{ env.XUS }}
          KERNELMODULE: ${{ env.KERNELMODULE }}
          KV2: ${{ env.KV2 }}
          KV3: ${{ env.KV3 }}
        run: |
          set -euo pipefail

          # Check for Patch Reject Files
          checkrejects() {
            local SEARCHDIR="${1:-.}"
            local REJFILES         
            REJFILES=$(find "$SEARCHDIR" -name "*.rej" 2>/dev/null)
            [[ -z "$REJFILES" ]] && return 0
          
            while IFS= read -r REJFILE; do
              local ORIGFILE="${REJFILE%.rej}"
              ORIGFILE="${ORIGFILE#./}"          
              local FAILEDHUNKS
              FAILEDHUNKS=$(grep -c '^@@ ' "$REJFILE" 2>/dev/null)          
              echo "⚠️ Patch Reject Detected"
              echo "📝 Reject File  : $REJFILE"
              echo "📄 Target File  : $ORIGFILE"
              echo "⚠️ Failed Hunks : ${FAILEDHUNKS:-0}"
              echo
              cat "$REJFILE"
            done <<< "$REJFILES"
          }
          
          # Handle Patch Errors
          rejecthandler() {
            local EXITCODE=$?          
            trap - ERR          
            echo "⚠️ Patch Application Failed"
            echo "🔍 Scanning for Reject Files..."          
            checkrejects .          
            exit "$EXITCODE"
          }

          # Build derived variables in bash (NOT GitHub expressions)
          GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"

          # Navigate to Kernel Directory
          cd kernel_workspace

          # Clone Required Patch Repositories
          echo "📥 Cloning Patch Dependencies..."                    
          # Main Kernel Lab
          git clone --depth=1 \
            https://github.com/AndreiMikh/AndreiMikh-Kernel-Lab.git
          
          # LZ4 / ZSTD Patch Sources
          case "$ZRAMPATCH" in
            "LZ4-1.10.0-Custom-Patch")
              git clone --depth=1 \
                https://github.com/cctv18/oppo_oplus_realme_sm8750.git
              ;;              
            "LZ4-1.10.0-Patch")
              git clone --depth=1 \
                https://github.com/Xiaomichael/kernel_patches.git
              ;;
            "LZ4-1.10.0-Patch-Update")
              git clone --depth=1 \
                https://github.com/Numbersf/lz4_oplus.git
              ;;
          esac
             
          echo "✔️ Patch Repositories Cloned"
          echo

          # Environment Information
          echo "🧾 Android Version       : $ANDROIDVERSION"
          echo "🧾 Kernel Version        : $KERNELVERSION"
          echo "🔎 Detected Kernel Base  : $GKIVERSION"
          echo
         
          echo "🔎 Detected Kernel Base: $GKIVERSION"      
          # Detect Kernel Common Directory
          if [[ -d "./kernel_platform/common" ]]; then
            KDIR="./kernel_platform/common"
          elif [[ -d "./common" ]]; then
            KDIR="./common"
          else
            echo "⚠️ ERROR: Kernel Common Directory Not Found!"
            exit 1
          fi 

          # Save Absolute Kernel Directory
          KDIR="$(realpath "$KDIR")"
          
          echo "📁 Kernel Directory: $KDIR"
          echo
      
          # Clone SUSFS Meta Repository
          echo "📥 Cloning SUSFS..."      
          BRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"      
          if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
            BRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"        
            if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
              BRANCH="${BRANCH}-dev"
            fi
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b "$BRANCH"      
          else           
            if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
              BRANCH="${BRANCH}-dev"
            fi
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b "$BRANCH"
          fi      
          echo "✔️ SUSFS Branch: $BRANCH"
      
          # Optional SUSFS Revision Checkout
          # - Full commit hashes
          # - Short Commit Hashes          
          cd susfs4ksu || exit 1
          
          # Skip if SUSFS Revision is Empty or Disabled (-1)
          if [[ -n "${SUSFSREPOSITORY:-}" && "${SUSFSREPOSITORY}" != "-1" ]]; then          
            echo "🔎 SUSFS Revision: $SUSFSREPOSITORY"          
            # Numeric Rollback Mode
            if [[ "$SUSFSREPOSITORY" =~ ^[0-9]+$ ]]; then          
              echo "📦 Fetching Additional Git History..."         
              # Deepen Unshallow Clone History
              git fetch --unshallow || git fetch --depth=1000 origin "$BRANCH"
          
              # Checkout Older SUSFS Revision
              git checkout "HEAD~$SUSFSREPOSITORY" || {
                echo "⚠️ Failed Checkout HEAD~$SUSFSREPOSITORY"
                exit 1
              }          
      
            else          
              # SUSFS Commit Hash / Tag / Branch Mode        
              # Detect SUSFS Commit Hash Format
              if [[ "$SUSFSREPOSITORY" =~ ^[0-9a-fA-F]{7,40}$ ]]; then              
                echo "📦 Expanding Shallow Clone History..."              
                # Fetch More History So Short Hashes Become Resolvable
                git fetch --unshallow origin || \
                git fetch --deepen=200 origin "$BRANCH"              
              fi
              
              # Checkout Requested SUSFS Revision
              git checkout "$SUSFSREPOSITORY" || {
                echo "⚠️ Invalid SUSFS Revision"
                exit 1
              }
            fi
          fi
          
          # Print Active Checked Out SUSFS Revision
          echo "✔️ Active SUSFS Commit: $(git rev-parse --short HEAD)" 

          # Detect SUSFS Version
          SUSFSVER="Unknown"         
          SUSFSHEADER="./kernel_patches/include/linux/susfs.h"       
          if [[ -f "$SUSFSHEADER" ]]; then
            SUSFSVER=$(
              awk -F'"' '/SUSFS_VERSION/ {print $2; exit}' "$SUSFSHEADER"
            )      
            SUSFSVER="${SUSFSVER:-Unknown}"
          fi       
          
          echo ""
          echo "📦 SUSFS Version: $SUSFSVER"
          echo "SUSFSVER=$SUSFSVER" >> "$GITHUB_ENV"
          
          cd ..
      
          # Find SUSFS Patches
          echo "🔎 Searching SUSFS Patches..."      
          shopt -s nullglob
          SUSFSPATCHLIST=(./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROIDVERSION}-${KERNELVERSION}*.patch)      
          if [[ ${#SUSFSPATCHLIST[@]} -eq 0 ]]; then
            echo "⚠️ No SUSFS Patch Found"
            ls ./susfs4ksu/kernel_patches/ || true
            exit 1
          fi      
          SUSFSPATCH="${SUSFSPATCHLIST[-1]}"

          # SukiSU ZRAM Patches
          ZRAMSRC="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram"
          # CCTV18 LZ4 1.10.0 and ZSTD 1.5.7 Patches
          CUSTOMPATCH="${GITHUB_WORKSPACE}/kernel_workspace/oppo_oplus_realme_sm8750/zram_patch"
          # Xiao LZ4 1.10.0 and ZSTD 1.5.7 Patches
          XMPATCH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_patches/zram_patches"      
          echo "🧾 SUSFS Patch Directory: $SUSFSPATCH"
          echo "🧾 ZRAM Patch Directory: $ZRAMSRC"
          echo ""
          if [[ "$SUSFSREPOSITORY" != "-1" ]]; then
            echo "📥 Copying SUSFS Patches..."  
            cp "$SUSFSPATCH" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
            cp -r ./susfs4ksu/kernel_patches/fs/* "$KDIR/fs/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
            cp -r ./susfs4ksu/kernel_patches/include/linux/* "$KDIR/include/linux/" 2>/dev/null || \
              echo "⚠️ Failed to Copy SUSFS Patches"
          fi

          if [[ "$ZRAMPATCH" == "LZ4-1.10.0-Custom-Patch" ]]; then
            echo "📥 Copying CCTV18 LZ4 1.10.0 and ZSTD 1.5.7 Patches..."
            cp -r "$CUSTOMPATCH/001-lz4.patch" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy"          
            cp -r "$CUSTOMPATCH/lz4armv8.S" "$KDIR/lib" 2>/dev/null || \
              echo "⚠️ Failed to Copy"        
            cp -r "$CUSTOMPATCH/002-zstd.patch" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy"          
          fi

          if [[ "$ZRAMPATCH" == "LZ4-1.10.0-Patch" ]]; then
            echo "📥 Copying Xiao LZ4 1.10.0 and ZSTD 1.5.7 Patches..."
            cp -r "$XMPATCH/001-lz4.patch" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy"          
            cp -r "$XMPATCH/lz4armv8.S" "$KDIR/lib" 2>/dev/null || \
              echo "⚠️ Failed to Copy"        
            cp -r "$XMPATCH/002-zstd.patch" "$KDIR/" 2>/dev/null || \
              echo "⚠️ Failed to Copy"          
          fi

          # Navigate to Common Directory
          cd "$KDIR"

          # SUSFS Core Patch (50 SUSFS Patch)
          echo "⚙️ Applying SUSFS Core Patch (50 Add SUSFS Patch)"
          if patch -p1 < "$(basename "$SUSFSPATCH")"; then
            echo "✔️ SUSFS 50 Enable Core Patch Applied"
          else
            echo "⚠️ SUSFS Core Patch Already Applied or Failed"
          fi
            
          # SUSFS 69 Enable Hide Patch
          PATCH69URL="https://raw.githubusercontent.com/AndreiMikh/AndreiMikh-Kernel-Lab/refs/heads/${GITHUB_REF_NAME}/patches/69_hide_stuff.patch"
          PATCH69FILE="hide.patch"
          SUPPORTEDOGKI() {
            case "$GKIVERSION" in
              android14-6.1|android15-6.1|android15-6.6) return 0 ;;
              *) return 1 ;;
            esac
          }
          SUPPORTEDENGINE() {
            [[ "$SUSFSVARIANT" == "OGKI" ]] || \
            [[ "$ROOTENGINE" == "ReSukiSU" ]]
          }
          if SUPPORTEDOGKI && SUPPORTEDENGINE; then
            echo "⚙️ Applying SUSFS 69 Enable Hide Patch to $ROOTENGINE..."
            if ! wget -q "$PATCH69URL" -O "$PATCH69FILE"; then
              echo "⚠️ Failed to Download SUSFS 69 Enable Hide Patch"
              exit 1
            fi
            if patch -p1 -N -F 3 < "$PATCH69FILE"; then
              echo "🔧 SUSFS 69 Enable Hide Patch Applied"
            else
              echo "⚠️ SUSFS 69 Enabled Hide Patch Not Applied (Already Applied or Failed)"
            fi
            rm -f "$PATCH69FILE"              
          else
            echo "⚠️ SUSFS 69 Enable Hide Patch Skipped (Unsupported Base)"
          fi

          # SUSFS 10 Enable Patch for KernelSU (Only for KernelSU)
          if [[ "$ROOTENGINE" == "KernelSU" ]]; then
            echo "⚙️ Applying KernelSU SUSFS enable patch"
            if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
              PATCHBRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
            else
              PATCHBRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
            fi
            [[ "${SUSFSBRANCHDEV}" == "true" ]] && PATCHBRANCH="${PATCHBRANCH}-dev"
            case "$SUSFSVARIANT" in
              GKI)
                SUSFS10URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
                ;;
              OGKI)
                SUSFS10URL="https://raw.githubusercontent.com/cctv18/susfs4oki/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
                ;;
              *)
                echo "⚠️ Invalid SUSFS Variant"
                exit 1
                ;;
            esac

            # Verify the Patch URL Exists
            echo "🔍 Checking Patch URL..."
            if ! wget --spider "$SUSFS10URL"; then
              echo "⚠️ ERROR: Patch does Not Exist:"
              echo "$SUSFS10URL"
              exit 1
            fi

            echo "🌐 Downloading Patch: $SUSFS10URL"
            if ! wget "$SUSFS10URL" -O enable.patch; then
              echo "⚠️ ERROR: Failed to Download SUSFS Enable Patch"
              exit 1
            fi
            
            APPLIED=false
            # Save Current Directory
            ORIGDIR="$(pwd)"

            # KernelSU Source Directory
            KSUDIR="$(dirname "$KDIR")/KernelSU"
            echo "📂 Current Directory: $(pwd)"
            echo "🔧 Applying SUSFS Enable Patch..."
            
            if [[ ! -d "$KSUDIR" ]]; then
              echo "⚠️ ERROR: KernelSU Directory Not Found:"
              echo "   $KSUDIR"
              rm -f "$ORIGDIR/enable.patch"
              exit 1
            fi
          
            echo "📂 Entering KernelSU Directory..."
            cd "$KSUDIR" || exit 1
          
            echo "📂 Current Directory: $(pwd)"
            echo "🔧 Applying SUSFS Enable Patch..."
          
            if patch -p1 < "$ORIGDIR/enable.patch"; then
              APPLIED=true
              echo "✔️ SUSFS Enable Patch Applied Successfully"
            else
              echo "⚠️ SUSFS Enable Patch Is Not Compatible with This KernelSU Source Tree"
              echo "ℹ️ Skipping SUSFS Enable Patch"
            fi
          
            echo "📂 Returning to Original Directory..."
            cd "$ORIGDIR" || exit 1
          
            rm -f "$ORIGDIR/enable.patch"
          
            if [[ "$APPLIED" == "true" ]]; then
              echo "✔️ KernelSU SUSFS Enable Patch Completed"
            else
              echo "⚠️ KernelSU SUSFS Enable Patch Skipped"
            fi          
          else
            echo "⚠️ Skipping KernelSU SUSFS Enable Patch (Root = $ROOTENGINE)"
          fi

          # Verify Reject Files
          checkrejects .

          echo ""
          echo "🎉 SUSFS Patches Complete"  

          # TrustyOS Missing Fix (6.6)     
          # Only Run if SUSFS is Enabled
          if [[ "$SUSFSREPOSITORY" != "-1" ]]; then
            # Only Apply for 6.6.x Kernel Series
            if [[ "$KV2" == "66" && "$KV3" -le 6630 ]]; then
              echo "🔧 Checking TrustyOS Requirement for Kernel 6.6.x..."
              TRUSTYEXISTS=false
              # Use Manifest Produced by Extract Manifest Step
              MANIFESTFILE="$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml"
              # Fallback (Sync Case)
              if [[ ! -s "$MANIFESTFILE" ]]; then
                MANIFESTFILE="$GITHUB_WORKSPACE/.repo/manifest.xml"
              fi
              # Detect Trusty Module in Manifest
              if [[ -f "$MANIFESTFILE" ]] && grep -q "common-modules/trusty" "$MANIFESTFILE"; then
                TRUSTYEXISTS=true
              fi
              # Apply Fix Only if Trusty is Missing          
              if [[ "$TRUSTYEXISTS" == "false" ]]; then
                echo "🛠 Applying TrustyOS Compatibility Fix (GKI 6.6)"
                PATCHNAME="$(basename "${SUSFSPATCH:-}")"
                if [[ -f "$PATCHNAME" ]]; then
                 # Patch Adjustments
                  sed -i \
                    's/-32,12 +32,38/-32,11 +32,37/g' \
                    "$PATCHNAME"
                  sed -i \
                    '/#include <trace\/hooks\/fs.h>/d' \
                    "$PATCHNAME"
                  echo "✔ TrustyOS Patch Adjusted"
                else
                  echo "⚠️ SUSFS Patch File Not Found, Skipping Trusty fix"
                fi
              else
                echo "✔ TrustyOS Already Present in Manifest, Skipping Fix"
              fi
            fi
          fi                    
       
          # SUSFS Meta Fake Patch Workaround
          if [[ "$SUSFSREPOSITORY" != "-1" ]]; then          
            # Patches are Applied Dynamically to Fix
            # Mismatches Between SUSFS and Different Kernel Module
            # Kernel Trees During Compilation
            # → Fixes:
            # → Add Missing Headers
            # → Restore Expected Structures
            # → Expand Code Blocks for Patch Matching
            # → Remove Conflicting Includes
            # → Lightweight and Safe for CI Environments   
            fake_patched=0
            fake_patched_dist=0
            fake_patched_swap=0
            fake_patched_ns=0
            fake_patched_expand=0                                      
            # Android 15 / Kernel 6.6 Postfix Compatibility Fixes
            if [ "$KERNELMODULE" = "android15-6.6" ]; then
              # Restore Missing NR Subpages Definition
              # Required by Newer SUSFS Patches
              if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' \
                ./fs/proc/task_mmu.c; then            
                echo "⚠️ Missing NR Subpages Definition Detected"
                echo "🔧 Applying Temporary Task MMU Compatibility Patch"            
                sed -i \
                  -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' \
                  -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' \
                  ./fs/proc/task_mmu.c           
                fake_patched=1
              fi
            
              # Add Missing DMA-BUF Header
              if ! grep -qxF '#include <linux/dma-buf.h>' \
                ./fs/proc/base.c; then            
                echo "⚠️ Missing DMA-BUF Header Detected"
                echo "🔧 Injecting Required Header"            
                sed -i \
                  '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' \
                  ./fs/proc/base.c
              fi

              # Add Missing SUSFS Header
              if [[ -f ./include/linux/susfs_def.h ]]; then              
                # Skip if SUSFS Header has Already been Included
                if ! grep -qF '#include <linux/susfs_def.h>' ./fs/proc/base.c; then              
                  # Verify Expected Insertion Point Exists Before Modifying File
                  if grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                    echo "⚠️ Missing SUSFS Header Detected"
                    echo "🔧 Injecting Required SUSFS Header..."              
                    sed -i '/#include <linux\/dma-buf.h>/a\
              #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\
              #include <linux/susfs_def.h>\
              #endif' ./fs/proc/base.c              
                    echo "☘️ SUSFS Header Successfully Injected"
                  else
                    echo "⚠️ Injection Point (Linux / DMA-BUF Headers) Not Found"
                    echo "⏭️ Skipping SUSFS Header Injection"
                  fi
              
                else
                  echo "☘️ SUSFS Header Already Present"
                fi              
              else
                echo "⚠️ SUSFS Header Not Found"
                echo "⏭️ Skipping SUSFS Header Injection"
              fi

              # VMA Pad Start Compatibility
              if grep -q 'VMA_PAD_START(' ./fs/proc/task_mmu.c && \
                 ! grep -Eq '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' ./fs/proc/task_mmu.c; then          
                echo "⚠️ Missing VMA Pad Start Definition Detected"
                echo "🔧 Adding VMA Pad Start Fallback..."          
                perl -0777 -i -pe '
                  s@((?:^#include .*\\n)+)@$1\\n#ifndef VMA_PAD_START\\n#define VMA_PAD_START(vma) ((vma)->vm_end)\\n#endif\\n\\n@s
                ' ./fs/proc/task_mmu.c
              fi
            
              # Post Fix - Page Size Compat / Local Fold File Map Fixup Entry Compatibility
              TASKMMU="./fs/proc/task_mmu.c"
              PAGECOMPAT="./include/linux/page_size_compat.h"            
              if grep -q '__fold_filemap_fixup_entry(' "$TASKMMU" && \
                 ! grep -Eq 'static[[:space:]]+inline[[:space:]]+void[[:space:]]+__fold_filemap_fixup_entry' "$TASKMMU"; then            
                if [[ -f "$PAGECOMPAT" ]] && \
                   grep -q '__fold_filemap_fixup_entry' "$PAGECOMPAT"; then            
                  # Header Provides Helper Include it if Missing
                  if ! grep -qxF '#include <linux/page_size_compat.h>' "$TASKMMU"; then
                    echo "⚠️ Missing Page Size Compat Headers Include Detected"
                    echo "🔧 Injecting Page Size Compat Headers Include..."          
                    sed -i \
                      '/^#include /a #include <linux/page_size_compat.h>' \
                      "$TASKMMU"
                  fi            
                else            
                  # Header Missing or Does Not Declare Helper
                  echo "⚠️ Page Size Compat Headers Missing or Incomplete"
                  echo "🔧 Adding Local Fold File Map Fixup Entry Stub..."            
                  perl -0777 -i -pe '
                    s@((?:^#include .*\\n)+)@$1\\n#ifndef __fold_filemap_fixup_entry\\nstatic inline void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end) { }\\n#endif /* __fold_filemap_fixup_entry */\\n\\n@s
                  ' "$TASKMMU"
                fi
              fi
            
              # SUSFS Tree Compatibility Fixes
              # GKI / OGKI Tree Compatibility
              if [[ "$SUSFSVARIANT" == "GKI" || \
                    "$SUSFSVARIANT" == "OGKI" ]]; then           
                # Inject Missing ZSwap Header
                if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then            
                  echo "⚠️ Missing ZSwap Header Detected"
                  echo "🔧 Injecting Required Header..."            
                  sed -i \
                    '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' \
                    ./mm/memory.c            
                  fake_patched_swap=1
                fi
            
                # Add Missing Trace / Hooks / FS Header
                if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c && \
                   ! grep -qF 'susfs_def.h' ./fs/namespace.c; then            
                  echo "⚠️ Missing Trace Hooks Header Detected"
                  echo "🔧 Injecting Required Header..."            
                  sed -i \
                    '/#include <trace\/hooks\/blk\.h>/a #include <trace\/hooks\/fs.h>' \
                    ./fs/namespace.c            
                  fake_patched_ns=1
                fi
            
                # Expand Compact OEM if Block
                # Required for SUSFS Patch Matching
                if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && \
                   ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then            
                  echo "⚠️ Compact if Block Detected"
                  echo "🔧 Expanding Block for SUSFS Compatibility..."            
                  perl -0777 -i -pe '
                  s@if\\s*\\(vma->vm_end > last_vma_end\\)\\s*
                  \\s*smap_gather_stats\\(vma,\\s*&mss,\\s*last_vma_end\\);@
                  if (vma->vm_end > last_vma_end) {\\n\\t\\t\\t\\tsmap_gather_stats(vma, \\&mss, last_vma_end);\\n\\t\\t\\t}@
                  gs
                  ' ./fs/proc/task_mmu.c            
                  fake_patched_expand=1
                fi
              fi
            fi                
      
            # Android 14 / Kernel 6.1
            if [[ "$KERNELMODULE" == "android14-6.1" ]]; then          
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "⚠️ Missing VMA Pages Logic Detected"
                echo "🔧 SUSFS Compatibility Workaround Enabled..."
                fake_patched=1
              fi
          
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "⚠️ Missing DMA-BUF Header Detected"
                echo "🔧 Injecting Required Header..."         
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
          
              # Trace / Hooks / Sched Headers Fix (Sublevel < 25)
              if [[ "${SUBLEVEL:-0}" -le 25 ]] && \
                 ! grep -qxF '#include <trace/hooks/sched.h>' ./fs/proc/base.c; then          
                echo "⚠️ Missing Trace / Hooks / Sched Headers Detected"
                echo "🔧 Injecting Trace / Hooks / Sched Headers..."          
                sed -i '/#include <trace\/events\/oom\.h>/a #include <trace\/hooks\/sched.h>' ./fs/proc/base.c
              fi
            fi          
          
            # Android 12 / 5.10 and Android 13 / 5.15
            if [[ "$KERNELMODULE" == *"5.10"* || "$KERNELMODULE" == *"5.15"* ]]; then          
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "⚠️ Missing VMA Pages Logic Detected"
                echo "🔧 SUSFS Compatibility Workaround Enabled..."
                fake_patched=1
              fi
            fi
          
            # Set Nameidata 4-Arg -> 3-Arg Fix for 5.10
            if [[ "$KERNELMODULE" == *"5.10"* ]] && \
               grep -q 'set_nameidata(nd, old_dfd, fake_filename, NULL)' ./fs/namei.c; then          
              echo "⚠️ 5.10 Set Nameidata API Mismatch Detected"
              echo "🔧 Converting 4-Arg Set Nameidata to 3-Arg..."          
              sed -i \
                's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' \
                ./fs/namei.c
            fi
          
            # Android 13 / Kernel 5.15
            if [[ "$KERNELMODULE" == *"5.15"* ]]; then          
              if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c && \
                 ! grep -qxF '#include <linux/susfs_def.h>' ./mm/memory.c; then          
                echo "⚠️ Conflicting Swap Slots Headers Include Detected"
                echo "🔧 Removing Conflicting Include..."          
                sed -i '/#include <linux\/swap_slots\.h>/d' ./mm/memory.c
                fake_patched_dist=1
              fi
            fi
          
            # Android 16 / Kernel 6.12
            if [[ "$KERNELMODULE" == "android16-6.12" ]]; then          
              # Remove DMA-BUF Include for Older 6.12 Baselines
              if [[ "${SUBLEVEL:-0}" -le 27 ]] && \
                 grep -qxF '#include <linux/dma-buf.h>' ./fs/exec.c; then          
                echo "⚠️ Incompatible DMA-BUF Include Detected in FS / Exec"
                echo "🔧 Removing Incompatible Include..."          
                sed -i '/#include <linux\/dma-buf\.h>/d' ./fs/exec.c
              fi
          
              # VMA Data Pages > VMA Pages Rename for Newer 6.12 Baselines
              if [[ "${SUBLEVEL:-0}" -ge 69 ]] && \
                 grep -q 'vma_data_pages' ./fs/proc/task_mmu.c; then          
                echo "⚠️ VMA Data Pages API Mismatch Detected"
                echo "🔧 Replacing VMA Data Pages with VMA Pages..."          
                sed -i 's/vma_data_pages/vma_pages/g' ./fs/proc/task_mmu.c
              fi
            fi
            
            # Revert Temporary Fake Patch
            if [[ "$fake_patched" == 1 ]]; then          
              echo "♻️ Reverting Temporary Fake Patch..."          
              if [[ "$KERNELMODULE" == "android15-6.6" ]]; then          
                if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                  sed -i \
                    -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' \
                    -e '/pagemap_entry_t \*res = NULL;/d' \
                    ./fs/proc/task_mmu.c
                fi
              fi
          
              if [[ "$KERNELMODULE" == "android12-5.10" || \
                    "$KERNELMODULE" == "android13-5.15" || \
                    "$KERNELMODULE" == "android14-6.1" ]]; then          
                if grep -qxF $'\t\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                  sed -i 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
          fi
          
          # Extract Sublevel
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')          
          # Fallback if Empty
          SUBLEVEL="${SUBLEVEL:-0}"          
          # Validate Numeric
          if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Sublevel Detected: $SUBLEVEL — Forcing 0"
            SUBLEVEL=0
          fi
          
          echo "📂 Kernel Base   : $GKIVERSION"
          echo "📂 Sublevel      : $SUBLEVEL"
          echo ""
          
          # 5.15 Legacy Fix
          if [[ "$GKIVERSION" == "android13-5.15" && "$SUBLEVEL" -lt 123 ]]; then          
            LEGACYPATCH="$CURRENTDIR/AndreiMikh-Kernel-Lab/patches/Legacy-5.15-Fix.patch"         
            if [[ ! -f "$LEGACYPATCH" ]]; then
              echo "⚠️ Patch Not Found: $LEGACYPATCH"
              exit 1
            fi          
            echo "🚀 Applying Legacy Fix (Kernel 5.15.0–5.15.123)"          
            # Check if Already Applied
            if patch -R -p1 --dry-run < "$LEGACYPATCH" >/dev/null 2>&1; then
              echo "⚠️ Patch Already Applied — Skipping"
            else
              if patch -p1 < "$LEGACYPATCH"; then
                echo "✔️ Legacy 5.15 Fix Applied"
              else
                echo "⚠️ Patch Failed"
                exit 1
              fi
            fi
          fi
                                       
          # Optional XUS Fix
          if [[ "$XUS" == "Enabled" ]]; then          
            echo "🛠️ Applying XUS Fix Patch"          
            cp "$GITHUB_WORKSPACE/kernel_workspace/AndreiMikh-Kernel-Lab/patches/XUS-Fix.patch" ./
            patch -p1 < XUS-Fix.patch || true          
            echo "✔️ XUS Fix Patch Applied"
          fi

          echo ""
          echo "🎉 Kernel Compatibility Fix Stage Completed"

      - name: 🔧 LZ4 1.10.0 / ZSTD 1.5.7 Setup
        if: ${{ github.event.inputs.ZRAMCUSTOMPATCH != 'None' && github.event.inputs.ZRAMCUSTOMPATCH != '' }}
        shell: bash
        run: |
          set -euo pipefail
      
          # Inputs / Environment Variables      
          # Selected Patch Type
          ZRAMPATCH="${{ github.event.inputs.ZRAMCUSTOMPATCH }}"
      
          # Kernel Version (6.1 / 6.6)
          KERNELVERSION="${{ env.KERNELVERSION }}"
      
          # Directory Paths     
          # Main Kernel Common Directory
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
      
          # CCTV18 / Oplus Patch Source
          CUSTOMPATCH="${GITHUB_WORKSPACE}/kernel_workspace/oppo_oplus_realme_sm8750/zram_patch"
      
          # Xiaomichael Patch Source
          XMPATCH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_patches/zram_patches"
      
          # LZ4 Update Script Repository
          LZ4PATCHUPDATE="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"
      
          echo "------------------------------"
          echo "🚀 LZ4 1.10.0 / ZSTD 1.5.7 Setup"
          echo "📦 Patch Type     : $ZRAMPATCH"
          echo "📁 Kernel Version : $KERNELVERSION"
          echo "------------------------------"
          echo ""
      
          # Validate Kernel Source Directory      
          # Skip Step if Kernel Source does Not Exist
          if [[ ! -d "$KCDIR" ]]; then
            echo "⚠️ Kernel Common Directory Not Found"
            exit 0
          fi
      
          # Move Into Kernel Source Directory
          cd "$KCDIR"
      
          # Used For:
          #   - Syncing Updated LZ4 Sources
          #   - Updating Old Implementations
          #   - Automated Source Refresh      
          if [[ "$ZRAMPATCH" == "LZ4-1.10.0-Patch-Update" ]]; then
            echo "🚀 Running LZ4 Patch Update Script..."     
            # Ensure Updater Script Exists
            if [[ -f "${LZ4PATCHUPDATE}/apply_lz4_oplus.sh" ]]; then      
              # Execute Updater Script
              . "${LZ4PATCHUPDATE}/apply_lz4_oplus.sh"      
              echo "✔️ LZ4 OPlus Shell Script File Completed"      
            else
              echo "⚠️ LZ4 OPlus Shell Script File Not Found"
            fi
          fi
      
          # LZ4 ARMv8 Optimized Source Injection
          # Purpose:
          #   - ARMv8 Optimized LZ4 Acceleration
          #   - Faster Decompression
          #   - Improved ZRAM Performance      
          if [[ "$ZRAMPATCH" == "LZ4-1.10.0-Custom-Patch" && \
                ( "$KERNELVERSION" == "6.1" || "$KERNELVERSION" == "6.6" ) ]]; then      
            echo "📦 Checking LZ4 ARMv8 Sources..."      
            # Target F2FS ARMv8 Directory
            F2FS="fs/f2fs/lz4armv8"    
            # Create Directory if Missing
            mkdir -p "$F2FS"     
            # Check if Files Already Exist
            if [[ -f "$F2FS/lz4accel.c" && \
                  -f "$F2FS/lz4accel.h" && \
                  -f "$F2FS/lz4armv8.S" ]]; then     
              echo "✔️ LZ4 ARMv8 Sources Already Present"      
            else
              echo "⬇️ Injecting Missing ARMv8 Sources..."                
              # Base Download URL
              BASE_URL="https://raw.githubusercontent.com/AndreiMikh/AndreiMikh-Kernel-Lab/refs/heads/${GITHUB_REF_NAME}"     
              # Download
              curl -fL --retry 3 \
                -o "$F2FS/lz4accel.c" \
                "${BASE_URL}/lz4accel.c"      
              # Download
              curl -fL --retry 3 \
                -o "$F2FS/lz4accel.h" \
                "${BASE_URL}/lz4accel.h"     
              # Download ARMv8 Assembly Implementation
              curl -fL --retry 3 \
                -o "$F2FS/lz4armv8.S" \
                "${BASE_URL}/lz4armv8.S"      
              echo "✔️ ARMv8 Sources Ready"
            fi
          fi
      
          # Patch Apply Helper Function
          # Features:
          #   - Validates Patch Existence
          #   - Prevents Duplicate Patching
          #   - Ignores Whitespace Conflicts
          #   - Avoids CI Rerun Failures      
          applypatch() {
            local PATCHFILE="$1"
            local PATCHNAME     
            # Extract Patch Filename
            PATCHNAME="$(basename "$PATCHFILE")"      
            # Ensure Patch Exists
            if [[ ! -f "$PATCHFILE" ]]; then
              echo "⚠️ $PATCHNAME Not Found"
              return
            fi      
            
            echo "⚙️ Applying $PATCHNAME..."
      
            # Validate Patch Before Applying
            if git apply --check -p1 "$PATCHFILE" >/dev/null 2>&1; then     
              # Apply Patch
              git apply --ignore-whitespace -p1 "$PATCHFILE"      
              echo "✔️ $PATCHNAME Applied Successfully"      
            else
              echo "⚠️ $PATCHNAME Already Applied or Conflicts"
            fi
          }
      
          # Patch Application Logic
          # Matrix:
          # Linux Kernel Version 6.1:
          #   - LZ4 Patch
          #   - ZSTD Patch
          # Linux Kernel Version 6.6:
          #   - LZ4 Patch
          #   - Optional ZSTD Patch
          case "${KERNELVERSION}:${ZRAMPATCH}" in      
            # Kernel 6.1 + Xiaomichael Patch
            "6.1:LZ4-1.10.0-Patch")
              applypatch "${XMPATCH}/001-lz4.patch"
              applypatch "${XMPATCH}/002-zstd.patch"
              ;;
            # Kernel 6.1 + CCTV18 Custom Patch
            "6.1:LZ4-1.10.0-Custom-Patch")
              applypatch "${CUSTOMPATCH}/001-lz4.patch"
              applypatch "${CUSTOMPATCH}/002-zstd.patch"
              ;;
            # Kernel 6.6 + Xiaomichael Patch
            "6.6:LZ4-1.10.0-Patch")
              applypatch "${XMPATCH}/001-lz4.patch"
              ;;
            # Kernel 6.6 + CCTV18 Custom Patch
            "6.6:LZ4-1.10.0-Custom-Patch")
              applypatch "${CUSTOMPATCH}/001-lz4.patch"
              applypatch "${CUSTOMPATCH}/002-zstd.patch"
              ;;
            # Patch Update Mode
            "6.1:LZ4-1.10.0-Patch-Update")
              echo "✔️ Patch Update Mode Completed"
              ;;
            "6.6:LZ4-1.10.0-Patch-Update")
              echo "✔️ Patch Update Mode Completed"
              ;;
            # Unsupported Combination
            *)
              echo "⚠️ Unsupported Combination"
              echo "Kernel Version : $KERNELVERSION"
              echo "Patch Type     : $ZRAMPATCH"
              ;;
          esac
      
          echo ""
          echo "🎉 LZ4 / ZSTD Setup Completed"
          echo "📦 Kernel Version : $KERNELVERSION"
          echo "🧩 Patch Type     : $ZRAMPATCH"
    
      - name: 🔧 Scheduler Conversion
        if: ${{ env.KERNELVERSION == '6.6' && github.event.inputs.WINDSPEED == 'false' && !endsWith(github.event.inputs.FILE, 'aosp') }}
        shell: bash
        run: |
          set -euo pipefail

          # Paths
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
      
          echo "------------------------------"
          echo "🚀 Scheduler Conversion Stage"
          echo "📂 Kernel Version: ${KERNELVERSION}"
          echo "------------------------------"
          echo ""
      
          # Validate Kernel Directory
          if [[ ! -d "$KCDIR" ]]; then
            echo "⚠️ Kernel Directory Not Found:"
            echo "$KCDIR"
            exit 1
          fi
      
          cd "$KCDIR"
      
          # Early Skip if Scheduler Already Exists
          if [[ -d "kernel/sched/hmbird" ]] || \
             [[ -d "vendor/oplus/kernel/cpu/sched_ext/hmbird" ]]; then
      
            echo "🔎 Hmbird / Windspeed Scheduler Already Present"
            echo "⏭️ Skipping Conversion Stage"
            exit 0
          fi
      
          # Validate Makefile
          if [[ ! -f "drivers/Makefile" ]]; then
            echo "⚠️ Drivers Makefile Not Found"
            exit 1
          fi
      
          # Idempotent Makefile Injection
          if ! grep -qE "^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o" drivers/Makefile; then
            echo "🛠️ Injecting Hmbird Build Rule"
            echo "obj-y += hmbird_patch.o" >> drivers/Makefile
          else
            echo "✔️ Hmbird Build Rule Already Present"
          fi
      
          # Patch Application
          PFILE="$PDIR/HMBIRD.patch"
      
          if [[ ! -f "$PFILE" ]]; then
            echo "⚠️ Patch File Not Found:"
            echo "$PFILE"
            echo "⏭️ Conversion Skipped"
            exit 0
          fi
      
          echo "🚀 Applying Scheduler Conversion Patch..."

          # Apply Patch
          if patch -p1 --dry-run < "$PFILE" >/dev/null 2>&1; then
            patch -p1 --forward < "$PFILE"
            echo "✔️ Scheduler Conversion Applied Successfully"
          else
            echo "ℹ️ Patch Not Applied (Already Applied or Not Compatible)"
          fi
      
          echo ""
          echo "🎉 Scheduler Conversion Stage Completed"
          
      - name: 🔧 Unicode Bypass
        if: ${{ github.event.inputs.UNICODE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
      
          # Paths
          PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
      
          echo "------------------------------"
          echo "🚀 Unicode Bypass Patch Stage"
          echo "📂 Kernel Major Version: ${KV1:-unknown}"
          echo "------------------------------"
          echo ""
      
          # Validate Kernel Directory
          if [[ ! -d "$KCDIR" ]]; then
            echo "⚠️ Kernel Directory Not Found:"
            echo "$KCDIR"
