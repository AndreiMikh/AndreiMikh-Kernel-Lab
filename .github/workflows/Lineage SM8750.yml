name: ☘️ Lineage SM8750

on:
  workflow_dispatch:
    inputs:
      ksumeta:
        description: 'KernelSU Variant (ReSukiSU = Built-in KSU, None = No KSU)'
        required: true
        type: choice
        default: resukisu
        options:
          - resukisu
          - none
      susfsmeta:
        description: 'SUSFS Mount / Root Hiding (Only Takes Effect When KernelSU is Enabled Above)'
        required: true
        type: boolean
        default: true
      neonlz4:
        description: 'Update Kernel Compression Libraries to LZ4 1.10 + ZSTD 1.5.7 (Arm64 Neon, Better Ratio) - Replaces In-Tree LZ4 / ZSTD'
        required: true
        type: boolean
        default: true
      droidspaces:
        description: 'Droidspaces Container (Standard = + NTSYNC, Extended = More Features)'
        required: true
        type: choice
        default: standard
        options:
          - false
          - standard
          - extend
      basebandguard:
        description: 'Kernel-Level Baseband Guard (Anti-Format)'
        required: true
        type: boolean
        default: true
      netfilter:
        description: 'Netfilter (IPSet / IPTables)'
        required: true
        type: boolean
        default: true
      bbr:
        description: 'BBR TCP Congestion Control'
        required: true
        type: boolean
        default: true
      kpmodule:
        description: 'KPM / KPN Support'
        required: true
        type: boolean
        default: false
      rekernel:
        description: 'ReKernel Support (Freezer/NoActive Binder Hooks)'
        required: true
        type: boolean
        default: true
      ksuffix:
        description: 'Kernel Version Suffix (e.g. Perf; Empty = Real Commit)'
        required: false
        type: string
        default: ''
      attribute:
        description: 'Attribution (Build Tags / KSU Version)'
        required: true
        type: boolean
        default: true
      builduser:
        description: 'Build User'
        required: false
        type: string
        default: AndreiMikh
      buildhost:
        description: 'Build Host'
        required: false
        type: string
        default: AOSP-Builder
      enablerelease:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      artifactmode:
        description: 'Upload Artifacts (AnyKernel3 or All: + Image + Boot Image)'
        required: true
        type: choice
        default: ak3
        options:
          - ak3
          - all
      buildccacheupdate:
        description: 'Update Public CCache (Upload to Release)'
        required: true
        type: boolean
        default: false
      buildccachedebug:
        description: 'Upload CCache Debug Logs'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release Tag (Empty = Auto Date)'
        required: false
        type: string
        default: ''
      kbuildtime:
        description: 'Custom Build Time String (e.g. Sun Dec 01 08:10:00 UTC 2024); Empty = Current UTC Time'
        required: false
        type: string
        default: ''
      debugskipbuild:
        description: 'Debug: Skip Kernel Build, Test Packaging / Upload Only (Creates Dummy Image)'
        required: true
        type: boolean
        default: false
concurrency:
  group: AOSP-Kernel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
      ksuver: ${{ steps.ksuversion.outputs.ksuver }}
      kernelrel: ${{ steps.verify.outputs.kernelrel }}
      kernelver: ${{ steps.verify.outputs.kernelver }}

    env:
      KERNEL_SOURCE_BASE: ${{ vars.KERNELSOURCE || 'https://github.com' }}
      KERNEL_ORG: LineageOS
      KERNEL_REPO: android_kernel_oneplus_sm8750
      KERNEL_BRANCH: lineage-23.2
      KERNEL_MODULES_REPO: android_kernel_oneplus_sm8750-modules
      KERNEL_DT_REPO: android_kernel_oneplus_sm8750-devicetrees
      CLANG_VERSION: r563880c
      CLANG_ARCHIVE: clang-r563880c.tar.gz
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b5f16aee7b8af4c339972027e91e7e793c2e55d9/clang-r563880c.tar.gz
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: gki-android15-6.6
      KSU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      KSU_REF: ''
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      SOURCE_DIR: ${{ github.workspace }}/work/src
      WORK_DIR: ${{ github.workspace }}/work

    steps:
      - name: 📥 Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

 
      - name: 🔎 Resolve Clang Revision
        id: clang-meta
        shell: bash
        run: |
          echo "Clang: ${CLANG_VERSION}"
          echo "Archive: ${CLANG_ARCHIVE}"
          echo "clang_key=aosp-clang-${CLANG_VERSION}-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"

  
      - name: 💾 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clang_key }}

   
      - name: 📥 Download AOSP Clang 21
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading AOSP Clang 21 (R-563880C)..."     
          CLANGURL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b5f16aee7b8af4c339972027e91e7e793c2e55d9/clang-r563880c.tar.gz"
          CLANGARCHIVE="clang-r563880c.tar.gz"      
          rm -f "$CLANGARCHIVE"
          rm -rf clang      
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "$CLANGURL" \
            -o "$CLANGARCHIVE"      
          if [ ! -s "$CLANGARCHIVE" ]; then
            echo "Clang Archive was Not Downloaded"
            exit 1
          fi
      
          echo "Extracting AOSP Clang 21..."      
          mkdir -p clang
          tar -xzf "$CLANGARCHIVE" -C clang    
          rm -f "$CLANGARCHIVE"      
          if [ ! -x "clang/bin/clang" ]; then
            echo "Clang Executable was Not Found After Extraction"
            find clang -maxdepth 3 -type f -name clang -print
            exit 1
          fi
      
          echo "AOSP Clang 21 (R-563880C) Installed Successfully"
          echo "Clang Version:"
          clang/bin/clang --version

   
      - name: 💾 Save AOSP Clang Cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clang_key }}

  
      - name: 📦 Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            zstd \
            patch \
            bc \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            python3 \
            ccache \
            mkbootimg
          echo "🎉 Build Dependencies Installed"

   
      - name: 🔧 Configure Clang Path
        shell: bash
        run: |
          CLANGBIN="$GITHUB_WORKSPACE/clang/bin"
          echo "$CLANGBIN" >> "$GITHUB_PATH"
          export PATH="$CLANGBIN:$PATH"

          echo "🔧 Configuring LLVM Clang..."
          echo "📂 Clang Path: $CLANGBIN"
          if [ ! -x "$CLANGBIN/clang" ]; then
            echo "⚠️ Clang Binary Not Found"
            echo "📂 Expected: $CLANGBIN/clang"
            exit 1
          fi

          echo "🔍 Verifying Clang..."
          clang --version
          echo "🔍 Verifying LLD..."
          ld.lld --version

          mkdir -p /tmp/gki
          printf '%s\n' \
            'def generate_gki_certificate(*args, **kwargs):' \
            '    raise SystemExit("GKI SIGNING NOT SUPPORTED (STUB)")' \
            > /tmp/gki/generate_gki_certificate.py
          echo "PYTHONPATH=/tmp" >> "$GITHUB_ENV"
          echo "📌 GKI Certificate Stub: /tmp/gki/generate_gki_certificate.py"
          echo "📌 PYTHONPATH: /tmp"

          echo "🎉 Clang Configuration Complete"

 
      - name: 🔎 Verify Toolchain
        shell: bash
        run: |
          echo "🔎 Verifying LLVM Toolchain..."
          echo "📌 Clang:"
          clang --version

          echo "📌 LLD:"
          ld.lld --version

          echo "📌 Clang LLD Path:"
          clang -print-prog-name=ld.lld

          echo "🎉 Toolchain Verification Complete"

    
      - name: 🧹 Clean Runner Space
        shell: bash
        run: |
          echo "🧹 Cleaning Unused Runner Components..."
          (setsid sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 &)
          (setsid sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/ghc >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &)
          echo "📊 Runner Storage:"
          df -h

          echo "🎉 Runner Cleanup Started"


      - name: 🔧 Configure CCache
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 8G
        run: |
          if [ -f "$GITHUB_WORKSPACE/lib/ccache-ecs" ]; then
            sudo install -m 0755 \
              "$GITHUB_WORKSPACE/lib/ccache-ecs" \
              /usr/local/bin/ccache
          fi

          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR
          export CCACHE_MAXSIZE
          export CCACHE_IS_KERNEL_COMPILING=true
          export CCACHE_COMPILERCHECK=content
          cat > "$CCACHE_DIR/ccache.conf" <<'EOF'
          max_size = 8G
          compression = true
          compression_level = 5
          compiler_check = content
          sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
          EOF

          echo "🔧 CCache Configuration"
          echo "📂 Cache Directory : $CCACHE_DIR"
          echo "📦 Maximum Size    : $CCACHE_MAXSIZE"
          echo "🗜️ Compression     : Enabled"
          echo "🔍 Compiler Check  : Content"

          ccache --version
          ccache -z


      - name: 💾 Restore GitHub CCache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}
          restore-keys: |
            ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-
            ccache-sm8750-lineage-


      - name: 📦 Pull Public CCache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 8G
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ARCHIVE="ccache-sm8750-lineage.tar.zst"
          if gh release download ccache-sm8750-lineage \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" \
            --clobber; then
            echo "📦 Public CCache found; merging..."
            tar -I zstd -xf "$ARCHIVE" -C "$CCACHE_DIR"
            rm -f "$ARCHIVE"
            ccache -M "$CCACHE_MAXSIZE"
            echo "📊 CCache Status"
            ccache -s
            echo "✔️ Public CCache merged"
          else
            echo "ℹ️ No public CCache release found"
          fi


      - name: 📥 Prepare Kernel Sources
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/work"
          cd "${GITHUB_WORKSPACE}/work"
          SRC_COMMIT="${SRC_COMMIT:-}"
          echo "📥 Preparing Kernel Sources..."
          echo "📂 Working Directory: $(pwd)"
          if [ -n "$SRC_COMMIT" ]; then
            echo "📌 Source Commit: $SRC_COMMIT"
          else
            echo "⚠️ Failed to Get Source Commit"
            echo "📌 Using Plain Source Approach"
          fi

          echo "📥 Downloading Kernel Source..."
          curl -fsSL \
            "${{ vars.KERNELSOURCE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750/archive/refs/heads/lineage-23.2.zip" \
            -o src.zip &
          curl -fsSL \
            "${{ vars.KERNELSOURCE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750-modules/archive/refs/heads/lineage-23.2.zip" \
            -o modules.zip &
          curl -fsSL \
            "${{ vars.KERNELSOURCE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750-devicetrees/archive/refs/heads/lineage-23.2.zip" \
            -o dt.zip &
          wait
          echo "📦 Extracting Kernel Source..."
          unzip -q src.zip
          mv android_kernel_oneplus_sm8750-lineage-23.2 src
          echo "📦 Extracting Kernel Modules..."
          unzip -q modules.zip
          mv android_kernel_oneplus_sm8750-modules-lineage-23.2 sm8750-modules
          echo "📦 Extracting Device Trees..."
          unzip -q dt.zip
          mv android_kernel_oneplus_sm8750-devicetrees-lineage-23.2 sm8750-devicetrees
          rm -f src.zip modules.zip dt.zip
          echo "✔️ Kernel Sources Extracted"

          SRC="${GITHUB_WORKSPACE}/work/src"
          MODULES="${GITHUB_WORKSPACE}/work/sm8750-modules"
          DEVICETREES="${GITHUB_WORKSPACE}/work/sm8750-devicetrees"

          echo "📂 Kernel Source : $SRC"
          echo "📂 Kernel Modules: $MODULES"
          echo "📂 Device Trees  : $DEVICETREES"

          echo "SRC_COMMIT=$SRC_COMMIT" >> "$GITHUB_ENV"
          echo "KERNELSRC=$SRC" >> "$GITHUB_ENV"
          echo "KERNELMODULES=$MODULES" >> "$GITHUB_ENV"
          echo "DEVICETREES=$DEVICETREES" >> "$GITHUB_ENV"

          echo "🔍 Validating Kernel Source..."
          for target in \
            "$SRC/drivers/base/kernelFwUpdate/Kconfig" \
            "$SRC/arch/arm64/boot/dts/vendor"; do
            if [ ! -e "$target" ]; then
              echo "⚠️ Missing Kernel Source Target:"
              echo "📌 $target"
              exit 1
            fi
            echo "✔️ Found: $target"
          done

          echo "🎉 Kernel Sources Prepared Successfully"

    
      - name: 🔎 Detect Kernel Version
        id: kernelversion
        shell: bash
        run: |
          KDIR="${GITHUB_WORKSPACE}/work/src"
          KERNELMAKEFILE="$KDIR/Makefile"
          echo "🔎 Detecting Kernel Version..."
          echo "📂 Kernel Source: $KDIR"
          if [[ ! -d "$KDIR" ]]; then
            echo "⚠️ Kernel Source Directory Not Found"
            echo "📂 Expected: $KDIR"
            exit 1
          fi

          if [[ ! -f "$KERNELMAKEFILE" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📂 Expected: $KERNELMAKEFILE"
            exit 1
          fi

          VERSION=$(awk '
            /^VERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          PATCHLEVEL=$(awk '
            /^PATCHLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          SUBLEVEL=$(awk '
            /^SUBLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          EXTRAVERSION=$(awk '
            /^EXTRAVERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          VERSION="${VERSION:-0}"
          PATCHLEVEL="${PATCHLEVEL:-0}"
          SUBLEVEL="${SUBLEVEL:-0}"
          EXTRAVERSION="${EXTRAVERSION:-}"
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid VERSION: $VERSION"
            exit 1
          fi

          if ! [[ "$PATCHLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid PATCHLEVEL: $PATCHLEVEL"
            exit 1
          fi

          if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid SUBLEVEL: $SUBLEVEL"
            exit 1
          fi

          FULLVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"
          KSHORTVERSION="${VERSION}.${PATCHLEVEL}"
          KSHORTPATCHVERSION="${VERSION}_${PATCHLEVEL}"

          KV1="$VERSION"
          KV2="${VERSION}${PATCHLEVEL}"
          KV3="${VERSION}${PATCHLEVEL}${SUBLEVEL}"

          echo "🚀 Kernel Version Detected"
          echo "📌 VERSION       : $VERSION"
          echo "📌 PATCHLEVEL    : $PATCHLEVEL"
          echo "📌 SUBLEVEL      : $SUBLEVEL"
          echo "📌 EXTRAVERSION  : ${EXTRAVERSION:-None}"
          echo "📌 FULL VERSION  : $FULLVERSION"
          echo "📌 KV1           : $KV1"
          echo "📌 KV2           : $KV2"
          echo "📌 KV3           : $KV3"
          echo "📌 Short Version : $KSHORTVERSION"
          echo "📌 Patch Version : $KSHORTPATCHVERSION"

          {
            echo "KERNEL_VERSION=$VERSION"
            echo "KERNEL_PATCHLEVEL=$PATCHLEVEL"
            echo "KERNEL_SUBLEVEL=$SUBLEVEL"
            echo "KERNEL_EXTRAVERSION=$EXTRAVERSION"
            echo "FULLVERSION=$FULLVERSION"
            echo "KV1=$KV1"
            echo "KV2=$KV2"
            echo "KV3=$KV3"
            echo "KSHORTVERSION=$KSHORTVERSION"
            echo "KSHORTPATCHVERSION=$KSHORTPATCHVERSION"
          } >> "$GITHUB_ENV"

          {
            echo "version=$VERSION"
            echo "patchlevel=$PATCHLEVEL"
            echo "sublevel=$SUBLEVEL"
            echo "extraversion=$EXTRAVERSION"
            echo "fullversion=$FULLVERSION"
            echo "kv1=$KV1"
            echo "kv2=$KV2"
            echo "kv3=$KV3"
            echo "shortversion=$KSHORTVERSION"
            echo "shortpatchversion=$KSHORTPATCHVERSION"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "🎉 Kernel Version Detection Complete"

     
      - name: Apply Compile Fixes
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-Compiler-Fix-AOSP.patch"
        working-directory: work/src


      - name: 📥 Deploy Base Configuration
        run: |
          cd work/src
          echo "📥 Deploying SM8750 Base AOSP Configuration..."
          cp "$GITHUB_WORKSPACE/patches/AOSP/Config-SM8750-AOSP.config" .config

          # Local Version
          if [ -n "${{ inputs.ksuffix }}" ]; then
            ./scripts/config --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-${{ inputs.ksuffix }}"
          else
            ./scripts/config --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-g${SRC_COMMIT:0:12}"
          fi

          ./scripts/config --file .config \
            -d CONFIG_LOCALVERSION_AUTO

          echo "✔️ Base Configuration Deployed"
          grep '^CONFIG_LOCALVERSION=' .config

 
      - name: 🔧 Solve Root Engine Source
        id: manager
        if: ${{ inputs.ksumeta != 'none' }}
        shell: bash
        run: |
          ROOTBRANCHSOURCE="${{ inputs.ksumeta }}"

          MANAGERBRANCH=""
          BRANCHPATH=""
          MANAGERARTIFACT=""
          KSUREPO=""

          # Resolve Root Source
          case "$ROOTBRANCHSOURCE" in
            resukisu)
              MANAGERBRANCH="main"
              MANAGERARTIFACT="Manager-release"
              ;;
            *)
              echo "⚠️ Unsupported Root Source: $ROOTBRANCHSOURCE"
              exit 1
              ;;
          esac

          # Resolve Root Engine Repository
          case "$ROOTBRANCHSOURCE" in
            resukisu)
              KSUREPO="ReSukiSU/ReSukiSU"
              ;;
            *)
              echo "⚠️ Unsupported Root Engine: $ROOTBRANCHSOURCE"
              exit 1
              ;;
          esac

          # Validate Resolution
          [[ -n "$MANAGERBRANCH" ]] || {
            echo "⚠️ Failed to Resolve Manager Branch"
            exit 1
          }

          [[ -n "$KSUREPO" ]] || {
            echo "⚠️ Failed to Resolve Root Engine Repository"
            exit 1
          }

          {
            echo "MANAGERBRANCH=$MANAGERBRANCH"
            echo "BRANCHPATH=$BRANCHPATH"
            echo "MANAGERARTIFACT=$MANAGERARTIFACT"
            echo "KSUREPO=$KSUREPO"
          } >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "✔️ Root Engine Source Resolved"
          echo "📦 Engine     : ReSukiSU"
          echo "📂 Repository : $KSUREPO"
          echo "🌿 Branch     : $MANAGERBRANCH"
          echo "📦 Artifact   : $MANAGERARTIFACT"
          echo "------------------------------"


      - name: 🔧 Configure Root Engine
        id: rootengine
        if: ${{ inputs.ksumeta != 'none' }}
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/work/src"

          MANAGERBRANCH="${{ steps.manager.outputs.MANAGERBRANCH }}"
          KSUREPO="${{ steps.manager.outputs.KSUREPO }}"

          # Helpers
          getcommitcount() {
            git rev-list --count HEAD 2>/dev/null || echo 0
          }

          setupengine() {
            local repo="$1"
            local branch="$2"
            local argument="$3"

            echo "🔗 Setup Repository : $repo"
            echo "🌿 Setup Branch     : $branch"
            echo "📌 Setup Argument   : $argument"

            curl -fsSL \
              "https://raw.githubusercontent.com/${repo}/${branch}/kernel/setup.sh" \
              | bash -s -- "$argument"
          }

          # ReSukiSU
          echo "🚀 Setting Up ReSukiSU..."

          setupengine \
            "$KSUREPO" \
            "$MANAGERBRANCH" \
            "$MANAGERBRANCH"

          cd KernelSU || {
            echo "⚠️ ReSukiSU Directory was Not Created"
            exit 1
          }

          CURRENTBRANCH="$(git branch --show-current || true)"
          CURRENTBRANCH="${CURRENTBRANCH:-HEAD}"

          GITCOMMITHASH="$(git rev-parse --short=8 HEAD)"
          COMMITCOUNT="$(getcommitcount)"

          if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
            KSUVERSION=$((COMMITCOUNT + 30700))
          else
            KSUVERSION=30700
          fi

          echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"
          echo "GITCOMMITHASH=$GITCOMMITHASH" >> "$GITHUB_ENV"

          # Force Simple Tag-Based Full-Name Format
          DEFCONFIG="${GITHUB_WORKSPACE}/work/src/arch/arm64/configs/gki_defconfig"

          if [[ -f "$DEFCONFIG" ]]; then
            sed -i '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG"
            printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"
          fi

          echo "------------------------------"
          echo "🌿 Branch          : $CURRENTBRANCH"
          echo "🔢 KSU Version     : $KSUVERSION"
          echo "🔖 Commit           : $GITCOMMITHASH"
          echo "------------------------------"

          echo "🎉 ReSukiSU Setup Complete"


      - name: 🔢 Compute KSU Version
        id: ksuversion
        if: ${{ inputs.ksumeta != 'none' }}
        shell: bash
        run: |
          COUNT="$(git -C work/src/KernelSU rev-list --count HEAD)"

          if [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            VER=$((COUNT + 30700))
          else
            VER=30700
          fi

          echo "ksuver=$VER" >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "🔢 KSU Version : $VER"
          echo "📊 Commits     : $COUNT"
          echo "------------------------------"

    
      - name: Configure Attribution
        run: |
          if [ "${{ inputs.attribute }}" = "true" ]; then
            echo "builduser=${{ inputs.builduser }}" >> "$GITHUB_ENV"
            echo "buildhost=${{ inputs.buildhost }}" >> "$GITHUB_ENV"
            # KSU Version Attribution
            if [ "${{ inputs.ksumeta }}" != "none" ]; then
              sed -i \
                "s/^REPO_NAME := .*/REPO_NAME := ${{ inputs.builduser }}/" \
                work/src/KernelSU/kernel/Kbuild
            fi
          else
            echo "builduser=" >> "$GITHUB_ENV"
            echo "buildhost=" >> "$GITHUB_ENV"
          fi

  
      - name: 🔧 Integrate SUSFS
        run: |
          SRC="${GITHUB_WORKSPACE}/work/src"
          SUSFSKERNEL="${GITHUB_WORKSPACE}/work/susfs"

          SUSFSREPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFSBRANCH="gki-android15-6.6"
          SUSFS50PATCH="${SUSFSKERNEL}/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"

          echo "🔧 SUSFS Integration"
          echo "📌 SUSFS Repository : ${SUSFSREPO}"
          echo "📌 SUSFS Branch     : ${SUSFSBRANCH}"
          echo "📌 Kernel Source    : ${SRC}"

          if [ ! -d "${SRC}" ]; then
            echo "⚠️ Kernel Source Does Not Exist:"
            echo "${SRC}"
            exit 1
          fi

          echo "📥 Cloning SUSFS..."

          rm -rf "${SUSFSKERNEL}"

          if git clone \
            --depth 1 \
            --branch "${SUSFSBRANCH}" \
            "${SUSFSREPO}" \
            "${SUSFSKERNEL}"; then
            echo "✔️ SUSFS Cloned Successfully"
          else
            echo "⚠️ Failed to Clone SUSFS"
            exit 1
          fi

          SUSFS_COMMIT="$(git -C "${SUSFSKERNEL}" rev-parse HEAD 2>/dev/null || echo unknown)"
          SUSFS_SHORT="$(git -C "${SUSFSKERNEL}" rev-parse --short HEAD 2>/dev/null || echo unknown)"

          echo "📌 SUSFS Commit  : ${SUSFS_SHORT}"
          echo "📌 SUSFS Revision: ${SUSFS_COMMIT}"

          SUSFSDIR="${SUSFSKERNEL}/kernel_patches"
          SUSFSFS="${SUSFSDIR}/fs"
          SUSFSINCLUDE="${SUSFSDIR}/include/linux"

          echo
          echo "🔎 Checking SUSFS Source Layout..."

          if [ ! -d "${SUSFSFS}" ]; then
            echo "⚠️ SUSFS fs Directory Was Not Found:"
            echo "${SUSFSFS}"
            exit 1
          fi

          if [ ! -d "${SUSFSINCLUDE}" ]; then
            echo "⚠️ SUSFS include/linux Directory Was Not Found:"
            echo "${SUSFSINCLUDE}"
            exit 1
          fi

          if [ ! -f "${SUSFS50PATCH}" ]; then
            echo "⚠️ SUSFS 50 Patch Was Not Found:"
            echo "${SUSFS50PATCH}"
            exit 1
          fi

          echo "✔️ SUSFS Source Layout Verified"
          echo "📌 SUSFS fs      : ${SUSFSFS}"
          echo "📌 SUSFS Headers : ${SUSFSINCLUDE}"
          echo "📌 SUSFS Patch   : ${SUSFS50PATCH}"

          echo
          echo "📥 Copying SUSFS Files..."

          mkdir -p "${SRC}/fs"
          mkdir -p "${SRC}/include/linux"

          cp -r "${SUSFSFS}/"* "${SRC}/fs/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS fs Files"

          cp -r "${SUSFSINCLUDE}/"* "${SRC}/include/linux/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS Linux Headers"

          echo "✔️ SUSFS Files Copied"

          echo
          echo "📥 Copying SUSFS 50 Patch..."

          cp "${SUSFS50PATCH}" "${SRC}/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS 50 Patch"

          echo "✔️ SUSFS 50 Patch Copied"

          echo
          echo "🔧 Applying SUSFS 50 Patch..."

          cd "${SRC}"

          if patch \
            -p1 \
            -F3 \
            --batch \
            -f \
            < "${SUSFS50PATCH}"; then
            echo "✔️ SUSFS 50 Patch Applied Successfully"
          else
            echo "⚠️ SUSFS 50 Patch Failed"
            echo
            echo "📌 SUSFS Commit : ${SUSFS_SHORT}"
            echo "📌 Patch        : ${SUSFS50PATCH}"
            exit 1
          fi

          echo
          echo "🎉 SUSFS Integration Complete"
          echo "📌 SUSFS Branch : ${SUSFSBRANCH}"
          echo "📌 SUSFS Commit : ${SUSFS_SHORT}"
          echo "📌 SUSFS Source : ${SUSFSKERNEL}"
          echo "📌 SUSFS Patch  : ${SUSFS50PATCH}"

   
      - name: 🔧 Integrate LZ4 OPlus
        if: inputs.neonlz4
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/work/src"
          LZ4PATCHUPDATE="$GITHUB_WORKSPACE/lz4_oplus"  
          echo "🔧 LZ4 OPlus Integration"      
          cd "$SRC"
      
          # Clone LZ4 OPlus
          echo "📥 Cloning LZ4 OPlus..."
          rm -rf "$LZ4PATCHUPDATE"
          git clone \
            --depth=1 \
            https://github.com/Numbersf/lz4_oplus.git \
            "$LZ4PATCHUPDATE"
          echo "LZ4 OPlus Repository Cloned"
      
          # Run LZ4 OPlus Patch Update
          if [ "${{ inputs.neonlz4 }}" = "true" ]; then
            echo "Running LZ4 Patch Update Script..."
            if [[ -f "$LZ4PATCHUPDATE/apply_lz4_oplus.sh" ]]; then
              . "$LZ4PATCHUPDATE/apply_lz4_oplus.sh"
              echo "LZ4 OPlus Shell Script Completed"
            else
              echo "LZ4 OPlus Shell Script Not Found:"
              echo "$LZ4PATCHUPDATE/apply_lz4_oplus.sh"
              exit 1
            fi
          else
            echo "ZRAM patch selection is not LZ4-1.10.0-Patch-Update"
            echo "Skipping LZ4 OPlus Patch Script"
          fi
      
          echo "LZ4 OPlus Integration Complete"

  
      - name: 🔧 Apply Droidspaces Patch
        if: ${{ inputs.droidspaces != 'false' }}
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-Droidspaces-AOSP.patch"
        working-directory: work/src

   
      - name: 🔧 Integrate Linux Security Module Baseband Guard
        if: ${{ inputs.basebandguard == 'true' }}
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/work/src"
          MAXRETRIES=3   
          if [ ! -d "$SRC" ]; then
            echo "Kernel Source Directory Not Found:"
            echo "$SRC"
            exit 1
          fi
     
          cd "$SRC"     
          
          echo "🔧 Baseband Guard Integration"
          echo "📌 Source: VC-Teahouse/Baseband-guard"
          echo "📌 Kernel: $SRC"

          # Download and Execute VC-Teahouse Setup Script
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"      
          echo "Fetching Baseband Guard Setup Script..."      
          BBG_APPLIED=false     
          for i in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL "$URLBBG" | bash -s -- main; then
              BBG_APPLIED=true
              break
            fi
      
            echo "Baseband Guard Setup Failed"
            echo "Retry $i/$MAXRETRIES..."      
            if [ "$i" -lt "$MAXRETRIES" ]; then
              sleep 2
            fi
          done
      
          if [ "$BBG_APPLIED" != "true" ]; then
            echo "Failed to Apply Baseband Guard"
            exit 1
          fi
      
          echo "Baseband Guard Setup Script Completed"
      
          # Locate Baseband Guard Source
          echo "Locating Baseband Guard Source..."      
          BBGPATHDIR=""     
          if [ -d "$SRC/Baseband-guard" ]; then
            BBGPATHDIR="$SRC/Baseband-guard"
          elif [ -L "$SRC/Baseband-guard" ]; then
            BBGPATHDIR="$(readlink -f "$SRC/Baseband-guard")"
          else
            BBGPATHDIR="$(find "$SRC" -maxdepth 3 \
              -type d \
              -name "Baseband-guard" \
              -print -quit)"
          fi
      
          if [ -z "$BBGPATHDIR" ] || [ ! -d "$BBGPATHDIR" ]; then
            echo "Baseband Guard Directory was Not Found"
            exit 1
          fi
      
          echo "Baseband Guard Directory:"
          echo "$BBGPATHDIR"
      
          # Validate Baseband Guard Source
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "Baseband Guard C was Not Found"      
            echo "Baseband Guard Contents:"
            ls -la "$BBGPATHDIR"      
            exit 1
          fi
      
          echo "Baseband Guard C Detected"
      
          # Ensure Baseband Guard is Included in LSM Defaults
          BBGCONFIGFILE="$SRC/security/Kconfig"      
          if [ ! -f "$BBGCONFIGFILE" ]; then
            echo "Kernel Security Kconfig Not Found:"
            echo "$BBGCONFIGFILE"
            exit 1
          fi
      
          echo "Updating Linux Security Module Configuration..."      
          awk '
            BEGIN { in_block=0 }      
            /^config LSM$/ {
              in_block=1
            }      
            in_block && /^[[:space:]]*default/ {
              if ($0 !~ /baseband_guard/) {
                sub(/selinux/, "selinux,baseband_guard")
              }
            }      
            in_block && /^help$/ {
              in_block=0
            }      
            {
              print
            }
          ' "$BBGCONFIGFILE" > "${BBGCONFIGFILE}.tmp"      
          mv "${BBGCONFIGFILE}.tmp" "$BBGCONFIGFILE"      
          echo "Linux Security Configuration Updated"
      
          # Enable Baseband Guard
          if [ -f "$SRC/.config" ]; then
            echo "⚙️ Enabling CONFIG_BBG..."      
            ./scripts/config \
              --file "$SRC/.config" \
              -e CONFIG_BBG      
            echo "Config BBG Enabled"
          else
            echo "Config Not Present Yet"
            echo "Config BBG will be Resolved During Kernel Configuration"
          fi
      
          # Final Validation
          echo "Validating Baseband Guard Integration..."      
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "Baseband Guard Source Validation Failed"
            exit 1
          fi
      
          if ! grep -q "baseband_guard" "$BBGCONFIGFILE"; then
            echo "Baseband Guard was Not Added to security / Kconfig"
            exit 1
          fi
      
          echo "Baseband Guard Fully Integrated"

      - name: Apply ReKernel Patch
        if: ${{ inputs.rekernel }}
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-ReKernel-AOSP.patch"
        working-directory: work/src
          
      - name: Copy Extra Files
        run: |
          git clone --depth=1 https://github.com/GuLingguang/oneplus-sm8750-kernel-pro-build.git extra-files
          EXTRA="${GITHUB_WORKSPACE}/extra-files/patches/extra"

          # Droidspaces New Files
          if [ "${{ inputs.droidspaces }}" != "false" ]; then
            cp -r "$EXTRA/drivers/misc/ntsync.c" \
                  work/src/drivers/misc/
            cp -r "$EXTRA/include/uapi/linux/ntsync.h" \
                  work/src/include/uapi/linux/
            cp -r "$EXTRA/drivers/gpu/drm/evdi" \
                  work/src/drivers/gpu/drm/
          fi

    
      - name: 🔧 Configure Final Kernel Configuration
        run: |
          cd work/src
          echo "🔧 Configuring Final Kernel Configuration..."          
          # KSU
          if [ "${{ inputs.ksumeta }}" = "none" ]; then
            echo "🚫 KSU Disabled"
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          else
            echo "✔️ KSU Enabled"
            ./scripts/config --file .config \
              -e CONFIG_KSU

            # SUSFS
            if [ "${{ inputs.susfsmeta }}" = "true" ]; then
              echo "✔️ KSU SUSFS Enabled"
              ./scripts/config --file .config \
                -e CONFIG_KSU_SUSFS
            else
              echo "🚫 KSU SUSFS Disabled"
              ./scripts/config --file .config \
                -d CONFIG_KSU_SUSFS
            fi
          fi

          # DroidSpaces
          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            echo "🚫 DroidSpaces Disabled"
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC \
              -d CONFIG_NTSYNC \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # EVDI Only Enabled In Extended Mode
          if [ "${{ inputs.droidspaces }}" != "extend" ]; then
            echo "🚫 EVDI Disabled"
            ./scripts/config --file .config \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # Better Network / Netfilter
          if [ "${{ inputs.netfilter }}" != "true" ]; then
            echo "🚫 Better Network / Netfilter Disabled"
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          else
            echo "✔️ Better Network / Netfilter Enabled"
          fi

          # BBR TCP Congestion Control
          if [ "${{ inputs.bbr }}" = "true" ]; then
            echo "✔️ BBR Enabled"
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          # ReKernel Binder Hooks
          if [ "${{ inputs.rekernel }}" = "true" ]; then
            echo "✔️ ReKernel Enabled"
            ./scripts/config --file .config \
              -e CONFIG_REKERNEL
          fi
          
          echo "🔄 Running Old DefConfig..."          
          export LLVM=1
          export LLVM_IAS=1
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "🔎 Final KSU Configuration"          
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS)=' \
            .config || true

          echo
          echo "🔎 Final DroidSpaces Configuration"          
          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_NTSYNC|CONFIG_DRM_LINDROID_EVDI)=' \
            .config || true

          echo
          echo "🔎 Final Network Configuration"
         
          grep -E \
            '^(CONFIG_IP_SET|CONFIG_BPF_STREAM_PARSER|CONFIG_IP6_NF_NAT|CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR)=' \
            .config || true

          echo
          echo "🔎 Final ReKernel Configuration"          
          grep '^CONFIG_REKERNEL=' .config || true

          echo
          echo "🔎 Final Local Version"        
          grep '^CONFIG_LOCALVERSION=' .config || true

          echo
          echo "🎉 Final Kernel Configuration Complete"
    
      
      - name: Build Kernel
        if: ${{ !inputs.debugskipbuild }}
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="$builduser"
          if [ "${{ inputs.buildccachedebug }}" = "true" ]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          export KBUILD_BUILD_HOST="$buildhost"

          # Custom Build Time
          if [[ -n "${{ inputs.kbuildtime }}" &&
                "${{ inputs.kbuildtime }}" != "N" &&
                "${{ inputs.kbuildtime }}" != "n" ]]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.kbuildtime }}"
            echo "Build Time: ${{ inputs.kbuildtime }}"
          fi

          # Faketime Time-Fixing for Reproducibles Builds
          cd "$GITHUB_WORKSPACE"

          chmod 777 lib/*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          LIBDIR="$GITHUB_WORKSPACE/lib"
          export PRELOAD_LIBS="$LIBDIR/libfakestat.so $LIBDIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper
          cd work/src
          set -o pipefail
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/cc-wrapper" \
            LD="$GITHUB_WORKSPACE/ld-wrapper" \
            HOSTLD=ld.lld \
            KCFLAGS+=-O2 \
            -j$(nproc --all) \
            Image
          echo "CCache Status:"
          ccache -s
          [ -f arch/arm64/boot/Image ] || exit 1


      - name: 🧪 Debug Create Dummy Image
        if: ${{ inputs.debugskipbuild }}
        shell: bash
        run: |
          IMAGE="$GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image"
          mkdir -p "$(dirname "$IMAGE")"
          printf '%s\n' "DEBUG DUMMY IMAGE" > "$IMAGE"

          SIZE=$(stat -c%s "$IMAGE")
          echo "🧪 Debug Mode: Kernel Build Skipped"
          echo "📂 Dummy Image: $IMAGE"
          echo "📦 Image Size : $SIZE Bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "⚠️ Failed to Create Dummy Image"
            exit 1
          fi

          echo "🚀 Dummy Image Created Successfully"
   
    
      - name: 🔎 Verify Kernel Build
        id: kernelverify
        shell: bash
        run: |
          cd work/src
          echo "🔎 Verifying Kernel Build..."
          echo "📌 Expected Kernel Version: $FULLVERSION"
          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "⚠️ Kernel Image Not Found"
            exit 1
          fi

          # Get Real Kernel Release
          REL=$(cat include/config/kernel.release 2>/dev/null || true)

          # Get UTS Version
          VER=$(grep -oE \
            '#[0-9]+ SMP[^"]*' \
            include/generated/utsversion.h 2>/dev/null |
            head -1 || true)

          # Fallback: Read UTS Version From Kernel Image
          if [ -z "$VER" ]; then
            VER=$(strings arch/arm64/boot/Image |
              grep -oE '#[0-9]+ SMP[^"]*' |
              head -1 || true)
          fi

          echo "📌 Kernel Release : ${REL:-Unknown}"
          echo "📌 UTS Version    : ${VER:-Unknown}"

          # Verify Kernel Release
          if [ -n "$REL" ]; then
            case "$REL" in
              "$FULLVERSION"*)
                echo "✔️ Kernel Version Matches: $FULLVERSION"
                ;;
              *)
                echo "⚠️ Kernel Version Mismatch"
                echo "📌 Expected: $FULLVERSION"
                echo "📌 Found   : $REL"
                exit 1
                ;;
            esac
          else
            echo "⚠️ kernel.release Not Found"
          fi

          echo "kernelrel=$REL" >> "$GITHUB_OUTPUT"
          echo "kernelver=$VER" >> "$GITHUB_OUTPUT"

          echo "✔️ Kernel Build Verified"
          ls -lh arch/arm64/boot/Image
   
     
      - name: KPM Patch
        if: ${{ inputs.kpmodule && !inputs.debugskipbuild }}
        run: |
          cd work/src/arch/arm64/boot
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux \
            -p \
            -i ./Image \
            -k ./kpimg-linux \
            -o ./oImage
          rm -f Image
          mv oImage Image
          echo "KPM Patched"

   
      - name: 💾 Save GitHub CCache
        if: ${{ inputs.buildccacheupdate }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}

  
      - name: 📦 Upload Public CCache
        if: ${{ inputs.buildccacheupdate }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        shell: bash
        run: |
          echo "📦 Packaging Public CCache..."

          if [ ! -d "$CCACHE_DIR" ]; then
            echo "⚠️ CCache Directory Not Found"
            echo "📂 Expected: $CCACHE_DIR"
            exit 1
          fi

          echo "📂 CCache Directory: $CCACHE_DIR"

          ccache -s || true

          echo "🗜️ Creating Public CCache Archive..."
          tar -I 'zstd -T0 -5' \
            -cf ccache-sm8750-lineage.tar.zst \
            -C "$CCACHE_DIR" .
          echo "📦 Archive Size: $(du -sh ccache-sm8750-lineage.tar.zst | cut -f1)"
          echo "🚀 Uploading Public CCache..."
          if gh release create \
            "ccache-sm8750-lineage" \
            ccache-sm8750-lineage.tar.zst \
            --notes 'Category: CCache | SM8750-O2-FT — Public CCache for OPlus SM8750 Kernel Builds'; then
            echo "✔️ Public CCache Release Created"
          elif gh release upload \
            "ccache-sm8750-lineage" \
            ccache-sm8750-lineage.tar.zst \
            --clobber; then
            echo "✔️ Public CCache Release Updated"
          else
            echo "⚠️ Failed to Upload Public CCache"
            exit 1
          fi

          rm -f ccache-sm8750-lineage.tar.zst
          echo "🎉 Public CCache Uploaded Successfully"

   
      - name: 🐞 Upload CCache Debug Log
        if: ${{ inputs.buildccachedebug }}
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log
          path: ccache.log
          if-no-files-found: ignore

    
      - name: 📥 Clone AnyKernel3
        shell: bash
        run: |
          echo "📥 Cloning AnyKernel3..."
          git clone \
            --depth=1 \
            --branch master \
            https://github.com/AndreiMikh/AnyKernel3.git \
            ak3
          echo "✔️ AnyKernel3 Cloned"

   
      - name: 📦 Package AnyKernel3
        id: package
        shell: bash
        run: |
          mkdir -p out pack
          IMAGE="$GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE" ]; then
            echo "⚠️ Kernel Image Not Found"
            echo "📂 Expected: $IMAGE"
            exit 1
          fi

          echo "📥 Preparing AnyKernel3 Package..."
          cp -a ak3/. pack/
          cp "$IMAGE" pack/Image

          SIZE=$(stat -c%s "$IMAGE")
          echo "📌 Kernel Image Size: $SIZE bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "⚠️ Kernel Image Is Empty"
            exit 1
          fi

          echo "✔️ Kernel Image Verified"
          if [ "${{ inputs.attribute }}" = "true" ]; then
            sed -i \
              "s#kernel.string=.*#kernel.string=AOSP Kernel | Build by ${{ inputs.builduser }}#" \
              pack/anykernel.sh
          else
            sed -i \
              "s#kernel.string=.*#kernel.string=LineageOS SM8750 Kernel#" \
              pack/anykernel.sh
          fi

          STAMP="$(date +%Y%m%d)"
          KSUVER="${{ steps.ksuversion.outputs.ksuver }}"
          ZIP="Kernel(${FULLVERSION})-SM8750-LineageOS-ReSukiSU(${KSUVER})-BuildDate(${STAMP}).zip"
          echo "📦 Creating AnyKernel3 ZIP..."
          echo "📌 Package: $ZIP"
          cd pack
          zip -r9 \
            "../out/$ZIP" \
            . \
            -x "*.git*" \
            >/dev/null

          cd ..
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          echo "✔️ AnyKernel3 Package Created"
          ls -lh "out/$ZIP"
          if [ "${{ inputs.artifactmode }}" = "all" ]; then
            echo "📦 Generating Raw Kernel Image..."
            cp "$IMAGE" out/Image
            echo "📦 Generating Boot Image..."
            mkbootimg \
              --kernel "$IMAGE" \
              --header_version 4 \
              --os_version 16.0.0 \
              --os_patch_level 2026-07 \
              --pagesize 4096 \
              --base 0x80000000 \
              -o out/boot.img
            echo "🚀 All Mode: Image + Boot Image Generated"
            echo "📌 Generated Files:"
            ls -lh \
              out/Image \
              out/boot.img
          fi

   
      - name: 📤 Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: out/*
          retention-days: 30
          if-no-files-found: error
