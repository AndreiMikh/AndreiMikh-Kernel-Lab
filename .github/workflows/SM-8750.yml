name: SM-8750

on:
  workflow_dispatch:
    inputs:

      TARGET_WORKFLOW:
        type: choice
        description: "Select Workflow to Trigger"
        required: true
        default: Main V2.yml
        options:
          - Main V2.yml

      KPM:
        type: choice
        description: "Kernel Patch Implementation Methods"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
          
      SUSFS_META:
        type: string
        description: "Rollback SUSFS (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
        
      DYNAMIC_REPO:
        type: string
        description: "Dynamic Inventory Warehouse Owner"
        required: true
        default: "AndreiMikh"
        
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Sat Feb 14 07:17:27 UTC 2026"
        
      KSU_META:
        type: choice
        description: "KSU Meta"
        required: true
        default: "ReSukiSU"
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU
         
      MANAGER_SOURCE:
        type: choice
        description: "KSU Meta Branch (Download Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Main-Spoofed
         - KernelSU-Next-Stable
         - KernelSU-Next-Stable-Spoofed
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-Spoofed
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main
         
      SUSFS_VERSION:
        type: choice
        description: "SUSFS for OGKI, Only Available for Versions: A14-6.1, A15-6.6 & A16-6.12 (SUSFS4OKI)? / SUSFS for GKI (SUSFS4KSU)?"
        required: true
        default: OGKI
        options:
          - OGKI
          - GKI
      
      ZRAM:
        type: choice
        description: "ZRAM (0 for Off, 1 for On)/Algorithm Name/Size"
        required: true
        default: "0"
        options:
          - 0                      # Off
          - 1/lz4kd/8589934592     # 08Gi    
          - 1/lz4kd/12884901888    # 12Gi 
          - 1/lz4kd/17179869184    # 16Gi 
          - 1/lz4kd/25769803776    # 24Gi 

      ZRAM-LZ4:
        type: boolean
        description: "Enable LZ4 1.10.0 / ZSTD 1.5.7? Only if ZRAM LZ4KD is Off (Applicable for Custom Manifest)"
        required: false
        default: false
        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "8-andreimikhail-4k"
        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
        
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Kernel Build?"
        required: true
        default: true
        
      LSM:
        type: boolean
        description: "Enable Critical Partition Write Protection (BBG)?"
        required: true
        default: true
        
      NETFILTER:
        type: boolean
        description: "Enable Network Feature Extensions (Netfilter)?"
        required: true
        default: true
        
      BBR_ECN:
        type: boolean
        description: "Enable Network Optimization Algorithm (BBR+ECN)?"
        required: true
        default: true
        
      UNICODE_BYPASS:
        type: boolean
        description: "Add Fix for Unicode Invisible Code Point Bypass Read Vulnerability?"
        required: true
        default: true
        
      SCHED:
        type: boolean
        description: "Apply HMBIRD (SM-8750)?"
        required: true
        default: true

      ADIOS:
        type: boolean
        description: "Apply ADIOS I/O Scheduler (Applicable for Custom Manifest)"
        required: true
        default: false
        
      XUS_FIX:
        type: boolean
        description: "Prevent Generation of XUS Error Files?"
        required: true
        default: true
        
      SUSFS_DEV:
        type: boolean
        description: "Extract & Apply SUSFS-Dev Branch?"
        required: true
        default: false

      RE_KERNEL:
        type: boolean
        description: "Apply ReKernel? (Applicable for Custom Manifest)"
        required: true
        default: false

      DOCKER_LXC:
        type: boolean
        description: "Apply ReKernel? (Applicable for Custom Manifest)"
        required: true
        default: false
        
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleaning?"
        required: true
        default: false
        
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Compiler Cache Update?"
        required: true
        default: false
        
permissions:
  actions: write
  contents: read

jobs:

# =========================
# Generate SM-8750 Matrix
# =========================

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate SM-8750 Device Matrix
        id: set-matrix
        run: |
          FILE_LIST=(
            "oneplus_13_b"
            "oneplus_13s_b"
            "oneplus_13t_b"
            "oneplus_ace5_pro_b"
            "oneplus_ace_6"
            "oneplus_pad_2_pro_b"
            "oneplus_pad_3_b"
          )

          MATRIX_JSON=$(printf '%s\n' "${FILE_LIST[@]}" | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              file_short: (sub("_[a-z]$"; "")),
              enable_sched: true
            })
          ')

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT


# =========================
# Trigger Device Builds
# =========================

  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:

      - name: Trigger Selected Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: refs/heads/LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE"             : "${{ matrix.file }}",
              "KPM"              : "${{ github.event.inputs.KPM }}",
              "MANAGER_SOURCE"   : "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_META"       : "${{ github.event.inputs.SUSFS_META }}",
              "DYNAMIC_REPO"     : "${{ github.event.inputs.DYNAMIC_REPO }}",
              "SUSFS_META"       : "${{ github.event.inputs.SUSFS_META }}",  
              "KSU_META"         : "${{ github.event.inputs.KSU_META }}",
              "ZRAM"             : "${{ github.event.inputs.ZRAM }}",
              "ZRAM-LZ4"         : "${{ github.event.inputs.ZRAM-LZ4 }}",
              "BUILD_TIME"       : "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX"           : "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION"    : "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM"              : "${{ github.event.inputs.LSM }}",
              "SUBLEVEL"         : "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER"        : "${{ github.event.inputs.NETFILTER }}",
              "BBR_ECN"          : "${{ github.event.inputs.BBR_ECN }}",
              "SUSFS_DEV"        : "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL"        : "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD"       : "${{ github.event.inputs.FAST_BUILD }}",
              "SCHED"            : "${{ github.event.inputs.SCHED }}",
              "ADIOS"            : "${{ github.event.inputs.ADIOS }}",
              "UNICODE_BYPASS"   : "${{ github.event.inputs.UNICODE_BYPASS }}",
              "SPACE_NOCLEAN"    : "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE"   : "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS_FIX"          : "${{ github.event.inputs.XUS_FIX }}"
              "DOCKER_LXC"       : "${{ github.event.inputs.DOCKER_LXC }}"
            }
              
      - name: Wait for Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="${{ matrix.file_short }}"
          echo "Waiting for artifact: $FILE"

          SECONDS=0
          MAX_TIME=$((35 * 60))
          sleep 600

          while (( SECONDS < MAX_TIME )); do
            ARTIFACTS=$(gh api \
              repos/${{ github.repository }}/actions/artifacts \
              --jq '.artifacts[].name')

            if echo "$ARTIFACTS" | grep -q "$FILE"; then
              echo "Artifact found for $FILE"
              exit 0
            fi

            sleep 300
          done

          echo "Timeout waiting for $FILE"
          exit 1


# =========================
# Wait-and-Package Job
# =========================
  wait-and-package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create Output Folder
        run: mkdir -p final_zips

      - name: Fetch Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RUN_ID="${{ github.run_id }}"

          echo "Fetching artifacts from run: $RUN_ID"

          gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts > artifacts.json

          echo "Available Artifacts:"
          jq -r '.artifacts[].name' artifacts.json

          echo ""
          echo "Downloading AnyKernel3 + ZRAM artifacts..."
          echo ""

          jq -c '.artifacts[]' artifacts.json | while read ART; do
            NAME=$(echo "$ART" | jq -r '.name')
            ID=$(echo "$ART" | jq -r '.id')

            if [[ "$NAME" =~ AnyKernel3|ZRAM ]]; then

              SAFE_NAME=$(echo "$NAME" | tr ' ' '_' | tr -cd '[:alnum:]_-')

              echo "Downloading: $NAME"

              curl -L \
                -H "Authorization: token $GH_TOKEN" \
                -o "final_zips/${SAFE_NAME}.zip" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ID}/zip"

            fi
          done

      - name: Debug Files
        run: ls -al final_zips/

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: All-AnyKernel3-ZRAM-${{ github.event.inputs.KSU_META }}
          path: final_zips/**/*.zip
          if-no-files-found: warn
          compression-level: 6
