name: Build Ace6 Kernel

on:
  workflow_dispatch:      # MANUAL TRIGGER (MAIN ENTRY)
    inputs:
      # ---------- KERNELSU ----------
      ksu_type:
        description: 'KernelSU variant (resukisu = built-in KSU, none = no KSU)'
        required: true
        type: choice
        default: 'none'
        options:
          - 'resukisu'
          - 'none'
      susfs_enable:
        description: 'SUSFS mount/root hiding (only takes effect when KernelSU is enabled above)'
        required: true
        type: boolean
        default: 'false'

      # ---------- PERFORMANCE ----------
      lz4_zstd:
        description: 'Update kernel compression libraries to LZ4 1.10 + ZSTD 1.5.7 (ARM64 NEON, better ratio) - replaces in-tree LZ4/ZSTD'
        required: true
        type: boolean
        default: 'false'
      lz4kd_enable:
        description: 'Add LZ4KD ZRAM compressor (independent LZ4 variant) - appears in comp_algorithm and can be switched through sysfs'
        required: true
        type: boolean
        default: 'false'
      show_all_algos:
        description: 'Compile all ZRAM compressors (including LZ4HC/842) - comp_algorithm lists all available algorithms'
        required: true
        type: boolean
        default: 'false'
      zram_writeback:
        description: 'ZRAM writeback support (idle/incompressible pages -> backing device; requires runtime backing_dev configuration)'
        required: true
        type: boolean
        default: 'false'

      # ---------- FEATURES ----------
      droidspaces:
        description: 'Droidspaces container (standard = +NTSYNC, extend = more features)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      baseband_guard:
        description: 'Kernel-level Baseband Guard (anti-format)'
        required: true
        type: boolean
        default: 'false'
      cve_patch:
        description: 'CVE security patches (GhostLock) - upstream lineage-23.2 already ships them'
        required: true
        type: boolean
        default: 'false'
      better_net:
        description: 'Better networking (IPSET/IPTABLES)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: 'BBR TCP congestion control'
        required: true
        type: boolean
        default: 'false'
      kpm_enable:
        description: 'KPM/KPN support (KPatchNext; may conflict with ReSukiSU built-in KPM)'
        required: true
        type: boolean
        default: 'false'
      rekernel_enable:
        description: 'Re:Kernel support (Freezer/NoActive binder hooks)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: 'Kernel version suffix (e.g. perf; empty = real commit)'
        required: false
        type: string
        default: ''

      # ---------- ATTRIBUTION ----------
      attribution_enable:
        description: 'Attribution (build tags/KSU version/AK3)'
        required: true
        type: boolean
        default: 'true'
      build_user:
        description: 'Attribution user'
        required: false
        type: string
        default: 'Lingguang'
      build_host:
        description: 'Attribution host'
        required: false
        type: string
        default: 'kernel-builder'

      # ---------- RELEASE ----------
      release_enable:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: 'false'
      artifact_mode:
        description: 'Upload artifacts (ak3 or all: +Image+boot.img)'
        required: true
        type: choice
        default: 'ak3'
        options:
          - 'ak3'
          - 'all'
      ccache_update:
        description: 'Update public ccache (upload to Release)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: 'Upload ccache debug logs'
        required: true
        type: boolean
        default: 'false'
      tag:
        description: 'Release tag (empty = auto date)'
        required: false
        type: string
        default: ''
      build_time:
        description: 'Custom build time string (e.g. Sun Dec 01 08:10:00 UTC 2024); empty = current UTC time'
        required: false
        type: string
        default: ''
      debug_skip_build:
        description: 'Debug: skip kernel build, test packaging/upload only (creates dummy Image)'
        required: true
        type: boolean
        default: 'false'

concurrency:
  group: build-kernel
  cancel-in-progress: false

permissions:
  contents: write         # GH RELEASE CREATE/UPLOAD FOR CCACHE + KERNEL RELEASES

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      kernelrel: ${{ steps.verify.outputs.kernelrel }}
      kernelver: ${{ steps.verify.outputs.kernelver }}

    steps:
      - uses: actions/checkout@v4

      # ---------- TOOLCHAIN: AOSP CLANG R563880C ----------
      - name: 🔧 Install AOSP Clang 21 (r563880c) + dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd patch bc flex bison \
            libssl-dev libncurses-dev libelf-dev dwarves python3 ccache mkbootimg

          # DOWNLOAD OFFICIAL TOOLCHAIN FROM RELEASE
          gh release download "toolchain-AOSP-Clang-21.0.0-r563880c" \
            -p "clang-r563880c.tar.gz" \
            -R $GITHUB_REPOSITORY

          mkdir -p clang
          tar xzf clang-r563880c.tar.gz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

          # MKBOOTIMG IMPORTS GKI.GENERATE_GKI_CERTIFICATE (AOSP GKI SIGNING
          # MODULE); KERNEL/BUILD MAIN HAS REMOVED IT. PROVIDE A STUB:
          # THE FUNCTION IS ONLY INVOKED WHEN --GKI_SIGNING_KEY IS PASSED,
          # WHICH THIS WORKFLOW NEVER DOES.
          mkdir -p /tmp/gki
          printf 'def generate_gki_certificate(*args, **kwargs):\n    raise SystemExit("GKI SIGNING NOT SUPPORTED (STUB)")\n' \
            > /tmp/gki/generate_gki_certificate.py
          echo "PYTHONPATH=/tmp" >> "$GITHUB_ENV"

      - name: ✅ Verify toolchain
        run: clang --version && clang -print-prog-name=ld.lld

      # ---------- CCACHE ----------
      - name: 🧹 Clean runner space (async, non-blocking)
        run: |
          # DELETE RUNNER COMPONENTS IN THE BACKGROUND WITHOUT BLOCKING:
          # - NO `WAIT`: THE STEP RETURNS IMMEDIATELY
          # - STDOUT/STDERR ARE REDIRECTED TO /DEV/NULL
          # - SETSID DETACHES THE PROCESSES FROM THE JOB PROCESS GROUP
          (setsid sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 &)
          (setsid sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/ghc >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &)
          df -h

      - name: 💾 Configure ccache
        run: |
          # USE CCACHE-ECS (SPECIALIZED KERNEL CACHE)
          sudo cp -f $GITHUB_WORKSPACE/lib/ccache-ecs /usr/local/bin/ccache
          sudo chmod +x /usr/local/bin/ccache

          # CCACHE_DIR INSIDE THE WORKSPACE: ACTIONS/CACHE HANDLES
          # WORKSPACE-RELATIVE PATHS CORRECTLY ON RESTORE. AN ABSOLUTE
          # $HOME PATH CAN RESTORE TO THE WRONG LOCATION, SILENTLY
          # DESTROYING THE CACHE HIT RATE.
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache_ace6" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          echo "CCACHE_IS_KERNEL_COMPILING=true" >> "$GITHUB_ENV"

          # RELAX CACHE MATCHING FOR CROSS-BUILD HITS
          mkdir -p "$GITHUB_WORKSPACE/.ccache_ace6"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" \
            > "$GITHUB_WORKSPACE/.ccache_ace6/ccache.conf"

          ccache --version

      - name: 🔑 Compute ccache fingerprint
        id: ccache-fp
        run: |
          # EVERYTHING THAT CHANGES THE KERNEL .CONFIG MUST CHANGE THE CACHE KEY:
          # FEATURE TOGGLES, SUFFIX, AND SOURCE COMMIT.
          #
          # OTHERWISE, A RESTORE-KEYS MATCH ON STALE PARAMETERS COULD SKIP THE
          # RELEASE PULL AND FORCE A FULL REBUILD.
          #
          # BUILD_TIME IS INTENTIONALLY EXCLUDED BECAUSE IT ONLY TOUCHES
          # TIMESTAMP FILES; SLOPPINESS TIME_MACROS HANDLES THE REST.
          SRC=$(curl -sL \
            "${{ vars.REPO_BASE || 'https://api.github.com' }}/repos/Ace6-Development/android_kernel_oneplus_sm8750/commits/lineage-23.2" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" |
            grep -oE '"sha": "[0-9a-f]{40}"' |
            head -1 |
            grep -oE '[0-9a-f]{40}' || true)

          # SINGLE SOURCE OF TRUTH FOR PREPARE KERNEL SOURCES.
          # THE FINGERPRINT IS GUARANTEED TO MATCH THE LOCALVERSION ACTUALLY USED.
          echo "SRC_COMMIT=$SRC" >> "$GITHUB_ENV"

          FP=$(printf '%s' \
            "${{ inputs.ksu_type }}|${{ inputs.susfs_enable }}|${{ inputs.lz4_zstd }}|${{ inputs.lz4kd_enable }}|${{ inputs.show_all_algos }}|${{ inputs.zram_writeback }}|${{ inputs.droidspaces }}|${{ inputs.baseband_guard }}|${{ inputs.cve_patch }}|${{ inputs.better_net }}|${{ inputs.bbr_enable }}|${{ inputs.kpm_enable }}|${{ inputs.rekernel_enable }}|${{ inputs.kernel_suffix }}|$SRC" |
            md5sum |
            cut -d' ' -f1)

          echo "CCACHE_FP=$FP" >> "$GITHUB_ENV"
          echo "ccache fingerprint: $FP (src $SRC)"

      - name: 💾 Load ccache cache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: .ccache_ace6
          # FINGERPRINT KEY: AN EXACT HIT MEANS IDENTICAL PARAMETERS,
          # SO THE RELEASE PULL CAN BE SKIPPED.
          # RESTORE-KEYS ARE USED ONLY AS A STALE FALLBACK.
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}
          restore-keys: |
            ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-
            ccache-ace6-O2-FT-${{ runner.os }}-
            ccache-ace6-O2-FT-

      - name: 💾 Pull public ccache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # MERGE THE AUTHORITATIVE RELEASE CACHE INTO CCACHE_DIR.
          # DO NOT TRUST A "LOCAL CACHE HIT" HERE: A NON-EMPTY DIRECTORY
          # IS NOT PROOF THAT THE CACHE IS USABLE.
          #
          # DO NOT WIPE THE DIRECTORY EITHER. THE GITHUB CACHE MAY CONTAIN
          # ENTRIES THAT THE RELEASE ARCHIVE DOES NOT.
          # CCACHE ENTRY FILENAMES ARE CONTENT HASHES, SO OVERLAPPING FILES
          # ARE IDENTICAL AND MERGING IS ALWAYS SAFE.
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "GitHub cache hit (fingerprint match), skip public pull"
            exit 0
          fi

          mkdir -p "${{ env.CCACHE_DIR }}"

          if gh release download "ccache-ace6-O2-FT" \
            -p "ccache-ace6-O2-FT.tar.zst" \
            -R $GITHUB_REPOSITORY 2>/dev/null; then

            echo "Public ccache downloaded, extracting (merge)..."
            tar -I zstd -xf ccache-ace6-O2-FT.tar.zst \
              -C "${{ env.CCACHE_DIR }}"
            echo "Public ccache merged!"
          else
            echo "Public ccache absent (first build), skip"
          fi

      # ---------- PREPARE SOURCES ----------
      - name: 📥 Prepare kernel sources
        run: |
          set -e
          mkdir -p work
          cd work

          # SOURCE COMMIT WAS ALREADY FETCHED BY THE CCACHE FINGERPRINT STEP.
          SRC_COMMIT="${SRC_COMMIT:-}"
          echo "SRC_COMMIT=$SRC_COMMIT" >> "$GITHUB_ENV"
          echo "Source commit: $SRC_COMMIT"

          [ -n "$SRC_COMMIT" ] || {
            echo "WARN: FAILED TO GET COMMIT, USING PLAIN -4K"
            SRC_COMMIT=""
          }

          # DOWNLOAD SOURCES IN PARALLEL
          curl -sL \
            "${{ vars.REPO_BASE || 'https://github.com' }}/Ace6-Development/android_kernel_oneplus_sm8750/archive/refs/heads/lineage-23.2.zip" \
            -o src.zip &

          curl -sL \
            "${{ vars.REPO_BASE || 'https://github.com' }}/Ace6-Development/android_kernel_oneplus_sm8750-modules/archive/refs/heads/lineage-23.2.zip" \
            -o modules.zip &

          curl -sL \
            "${{ vars.REPO_BASE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750-devicetrees/archive/refs/heads/lineage-23.2.zip" \
            -o dt.zip &

          wait

          unzip -q src.zip
          mv android_kernel_oneplus_sm8750-lineage-23.2 src

          unzip -q modules.zip
          mv android_kernel_oneplus_sm8750-modules-lineage-23.2 sm8750-modules

          unzip -q dt.zip
          mv android_kernel_oneplus_sm8750-devicetrees-lineage-23.2 sm8750-devicetrees

          rm -f src.zip modules.zip dt.zip

          # VERIFY SYMLINK TARGETS
          for t in \
            src/drivers/base/kernelFwUpdate/Kconfig \
            src/arch/arm64/boot/dts/vendor; do
            [ -e "$t" ] || {
              echo "MISSING SYMLINK TARGET: $t"
              exit 1
            }
          done

      # ---------- APPLY PATCHES ----------
      - name: 🔧 Apply compile fixes
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/07_compile_fixes.patch"
        working-directory: work/src

      - name: 🔧 Apply KSU hooks
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/00_ksu_hooks.patch"
        working-directory: work/src

      - name: 🔧 Apply SUSFS main patch
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/01_susfs_main.patch"
        working-directory: work/src

      - name: 🔧 Apply LZ4 patch
        if: inputs.lz4_zstd
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/02_lz4.patch"
        working-directory: work/src

      - name: 🔧 Apply ZSTD patch
        if: inputs.lz4_zstd
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/03_zstd.patch"
        working-directory: work/src

      - name: 🔧 Apply LZ4KD patch
        if: inputs.lz4kd_enable
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/04_lz4kd.patch"
        working-directory: work/src

      - name: 🔧 Apply Droidspaces patch
        if: ${{ inputs.droidspaces != 'false' }}
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/05_droidspaces.patch"
        working-directory: work/src

      - name: 🔧 Apply Baseband Guard patch
        if: inputs.baseband_guard
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/06_baseband_guard.patch"
        working-directory: work/src

      - name: ℹ️ CVE patch (already upstream, skipped)
        if: inputs.cve_patch
        run: |
          echo "GhostLock fixes (CVE-2026-43499, CVE-2026-53163) are already upstream in lineage-23.2; 08_cve.patch was removed."
        working-directory: work/src

      - name: 🔧 Apply Re:Kernel patch
        if: ${{ inputs.rekernel_enable }}
        # SOURCE PATCH (BINDER/SIGNAL/NETLINK HOOKS, #IFDEF CONFIG_REKERNEL)
        # MUST RUN BEFORE THE BUILD. IT WAS PREVIOUSLY APPLIED AFTER THE BUILD,
        # WHICH SILENTLY PRODUCED KERNELS WITHOUT RE:KERNEL SUPPORT.
        run: |
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/split/09_rekernel.patch"
        working-directory: work/src

      # ---------- COPY EXTRA FILES ----------
      - name: 📄 Copy extra files
        run: |
          set -e

          # SUSFS NEW FILES
          if [ "${{ inputs.susfs_enable }}" = "true" ] &&
             [ "${{ inputs.ksu_type }}" != "none" ]; then
            cp -r patches/extra/fs/susfs.c work/src/fs/
            cp -r patches/extra/include/linux/susfs.h \
                  patches/extra/include/linux/susfs_def.h \
                  work/src/include/linux/
          fi

          # LZ4 1.10 NEW LIBRARY FILES
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/lz4 work/src/lib/
          fi

          # ZSTD 1.5.7 NEW LIBRARY FILES
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/zstd/common/allocations.h \
                  patches/extra/lib/zstd/common/bits.h \
                  work/src/lib/zstd/common/

            cp -r patches/extra/lib/zstd/compress/zstd_preSplit.c \
                  patches/extra/lib/zstd/compress/zstd_preSplit.h \
                  work/src/lib/zstd/compress/
          fi

          # LZ4KD NEW FILES
          if [ "${{ inputs.lz4kd_enable }}" = "true" ]; then
            cp -r patches/extra/crypto/lz4k.c \
                  patches/extra/crypto/lz4kd.c \
                  work/src/crypto/

            cp -r patches/extra/include/linux/lz4k.h \
                  patches/extra/include/linux/lz4kd.h \
                  work/src/include/linux/

            cp -r patches/extra/lib/lz4k work/src/lib/
            cp -r patches/extra/lib/lz4kd work/src/lib/
          fi

          # DROIDSPACES NEW FILES
          if [ "${{ inputs.droidspaces }}" != "false" ]; then
            cp -r patches/extra/drivers/misc/ntsync.c \
                  work/src/drivers/misc/

            cp -r patches/extra/include/uapi/linux/ntsync.h \
                  work/src/include/uapi/linux/

            cp -r patches/extra/drivers/gpu/drm/evdi \
                  work/src/drivers/gpu/drm/
          fi

          # BASEBAND GUARD NEW FILES
          if [ "${{ inputs.baseband_guard }}" = "true" ]; then
            cp -r patches/extra/Baseband-guard work/src/
            ln -sfn ../Baseband-guard \
              work/src/security/baseband-guard
          fi

      # ---------- KERNELSU ----------
      - name: 🔗 Integrate KernelSU
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          set -e
          cd work/src

          case "${{ inputs.ksu_type }}" in
            resukisu)
              KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
              ;;
            none)
              echo "NO KERNELSU"
              exit 0
              ;;
          esac

          rm -rf KernelSU drivers/kernelsu
          git clone "$KSU_REPO" KernelSU

          ln -sfn ../KernelSU/kernel drivers/kernelsu

          grep -q "kernelsu" drivers/Makefile ||
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig ||
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig
        env:
          KSU_REPO: ""

      # ---------- KSU VERSION ----------
      - name: 🔢 Compute KSU version
        id: ksu_version
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          COUNT=$(git -C work/src/KernelSU rev-list --count HEAD)
          VER=$((30000 + COUNT + 700))
          echo "ksuver=$VER" >> "$GITHUB_OUTPUT"
          echo "KSU version: $VER ($COUNT commits)"

      # ---------- SUSFS KSU ADAPTATION ----------
      - name: 🔧 Apply SUSFS KSU adaptation
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: |
          cd KernelSU

          git apply --check "$GITHUB_WORKSPACE/patches/02_ksu.patch" 2>/dev/null &&
            git apply "$GITHUB_WORKSPACE/patches/02_ksu.patch" ||
            echo "WARN: 02_KSU.PATCH WAS NOT APPLIED AUTOMATICALLY (KSU VERSION MAY HAVE CHANGED)" >&2
        working-directory: work/src

      # ---------- ATTRIBUTION ----------
      - name: ✍️ Configure attribution
        run: |
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            echo "BUILD_USER=${{ inputs.build_user }}" >> "$GITHUB_ENV"
            echo "BUILD_HOST=${{ inputs.build_host }}" >> "$GITHUB_ENV"

            # KSU VERSION ATTRIBUTION (REPO_NAME)
            if [ "${{ inputs.ksu_type }}" != "none" ]; then
              sed -i \
                "s/^REPO_NAME := .*/REPO_NAME := ${{ inputs.build_user }}/" \
                work/src/KernelSU/kernel/Kbuild
            fi
          else
            echo "BUILD_USER=" >> "$GITHUB_ENV"
            echo "BUILD_HOST=" >> "$GITHUB_ENV"
          fi

      # ---------- CONFIG ----------
      - name: ⚙️ Deploy config
        run: |
          set -e
          cd work/src

          cp "$GITHUB_WORKSPACE/config/config_ace6_final.config" .config

          # LOCALVERSION: CUSTOM SUFFIX OR REAL COMMIT
          if [ -n "${{ inputs.kernel_suffix }}" ]; then
            ./scripts/config --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-${{ inputs.kernel_suffix }}"
          else
            ./scripts/config --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-g${SRC_COMMIT:0:12}"
          fi

          ./scripts/config --file .config -d CONFIG_LOCALVERSION_AUTO

          # DISABLE KERNELSU WHEN NOT REQUESTED
          if [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          fi

          # DISABLE SUSFS WHEN NOT REQUESTED OR WHEN KERNELSU IS DISABLED
          if [ "${{ inputs.susfs_enable }}" != "true" ] ||
             [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU_SUSFS
          fi

          # DISABLE DROIDSPACES WHEN NOT REQUESTED
          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC \
              -d CONFIG_NTSYNC \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # EVDI IS ONLY ENABLED IN EXTEND MODE
          if [ "${{ inputs.droidspaces }}" != "extend" ]; then
            ./scripts/config --file .config \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # DISABLE LZ4K/LZ4KD WHEN NOT REQUESTED
          if [ "${{ inputs.lz4kd_enable }}" != "true" ]; then
            ./scripts/config --file .config \
              -d CONFIG_LZ4K_COMPRESS \
              -d CONFIG_LZ4KD_COMPRESS \
              -d CONFIG_CRYPTO_LZ4K \
              -d CONFIG_CRYPTO_LZ4KD
          fi

          # DISABLE BASEBAND GUARD WHEN NOT REQUESTED
          if [ "${{ inputs.baseband_guard }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_BBG
          fi

          # DISABLE BETTER NETWORKING WHEN NOT REQUESTED
          if [ "${{ inputs.better_net }}" != "true" ]; then
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          fi

          # ENABLE ALL ZRAM ALGORITHMS WHEN REQUESTED.
          # LZ4HC/842 BACKENDS EXIST NATIVELY; THEY ONLY NEED THEIR
          # CRYPTO CONFIGURATION.
          # LZ4K/LZ4KD/DEFLATE COME FROM THE LZ4KD PATCH AND BASE CONFIG.
          if [ "${{ inputs.show_all_algos }}" = "true" ]; then
            ./scripts/config --file .config \
              -e CONFIG_CRYPTO_LZ4HC \
              -e CONFIG_CRYPTO_842
          fi

          # ZRAM WRITEBACK: IDLE/INCOMPRESSIBLE PAGES TO A BACKING DEVICE
          if [ "${{ inputs.zram_writeback }}" != "true" ]; then
            ./scripts/config --file .config \
              -d CONFIG_ZRAM_WRITEBACK \
              -d CONFIG_ZRAM_MEMORY_TRACKING
          fi

          # BBR TCP CONGESTION CONTROL
          if [ "${{ inputs.bbr_enable }}" = "true" ]; then
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          # RE:KERNEL BINDER HOOKS
          if [ "${{ inputs.rekernel_enable }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_REKERNEL
          fi

          export LLVM=1 LLVM_IAS=1

          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig

          grep -qE \
            'CONFIG_LOCALVERSION="-4k-(g[0-9a-f]{12}|[^"]+)"' \
            .config || exit 1

      # ---------- BUILD ----------
      - name: 🛠️ Build kernel
        if: ${{ !inputs.debug_skip_build }}
        run: |
          sudo sysctl -w vm.max_map_count=1048576

          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="$BUILD_USER"

          if [ "${{ inputs.ccache_debug }}" = "true" ]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          export KBUILD_BUILD_HOST="$BUILD_HOST"

          # CUSTOM BUILD TIME (KBUILD_BUILD_TIMESTAMP)
          if [[ -n "${{ inputs.build_time }}" &&
                "${{ inputs.build_time }}" != "N" &&
                "${{ inputs.build_time }}" != "n" ]]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_time }}"
            echo "Build time: ${{ inputs.build_time }}"
          fi

          # FAKETIME TIME-FIXING FOR REPRODUCIBLE BUILDS
          cd "$GITHUB_WORKSPACE"

          chmod 777 lib/*.so

          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          SO_DIR="$GITHUB_WORKSPACE/lib"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper

          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper

          chmod +x cc-wrapper ld-wrapper

          cd work/src

          set -o pipefail

          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/cc-wrapper" \
            LD="$GITHUB_WORKSPACE/ld-wrapper" \
            HOSTLD=ld.lld \
            KCFLAGS+=-O2 \
            -j$(nproc --all) \
            Image

          echo "CCACHE STATUS:"
          ccache -s

          [ -f arch/arm64/boot/Image ] || exit 1

      # ---------- DEBUG IMAGE ----------
      - name: Debug - create dummy Image (skip build)
        if: ${{ inputs.debug_skip_build }}
        run: |
          mkdir -p work/src/arch/arm64/boot
          echo "DEBUG DUMMY IMAGE" > work/src/arch/arm64/boot/Image
          echo "Dummy Image created (debug mode)"

      # ---------- VERIFY ----------
      - name: ✅ Verify artifacts
        id: verify
        if: ${{ !inputs.debug_skip_build }}
        run: |
          cd work/src

          strings arch/arm64/boot/Image |
            grep -q "Linux version 6.6.139" || exit 1

          # GET THE REAL KERNEL IDENTITY FROM THE BUILD ARTIFACTS.
          # KERNEL.RELEASE AND COMPILE INFORMATION ARE GENERATED SEPARATELY.
          # ON THIS TREE, UTS_VERSION LIVES IN UTSVERSION.H.
          # COMPILE.H ONLY CONTAINS UTS_MACHINE/BY/HOST/COMPILER.
          # THE OLD COMPILE.H GREP THEREFORE MATCHED NOTHING AND KERNELVER
          # WAS ALWAYS EMPTY.
          REL=$(cat include/config/kernel.release 2>/dev/null || true)

          VER=$(grep -oE \
            '#[0-9]+ SMP[^"]*' \
            include/generated/utsversion.h 2>/dev/null |
            head -1 || true)

          [ -n "$VER" ] ||
            VER=$(strings arch/arm64/boot/Image |
              grep -oE '#[0-9]+ SMP PREEMPT[^"]*' |
              head -1 || true)

          echo "kernelrel=$REL" >> "$GITHUB_OUTPUT"
          echo "kernelver=$VER" >> "$GITHUB_OUTPUT"
          echo "Kernel: $REL | $VER"

          ls -la arch/arm64/boot/Image

      # ---------- KPM/KPN POST-BUILD BINARY PATCH ----------
      - name: 🧩 Apply KPM patch
        if: ${{ inputs.kpm_enable && !inputs.debug_skip_build }}
        run: |
          cd work/src/arch/arm64/boot

          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux

          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux

          chmod +x kptools-linux

          ./kptools-linux \
            -p \
            -i ./Image \
            -k ./kpimg-linux \
            -o ./oImage

          rm -f Image
          mv oImage Image

          echo "KPM patched"

      # ---------- SAVE CCACHE ----------
      - name: 💾 Save ccache
        if: ${{ inputs.ccache_update }}
        uses: actions/cache/save@v5
        with:
          # WORKSPACE-RELATIVE PATH; THE SAME FINGERPRINT KEY IS USED.
          # GITHUB ACTIONS SKIPS RE-UPLOADING AN IDENTICAL CACHE.
          # NEW PARAMETERS CREATE A NEW CACHE ENTRY.
          path: .ccache_ace6
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}

      - name: 📤 Upload public ccache
        if: ${{ inputs.ccache_update }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PACKAGE CCACHE AND UPLOAD IT TO A RELEASE
          echo "Packaging public ccache ..."

          tar -I zstd \
            -cf ccache-ace6-O2-FT.tar.zst \
            -C "${{ env.CCACHE_DIR }}" .

          echo "ccache size: $(du -sh ccache-ace6-O2-FT.tar.zst | cut -f1)"

          # UPLOAD; CREATE THE RELEASE IF IT DOES NOT EXIST
          gh release create \
            "ccache-ace6-O2-FT" \
            ccache-ace6-O2-FT.tar.zst \
            --notes '🏷️ Category: ccache | ace6-O2-FT — Public ccache for Ace6 kernel builds' \
            2>/dev/null ||
          gh release upload \
            "ccache-ace6-O2-FT" \
            ccache-ace6-O2-FT.tar.zst \
            --clobber

          echo "Public ccache uploaded!"

      - name: 🔍 Upload ccache debug log
        if: ${{ inputs.ccache_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log
          path: ccache.log
          if-no-files-found: ignore

      # ---------- PACKAGE AK3 ----------
      - name: 📦 Package AK3
        id: package
        run: |
          set -e

          mkdir -p out pack

          [ -f work/src/arch/arm64/boot/Image ] || {
            echo "ERROR: Image not found"
            exit 1
          }

          cp -a ak3/. pack/
          cp work/src/arch/arm64/boot/Image pack/Image

          # VERIFY THAT IMAGE EXISTS AND IS NON-EMPTY
          SIZE=$(stat -c%s work/src/arch/arm64/boot/Image)
          echo "Image size: $SIZE"

          [ "$SIZE" -gt 0 ] || {
            echo "ERROR: Image is empty"
            exit 1
          }

          # AK3 ATTRIBUTION
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            sed -i \
              "s#kernel.string=.*#kernel.string=Ace6 Kernel | Build by ${{ inputs.build_user }}#" \
              pack/anykernel.sh
          else
            sed -i \
              "s#kernel.string=.*#kernel.string=Ace6 Kernel#" \
              pack/anykernel.sh
          fi

          STAMP=$(date +%Y%m%d)
          KSUVER="${{ steps.ksu_version.outputs.ksuver }}"
          ZIP="Kernel-Ace6-${{ inputs.build_user }}-ksu${KSUVER}-$STAMP.zip"

          cd pack

          zip -r9 "../out/$ZIP" . -x "*.git*" >/dev/null

          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "../out/$ZIP"

          # ALL MODE: ALSO GENERATE IMAGE + BOOT.IMG
          if [ "${{ inputs.artifact_mode }}" = "all" ]; then
            cp "$GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image" \
              ../out/Image

            # BOOT.IMG WITH OFFICIAL PARAMETERS: HEADER V4
            mkbootimg \
              --kernel "$GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image" \
              --header_version 4 \
              --os_version 16.0.0 \
              --os_patch_level 2026-07 \
              --pagesize 4096 \
              --base 0x80000000 \
              -o ../out/boot.img

            echo "all mode: Image + boot.img generated"
          fi

      # ---------- UPLOAD ARTIFACTS ----------
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release_enable }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: release_zips

      - name: 🚀 Publish Release
        run: |
          TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            TAG="kernel-$(date +%Y%m%d-%H%M%S)-ksu${{ needs.build.outputs.ksuver }}"
          fi

          cat <<EOF > release_notes.md
          # ⚡ Ace6 Kernel Build

          🏷️ **Category**: \`kernel\` | \`${{ inputs.ksu_type }}\` | ksu${{ needs.build.outputs.ksuver }}

          ---

          ## 📋 Version

          | Item | Value |
          |---|---|
          | Kernel | ${{ needs.build.outputs.kernelrel || 'n/a' }} |
          | Kernel build | ${{ needs.build.outputs.kernelver || 'n/a' }} |
          | KernelSU | ${{ needs.build.outputs.ksuver }} |
          | Build time | $(date +"%Y-%m-%d %H:%M UTC") |

          ## ✨ Features

          | Feature | State |
          |---|---|
          | KernelSU | ${{ inputs.ksu_type }} |
          | SUSFS | ${{ inputs.susfs_enable }} |
          | LZ4/ZSTD | ${{ inputs.lz4_zstd }} |
          | LZ4KD | ${{ inputs.lz4kd_enable }} |
          | Show all algos | ${{ inputs.show_all_algos }} |
          | ZRAM writeback | ${{ inputs.zram_writeback }} |
          | Droidspaces | ${{ inputs.droidspaces }} |
          | Baseband Guard | ${{ inputs.baseband_guard }} |
          | CVE | ${{ inputs.cve_patch }} |
          | Better network | ${{ inputs.better_net }} |
          | BBR | ${{ inputs.bbr_enable }} |
          | KPM | ${{ inputs.kpm_enable }} |
          | Re:Kernel | ${{ inputs.rekernel_enable }} |
          | Suffix | ${{ inputs.kernel_suffix || '-' }} |
          | Attribution | ${{ inputs.attribution_enable }} |
          | Artifact mode | ${{ inputs.artifact_mode }} |
          | Public ccache | ${{ inputs.ccache_update }} |

          ## ⚙️ Build & Release

          | Option | Value |
          |---|---|
          | Build user | ${{ inputs.build_user }} |
          | Build host | ${{ inputs.build_host }} |
          | Release enabled | ${{ inputs.release_enable }} |
          | Custom build time | ${{ inputs.build_time || '-' }} |
          | Release tag | ${{ inputs.tag || '-' }} |
          | ccache debug | ${{ inputs.ccache_debug }} |
          | Debug skip build | ${{ inputs.debug_skip_build }} |

          ## 📲 Flashing

          Flash **${{ needs.build.outputs.ak3name }}** (AnyKernel3 package) via recovery
          (TWRP/OrangeFox/AOSP recovery), or install directly through the built-in
          KernelSU manager.

          ${{ inputs.artifact_mode == 'all' && '> ⚠️ The `.zip` is the flashable package. `Image` and `boot.img` are raw build artifacts for developers only - do NOT flash them directly (boot.img carries no ramdisk).' || '' }}
          EOF

          gh release create "$TAG" \
            -R $GITHUB_REPOSITORY \
            --title "Ace6 Kernel ${{ inputs.ksu_type }} (ksu${{ needs.build.outputs.ksuver }})" \
            --notes-file release_notes.md \
            release_zips/*
        env:
          # PAT (FINE-GRAINED, THIS REPOSITORY ONLY) PUBLISHES AS THE USER
          # SO THE RELEASE SHOWS A HUMAN AUTHOR INSTEAD OF GITHUB-ACTIONS[BOT]
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
