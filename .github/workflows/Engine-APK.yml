name: 🤖 Engine APK

on:
  workflow_call:
    inputs:
      ROOTENGINE:
        required: true
        type: string
      KSUREPOSITORY:
        required: true
        type: string
      RELEASEREPOSITORY:
        required: true
        type: string
      BRANCH:
        required: true
        type: string
      MANAGERTAG:
        required: false
        type: string
        default: ""
      KSUVERSION:
        required: true
        type: string

    outputs:
      managerapk:
        description: Manager APK availability
        value: ${{ jobs.root-engine-apk.outputs.managerapk }}
      apkcount:
        description: Manager APK count
        value: ${{ jobs.root-engine-apk.outputs.apkcount }}
      managerapkdir:
        description: Manager APK directory
        value: ${{ jobs.root-engine-apk.outputs.managerapkdir }}
      selectedrun:
        description: Selected GitHub Actions run
        value: ${{ jobs.root-engine-apk.outputs.selectedrun }}

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  root-engine-apk:
    name: 🤖 Engine APK
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      managerapk: ${{ steps.root-engine-apk.outputs.managerapk }}
      apkcount: ${{ steps.root-engine-apk.outputs.apkcount }}
      managerapkdir: ${{ steps.root-engine-apk.outputs.managerapkdir }}
      selectedrun: ${{ steps.root-engine-apk.outputs.selectedrun }}
    env:
      KSUREPOSITORY: ${{ inputs.KSUREPOSITORY }}
      RELEASEREPOSITORY: ${{ inputs.RELEASEREPOSITORY }}
      BRANCH: ${{ inputs.BRANCH }}
      MANAGERTAG: ${{ inputs.MANAGERTAG }}
      KSUVERSION: ${{ inputs.KSUVERSION }}
      ROOTENGINE: ${{ inputs.ROOTENGINE }}
    steps:
      - name: 🤖 Workflow APK Resolver
        id: root-engine-apk
        shell: bash
        run: |
          set -Eeuo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          echo "└─ 🚀 APK Resolver Started..."
          MANAGERAPKDIR="${RUNNER_TEMP}/ManagerAPK-${ROOTENGINE}"
          rm -rf "$MANAGERAPKDIR"
          mkdir -p "$MANAGERAPKDIR"
          echo "------------------------------"
          echo "└─ ℹ️ [Info] Root Engine        : ${ROOTENGINE:-None}"
          echo "└─ ℹ️ [Info] Source Repository  : ${KSUREPOSITORY:-None}"
          echo "└─ ℹ️ [Info] Release Repository : ${RELEASEREPOSITORY:-None}"
          echo "└─ ℹ️ [Info] Release Branch     : ${BRANCH:-None}"
          echo "└─ ℹ️ [Info] Manager Tag        : ${MANAGERTAG:-None}"
          echo "└─ ℹ️ [Info] KSU Version        : ${KSUVERSION:-None}"
          echo "└─ ℹ️ [Info] Output Directory   : $MANAGERAPKDIR"
          echo "------------------------------"
          # Default Outputs
          APKMANAGER="false"
          APKCOUNT="0"
          selectedrun=""
          bestscore=0
          echo "└─ 🔎 [Check] Fetching Latest Successful Workflow Runs..."
          # Fetch Successful Workflow Runs
          mapfile -t runs < <(
            gh api \
              "repos/${RELEASEREPOSITORY}/actions/runs?branch=${BRANCH}&status=success&per_page=50" \
              --jq '
                .workflow_runs
                | sort_by(.created_at)
                | reverse
                | .[].id
              '
          )
          if [[ ${#runs[@]} -eq 0 ]]; then
            echo "⚠️ [Warn] No Successful Runs Found"
          else
            echo "ℹ️ [Info] Found ${#runs[@]} Workflow Runs..."    
          fi

          # Source Runs Based on Available Artifacts
          # Score Runs Based on Available Artifacts
          # Runs are Processed Newest-First, so Equal Scores Retain the Newest Matching Run
          echo "└─ 🔍 [Check] Scanning Runs for Manager / APK Artifacts..."
          for runid in "${runs[@]}"; do
            echo "------------------------------"
            echo "└─ 🔍 [Check] Run ID: $runid"
            artifactnames="$(
              gh api \
                "repos/${RELEASEREPOSITORY}/actions/runs/${runid}/artifacts" \
                --jq '.artifacts[].name' 2>/dev/null || true
            )"
            if [[ -z "$artifactnames" ]] || \
               ! echo "$artifactnames" | grep -qiE 'apk|manager|release|build'; then
              echo "└─ ♻️ [Skip] No Relevant Artifacts Found"
              continue
            fi

            score=0
            # APK Artifact Score
            if echo "$artifactnames" | grep -Eqi '\.apk($|[^a-zA-Z])'; then
              score=$((score + 50))
            fi

            # Manager Artifact Score
            if echo "$artifactnames" | grep -qi "manager"; then
              score=$((score + 20))
            fi

            # Release / Build Artifact Score
            if echo "$artifactnames" | grep -qiE 'release|build'; then
              score=$((score + 10))
            fi

            echo "└─ 📊 [Info] Score for Run $runid = $score"
            if [[ "$score" -gt "$bestscore" ]]; then
              bestscore="$score"
              selectedrun="$runid"
              echo "└─ 🏆 [New Best] Selected Run Updated → $runid"
            fi
          done
       
          # Display Selected Run and its Active Artifacts
          if [[ -z "$selectedrun" ]]; then
            echo "└─ ⚠️ [Warn] No Valid APK Workflow Found"
          else
            echo "------------------------------"
            echo "└─ 🏁 [Result] Selected Run: $selectedrun"
            echo "└─ 🏁 [Result] Best Score  : $bestscore"
            echo "------------------------------"
            echo "└─ 🔍 [Verify] Checking Artifacts..."
            gh api \
              "repos/${RELEASEREPOSITORY}/actions/runs/${selectedrun}/artifacts" \
              --jq '
                .artifacts[]
                | select(.expired == false)
                | .name
              ' || true         
          fi
         
          echo "└─ 📩 [Step 3] Fetching Manager APK Artifacts..."
          # Resolve Manager Artifact Download URLs
          artifacturls=""
          if [[ -n "$selectedrun" ]]; then
            echo "└─ 📩 [Check] Resolving Manager Artifact URLs..."
            artifacturls="$(
              gh api \
                "repos/${RELEASEREPOSITORY}/actions/runs/${selectedrun}/artifacts" \
                --jq '
                  .artifacts[]
                  | select(.expired == false)
                  | select(.name | test("manager"; "i"))
                  | .archive_download_url
                ' \
                2>/dev/null || true
            )"
          fi

          if [[ -n "$artifacturls" ]]; then
            echo "└─ 🔗 Manager Artifact URLs:"
            echo "$artifacturls"
          else
            echo "└─ ⚠️ [Warn] No Manager Artifact URLs Found"
          fi

          artifactcount="$(
            if [[ -n "$artifacturls" ]]; then
              printf '%s\n' "$artifacturls" |
                grep -c 'api.github.com' || true
            else
              echo "0"
            fi
          )"

          echo "└─ 📦 [Result] Manager Artifact Count: $artifactcount"

          # Download and Extract Manager Artifacts
          if [[ "$artifactcount" -gt 0 ]]; then
            i=0
            while read -r url; do
              [[ -z "$url" ]] && continue
              i=$((i + 1))
              zipfile="${MANAGERAPKDIR}/artifact_${i}.zip"
              echo "└─ ⬇️ [Download] Downloading Manager Artifact #$i"
              if ! curl \
                --location \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-all-errors \
                --retry-delay 3 \
                --connect-timeout 30 \
                --max-time 600 \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "$zipfile" \
                "$url"; then
                echo "└─ ⚠️ [Warn] Artifact Download Failed, Skipping"
                rm -f "$zipfile"
                continue
              fi

              if ! unzip -t "$zipfile" >/dev/null 2>&1; then
                echo "└─ ⚠️ [Warn] Invalid or Corrupted Artifact, Skipping"
                rm -f "$zipfile"
                continue
              fi

              echo "└─ 📦 [Info] Extracting Manager Artifact #$i"
              if ! unzip -o "$zipfile" \
                -d "$MANAGERAPKDIR" >/dev/null 2>&1; then
                echo "└─ ⚠️ [Warn] Artifact Extraction Failed, Skipping"
                rm -f "$zipfile"
                continue
              fi

              rm -f "$zipfile"
            done <<< "$artifacturls"
          fi      
          
          echo "└─ 🧹 [Step 4] Cleaning Non-APK Files..."
          find "$MANAGERAPKDIR" \
            -type f \
            ! -name "*.apk" \
            -delete || true
          # ReSukiSU (BakaSU) ARM64 Release Filter
          if [[ "$RELEASEREPOSITORY" == "Baka-SU/BakaSU" ]]; then
            echo "└─ ℹ️ [Info] ReSukiSU (BakaSU) Repository Detected"
            echo "└─ 🔍 [Info] Filtering Standard ARM64-v8a Release APK..."
            find "$MANAGERAPKDIR" \
              -type f \
              -name "*.apk" \
              ! -name "*arm64-v8a-release.apk" \
              ! -name "*universal-release.apk" \
              -delete || true
            find "$MANAGERAPKDIR" \
              -type f \
              -name "*spoofed*.apk" \
              -delete || true
            echo "└─ ✔️ [Result] ReSukiSU (BakaSU) APK Filtering Complete"
          fi

          echo "└─ 🔍 [Step 5] Verifying Output..."
          # Verify Final Manager / APK Output
          APKCOUNT="$(
            find "$MANAGERAPKDIR" \
              -type f \
              -name "*.apk" |
            wc -l
          )"
          echo "└─ 📦 [Result] APK Count: $APKCOUNT"
          if [[ "$APKCOUNT" -gt 0 ]]; then
            APKMANAGER="true"
            echo "└─ ✔️ [Result] Manager APK Resolution Successful"
            echo "└─ 📦 [Result] APKs Found: $APKCOUNT"
            find "$MANAGERAPKDIR" \
              -type f \
              -name "*.apk" \
              -print \
              -exec ls -lh {} \;
          else
            echo "└─ ⚠️ [Warn] No Usable Manager APK Files Found"
          fi

          # Step Outputs
          {
            echo "managerapk=$APKMANAGER"
            echo "apkcount=$APKCOUNT"
            echo "managerapkdir=$MANAGERAPKDIR"
            echo "selectedrun=$selectedrun"
            echo "ksuversion=$KSUVERSION"
          } >> "$GITHUB_OUTPUT"
          echo "└─ 📤 [Result] Manager APK Available  : $APKMANAGER"
          echo "└─ 📦 [Result] APK Count              : $APKCOUNT"
          echo "└─ 🏁 [Result] Selected Run           : $selectedrun"
          echo "└─ 🔗 [Result] Release Repository     : $RELEASEREPOSITORY"
          echo "└─ 🎉 [Result] APK Resolver Completed"

      - name: 📤 Upload Manager APK
        if: ${{ steps.root-engine-apk.outputs.managerapk == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ManagerAPK-${{ inputs.ROOTENGINE }}-${{ inputs.KSUVERSION }}
          path: ${{ steps.root-engine-apk.outputs.managerapkdir }}/*.apk
          if-no-files-found: warn
          retention-days: 7
