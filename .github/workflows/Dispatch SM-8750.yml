name: Dispatch SM-8750

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        required: true
        default: Stable V9.1.yml
        options:
          - Stable V9.1.yml
          - Main V9.1.yml

      KPATCH:
        type: choice
        required: true
        default: KPN
        options: [KPM, KPN, NONE]

      SUSFS_REPOSITORY:
        type: string
        default: ""

      GITHUB_REPOSITORY:
        type: string
        default: "AndreiMikh"

      BUILD_TIME:
        type: string
        default: "Mon Mar 16 07:07:07 UTC 2026"

      ROOT_ENGINE:
        type: choice
        default: ReSukiSU
        options: [ReSukiSU, SukiSU-Ultra, KernelSU-Next, WildKSU, KernelSU]

      MANAGER_SOURCE:
        type: choice
        default: ReSukiSU-Main
        options:
          - ReSukiSU-Main
          - ReSukiSU-Main-Spoofed
          - ReSukiSU-Dev
          - ReSukiSU-Dev-Spoofed
          - SukiSU-Ultra-Main
          - SukiSU-Ultra-Builtin
          - KernelSU-Next-Dev
          - KernelSU-Next-Dev-Spoofed
          - WildKSU-Stable
          - WildKSU-Stable-Spoofed
          - WildKSU-Canary
          - WildKSU-Canary-Spoofed
          - KernelSU-Main

      SUSFS_VERSION:
        type: choice
        default: OGKI
        options: [OGKI, GKI]

      ZRAM:
        type: choice
        default: "0"
        options:
          - 0
          - 1/lz4kd/8589934592

      ZRAM_CUSTOM:
        type: choice
        default: None
        options:
          - None
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0+LZ4KD
          - LZ4-1.10.0-Patch

      SUFFIX:
        type: string
        default: "8-andreimikhail-4k"

      SUBLEVEL:
        type: string
        default: ""

      FAST_BUILD:
        type: boolean
        default: true

      LSM:
        type: boolean
        default: true

      LXCDOCKER:
        type: choice
        default: None
        options: [DroidspaceLXC, TermuxLXC, None]

      NETFILTER:
        type: boolean
        default: true

      BBR:
        type: choice
        default: True
        options: [True, False, Brutal]

      UNICODE:
        type: boolean
        default: true

      WINDSPEED:
        type: boolean
        default: false

      SCHEDULERS:
        type: choice
        default: None
        options: [ADIOS, BORE, SSG, None]

      XUS:
        type: boolean
        default: true

      SUSFS_DEV:
        type: boolean
        default: false

      RE_KERNEL:
        type: boolean
        default: true

      SPACE_NOCLEAN:
        type: boolean
        default: false

      BUILD_NOCCACHE:
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

# =========================
# DEVICE MATRIX
# =========================
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )

          printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]' > devices.json
          echo "devices=$(cat devices.json)" >> $GITHUB_OUTPUT

# =========================
# DISPATCH BUILDS
# =========================
  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 🚀 Trigger Build
        id: trigger
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.device }}",
              "KPATCH": "${{ github.event.inputs.KPATCH }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_REPOSITORY": "${{ github.event.inputs.SUSFS_REPOSITORY }}",
              "GITHUB_REPOSITORY": "${{ github.event.inputs.GITHUB_REPOSITORY }}",
              "ROOT_ENGINE": "${{ github.event.inputs.ROOT_ENGINE }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM_CUSTOM": "${{ github.event.inputs.ZRAM_CUSTOM }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR": "${{ github.event.inputs.BBR }}",
              "LXCDOCKER": "${{ github.event.inputs.LXCDOCKER }}",
              "SCHEDULERS": "${{ github.event.inputs.SCHEDULERS }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "WINDSPEED": "${{ github.event.inputs.WINDSPEED }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS": "${{ github.event.inputs.XUS }}"
            }

      - name: 💾 Save Run ID
        run: |
          mkdir -p meta
          echo "${{ matrix.device }}" > meta/device.txt
          echo "${{ steps.trigger.outputs.run_id }}" > meta/run_id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.device }}
          path: meta/

# =========================
# MERGE RUN IDS
# =========================
  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta

      - id: map
        run: |
          JSON="{}"

          for d in meta/meta-*; do
            DEV=$(cat "$d/device.txt")
            ID=$(cat "$d/run_id.txt")

            [[ -z "$ID" || "$ID" == "null" ]] && continue

            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

# =========================
# FETCH ARTIFACTS (30 MIN ROBUST)
# =========================
  fetch:
    needs: merge
    runs-on: ubuntu-latest

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: ⚙️ Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq curl unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🔍 Resolve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'

          RUN_ID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')

          [[ -z "$RUN_ID" ]] && exit 1

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: ⏳ Wait for Completion (30 mins max)
        run: |
          MAX=90
          SLEEP=20

          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)

            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)

            echo "$i/$MAX → $STATUS | $CONCLUSION"

            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "❌ Failed: $CONCLUSION"
              exit 1
            fi

            sleep $SLEEP
          done

          echo "❌ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          mkdir -p artifacts/${{ matrix.device }}

          gh run download $RUN_ID \
            --dir artifacts/${{ matrix.device }} \
            --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.device }}
          path: artifacts/${{ matrix.device }}

# =========================
# FINAL BUNDLE
# =========================
  bundle:
    needs: fetch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize
        run: |
          mkdir -p final_bundle

          for dir in bundle/final-*; do
            dev=$(basename "$dir" | sed 's/final-//')
            mkdir -p final_bundle/$dev
            cp -r "$dir"/. final_bundle/$dev/ || true
          done

      - name: 🗜️ Create ZIP
        run: |
          ZIP="SM8750-Kernel-Bundle-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$ZIP" final_bundle
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SM8750-Kernel-Bundle
          path: ${{ env.ZIP }}
