name: ☘️ Dispatch & Fetch SM8750
on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Main.yml
        options:
          - Main.yml        
      UNIQUE:
        type: boolean
        description: "Unique Identifier for Dispatch Run"
        required: false
        default: true                       
      RELEASECHANNEL:
        type: choice
        description: "Release Channel (Stable / Beta / Nightly)"
        required: true
        default: Nightly
        options:
          - Stable
          - Beta
          - Nightly
      KERNELPATCH:
        type: choice
        description: "KernelPatch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None          
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Repository (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""        
      GITHUBREPOSITORY:
        type: string
        description: "Compiler / Owner"
        required: true
        default: "AndreiMikh"        
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Mar 16 07:07:07 UTC 2026"        
      ROOTENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
         - ReSukiSU
         - KernelSU-Next
         - KernelSU         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-SUSFS
         - KernelSU-Main
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed         
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12, SUSFS for OPlus Kernel Image (SUSFSOKI) / SUSFS for KernelSU (SUSFSKSU)"
        required: true
        default: GKI
        options:
          - OGKI
          - GKI
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Development Branch?"
        required: true
        default: false      
      ZRAMCUSTOMPATCH:
        type: choice
        description: "Enable LZ4 1.10.0 (6.1 and 6.6) / ZSTD 1.5.7? (6.1) Only if ZRAM (LZ4KD) is Off"
        required: false
        default: LZ4-1.10.0-Custom-Patch
        options:
          - LZ4-1.10.0-Custom-Patch
          - LZ4-1.10.0-Patch-Update
          - LZ4-1.10.0-Patch
          - None        
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "flamingsakura-hiyuki"        
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""        
      FASTBUILD:
        type: boolean
        description: "Fast Kernel Build"
        required: true
        default: true        
      LSMBBG:
        type: boolean
        description: "Critical Partition Write Protection (Linux Security Module)"
        required: true
        default: true
      LXCDOCKERSUPPORT:
        type: choice
        description: "Linux Container Support *For Testing, Unstable (Consider Disabling BBG Linux Security Module if Enabling Termux LXC / Docker Support)"
        required: true
        default: None
        options:
          - DroidSpacesLXC-WildPatch
          - DroidSpacesLXC-Inject
          - TermuxLXC
          - None        
      NETFILTER:
        type: boolean
        description: "Network Feature Extensions (NetFilter)"
        required: true
        default: true        
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBR+ECN
        options:
          - BBR+ECN              # Base BBR + ECN Settings, Safe Default
          - BBR+ECN+Brutal       # Apply Brutal as Default + Cubic Fallback
          - None                 # Skip BBR + ECN Configuration       
      WINDSPEED:
        type: boolean
        description: "Hmbird / Windspeed (Oryon Platform SM-8750)"
        required: true
        default: false
      SCHEDULERS:
        type: choice
        description: "CPU / I/O Scheduler | ADIOS = SM-8750* & SM-8650* | SSG = SM-8650* | BORE = for Testing (Unstable)*"
        required: true
        default: ADIOS
        options:
          - ADIOS
          - BORE
          - SSG
          - None
      REKERNEL:
        type: boolean
        description: "Re-Kernel Support"
        required: true
        default: true
      NTSYNC:
        type: boolean
        description: "NTSync (Custom Synchronization Feature)"
        required: true
        default: true
      PROFILE:
        type: choice
        description: "Performance = (XUS - Enabled | Space Clean - Disabled | Compiler Cache - Enabled)"
        required: true
        default: Balance
        options:
          - Balance
          - Balance+GitRelease
          - Experimental
          - Disable 

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}
    steps:
      - id: out
        run: |
          DEVICES=(
            oneplus_13_b
            oneplus_13s_b
            oneplus_13t_b
            oneplus_ace5_pro_b
            oneplus_ace_6
            oneplus_pad_2_pro_b
            oneplus_pad_3_b
          )
          echo "devices=$(printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  dispatch:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}
    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v4
        
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq
          
      - name: ⚙️ Set Build Profile Flags
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"      
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              UNICODE=true
              NTSYNC=false
              GITRELEASE=false
              ;;
             Balance+GitRelease)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              UNICODE=true
              NTSYNC=false
              GITRELEASE=true
              ;; 
            Experimental)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              UNICODE=false
              NTSYNC=true
              GITRELEASE=false
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              UNICODE=false
              NTSYNC=false
              GITRELEASE=false
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              XUS=false
              UNICODE=true
              NTSYNC=false
              GITRELEASE=false
              ;;
          esac      
          echo "PROFILE=$PROFILE"
          echo "CLEANSPACE=$CLEANSPACE"
          echo "BUILDCCACHE=$BUILDCCACHE"
          echo "XUS=$XUS"
          echo "UNICODE=$UNICODE"
          echo "NTSYNC=$NTSYNC"
          echo "GITRELEASE=$GITRELEASE"          
          echo "CLEANSPACE=$CLEANSPACE" >> $GITHUB_ENV
          echo "BUILDCCACHE=$BUILDCCACHE" >> $GITHUB_ENV
          echo "XUS=$XUS" >> $GITHUB_ENV
          echo "UNICODE=$UNICODE" >> $GITHUB_ENV
          echo "NTSYNC=$NTSYNC" >> $GITHUB_ENV
          echo "GITRELEASE=$GITRELEASE" >> $GITHUB_ENV

      - name: 🚀 Trigger Build CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW="${{ github.event.inputs.TARGET_WORKFLOW }}"
          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"
          # Capture Timestamp Before Dispatch
          TIMESTART=$(date -u +"%Y-%m-%dT%H:%M:%SZ")          
          # Unique Tag
          UNIQUE="${{ matrix.device }}-$(date +%s)"
          echo "UNIQUE (Local Only)=$UNIQUE"
          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f ZRAMCUSTOMPATCH="${{ github.event.inputs.ZRAMCUSTOMPATCH }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f FASTBUILD="${{ github.event.inputs.FASTBUILD }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LXCDOCKERSUPPORT="${{ github.event.inputs.LXCDOCKERSUPPORT }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SCHEDULERS="${{ github.event.inputs.SCHEDULERS }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f PROFILE="${{ github.event.inputs.PROFILE }}"
          echo "⏳ Waiting for Run to Register..."
          sleep 3
          # Fetch Latest Matching Run After Timestamp
          echo "⏳ Resolving Run ID via API..."
          RUNID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            | jq -r --arg time "$TIMESTART" '
                .workflow_runs
                | map(select(.created_at > $time))
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ')
          # Validate
          if [[ -z "$RUNID" ]]; then
            echo "⚠️ Failed to Resolve Run ID"
            exit 1
          fi
          echo "✔️ Run ID=$RUNID"
          echo "RUNID=$RUNID" >> $GITHUB_ENV

      - name: 🔍 Debug Run ID
        run: |
          set -euo pipefail
          RUNID="${{ env.RUNID }}"
          echo "Run ID (Environment Context): $RUNID"
  
      - name: 💾 Save Run ID
        run: |
          set -euo pipefail
          mkdir -p Meta
          echo "${{ matrix.device }}" > Meta/Device.txt
          # Read from GitHub Environment Properly
          RUNID="${{ env.RUNID }}"
          if [[ -z "${RUNID:-}" || "$RUNID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi
          echo "✔️ Saving Run ID: $RUNID"
          echo "$RUNID" > Meta/Run-ID.txt

      - name: 🏗️ Solve Device Name (Meta)
        run: |
          mapdevice() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }
          DEVICENAME=$(mapdevice "${{ matrix.device }}")
          echo "DEVICENAME=$DEVICENAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Meta-${{ env.DEVICENAME }}
          path: Meta/

  merge:
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: Meta
      - id: map
        run: |
          JSON="{}"
          for d in Meta/Meta-*; do
            DEV=$(cat "$d/Device.txt")
            ID=$(cat "$d/Run-ID.txt")
            [[ -z "$ID" || "$ID" == "null" ]] && continue
            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done
          echo "map=$(echo "$JSON" | jq -c .)" >> $GITHUB_OUTPUT

  fetch:
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}        
    steps:    
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update -y
          sudo apt install -y gh jq
  
      - name: 🔍 Resolve Run ID
        run: |
          MAP='${{ needs.merge.outputs.map }}'
          RUNID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')
          [[ -z "$RUNID" ]] && exit 1
          echo "RUNID=$RUNID" >> $GITHUB_ENV

      - name: ⏳ Wait for Completion (40 Mins Max)
        run: |
          MAX=120
          SLEEP=20
          for ((i=1;i<=MAX;i++)); do
            DATA=$(gh api repos/${{ github.repository }}/actions/runs/$RUNID || true)
            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)
            echo "$i/$MAX → $STATUS | $CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi
            sleep $SLEEP
          done
          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          set -euo pipefail

          # Use Existing Run ID from Environment
          if [[ -z "${RUNID:-}" || "$RUNID" == "null" ]]; then
            echo "⚠️ Run ID is Missing"
            exit 1
          fi
          echo "📥 Downloading Artifacts for Run ID=$RUNID"
          mkdir -p artifacts/${{ matrix.device }}
          gh run download "$RUNID" \
            --dir "artifacts/${{ matrix.device }}" \
            --repo "$GITHUB_REPOSITORY"
   
      - name: 📊 Device Build Summary
        run: |
          mapdevice() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }
          DEVICENAME=$(mapdevice "${{ matrix.device }}")
          if [[ -d "artifacts/${{ matrix.device }}" ]] && [[ $(ls -A artifacts/${{ matrix.device }}) ]]; then
            STATUS="✔️ Success"
            COUNT=$(ls -1 artifacts/${{ matrix.device }} | wc -l)
          else
            STATUS="⚠️ Failed"
            COUNT=0
          fi
          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Status | Run | Artifacts |"
            echo "|--------|--------|-----|-----------|"
            echo "| $DEVICENAME | $STATUS | [View](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUNID) | $COUNT File(s) |"
          } >> $GITHUB_STEP_SUMMARY
  
      - name: 🏗️ Resolve Device Name (Final)
        run: |
          mapdevice() {
            case "$1" in
              oneplus_13_b) echo "OnePlus13" ;;
              oneplus_13s_b) echo "OnePlus13S" ;;
              oneplus_13t_b) echo "OnePlus13T" ;;
              oneplus_ace5_pro_b) echo "OnePlusAce5Pro" ;;
              oneplus_ace_6) echo "OnePlusAce6" ;;
              oneplus_pad_2_pro_b) echo "OnePlusPad2Pro" ;;
              oneplus_pad_3_b) echo "OnePlusPad3" ;;
              *) echo "$1" ;;
            esac
          }
          DEVICENAME=$(mapdevice "${{ matrix.device }}")
          echo "DEVICENAME=$DEVICENAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Final-${{ env.DEVICENAME }}
          path: artifacts/${{ matrix.device }}

  bundle:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: 📩 Checkout Repository
        uses: actions/checkout@v4   
      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize
        run: |
          mkdir -p Final
          for dir in bundle/Final-*; do
            dev=$(basename "$dir" | sed 's/Final-//')
            mkdir -p Final/$dev
            cp -r "$dir"/. Final/$dev/ || true
          done

      - name: 🗜️ Create Zip
        run: |
          ZIP="Kernel-Bundle.zip"
          zip -r "$ZIP" Final
          echo "ZIP=$ZIP" >> $GITHUB_ENV
     
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-Bundle
          path: ${{ env.ZIP }}

      - name: 🏷️ Generate Release Tag (Channel Aware)
        run: |
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"

          # Normalize Channel to Lowercase
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')          
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable"
              ;;
            beta)
              TAG="SM8750-Beta"
              ;;
            nightly|*)
              TAG="SM8750-Nightly"
              ;;
          esac
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "CHANNEL=$CHANNEL" >> $GITHUB_ENV

      - name: 🚀 Publish Channel-Based Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Repo: $GITHUB_REPOSITORY"
          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" || true
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable"
              PRERELEASE="false"
              LATEST="true"
              ;;
            beta)
              TAG="SM8750-Beta"
              PRERELEASE="true"
              LATEST="false"
              ;;
            nightly|*)
              TAG="SM8750-Nightly"
              PRERELEASE="true"
              LATEST="false"
              ;;
          esac
          echo "TAG=$TAG"
          TITLE="🚀 SM8750 ${CHANNEL} | Build Number ${RUN}"
          echo "🔍 Scanning Release Assets..."
          ASSETS=()
          # 1. Add Bundle Zip
          ZIPBUNDLE=$(find . -type f -name "Kernel-Bundle.zip" | head -n 1)
          if [[ -z "$ZIPBUNDLE" || ! -s "$ZIPBUNDLE" ]]; then
            echo "⚠️ Missing Bundle Zip"
            exit 1
          fi
          ASSETS+=("$ZIPBUNDLE")
          echo "📦 Bundle: $ZIPBUNDLE"
          # 2. Add All Final Device Zips
          echo "📦 Collecting Final Device Zips..."
          while IFS= read -r zip; do
            ASSETS+=("$zip")
          done < <(
            find . -type f -name "*.zip" \
              ! -name "Kernel-Bundle.zip" \
              | sort
          )
          # 3. Safety Check
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "⚠️ No Release Assets Found"
            exit 1
          fi
          echo "📦 Assets to Upload:"
          printf '%s\n' "${ASSETS[@]}"
          # 4. Release Notes
          if [[ ! -s Release.txt ]]; then
            cat > Release.txt <<EOF
          SM8750 Kernel Release
          ---   
          Build: ${RUN}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}          
          ---   
          📦 Build Configuration
          ---   
          📞 Device                       : ${{ env.DEVICENAME }}
          ☘️ KernelPatch                  : ${{ github.event.inputs.KERNELPATCH }}
          🔥 SUSFS                        : ${{ github.event.inputs.SUSFSREPOSITORY }}
          🔥 SUSFS Variant                : ${{ github.event.inputs.SUSFSVARIANT }}
          🔥 SUSFS Dev Branch             : ${{ github.event.inputs.SUSFSBRANCHDEV }}
          💾 Git Repository               : ${{ github.event.inputs.GITHUBREPOSITORY }}
          ---   
          🧰 Root                         : ${{ github.event.inputs.ROOTENGINE }}
          🧰 Manager / Branch Source      : ${{ github.event.inputs.ROOTBRANCHSOURCE }}
          ---   
          📎 LZ4 Patch                    : ${{ github.event.inputs.ZRAMCUSTOMPATCH }}
          ---   
          📱 Kernel Suffix                : ${{ github.event.inputs.SUFFIX }}
          📱 Kernel Sub-Level             : ${{ github.event.inputs.SUBLEVEL }}
          📱 Kernel Build Time            : ${{ github.event.inputs.BUILDTIME }}
          📱 Unique                       : ${{ github.event.inputs.UNIQUE }}
          ---   
          🔰 LSM-Baseband Guard           : ${{ github.event.inputs.LSMBBG }}
          📊 Linux Container Support      : ${{ github.event.inputs.LXCDOCKERSUPPORT }}
          ---   
          🔨 Netfilter IP Set / IPv6 NAT  : ${{ github.event.inputs.NETFILTER }}
          🛜 TCP Congestion Control       : ${{ github.event.inputs.TCPALGORITHM }}
          ---   
          🔠 Unicode Bypass               : ${{ github.event.inputs.UNICODE }}
          🚀 Hmbird / Windspeed           : ${{ github.event.inputs.WINDSPEED }}
          🗓️ Schedulers                   : ${{ github.event.inputs.SCHEDULERS }}
          ---   
          ⚙️ XUS Error Fix                : ${{ env.XUS }}
          ⛓️‍💥 Re-Kernel                    : ${{ github.event.inputs.REKERNEL }}
          ---             
          🔧 Clean Build Space            : ${{ env.CLEANSPACE }}
          🔧 Compiler Cache               : ${{ env.BUILDCCACHE }}          
          ---   
          ### 📋 Installation Guide:
          #### **Download the Zip File**:
               - Navigate to the Release Page and Download the Correct Zip File for your Device and Kernel Version
               - Ensure that you Select the File that Matches your Device's Model and the Kernel Version you're Installing
          ---   
          #### **Prepare Your Device**:
               - Make sure your Device has an **Unlocked Bootloader** and a Compatible Custom Recovery (TWRP or OrangeFox)
               - It's Recommended to **Backup your Data** Before Proceeding with the Installation to Avoid any Loss
          ---   
          #### **Install through Recovery Tool**:
               - Reboot your device into **Recovery Mode** (TWRP/OrangeFox/etc.).
               - In the Recovery Menu, Select **Install** and Navigate to the Downloaded Zip File
               - Select the Zip File and Swipe to Confirm Installation
               - After the Installation Completes, Reboot your Device into the System
          ---   
          #### **Installation via KernelFlasher App**:
               - **Download KernelFlasher**: Get the **KernelFlasher** App from [KernelFlasher GitHub](https://github.com/fatalcoder524/KernelFlasher)
               - **Launch KernelFlasher**: Open the App and Make Sure your **Device is Rooted**
               - **Select Kernel**: Choose the Downloaded **Kernel Zip** File within the App
               - **Flash the Kernel**: Follow the Prompts to Flash the Kernel Directly onto your Device
               - **Reboot**: After Flashing, the App will Reboot the Device into the System
          ---   
          #### **Installation via Horizon Flasher App**:
               - **Download Horizon Flasher**: Download the **Horizon Flasher App** from [HorizonKernelFlasher GitHub](https://github.com/libxzr/HorizonKernelFlasher/releases) 
               - **Install the App**: Once the App is Installed, Launch it and Select the **Downloaded Kernel Zip** File
               - **Flash**: App will Automatically Flash the Kernel for you... It may Take some Time, Depending on the Size of the Kernel File
               - **Reboot the System**: After Flashing, App will Prompt you to Reboot... Follow the On-Screen Instructions to Reboot into the System   
          ---     
          #### **For Troubleshooting**:
               - If you Encounter any Issues with the Installation or Booting, Here are some Common Fixes:
                  - **Bootloops**: If your Device is Stuck in a Bootloop after Installation, Try Clearing the Cache and Dalvik Cache from the Recovery Menu
                  - **Kernel Panic**: This may occur if your device is incompatible with the Kernel, Try Reverting to a Different Kernel Version or Check for Device-Specific Patches
                  - **Stuck on Recovery**: If you can’t Boot into the System after Installation, Reflash the Recovery and Reattempt the Installation
          ---   
          #### **Additional Tips**:
               - **Root Access**: If you Need Root Access, Ensure that the Corresponding Root Manager (`SukiSU-Ultra`, `ReSukiSU`, Etc) is Installed after Flashing the Kernel, Follow the Specific Instructions Provided by the Root Manager's Documentation
          ---    
          #### **Common Issues and Fixes**:
               - **Issue - Kernel Does Not Boot**:
                  - Fix: Make Sure you are Using a Kernel Compatible with your Device, Review the Device-Specific Kernel Settings or Check if there are any Custom Patches Required for your Device Model  
          ---   
          #### **After Installation**:
               - Once Installed, you can Verify the Kernel Version and Root Access by Using a Kernel Checker App or a Root Checker App from the Play Store
               - Enjoy the New Kernel Features and Enhancements Designed to Improve your Device's Performance         
          ---   
      
          EOF
          fi

          # 5. Idempotent Check
          set +e
          gh release view "$TAG" >/dev/null 2>&1
          EXISTS=$?
          set -e
          if [[ "$EXISTS" -eq 0 ]]; then
            echo "♻️ Release Already Exists → Skipping"
            exit 0
          fi

          # 6. Create Release
          echo "🚀 Creating Release: $TAG"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file Release.txt \
            --prerelease=$PRERELEASE \
            --latest=$LATEST \
            "${ASSETS[@]}"
