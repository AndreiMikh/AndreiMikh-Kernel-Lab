name: ☘️ Dispatch & Fetch SM8750
on:
  workflow_dispatch:
    inputs:
      TARGETWORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Main.yml
        options:
          - Main.yml
      RELEASECHANNEL:
        type: choice
        description: "Release Channel (Stable / Beta / Nightly)"
        required: true
        default: Nightly
        options:
          - Stable
          - Beta
          - Nightly
      MODE:
        type: choice
        description: ""
        required: true
        default: FullBuild
        options:
          - FullBuild
          - RootEngineAPK    
      GITHUBREPOSITORY:
        type: string
        description: "Compiler / Owner"
        required: true
        default: "AndreiMikh"      
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "flamingsakura"        
      SUBLEVEL:
        type: string
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Wed Oct 21 07:07:07 UTC 2026"        
      ROOTENGINE:
        type: choice
        description: "KSU Manager"
        required: true
        default: BakaSU
        options:
         - BakaSU
         - KernelSU-Next
         - SukiSU-Ultra
         - KernelSU         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: BakaSU-Main
        options:
         - BakaSU-Main
         - BakaSU-Sync-SUSFS         
         - KernelSU-Next-Dev-SUSFS
         - SukiSU-Ultra-Builtin
         - KernelSU-Main
      ROOTCOMMIT:
        type: string
        description: "Custom Root Commit (Optional)"
        required: false
        default: ""        
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Revision (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""        
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available For Version: A14-6.1, A15-6.6 & A16-6.12, SUSFS For OPlus Kernel Image (SUSFSOKI) / SUSFS For KernelSU (SUSFSKSU)"
        required: true
        default: GKI
        options:
          - OGKI
          - GKI
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Development Branch?"
        required: true
        default: false
      NOMOUNT:
        type: choice
        description: "NoMount Built-in Integration"
        required: true
        default: NoMount-Dev
        options:
          - NoMount
          - NoMount-Dev
          - None
      UNICODE:
        type: boolean
        description: "Fix For Unicode Invisible Code Point Bypass Read Vulnerability"
        required: true
        default: true   
      LZ4NEON:
        type: choice
        description: "LZ4 1.10.0 / ZSTD 1.5.7?"
        required: false
        default: LZ4-1.10.0-Patch-Update
        options:
          - LZ4-1.10.0-Patch-Update
          - None    
      WINDSPEED:
        type: boolean
        description: "Hmbird"
        required: true
        default: true
      LSMBBG:
        type: boolean
        description: "Critical Partition Write Protection (Linux Security Module)"
        required: true
        default: true
      LINUXCNTSYNC:
        type: choice
        description: "NTSynchonization Primitives / DroidSpaces Linux Container Support"
        required: true
        default: DroidSpaces+NTSync
        options:
          - DroidSpaces+NTSync
          - None
      REKERNEL:
        type: choice
        description: "Re-Kernel Support"
        required: true
        default: None
        options:
          - Built-in
          - Module
          - None
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBRV1+BBRV3+ECN
        options:
          - BBRV1+ECN
          - BBRV1+BBRV3+ECN
          - None   
      NETFILTER:
        type: boolean
        description: "Network Feature Extensions (NetFilter)"
        required: true
        default: true                                   
      DISABLEVENDORMODULE:
        type: choice
        description: "Comma-Separated Vendor Module(s) to Blacklists"
        required: true
        default: None
        options:
          - oplus_secure_guard_new
          - oplus_secure_guard,oplus_secure_guard_new
          - None
      KERNELPATCH:
        type: choice
        description: "KernelPatch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None    
      PROFILE:
        type: choice
        description: "Balance = Clean Workspace - Disabled | Compiler Cache - Enabled"
        required: true
        default: Balance
        options:
          - Balance
          - GitRelease
          - Disable

concurrency:
  group: sm8750-${{ github.event.inputs.RELEASECHANNEL }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  matrix:
    name: 📱 Generate Device Matrix
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.out.outputs.devices }}

    steps:
      - id: out
        run: |
          DEVICES=(
            1+Ace5Pro
            1+13
            1+13T
            1+13S
            1+Pad2Pro
            1+Pad3
            1+Ace6
          )
          echo "devices=$(printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  dispatch:
    name: 🚀 Dispatch ${{ matrix.device }}
    needs: matrix
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq

      - name: ⚙️ Set Build Profile Flags
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            GitRelease)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=true
              UNIQUE=true
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              GITRELEASE=false
              UNIQUE=true
              ;;
          esac
          echo "PROFILE=$PROFILE"
          echo "CLEANSPACE=$CLEANSPACE"
          echo "BUILDCCACHE=$BUILDCCACHE"
          echo "GITRELEASE=$GITRELEASE"
          echo "UNIQUE=$UNIQUE"
          echo "CLEANSPACE=$CLEANSPACE" >> "$GITHUB_ENV"
          echo "BUILDCCACHE=$BUILDCCACHE" >> "$GITHUB_ENV"
          echo "GITRELEASE=$GITRELEASE" >> "$GITHUB_ENV"
          echo "UNIQUE=$UNIQUE" >> "$GITHUB_ENV"

      - name: 🚀 Trigger Build CLI
        id: triggerbuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW="${{ github.event.inputs.TARGETWORKFLOW }}"
          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"
          TIMESTART=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UNIQUE="${{ matrix.device }}-$(date +%s)"
          echo "Unique (Local Only)=$UNIQUE"
          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f MODE="${{ github.event.inputs.MODE }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f ROOTCOMMIT="${{ github.event.inputs.ROOTCOMMIT }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f LZ4NEON="${{ github.event.inputs.LZ4NEON }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LINUXCNTSYNC="${{ github.event.inputs.LINUXCNTSYNC }}" \
            -f NOMOUNT="${{ github.event.inputs.NOMOUNT }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f UNICODE="${{ github.event.inputs.UNICODE }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f DISABLEVENDORMODULE="${{ github.event.inputs.DISABLEVENDORMODULE }}" \
            -f PROFILE="${{ github.event.inputs.PROFILE }}"
          echo "⏳ Waiting for Run to Register..."
          sleep 3
          echo "⏳ Resolving Run ID via API..."
          RUNNAME="🟢 ${{ github.event.inputs.ROOTENGINE }} | ${{ matrix.device }}"       
          for _ in {1..30}; do
            RUNID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" \
              --jq '
                .workflow_runs
                | map(
                    select(
                      .name == "'"$RUNNAME"'" and
                      .created_at >= "'"$TIMESTART"'"
                    )
                  )
                | sort_by(.created_at)
                | .[0].id // empty
              ')  
            if [[ -n "$RUNID" ]]; then
              break
            fi
      
            sleep 2
          done
        
          if [[ -z "$RUNID" ]]; then
            echo "⚠️ Failed to Resolve Run ID"
            exit 1
          fi

          echo "✔️ Run ID=$RUNID"
          echo "RUNID=$RUNID" >> "$GITHUB_ENV"
          echo "runid=$RUNID" >> "$GITHUB_OUTPUT"

      - name: 🔍 Debug Run ID
        run: |
          set -euo pipefail
          RUNID="${{ steps.triggerbuild.outputs.runid }}"
          echo "Run ID (Environment Context): $RUNID"

      - name: 💾 Save Run ID
        run: |
          set -euo pipefail
          mkdir -p Meta
          echo "${{ matrix.device }}" > Meta/Device.txt
          RUNID="${{ steps.triggerbuild.outputs.runid }}"
          if [[ -z "${RUNID:-}" || "$RUNID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ Saving Run ID: $RUNID"
          echo "$RUNID" > Meta/Run-ID.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Meta-${{ matrix.device }}
          path: Meta/

  merge:
    name: 🔗 Merge Run IDs
    needs: dispatch
    runs-on: ubuntu-24.04
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: Meta

      - id: map
        run: |
          JSON="{}"
          for d in Meta/Meta-*; do
            [[ -d "$d" ]] || continue
            DEV=$(cat "$d/Device.txt")
            ID=$(cat "$d/Run-ID.txt")
            [[ -z "$ID" || "$ID" == "null" ]] && continue
            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  fetch:
    name: 📥 Fetch ${{ matrix.device }}
    needs: [merge, matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}

    steps:
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update -y
          sudo apt install -y gh jq

      - name: 🔍 Resolve Run ID
        id: resolverunid
        run: |
          MAP='${{ needs.merge.outputs.map }}'
          RESOLVERUNID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')
          [[ -z "$RESOLVERUNID" ]] && exit 1
          echo "RESOLVERUNID=$RESOLVERUNID" >> "$GITHUB_ENV"
          echo "resolverunid=$RESOLVERUNID" >> "$GITHUB_OUTPUT"

      - name: ⏳ Wait for Completion (40 Mins Max)
        run: |
          MAX=120
          SLEEP=20
          for ((i=1; i<=MAX; i++)); do
            DATA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ steps.resolverunid.outputs.resolverunid }}" || true)
            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)
            echo "$i/$MAX → $STATUS | $CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep "$SLEEP"
          done

          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          set -euo pipefail
          if [[ -z "${RESOLVERUNID:-}" || "${{ steps.resolverunid.outputs.resolverunid }}" == "null" ]]; then
            echo "⚠️ Run ID is Missing"
            exit 1
          fi

          echo "📥 Downloading Artifacts for Run ID=${{ steps.resolverunid.outputs.resolverunid }}"
          mkdir -p "artifacts/${{ matrix.device }}"
          gh run download "${{ steps.resolverunid.outputs.resolverunid }}" \
            --dir "artifacts/${{ matrix.device }}" \
            --repo "$GITHUB_REPOSITORY"

      # Save Device Build Summary Data For Combined Summary Table in Bundle Job
      - name: 📊 Save Device Build Summary Data
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          # Get Current Device Name and its Build Workflow Run ID
          DEVICE="${{ matrix.device }}"
          RUNID="${{ steps.resolverunid.outputs.resolverunid }}"
          # Count All Downloaded Artifact Files For This Device
          COUNT=$(find "artifacts/$DEVICE" -type f | wc -l | tr -d ' ')
          # Create Device-Specific Directory For Summary Metadata
          mkdir -p "summary/$DEVICE"
          # Save Device Name, Build Run ID, and Artifact Count
          # Bundle Job Will Use This Data to Generate One Combined Table
          {
            echo "DEVICE=$DEVICE"
            echo "RUNID=$RUNID"
            echo "COUNT=$COUNT"
          } > "summary/$DEVICE/summary.txt"
          # Print Summary Details to Current Job Log
          echo "📱 Device: $DEVICE"
          echo "🔗 Run ID: $RUNID"
          echo "📦 Artifacts: $COUNT"
          
      - name: 📤 Upload Device Summary Data
        uses: actions/upload-artifact@v7
        with:
          name: Summary-${{ matrix.device }}
          path: summary/${{ matrix.device }}/summary.txt
          if-no-files-found: error

      # Upload All Downloaded Build Artifacts For Device
      - name: 📤 Upload Final Device Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Final-${{ matrix.device }}
          path: artifacts/${{ matrix.device }}/
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: 📦 Bundle SM8750
    needs: fetch
    runs-on: ubuntu-24.04

    steps:
      - name: 📩 Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download Artifacts 
        uses: actions/download-artifact@v8
        with:
          path: bundle

      # Generate One Combined Device Build Summary Table in the Bundle Job

      # Generate One Combined Device Build Summary Table in the Bundle Job
      - name: 📊 Combined Device Build Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Build Run | Fetch Summary | Artifacts |"
            echo "|--------|-----------|---------------|-----------|"
            FOUND=false
            # Locate Each Downloaded Device Summary
            for FILE in bundle/Summary-*/summary.txt; do
              [[ -f "$FILE" ]] || continue
              # Read Metadata Without Executing Downloaded File
              DEVICE=$(sed -n 's/^DEVICE=//p' "$FILE" | head -n 1)
              RUNID=$(sed -n 's/^RUNID=//p' "$FILE" | head -n 1)
              COUNT=$(sed -n 's/^COUNT=//p' "$FILE" | head -n 1)
              # Validate Required Metadata
              if [[ -z "$DEVICE" || ! "$RUNID" =~ ^[0-9]+$ || ! "$COUNT" =~ ^[0-9]+$ ]]; then
                echo "⚠️ Invalid Summary Metadata: $FILE"
                continue
              fi

              # Link to Original Device Build
              RUNURL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUNID}"
              # Link to Dispatch and Fetch Workflow Run
              FETCHURL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "| ${DEVICE} | [View Build](${RUNURL}) | [View Fetch Run](${FETCHURL}) | ${COUNT} Files |"
              FOUND=true
              
            done

            # Report Missing Summary Artifacts
            if [[ "$FOUND" != true ]]; then
              echo "| No Summaries Found | — | — | — |"
              echo "⚠️ No Valid Device Summaries Found in Bundle/Summary-*/summary.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📂 Organize
        run: |
          mkdir -p Final
          for dir in bundle/Final-*; do
            [[ -d "$dir" ]] || continue
            dev=$(basename "$dir" | sed 's/^Final-//')
            mkdir -p "Final/$dev"
            cp -r "$dir"/. "Final/$dev/" || true
          done

      - name: ⚙️ Resolve Build Profile
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            Balance+GitRelease)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=true
              UNIQUE=true
              ;;
            Experimental)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              GITRELEASE=false
              UNIQUE=true
              ;;
          esac
          echo "CLEANSPACE=$CLEANSPACE" >> "$GITHUB_ENV"
          echo "BUILDCCACHE=$BUILDCCACHE" >> "$GITHUB_ENV"
          echo "GITRELEASE=$GITRELEASE" >> "$GITHUB_ENV"
          echo "UNIQUE=$UNIQUE" >> "$GITHUB_ENV"

      - name: 📝 Generate Release Notes
        shell: bash
        run: |
          RUN="${GITHUB_RUN_NUMBER}"
          cat > Release.txt <<EOF
          SM8750 Kernel Release
          ---
          Build: ${RUN}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          ---
          📦 Build Configuration
          ---
          📱 Devices :
          EOF

          for dir in Final/*; do
            [[ -d "$dir" ]] || continue
            printf '   - %s\n' "$(basename "$dir")" >> Release.txt
          done

          cat >> Release.txt <<EOF
          ---
          ☘️ KernelPatch                  : ${{ github.event.inputs.KERNELPATCH }}
          🔥 SUSFS                        : ${{ github.event.inputs.SUSFSREPOSITORY }}
          🔥 SUSFS Variant                : ${{ github.event.inputs.SUSFSVARIANT }}
          🔥 SUSFS Dev Branch             : ${{ github.event.inputs.SUSFSBRANCHDEV }}
          💾 Git Repository               : ${{ github.event.inputs.GITHUBREPOSITORY }}
          ---
          🧰 Root                         : ${{ github.event.inputs.ROOTENGINE }}
          🧰 Manager / Branch Source      : ${{ github.event.inputs.ROOTBRANCHSOURCE }}
          ---
          📎 LZ4 Upgrade + Neon           : ${{ github.event.inputs.LZ4NEON }}
          ---
          📱 Kernel Suffix                : ${{ github.event.inputs.SUFFIX }}
          📱 Kernel Sub-Level             : ${{ github.event.inputs.SUBLEVEL }}
          📱 Kernel Build Time            : ${{ github.event.inputs.BUILDTIME }}
          ---
          🔰 LSM-Baseband Guard           : ${{ github.event.inputs.LSMBBG }}
          📊 Linux Container Support      : ${{ github.event.inputs.LINUXCNTSYNC }}
          ---
          🔨 Netfilter IP Set / IPv6 NAT  : ${{ github.event.inputs.NETFILTER }}
          🛜 TCP Congestion Control       : ${{ github.event.inputs.TCPALGORITHM }}
          ---
          🔠 Unicode Bypass               : ${{ github.event.inputs.UNICODE }}
          🚀 Hmbird / Windspeed           : ${{ github.event.inputs.WINDSPEED }}
          ---
          ⛓️‍💥 Re-Kernel                    : ${{ github.event.inputs.REKERNEL }}
          ---
          🔧 Clean Build Space            : ${CLEANSPACE}
          🔧 Compiler Cache               : ${BUILDCCACHE}
          ---

          ### 📋 Installation Guide

          #### **Download the ZIP File**
          - Navigate to the Release Page and Download the Correct ZIP File for Your Device and Kernel Version
          - Ensure You Select the File That Matches Your Device Model and the Kernel Version You're Installing

          ---

          #### **Prepare Your Device**
          - Make Sure Your Device Has an **Unlocked Bootloader** and a Compatible Custom Recovery (AERA Recovery Project or OrangeFox)
          - It's Recommended to **Back Up Your Data** Before Proceeding to Avoid Data Loss

          ---

          #### **Installation via Recovery**
          - Reboot Your Device into **Recovery Mode** (TWRP, OrangeFox, etc.).
          - In the Recovery Menu, Select **Install** and Navigate to the Downloaded ZIP File
          - Select the ZIP File and Swipe to Confirm Installation
          - After Installation Completes, Reboot Your Device Into the System

          ---

          #### **Installation via KernelFlasher**
          - **Download KernelFlasher**: Get the App from [KernelFlasher GitHub](https://github.com/fatalcoder524/KernelFlasher)
          - **Launch KernelFlasher**: Open the App and Make Sure Your Device is Rooted
          - **Select Kernel**: Choose the Downloaded Kernel ZIP File
          - **Flash the Kernel**: Follow the Prompts to Flash the Kernel
          - **Reboot**: Reboot Your Device Into the System

          ---

          #### **Installation via Horizon Flasher**
          - **Download Horizon Flasher**: Get the App From [HorizonKernelFlasher GitHub](https://github.com/libxzr/HorizonKernelFlasher/releases)
          - **Install and Launch**: Install the App and Select the Downloaded Kernel ZIP File
          - **Flash**: Follow On-Screen Instructions to Flash the Kernel
          - **Reboot**: Reboot System When Prompted

          ---

          #### **Troubleshooting**
          - **Bootloop**: If Your Device Gets Stuck in a Bootloop, Restore a Known-Good Kernel or Flash the Stock Boot Image. Clear Cache Only if Recommended For Your ROM
          - **Kernel Panic**: Verify Kernel and Device Compatibility, and Check for Required Device-Specific Patches.
          - **System Fails to Boot**: Restore a Compatible Boot Image Through Recovery or Fastboot, Do Not Reflash Recovery Unless Recovery Itself is Damaged

          ---

          #### **Additional Tips**
          - **Root Access**: If You Need Root Access, Ensure Your Selected Root Solution (Such as \`SukiSU-Ultra\` or \`BakaSU\`) is Properly Installed and Follow its Official Documentation
          - **Back Up Your Current Boot Image** Before Flashing Any Custom Kernel

          ---

          #### **Common Issue: Kernel Does Not Boot**
          - Make Sure You Are Using a Kernel Compatible With Your Device
          - Review Device-Specific Kernel Settings and Required Patches
          - If Device Cannot Boot, Restore Your Previously Working Boot Image

          ---

          #### **After Installation**
          - Verify Installed Kernel Version and Root Access Using Suitable Checker Apps or Commands
          - Enjoy New Kernel Features and Enhancements

          ---
          EOF

          echo "Release Notes Generated Successfully : Release.txt"
    
      - name: 🗜️ Create Zip
        id: createzip
        run: |
          ZIP="Kernel-Bundle.zip"
          zip -r "$ZIP" Final
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
    
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-Bundle
          path: ${{ steps.createzip.outputs.zip }}

      - name: 🏷️ Generate Release Tag (Channel Aware)
        run: |
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable"
              ;;
            beta)
              TAG="SM8750-Beta"
              ;;
            nightly|*)
              TAG="SM8750-Nightly"
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: 🚀 Publish Channel-Based Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          # Define Target Repository, Release Channel, and Workflow Run Number
          REPO="$GITHUB_REPOSITORY"
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
          # Configure Release Tag and Publication Settings For Each Channel
          case "${CHANNEL,,}" in
            stable)
              TAG="SM8750-Stable"
              PRERELEASE=false
              LATEST=true
              ;;
            beta)
              TAG="SM8750-Beta"
              PRERELEASE=true
              LATEST=false
              ;;
            nightly|*)
              TAG="SM8750-Nightly"
              PRERELEASE=true
              LATEST=false
              ;;
          esac
          # Set Release Title Using Selected Release Channel
          TITLE="🚀 OnePlus SM8750 ${CHANNEL}"
          # Display repository and release information for debugging.
          echo "📦 Repository: $REPO"
          echo "🏷️ Release Tag: $TAG"
          gh auth status
          # Stop Workflow if Release Notes File is Missing or Empty
          [[ -s "./Release.txt" ]] || {
            echo "⚠️ Release.txt is Missing / Empty"
            exit 1
          }          
          # Do Not Upload Kernel-Bundle.zip or Scan Unrelated Workspace Directories                   
          # Collect ZIP Files From Final/ and Skip Duplicate Asset File Names
          declare -A SEENNAME=()
          ASSETS=()
          # Process ZIP Files in Deterministic Order
          while IFS= read -r -d '' ZIP; do
            NAME="$(basename "$ZIP")"
            # Skip Duplicate File Names Regardless of Their Contents
            if [[ -n "${SEENNAME[$NAME]+x}" ]]; then
              echo "⏭️ Duplicate File Names Detected; Skipping: $NAME"
              echo "   Original : ${SEENNAME[$NAME]}"
              echo "   Skipped  :  $ZIP"
              continue
            fi

            # Register File Names and Stage First Occurrence
            SEENNAME["$NAME"]="$ZIP"
            DEST="$RUNNER_TEMP/$NAME"
            cp "$ZIP" "$DEST"
            ASSETS+=("$DEST")
            echo "📦 Staged: $NAME"
       
          done < <(find Final -type f -name "*.zip" -print0 | sort -z)

          # Stop if No Eligible ZIP Files Were Found
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "⚠️ No Device ZIP Files Found in Final Bundle"
            exit 1
          fi

          # Print List of Assets That Will be Uploaded
          echo "📋 ZIP files to upload:"
          printf '  %s\n' "${ASSETS[@]}"
          # Check Whether Channel Release Already Exists
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Update Existing Release Metadata Without Deleting its Assets
            echo "♻️ Release Wxists; Updating Metadata..."
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file Release.txt \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          else
            # Create Release Without Attaching Assets During Creation
            echo "🚀 Creating Release: $TAG"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file Release.txt \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          fi

          # Initialize Counters for Sequential Asset Uploads
          TOTAL=${#ASSETS[@]}
          INDEX=0
          # Upload Each ZIP Separately to Avoid a Single Multi-File Upload Operation
          for ZIP in "${ASSETS[@]}"; do
            # Increment Counter and Display Current Asset Being Uploaded
            INDEX=$((INDEX + 1))
            echo "⬆️ [$INDEX/$TOTAL] Uploading: $(basename "$ZIP")"
            # Upload Current ZIP to Release
            # Clobber Replaces an Existing Asset With the Same File Name
            gh release upload "$TAG" "$ZIP" \
              --repo "$REPO" \
              --clobber
            # Report Success Only After GitHub Confirms Upload Completed
            echo "🎉 [$INDEX/$TOTAL] Uploaded: $(basename "$ZIP")"
            
          done

          # Print Final Result and Display Published Release Details
          echo "🎉 All $TOTAL ZIP Files Uploaded Successfully!"
          gh release view "$TAG" --repo "$REPO"
