name: ☘️ Dispatch & Fetch SM8750
on:
  workflow_dispatch:
    inputs:
      TARGETWORKFLOW:
        type: choice
        description: "Workflow to Trigger"
        required: true
        default: Main.yml
        options:
          - Main.yml
      RELEASECHANNEL:
        type: choice
        description: "Release Channel (Stable / Beta / Nightly)"
        required: true
        default: Nightly
        options:
          - Stable
          - Beta
          - Nightly
      KERNELPATCH:
        type: choice
        description: "KernelPatch Implementation Method"
        required: true
        default: KPN
        options:
          - KPM
          - KPN
          - None
      GITHUBREPOSITORY:
        type: string
        description: "Compiler / Owner"
        required: true
        default: "AndreiMikh"
      BUILDTIME:
        type: string
        description: "Custom Build Time (Input 'F' to Use Current UTC Time)"
        required: false
        default: "Mon Aug 3 07:07:07 UTC 2026"
      ROOTENGINE:
        type: choice
        description: "KSU Manager"
        required: true
        default: BakaSU
        options:
          - BakaSU
          - KernelSU-Next
          - SukiSU-Ultra
          - KernelSU
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: BakaSU-Main
        options:
          - BakaSU-Main
          - BakaSU-Dev
          - KernelSU-Next-Dev-SUSFS
          - SukiSU-Ultra-Builtin
          - KernelSU-Main
      SUSFSREPOSITORY:
        type: string
        description: "Rollback SUSFS Revision (Enter Hash or Number or -1 to Turn Off)"
        required: false
        default: ""
      SUSFSVARIANT:
        type: choice
        description: "SUSFS-OGKI, Only Available for Version: A14-6.1, A15-6.6 & A16-6.12, SUSFS for OPlus Kernel Image (SUSFSOKI) / SUSFS for KernelSU (SUSFSKSU)"
        required: true
        default: GKI
        options:
          - OGKI
          - GKI
      SUSFSBRANCHDEV:
        type: boolean
        description: "Extract and Apply SUSFS Development Branch?"
        required: true
        default: false
      LZ4NEON:
        type: choice
        description: "LZ4 1.10.0 / ZSTD 1.5.7?"
        required: false
        default: LZ4-1.10.0-Patch-Update
        options:
          - LZ4-1.10.0-Patch-Update
          - None
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Use Random String if Not Specified)"
        required: false
        default: "flamingsakura-hiyuki"
      SUBLEVEL:
        type: string
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""
      LSMBBG:
        type: boolean
        description: "Critical Partition Write Protection (Linux Security Module)"
        required: true
        default: true
      LINUXCNTSYNC:
        type: choice
        description: "NTSynchonization Primitives / DroidSpaces Linux Container Support"
        required: true
        default: DroidSpaces+NTSync
        options:
          - DroidSpaces+NTSync
          - None
      NOMOUNT:
        type: choice
        description: "NoMount Built-in Integration"
        required: true
        default: NoMount
        options:
          - NoMount
          - NoMount-Dev
          - NoMount-Suite
          - None
      NETFILTER:
        type: boolean
        description: "Network Feature Extensions (NetFilter)"
        required: true
        default: true
      TCPALGORITHM:
        type: choice
        description: "Network Optimization Algorithm (BBR + ECN)"
        required: true
        default: BBRV1+BBRV3+ECN
        options:
          - BBRV1+ECN
          - BBRV1+BBRV3+ECN
          - BBRV1+ECN+Brutal
          - BBRV1+BBRV3+ECN+Brutal
          - None
      UNICODE:
        type: boolean
        description: "Fix for Unicode Invisible Code Point Bypass Read Vulnerability"
        required: true
        default: true
      WINDSPEED:
        type: boolean
        description: "Hmbird / Windspeed (Oryon Platform SM-8750)"
        required: true
        default: true
      REKERNEL:
        type: choice
        description: "Re-Kernel Support"
        required: true
        default: Built-in
        options:
          - Built-in
          - Module
          - None
      DISABLEVENDORMODULE:
        type: boolean
        description: "Enable Vendor Module(s) Blacklist"
        required: true
        default: false
      PROFILE:
        type: choice
        description: "Performance = (XUS - Enabled | Space Clean - Disabled | Compiler Cache - Enabled)"
        required: true
        default: Balance
        options:
          - Balance
          - Balance+GitRelease
          - Experimental
          - Disable

concurrency:
  group: sm8750-${{ github.event.inputs.RELEASECHANNEL }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  matrix:
    name: 📱 Generate Device Matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.out.outputs.devices }}

    steps:
      - id: out
        run: |
          DEVICES=(
            1+Ace5Pro
            1+13-China
            1+13
            1+13T
            1+13S
            1+Pad2Pro
            1+Pad3
            1+Ace6
          )
          echo "devices=$(printf '%s\n' "${DEVICES[@]}" | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  dispatch:
    name: 🚀 Dispatch ${{ matrix.device }}
    needs: matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices) }}

    steps:
      - name: 📩 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update
          sudo apt install -y gh jq

      - name: ⚙️ Set Build Profile Flags
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            Balance+GitRelease)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=true
              UNIQUE=true
              ;;
            Experimental)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              GITRELEASE=false
              UNIQUE=true
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
          esac
          echo "PROFILE=$PROFILE"
          echo "CLEANSPACE=$CLEANSPACE"
          echo "BUILDCCACHE=$BUILDCCACHE"
          echo "XUS=$XUS"
          echo "GITRELEASE=$GITRELEASE"
          echo "UNIQUE=$UNIQUE"
          echo "CLEANSPACE=$CLEANSPACE" >> "$GITHUB_ENV"
          echo "BUILDCCACHE=$BUILDCCACHE" >> "$GITHUB_ENV"
          echo "XUS=$XUS" >> "$GITHUB_ENV"
          echo "GITRELEASE=$GITRELEASE" >> "$GITHUB_ENV"
          echo "UNIQUE=$UNIQUE" >> "$GITHUB_ENV"

      - name: 🚀 Trigger Build CLI
        id: triggerbuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW="${{ github.event.inputs.TARGETWORKFLOW }}"
          echo "🚀 Dispatching: $WORKFLOW for ${{ matrix.device }}"
          TIMESTART=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UNIQUE="${{ matrix.device }}-$(date +%s)"
          echo "Unique (Local Only)=$UNIQUE"
          gh workflow run "$WORKFLOW" \
            --ref LiquidAndrei \
            -f FILE="${{ matrix.device }}" \
            -f KERNELPATCH="${{ github.event.inputs.KERNELPATCH }}" \
            -f SUSFSREPOSITORY="${{ github.event.inputs.SUSFSREPOSITORY }}" \
            -f GITHUBREPOSITORY="${{ github.event.inputs.GITHUBREPOSITORY }}" \
            -f BUILDTIME="${{ github.event.inputs.BUILDTIME }}" \
            -f ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}" \
            -f ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}" \
            -f SUSFSVARIANT="${{ github.event.inputs.SUSFSVARIANT }}" \
            -f LZ4NEON="${{ github.event.inputs.LZ4NEON }}" \
            -f SUFFIX="${{ github.event.inputs.SUFFIX }}" \
            -f SUBLEVEL="${{ github.event.inputs.SUBLEVEL }}" \
            -f LSMBBG="${{ github.event.inputs.LSMBBG }}" \
            -f LINUXCNTSYNC="${{ github.event.inputs.LINUXCNTSYNC }}" \
            -f NETFILTER="${{ github.event.inputs.NETFILTER }}" \
            -f TCPALGORITHM="${{ github.event.inputs.TCPALGORITHM }}" \
            -f UNICODE="${{ github.event.inputs.UNICODE }}" \
            -f WINDSPEED="${{ github.event.inputs.WINDSPEED }}" \
            -f SUSFSBRANCHDEV="${{ github.event.inputs.SUSFSBRANCHDEV }}" \
            -f REKERNEL="${{ github.event.inputs.REKERNEL }}" \
            -f PROFILE="${{ github.event.inputs.PROFILE }}"
          echo "⏳ Waiting for Run to Register..."
          sleep 3
          echo "⏳ Resolving Run ID via API..."
          RUNID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs" \
            | jq -r --arg time "$TIMESTART" '
                .workflow_runs
                | map(select(.created_at > $time))
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty
              ')
          if [[ -z "$RUNID" ]]; then
            echo "⚠️ Failed to Resolve Run ID"
            exit 1
          fi

          echo "✔️ Run ID=$RUNID"
          echo "RUNID=$RUNID" >> "$GITHUB_ENV"
          echo "runid=$RUNID" >> "$GITHUB_OUTPUT"

      - name: 🔍 Debug Run ID
        run: |
          set -euo pipefail
          RUNID="${{ steps.triggerbuild.outputs.runid }}"
          echo "Run ID (Environment Context): $RUNID"

      - name: 💾 Save Run ID
        run: |
          set -euo pipefail
          mkdir -p Meta
          echo "${{ matrix.device }}" > Meta/Device.txt
          RUNID="${{ steps.triggerbuild.outputs.runid }}"
          if [[ -z "${RUNID:-}" || "$RUNID" == "null" ]]; then
            echo "⚠️ Failed to Get Run ID"
            exit 1
          fi

          echo "✔️ Saving Run ID: $RUNID"
          echo "$RUNID" > Meta/Run-ID.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Meta-${{ matrix.device }}
          path: Meta/

  merge:
    name: 🔗 Merge Run IDs
    needs: dispatch
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.map.outputs.map }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: Meta

      - id: map
        run: |
          JSON="{}"
          for d in Meta/Meta-*; do
            [[ -d "$d" ]] || continue
            DEV=$(cat "$d/Device.txt")
            ID=$(cat "$d/Run-ID.txt")
            [[ -z "$ID" || "$ID" == "null" ]] && continue
            JSON=$(echo "$JSON" | jq --arg d "$DEV" --arg i "$ID" '. + {($d): $i}')
          done

          echo "map=$(echo "$JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  fetch:
    name: 📥 Fetch ${{ matrix.device }}
    needs: [merge, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    if: ${{ needs.merge.outputs.map != '' && needs.merge.outputs.map != '{}' }}

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix.outputs.devices || '[]') }}

    steps:
      - name: ⚙️ Setup GH CLI
        run: |
          sudo apt update -y
          sudo apt install -y gh jq

      - name: 🔍 Resolve Run ID
        id: resolverunid
        run: |
          MAP='${{ needs.merge.outputs.map }}'
          RESOLVERUNID=$(echo "$MAP" | jq -r --arg d "${{ matrix.device }}" '.[$d] // empty')
          [[ -z "$RESOLVERUNID" ]] && exit 1
          echo "RESOLVERUNID=$RESOLVERUNID" >> "$GITHUB_ENV"
          echo "resolverunid=$RESOLVERUNID" >> "$GITHUB_OUTPUT"

      - name: ⏳ Wait for Completion (40 Mins Max)
        run: |
          MAX=120
          SLEEP=20
          for ((i=1; i<=MAX; i++)); do
            DATA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ steps.resolverunid.outputs.resolverunid }}" || true)
            STATUS=$(echo "$DATA" | jq -r .status)
            CONCLUSION=$(echo "$DATA" | jq -r .conclusion)
            echo "$i/$MAX → $STATUS | $CONCLUSION"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] && exit 0
              echo "⚠️ Failed: $CONCLUSION"
              exit 1
            fi

            sleep "$SLEEP"
          done

          echo "⚠️ Timeout"
          exit 1

      - name: 📦 Download Artifacts
        run: |
          set -euo pipefail
          if [[ -z "${RESOLVERUNID:-}" || "${{ steps.resolverunid.outputs.resolverunid }}" == "null" ]]; then
            echo "⚠️ Run ID is Missing"
            exit 1
          fi

          echo "📥 Downloading Artifacts for Run ID=${{ steps.resolverunid.outputs.resolverunid }}"
          mkdir -p "artifacts/${{ matrix.device }}"
          gh run download "${{ steps.resolverunid.outputs.resolverunid }}" \
            --dir "artifacts/${{ matrix.device }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: 📊 Device Build Summary
        run: |
          COUNT=$(find "artifacts/${{ matrix.device }}" -type f | wc -l)
          {
            echo "## 📱 Device Build Summary"
            echo ""
            echo "| Device | Run | Artifacts |"
            echo "|--------|-----|-----------|"
            echo "| ${{ matrix.device }} | [View](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.resolverunid.outputs.resolverunid }}) | $COUNT File(s) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Final-${{ matrix.device }}
          path: artifacts/${{ matrix.device }}

  bundle:
    name: 📦 Bundle SM8750
    needs: fetch
    runs-on: ubuntu-latest

    steps:
      - name: 📩 Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: 📂 Organize
        run: |
          mkdir -p Final
          for dir in bundle/Final-*; do
            [[ -d "$dir" ]] || continue
            dev=$(basename "$dir" | sed 's/^Final-//')
            mkdir -p "Final/$dev"
            cp -r "$dir"/. "Final/$dev/" || true
          done

      - name: ⚙️ Resolve Build Profile
        run: |
          PROFILE="${{ github.event.inputs.PROFILE }}"
          case "$PROFILE" in
            Balance)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            Balance+GitRelease)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=true
              UNIQUE=true
              ;;
            Experimental)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=true
              GITRELEASE=false
              UNIQUE=true
              ;;
            Disable)
              CLEANSPACE=false
              BUILDCCACHE=false
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
            *)
              echo "⚠️ Unknown Profile: $PROFILE"
              CLEANSPACE=false
              BUILDCCACHE=true
              XUS=false
              GITRELEASE=false
              UNIQUE=true
              ;;
          esac
          echo "CLEANSPACE=$CLEANSPACE" >> "$GITHUB_ENV"
          echo "BUILDCCACHE=$BUILDCCACHE" >> "$GITHUB_ENV"
          echo "XUS=$XUS" >> "$GITHUB_ENV"
          echo "GITRELEASE=$GITRELEASE" >> "$GITHUB_ENV"
          echo "UNIQUE=$UNIQUE" >> "$GITHUB_ENV"

      - name: 📝 Generate Release Notes
        run: |
          RUN="${GITHUB_RUN_NUMBER}"
          cat > Release.txt <<EOF
          SM8750 Kernel Release
          ---
          Build: ${RUN}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          ---
          📦 Build Configuration
          ---
          📞 Devices:
          EOF
          for dir in Final/*; do
            [[ -d "$dir" ]] || continue
            echo "   - $(basename "$dir")" >> Release.txt
          done

          cat >> Release.txt <<EOF
          ☘️ KernelPatch                  : ${{ github.event.inputs.KERNELPATCH }}
          🔥 SUSFS                        : ${{ github.event.inputs.SUSFSREPOSITORY }}
          🔥 SUSFS Variant                : ${{ github.event.inputs.SUSFSVARIANT }}
          🔥 SUSFS Dev Branch             : ${{ github.event.inputs.SUSFSBRANCHDEV }}
          💾 Git Repository               : ${{ github.event.inputs.GITHUBREPOSITORY }}
          ---
          🧰 Root                         : ${{ github.event.inputs.ROOTENGINE }}
          🧰 Manager / Branch Source      : ${{ github.event.inputs.ROOTBRANCHSOURCE }}
          ---
          📎 LZ4 Upgrade + Neon           : ${{ github.event.inputs.LZ4NEON }}
          ---
          📱 Kernel Suffix                : ${{ github.event.inputs.SUFFIX }}
          📱 Kernel Sub-Level             : ${{ github.event.inputs.SUBLEVEL }}
          📱 Kernel Build Time            : ${{ github.event.inputs.BUILDTIME }}
          ---
          🔰 LSM-Baseband Guard           : ${{ github.event.inputs.LSMBBG }}
          📊 Linux Container Support      : ${{ github.event.inputs.LINUXCNTSYNC }}
          ---
          🔨 Netfilter IP Set / IPv6 NAT  : ${{ github.event.inputs.NETFILTER }}
          🛜 TCP Congestion Control       : ${{ github.event.inputs.TCPALGORITHM }}
          ---
          🔠 Unicode Bypass               : ${{ github.event.inputs.UNICODE }}
          🚀 Hmbird / Windspeed           : ${{ github.event.inputs.WINDSPEED }}
          ---
          ⚙️ XUS Error Fix                : ${XUS}
          ⛓️‍💥 Re-Kernel                  : ${{ github.event.inputs.REKERNEL }}
          ---
          🔧 Clean Build Space            : ${CLEANSPACE}
          🔧 Compiler Cache               : ${BUILDCCACHE}
          ---
          ### 📋 Installation Guide:
          #### **Download the Zip File**
               - Navigate to the Release Page and Download the Correct Zip File for your Device and Kernel Version
               - Ensure that you Select the File that Matches your Device's Model and the Kernel Version you're Installing
          ---
          #### **Prepare Your Device**
               - Make sure your Device has an **Unlocked Bootloader** and a Compatible Custom Recovery (TWRP or OrangeFox)
               - It's Recommended to **Backup your Data** Before Proceeding with the Installation to Avoid any Loss
          ---
          #### **Install through Recovery Tool**
               - Reboot your device into **Recovery Mode** (TWRP/OrangeFox/etc.).
               - In the Recovery Menu, Select **Install** and Navigate to the Downloaded Zip File
               - Select the Downloaded Zip File and Swipe to Confirm Installation
               - After the Installation Completes, Reboot your Device into the System
          ---
          #### **Installation via KernelFlasher App**
               - **Download KernelFlasher**: Get the **KernelFlasher** App from [KernelFlasher GitHub](https://github.com/fatalcoder524/KernelFlasher)
               - **Launch KernelFlasher**: Open the App and Make Sure your **Device is Rooted**
               - **Select Kernel**: Choose the Downloaded **Kernel Zip** File within the App
               - **Flash the Kernel**: Follow the Prompts to Flash the Kernel Directly onto the Device
               - **Reboot**: After Flashing, the App will Reboot the Device into the System
          ---
          #### **Installation via Horizon Flasher App**
               - **Download Horizon Flasher**: Download the **Horizon Flasher App** from [HorizonKernelFlasher GitHub](https://github.com/libxzr/HorizonKernelFlasher/releases)
               - **Install the App**: Once the App is Installed, Launch it and Select the **Downloaded Kernel Zip** File
               - **Flash**: App will Automatically Flash the Kernel for you. It may Take some Time, Depending on the Size of the Kernel File
               - **Reboot the System**: After Flashing, App will Prompt you to Reboot. Follow the On-Screen Instructions to Reboot the System

          ---
          #### **For Troubleshooting**
               - If you Encounter any Issues with the Installation or Booting, Here are some Common Fixes:
                 - **Bootloops**: If your Device is Stuck in a Bootloop after Installation, Try Clearing the Cache and Dalvik Cache from the Recovery Menu
                 - **Kernel Panic**: This may occur if the device is incompatible with the Kernel. Try Reverting to a Different Kernel Version or Check for Device-Specific Patches
                 - **Stuck on Recovery**: If you can't Boot into the System after Installation, Reflash the Recovery and Reattempt the Installation
          ---
          #### **Additional Tips**
               - **Root Access**: If you Need Root Access, Ensure that the Corresponding Root Manager (\`SukiSU-Ultra\`, \`ReSukiSU\`, Etc.) is Installed after Flashing the Kernel. Follow the Specific Instructions Provided by the Root Manager's Documentation
          ---
          #### **Common Issues and Fixes**
               - **Issue - Kernel Does Not Boot**:
                 - Fix: Make Sure you are Using a Kernel Compatible with your Device, Review the Device-Specific Kernel Settings or Check if there are any Custom Patches Required for your Device Model
          ---
          #### **After Installation**
               - Once Installed, you can Verify the Kernel Version and Root Access by Using a Kernel Checker App or a Root Checker App from the Play Store
               - Enjoy the New Kernel Features and Enhancements Designed to Improve your Device's Performance
          ---
          EOF

      - name: 🗜️ Create Zip
        id: createzip
        run: |
          ZIP="Kernel-Bundle.zip"
          zip -r "$ZIP" Final
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v8
        with:
          name: Kernel-Bundle
          path: ${{ steps.createzip.outputs.zip }}

      - name: 🏷️ Generate Release Tag (Channel Aware)
        run: |
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable"
              ;;
            beta)
              TAG="SM8750-Beta"
              ;;
            nightly|*)
              TAG="SM8750-Nightly"
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: 🚀 Publish Channel-Based Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "Repo: $GITHUB_REPOSITORY"
          gh auth status || true
          gh repo view "$GITHUB_REPOSITORY" || true
          CHANNEL="${{ github.event.inputs.RELEASECHANNEL }}"
          RUN="${GITHUB_RUN_NUMBER}"
          CHANNELLOWER=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          case "$CHANNELLOWER" in
            stable)
              TAG="SM8750-Stable"
              PRERELEASE="false"
              LATEST="true"
              ;;

            beta)
              TAG="SM8750-Beta"
              PRERELEASE="true"
              LATEST="false"
              ;;

            nightly|*)
              TAG="SM8750-Nightly"
              PRERELEASE="true"
              LATEST="false"
              ;;
          esac
          echo "TAG=$TAG"
          TITLE="🚀 SM8750 ${CHANNEL} | Build Number ${RUN}"
          echo "🔍 Scanning Release Assets..."
          ASSETS=()
          ZIPBUNDLE=$(find . -type f -name "Kernel-Bundle.zip" | head -n 1)
          if [[ -z "$ZIPBUNDLE" || ! -s "$ZIPBUNDLE" ]]; then
            echo "⚠️ Missing Bundle Zip"
            exit 1
          fi

          ASSETS+=("$ZIPBUNDLE")
          echo "📦 Bundle: $ZIPBUNDLE"
          echo "📦 Collecting Final Device Zips..."
          while IFS= read -r zip; do
            ASSETS+=("$zip")
          done < <(
            find . -type f -name "*.zip" \
              ! -name "Kernel-Bundle.zip" \
              | sort
          )
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "⚠️ No Release Assets Found"
            exit 1
          fi

          echo "📦 Assets to Upload:"
          printf '%s\n' "${ASSETS[@]}"
          if [[ ! -s Release.txt ]]; then
            echo "⚠️ Release.txt is missing"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "♻️ Release Exists → Updating Assets"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              "${ASSETS[@]}" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file Release.txt \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          else
            echo "🚀 Release Does Not Exist → Creating Release"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file Release.txt \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST" \
              "${ASSETS[@]}"
          fi
