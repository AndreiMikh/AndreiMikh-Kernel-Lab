name: Verify SukiSU-Ultra Builtin SUSFS Integration

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: SukiSU-Ultra source ref to verify
        required: true
        default: builtin
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: verify-sukisu-builtin-susfs
  cancel-in-progress: false

jobs:
  verify-builtin-susfs:
    name: Verify native SukiSU-Ultra SUSFS integration
    runs-on: ubuntu-latest

    env:
      SUKISU_REPOSITORY: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
      SUKISU_REF: ${{ inputs.sukisu_ref || 'builtin' }}

    steps:
      - name: Checkout SukiSU-Ultra Builtin
        shell: bash
        run: |
          set -euo pipefail

          git clone --no-tags --single-branch --branch "$SUKISU_REF" \
            "$SUKISU_REPOSITORY" "$RUNNER_TEMP/SukiSU-Ultra"

          SUKISU_DIR="$RUNNER_TEMP/SukiSU-Ultra"
          SUKISU_SHA="$(git -C "$SUKISU_DIR" rev-parse HEAD)"

          echo "SUKISU_DIR=$SUKISU_DIR" >> "$GITHUB_ENV"
          echo "SUKISU_SHA=$SUKISU_SHA" >> "$GITHUB_ENV"

          echo "SukiSU ref: $SUKISU_REF"
          echo "SukiSU commit: $SUKISU_SHA"

      - name: Verify SUSFS is already integrated in Builtin
        shell: bash
        run: |
          set -euo pipefail

          KCONFIG="$SUKISU_DIR/kernel/Kconfig"
          MAIN="$SUKISU_DIR/kernel/ksu_main.c"
          ADB_ROOT="$SUKISU_DIR/kernel/feature/adb_root.c"
          SUCOMPAT="$SUKISU_DIR/kernel/feature/sucompat.c"
          UMOUNT="$SUKISU_DIR/kernel/feature/kernel_umount.c"

          for file in "$KCONFIG" "$MAIN" "$ADB_ROOT" "$SUCOMPAT" "$UMOUNT"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required Builtin source file is missing: $file"
              exit 1
            fi
          done

          grep -qE '^[[:space:]]*config KSU_SUSFS$' "$KCONFIG" || {
            echo "::error::Builtin Kconfig does not define CONFIG_KSU_SUSFS."
            exit 1
          }

          grep -q 'susfs_init();' "$MAIN" || {
            echo "::error::SUSFS initialization call is missing from kernel/ksu_main.c."
            exit 1
          }

          grep -q 'susfs_starts_with' "$ADB_ROOT" || {
            echo "::error::SUSFS-aware ADB root path handling is missing."
            exit 1
          }

          grep -q 'ksu_adb_root_handle_execveat' "$SUCOMPAT" || {
            echo "::error::SUSFS-compatible ADB root execveat integration is missing."
            exit 1
          }

          grep -q 'CONFIG_KSU_SUSFS' "$UMOUNT" || {
            echo "::error::SUSFS-specific umount handling is missing."
            exit 1
          }

          echo "All native Builtin SUSFS integration checks passed."

      - name: Create verification report
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/susfs-report"
          {
            echo "SukiSU-Ultra Builtin SUSFS verification"
            echo
            echo "- Repository: $SUKISU_REPOSITORY"
            echo "- Ref: $SUKISU_REF"
            echo "- Commit: $SUKISU_SHA"
            echo "- CONFIG_KSU_SUSFS: present"
            echo "- susfs_init(): present"
            echo "- SUSFS-aware ADB root handling: present"
            echo "- SUSFS-compatible execveat integration: present"
            echo "- SUSFS-specific umount handling: present"
            echo
            echo "Result: native Builtin integration verified."
            echo
            echo "The KernelSU-targeted 10_enable_susfs_for_ksu.patch is intentionally not applied."
            echo "Builtin already contains the SukiSU-specific SUSFS removals, replacements, hooks, and initialization."
            echo "Apply the separate kernel-side SUSFS patch and SUSFS source/header files to the common kernel as required by the selected kernel version."
            echo
            echo "This workflow verifies source integration only; it does not perform a kernel build or runtime test."
          } > "$RUNNER_TEMP/susfs-report/report.txt"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Builtin-SUSFS-Verification
          path: ${{ runner.temp }}/susfs-report/report.txt
          if-no-files-found: ignore
          retention-days: 14
