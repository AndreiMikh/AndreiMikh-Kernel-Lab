name: Sync SukiSU-Ultra SUSFS Patch

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: SUSFS4KSU branch to use as the source of truth
        required: true
        default: gki-android15-6.6
        type: choice
        options:
          - gki-android15-6.6
          - gki-android14-6.1
          - gki-android16-6.12
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sukisu-susfs-patch
  cancel-in-progress: false

jobs:
  sync-patch:
    name: Port the upstream SUSFS patch to SukiSU-Ultra
    runs-on: ubuntu-latest

    env:
      SUKISU_REPOSITORY: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
      SUKISU_REF: main
      SUSFS_REPOSITORY: https://github.com/AndreiMikh/susfs4ksu.git
      SUSFS_BRANCH: ${{ inputs.susfs_branch || 'gki-android15-6.6' }}
      SUSFS_PATCH_RELATIVE: kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
      OUTPUT_PATCH: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
      TARGET_BRANCH: LiquidAndrei

    steps:
      - name: Checkout kernel repository
        uses: actions/checkout@v4
        with:
          ref: LiquidAndrei
          fetch-depth: 0

      - name: Fetch SUSFS source-of-truth patch
        id: susfs
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_DIR="$RUNNER_TEMP/susfs4ksu"
          git clone --no-checkout "$SUSFS_REPOSITORY" "$SUSFS_DIR"
          git -C "$SUSFS_DIR" fetch --no-tags origin "$SUSFS_BRANCH"
          git -C "$SUSFS_DIR" checkout --detach FETCH_HEAD

          SUSFS_SHA="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
          SUSFS_PATCH="$SUSFS_DIR/$SUSFS_PATCH_RELATIVE"

          if [[ ! -s "$SUSFS_PATCH" ]]; then
            echo "::error::Upstream SUSFS patch not found: $SUSFS_PATCH_RELATIVE on $SUSFS_BRANCH"
            find "$SUSFS_DIR/kernel_patches/KernelSU" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          grep -q '^diff --git ' "$SUSFS_PATCH" || {
            echo "::error::The upstream SUSFS patch is not a Git-format patch."
            exit 1
          }

          echo "sha=$SUSFS_SHA" >> "$GITHUB_OUTPUT"
          echo "patch=$SUSFS_PATCH" >> "$GITHUB_OUTPUT"
          echo "SUSFS source branch: $SUSFS_BRANCH"
          echo "SUSFS source commit: $SUSFS_SHA"
          echo "SUSFS source patch: $SUSFS_PATCH_RELATIVE"

      - name: Fetch SukiSU-Ultra main
        id: sukisu
        shell: bash
        run: |
          set -euo pipefail

          git clone --no-checkout --branch "$SUKISU_REF" "$SUKISU_REPOSITORY" "$RUNNER_TEMP/SukiSU-Ultra"
          git -C "$RUNNER_TEMP/SukiSU-Ultra" checkout --detach "origin/$SUKISU_REF"

          SUKISU_SHA="$(git -C "$RUNNER_TEMP/SukiSU-Ultra" rev-parse HEAD)"
          echo "sha=$SUKISU_SHA" >> "$GITHUB_OUTPUT"
          echo "SukiSU source ref: $SUKISU_REF"
          echo "SukiSU source commit: $SUKISU_SHA"

      - name: Rebase upstream patch format and apply to SukiSU-Ultra
        id: port
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_DIR="$RUNNER_TEMP/SukiSU-Ultra"
          SUSFS_PATCH="${{ steps.susfs.outputs.patch }}"
          SUKISU_SHA="${{ steps.sukisu.outputs.sha }}"
          OUTPUT_FILE="$GITHUB_WORKSPACE/$OUTPUT_PATCH"
          PORTED_PATCH="$RUNNER_TEMP/susfs4ksu-sukisu.patch"

          # The upstream diff targets KernelSU. SukiSU has a different
          # dispatch.c include block, so adapt only that known include change.
          # Recount all unified-diff hunk lengths after editing. This prevents
          # a stale @@ line count from corrupting the generated patch.
          python3 - "$SUSFS_PATCH" "$PORTED_PATCH" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          output = Path(sys.argv[2])

          old_hunk = """@@ -20,7 +22,6 @@
           #include "manager/manager_identity.h"
           #include "selinux/selinux.h"
           #include "infra/file_wrapper.h"
          -#include "hook/tp_marker.h"
           #include "policy/app_profile.h"
           #include "sulog/event.h"
           #include "sulog/fd.h"
          """

          # Insert SUSFS headers next to the Linux headers, and remove the
          # obsolete tp_marker include from the SukiSU-specific context.
          replacement = """@@ -8,3 +8,5 @@
           #include <linux/uaccess.h>
           #include <linux/version.h>
           #include <linux/thread_info.h>
          +#include <linux/namei.h>
          +#include <linux/susfs.h>
          @@ -20,3 +22,2 @@
           #include "infra/file_wrapper.h"
          -#include "hook/tp_marker.h"
           #include "policy/app_profile.h"
          """

          count = source.count(old_hunk)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one dispatch.c include hunk, found {count}; "
                  "upstream patch changed. Refusing unsafe automatic rewrite."
              )

          patched = source.replace(old_hunk, replacement, 1)

          # Normalize every unified-diff hunk count from its actual body.
          # This is intentionally done on the patch text, not source files.
          lines = patched.splitlines(keepends=True)
          normalized = []
          i = 0
          hunk_re = re.compile(
              r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$"
          )

          while i < len(lines):
              line = lines[i]
              match = hunk_re.match(line.rstrip("\r\n"))
              if not match:
                  normalized.append(line)
                  i += 1
                  continue

              old_start, _, new_start, _, suffix = match.groups()
              i += 1
              body = []
              old_count = 0
              new_count = 0

              while i < len(lines):
                  current = lines[i]
                  if current.startswith(("diff --git ", "@@ ")):
                      break
                  # Do not treat lines beginning with "---" or "+++" as
                  # file headers here: they can be legitimate deleted or
                  # added source lines inside a hunk.
                  marker = current[:1]
                  if marker == " ":
                      old_count += 1
                      new_count += 1
                  elif marker == "-":
                      old_count += 1
                  elif marker == "+":
                      new_count += 1
                  elif current.startswith("\\ No newline at end of file"):
                      pass
                  else:
                      # A line without a valid unified-diff prefix inside a
                      # hunk means the source patch itself is malformed.
                      raise SystemExit(
                          "Malformed unified-diff body near: " + repr(current)
                      )
                  body.append(current)
                  i += 1

              normalized.append(
                  f"@@ -{old_start},{old_count} +{new_start},{new_count} @@{suffix}\n"
              )
              normalized.extend(body)

          output.write_text("".join(normalized), encoding="utf-8")
          PY

          echo "Checking normalized patch syntax..."
          git -C "$UPSTREAM_DIR" apply --check --recount --ignore-space-change --ignore-whitespace "$PORTED_PATCH" || {
            echo "::error::Normalized SUSFS patch does not apply cleanly to SukiSU-Ultra."
            echo "This is now a real source/context conflict, not a malformed hunk-count error."
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "SUSFS commit: ${{ steps.susfs.outputs.sha }}"
            echo "SukiSU ref: $SUKISU_REF"
            echo "SukiSU commit: $SUKISU_SHA"
            git -C "$UPSTREAM_DIR" apply --verbose --recount --ignore-space-change --ignore-whitespace --reject "$PORTED_PATCH" || true
            find "$UPSTREAM_DIR" -name '*.rej' -type f -print -exec cat {} \; || true
            exit 1
          }

          # Apply only after the full patch passes a clean-tree check.
          git -C "$UPSTREAM_DIR" apply --index --recount --ignore-space-change --ignore-whitespace "$PORTED_PATCH"

          mkdir -p "$(dirname "$OUTPUT_FILE")"
          git -C "$UPSTREAM_DIR" diff --cached --binary "$SUKISU_SHA" -- > "$OUTPUT_FILE"

          if [[ ! -s "$OUTPUT_FILE" ]]; then
            echo "::error::Generated SukiSU patch is empty. Refusing to publish."
            exit 1
          fi

          # Verify against a clean checkout of the exact SukiSU commit.
          git -C "$UPSTREAM_DIR" reset --hard "$SUKISU_SHA"
          git -C "$UPSTREAM_DIR" apply --check "$OUTPUT_FILE"

          echo "Generated patch: $OUTPUT_PATCH"
          echo "Patch size: $(wc -c < "$OUTPUT_FILE") bytes"
          echo "patch_path=$OUTPUT_PATCH" >> "$GITHUB_OUTPUT"

      - name: Create sync report
        if: success()
        shell: bash
        run: |
          {
            echo "SukiSU-Ultra SUSFS patch sync"
            echo
            echo "- SUSFS source: $SUSFS_REPOSITORY"
            echo "- SUSFS branch: $SUSFS_BRANCH"
            echo "- SUSFS commit: ${{ steps.susfs.outputs.sha }}"
            echo "- Source patch: $SUSFS_PATCH_RELATIVE"
            echo "- SukiSU source: $SUKISU_REPOSITORY"
            echo "- SukiSU ref: $SUKISU_REF"
            echo "- SukiSU commit: ${{ steps.sukisu.outputs.sha }}"
            echo "- Generated patch: $OUTPUT_PATCH"
            echo "- Patch application: passed"
            echo "- Clean-checkout validation: passed"
            echo
            echo "Patch application was validated; no kernel build or runtime test was performed."
          } > "$RUNNER_TEMP/sync-report.txt"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-susfs-sync-report
          path: ${{ runner.temp }}/sync-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request with generated patch
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-sukisu-susfs-patch
          base: LiquidAndrei
          delete-branch: true
          add-paths: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
          commit-message: "sync: port upstream SUSFS patch to SukiSU-Ultra"
          title: "sync: port latest SUSFS patch to SukiSU-Ultra"
          body: |
            This pull request was generated from the selected SUSFS4KSU source branch.

            - SUSFS source: https://github.com/AndreiMikh/susfs4ksu
            - SUSFS branch: `${{ env.SUSFS_BRANCH }}`
            - SUSFS commit: `${{ steps.susfs.outputs.sha }}`
            - Source patch: `${{ env.SUSFS_PATCH_RELATIVE }}`
            - SukiSU source: https://github.com/SukiSU-Ultra/SukiSU-Ultra
            - SukiSU ref: `${{ env.SUKISU_REF }}`
            - SukiSU commit: `${{ steps.sukisu.outputs.sha }}`
            - Generated patch: `${{ env.OUTPUT_PATCH }}`

            The selected SUSFS4KSU patch remains the source of truth. The workflow publishes a SukiSU-targeted diff only after application and clean-checkout validation.

            This validates patch application only; it does not perform a kernel build or runtime test.
