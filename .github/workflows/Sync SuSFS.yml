name: Sync SukiSU-Ultra SUSFS Patch

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: SUSFS4KSU branch to use as the source of truth
        required: true
        default: gki-android15-6.6
        type: choice
        options:
          - gki-android15-6.6
          - gki-android14-6.1
          - gki-android16-6.12
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sukisu-susfs-patch
  cancel-in-progress: false

jobs:
  sync-patch:
    name: Port the upstream SUSFS patch to SukiSU-Ultra
    runs-on: ubuntu-latest

    env:
      SUKISU_REPOSITORY: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
      SUKISU_REF: main
      SUSFS_REPOSITORY: https://github.com/AndreiMikh/susfs4ksu.git
      SUSFS_BRANCH: ${{ inputs.susfs_branch || 'gki-android15-6.6' }}
      SUSFS_PATCH_RELATIVE: kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
      OUTPUT_PATCH: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
      TARGET_BRANCH: LiquidAndrei

    steps:
      - name: Checkout kernel repository
        uses: actions/checkout@v4
        with:
          ref: LiquidAndrei
          fetch-depth: 0

      - name: Fetch SUSFS source-of-truth patch
        id: susfs
        shell: bash
        run: |
          set -euo pipefail

          SUSFS_DIR="$RUNNER_TEMP/susfs4ksu"
          git clone --no-checkout "$SUSFS_REPOSITORY" "$SUSFS_DIR"
          git -C "$SUSFS_DIR" fetch --no-tags origin "$SUSFS_BRANCH"
          git -C "$SUSFS_DIR" checkout --detach FETCH_HEAD

          SUSFS_SHA="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
          SUSFS_PATCH="$SUSFS_DIR/$SUSFS_PATCH_RELATIVE"

          if [[ ! -s "$SUSFS_PATCH" ]]; then
            echo "::error::Upstream SUSFS patch not found: $SUSFS_PATCH_RELATIVE on $SUSFS_BRANCH"
            echo "Files available under kernel_patches/KernelSU:"
            find "$SUSFS_DIR/kernel_patches/KernelSU" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          if ! grep -q '^diff --git ' "$SUSFS_PATCH"; then
            echo "::error::The upstream SUSFS patch is not a Git-format patch."
            exit 1
          fi

          echo "sha=$SUSFS_SHA" >> "$GITHUB_OUTPUT"
          echo "patch=$SUSFS_PATCH" >> "$GITHUB_OUTPUT"
          echo "SUSFS source branch: $SUSFS_BRANCH"
          echo "SUSFS source commit: $SUSFS_SHA"
          echo "SUSFS source patch: $SUSFS_PATCH_RELATIVE"

      - name: Fetch SukiSU-Ultra main
        id: sukisu
        shell: bash
        run: |
          set -euo pipefail

          git clone --no-checkout --branch "$SUKISU_REF" "$SUKISU_REPOSITORY" "$RUNNER_TEMP/SukiSU-Ultra"
          git -C "$RUNNER_TEMP/SukiSU-Ultra" checkout --detach "origin/$SUKISU_REF"

          SUKISU_SHA="$(git -C "$RUNNER_TEMP/SukiSU-Ultra" rev-parse HEAD)"
          echo "sha=$SUKISU_SHA" >> "$GITHUB_OUTPUT"
          echo "SukiSU source ref: $SUKISU_REF"
          echo "SukiSU source commit: $SUKISU_SHA"

      - name: Apply upstream SUSFS patch to SukiSU-Ultra
        id: port
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_DIR="$RUNNER_TEMP/SukiSU-Ultra"
          SUSFS_PATCH="${{ steps.susfs.outputs.patch }}"
          SUKISU_SHA="${{ steps.sukisu.outputs.sha }}"
          OUTPUT_FILE="$GITHUB_WORKSPACE/$OUTPUT_PATCH"

          # The SUSFS4KSU patch is the source of truth.
          # Apply it directly to a clean SukiSU-Ultra main checkout.
          if ! git -C "$UPSTREAM_DIR" apply --3way --index "$SUSFS_PATCH"; then
            echo "::error::The selected upstream SUSFS patch does not apply cleanly to SukiSU-Ultra main."
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "SUSFS commit: ${{ steps.susfs.outputs.sha }}"
            echo "SukiSU ref: $SUKISU_REF"
            echo "SukiSU commit: $SUKISU_SHA"
            echo
            echo "Git conflict summary:"
            git -C "$UPSTREAM_DIR" status --short || true
            echo
            echo "This is a source compatibility conflict, not a missing local patch."
            echo "The workflow will not silently drop or rewrite upstream SUSFS changes."
            exit 1
          fi

          mkdir -p "$(dirname "$OUTPUT_FILE")"
          git -C "$UPSTREAM_DIR" diff --cached --binary "$SUKISU_SHA" -- > "$OUTPUT_FILE"

          if [[ ! -s "$OUTPUT_FILE" ]]; then
            echo "::error::Generated SukiSU patch is empty. Refusing to publish."
            exit 1
          fi

          # Verify the generated SukiSU-targeted patch against a clean checkout.
          git -C "$UPSTREAM_DIR" reset --hard "$SUKISU_SHA"
          git -C "$UPSTREAM_DIR" apply --check "$OUTPUT_FILE"

          echo "Generated patch: $OUTPUT_PATCH"
          echo "Patch size: $(wc -c < "$OUTPUT_FILE") bytes"
          echo "patch_path=$OUTPUT_PATCH" >> "$GITHUB_OUTPUT"

      - name: Create sync report
        if: success()
        shell: bash
        run: |
          {
            echo "SukiSU-Ultra SUSFS patch sync"
            echo
            echo "- SUSFS source: $SUSFS_REPOSITORY"
            echo "- SUSFS branch: $SUSFS_BRANCH"
            echo "- SUSFS commit: ${{ steps.susfs.outputs.sha }}"
            echo "- Source patch: $SUSFS_PATCH_RELATIVE"
            echo "- SukiSU source: $SUKISU_REPOSITORY"
            echo "- SukiSU ref: $SUKISU_REF"
            echo "- SukiSU commit: ${{ steps.sukisu.outputs.sha }}"
            echo "- Generated patch: $OUTPUT_PATCH"
            echo "- Apply to SukiSU: passed"
            echo "- Clean-checkout validation: passed"
            echo
            echo "The selected SUSFS4KSU patch is the source of truth. The generated output is a SukiSU-Ultra-targeted patch."
          } > "$RUNNER_TEMP/sync-report.txt"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-susfs-sync-report
          path: ${{ runner.temp }}/sync-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Open pull request with generated patch
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-sukisu-susfs-patch
          base: LiquidAndrei
          delete-branch: true
          add-paths: kernel_patches/SukiSU-Ultra/10_enable_susfs_for_ksu.patch
          commit-message: "sync: port upstream SUSFS patch to SukiSU-Ultra"
          title: "sync: port latest SUSFS patch to SukiSU-Ultra"
          body: |
            This pull request was generated automatically from the selected SUSFS4KSU source branch.

            - SUSFS source: https://github.com/AndreiMikh/susfs4ksu
            - SUSFS branch: `${{ env.SUSFS_BRANCH }}`
            - SUSFS commit: `${{ steps.susfs.outputs.sha }}`
            - Source patch: `${{ env.SUSFS_PATCH_RELATIVE }}`
            - SukiSU source: https://github.com/SukiSU-Ultra/SukiSU-Ultra
            - SukiSU ref: `${{ env.SUKISU_REF }}`
            - SukiSU commit: `${{ steps.sukisu.outputs.sha }}`
            - Generated patch: `${{ env.OUTPUT_PATCH }}`

            The upstream SUSFS patch is the source of truth. This workflow applies it to SukiSU-Ultra and publishes the resulting SukiSU-targeted diff only when application and clean-checkout validation pass.

            This validates patch application only; it does not perform a kernel build or runtime test.
