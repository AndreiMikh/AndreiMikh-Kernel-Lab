name: SM-8750 Bot

on:
  workflow_dispatch:
    inputs:
      TARGET_WORKFLOW:
        type: choice
        required: true
        default: Main V8
        options:
          - Main V8
          - Test V8

      KPATCH:
        type: choice
        required: true
        default: KPN
        options: [KPM, KPN, None]

      SUSFS_REPOSITORY:
        type: string
        default: ""

      GITHUB_REPOSITORY:
        type: string
        required: true
        default: "AndreiMikh"

      BUILD_TIME:
        type: string
        default: "F"

      ROOT_ENGINE:
        type: choice
        required: true
        default: ReSukiSU
        options: [ReSukiSU, SukiSU-Ultra, KernelSU-Next, WildKSU, KernelSU]

      MANAGER_SOURCE:
        type: choice
        required: true
        default: ReSukiSU-Main
        options:
          - ReSukiSU-Main
          - ReSukiSU-Main-Spoofed
          - ReSukiSU-Dev
          - ReSukiSU-Dev-Spoofed
          - SukiSU-Ultra-Main
          - SukiSU-Main-Spoofed
          - SukiSU-Ultra-Builtin
          - KernelSU-Next-Stable
          - KernelSU-Next-Stable-Spoofed
          - KernelSU-Next-Dev
          - KernelSU-Next-Dev-Spoofed
          - WildKSU-Stable
          - WildKSU-Stable-Spoofed
          - WildKSU-Canary
          - WildKSU-Canary-Spoofed
          - KernelSU-Main

      SUSFS_VERSION:
        type: choice
        required: true
        default: OGKI
        options: [OGKI, GKI]

      ZRAM:
        type: choice
        required: true
        default: "0"
        options:
          - 0
          - 1/lz4kd/8589934592

      ZRAM_CUSTOM:
        type: boolean
        default: false

      SUFFIX:
        type: string
        default: "8-andreimikhail-4k"

      SUBLEVEL:
        type: string
        default: ""

      FAST_BUILD:
        type: boolean
        default: true

      LSM:
        type: boolean
        default: true

      LXCDOCKER:
        type: boolean
        default: false

      NETFILTER:
        type: boolean
        default: true

      BBR:
        type: choice
        default: "True"
        options: ["True", "False", "Brutal"]

      UNICODE:
        type: boolean
        default: true

      WINDSPEED:
        type: boolean
        default: true

      ADIOS:
        type: boolean
        default: false

      XUS:
        type: boolean
        default: true

      SUSFS_DEV:
        type: boolean
        default: false

      RE_KERNEL:
        type: boolean
        default: false

      SPACE_NOCLEAN:
        type: boolean
        default: false

      BUILD_NOCCACHE:
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:

# =========================
# Generate Matrix
# =========================
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          DEVICES="oneplus_13_b oneplus_13s_b oneplus_13t_b oneplus_ace5_pro_b oneplus_ace_6 oneplus_pad_2_pro_b oneplus_pad_3_b"
          echo "$DEVICES" | jq -R -s -c 'split("\n")[:-1]' > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

# =========================
# Trigger Builds
# =========================
  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Dispatch build
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: ${{ github.event.inputs.TARGET_WORKFLOW }}
          ref: LiquidAndrei
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.device }}",
              "KPATCH": "${{ github.event.inputs.KPATCH }}",
              "MANAGER_SOURCE": "${{ github.event.inputs.MANAGER_SOURCE }}",
              "SUSFS_REPOSITORY": "${{ github.event.inputs.SUSFS_REPOSITORY }}",
              "GITHUB_REPOSITORY": "${{ github.event.inputs.GITHUB_REPOSITORY }}",
              "ROOT_ENGINE": "${{ github.event.inputs.ROOT_ENGINE }}",
              "ZRAM": "${{ github.event.inputs.ZRAM }}",
              "ZRAM_CUSTOM": "${{ github.event.inputs.ZRAM_CUSTOM }}",
              "BUILD_TIME": "${{ github.event.inputs.BUILD_TIME }}",
              "SUFFIX": "${{ github.event.inputs.SUFFIX }}",
              "SUSFS_VERSION": "${{ github.event.inputs.SUSFS_VERSION }}",
              "LSM": "${{ github.event.inputs.LSM }}",
              "SUBLEVEL": "${{ github.event.inputs.SUBLEVEL }}",
              "NETFILTER": "${{ github.event.inputs.NETFILTER }}",
              "BBR": "${{ github.event.inputs.BBR }}",
              "LXCDOCKER": "${{ github.event.inputs.LXCDOCKER }}",
              "ADIOS": "${{ github.event.inputs.ADIOS }}",
              "SUSFS_DEV": "${{ github.event.inputs.SUSFS_DEV }}",
              "RE_KERNEL": "${{ github.event.inputs.RE_KERNEL }}",
              "FAST_BUILD": "${{ github.event.inputs.FAST_BUILD }}",
              "WINDSPEED": "${{ github.event.inputs.WINDSPEED }}",
              "SPACE_NOCLEAN": "${{ github.event.inputs.SPACE_NOCLEAN }}",
              "BUILD_NOCCACHE": "${{ github.event.inputs.BUILD_NOCCACHE }}",
              "XUS": "${{ github.event.inputs.XUS }}"
            }

# =========================
# Fetch Artifacts (FIXED)
# =========================
  fetch-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [oneplus_13_b, oneplus_13s_b, oneplus_13t_b, oneplus_ace5_pro_b, oneplus_ace_6, oneplus_pad_2_pro_b, oneplus_pad_3_b]

    steps:
      - uses: actions/checkout@v5

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq curl
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Fetch artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEVICE="${{ matrix.device }}"
          mkdir -p artifacts/$DEVICE

          MAX_WAIT=3600
          INTERVAL=30
          ELAPSED=0

          while (( ELAPSED < MAX_WAIT )); do

            RUN_ID=$(gh api repos/${{ github.repository }}/actions/runs \
              --jq ".workflow_runs
                | map(select(
                    .name==\"${{ github.event.inputs.TARGET_WORKFLOW }}\" and
                    .head_branch==\"LiquidAndrei\" and
                    .status==\"completed\" and
                    .conclusion==\"success\"
                ))
                | sort_by(.created_at) | reverse | .[0].id")

            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              sleep $INTERVAL
              ((ELAPSED+=INTERVAL))
              continue
            fi

            IDS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts \
              --jq ".artifacts[] | select(.name | test(\"$DEVICE\")) | .id")

            if [[ -z "$IDS" ]]; then
              sleep $INTERVAL
              ((ELAPSED+=INTERVAL))
              continue
            fi

            for ID in $IDS; do
              NAME=$(gh api repos/${{ github.repository }}/actions/artifacts/$ID --jq '.name')
              SAFE=$(echo "$NAME" | tr ' ' '_' | tr -cd '[:alnum:]_-')

              curl -L \
                -H "Authorization: token $GH_TOKEN" \
                -o "artifacts/$DEVICE/$SAFE.zip" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip"
            done

            break
          done

          if (( ELAPSED >= MAX_WAIT )); then
            echo "Timeout for $DEVICE"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.device }}-artifacts"
          path: "artifacts/${{ matrix.device }}/*"
