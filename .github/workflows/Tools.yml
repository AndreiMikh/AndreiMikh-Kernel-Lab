name: 🧰 Clang & Android Build Tools Cache

on:
  workflow_dispatch:
    inputs:
      FILE:
        description: "Manifest File"
        required: true
        type: choice
        options:
          - oneplus_13
          - oneplus_13_b
          - oneplus_13t
          - oneplus_13s
          - oneplus_ace5_pro
          - oneplus_ace6
          - oneplus_pad2_pro
          - oneplus_pad3

  schedule:
    - cron: "0 3 */3 * *"

permissions:
  contents: write

env:
  REPOROOT: "${{ github.workspace }}/toolchain-source"
  CACHEROOT: "${{ github.workspace }}/toolchain-cache"

jobs:

  # Generate the manifest matrix.
  # Manual runs process only the selected manifest.
  # Scheduled runs process every supported manifest.
  prepare:
    name: Prepare Manifest Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: 🧩 Generate Manifest Matrix
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILE="${{ github.event.inputs.FILE }}"

            jq -cn \
              --arg file "$FILE" \
              '{include:[{file:$file}]}' \
              > matrix.json
          else
            jq -cn '
              {
                include: [
                  {file:"oneplus_13"},
                  {file:"oneplus_13_b"},
                  {file:"oneplus_13t"},
                  {file:"oneplus_13s"},
                  {file:"oneplus_ace5_pro"},
                  {file:"oneplus_ace6"},
                  {file:"oneplus_pad2_pro"},
                  {file:"oneplus_pad3"}
                ]
              }
            ' > matrix.json
          fi

          MATRIX="$(cat matrix.json)"

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          echo "Manifest Matrix:"
          echo "$MATRIX" | jq .


  # Build and Cache the Toolchains for Each Manifest
  Cache-Tools:
    name: Cache ${{ matrix.file }}

    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    # Prevent Multiple Jobs for the Same Manifest from Running Simultaneously
    concurrency:
      group: clang-tools-${{ matrix.file }}
      cancel-in-progress: false

    env:
      FILE: "${{ matrix.file }}"

    steps:

      # Checkout Repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # Install Dependencies Required for Manifest Discovery
      # Android Repo Synchronization, ZIP Creation, and Validation
      - name: 📦 Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            jq \
            rsync \
            zstd \
            unzip \
            zip \
            python3 \
            ca-certificates

      # Install Google's Android Repo Tool
      - name: 🛠️ Install Repo Tool
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v repo
          repo --version

      # Locate Requested Manifest
      # Kernel-Manifest is Checked First, Followed by Kernel-Lab
      - name: 🔎 Discover Manifest
        id: manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFESTFILECONFIG="$FILE"
          MANIFESTURL=""
          MANIFESTBRANCH=""

          declare -a REPOSITORIES=(
            "AndreiMikh/Kernel-Manifest"
            "AndreiMikh/AndreiMikh-Kernel-Lab"
          )

          echo "Searching for manifest: ${MANIFESTFILECONFIG}.xml"
          for REPOSITORY in "${REPOSITORIES[@]}"; do
            echo ""
            echo "Checking repository: $REPOSITORY"
            BRANCHES="$(
              curl -fsSL \
                "https://api.github.com/repos/${REPOSITORY}/branches?per_page=100" \
                | jq -r '.[].name' \
                || true
            )"

            # Fallback to Git When the GitHub API Returns No Branches
            if [[ -z "$BRANCHES" ]]; then
              echo "GitHub API Returned No Branches"
              echo "Falling Back to Git LS-Remote"
              BRANCHES="$(
                git ls-remote --heads \
                  "https://github.com/${REPOSITORY}.git" \
                | awk -F/ '{print $NF}' \
                | sort -u
              )"
            fi

            while IFS= read -r BRANCH; do
              [[ -z "$BRANCH" ]] && continue
              RAWURL="https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/${MANIFESTFILECONFIG}.xml"

              # Check whether the manifest exists without downloading it.
              if curl -fsSL --head "$RAWURL" >/dev/null 2>&1; then
                MANIFESTURL="$RAWURL"
                MANIFESTBRANCH="$BRANCH"
                echo "Manifest Found"
                echo "Repository : $REPOSITORY"
                echo "Branch     : $MANIFESTBRANCH"
                echo "Manifest   : $MANIFESTURL"
                break 2
              fi
            done <<< "$BRANCHES"
          done

          if [[ -z "$MANIFESTURL" ]]; then
            echo "::error::Unable to Locate ${MANIFESTFILECONFIG}.xml"
            exit 1
          fi

          echo "MANIFESTFILECONFIG=${MANIFESTFILECONFIG}" >> "$GITHUB_ENV"
          echo "MANIFESTURL=${MANIFESTURL}" >> "$GITHUB_ENV"
          echo "MANIFESTBRANCH=${MANIFESTBRANCH}" >> "$GITHUB_ENV"


      # Download Discovered Manifest Into Workspace
      - name: 📄 Download Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$REPOROOT"
          curl -fsSL \
            "$MANIFESTURL" \
            -o "$REPOROOT/${MANIFESTFILECONFIG}.xml"
          test -s "$REPOROOT/${MANIFESTFILECONFIG}.xml"
          echo "Manifest Downloaded:"
          ls -lh "$REPOROOT/${MANIFESTFILECONFIG}.xml"

      # Extract Manifest Information Used for Cache Identity
      # Metadata, and Release Asset Naming
      - name: 🔍 Detect Manifest Information
        id: manifest-info
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFEST="${REPOROOT}/${MANIFESTFILECONFIG}.xml"
          MANIFESTBASEFILE="$(
            basename "$MANIFESTFILECONFIG" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g'
          )"
          CPU="$(
            grep -oE 'sm[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"
          
          if [[ -z "$CPU" ]]; then
            CPU="unknown"
          fi
          
          ANDROIDVERSION="$(
            grep -oE 'android[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$ANDROIDVERSION" ]]; then
            ANDROIDVERSION="unknown"
          fi

          KERNELVERSION="$(
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$KERNELVERSION" ]]; then
            KERNELVERSION="unknown"
          fi

          # Sanitize Branch for Safe Use in Cache Keys and Filenames
          SAFE_BRANCH="$(
            printf '%s' "$MANIFESTBRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g'
          )"

          # Use First 16 Characters of the Manifest SHA256
          # Part of Cache Identity
          MANIFESTHASH="$(
            sha256sum "$MANIFEST" \
              | awk '{print substr($1,1,16)}'
          )"

          CACHEKEY="CLANG-TOOLS-${RUNNER_OS}-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          # Asset Name Inside the Clang-Version-Specific Release
          RELEASEASSETNAME="CLANG-TOOLS-${MANIFESTBASEFILE}-${CPU}-${SAFE_BRANCH}-${MANIFESTHASH}"

          {
            echo "MANIFESTBASEFILE=${MANIFESTBASEFILE}"
            echo "CPU=${CPU}"
            echo "ANDROIDVERSION=${ANDROIDVERSION}"
            echo "KERNELVERSION=${KERNELVERSION}"
            echo "SAFE_BRANCH=${SAFE_BRANCH}"
            echo "MANIFESTHASH=${MANIFESTHASH}"
            echo "CACHEKEY=${CACHEKEY}"
            echo "RELEASEASSETNAME=${RELEASEASSETNAME}"
          } >> "$GITHUB_ENV"

          echo "Manifest Information"
          echo "Manifest       : $MANIFESTFILECONFIG"
          echo "Base Name      : $MANIFESTBASEFILE"
          echo "Branch         : $MANIFESTBRANCH"
          echo "CPU            : $CPU"
          echo "Android        : $ANDROIDVERSION"
          echo "Kernel         : $KERNELVERSION"
          echo "Manifest Hash  : $MANIFESTHASH"
          echo "Cache Key      : $CACHEKEY"

      # Initialize Android Source Tree Using Discovered Manifest
      - name: 🧰 Initialize Android Repo
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"
          repo init \
            -u "https://github.com/AndreiMikh/Kernel-Manifest.git" \
            -b "$MANIFESTBRANCH" \
            -m "${MANIFESTFILECONFIG}.xml" \
            --depth=1 \
            --no-repo-verify

      # Remove Obsolete Kernel Project if it Exists
      - name: 🧹 Remove Obsolete Project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"
          rm -rf \
            ".repo/local_manifests/ks-kernel.lnx.5.0.r3-rel" \
            "ks-kernel.lnx.5.0.r3-rel" \
            || true

      # Synchronize Android Source Tree
      - name: 🔄 Sync Android Source
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"
          timeout 30m repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc --all)"
          test -d "$REPOROOT/kernel_workspace/kernel_platform"


      # Detect Newest Clang-r* Toolchain
      # Sort -V Ensures Numerical Version Ordering
      - name: 🔎 Detect Clang Toolchain
        id: clang
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNELPLATFORM="${REPOROOT}/kernel_workspace/kernel_platform"
          CLANGROOT="${KERNELPLATFORM}/prebuilts/clang/host/linux-x86"
          if [[ ! -d "$CLANGROOT" ]]; then
            echo "::error::Clang Directory Not Found: $CLANGROOT"
            exit 1
          fi

          mapfile -t CLANG_DIRS < <(
            find "$CLANGROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'clang-r*' \
              -printf '%f\n' \
            | sort -V
          )

          if (( ${#CLANG_DIRS[@]} == 0 )); then
            echo "::error::No Clang-r* Toolchain Found"
            exit 1
          fi

          # Select Newest Clang-r* Directory
          CLANGVERSION="${CLANG_DIRS[-1]}"
          CLANGPATH="${CLANGROOT}/${CLANGVERSION}"

          if [[ ! -x "${CLANGPATH}/bin/clang" ]]; then
            echo "::error::Clang Compiler Not Found: ${CLANGPATH}/bin/clang"
            exit 1
          fi

          # Create a Release Tag Based on the Exact Clang Version
          TOOLCHAINRELEASETAG="Clang-Build-Tools-${CLANGVERSION}"

          echo "Selected Clang : ${CLANGVERSION}"
          echo "Clang Path     : ${CLANGPATH}"
          echo "Release Tag    : ${TOOLCHAINRELEASETAG}"

          echo "CLANGVERSION=${CLANGVERSION}" >> "$GITHUB_ENV"
          echo "CLANGPATH=${CLANGPATH}" >> "$GITHUB_ENV"
          echo "TOOLCHAINRELEASETAG=${TOOLCHAINRELEASETAG}" >> "$GITHUB_ENV"


      # Detect which Android build-tool directories are available.
      - name: 🔎 Detect Android Build Tools
        id: tools
        shell: bash
        run: |
          set -Eeuo pipefail

          KERNELPLATFORM="${REPOROOT}/kernel_workspace/kernel_platform"

          declare -a CANDIDATE_PATHS=(
            "prebuilts/clang/host/linux-x86/${CLANGVERSION}"
            "prebuilts/rust"
            "prebuilts/kernel-build-tools"
            "prebuilts/build-tools"
            "prebuilts/clang-tools"
            "prebuilts/gcc"
            "prebuilts/gcc/linux-x86"
          )

          EXISTINGPATHS=()

          for RELATIVEPATH in "${CANDIDATE_PATHS[@]}"; do
            FULL_PATH="${KERNELPLATFORM}/${RELATIVEPATH}"
            if [[ -e "$FULL_PATH" ]]; then
              EXISTINGPATHS+=("$RELATIVEPATH")
              echo "Found: $RELATIVEPATH"
            else
              echo "Missing: $RELATIVEPATH"
            fi
          done

          if (( ${#EXISTINGPATHS[@]} == 0 )); then
            echo "::error::No Build Toolchains Were Found"
            exit 1
          fi

          {
            echo "EXISTINGPATHS<<EOF"
            printf '%s\n' "${EXISTINGPATHS[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"


      # Create a ZIP Archive Containing the Detected Toolchains
      # Original Prebuilts Directory Structure is Preserved
      - name: 📦 Create Toolchain ZIP Archive
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT/kernel_workspace/kernel_platform"
          TEMPARCHIVE="${RUNNER_TEMP}/toolchain-cache.zip"
          FINALARCHIVE="${CACHEROOT}/toolchain-cache.zip"
          mkdir -p "$CACHEROOT"
          rm -f "$TEMPARCHIVE"
          rm -f "$FINALARCHIVE"
          echo "Creating ZIP Archive..."
          zip -qr \
            "$TEMPARCHIVE" \
            "${EXISTINGPATHS[@]}"
          test -s "$TEMPARCHIVE"
          cp "$TEMPARCHIVE" "$FINALARCHIVE"

          echo ""
          echo "Archive Created:"
          ls -lh "$FINALARCHIVE"

          echo ""
          echo "ZIP contents:"
          unzip -l "$FINALARCHIVE" | head -n 80

      # Generate mMetadata and SHA256 Checksums for the Archive
      - name: 📝 Generate Metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.zip"
          METADATA="${CACHEROOT}/metadata.json"
          CHECKSUMS="${CACHEROOT}/SHA256SUMS"
          ARCHIVESHA256="$(
            sha256sum "$ARCHIVE" \
              | awk '{print $1}'
          )"
          cat > "$METADATA" <<EOF
          {
            "manifest": "${MANIFESTFILECONFIG}",
            "manifest_base": "${MANIFESTBASEFILE}",
            "manifest_branch": "${MANIFESTBRANCH}",
            "manifest_hash": "${MANIFESTHASH}",
            "cpu": "${CPU}",
            "android_version": "${ANDROIDVERSION}",
            "kernel_version": "${KERNELVERSION}",
            "clang_version": "${CLANGVERSION}",
            "release_tag": "${TOOLCHAINRELEASETAG}",
            "archive": "toolchain-cache.zip",
            "archive_sha256": "${ARCHIVESHA256}",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "runner_os": "${RUNNER_OS}"
          }
          EOF

          cd "$CACHEROOT"
          sha256sum \
            toolchain-cache.zip \
            metadata.json \
            > SHA256SUMS
          echo "Metadata:"
          cat metadata.json

          echo ""
          echo "Checksums:"
          cat SHA256SUMS

      # Save Generated Cache to GitHub Actions Cache
      - name: 💾 Save Actions Cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHEROOT }}
          key: ${{ env.CACHEKEY }}

      # Upload Archive and Metadata to the Clang-Version-Specific Release
      - name: 🚀 Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.zip"
          METADATA="${CACHEROOT}/metadata.json"
          CHECKSUMS="${CACHEROOT}/SHA256SUMS"

          RELEASEASSET="${RELEASEASSETNAME}.zip"
          RELEASEMETADATA="${RELEASEASSETNAME}.json"
          RELEASECHECKSUMS="${RELEASEASSETNAME}.SHA256SUMS"

          echo "Release Tag       : ${TOOLCHAINRELEASETAG}"
          echo "Release ZIP       : ${RELEASEASSET}"
          echo "Release Metadata  : ${RELEASEMETADATA}"
          echo "Release Checksums : ${RELEASECHECKSUMS}"

          # Create Clang-Version-Specific Release if it Does Not Exist
          gh release view "$TOOLCHAINRELEASETAG" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1 \
            || gh release create "$TOOLCHAINRELEASETAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Clang & Android Build Tools - ${CLANGVERSION}" \
              --notes "Automatically Generated Clang and Android build tool caches for ${CLANGVERSION}"

          # Create Manifest-Specific Asset Names
          cp "$ARCHIVE" \
            "${CACHEROOT}/${RELEASEASSET}"

          cp "$METADATA" \
            "${CACHEROOT}/${RELEASEMETADATA}"

          cp "$CHECKSUMS" \
            "${CACHEROOT}/${RELEASECHECKSUMS}"

          # Upload Assets and Replace Existing Files with the Same Names
          gh release upload \
            "$TOOLCHAINRELEASETAG" \
            "${CACHEROOT}/${RELEASEASSET}" \
            "${CACHEROOT}/${RELEASEMETADATA}" \
            "${CACHEROOT}/${RELEASECHECKSUMS}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      # Upload Generated Files as a Workflow Artifact
      - name: 📤 Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASEASSETNAME }}
          path: |
            ${{ env.CACHEROOT }}/toolchain-cache.zip
            ${{ env.CACHEROOT }}/metadata.json
            ${{ env.CACHEROOT }}/SHA256SUMS
          if-no-files-found: error

          # ZIP Compression Level
          compression-level: 0


      # Generate a Workflow Summary Containing Cache and Release Information
      - name: 📊 Generate Summary
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.zip"

          {
            echo "## 🧰 Clang & Android Build Tools Cache"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Manifest | \`${MANIFESTFILECONFIG}\` |"
            echo "| Base | \`${MANIFESTBASEFILE}\` |"
            echo "| Branch | \`${MANIFESTBRANCH}\` |"
            echo "| CPU | \`${CPU}\` |"
            echo "| Android | \`${ANDROIDVERSION}\` |"
            echo "| Kernel | \`${KERNELVERSION}\` |"
            echo "| Clang | \`${CLANGVERSION}\` |"
            echo "| Release Tag | \`${TOOLCHAINRELEASETAG}\` |"
            echo "| Manifest SHA256 | \`${MANIFESTHASH}\` |"
            echo "| Cache Key | \`${CACHEKEY}\` |"
            echo "| Release Asset | \`${RELEASEASSETNAME}.zip\` |"
            echo "| Archive Size | \`$(du -h "$ARCHIVE" | awk '{print $1}')\` |"
            echo ""
            echo "### Cached Paths"
            echo ""

            for PATHENTRY in "${EXISTINGPATHS[@]}"; do
              echo "- \`${PATHENTRY}\`"
            done

            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            cat "${CACHEROOT}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
