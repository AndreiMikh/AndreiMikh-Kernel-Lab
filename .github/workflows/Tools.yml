name: 🧰 Clang & Android Build Tools Cache

on:
  workflow_dispatch:
    inputs:
      FILE:
        description: "Manifest File"
        required: true
        type: choice
        options:
          - oneplus_13_b
          - oneplus_13t
          - oneplus_13s
          - oneplus_ace5_pro
          - oneplus_ace6
          - oneplus_pad2_pro
          - oneplus_pad3

  schedule:
    - cron: "0 3 */3 * *"

permissions:
  contents: write

env:
  REPOROOT: "${{ github.workspace }}/toolchain-source"
  CACHEROOT: "${{ github.workspace }}/toolchain-cache"

jobs:

  # Generate the manifest matrix.
  # Manual runs process only the selected manifest.
  # Scheduled runs process every supported manifest.
  prepare:
    name: Prepare Manifest Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: 🧩 Generate Manifest Matrix
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILE="${{ github.event.inputs.FILE }}"

            jq -cn \
              --arg file "$FILE" \
              '{include:[{file:$file}]}' \
              > matrix.json
          else
            jq -cn '
              {
                include: [
                  {file:"oneplus_13_b"},
                  {file:"oneplus_13t"},
                  {file:"oneplus_13s"},
                  {file:"oneplus_ace5_pro"},
                  {file:"oneplus_ace6"},
                  {file:"oneplus_pad2_pro"},
                  {file:"oneplus_pad3"}
                ]
              }
            ' > matrix.json
          fi

          MATRIX="$(cat matrix.json)"

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          echo "Manifest Matrix:"
          echo "$MATRIX" | jq .


  # Build and cache the toolchains for each manifest.
  Cache-Tools:
    name: Cache ${{ matrix.file }}

    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    # Prevent multiple jobs for the same manifest from running simultaneously.
    concurrency:
      group: clang-tools-${{ matrix.file }}
      cancel-in-progress: false

    env:
      FILE: "${{ matrix.file }}"

    steps:

      # Checkout repository.
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # Install dependencies required for manifest discovery,
      # Android Repo synchronization, archive creation, and validation.
      - name: 📦 Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            jq \
            rsync \
            zstd \
            python3 \
            ca-certificates


      # Install Google's Android Repo tool.
      - name: 🛠️ Install Repo Tool
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          export PATH="$HOME/bin:$PATH"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          command -v repo
          repo --version


      # Locate the requested manifest.
      # Kernel-Manifest is checked first, followed by Kernel-Lab.
      - name: 🔎 Discover Manifest
        id: manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFESTFILECONFIG="$FILE"
          MANIFESTURL=""
          MANIFESTBRANCH=""

          declare -a REPOSITORIES=(
            "AndreiMikh/Kernel-Manifest"
            "AndreiMikh/AndreiMikh-Kernel-Lab"
          )

          echo "Searching for manifest: ${MANIFESTFILECONFIG}.xml"

          for REPOSITORY in "${REPOSITORIES[@]}"; do
            echo ""
            echo "Checking repository: $REPOSITORY"

            BRANCHES="$(
              curl -fsSL \
                "https://api.github.com/repos/${REPOSITORY}/branches?per_page=100" \
                | jq -r '.[].name' \
                || true
            )"

            # Fall back to Git when the GitHub API returns no branches.
            if [[ -z "$BRANCHES" ]]; then
              echo "GitHub API returned no branches."
              echo "Falling back to Git LS-Remote."

              BRANCHES="$(
                git ls-remote --heads \
                  "https://github.com/${REPOSITORY}.git" \
                | awk -F/ '{print $NF}' \
                | sort -u
              )"
            fi

            while IFS= read -r BRANCH; do
              [[ -z "$BRANCH" ]] && continue

              RAWURL="https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/${MANIFESTFILECONFIG}.xml"

              if curl -fsSL --head "$RAWURL" >/dev/null 2>&1; then
                MANIFESTURL="$RAWURL"
                MANIFESTBRANCH="$BRANCH"

                echo "Manifest found."
                echo "Repository : $REPOSITORY"
                echo "Branch     : $MANIFESTBRANCH"
                echo "Manifest   : $MANIFESTURL"

                break 2
              fi
            done <<< "$BRANCHES"
          done

          if [[ -z "$MANIFESTURL" ]]; then
            echo "::error::Unable to locate ${MANIFESTFILECONFIG}.xml"
            exit 1
          fi

          {
            echo "MANIFESTFILECONFIG=${MANIFESTFILECONFIG}"
            echo "MANIFESTURL=${MANIFESTURL}"
            echo "MANIFESTBRANCH=${MANIFESTBRANCH}"
          } >> "$GITHUB_ENV"


      # Download the discovered manifest into the workspace.
      - name: 📄 Download Manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$REPOROOT"

          MANIFEST="${REPOROOT}/${MANIFESTFILECONFIG}.xml"

          curl -fsSL \
            "$MANIFESTURL" \
            -o "$MANIFEST"

          test -s "$MANIFEST"

          echo "Manifest downloaded:"
          ls -lh "$MANIFEST"


      # Extract manifest information.
      # Clang-dependent cache identity is generated later,
      # after the actual Clang version has been detected.
      - name: 🔍 Detect Manifest Information
        id: manifest-info
        shell: bash
        run: |
          set -Eeuo pipefail

          MANIFEST="${REPOROOT}/${MANIFESTFILECONFIG}.xml"

          MANIFESTBASEFILE="$(
            basename "$MANIFESTFILECONFIG" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g'
          )"

          CPU="$(
            grep -oE 'sm[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$CPU" ]]; then
            CPU="unknown"
          fi

          ANDROIDVERSION="$(
            grep -oE 'android[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$ANDROIDVERSION" ]]; then
            ANDROIDVERSION="unknown"
          fi

          KERNELVERSION="$(
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$MANIFEST" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$KERNELVERSION" ]]; then
            KERNELVERSION="unknown"
          fi

          SAFE_BRANCH="$(
            printf '%s' "$MANIFESTBRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g'
          )"

          MANIFESTHASH="$(
            sha256sum "$MANIFEST" \
              | awk '{print substr($1,1,16)}'
          )"

          {
            echo "MANIFESTBASEFILE=${MANIFESTBASEFILE}"
            echo "CPU=${CPU}"
            echo "ANDROIDVERSION=${ANDROIDVERSION}"
            echo "KERNELVERSION=${KERNELVERSION}"
            echo "SAFE_BRANCH=${SAFE_BRANCH}"
            echo "MANIFESTHASH=${MANIFESTHASH}"
          } >> "$GITHUB_ENV"

          echo "Manifest Information"
          echo "Manifest       : ${MANIFESTFILECONFIG}"
          echo "Base Name      : ${MANIFESTBASEFILE}"
          echo "Branch         : ${MANIFESTBRANCH}"
          echo "CPU            : ${CPU}"
          echo "Android        : ${ANDROIDVERSION}"
          echo "Kernel         : ${KERNELVERSION}"
          echo "Manifest Hash  : ${MANIFESTHASH}"


      # Initialize the Android source tree using the discovered manifest.
      - name: 🧰 Initialize Android Repo
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"

          repo init \
            -u "https://github.com/AndreiMikh/Kernel-Manifest.git" \
            -b "$MANIFESTBRANCH" \
            -m "${MANIFESTFILECONFIG}.xml" \
            --depth=1 \
            --no-repo-verify


      # Remove obsolete kernel project if it exists.
      - name: 🧹 Remove Obsolete Project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"

          rm -rf \
            ".repo/local_manifests/ks-kernel.lnx.5.0.r3-rel" \
            "ks-kernel.lnx.5.0.r3-rel"


      # Synchronize the Android source tree.
      - name: 🔄 Sync Android Source
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$REPOROOT"

          echo "Repository root:"
          pwd

          echo ""
          echo "Starting repo sync..."

          timeout 30m repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc --all)"

          echo ""
          echo "Repo sync completed successfully"

          # Locate kernel_platform dynamically inside the synced tree.
          KERNELPLATFORM="$(
            find "$REPOROOT" \
              -type d \
              -path '*/kernel_platform' \
              -print \
              -quit
          )"

          if [[ -z "$KERNELPLATFORM" ]]; then
            echo "::error::Unable to locate kernel_platform after repo sync"

            echo ""
            echo "Available directories:"

            find "$REPOROOT" \
              -maxdepth 5 \
              -type d \
              | sort \
              | head -n 200

            exit 1
          fi

          KERNELPLATFORM="$(cd "$KERNELPLATFORM" && pwd)"

          echo ""
          echo "Kernel Platform:"
          echo "$KERNELPLATFORM"

          test -d "$KERNELPLATFORM"

          echo "KERNELPLATFORM=${KERNELPLATFORM}" >> "$GITHUB_ENV"


      # Detect the newest clang-r* toolchain.
      - name: 🔎 Detect Clang Toolchain
        id: clang
        shell: bash
        run: |
          set -Eeuo pipefail

          CLANGROOT="${KERNELPLATFORM}/prebuilts/clang/host/linux-x86"

          if [[ ! -d "$CLANGROOT" ]]; then
            echo "::error::Clang directory not found: $CLANGROOT"
            exit 1
          fi

          mapfile -t CLANG_DIRS < <(
            find "$CLANGROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'clang-r*' \
              -printf '%f\n' \
              | sort -V
          )

          if (( ${#CLANG_DIRS[@]} == 0 )); then
            echo "::error::No clang-r* toolchain found"
            exit 1
          fi

          CLANGVERSION="${CLANG_DIRS[-1]}"
          CLANGPATH="${CLANGROOT}/${CLANGVERSION}"

          if [[ ! -x "${CLANGPATH}/bin/clang" ]]; then
            echo "::error::Clang compiler not found: ${CLANGPATH}/bin/clang"
            exit 1
          fi

          TOOLCHAIN_RELEASE_TAG="Clang-Build-Tools-${CLANGVERSION}"

          echo "Selected Clang : ${CLANGVERSION}"
          echo "Clang Path     : ${CLANGPATH}"
          echo "Release Tag    : ${TOOLCHAIN_RELEASE_TAG}"

          {
            echo "CLANGVERSION=${CLANGVERSION}"
            echo "CLANGPATH=${CLANGPATH}"
            echo "TOOLCHAIN_RELEASE_TAG=${TOOLCHAIN_RELEASE_TAG}"
          } >> "$GITHUB_ENV"


      # Generate cache and release identities after Clang has been detected.
      #
      # The manifest hash prevents different manifests using the same Clang
      # version from overwriting each other's archive or Actions cache.
      - name: 🏷️ Generate Cache Identity
        id: cache-identity
        shell: bash
        run: |
          set -Eeuo pipefail

          CACHEKEY="clang-toolchain-${CLANGVERSION}-${MANIFESTBASEFILE}-${MANIFESTHASH}"
          RELEASEASSETNAME="clang-toolchain-${CLANGVERSION}-${MANIFESTBASEFILE}-${MANIFESTHASH}"

          {
            echo "CACHEKEY=${CACHEKEY}"
            echo "RELEASEASSETNAME=${RELEASEASSETNAME}"
          } >> "$GITHUB_ENV"

          echo "Toolchain Cache Identity"
          echo "Clang Version : ${CLANGVERSION}"
          echo "Manifest      : ${MANIFESTBASEFILE}"
          echo "Manifest Hash : ${MANIFESTHASH}"
          echo "Cache Key     : ${CACHEKEY}"
          echo "Asset Name    : ${RELEASEASSETNAME}"


      # Detect which Android build-tool directories are available.
      - name: 🔎 Detect Android Build Tools
        id: tools
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$CACHEROOT"

          declare -a CANDIDATE_PATHS=(
            "prebuilts/clang/host/linux-x86/${CLANGVERSION}"
            "prebuilts/rust"
            "prebuilts/kernel-build-tools"
            "prebuilts/build-tools"
            "prebuilts/clang-tools"
            "prebuilts/gcc"
            "prebuilts/gcc/linux-x86"
          )

          EXISTINGPATHS=()

          for RELATIVEPATH in "${CANDIDATE_PATHS[@]}"; do
            FULL_PATH="${KERNELPLATFORM}/${RELATIVEPATH}"

            if [[ -e "$FULL_PATH" ]]; then
              EXISTINGPATHS+=("$RELATIVEPATH")
              echo "Found: $RELATIVEPATH"
            else
              echo "Missing: $RELATIVEPATH"
            fi
          done

          if (( ${#EXISTINGPATHS[@]} == 0 )); then
            echo "::error::No build toolchains were found"
            exit 1
          fi

          # Bash arrays do not survive between GitHub Actions steps,
          # so persist the paths in a plain text file.
          printf '%s\n' "${EXISTINGPATHS[@]}" \
            > "$CACHEROOT/existing-paths.txt"

          echo ""
          echo "Saved toolchain paths:"
          cat "$CACHEROOT/existing-paths.txt"


      # Create a Zstandard-compressed tar archive.
      # The original prebuilts directory structure is preserved.
      - name: 📦 Create Toolchain TAR.ZST Archive
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$KERNELPLATFORM"

          TEMPARCHIVE="${RUNNER_TEMP}/toolchain-cache.tar.zst"
          FINALARCHIVE="${CACHEROOT}/toolchain-cache.tar.zst"

          mkdir -p "$CACHEROOT"

          rm -f "$TEMPARCHIVE"
          rm -f "$FINALARCHIVE"

          if [[ ! -s "$CACHEROOT/existing-paths.txt" ]]; then
            echo "::error::Toolchain path list is missing or empty"
            exit 1
          fi

          mapfile -t EXISTINGPATHS_ARRAY \
            < "$CACHEROOT/existing-paths.txt"

          if (( ${#EXISTINGPATHS_ARRAY[@]} == 0 )); then
            echo "::error::No toolchain paths available for archive creation"
            exit 1
          fi

          echo "Toolchain paths to archive:"

          for PATHENTRY in "${EXISTINGPATHS_ARRAY[@]}"; do
            [[ -z "$PATHENTRY" ]] && continue

            if [[ ! -e "$PATHENTRY" ]]; then
              echo "::error::Toolchain path does not exist: $PATHENTRY"
              exit 1
            fi

            echo "  $PATHENTRY"
          done

          echo ""
          echo "Creating TAR.ZST archive..."
          echo "Compression : Zstandard level 19"
          echo "Threads     : $(nproc --all)"

          tar \
            --use-compress-program="zstd -T0 -19" \
            -cf "$TEMPARCHIVE" \
            "${EXISTINGPATHS_ARRAY[@]}"

          test -s "$TEMPARCHIVE"

          cp "$TEMPARCHIVE" "$FINALARCHIVE"

          echo ""
          echo "Archive created:"
          ls -lh "$FINALARCHIVE"

          ARCHIVESIZE="$(stat -c '%s' "$FINALARCHIVE")"

          echo ""
          echo "Archive size:"
          echo "  Human : $(du -h "$FINALARCHIVE" | awk '{print $1}')"
          echo "  Bytes : ${ARCHIVESIZE}"


      # Generate metadata and SHA256 checksums for the archive.
      - name: 📝 Generate Metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.tar.zst"
          METADATA="${CACHEROOT}/metadata.json"
          CHECKSUMS="${CACHEROOT}/SHA256SUMS"

          test -s "$ARCHIVE"

          ARCHIVESHA256="$(
            sha256sum "$ARCHIVE" \
              | awk '{print $1}'
          )"

          cat > "$METADATA" <<EOF
          {
            "manifest": "${MANIFESTFILECONFIG}",
            "manifest_base": "${MANIFESTBASEFILE}",
            "manifest_branch": "${MANIFESTBRANCH}",
            "manifest_hash": "${MANIFESTHASH}",
            "cpu": "${CPU}",
            "android_version": "${ANDROIDVERSION}",
            "kernel_version": "${KERNELVERSION}",
            "clang_version": "${CLANGVERSION}",
            "release_tag": "${TOOLCHAIN_RELEASE_TAG}",
            "cache_key": "${CACHEKEY}",
            "archive": "toolchain-cache.tar.zst",
            "archive_format": "tar.zst",
            "compression": "zstd",
            "compression_level": 19,
            "archive_sha256": "${ARCHIVESHA256}",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "runner_os": "${RUNNER_OS}"
          }
          EOF

          cd "$CACHEROOT"

          sha256sum \
            toolchain-cache.tar.zst \
            metadata.json \
            > SHA256SUMS

          echo "Metadata:"
          cat metadata.json

          echo ""
          echo "Checksums:"
          cat SHA256SUMS


      # Save generated cache to GitHub Actions cache.
      - name: 💾 Save Actions Cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CACHEROOT }}
          key: ${{ env.CACHEKEY }}


      # Upload archive and metadata to the Clang-version-specific release.
      - name: 🚀 Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.tar.zst"
          METADATA="${CACHEROOT}/metadata.json"
          CHECKSUMS="${CACHEROOT}/SHA256SUMS"

          test -s "$ARCHIVE"
          test -s "$METADATA"
          test -s "$CHECKSUMS"

          RELEASEASSET="${RELEASEASSETNAME}.tar.zst"
          RELEASEMETADATA="${RELEASEASSETNAME}.json"
          RELEASECHECKSUMS="${RELEASEASSETNAME}.SHA256SUMS"

          # GitHub Releases requires assets to be strictly below 2 GiB.
          ARCHIVESIZE="$(stat -c '%s' "$ARCHIVE")"
          MAXSIZE=2147483648

          echo "Release Tag       : ${TOOLCHAIN_RELEASE_TAG}"
          echo "Release Archive   : ${RELEASEASSET}"
          echo "Release Metadata  : ${RELEASEMETADATA}"
          echo "Release Checksums : ${RELEASECHECKSUMS}"
          echo "Archive Size      : $(du -h "$ARCHIVE" | awk '{print $1}')"
          echo "Archive Bytes     : ${ARCHIVESIZE}"

          if (( ARCHIVESIZE >= MAXSIZE )); then
            echo ""
            echo "::error::Archive is too large for GitHub Releases"
            echo "Maximum allowed : 2147483647 bytes"
            echo "Actual size     : ${ARCHIVESIZE} bytes"
            exit 1
          fi

          echo ""
          echo "Archive is below the GitHub Release size limit"

          # Create the Clang-version-specific release if it does not exist.
          if ! gh release view \
            "$TOOLCHAIN_RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1; then

            gh release create \
              "$TOOLCHAIN_RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "clang-toolchain-${CLANGVERSION}" \
              --notes "Automatically generated Clang and Android build tool caches for ${CLANGVERSION}"
          fi

          # Use manifest-specific asset names to prevent matrix jobs
          # using the same Clang version from overwriting each other.
          cp "$ARCHIVE" \
            "${CACHEROOT}/${RELEASEASSET}"

          cp "$METADATA" \
            "${CACHEROOT}/${RELEASEMETADATA}"

          cp "$CHECKSUMS" \
            "${CACHEROOT}/${RELEASECHECKSUMS}"

          # Upload assets and replace existing files with the same names.
          gh release upload \
            "$TOOLCHAIN_RELEASE_TAG" \
            "${CACHEROOT}/${RELEASEASSET}" \
            "${CACHEROOT}/${RELEASEMETADATA}" \
            "${CACHEROOT}/${RELEASECHECKSUMS}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber


      # Upload generated files as a workflow artifact.
      - name: 📤 Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASEASSETNAME }}
          path: |
            ${{ env.CACHEROOT }}/toolchain-cache.tar.zst
            ${{ env.CACHEROOT }}/metadata.json
            ${{ env.CACHEROOT }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0


      # Generate a workflow summary containing cache and release information.
      - name: 📊 Generate Summary
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="${CACHEROOT}/toolchain-cache.tar.zst"

          {
            echo "## 🧰 Clang & Android Build Tools Cache"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Manifest | \`${MANIFESTFILECONFIG}\` |"
            echo "| Base | \`${MANIFESTBASEFILE}\` |"
            echo "| Branch | \`${MANIFESTBRANCH}\` |"
            echo "| CPU | \`${CPU}\` |"
            echo "| Android | \`${ANDROIDVERSION}\` |"
            echo "| Kernel | \`${KERNELVERSION}\` |"
            echo "| Clang | \`${CLANGVERSION}\` |"
            echo "| Release Tag | \`${TOOLCHAIN_RELEASE_TAG}\` |"
            echo "| Manifest SHA256 | \`${MANIFESTHASH}\` |"
            echo "| Cache Key | \`${CACHEKEY}\` |"
            echo "| Release Asset | \`${RELEASEASSETNAME}.tar.zst\` |"
            echo "| Archive Format | \`tar.zst\` |"
            echo "| Compression | \`zstd -19\` |"
            echo "| Archive Size | \`$(du -h "$ARCHIVE" | awk '{print $1}')\` |"
            echo ""
            echo "### Cached Paths"
            echo ""

            while IFS= read -r PATHENTRY; do
              [[ -z "$PATHENTRY" ]] && continue
              echo "- \`${PATHENTRY}\`"
            done < "${CACHEROOT}/existing-paths.txt"

            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            cat "${CACHEROOT}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
