name: ☘️ Test AOSP
on:
  workflow_dispatch:
    inputs:                  
      ROOTENGINE:
        type: choice
        description: "KSU Meta"
        required: true
        default: ReSukiSU
        options:
         - ReSukiSU
         - SukiSU-Ultra
         - KernelSU-Next
         - WildKSU
         - KernelSU         
      ROOTBRANCHSOURCE:
        type: choice
        description: "Root Manager Branch (Manager Artifact)"
        required: true
        default: ReSukiSU-Main
        options:
         - ReSukiSU-Main
         - ReSukiSU-Main-Spoofed
         - ReSukiSU-Dev
         - ReSukiSU-Dev-Spoofed
         - SukiSU-Ultra-Main
         - SukiSU-Ultra-Builtin
         - KernelSU-Next-Dev
         - KernelSU-Next-Dev-SUSFS
         - WildKSU-Stable
         - WildKSU-Stable-Spoofed
         - WildKSU-Canary
         - WildKSU-Canary-Spoofed
         - KernelSU-Main            
       
jobs:
  build:
    name: AOSP      
    runs-on: ubuntu-latest    
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: none
      CCACHE_NOHASHDIR: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 10G        
      CLANG_VERSION: clang-r547379
  
    steps:    
      - name: 🔧 Checkout Code
        uses: actions/checkout@v6      

      - name: 🔧 Install and Cache Build Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
      
          echo "📦 Updating package list..."
          sudo apt-get update -y
      
          echo "📥 Installing dependencies..."
          sudo apt-get install -y \
            git \
            dwarves \
            libelf-dev \
            ccache \
            automake \
            flex \
            bison \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libc6-dev-i386 \
            bc \
            device-tree-compiler \
            python3 \
            make
      
          echo "📁 Preparing workspace..."
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-${{ env.CLANG_VERSION }}
          restore-keys: |
            clang-aosp-

      - name: Download Clang Toolchain with Aria2
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
      
          echo "📥 Creating Toolchain Directory..."
          mkdir -p clang-aosp
      
          echo "⬇️ Downloading Clang Toolchain with Aria2..."
      
          aria2c -x 16 -s 16 -k 1M \
            --file-allocation=none \
            -o ${CLANG_VERSION}.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"
      
          echo "📦 Extracting..."
          tar -xzf ${CLANG_VERSION}.tar.gz -C clang-aosp
      
          echo "🧹 Cleaning up..."
          rm -f ${CLANG_VERSION}.tar.gz

      - name: Download Kernel Source 
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
      
          echo "📥 Cloning kernel (fast shallow + no blobs)"
          git clone --depth=1 --recursive \
            --filter=blob:none \
            https://github.com/LineageOS/android_kernel_oneplus_sm8750 \
            -b lineage-23.2 common
      
          cd common/scripts
          sed -i 's/ -dirty//g' setlocalversion
      
          cd $GITHUB_WORKSPACE/kernel_workspace
      
          echo "📥 Cloning modules"
          git clone --depth=1 --recursive \
            --filter=blob:none \
            https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules \
            -b lineage-23.2 sm8750-modules
      
          echo "⚙️ Patching config"
          sed -i '$a CONFIG_DODGE_DTB=y' common/arch/arm64/configs/vendor/oplus/sun_perf.config
          sed -i '$a CONFIG_KSU=y' common/arch/arm64/configs/vendor/oplus/sun_perf.config
          sed -i '$a CONFIG_KSU_SUSFS=y' common/arch/arm64/configs/vendor/oplus/sun_perf.config
          
      - name: 🔧 Configure Git Identity
        shell: bash
        run: |
          if ! git config --global user.name >/dev/null; then
            git config --global user.name "AndreiMikh"
          fi
          
          if ! git config --global user.email >/dev/null; then
            git config --global user.email "andreimikhail0088@gmail.com"
          fi
          
          git config --global --list

      - name: 🔧 Solve Root Engine Source
        id: manager
        run: |
          ROOTBRANCHSOURCE="${{ github.event.inputs.ROOTBRANCHSOURCE }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"

          # Solve KSU Meta Downloader Branch + Artifact
          case "$ROOTBRANCHSOURCE" in
            SukiSU-Ultra-Main)
              BRANCH="main"
              ARTIFACT="manager"
              ;;
            SukiSU-Ultra-Builtin)
              BRANCH="builtin"
              ARTIFACT="manager"
              ;;
            KernelSU-Next-Dev-SUSFS)
              BRANCH="dev"
              BRANCHPATH="dev-susfs"
              ARTIFACT="manager"
              ;;
            KernelSU-Next-Dev)
              BRANCH="dev"
              ARTIFACT="manager-spoofed"
              ;;
            WildKSU-Stable)
              BRANCH="stable"
              ARTIFACT="manager"
              ;;
            WildKSU-Stable-Spoofed)
              BRANCH="stable"
              ARTIFACT="manager-spoofed"
              ;;
            WildKSU-Canary)
              BRANCH="canary"
              ARTIFACT="manager"
              ;;
            WildKSU-Canary-Spoofed)
              BRANCH="stable"
              ARTIFACT="manager-spoofed"
              ;;
            KernelSU-Main)
              BRANCH="main"
              ARTIFACT="manager"
              ;;
            ReSukiSU-Main)
              BRANCH="main"
              ARTIFACT="Manager-release"
              ;;
            ReSukiSU-Main-Spoofed)
              BRANCH="main"
              ARTIFACT="Spoofed-Manager-release"
              ;;
            ReSukiSU-Dev)
              BRANCH="dev"
              ARTIFACT="Manager-release"
              ;;
            ReSukiSU-Dev-Spoofed|*)
              BRANCH="dev"
              ARTIFACT="Spoofed-Manager-release"
              ;;
          esac

          # Re-Solve Actual Repository (Critical Fix)
          case "$ROOTENGINE" in
            SukiSU-Ultra)
              KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
              ;;
            KernelSU-Next)
              KSUREPO="KernelSU-Next/KernelSU-Next"
              KSUREPOPATH="pershoot/KernelSU-Next"
              ;;
            WildKSU)
              KSUREPO="WildKernels/Wild_KSU"
              ;;
            ReSukiSU)
              KSUREPO="ReSukiSU/ReSukiSU"
              ;;
            KernelSU)
              KSUREPO="tiann/KernelSU"
              ;;
              
            *)
              echo "⚠️ Unsupported KSU Meta: $ROOTENGINE"
              exit 1
              ;;
          esac

          echo "MANAGERBRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "BRANCHPATH=$BRANCHPATH" >> "$GITHUB_OUTPUT"
          echo "MANAGERARTIFACT=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "KSUREPO=$KSUREPO" >> "$GITHUB_OUTPUT"
          echo "KSUREPOPATH=$KSUREPOPATH" >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "✔️ Resolved:"
          echo "📂 Repository  : $KSUREPO"
          echo "📂 Branch      : $BRANCH"
          echo "📂 Artifact    : $ARTIFACT"
          echo "------------------------------"
          echo ""

      - name: 🔧 Configure Selected Root Engine
        run: |      
          cd kernel_workspace/common

          MANAGERBRANCH="${{ steps.manager.outputs.MANAGERBRANCH }}"
          BRANCHPATH="${{ steps.manager.outputs.BRANCHPATH }}"
          KSUREPO="${{ steps.manager.outputs.KSUREPO }}"
          KSUREPOPATH="${{ steps.manager.outputs.KSUREPOPATH }}"
          ROOTENGINE="${{ github.event.inputs.ROOTENGINE }}"
          ROOTBRANCH="${{ github.event.inputs.ROOTBRANCHSOURCE }}"

          KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/common"
          DEFCONFIG="${KCDIR}/arch/arm64/configs/gki_defconfig"   
          
          # Helper Functions      
          # Get Commit-Count-Based Version
          gitcommitcountversion() {
            local KSUREPO="$1"
            local MANAGERBRANCH="$2"
            local OFFSET="$3"
      
            LASTPAGE=$(curl -sI \
              "https://api.github.com/repos/${KSUREPO}/commits?sha=${MANAGERBRANCH}&per_page=1" \
              | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
      
            echo $((LASTPAGE + OFFSET))
          }
      
          # Get Latest Git Tag
          gitlatesttag() {
            local KSUREPO="$1"
          
            local TAG
            TAG=$(git ls-remote --tags --sort="v:refname" "https://github.com/${KSUREPO}.git" \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -v '\^{}' \
              | tail -n1)
          
            if [[ -z "$TAG" ]]; then
              echo "v0.0.0"
            else
              echo "$TAG"
            fi
          }

          downloadsetup() {
            local urlsource1="$1"
            local urlsource2="${2:-}"
            local setupfile="setup.sh"
            local tmpfile
          
            tmpfile="$(mktemp)"
            trap 'rm -f "$tmpfile"' RETURN
          
            urlfetch() {
              local url="$1"

              echo "🌐 Using Source: $url"
          
              for i in {1..5}; do
                echo "📥 Attempt $i/5: $url"
          
                if curl -fsSL \
                  --retry 3 \
                  --retry-delay 2 \
                  --connect-timeout 10 \
                  --max-time 60 \
                  "$url" -o "$tmpfile"; then
          
                  # Validation
                  if [[ -s "$tmpfile" ]] \
                    && head -n1 "$tmpfile" | grep -q "^#"; then
          
                    # Reject HTML
                    if ! grep -qi "<html" "$tmpfile"; then
                      mv "$tmpfile" "$setupfile"
                      return 0
                    fi
                  fi
                fi
          
                sleep $((i * 2))
              done
          
              return 1
            }
          
            if urlfetch "$urlsource1"; then
              echo "📃 Primary Setup Downloaded"
            elif [[ -n "$urlsource2" ]] && urlfetch "$urlsource2"; then
              echo "📃 Fallback Setup Downloaded"
            else
              echo "⚠️ Failed to Download Setup Script from All Sources"
              exit 1
            fi
          
            [[ -s "$setupfile" ]] || { echo "⚠️ Empty Script"; exit 1; }
          
            chmod +x "$setupfile"
          
            echo "🔧 Executing Setup Script..."
            bash "$setupfile" "$MANAGERBRANCH" "${MANAGERPATH-}"
          }
      
          # SukiSU-Ultra Setup
          if [[ "$ROOTENGINE" == "SukiSU-Ultra"* ]]; then
            echo "🚀 Setting Up SukiSU-Ultra..."

            echo "------------------------------"
            echo "🔧 (Re-Solve) KSU Repository"
            echo "📦 Repository: ${KSUREPO}"
            echo "📦 Branch: ${MANAGERBRANCH}"
            echo "------------------------------"
      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"

            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
              
            cd KernelSU
      
            # Get Current Git Commit Short Commit Hash (8 Characters)
            GIT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
            echo "📃 Commit Hash: $GIT_COMMIT_HASH"
      
            # Fetch KSU API Version (Retry Up to 3 Times)
            for i in {1..3}; do
              RAW=$(curl -s "https://raw.githubusercontent.com/${KSUREPO}/builtin/kernel/Makefile")

              # Extract KSU API Version from Remote Makefile
              # Remove All Whitespace and Extract the Value After the Equals Sign              
              KSU_API_VERSION=$(echo "$RAW" | grep -m1 "KSU_VERSION_API" | cut -d '=' -f2 | tr -d '[:space:]' || true)

              echo "Fetched API version: ${KSU_API_VERSION:-EMPTY}"
              
              # If Version is Obtained, Break Loop, Otherwise Wait 1 Second and Retry
              [ -n "$KSU_API_VERSION" ] && break || sleep 1
            done
      
            # Fallback if Failed
            [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="3.1.7"
      
            echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
      
            # Define Version Format
            VERSION_DEFINITIONS=$'define get_ksu_version_full\nv\\$1-'"$GIT_COMMIT_HASH"$'@Andrei\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"$'@Andrei'
      
            # Clean Old Definitions
            sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile || true
            sed -i '/KSU_VERSION_API :=/d' kernel/Makefile || true
            sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile || true
      
            # Insert New Definitions safely
            awk -v def="$VERSION_DEFINITIONS" '
              /REPO_OWNER :=/ {print; print def; inserted=1; next}
              1
              END {if (!inserted) print def}
            ' kernel/Makefile > kernel/Makefile.tmp || true
            mv kernel/Makefile.tmp kernel/Makefile || true
    
            # Generate Custom Version Number (Based on Commit Count) Fallback
            KSU_VERSION=$(( $(git rev-list --count main 2>/dev/null || echo 114514) + 37185 ))
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
      
            # Verify (Non-Fatal)
            echo "Checking Repo Owner Section..."
            grep -A10 "REPO_OWNER" kernel/Makefile || echo "⚠️ ${ROOTENGINE} Repository Owner Not Found"
            
            echo "Checking KSU version..."
            grep "KSU_VERSION_FULL" kernel/Makefile || echo "⚠️ ${ROOTENGINE} Version Not Found"
        
            echo "SukiSU Version: v${KSU_API_VERSION}-${GIT_COMMIT_HASH}"

            # Clean Old Entry and Add New Format
            sed -i '/KSU_VERSION_FULL/d' "$DEFCONFIG"
            printf 'CONFIG_KSU_VERSION_FULL="%s-%s-Andrei"\n' "$KSU_API_VERSION" "$GIT_COMMIT_HASH" >> "$DEFCONFIG"    
                        
            echo "🎉 SukiSU-Ultra Ready"
      
          # ReSukiSU Setup
          elif [[ "$ROOTENGINE" == "ReSukiSU" ]]; then
            echo "🚀 Setting Up ReSukiSU..."
      
            echo "------------------------------"
            echo "🔧 (Re-Solve) KSU Repository"
            echo "📦 Repository: ${KSUREPO}"
            echo "📦 Branch: ${MANAGERBRANCH}"
            echo "------------------------------"
      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"

            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd KernelSU
      
            # Generate Version
            KSU_VERSION=$(( $(git rev-list --count main 2>/dev/null || echo 114514) + 30700 ))
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
      
            # Clean Old Entry and Add New Format
            sed -i '/CONFIG_KSU_FULL_NAME_FORMAT/d' "$DEFCONFIG"
            printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"
         
            echo "🎉 ReSukiSU Setup Complete"
      
          # KernelSU-Next Setup
          elif [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
            echo "🚀 Setting Up KernelSU-Next..."
      
            echo "------------------------------"
            echo "🔧 (Re-Solve) KSU Repository"
            echo "📦 Repository: ${KSUREPO}"
            echo "📦 Branch: ${MANAGERBRANCH}"
            echo "📦 Dev-SUSFS KSU Repository Path: ${KSUREPOPATH}"
            echo "📦 Dev-SUSFS KSU Branch Path: ${BRANCHPATH}"
            echo "------------------------------"

            # Download and Run Setup Script
            # Primary Source (Fork / Custom Path) and Fallback
            if [[ "$ROOTENGINE" == "KernelSU-Next" && -n "${KSUREPOPATH:-}" && -n "${MANAGERPATH:-}" ]]; then
              echo "🌐 Using Fork Source Only for KernelSU-Next"
              echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPOPATH}/${MANAGERPATH}/kernel/setup.sh"
          
              downloadsetup \
                "https://raw.githubusercontent.com/${KSUREPOPATH}/${MANAGERPATH}/kernel/setup.sh"
            else
              echo "🌐 Using Official KernelSU-Next Source"
              echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
          
              downloadsetup \
                "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
            fi
      
            cd KernelSU-Next
      
            KSU_VERSION=$(gitcommitcountversion "$KSUREPO" "$MANAGERBRANCH" 30000)
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
      
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild
      
            KSU_GIT_TAG=$(gitlatesttag "$KSUREPO")
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/" kernel/Kbuild

            echo "🎉 KernelSU-Next Setup Complete"
      
          # WildKernels WildKSU Setup
          elif [[ "$ROOTENGINE" == "WildKSU" ]]; then
            echo "🚀 Setting up WildKSU..."
      
            echo "------------------------------"
            echo "🔧 (Re-Solve) KSU Repository"
            echo "📦 Repository: ${KSUREPO}"
            echo "📦 Branch: ${MANAGERBRANCH}"
            echo "------------------------------"
      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"

            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd Wild_KSU
      
            KSU_VERSION=$(gitcommitcountversion "$KSUREPO" "$MANAGERBRANCH" 30000)
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
      
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild
      
            KSU_GIT_TAG=$(gitlatesttag "$KSUREPO")
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/" kernel/Kbuild
      
          # Official KernelSU Setup
          elif [[ "$ROOTENGINE" == "KernelSU" ]]; then
            echo "🚀 Setting Up KernelSU..."
      
            echo "------------------------------"
            echo "🔧 (Re-Solve) KSU Repository"
            echo "📦 Repository: ${KSUREPO}"
            echo "📦 Branch: ${MANAGERBRANCH}"
            echo "------------------------------"
      
            # Download and Run Setup Script (Official Source)
            echo "🌐 Using Official Source"
            echo "🌐 URL: https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"

            downloadsetup \
              "https://raw.githubusercontent.com/${KSUREPO}/${MANAGERBRANCH}/kernel/setup.sh"
      
            cd KernelSU
      
            KSU_VERSION=$(gitcommitcountversion "$KSUREPO" "$MANAGERBRANCH" 30000)
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
      
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild
            sed -i "s/^DKSU_VERSION=16$/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
      
          # No Selection
          else
            echo "⚠️ No KSU Meta Root Engine Selected, Skipping..."
          fi
             
      - name: Setup SUSFS Patches
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/common
      
          echo "Cloning SUSFS..."
          git clone --depth=1 -b gki-android15-6.6 \
            https://gitlab.com/simonpunk/susfs4ksu.git
      
          echo "Ensuring Directories Exist..."
          mkdir -p fs include/linux
      
          echo "Copying SUSFS Source Files..."
          cp -r susfs4ksu/kernel_patches/fs/. fs/
          cp -r susfs4ksu/kernel_patches/include/linux/. include/linux/
      
          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
      
          echo "Applying Kernel Patch..."
      
          if patch --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
            patch -p1 < "$PATCH_FILE"
            echo "✔ SUSFS Patch Applied"
          else
            echo "⚠️ Patch Skipped (Already Applied or Not Compatible)"
          fi

      - name: 🔧 Kernel Configuration
        run: |          
          # Navigate to the Correct Directory
          cd kernel_workspace/common

          # Set the Path to the Configuration File
          DEFCONFIG=./arch/arm64/configs/gki_defconfig

          # Get Github Environment Variables and GitHub Actions Inputs        
          ROOT="${{ github.event.inputs.ROOTENGINE }}"
          TCP="${{ github.event.inputs.TCPALGORITHM }}"

          # Check if KSU Meta Root Engine is ReSukiSU
          if [[ "$ROOT" == "ReSukiSU" ]]; then
            # Enable Multi-Manager Support if the Condition is True
            cat >> "$DEFCONFIG" << EOF
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          EOF
            echo "🎉 Multi-Manager Support Enabled for $ROOT"
          else
            echo "☘️ Multi-Manager Support Not Enabled, as KSU Meta Root Engine is Not ReSukiSU"
          fi

          # KSU Meta Root Engine Configuration
          cat >> "$DEFCONFIG" << EOF
          CONFIG_KSU=y                    
          CONFIG_KSU_SUSFS=y              
          EOF

          # Apply SUSFS Meta Core Configuration           
            # Base SUSFS Meta Core Configuration Settings (Common)
            cat >> "$DEFCONFIG" << EOF
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          
          # TMPFS Configuration (Mountify)
          echo "🚀 Applying TMPFS Configuration..."
          cat >> "$DEFCONFIG" << EOF
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          echo "🎉 TMPFS Configuration Applied"
          
      - name: Build Kernel
        run: |
          cd ${GITHUB_WORKSPACE}/kernel_workspace/common

          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export LTO=thin

          export PATH=${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin:$PATH
          export KBUILD_BUILD_HOST=Github-Action

          echo "⚙️ Starting config..."

          make O=out \
            ARCH=$ARCH \
            SUBARCH=$SUBARCH \
            HEADER_ARCH=$HEADER_ARCH \
            CC=clang CXX=clang++ \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size \
            STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
            gki_defconfig vendor/sun_perf.config vendor/oplus/sun_perf.config

          scripts/config --file out/.config \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e THINLTO

          echo "🚀 Building kernel..."
          make -j"$(nproc)" O=out
      
      - name: Check Kernel Output Files
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -f common/out/arch/arm64/boot/Image ]; then
              echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          else
              echo "Kernel Output File is Empty"
              exit 1
          fi
        
      - name: Make AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 https://github.com/AndreiMikh/AnyKernel3
          rm -rf AnyKernel3/.git
          cp common/out/arch/arm64/boot/Image AnyKernel3/
    
      - name: Upload Image
        uses: actions/upload-artifact@v7
        with:
          name: Image-Official-KSU
          path: kernel_workspace/common/out/arch/arm64/boot/Image
  
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: AK3-LineageOS-23.2-Dodge-Official
          path: kernel_workspace/AnyKernel3/*
