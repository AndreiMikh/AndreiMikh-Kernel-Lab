name: ☘️ Build AOSP Kernel

on:
  workflow_dispatch:
    inputs:
      ksumeta:
        description: 'KernelSU Variant (ReSukiSU = Built-in KSU, None = No KSU)'
        required: true
        type: choice
        default: resukisu
        options: [resukisu, none]
      susfsmeta:
        description: 'Enable SUSFS (Requires KernelSU)'
        required: true
        type: boolean
        default: true
      neonlz4:
        description: 'Update Kernel Compression Libraries to LZ4 1.10 + ZSTD 1.5.7'
        required: true
        type: boolean
        default: true
      droidspaces:
        description: 'Droidspaces Container (false = disabled, standard = NTSYNC, extend = NTSYNC + EVDI)'
        required: true
        type: choice
        default: standard
        options: [false, standard, extend]
      basebandguard:
        description: 'Kernel-Level Baseband Guard'
        required: true
        type: boolean
        default: true
      netfilter:
        description: 'Netfilter (IPSet / IPTables)'
        required: true
        type: boolean
        default: true
      bbr:
        description: 'BBR TCP Congestion Control'
        required: true
        type: boolean
        default: true
      kpmodule:
        description: 'KPM / KPN Support'
        required: true
        type: boolean
        default: false
      rekernel:
        description: 'ReKernel Support'
        required: true
        type: boolean
        default: true
      ksuffix:
        description: 'Kernel Version Suffix (Empty = Source Commit)'
        required: false
        type: string
        default: ''
      attribute:
        description: 'Kernel / KSU Build Attribution'
        required: true
        type: boolean
        default: true
      builduser:
        description: 'Kernel Build User'
        required: false
        type: string
        default: AndreiMikh
      buildhost:
        description: 'Kernel Build Host'
        required: false
        type: string
        default: AOSP-Builder
      enablerelease:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      artifactmode:
        description: 'Artifacts (ak3 = AnyKernel3, all = AnyKernel3 + Image + boot.img)'
        required: true
        type: choice
        default: ak3
        options: [ak3, all]
      buildccacheupdate:
        description: 'Update Public CCache Release'
        required: true
        type: boolean
        default: false
      buildccachedebug:
        description: 'Upload CCache Debug Log'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release Tag (Empty = Auto Date)'
        required: false
        type: string
        default: ''
      kbuildtime:
        description: 'Custom Build Timestamp (Empty = Current UTC Time)'
        required: false
        type: string
        default: ''
      debugskipbuild:
        description: 'Debug: Skip Kernel Build and Create Dummy Image'
        required: true
        type: boolean
        default: false

concurrency:
  group: AOSP-Kernel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
      ksuver: ${{ steps.ksuversion.outputs.ksuver }}
      kernelrel: ${{ steps.verify.outputs.kernelrel }}
      kernelver: ${{ steps.verify.outputs.kernelver }}

    env:
      KERNEL_SOURCE_BASE: ${{ vars.KERNELSOURCE || 'https://github.com' }}
      KERNEL_ORG: LineageOS
      KERNEL_REPO: android_kernel_oneplus_sm8750
      KERNEL_BRANCH: lineage-23.2
      KERNEL_MODULES_REPO: android_kernel_oneplus_sm8750-modules
      KERNEL_DT_REPO: android_kernel_oneplus_sm8750-devicetrees
      CLANG_VERSION: r563880c
      CLANG_ARCHIVE: clang-r563880c.tar.gz
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b5f16aee7b8af4c339972027e91e7e793c2e55d9/clang-r563880c.tar.gz
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: gki-android15-6.6
      KSU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      KSU_REF: ''
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      SOURCE_DIR: ${{ github.workspace }}/work/src
      WORK_DIR: ${{ github.workspace }}/work

    steps:
      - name: 📥 Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # Toolchain
      # ----------------------------------------------------------------------
      - name: 🔎 Resolve Clang Revision
        id: clang-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Clang: ${CLANG_VERSION}"
          echo "Archive: ${CLANG_ARCHIVE}"
          echo "clang_key=aosp-clang-${CLANG_VERSION}-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"

      - name: 💾 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clang_key }}

      - name: 📥 Download AOSP Clang 21
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "📥 Downloading AOSP Clang 21 (${CLANG_VERSION})..."
          rm -rf clang "${CLANG_ARCHIVE}"
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 1800 \
            "$CLANG_URL" -o "$CLANG_ARCHIVE"
          test -s "$CLANG_ARCHIVE"
          mkdir -p clang
          tar -xzf "$CLANG_ARCHIVE" -C clang
          rm -f "$CLANG_ARCHIVE"
          test -x clang/bin/clang
          test -x clang/bin/ld.lld
          echo "✅ AOSP Clang installed"
          clang/bin/clang --version

      - name: 💾 Save AOSP Clang Cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clang_key }}

      - name: 🔧 Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex zip unzip zstd patch \
            libssl-dev libncurses-dev libelf-dev \
            dwarves python3 ccache mkbootimg

      - name: 🧰 Setup Clang Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          CLANGROOT="$GITHUB_WORKSPACE/clang"
          CLANGBIN="$CLANGROOT/bin"

          echo "🔍 Checking Clang toolchain..."

          # Make sure the expected toolchain exists.
          if [[ ! -x "$CLANGBIN/clang" ]]; then
            echo "❌ Missing: $CLANGBIN/clang"
            echo "Contents:"
            find "$CLANGROOT" -maxdepth 3 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          if [[ ! -x "$CLANGBIN/ld.lld" ]]; then
            echo "❌ Missing: $CLANGBIN/ld.lld"
            echo "Available LLD binaries:"
            find "$CLANGROOT" -type f \
              \( -name 'ld.lld' -o -name 'lld' -o -name 'ld64.lld' \) \
              -print 2>/dev/null || true
            exit 1
          fi

          # Put our toolchain FIRST.
          echo "$CLANGBIN" >> "$GITHUB_PATH"

          # Export absolute paths for the kernel build.
          {
            echo "CLANG_BIN=$CLANGBIN"
            echo "LLVM=$CLANGBIN/"
            echo "LD=$CLANGBIN/ld.lld"
            echo "HOSTLD=$CLANGBIN/ld.lld"
            echo "PATH=$CLANGBIN:\$PATH"
          } >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "🎉 Clang Toolchain Ready"
          echo "========================================"
          echo "Clang : $CLANGBIN/clang"
          echo "LLD   : $CLANGBIN/ld.lld"
          echo

          # IMPORTANT: use absolute paths for verification.
          "$CLANGBIN/clang" --version
          "$CLANGBIN/ld.lld" --version

          echo
          echo "Resolved binaries:"
          command -v clang
          command -v ld.lld

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          # GKI certificate stub
          mkdir -p /tmp/gki

          cat > /tmp/gki/generate_gki_certificate.py <<'PY'
          def generate_gki_certificate(*args, **kwargs):
          raise SystemExit("GKI SIGNING NOT SUPPORTED (STUB)")
          PY

          echo "PYTHONPATH=/tmp/gki" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Runner cleanup
      # ----------------------------------------------------------------------
      - name: 🧹 Clean Runner Space
        shell: bash
        run: |
          set -Eeuo pipefail
          for DIR in \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL; do
            if [ -e "$DIR" ]; then
              sudo rm -rf "$DIR" || true
            fi
          done
          df -h

      # ----------------------------------------------------------------------
      # Source revision + source cache
      # ----------------------------------------------------------------------
      - name: 🔎 Resolve Kernel Source Commit
        id: source-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="${KERNEL_SOURCE_BASE%/}"
          REPO_URL="$BASE/$KERNEL_ORG/$KERNEL_REPO.git"
          echo "📌 Repository: $REPO_URL"
          echo "📌 Branch: $KERNEL_BRANCH"

          SRC_COMMIT="$(git ls-remote "$REPO_URL" "refs/heads/$KERNEL_BRANCH" | awk 'NR==1 {print $1}')"
          if [ -z "$SRC_COMMIT" ]; then
            echo "❌ Failed to resolve kernel source commit"
            exit 1
          fi

          echo "SRC_COMMIT=$SRC_COMMIT" >> "$GITHUB_ENV"
          echo "source_commit=$SRC_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_short=${SRC_COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "📌 Source Commit: $SRC_COMMIT"

      - name: 🧮 Compute Build Fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          FP_INPUT=$(cat <<EOF
          source=${SRC_COMMIT}
          ksu=${{ inputs.ksumeta }}
          susfs=${{ inputs.susfsmeta }}
          lz4=${{ inputs.neonlz4 }}
          droidspaces=${{ inputs.droidspaces }}
          bbg=${{ inputs.basebandguard }}
          netfilter=${{ inputs.netfilter }}
          bbr=${{ inputs.bbr }}
          kpm=${{ inputs.kpmodule }}
          rekernel=${{ inputs.rekernel }}
          suffix=${{ inputs.ksuffix }}
          clang=${CLANG_VERSION}
          EOF
          )
          FP=$(printf '%s' "$FP_INPUT" | sha256sum | cut -c1-32)
          echo "build_fp=$FP" >> "$GITHUB_OUTPUT"
          echo "CCACHE_FP=$FP" >> "$GITHUB_ENV"
          echo "📌 Build Fingerprint: $FP"

      - name: 💾 Restore Kernel Source Cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/src
            work/sm8750-modules
            work/sm8750-devicetrees
          key: kernel-sm8750-${{ steps.source-meta.outputs.source_commit }}

      - name: 📥 Download Kernel Sources
        if: steps.source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="${KERNEL_SOURCE_BASE%/}"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          rm -rf src sm8750-modules sm8750-devicetrees *.zip

          echo "📥 Downloading kernel source, modules and device trees in parallel..."
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$BASE/$KERNEL_ORG/$KERNEL_REPO/archive/refs/heads/$KERNEL_BRANCH.zip" \
            -o src.zip &
          P1=$!
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$BASE/$KERNEL_ORG/$KERNEL_MODULES_REPO/archive/refs/heads/$KERNEL_BRANCH.zip" \
            -o modules.zip &
          P2=$!
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$BASE/$KERNEL_ORG/$KERNEL_DT_REPO/archive/refs/heads/$KERNEL_BRANCH.zip" \
            -o dt.zip &
          P3=$!
          wait "$P1" "$P2" "$P3"

          test -s src.zip
          test -s modules.zip
          test -s dt.zip

          unzip -q src.zip
          unzip -q modules.zip
          unzip -q dt.zip

          mv "${KERNEL_REPO}-${KERNEL_BRANCH}" src
          mv "${KERNEL_MODULES_REPO}-${KERNEL_BRANCH}" sm8750-modules
          mv "${KERNEL_DT_REPO}-${KERNEL_BRANCH}" sm8750-devicetrees
          rm -f src.zip modules.zip dt.zip

          test -d src
          test -d sm8750-modules
          test -d sm8750-devicetrees
          echo "✅ Kernel sources prepared"

      - name: 💾 Save Kernel Source Cache
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/src
            work/sm8750-modules
            work/sm8750-devicetrees
          key: kernel-sm8750-${{ steps.source-meta.outputs.source_commit }}

      - name: 🔗 Verify Kernel Source Layout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          for TARGET in \
            drivers/base/kernelFwUpdate/Kconfig \
            arch/arm64/boot/dts/vendor; do
            test -e "$TARGET" || {
              echo "❌ Missing source target: $TARGET"
              exit 1
            }
          done
          echo "✅ Kernel source layout verified"

      # ----------------------------------------------------------------------
      # CCache
      # ----------------------------------------------------------------------
      - name: 🔧 Configure CCache
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f "$GITHUB_WORKSPACE/lib/ccache-ecs" ]; then
            sudo install -m 0755 "$GITHUB_WORKSPACE/lib/ccache-ecs" /usr/local/bin/ccache
          fi

          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR
          export CCACHE_MAXSIZE
          export CCACHE_IS_KERNEL_COMPILING=true
          export CCACHE_COMPILERCHECK=content

          cat > "$CCACHE_DIR/ccache.conf" <<'EOF'
          max_size = 8G
          compression = true
          compression_level = 5
          compiler_check = content
          sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
          EOF

          ccache --version
          ccache -z

      - name: 💾 Restore GitHub CCache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}
          restore-keys: |
            ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-
            ccache-sm8750-lineage-

      - name: 📦 Pull Public CCache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ARCHIVE="ccache-sm8750-lineage.tar.zst"

          if gh release download ccache-sm8750-lineage \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" \
            --clobber; then
            echo "📦 Public CCache found; merging..."
            tar -I zstd -xf "$ARCHIVE" -C "$CCACHE_DIR"
            rm -f "$ARCHIVE"
            ccache -M "$CCACHE_MAXSIZE"
            echo "✅ Public CCache merged"
          else
            echo "ℹ️ No public CCache release found"
          fi

      # ----------------------------------------------------------------------
      # Kernel patches
      # ----------------------------------------------------------------------
      - name: 🔧 Apply Compiler Fixes
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -Eeuo pipefail
          patch -p1 -F3 --batch --forward \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-Compiler-Fix-AOSP.patch"

      - name: 🔧 Apply KSU Hooks
        if: inputs.ksumeta != 'none'
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -Eeuo pipefail
          patch -p1 -F3 --batch --forward \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-KSUMeta-Hooks-AOSP.patch"

      # ----------------------------------------------------------------------
      # ReSukiSU + SUSFS
      # ----------------------------------------------------------------------
      - name: 🔎 Resolve ReSukiSU Revision
        if: inputs.ksumeta != 'none'
        id: ksu-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          KSU_COMMIT="$(git ls-remote "$KSU_REPO" HEAD | awk 'NR==1 {print $1}')"
          test -n "$KSU_COMMIT"
          echo "commit=$KSU_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${KSU_COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "📌 ReSukiSU Commit: ${KSU_COMMIT:0:12}"

      - name: 💾 Restore ReSukiSU Cache
        if: inputs.ksumeta != 'none'
        id: ksu-cache
        uses: actions/cache/restore@v4
        with:
          path: work/KernelSU-pristine
          key: resukisu-${{ steps.ksu-meta.outputs.commit }}

      - name: 📥 Clone ReSukiSU
        if: inputs.ksumeta != 'none' && steps.ksu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/KernelSU-pristine
          git clone --depth=1 "$KSU_REPO" work/KernelSU-pristine
          test -f work/KernelSU-pristine/kernel/Kbuild
          echo "✅ ReSukiSU cloned"

      - name: 💾 Save ReSukiSU Cache
        if: inputs.ksumeta != 'none' && steps.ksu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/KernelSU-pristine
          key: resukisu-${{ steps.ksu-meta.outputs.commit }}

      - name: 🔧 Integrate ReSukiSU
        if: inputs.ksumeta != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          rm -rf KernelSU drivers/kernelsu
          cp -a "$WORK_DIR/KernelSU-pristine" KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          test -d KernelSU/kernel
          test -L drivers/kernelsu
          echo "✅ ReSukiSU integrated"

      - name: 🧮 Compute KSU Version
        id: ksuversion
        if: inputs.ksumeta != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          # Keep the existing versioning scheme while avoiding a full history clone.
          # The revision itself is recorded in the build logs.
          COUNT="$(git -C "$SOURCE_DIR/KernelSU" rev-list --count HEAD 2>/dev/null || echo 1)"
          VER=$((30000 + COUNT + 700))
          echo "ksuver=$VER" >> "$GITHUB_OUTPUT"
          echo "KSU_VERSION=$VER" >> "$GITHUB_ENV"
          echo "KSU Version: $VER"

      - name: 🔎 Resolve SUSFS Revision
        if: inputs.susfsmeta && inputs.ksumeta != 'none'
        id: susfs-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          SUSFS_COMMIT="$(git ls-remote "$SUSFS_REPO" "refs/heads/$SUSFS_BRANCH" | awk 'NR==1 {print $1}')"
          test -n "$SUSFS_COMMIT"
          echo "commit=$SUSFS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${SUSFS_COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "📌 SUSFS Commit: ${SUSFS_COMMIT:0:12}"

      - name: 💾 Restore SUSFS Cache
        if: inputs.susfsmeta && inputs.ksumeta != 'none'
        id: susfs-cache
        uses: actions/cache/restore@v4
        with:
          path: work/susfs
          key: susfs-${{ steps.susfs-meta.outputs.commit }}

      - name: 📥 Clone SUSFS
        if: inputs.susfsmeta && inputs.ksumeta != 'none' && steps.susfs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf work/susfs
          git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" work/susfs
          test -f work/susfs/susfs.c -o -f work/susfs/include/linux/susfs.h -o -f work/susfs/susfs.h

      - name: 💾 Save SUSFS Cache
        if: inputs.susfsmeta && inputs.ksumeta != 'none' && steps.susfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/susfs
          key: susfs-${{ steps.susfs-meta.outputs.commit }}

      - name: 🔧 Integrate SUSFS
        if: inputs.susfsmeta && inputs.ksumeta != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$SOURCE_DIR"
          SUSFS_DIR="$WORK_DIR/susfs"
          SUSFS_PATCH="$GITHUB_WORKSPACE/patches/AOSP/001-SUSFS-Main-AOSP.patch"
          KSU_PATCH="$GITHUB_WORKSPACE/patches/AOSP/002-SUSFS-Main-AOSP.patch"

          test -d "$SRC"
          test -f "$SUSFS_PATCH"
          test -f "$KSU_PATCH"

          echo "🔧 SUSFS + KSU Integration"
          echo "📌 SUSFS: $SUSFS_REPO"
          echo "📌 Branch: $SUSFS_BRANCH"

          test -d "$SUSFS_DIR"
          SUSFS_COMMIT="${{ steps.susfs-meta.outputs.commit }}"
          SUSFS_SHORT="${SUSFS_COMMIT:0:12}"
          echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
          echo "📌 SUSFS Commit: $SUSFS_SHORT"

          SUSFSC="$(find "$SUSFS_DIR" -type f -name susfs.c -print -quit)"
          SUSFSH="$(find "$SUSFS_DIR" -type f -name susfs.h -print -quit)"
          SUSFSDEFH="$(find "$SUSFS_DIR" -type f -name susfs_def.h -print -quit)"

          for FILE in "$SUSFSC" "$SUSFSH" "$SUSFSDEFH"; do
            test -n "$FILE" || {
              echo "❌ SUSFS source layout is incompatible with this integration"
              find "$SUSFS_DIR" -maxdepth 4 -type f | sort | head -n 200
              exit 1
            }
          done

          # Validate the API expected by the supplied AOSP SUSFS patch before changing the kernel.
          grep -Rqs 'susfs_is_current_proc_no_su' "$SUSFS_DIR" || {
            echo "❌ Required SUSFS API not found: susfs_is_current_proc_no_su"
            exit 1
          }

          cd "$SRC"
          echo "🔧 Applying SUSFS kernel patch..."
          patch -p1 -F3 --batch --forward \
            < "$SUSFS_PATCH"

          install -Dm0644 "$SUSFSC" "$SRC/fs/susfs.c"
          install -Dm0644 "$SUSFSH" "$SRC/include/linux/susfs.h"
          install -Dm0644 "$SUSFSDEFH" "$SRC/include/linux/susfs_def.h"

          test -f "$SRC/fs/susfs.c"
          test -f "$SRC/include/linux/susfs.h"
          test -f "$SRC/include/linux/susfs_def.h"

          echo "🔧 Applying SUSFS KSU adaptation..."
          cd "$SRC/KernelSU"
          git apply --check "$KSU_PATCH"
          git apply "$KSU_PATCH"

          cd "$SRC"
          grep -Rqs 'CONFIG_KSU_SUSFS' KernelSU fs include || {
            echo "❌ CONFIG_KSU_SUSFS was not integrated"
            exit 1
          }
          grep -Rqs 'susfs_is_current_proc_no_su' fs include || {
            echo "❌ Installed SUSFS API validation failed"
            exit 1
          }

          echo "🎉 SUSFS Integration Complete"
          echo "📌 SUSFS Commit: $SUSFS_SHORT"

      # ----------------------------------------------------------------------
      # Optional features
      # ----------------------------------------------------------------------
      - name: 🔧 Integrate LZ4 OPlus
        if: inputs.neonlz4
        shell: bash
        run: |
          set -Eeuo pipefail
          LZ4_DIR="$WORK_DIR/lz4_oplus"
          rm -rf "$LZ4_DIR"
          git clone --depth=1 https://github.com/Numbersf/lz4_oplus.git "$LZ4_DIR"
          test -f "$LZ4_DIR/apply_lz4_oplus.sh"
          cd "$SOURCE_DIR"
          bash "$LZ4_DIR/apply_lz4_oplus.sh"
          echo "✅ LZ4 OPlus integration complete"

      - name: 🔧 Apply Droidspaces
        if: inputs.droidspaces != 'false'
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -Eeuo pipefail
          patch -p1 -F3 --batch --forward \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-Droidspaces-AOSP.patch"

      - name: 🔧 Integrate Baseband Guard
        if: inputs.basebandguard
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$SOURCE_DIR"
          URL="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          MAXRETRIES=4
          DELAYRETRIES=3

          test -d "$SRC"
          cd "$SRC"
          rm -rf Baseband-guard

          APPLIED=false
          for ATTEMPT in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL --retry 3 --retry-all-errors "$URL" | bash -s -- main; then
              APPLIED=true
              break
            fi
            echo "⚠️ Baseband Guard attempt $ATTEMPT/$MAXRETRIES failed"
            [ "$ATTEMPT" -lt "$MAXRETRIES" ] && sleep "$DELAYRETRIES"
          done

          [ "$APPLIED" = true ] || {
            echo "❌ Failed to apply Baseband Guard"
            exit 1
          }

          BBG_PATH=""
          if [ -d "$SRC/Baseband-guard" ]; then
            BBG_PATH="$SRC/Baseband-guard"
          else
            BBG_PATH="$(find "$SRC" -maxdepth 4 -type d -name Baseband-guard -print -quit || true)"
          fi

          test -n "$BBG_PATH" && test -f "$BBG_PATH/baseband_guard.c" || {
            echo "❌ Baseband Guard source not found"
            exit 1
          }

          KCONFIG="$SRC/security/Kconfig"
          test -f "$KCONFIG"

          # Add baseband_guard to the existing LSM default only when it is not already present.
          python3 - "$KCONFIG" <<'PY'
          from pathlib import Path
          import re

          p = Path(__import__('sys').argv[1])
          s = p.read_text()
          if 'baseband_guard' in s:
              raise SystemExit(0)

          m = re.search(r'(^config LSM\n.*?)(?=^config |\Z)', s, re.M | re.S)
          if not m:
              raise SystemExit('config LSM block not found')

          block = m.group(1)
          lines = block.splitlines(True)
          changed = False
          for i, line in enumerate(lines):
              if re.match(r'^\s*default\s+.*selinux', line):
                  lines[i] = line.replace('selinux', 'selinux,baseband_guard', 1)
                  changed = True
                  break
          if not changed:
              raise SystemExit('LSM default line not found')

          s = s[:m.start(1)] + ''.join(lines) + s[m.end(1):]
          p.write_text(s)
          PY

          if [ -f .config ]; then
            ./scripts/config --file .config -e CONFIG_BBG
          fi

          grep -q 'baseband_guard' "$KCONFIG"
          test -f "$BBG_PATH/baseband_guard.c"
          echo "✅ Baseband Guard integrated"

      - name: 🔧 Apply ReKernel
        if: inputs.rekernel
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -Eeuo pipefail
          patch -p1 -F3 --batch --forward \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-ReKernel-AOSP.patch"

      - name: 📦 Copy Extra Droidspaces Files
        if: inputs.droidspaces != 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          EXTRA_REPO="$WORK_DIR/extra-files"
          rm -rf "$EXTRA_REPO"
          git clone --depth=1 https://github.com/GuLingguang/oneplus-sm8750-kernel-pro-build.git "$EXTRA_REPO"
          EXTRA="$EXTRA_REPO/patches/extra"

          test -f "$EXTRA/drivers/misc/ntsync.c"
          test -f "$EXTRA/include/uapi/linux/ntsync.h"
          test -d "$EXTRA/drivers/gpu/drm/evdi"

          install -Dm0644 "$EXTRA/drivers/misc/ntsync.c" \
            "$SOURCE_DIR/drivers/misc/ntsync.c"
          install -Dm0644 "$EXTRA/include/uapi/linux/ntsync.h" \
            "$SOURCE_DIR/include/uapi/linux/ntsync.h"
          rm -rf "$SOURCE_DIR/drivers/gpu/drm/evdi"
          cp -a "$EXTRA/drivers/gpu/drm/evdi" "$SOURCE_DIR/drivers/gpu/drm/"

      # ----------------------------------------------------------------------
      # Configuration
      # ----------------------------------------------------------------------
      - name: ⚙️ Configure Kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"

          cp "$GITHUB_WORKSPACE/patches/AOSP/Config-SM8750-AOSP.config" .config

          if [ -n "${{ inputs.ksuffix }}" ]; then
            LOCALVERSION="-4k-${{ inputs.ksuffix }}"
          else
            LOCALVERSION="-4k-g${SRC_COMMIT:0:12}"
          fi

          ./scripts/config --file .config \
            --set-str CONFIG_LOCALVERSION "$LOCALVERSION" \
            -d CONFIG_LOCALVERSION_AUTO

          if [ "${{ inputs.ksumeta }}" = "none" ]; then
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          fi

          if [ "${{ inputs.susfsmeta }}" != "true" ] || [ "${{ inputs.ksumeta }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU_SUSFS
          fi

          case "${{ inputs.droidspaces }}" in
            false)
              ./scripts/config --file .config \
                -d CONFIG_SYSVIPC \
                -d CONFIG_NTSYNC \
                -d CONFIG_DRM_LINDROID_EVDI
              ;;
            standard)
              ./scripts/config --file .config \
                -e CONFIG_SYSVIPC \
                -e CONFIG_NTSYNC \
                -d CONFIG_DRM_LINDROID_EVDI
              ;;
            extend)
              ./scripts/config --file .config \
                -e CONFIG_SYSVIPC \
                -e CONFIG_NTSYNC \
                -e CONFIG_DRM_LINDROID_EVDI
              ;;
          esac

          if [ "${{ inputs.netfilter }}" = "true" ]; then
            ./scripts/config --file .config \
              -e CONFIG_IP_SET \
              -e CONFIG_BPF_STREAM_PARSER \
              -e CONFIG_IP6_NF_NAT
          else
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          fi

          if [ "${{ inputs.bbr }}" = "true" ]; then
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          if [ "${{ inputs.rekernel }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_REKERNEL
          fi

          if [ "${{ inputs.basebandguard }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_BBG || true
          else
            ./scripts/config --file .config -d CONFIG_BBG || true
          fi

          export LLVM=1
          export LLVM_IAS=1
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig

          grep -q "CONFIG_LOCALVERSION=\"$LOCALVERSION\"" .config || {
            echo "❌ CONFIG_LOCALVERSION validation failed"
            grep CONFIG_LOCALVERSION .config || true
            exit 1
          }
          echo "✅ Kernel configuration complete"

      - name: 🔍 Validate Configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          echo "Kernel: $(grep '^CONFIG_LOCALVERSION=' .config || true)"
          echo "KSU: $(grep '^CONFIG_KSU=' .config || true)"
          echo "SUSFS: $(grep '^CONFIG_KSU_SUSFS=' .config || true)"
          echo "BBG: $(grep '^CONFIG_BBG=' .config || true)"
          echo "BBR: $(grep '^CONFIG_TCP_CONG_BBR=' .config || true)"
          echo "NTSYNC: $(grep '^CONFIG_NTSYNC=' .config || true)"
          echo "EVDI: $(grep '^CONFIG_DRM_LINDROID_EVDI=' .config || true)"

      # ----------------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------------
      - name: 🔨 Build Kernel
        if: ${{ !inputs.debugskipbuild }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          sudo sysctl -w vm.max_map_count=1048576

          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="$builduser"
          export KBUILD_BUILD_HOST="$buildhost"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_MAXSIZE=8G
          export CCACHE_IS_KERNEL_COMPILING=true
          export CCACHE_COMPILERCHECK=content

          if [ "${{ inputs.buildccachedebug }}" = "true" ]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          if [ -n "${{ inputs.kbuildtime }}" ] && \
             [ "${{ inputs.kbuildtime }}" != "N" ] && \
             [ "${{ inputs.kbuildtime }}" != "n" ]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.kbuildtime }}"
          fi

          # Reproducible timestamp libraries, but with absolute paths and a safe wrapper.
          chmod 0755 "$GITHUB_WORKSPACE/lib"/*.so 2>/dev/null || true
          LIBDIR="$GITHUB_WORKSPACE/lib"
          PRELOAD_LIBS="$LIBDIR/libfakestat.so:$LIBDIR/libfaketimeMT.so"
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          cat > "$GITHUB_WORKSPACE/cc-wrapper" <<EOF
          #!/bin/bash
          set -e
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ccache "$GITHUB_WORKSPACE/clang/bin/clang" "\$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/cc-wrapper"

          echo "🔨 Starting kernel build..."
          echo "CPU threads: $(nproc)"
          echo "CCache directory: $CCACHE_DIR"

          make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/cc-wrapper" \
            LD="$GITHUB_WORKSPACE/clang/bin/ld.lld" \
            HOSTLD="$GITHUB_WORKSPACE/clang/bin/ld.lld" \
            KCFLAGS=-O2 \
            -j"$(nproc)" \
            Image

          test -s arch/arm64/boot/Image
          echo "✅ Kernel build complete"
          ccache -s

      - name: 🧪 Create Dummy Image
        if: inputs.debugskipbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SOURCE_DIR/arch/arm64/boot"
          printf 'DEBUG DUMMY IMAGE\n' > "$SOURCE_DIR/arch/arm64/boot/Image"
          echo "⚠️ Dummy Image created"

      # ----------------------------------------------------------------------
      # Verify / post-build
      # ----------------------------------------------------------------------
      - name: 🔍 Verify Kernel Image
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR"
          test -s arch/arm64/boot/Image

          if [ "${{ inputs.debugskipbuild }}" != "true" ]; then
            strings arch/arm64/boot/Image | grep -q 'Linux version 6.6.139' || {
              echo "❌ Unexpected kernel version in Image"
              strings arch/arm64/boot/Image | grep -m1 'Linux version' || true
              exit 1
            }
          fi

          REL="$(cat include/config/kernel.release 2>/dev/null || true)"
          VER="$(grep -oE '#[0-9]+ SMP[^\"]*' include/generated/utsversion.h 2>/dev/null | head -1 || true)"
          if [ -z "$VER" ] && [ "${{ inputs.debugskipbuild }}" != "true" ]; then
            VER="$(strings arch/arm64/boot/Image | grep -oE '#[0-9]+ SMP PREEMPT[^\"]*' | head -1 || true)"
          fi

          echo "kernelrel=$REL" >> "$GITHUB_OUTPUT"
          echo "kernelver=$VER" >> "$GITHUB_OUTPUT"
          echo "📌 Kernel Release: $REL"
          echo "📌 Kernel Version: $VER"
          ls -lh arch/arm64/boot/Image

      - name: 🧩 Apply KPM Patch
        if: inputs.kpmodule && !inputs.debugskipbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_DIR/arch/arm64/boot"
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux \
            -o kptools-linux
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux \
            -o kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux -p -i Image -k kpimg-linux -o oImage
          mv oImage Image
          rm -f kptools-linux kpimg-linux
          test -s Image
          echo "✅ KPM patched"

      # ----------------------------------------------------------------------
      # CCache save / public cache
      # ----------------------------------------------------------------------
      - name: 💾 Save GitHub CCache
        if: inputs.buildccacheupdate
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-sm8750-lineage-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}

      - name: 📦 Upload Public CCache
        if: inputs.buildccacheupdate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ccache -s || true
          ARCHIVE="ccache-sm8750-lineage.tar.zst"
          rm -f "$ARCHIVE"

          echo "📦 Packaging CCache..."
          tar -I 'zstd -T0 -5' -cf "$ARCHIVE" -C "$CCACHE_DIR" .
          echo "CCache archive size: $(du -h "$ARCHIVE" | cut -f1)"

          if gh release view ccache-sm8750-lineage --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ccache-sm8750-lineage "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create ccache-sm8750-lineage "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'SM8750 Public CCache' \
              --notes 'Public CCache for OPlus SM8750 AOSP/Lineage kernel builds.'
          fi
          echo "✅ Public CCache uploaded"

      - name: 📋 Upload CCache Debug Log
        if: inputs.buildccachedebug
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log
          path: ccache.log
          if-no-files-found: ignore
          retention-days: 7

      # ----------------------------------------------------------------------
      # Packaging
      # ----------------------------------------------------------------------
      - name: 📥 Clone AnyKernel3
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf ak3
          git clone --depth=1 --branch master \
            https://github.com/AndreiMikh/AnyKernel3.git ak3
          test -f ak3/anykernel.sh

      - name: 📦 Package AnyKernel3
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="$SOURCE_DIR/arch/arm64/boot/Image"
          test -s "$IMAGE"

          rm -rf out pack
          mkdir -p out pack
          cp -a ak3/. pack/
          cp "$IMAGE" pack/Image

          if [ "${{ inputs.attribute }}" = "true" ]; then
            sed -i \
              "s#^kernel.string=.*#kernel.string=AOSP Kernel | Build by ${{ inputs.builduser }}#" \
              pack/anykernel.sh
          else
            sed -i \
              's#^kernel.string=.*#kernel.string=AOSP Kernel#' \
              pack/anykernel.sh
          fi

          STAMP="$(date -u +%Y%m%d)"
          if [ "${{ inputs.ksumeta }}" = "none" ]; then
            KSU_LABEL="none"
          else
            KSU_LABEL="${KSU_VERSION:-unknown}"
          fi

          ZIP="Kernel-SM8750-${{ inputs.builduser }}-ksu${KSU_LABEL}-${STAMP}.zip"
          (cd pack && zip -r9 "../out/$ZIP" . -x '*.git*' >/dev/null)
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.artifactmode }}" = "all" ]; then
            cp "$IMAGE" out/Image
            mkbootimg \
              --kernel "$IMAGE" \
              --header_version 4 \
              --os_version 16.0.0 \
              --os_patch_level 2026-07 \
              --pagesize 4096 \
              --base 0x80000000 \
              -o out/boot.img
          fi

          ls -lh out

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # Optional GitHub release
      # ----------------------------------------------------------------------
      - name: 🚀 Create GitHub Release
        if: inputs.enablerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="sm8750-$(date -u +%Y%m%d-%H%M%S)"
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            out/* \
            --title "SM8750 Kernel $RELEASE_TAG" \
            --notes "AOSP SM8750 kernel build.\n\nSource: ${SRC_COMMIT}\nKSU: ${{ inputs.ksumeta }}\nSUSFS: ${{ inputs.susfsmeta }}\nLZ4/ZSTD: ${{ inputs.neonlz4 }}\nDroidspaces: ${{ inputs.droidspaces }}\nBBG: ${{ inputs.basebandguard }}\nReKernel: ${{ inputs.rekernel }}"
