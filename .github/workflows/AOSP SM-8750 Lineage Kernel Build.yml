name: AOSP SM-8750 Lineage Kernel Build

on:
  workflow_dispatch:
    inputs:
      KSU:
        description: "KernelSU Variant"
        required: true
        type: choice
        default: "KernelSU-Next"
        options:
          - KernelSU-Next
          - ReSukiSU
          - None
          
      SUBLEVEL:
        description: "Custom Kernel Level Spoofing (Sublevel)"
        required: false
        default: ""

env:
  TZ: Asia/Shanghai
  WORKSPACE: ${{ github.workspace }}/kernel_workspace
  KDIR: sm8750
  CLANG_VERSION: clang-r547379

jobs:
  build:
    name: Build Kernel SM-8750 - ${{ github.actor }}
    runs-on: ubuntu-latest

    steps:
    # =========================
    # Checkout
    # =========================
    - uses: actions/checkout@v6

    # =========================
    # Swap Space
    # =========================
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    # =========================
    # Dependencies
    # =========================
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget ccache flex bison \
          build-essential libssl-dev libelf-dev bc \
          device-tree-compiler python3 libncurses5-dev

        mkdir -p "$WORKSPACE"
        echo "BUILDTIME=$(date '+%y%m%d')" >> $GITHUB_ENV

    # =========================
    # Cache CCache
    # =========================
    - name: Cache CCache
      uses: actions/cache@v4
      with:
        path: kernel_workspace/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('**/*.c', '**/*.h') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # =========================
    # Cache Clang
    # =========================
    - name: Cache Clang
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ env.WORKSPACE }}/clang-aosp
        key: ${{ env.CLANG_VERSION }}

    # =========================
    # Download Clang
    # =========================
    - name: Download Clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$WORKSPACE/clang-aosp"
        cd "$WORKSPACE"

        wget -q -O clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz

        tar -xzf clang.tar.gz -C clang-aosp
        rm clang.tar.gz

    # =========================
    # Clone Kernel Sources
    # =========================
    - name: Clone Kernel Sources
      run: |
        cd "$WORKSPACE"

        git clone --depth=1 --single-branch \
          https://github.com/LineageOS/android_kernel_oneplus_sm8750 \
          "$KDIR" &

        git clone --depth=1 --single-branch \
          https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules \
          sm8750-modules &

        wait

        CONFIG="$KDIR/arch/arm64/configs/vendor/oplus/sun_perf.config"

        echo "CONFIG_DODGE_DTB=y" >> "$CONFIG"
        echo "CONFIG_KSU=y" >> "$CONFIG"
        echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG"

    # =========================
    # Kernel Version Setup 
    # =========================
    - name: Kernel Version Setup
      run: | 
        cd "$WORKSPACE"
        
        BRANCH=""

        # Try to Read Branch from Build Configuration Files
        for cfg in ./common/build.config.constants ./common/build.config.common; do
          if [[ -f "$cfg" ]]; then
            BRANCH=$(grep -m1 '^BRANCH=' "$cfg" | cut -d= -f2)
            [[ -n "$BRANCH" ]] && break
          fi
        done

        # Fallback: Use ACK SHA from Kernel Repositories if Kernel Repositories Defined
        if [[ -z "$BRANCH" && -n "${KERNEL_REPOS:-}" && -f "./$KERNEL_REPOS/android/ACK_SHA" ]]; then
          BRANCH=$(sed -n '2p' "./$KERNEL_REPOS/android/ACK_SHA" | awk -F'-' '{print $1"-"$2}')
        fi

        if [[ -n "$BRANCH" ]]; then
          ANDROIDVERSION="${BRANCH%-*}"
          KERNELVERSION="${BRANCH#*-}"
          echo "ANDROIDVERSION=$ANDROIDVERSION" >> $GITHUB_ENV
          echo "KERNELVERSION=$KERNELVERSION" >> $GITHUB_ENV
          echo "🔎 Branch Found: $BRANCH"
        else
          echo "⚠️ No Branch Found in Build Configuration or Ack Sha"
          ANDROIDVERSION="unknown"
          KERNELVERSION="unknown"
          echo "ANDROIDVERSION=$ANDROIDVERSION" >> $GITHUB_ENV
          echo "KERNELVERSION=$KERNELVERSION" >> $GITHUB_ENV
        fi

        # Read Original Kernel Version from Makefile
        echo "🧾 Reading Original Kernel Version..."
        OGVERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
        echo "📌 Original Kernel Version: $OGVERSION"

        # Update SubLevel if Input Provided
        INPUTSUBLEVEL="${{ github.event.inputs.SUBLEVEL }}"
        if [[ -n "$INPUTSUBLEVEL" ]]; then
          echo "🧾 Updating Sublevel to: $INPUTSUBLEVEL"
          sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$INPUTSUBLEVEL/" ./common/Makefile
        else
          echo "📌 No SubLevel Input Provided ⚙️ Keeping Default"
        fi

        # Determine New Kernel Version
        NEWVERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
        echo "📊 New Kernel Version: $NEWVERSION"

        if [[ "$OGVERSION" != "$NEWVERSION" ]]; then
          echo "⚙️ Kernel Version Changed: $OGVERSION -> $NEWVERSION"
          echo "FULLVERSION=$NEWVERSION" >> $GITHUB_ENV
        else
          echo "✔️ Kernel Version Unchanged: $OGVERSION"
          echo "FULLVERSION=$OGVERSION" >> $GITHUB_ENV
        fi

        # Export KV1, KV2, KV3 for Further Use
        KV_TMP="${KERNELVERSION}"
        echo "KV1=$(echo "$KV_TMP" | cut -d. -f1)" >> $GITHUB_ENV
        echo "KV2=$(echo "$KV_TMP" | tr -d '.')" >> $GITHUB_ENV
        echo "KV3=$(echo "$NEWVERSION" | tr -d '.')" >> $GITHUB_ENV
        echo "KSHORTVERSION=$(echo $NEWVERSION | cut -d. -f1,2)" >> $GITHUB_ENV
        echo "KSHORTPATCHVERSION=$(echo $NEWVERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

        echo "🎉 Kernel Version Setup Complete"

    # =========================
    # KernelSU Next
    # =========================
    - name: KernelSU-Next
      if: ${{ github.event.inputs.KSU == 'ksunext' }}
      run: |
        cd "$WORKSPACE/$KDIR"

        curl -LSs https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh \
          | bash -s dev-susfs

        cd KernelSU-Next
        rm -rf .git

        KSU_VERSION=$(expr $(curl -sI \
          "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" \
          | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') + 30000)

        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

        sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/" kernel/Kbuild

        KSU_TAG=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags \
          | grep -o '"name": *"[^"]*"' | head -n1 | cut -d'"' -f4)

        sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_TAG/" kernel/Kbuild

        echo "🎉 KernelSU-Next Setup Complete"

    # =========================
    # SUSFS
    # =========================
    - name: SUSFS
      run: |
        cd "$WORKSPACE"

        git clone --depth=1 -b oki-android15-6.6 \
          https://github.com/cctv18/susfs4oki.git susfs

        SUSDIR="$WORKSPACE/$KDIR"

        if [ ! -f "$SUSDIR/.susfs_done" ]; then
          cp -r susfs/kernel_patches/fs/* "$SUSDIR/fs/"
          cp -r susfs/kernel_patches/include/linux/* "$SUSDIR/include/linux/"

          patch -d "$SUSDIR" -p1 --forward --ignore-whitespace < \
            susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch \
            || echo "SUSFS patch warnings"

          touch "$SUSDIR/.susfs_done"
        fi

    # =========================
    # Build Kernel
    # =========================
    - name: Build Kernel
      run: |
        cd "$WORKSPACE/$KDIR"

        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH"

        export KBUILD_BUILD_HOST="Github-Action"
        export KBUILD_BUILD_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"

        LTO=thin

        AR_CMD="ARCH=${ARCH} SUBARCH=${SUBARCH} HEADER_ARCH=${HEADER_ARCH}"
        CC_CMD="CC=clang CXX=clang++"
       
        LLVM_CMD="LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip LLVM=1 LLVM_IAS=1"
        DEFCONFIG="gki_defconfig vendor/sun_perf.config vendor/oplus/sun_perf.config"

        echo "📌 Running Default Configuration..."
        make O=out $AR_CMD $CC_CMD $LLVM_CMD $DEFCONFIG

        echo "⚙️ Enforcing LTO Configuration..."
        scripts/config --file out/.config \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e THINLTO

        echo "🚀 Starting Kernel Build..."
        make -j"$(nproc --all)" O=out $AR_CMD $CC_CMD $LLVM_CMD

    # =========================
    # Validate Output
    # =========================
    - name: Validate Output
      run: |
        if [ -f "$WORKSPACE/$KDIR/out/arch/arm64/boot/Image" ]; then
          echo "IMAGEPATH=true" >> $GITHUB_ENV
        else
          echo "Kernel build failed"
          exit 1
        fi

    # =========================
    # Package AnyKernel3
    # =========================
    - name: Package AnyKernel3
      if: env.IMAGEPATH == 'true'
      run: |
        cd "$WORKSPACE"

        git clone --depth=1 https://github.com/AndreiMikh/AnyKernel3
        rm -rf AnyKernel3/.git

        cp "$KDIR/out/arch/arm64/boot/Image" AnyKernel3/

    # =========================
    # Upload Kernel Image
    # =========================
    - name: Upload Kernel Image
      if: env.IMAGEPATH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Image-KSU-${{ env.KSUVER }}
        path: kernel_workspace/sm8750/out/arch/arm64/boot/Image
        compression-level: 0

    # =========================
    # Upload AnyKernel3
    # =========================
    - name: Upload AnyKernel3
      if: env.IMAGEPATH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: AnyKernel3-Dodge-${{ github.event.inputs.KSU }}-${{ env.KSUVER }}-${{ env.BUILDTIME }}
        path: kernel_workspace/AnyKernel3/*
        compression-level: 0
