name: Sync ReSukiSU Builds (Auto-Changelog)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

env:
  N_LATEST_RUNS: 50
  TARGET_REPO: ReSukiSU/ReSukiSU

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Sync Builds + Auto Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Fetching latest runs..."

          runs=$(gh api "repos/$TARGET_REPO/actions/runs?per_page=$N_LATEST_RUNS" \
            --jq '.workflow_runs
              | map(select(.event != "pull_request"))
              | sort_by(.created_at)
              | reverse')

          echo "$runs" | jq -c '.[]' | while read -r run; do
              run_id=$(jq -r '.id' <<< "$run")
              run_url=$(jq -r '.html_url' <<< "$run")

              tag_name="ReSukiSU_${run_id}"

              echo ""
              echo "📦 Run: $run_id"

              # Skip if already released
              if gh release view "$tag_name" >/dev/null 2>&1; then
                  echo "⏭️ Already released"
                  continue
              fi

              artifacts_json=$(gh api "repos/$TARGET_REPO/actions/runs/$run_id/artifacts")

              # Require Manager-release
              if ! echo "$artifacts_json" | jq -e '.artifacts[] | select(.name=="Manager-release")' >/dev/null; then
                  echo "⏭️ No Manager-release"
                  continue
              fi

              workdir=$(mktemp -d)
              cd "$workdir"

              echo "⬇️ Downloading artifacts..."

              echo "$artifacts_json" | jq -c '.artifacts[]' | while read -r art; do
                  id=$(jq -r '.id' <<< "$art")
                  name=$(jq -r '.name' <<< "$art")

                  gh api "repos/$TARGET_REPO/actions/artifacts/$id/zip" > "${name}.zip"
              done

              echo "📦 Extracting..."

              for zip in *.zip; do
                  [[ ! -f "$zip" ]] && continue

                  case "$zip" in
                    ksud-*|ksuinit.zip|Spoofed-*) 
                      echo "🗑️ Skipping $zip"
                      continue
                      ;;
                  esac

                  unzip -q -o "$zip"
                  rm -f "$zip"
              done

              # Move APKs
              if [[ -d apk ]]; then
                  find apk -type f -name "*.apk" -exec mv {} . \;
                  rm -rf apk
              fi

              # Package kernel objects
              shopt -s nullglob
              ko_files=(*.ko)

              if (( ${#ko_files[@]} > 0 )); then
                  echo "🗜️ Packaging .ko files"
                  zip -q lkm-all.zip "${ko_files[@]}"
                  rm -f "${ko_files[@]}"
              fi

              # Detect APK
              apk_file=$(ls ReSukiSU*_?????-*.apk 2>/dev/null | head -n 1 || true)

              if [[ -z "$apk_file" ]]; then
                  echo "❌ No APK found"
                  cd - >/dev/null
                  rm -rf "$workdir"
                  continue
              fi

              if [[ "$apk_file" =~ _([0-9]{5})- ]]; then
                  version="${BASH_REMATCH[1]}"
              else
                  echo "❌ Version parse failed"
                  cd - >/dev/null
                  rm -rf "$workdir"
                  continue
              fi

              release_name="v${version}"

              echo "🚀 Release: $release_name"

              # ----------------------------
              # SAFE changelog generation
              # ----------------------------
              prev_tag=$(gh release list \
                --limit 1 \
                --json tagName,createdAt \
                --jq 'map(select(.tagName != null)) | sort_by(.createdAt) | last | .tagName' \
                2>/dev/null || true)

              echo "🔎 Previous tag: ${prev_tag:-none}"

              if [[ -n "$prev_tag" && "$prev_tag" != "null" ]]; then
                  commits=$(gh api \
                    "repos/$TARGET_REPO/compare/$prev_tag...main" \
                    --jq '.commits[]
                      | select(.commit.message | test("Merge") | not)
                      | .commit.message' \
                    2>/dev/null || true)
              else
                  commits=$(gh api \
                    "repos/$TARGET_REPO/commits?per_page=15" \
                    --jq '.[].commit.message')
              fi

              changelog=$(echo "$commits" \
                | sed 's/\r//g' \
                | sed '/^$/d' \
                | sed 's/^/- /')

              [[ -z "$changelog" ]] && changelog="- No meaningful changes"

              # Collect assets
              mapfile -t assets < <(find . -maxdepth 1 -type f)

              if (( ${#assets[@]} == 0 )); then
                  echo "❌ No assets"
                  cd - >/dev/null
                  rm -rf "$workdir"
                  continue
              fi

              release_notes=$(cat <<EOF
                ### 📦 $release_name
                
                ### 🆕 Changes
                $changelog
                
                ---
                
                ### 🔗 Source
                $run_url
                EOF
                )

              echo "🚀 Creating release..."

              gh release create "$tag_name" "${assets[@]}" \
                --title "$release_name" \
                --notes "$release_notes"

              echo "✅ Release created"

              cd - >/dev/null
              rm -rf "$workdir"
          done

          echo "🎉 Done"
