name: 🌏 Kernel Auto-Pilot

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["☘️☘️☘️"]
    types: [completed]

concurrency:
  group: kernel-control-panel
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.msg }}
      run_id: ${{ github.event.workflow_run.id || github.run_id }}
    steps:
      - name: 🔧 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📜 Changelog Engine
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          PREV="${{ github.event.before || '' }}"
          if [[ -z "$PREV" || "$PREV" == "0000000000000000000000000000000000000000" ]]; then
            PREV=$(git rev-list --max-parents=0 HEAD)
          fi

          LOG=$(git log --no-merges --pretty=format:"%s" "$PREV..HEAD" || true)
          [[ -z "$LOG" ]] && LOG="🔥 Automated Kernel Build"

          echo "msg<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 Checkout
        uses: actions/checkout@v4

      - name: 📦 Download Run Artifacts
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="${{ needs.build.outputs.run_id }}"
          REPO="${{ github.repository }}"

          echo "🔍 Fetching Artifacts for Run: $RUN_ID"

          mkdir -p artifacts

          ARTIFACTS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts")

          IDS=$(echo "$ARTIFACTS" | jq -r '.artifacts[].id')

          for ID in $IDS; do
            echo "⬇️ Downloading Artifact: $ID"

            curl -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$ID/zip" \
              -o "artifacts/$ID.zip"
          done

          echo "All Artifacts Downloaded"

      - name: 🚀 Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ github.run_number }}"
          name: "🔥 Kernel Build #${{ github.run_number }}"

          body: |
            ## 📦 Kernel Release

            ### 📜 Changelog
            <details>
            <summary>View</summary>

            ${{ needs.build.outputs.changelog }}

            </details>

            ### 🧠 Run Info
            Run ID: `${{ needs.build.outputs.run_id }}`

          artifacts: "artifacts/*.zip"
          allowUpdates: true

  dashboard:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📊 Generate Dashboard
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public
          REPO="${{ github.repository }}"
          RUN_ID="${{ needs.build.outputs.run_id }}"

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>🔥 Kernel Control Panel</title>
          <style>
          body { background:#0d1117; color:#c9d1d9; font-family:Arial; padding:30px; }
          .card { background:#161b22; padding:20px; border-radius:12px; margin:20px auto; max-width:900px; }
          pre { white-space:pre-wrap; }
          </style>
          </head>
          <body>
          
          <h1>🔥 Kernel Control Panel</h1>
          
          <div class="card">
          <h2>📦 Run ID</h2>
          <pre>${RUN_ID}</pre>
          </div>
          
          <div class="card">
          <h2>📦 Artifacts Status</h2>
          <pre>
          Artifacts are Fetched from GitHub Actions API using Run ID
          They are Attached to the Release Automatically
          </pre>
          </div>
          
          </body>
          </html>
          EOF

      - name: 📦 Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 🚀 Deploy Pages
        uses: actions/deploy-pages@v4
