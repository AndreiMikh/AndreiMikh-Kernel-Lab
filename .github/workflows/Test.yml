name: OnePlusOSS Kernel Monitor

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  ORG: OnePlusOSS
  STATEFILE: old-state.json
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_HTTP_TIMEOUT: 600
  MAXRETRIES: 4
  DELAYRETRIES: 5
  SUMMARYLIMIT: 5000
  REPOSITORYOWNER: ${{ github.repository_owner }}

  # Legacy repositories excluded from monitoring.
  BLREPOS: |
    android_kernel_oneplus_one
    android_kernel_oneplus_msm8974
    android_kernel_oneplus_msm8994
    android_kernel_oneplus_msm8996
    android_kernel_oneplus_msm8998
    android_kernel_oneplus_sm6350
    android_kernel_oneplus_sm4250
    android_kernel_oneplus_sm7250
    android_kernel_oneplus_sdm845
    android_kernel_oneplus_sm8150
    android_kernel_4.19_oneplus_mt6765
    android_kernel_oneplus_sm8250
    android_kernel_oneplus_mt6893
    android_kernel_oneplus_sm4350
    android_kernel_msm-5.4_oneplus_sm6375
    android_kernel_oneplus_mt6877
    android_kernel_oneplus_sm7325
    android_kernel_oneplus_sm8350
    android_kernel_oneplus_sw5100
    android_kernel_oneplus_sm7225

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Monitor
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🔍 Scan OnePlusOSS Kernels
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p main
          cd main

          rm -f \
            "$STATEFILE" \
            new-state.json \
            summary-rows.md \
            local-summary.md \
            manifest_summary.md \
            failed-repositories.txt

          touch failed-repositories.txt

          # Check whether a repository is blacklisted.
          explblacklisted() {
            local REPO="$1"

            while IFS= read -r BLACKLIST; do
              [[ -z "$BLACKLIST" ]] && continue

              if [[ "$REPO" == "$BLACKLIST" ]]; then
                return 0
              fi
            done <<< "$BLREPOS"

            return 1
          }

          # Extract platform from repository name.
          #
          # Examples:
          #   android_kernel_oneplus_sm8450
          #   -> SM8450
          #
          #   android_kernel_oneplus_mt1263
          #   -> MT1263
          #
          #   kernel_manifest
          #   -> MANIFEST
          fetchplatform() {
            local REPO="$1"
            local PLATFORM=""

            if [[ "$REPO" == "kernel_manifest" ]]; then
              echo "MANIFEST"
              return 0
            fi

            PLATFORM="$(
              printf '%s\n' "$REPO" |
                grep -oEi 'sm[0-9]{4,5}' |
                head -n1 ||
                true
            )"

            if [[ -n "$PLATFORM" ]]; then
              printf '%s\n' "${PLATFORM^^}"
              return 0
            fi

            PLATFORM="$(
              printf '%s\n' "$REPO" |
                grep -oEi 'mt[0-9]{4,5}' |
                head -n1 ||
                true
            )"

            if [[ -n "$PLATFORM" ]]; then
              printf '%s\n' "${PLATFORM^^}"
              return 0
            fi

            echo "OTHER"
          }

          # GraphQL request helper.
          #
          # Important:
          # gh api graphql does NOT use:
          #   -f variables='{"org":"..."}'
          #
          # GraphQL variables are passed using individual -F arguments.
          graphql_request() {
            local QUERY="$1"
            local CURSOR="${2:-}"
            local ATTEMPT=1
            local RESPONSE=""

            while (( ATTEMPT <= MAXRETRIES )); do

              if [[ -n "$CURSOR" ]]; then

                if RESPONSE="$(
                  gh api graphql \
                    --hostname github.com \
                    -F org="$ORG" \
                    -F cursor="$CURSOR" \
                    -f query="$QUERY" \
                    2>/dev/null
                )"; then
                  printf '%s\n' "$RESPONSE"
                  return 0
                fi

              else

                if RESPONSE="$(
                  gh api graphql \
                    --hostname github.com \
                    -F org="$ORG" \
                    -f query="$QUERY" \
                    2>/dev/null
                )"; then
                  printf '%s\n' "$RESPONSE"
                  return 0
                fi

              fi

              echo "⚠️ GraphQL request failed (attempt ${ATTEMPT}/${MAXRETRIES})." >&2

              if (( ATTEMPT < MAXRETRIES )); then
                sleep "$DELAYRETRIES"
              fi

              ((ATTEMPT++))
            done

            return 1
          }

          # GraphQL query for repositories.
          #
          # The organization repositories connection is paginated.
          KERNELQUERY='
          query($org:String!, $cursor:String) {
            organization(login:$org) {
              repositories(
                first:100
                after:$cursor
                orderBy:{field:NAME,direction:ASC}
              ) {
                nodes {
                  name
                  isArchived
                  isDisabled
                }

                pageInfo {
                  hasNextPage
                  endCursor
                }
              }
            }
          }'

          # Discover all OnePlusOSS repositories.
          REPOSITORIES=()

          NEXTQUERY="true"
          NEXTCURSOR=""

          while [[ "$NEXTQUERY" == "true" ]]; do

            echo "🔎 Querying OnePlusOSS repositories..."

            RESPONSE="$(
              graphql_request "$KERNELQUERY" "$NEXTCURSOR"
            )" || {
              echo "❌ Unable to retrieve OnePlusOSS repositories."
              exit 1
            }

            # Fail if GitHub returned GraphQL errors.
            if jq -e '.errors' >/dev/null 2>&1 <<< "$RESPONSE"; then
              echo "❌ GitHub GraphQL returned an error:"
              jq -r '.errors[]?.message // empty' <<< "$RESPONSE"
              exit 1
            fi

            # Validate the expected response.
            if ! jq -e '.data.organization.repositories' >/dev/null 2>&1 <<< "$RESPONSE"; then
              echo "❌ Invalid GraphQL repository response."
              echo "$RESPONSE" | jq .
              exit 1
            fi

            while IFS= read -r REPO; do
              [[ -z "$REPO" ]] && continue

              # Only monitor kernel_manifest and android_kernel_*.
              if [[ "$REPO" != "kernel_manifest" ]] &&
                 [[ "$REPO" != android_kernel_* ]]; then
                continue
              fi

              # Exclude modules and techpack repositories.
              if [[ "$REPO" == *modules* ]] ||
                 [[ "$REPO" == *techpack* ]]; then
                continue
              fi

              # Exclude legacy repositories.
              if explblacklisted "$REPO"; then
                continue
              fi

              REPOSITORIES+=("$REPO")

            done < <(
              jq -r '
                .data.organization.repositories.nodes[]
                | select(.isDisabled == false)
                | select(.isArchived == false)
                | .name
              ' <<< "$RESPONSE"
            )

            NEXTQUERY="$(
              jq -r '
                .data.organization.repositories.pageInfo.hasNextPage
              ' <<< "$RESPONSE"
            )"

            NEXTCURSOR="$(
              jq -r '
                .data.organization.repositories.pageInfo.endCursor // empty
              ' <<< "$RESPONSE"
            )"

            if [[ "$NEXTQUERY" == "true" && -z "$NEXTCURSOR" ]]; then
              echo "❌ GraphQL requested another page but returned no cursor."
              exit 1
            fi

          done

          # Remove duplicates and sort repositories.
          mapfile -t REPOSITORIES < <(
            printf '%s\n' "${REPOSITORIES[@]}" |
              sort -u
          )

          TOTALREPOS="${#REPOSITORIES[@]}"

          if (( TOTALREPOS == 0 )); then
            echo "❌ No OnePlusOSS kernel repositories discovered."
            exit 1
          fi

          echo "📦 Repositories discovered: ${TOTALREPOS}"

          # Restore persistent status-page state.
          rm -rf repostatus

          mkdir -p repostatus
          cd repostatus

          git init -q

          git remote add origin \
            "https://github.com/${REPOSITORYOWNER}/${GITHUB_REPOSITORY#*/}.git"

          # Authenticate ls-remote.
          if git \
            -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            ls-remote \
            --exit-code \
            --heads \
            origin \
            status-page \
            >/dev/null 2>&1
          then

            echo "✅ Status-page branch exists."

            git \
              -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch \
              --quiet \
              origin \
              status-page

            git checkout \
              --quiet \
              -B status-page \
              FETCH_HEAD

            if [[ -f "$STATEFILE" ]]; then
              cp "$STATEFILE" ../"$STATEFILE"
              echo "✅ Previous state restored."
            else
              echo "⚠️ Status-page has no state file."
              echo '{}' > ../"$STATEFILE"
            fi

          else

            echo "ℹ️ Status-Page Does Not Exist, Starting with Empty State..."

            git checkout \
              --quiet \
              --orphan \
              status-page

            git rm -rf . >/dev/null 2>&1 || true

            echo '{}' > ../"$STATEFILE"

          fi

          cd ..

          # Validate the previous state.
          if ! jq empty "$STATEFILE" >/dev/null 2>&1; then
            echo "⚠️ Previous state is invalid."
            echo "ℹ️ Starting with empty state."
            echo '{}' > "$STATEFILE"
          fi

          echo "📊 Previous state loaded."

          # Counters.
          NEWREPOS=0
          NEWBRANCH=0
          UPDATEDBRANCH=0
          DELETEDITEM=0
          DETECTEDCHANGE=0

          TOTALBRANCHES=0
          NEWBRANCHCOUNT=0
          UPDATEDBRANCHCOUNT=0
          DELETEDCOUNT=0
          SCANNEDREPOS=0
          FAILEDREPOS=0

          # Platform rows and counts.
          declare -A PLATFORM_ROWS=()
          declare -A FLATCOUNT=()

          echo '{}' > new-state.json
          : > local-summary.md
          : > summary-rows.md
          : > manifest_summary.md

          # REST API branch retrieval.
          #
          # REST is used here because branch refs can exceed 100 and this
          # endpoint gives us a straightforward paginated branch list.
          fetch_branches() {
            local REPO="$1"
            local PAGE=1
            local RESPONSE
            local ALL_BRANCHES="[]"

            while :; do

              RESPONSE="$(
                gh api \
                  --hostname github.com \
                  "repos/${ORG}/${REPO}/branches?per_page=100&page=${PAGE}" \
                  2>/dev/null
              )" || return 1

              if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "$RESPONSE"; then
                return 1
              fi

              ALL_BRANCHES="$(
                jq -c \
                  --argjson old "$ALL_BRANCHES" \
                  --argjson new "$RESPONSE" \
                  '$old + $new'
              )"

              if (( $(jq 'length' <<< "$RESPONSE") < 100 )); then
                break
              fi

              ((PAGE++))
            done

            printf '%s\n' "$ALL_BRANCHES"
          }

          # Fetch kernel version from a branch Makefile.
          fetch_kernel_version() {
            local REPO="$1"
            local BRANCH="$2"

            local MAKEFILE
            local MAKE_CONTENT
            local VERSION
            local PATCHLEVEL
            local SUBLEVEL

            MAKEFILE="$(
              gh api \
                --hostname github.com \
                "repos/${ORG}/${REPO}/contents/Makefile?ref=$(printf '%s' "$BRANCH" | jq -sRr @uri)" \
                2>/dev/null ||
                true
            )"

            [[ -z "$MAKEFILE" ]] && {
              echo "Unknown"
              return 0
            }

            MAKE_CONTENT="$(
              jq -r '.content // empty' <<< "$MAKEFILE" |
                tr -d '\r\n' |
                base64 -d 2>/dev/null ||
                true
            )"

            [[ -z "$MAKE_CONTENT" ]] && {
              echo "Unknown"
              return 0
            }

            VERSION="$(
              awk -F'=' '
                /^[[:space:]]*VERSION[[:space:]]*=/ {
                  gsub(/[[:space:]]/, "", $2)
                  print $2
                  exit
                }
              ' <<< "$MAKE_CONTENT"
            )"

            PATCHLEVEL="$(
              awk -F'=' '
                /^[[:space:]]*PATCHLEVEL[[:space:]]*=/ {
                  gsub(/[[:space:]]/, "", $2)
                  print $2
                  exit
                }
              ' <<< "$MAKE_CONTENT"
            )"

            SUBLEVEL="$(
              awk -F'=' '
                /^[[:space:]]*SUBLEVEL[[:space:]]*=/ {
                  gsub(/[[:space:]]/, "", $2)
                  print $2
                  exit
                }
              ' <<< "$MAKE_CONTENT"
            )"

            if [[ -z "$VERSION" || -z "$PATCHLEVEL" ]]; then
              echo "Unknown"
              return 0
            fi

            if [[ -n "$SUBLEVEL" ]]; then
              echo "${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
            else
              echo "${VERSION}.${PATCHLEVEL}"
            fi
          }

          # Add a branch row to a platform.
          add_platform_row() {
            local REPO="$1"
            local BRANCHNAME="$2"
            local COMMIT="$3"
            local KERNEL="$4"
            local STATUS="$5"

            local PLATFORM
            local ESCAPED_REPO
            local ESCAPED_BRANCH
            local ROW
            local KEY

            PLATFORM="$(fetchplatform "$REPO")"

            ESCAPED_REPO="${REPO//_/\\_}"
            ESCAPED_BRANCH="${BRANCHNAME//_/\\_}"

            ROW="|${ESCAPED_REPO}|${ESCAPED_BRANCH}|\`${COMMIT:0:7}\`|${KERNEL}|${STATUS}|"

            KEY="${PLATFORM}|${REPO}|${BRANCHNAME}"

            PLATFORM_ROWS["$KEY"]="$ROW"

            ((FLATCOUNT["$PLATFORM"]+=1))
          }

          # Process a repository.
          process_repository() {
            local REPO="$1"

            echo ""
            echo "🔍 Processing: ${REPO}"

            local BRANCHES
            local OLDREPOSTATE
            local BRANCHDATA
            local BRANCHNAME
            local COMMIT
            local KERNEL
            local OLDVALUE
            local STATUS
            local JSONFILE
            local NEWBRANCHSTATE
            local BRANCH_COUNT=0
            local REPO_CHANGED=0

            JSONFILE="$(mktemp)"

            echo '{}' > "$JSONFILE"

            # Fetch branches.
            if ! BRANCHES="$(fetch_branches "$REPO")"; then
              echo "⚠️ Failed to retrieve branches for ${REPO}."

              echo "$REPO" >> failed-repositories.txt

              ((FAILEDREPOS++))

              rm -f "$JSONFILE"

              return 0
            fi

            # Previous repository state.
            OLDREPOSTATE="$(
              jq -c \
                --arg repo "$REPO" \
                '.[$repo] // {}' \
                "$STATEFILE"
            )"

            while IFS= read -r BRANCHDATA; do
              [[ -z "$BRANCHDATA" ]] && continue

              BRANCHNAME="$(
                jq -r '.name // empty' <<< "$BRANCHDATA"
              )"

              COMMIT="$(
                jq -r '.commit.sha // empty' <<< "$BRANCHDATA"
              )"

              [[ -z "$BRANCHNAME" ]] && continue
              [[ -z "$COMMIT" ]] && continue

              ((BRANCH_COUNT++))
              ((TOTALBRANCHES++))

              # Get kernel version.
              KERNEL="$(
                fetch_kernel_version "$REPO" "$BRANCHNAME"
              )"

              # Previous commit for this branch.
              OLDVALUE="$(
                jq -r \
                  --arg branch "$BRANCHNAME" \
                  '.[$branch].commit // empty' \
                  <<< "$OLDREPOSTATE"
              )"

              if [[ -z "$OLDVALUE" ]]; then

                STATUS="🆕"
                ((NEWBRANCHCOUNT++))
                ((NEWBRANCH++))

                DETECTEDCHANGE=1
                REPO_CHANGED=1

              elif [[ "$OLDVALUE" != "$COMMIT" ]]; then

                STATUS="🔄"
                ((UPDATEDBRANCHCOUNT++))
                ((UPDATEDBRANCH++))

                DETECTEDCHANGE=1
                REPO_CHANGED=1

              else

                STATUS="✅"

              fi

              # Store branch state.
              NEWBRANCHSTATE="$(
                jq -nc \
                  --arg commit "$COMMIT" \
                  --arg kernel "$KERNEL" \
                  '{
                    commit: $commit,
                    kernel: $kernel
                  }'
              )"

              jq \
                --arg branch "$BRANCHNAME" \
                --argjson value "$NEWBRANCHSTATE" \
                '.[$branch] = $value' \
                "$JSONFILE" > "${JSONFILE}.tmp"

              mv "${JSONFILE}.tmp" "$JSONFILE"

              # Add to platform summary.
              add_platform_row \
                "$REPO" \
                "$BRANCHNAME" \
                "$COMMIT" \
                "$KERNEL" \
                "$STATUS"

            done < <(
              jq -c '.[]' <<< "$BRANCHES"
            )

            if (( BRANCH_COUNT == 0 )); then
              echo "⚠️ No branches found for ${REPO}."
            fi

            # Detect deleted branches.
            while IFS= read -r OLD_BRANCH; do
              [[ -z "$OLD_BRANCH" ]] && continue

              if ! jq -e \
                --arg branch "$OLD_BRANCH" \
                '.[] | select(.name == $branch)' \
                <<< "$BRANCHES" >/dev/null
              then

                echo "🗑️ Deleted branch: ${REPO}/${OLD_BRANCH}"

                ((DELETEDITEM++))
                ((DELETEDCOUNT++))

                DETECTEDCHANGE=1
                REPO_CHANGED=1

              fi

            done < <(
              jq -r 'keys[]' <<< "$OLDREPOSTATE"
            )

            # Save successful repository state.
            jq \
              --arg repo "$REPO" \
              --argjson branches "$(cat "$JSONFILE")" \
              '.[$repo] = $branches' \
              new-state.json > new-state.tmp

            mv new-state.tmp new-state.json

            if [[ "$OLDREPOSTATE" == "{}" ]]; then
              ((NEWREPOS++))
            fi

            ((SCANNEDREPOS++))

            rm -f "$JSONFILE"
          }

          # Process all repositories.
          for REPO in "${REPOSITORIES[@]}"; do
            process_repository "$REPO"
          done

          # Preserve state for repositories that failed.
          if (( FAILEDREPOS > 0 )); then

            echo ""
            echo "⚠️ Preserving state for failed repositories."

            while IFS= read -r FAILEDREPO; do
              [[ -z "$FAILEDREPO" ]] && continue

              if jq -e \
                --arg repo "$FAILEDREPO" \
                'has($repo)' \
                "$STATEFILE" >/dev/null
              then

                FAILEDSTATE="$(
                  jq -c \
                    --arg repo "$FAILEDREPO" \
                    '.[$repo]' \
                    "$STATEFILE"
                )"

                jq \
                  --arg repo "$FAILEDREPO" \
                  --argjson value "$FAILEDSTATE" \
                  '.[$repo] = $value' \
                  new-state.json > new-state.tmp

                mv new-state.tmp new-state.json
              fi

            done < failed-repositories.txt

          fi

          # Detect repositories that disappeared.
          while IFS= read -r OLD_REPO; do
            [[ -z "$OLD_REPO" ]] && continue

            if explblacklisted "$OLD_REPO"; then
              continue
            fi

            if ! printf '%s\n' "${REPOSITORIES[@]}" |
              grep -Fxq "$OLD_REPO"
            then

              echo "🗑️ Deleted repository: ${OLD_REPO}"

              ((DELETEDITEM++))
              ((DELETEDCOUNT++))

              DETECTEDCHANGE=1
            fi

          done < <(
            jq -r 'keys[]' "$STATEFILE"
          )

          # Manifest tracking.
          echo "### 📋 Manifest Status" > manifest_summary.md
          echo "" >> manifest_summary.md

          MANIFESTDATA="$(
            gh api \
              --hostname github.com \
              "repos/${ORG}/kernel_manifest/git/trees/oneplus/sm8750?recursive=1" \
              2>/dev/null ||
              true
          )"

          if [[ -n "$MANIFESTDATA" ]] &&
             jq -e '.tree' >/dev/null 2>&1 <<< "$MANIFESTDATA"
          then

            echo "|Status|File|" >> manifest_summary.md
            echo "|:---|:---|" >> manifest_summary.md

            CURRENT_MANIFEST="$(
              jq -c '
                [
                  .tree[]
                  | select(.type == "blob")
                  | select((.path | contains("/")) | not)
                  | {
                      path: .path,
                      oid: .sha
                    }
                ]
              ' <<< "$MANIFESTDATA"
            )"

            OLD_MANIFEST="$(
              jq -c '.kernel_manifest.files // []' "$STATEFILE"
            )"

            # Added and modified manifest files.
            while IFS= read -r FILE_JSON; do
              [[ -z "$FILE_JSON" ]] && continue

              FILEPATH="$(jq -r '.path' <<< "$FILE_JSON")"
              CURRENT_OID="$(jq -r '.oid' <<< "$FILE_JSON")"

              OLDOID="$(
                jq -r \
                  --arg path "$FILEPATH" \
                  '.[] | select(.path == $path) | .oid' \
                  <<< "$OLD_MANIFEST" |
                  head -n1
              )"

              if [[ -z "$OLDOID" || "$OLDOID" == "null" ]]; then

                FILESTATUS="🆕 Added"
                DETECTEDCHANGE=1

              elif [[ "$OLDOID" != "$CURRENT_OID" ]]; then

                FILESTATUS="🔄 Modified"
                DETECTEDCHANGE=1

              else

                FILESTATUS="✅ Unchanged"

              fi

              echo "|${FILESTATUS}|${FILEPATH//_/\\_}|" >> manifest_summary.md

            done < <(
              jq -c '.[]' <<< "$CURRENT_MANIFEST"
            )

            # Deleted manifest files.
            while IFS= read -r FILE_JSON; do
              [[ -z "$FILE_JSON" ]] && continue

              FILEPATH="$(jq -r '.path' <<< "$FILE_JSON")"

              if ! jq -e \
                --arg path "$FILEPATH" \
                '.[] | select(.path == $path)' \
                <<< "$CURRENT_MANIFEST" >/dev/null
              then

                echo "|🗑️ Deleted|${FILEPATH//_/\\_}|" >> manifest_summary.md

                DETECTEDCHANGE=1
                ((DELETEDCOUNT++))
              fi

            done < <(
              jq -c '.[]' <<< "$OLD_MANIFEST"
            )

            # Store current manifest state.
            jq \
              --argjson files "$CURRENT_MANIFEST" \
              '.kernel_manifest.files = $files' \
              new-state.json > new-state.tmp

            mv new-state.tmp new-state.json

          else

            echo "⚠️ Unable to retrieve kernel_manifest." >> manifest_summary.md

          fi

          # Generate grouped platform summary.
          : > local-summary.md

          if (( ${#PLATFORM_ROWS[@]} > 0 )); then

            # Get unique platforms.
            mapfile -t PLATFORMS < <(
              printf '%s\n' "${!PLATFORM_ROWS[@]}" |
                cut -d'|' -f1 |
                sort -u -V
            )

            for PLATFORM in "${PLATFORMS[@]}"; do

              [[ -z "$PLATFORM" ]] && continue

              BRANCHCOUNT="${FLATCOUNT[$PLATFORM]:-0}"

              case "$PLATFORM" in

                MANIFEST)
                  echo "#### 📋 Kernel Manifest" >> local-summary.md
                  ;;

                OTHER)
                  echo "#### 📦 Other Branch" >> local-summary.md
                  ;;

                SM*)
                  echo "#### 📱 ${PLATFORM} Branch" >> local-summary.md
                  ;;

                MT*)
                  echo "#### 📱 ${PLATFORM} Branch" >> local-summary.md
                  ;;

                *)
                  echo "#### 📦 ${PLATFORM} Branch" >> local-summary.md
                  ;;

              esac

              if (( BRANCHCOUNT == 1 )); then
                echo "> **1 branch**" >> local-summary.md
              else
                echo "> **${BRANCHCOUNT} branches**" >> local-summary.md
              fi

              echo "" >> local-summary.md

              echo "|Repo|Branch|Latest Commit|Kernel|Status|" >> local-summary.md
              echo "|:---|:---|:---|:---|:---|" >> local-summary.md

              for KEY in "${!PLATFORM_ROWS[@]}"; do

                KEYPLATFORM="${KEY%%|*}"

                [[ "$KEYPLATFORM" != "$PLATFORM" ]] && continue

                printf '%s\n' "${PLATFORM_ROWS[$KEY]}"

              done | sort -V >> local-summary.md

              echo "" >> local-summary.md

            done

          else

            echo "> No kernel branches detected." >> local-summary.md

          fi

          # Limit summary size.
          SUMMARYROWS="$(wc -c < local-summary.md)"

          if (( SUMMARYROWS > SUMMARYLIMIT )); then

            echo "⚠️ Summary exceeds ${SUMMARYLIMIT} bytes."

            head -c "$SUMMARYLIMIT" local-summary.md > local-summary.tmp

            printf '\n\n> ⚠️ Summary truncated.\n' >> local-summary.tmp

            mv local-summary.tmp local-summary.md

          fi

          # Validate new state.
          if ! jq empty new-state.json >/dev/null 2>&1; then
            echo "❌ Generated state is invalid."
            exit 1
          fi

          # Save final state.
          cp new-state.json "$STATEFILE"

          # Generate GitHub Actions summary.
          {
            echo "## 📱 OnePlusOSS Kernel Monitor"
            echo ""
            echo "**Last Scan:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### 📊 Scan Statistics"
            echo ""
            echo "|Metric|Count|"
            echo "|:---|---:|"
            echo "|Repositories Found|${TOTALREPOS}|"
            echo "|Repositories Scanned|${SCANNEDREPOS}|"
            echo "|Repositories Failed|${FAILEDREPOS}|"
            echo "|Total Branches|${TOTALBRANCHES}|"
            echo "|New Repositories|${NEWREPOS}|"
            echo "|New Branches|${NEWBRANCHCOUNT}|"
            echo "|Updated Branches|${UPDATEDBRANCHCOUNT}|"
            echo "|Deleted Items|${DELETEDCOUNT}|"
            echo ""
            echo "### Branch Status & Kernel Versions"
            echo ""
            cat local-summary.md
            echo ""
            cat manifest_summary.md
          } > summary-rows.md

          cat summary-rows.md >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "✅ Scan completed."
          echo "Repositories: ${TOTALREPOS}"
          echo "Scanned:      ${SCANNEDREPOS}"
          echo "Failed:       ${FAILEDREPOS}"
          echo "Branches:     ${TOTALBRANCHES}"
          echo "New:          ${NEWBRANCHCOUNT}"
          echo "Updated:      ${UPDATEDBRANCHCOUNT}"
          echo "Deleted:      ${DELETEDCOUNT}"

      - name: 📄 Update Status-Page
        shell: bash
        run: |
          set -Eeuo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf repostatus-final
          mkdir -p repostatus-final

          cd repostatus-final

          git init -q

          git remote add origin \
            "https://github.com/${REPOSITORYOWNER}/${GITHUB_REPOSITORY#*/}.git"

          # Authenticate every remote Git operation.
          if git \
            -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            ls-remote \
            --exit-code \
            --heads \
            origin \
            status-page \
            >/dev/null 2>&1
          then

            echo "✅ status-page branch exists."

            git \
              -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
              fetch \
              --quiet \
              origin \
              status-page

            git checkout \
              --quiet \
              -B status-page \
              FETCH_HEAD

          else

            echo "ℹ️ Creating status-page branch."

            git checkout \
              --quiet \
              --orphan \
              status-page

            git rm -rf . >/dev/null 2>&1 || true

          fi

          # Generate status-page README.
          {
            echo "# 📱 OnePlusOSS Kernel Tracker"
            echo ""
            echo "> **Last Update:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Automated monitoring report for OnePlusOSS Android kernel repositories."
            echo ""
            echo "---"
            echo ""
            cat ../main/manifest_summary.md
            echo ""
            echo "---"
            echo ""
            cat ../main/local-summary.md
          } > README.md

          # Persist scanner state.
          cp "../main/${STATEFILE}" "$STATEFILE"

          git add README.md "$STATEFILE"

          if git diff --cached --quiet; then
            echo "ℹ️ No status-page changes detected."
            exit 0
          fi

          git commit \
            --quiet \
            -m "docs: sync OnePlusOSS kernel status [skip ci]"

          # Authenticate push.
          git \
            -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push \
            --quiet \
            origin \
            status-page

          echo "✅ status-page updated successfully."

      - name: 📢 Update Monitor Issue
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          RUNURL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DATETITLE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          BODYFILE="$(mktemp)"

          {
            echo "## 📱 OnePlusOSS Kernel Monitor"
            echo ""
            echo "**Scan:** ${DATETITLE}"
            echo ""
            echo "**Workflow Run:** ${RUNURL}"
            echo ""
            cat main/summary-rows.md 2>/dev/null || true
          } > "$BODYFILE"

          ISSUEDNUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "OnePlusOSS Kernel Monitor in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$ISSUEDNUMBER" ]]; then

            gh issue edit \
              "$ISSUEDNUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$BODYFILE"

            echo "✅ Monitor issue updated: #${ISSUEDNUMBER}"

          else

            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "📱 OnePlusOSS Kernel Monitor" \
              --body-file "$BODYFILE"

            echo "✅ Monitor issue created."

          fi

          rm -f "$BODYFILE"
