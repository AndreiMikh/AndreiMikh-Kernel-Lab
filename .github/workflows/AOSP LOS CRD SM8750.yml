name: ☘️ Lineage CrDroid SM8750

on:
  workflow_dispatch:
    inputs:
      aospsource:
        description: 'AOSP Source'
        required: true
        type: choice
        default: Lineage
        options:
          - Lineage
          - CrDroid
      ksumeta:
        description: 'KernelSU Variant (ReSukiSU = Built-in KSU, None = No KSU)'
        required: true
        type: choice
        default: ReSukiSU
        options:
          - ReSukiSU
          - None
      nomount:
        description: 'NoMount Built-in Integration (Master = Stable, Dev = Development)'
        required: true
        type: choice
        default: Master
        options:
          - None
          - Master
          - Dev
      susfsmeta:
        description: 'SUSFS Mount / Root Hiding (Only Takes Effect When KernelSU is Enabled Above)'
        required: true
        type: boolean
        default: true
      neonlz4:
        description: 'Update Kernel Compression Libraries to LZ4 1.10 + ZSTD 1.5.7 (Arm64 Neon, Better Ratio) - Replaces In-Tree LZ4 / ZSTD'
        required: true
        type: boolean
        default: true
      droidspaces:
        description: 'Droidspaces Container (Standard = + NTSYNC, Extended = More Features)'
        required: true
        type: choice
        default: standard
        options:
          - false
          - standard
          - extend
      basebandguard:
        description: 'Kernel-Level Baseband Guard (Anti-Format)'
        required: true
        type: boolean
        default: true
      netfilter:
        description: 'Netfilter (IPSet / IPTables)'
        required: true
        type: boolean
        default: true
      bbr:
        description: 'BBR TCP Congestion Control'
        required: true
        type: boolean
        default: true
      kpmodule:
        description: 'KPM / KPN Support'
        required: true
        type: boolean
        default: false
      rekernel:
        description: 'ReKernel Support (Freezer/NoActive Binder Hooks)'
        required: true
        type: boolean
        default: true
      ksuffix:
        description: 'Kernel Version Suffix (e.g. Perf; Empty = Real Commit)'
        required: false
        type: string
        default: ''
      attribute:
        description: 'Attribution (Build Tags / KSU Version)'
        required: true
        type: boolean
        default: true
      builduser:
        description: 'Build User'
        required: false
        type: string
        default: AndreiMikh
      buildhost:
        description: 'Build Host'
        required: false
        type: string
        default: AOSP-Builder
      enablerelease:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      artifactmode:
        description: 'Upload Artifacts (AnyKernel3 or All: + Image + Boot Image)'
        required: true
        type: choice
        default: ak3
        options:
          - ak3
          - all
      buildccacheupdate:
        description: 'Update Public CCache (Upload to Release)'
        required: true
        type: boolean
        default: false
      buildccachedebug:
        description: 'Upload CCache Debug Logs'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release Tag (Empty = Auto Date)'
        required: false
        type: string
        default: ''
      kbuildtime:
        description: 'Custom Build Time String (e.g. Sun Dec 01 08:10:00 UTC 2024); Empty = Current UTC Time'
        required: false
        type: string
        default: ''
      debugskipbuild:
        description: 'Debug: Skip Kernel Build, Test Packaging / Upload Only (Creates Dummy Image)'
        required: true
        type: boolean
        default: false
concurrency:
  group: AOSP-Kernel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
    env:
      # LLVM Toolchain
      CLANGVERSION: r563880c
      CLANGARCHIVE: clang-r563880c.tar.gz

      # CCache Configuration
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILER_CHECK: content
      CCACHE_IS_KERNEL COMPILING: "true"

    steps:
      - name: 📥 Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: 📁 Prepare Build Directories
        shell: bash
        run: |
          # Define Build Directories
          WORKDIR="$GITHUB_WORKSPACE/work"
          SOURCEDIR="$WORKDIR/src"

          # Export Build Directories
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "SOURCEDIR=$SOURCEDIR" >> "$GITHUB_ENV"
        
          echo "📁 Preparing Build Workspace..."
          # Build Workspace Directories
          mkdir -p \
            "$WORKDIR" \
            "$SOURCEDIR" \
            "$GITHUB_WORKSPACE/.ccache" \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/pack"
            
          # Toolchain Directories
          mkdir -p \
            "${GITHUB_WORKSPACE}/clang" \
            "/tmp/gki"
            
          # Kernel Feature Directories          
          mkdir -p \
            "${GITHUB_WORKSPACE}/susfs" \
            "${GITHUB_WORKSPACE}/lz4_oplus" \
            "${GITHUB_WORKSPACE}/extra-files"

          echo
          echo "📂 Prepared Directories:"
          printf '  ✔ %s\n' \
            "$WORKDIR" \
            "$SOURCEDIR" \
            "$GITHUB_WORKSPACE/.ccache" \
            "$GITHUB_WORKSPACE/clang" \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/pack" \
            "$GITHUB_WORKSPACE/susfs" \
            "$GITHUB_WORKSPACE/lz4_oplus" \
            "$GITHUB_WORKSPACE/extra-files" \
            "/tmp/gki"
          echo
          echo "🎉 Build Directories Prepared Successfully"

 
      - name: 🔎 Resolve Clang Revision
        id: clang-meta
        shell: bash
        run: |
          echo "Clang: ${CLANGVERSION}"
          echo "Archive: ${CLANGARCHIVE}"
          echo "clangkey=aosp-clang-${CLANGVERSION}-${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"

  
      - name: 💾 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clangkey }}

   
      - name: 📥 Download AOSP Clang 21
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading AOSP Clang 21 (R-563880C)..."     
          CLANGURL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b5f16aee7b8af4c339972027e91e7e793c2e55d9/clang-r563880c.tar.gz"
          CLANGARCHIVE="clang-r563880c.tar.gz"      
          rm -f "$CLANGARCHIVE"
          rm -rf clang      
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "$CLANGURL" \
            -o "$CLANGARCHIVE"      
          if [ ! -s "$CLANGARCHIVE" ]; then
            echo "Clang Archive was Not Downloaded"
            exit 1
          fi
      
          echo "Extracting AOSP Clang 21..."      
          tar -xzf "$CLANGARCHIVE" -C clang    
          rm -f "$CLANGARCHIVE"      
          if [ ! -x "clang/bin/clang" ]; then
            echo "Clang Executable was Not Found After Extraction"
            find clang -maxdepth 3 -type f -name clang -print
            exit 1
          fi
      
          echo "AOSP Clang 21 (R-563880C) Installed Successfully"
          echo "Clang Version:"
          clang/bin/clang --version

   
      - name: 💾 Save AOSP Clang Cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clangkey }}

  
      - name: 📦 Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            zstd \
            patch \
            bc \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            python3 \
            ccache \
            mkbootimg
          echo "🎉 Build Dependencies Installed"

   
      - name: 🧰 Configure & Verify Clang Toolchain
        shell: bash
        run: |
          # Define Clang Toolchain Path
          CLANGBIN="$GITHUB_WORKSPACE/clang/bin"

          # Add Clang To GitHub Actions Path
          echo "$CLANGBIN" >> "$GITHUB_PATH"
          export PATH="$CLANGBIN:$PATH"
          echo "🔧 Configuring LLVM Clang..."
          echo "📂 Clang Path: $CLANGBIN"

          # Validate Clang Binary
          if [ ! -x "$CLANGBIN/clang" ]; then
            echo "⚠️ Clang Binary Not Found"
            echo "📂 Expected: $CLANGBIN/clang"
            exit 1
          fi

          # Verify LLVM Clang
          echo "🔎 Verifying LLVM Toolchain..."
          echo "📌 Clang:"
          clang --version

          # Verify LLVM LLD
          echo "📌 LLD:"
          ld.lld --version

          # Verify Clang LLD Resolution
          echo "📌 Clang LLD Path:"
          clang -print-prog-name=ld.lld

          # Create GKI Certificate Stub
          printf '%s\n' \
            'def generate_gki_certificate(*args, **kwargs):' \
            '    raise SystemExit("GKI SIGNING NOT SUPPORTED (STUB)")' \
            > /tmp/gki/generate_gki_certificate.py

          # Export Python Module Search Path
          echo "PYTHONPATH=/tmp" >> "$GITHUB_ENV"
          echo "📌 GKI Certificate Stub: /tmp/gki/generate_gki_certificate.py"
          echo "📌 PYTHONPATH: /tmp"
          echo "🎉 Clang Configuration & Toolchain Verification Complete"
    
      - name: 🧹 Clean Runner Space
        shell: bash
        run: |
          echo "🧹 Cleaning Unused Runner Components..."
          (setsid sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 &)
          (setsid sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/ghc >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &)
          echo "📊 Runner Storage:"
          df -h
          echo "🎉 Runner Cleanup Started"


      - name: ⚙️ Configure CCache
        shell: bash
        run: |
          # Install Custom CCache Binary
          if [ -f "$GITHUB_WORKSPACE/lib/ccache-ecs" ]; then
            sudo install -m 0755 \
              "$GITHUB_WORKSPACE/lib/ccache-ecs" \
              /usr/local/bin/ccache
          fi

          # Configure CCache Environment
          export CCACHE_DIR
          export CCACHE_MAXSIZE
          export CCACHE_IS_KERNEL_COMPILING=true
          export CCACHE_COMPILERCHECK=content

          # Configure CCache
          cat > "$CCACHE_DIR/ccache.conf" <<'EOF'
          max_size = 8G
          compression = true
          compression_level = 5
          compiler_check = content
          sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
          EOF

          # Display CCache Configuration
          echo "🔧 CCache Configuration"
          echo "📂 Cache Directory : $CCACHE_DIR"
          echo "📦 Maximum Size    : $CCACHE_MAXSIZE"
          echo "🗜️ Compression     : Enabled"
          echo "🔍 Compiler Check  : Content"

          # Verify CCache Installation
          ccache --version

          # Clear Existing CCache Statistics
          ccache -z


      - name: 💾 Restore GitHub CCache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          # CCache Directory
          path: .ccache

          # Exact CCache Key
          key: CCache-SM8750-${{ inputs.aospsource }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}

          # Fallback CCache Keys
          restore-keys: |
            CCache-SM8750-${{ inputs.aospsource }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}
            CCache-SM8750-${{ inputs.aospsource }}-${{ runner.os }}-${{ runner.arch }}-
            CCache-SM8750-${{ inputs.aospsource }}-

     
      - name: 📦 Pull Public CCache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Define Public CCache Archive
          ARCHIVE="CCache-SM8750-${{ inputs.aospsource }}.tar.zst"

          # Download Public CCache Release
          if gh release download "CCache-SM8750-${{ inputs.aospsource }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" \
            --clobber; then
            echo "📦 Public CCache Found, Merging..."

            # Extract CCache Archive
            tar -I zstd -xf "$ARCHIVE" -C "$CCACHE_DIR"
            rm -f "$ARCHIVE"

            # Apply CCache Size Limit
            ccache -M "$CCACHE_MAXSIZE"

            # Display CCache Status
            echo "📊 CCache Status"
            ccache -s
            echo "✔️ Public CCache Merged"
          else
            echo "ℹ️ No Public CCache Release Found"
          fi


      - name: 📂 Prepare Kernel Sources
        if: ${{ inputs.aospsource == 'Lineage' || inputs.aospsource == 'CrDroid' }}
        shell: bash
        run: |
          # Define Kernel Source
          cd "$WORKDIR"

          # Define Kernel Repository Base
          KERNELBASE="${{ vars.KERNELSOURCE || 'https://github.com' }}"
          # AOSP Kernel Source   
          if [ "${{ inputs.aospsource }}" = "Lineage" ]; then
            KERNELORG="LineageOS"
            KERNELBRANCH="lineage-23.2"
          else
            KERNELORG="crdroidandroid"
            KERNELBRANCH="16.0"
          fi

          # Kernel Repositories
          KERNELREPO="android_kernel_oneplus_sm8750"
          MODULESREPO="android_kernel_oneplus_sm8750-modules"
          DTREPO="android_kernel_oneplus_sm8750-devicetrees"
          echo "📥 Preparing Kernel Sources..."
          echo "📂 Working Directory: $(pwd)"
          echo "📦 Repository : ${KERNELORG}/${KERNELREPO}"
          echo "🌿 Branch     : ${KERNELBRANCH}"

          # Source Commit
          echo "🔎 Detecting Source Commit..."
          FULLSRCCOMMIT="$(git ls-remote \
            "${KERNELBASE}/${KERNELORG}/${KERNELREPO}.git" \
            "refs/heads/${KERNELBRANCH}" |
            awk 'NR==1 {print $1}')"
          if [ -z "$FULLSRCCOMMIT" ]; then
            echo "⚠️ Failed to Detect Source Commit"
            echo "📦 Repository: ${KERNELORG}/${KERNELREPO}"
            echo "🌿 Branch    : ${KERNELBRANCH}"
            exit 1
          fi

          SRCCOMMIT="${FULLSRCCOMMIT:0:8}"
          echo "✔️ Source Commit Detected"
          echo "📌 Full Commit : $FULLSRCCOMMIT"
          echo "📌 Short Commit: $SRCCOMMIT"

          # Download Kernel Sources
          echo "📥 Downloading Kernel Sources..."
          curl -fsSL \
            "${KERNELBASE}/${KERNELORG}/${KERNELREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o src.zip &
          curl -fsSL \
            "${KERNELBASE}/${KERNELORG}/${MODULESREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o modules.zip &
          curl -fsSL \
            "${KERNELBASE}/${KERNELORG}/${DTREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o dt.zip &
          wait

          # Extract Kernel Source
          echo "📦 Extracting Kernel Source..."
          unzip -q src.zip
          mv "${KERNELREPO}-${KERNELBRANCH}" "$SOURCEDIR"
          # Extract Kernel Modules
          echo "📦 Extracting Kernel Modules..."
          unzip -q modules.zip
          mv "${MODULESREPO}-${KERNELBRANCH}" sm8750-modules
          # Extract Device Trees
          echo "📦 Extracting Device Trees..."
          unzip -q dt.zip
          mv "${DTREPO}-${KERNELBRANCH}" sm8750-devicetrees

          # Remove Download Archives
          rm -f src.zip modules.zip dt.zip

          # Define External Kernel Sources
          MODULES="$WORKDIR/sm8750-modules"
          DEVICETREES="$WORKDIR/sm8750-devicetrees"
          echo "📂 Kernel Source : $SOURCEDIR"
          echo "📂 Kernel Modules: $MODULES"
          echo "📂 Device Trees  : $DEVICETREES"

          # Export Kernel Source Variables
          echo "SRCCOMMIT=$SRCCOMMIT" >> "$GITHUB_ENV"
          echo "KERNELSRC=$SOURCEDIR" >> "$GITHUB_ENV"
          echo "KERNELMODULES=$MODULES" >> "$GITHUB_ENV"
          echo "DEVICETREES=$DEVICETREES" >> "$GITHUB_ENV"

          # Inspect Kernel Source Layout
          echo "🔍 Inspecting Kernel Source..."
          echo "📂 Kernel Source:"
          find "$SOURCEDIR" -maxdepth 4 -type d | sort | head -100
          echo "📄 KernelFwUpdate Files:"
          find "$SOURCEDIR" \
            -iname 'Kconfig' \
            -o -iname '*kernelFwUpdate*' \
            | head -100

          # Validate Kernel Source
          echo "🔍 Validating Kernel Source..."
          for target in \
            "$SOURCEDIR/drivers/base/kernelFwUpdate/Kconfig" \
            "$SOURCEDIR/arch/arm64/boot/dts/vendor"; do
            if [ ! -e "$target" ]; then
              echo "⚠️ Missing Kernel Source Target:"
              echo "📌 $target"
              exit 1
            fi

            echo "✔️ Found: $target"
          done

          echo "🎉 Kernel Sources Prepared Successfully"
 
      - name: 🤖 Detect Kernel Version
        id: kernelversion
        shell: bash
        run: |
          KERNELMAKEFILE="$SOURCEDIR/Makefile"
          echo "🔎 Detecting Kernel Version..."
          echo "📂 Kernel Source: $SOURCEDIR"

          if [[ ! -f "$KERNELMAKEFILE" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📂 Expected: $KERNELMAKEFILE"
            exit 1
          fi

          VERSION=$(awk '
            /^VERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          PATCHLEVEL=$(awk '
            /^PATCHLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          SUBLEVEL=$(awk '
            /^SUBLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          EXTRAVERSION=$(awk '
            /^EXTRAVERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          VERSION="${VERSION:-0}"
          PATCHLEVEL="${PATCHLEVEL:-0}"
          SUBLEVEL="${SUBLEVEL:-0}"
          EXTRAVERSION="${EXTRAVERSION:-}"
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid VERSION: $VERSION"
            exit 1
          fi

          if ! [[ "$PATCHLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid PATCHLEVEL: $PATCHLEVEL"
            exit 1
          fi

          if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid SUBLEVEL: $SUBLEVEL"
            exit 1
          fi

          FULLVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"
          KSHORTVERSION="${VERSION}.${PATCHLEVEL}"
          KSHORTPATCHVERSION="${VERSION}_${PATCHLEVEL}"

          KV1="$VERSION"
          KV2="${VERSION}${PATCHLEVEL}"
          KV3="${VERSION}${PATCHLEVEL}${SUBLEVEL}"

          echo "🚀 Kernel Version Detected"
          echo "📌 VERSION       : $VERSION"
          echo "📌 PATCHLEVEL    : $PATCHLEVEL"
          echo "📌 SUBLEVEL      : $SUBLEVEL"
          echo "📌 EXTRAVERSION  : ${EXTRAVERSION:-None}"
          echo "📌 FULL VERSION  : $FULLVERSION"
          echo "📌 KV1           : $KV1"
          echo "📌 KV2           : $KV2"
          echo "📌 KV3           : $KV3"
          echo "📌 Short Version : $KSHORTVERSION"
          echo "📌 Patch Version : $KSHORTPATCHVERSION"

          {
            echo "KERNEL_VERSION=$VERSION"
            echo "KERNEL_PATCHLEVEL=$PATCHLEVEL"
            echo "KERNEL_SUBLEVEL=$SUBLEVEL"
            echo "KERNEL_EXTRAVERSION=$EXTRAVERSION"
            echo "FULLVERSION=$FULLVERSION"
            echo "KV1=$KV1"
            echo "KV2=$KV2"
            echo "KV3=$KV3"
            echo "KSHORTVERSION=$KSHORTVERSION"
            echo "KSHORTPATCHVERSION=$KSHORTPATCHVERSION"
          } >> "$GITHUB_ENV"

          {
            echo "version=$VERSION"
            echo "patchlevel=$PATCHLEVEL"
            echo "sublevel=$SUBLEVEL"
            echo "extraversion=$EXTRAVERSION"
            echo "fullversion=$FULLVERSION"
            echo "kv1=$KV1"
            echo "kv2=$KV2"
            echo "kv3=$KV3"
            echo "shortversion=$KSHORTVERSION"
            echo "shortpatchversion=$KSHORTPATCHVERSION"
          } >> "$GITHUB_OUTPUT"
          echo ""
          echo "🎉 Kernel Version Detection Complete"

     
      - name: 🔧 Apply Compile Fixes
        shell: bash
        run: |
          FILE="$SOURCEDIR/certs/extract-cert.c"
          echo "🔧 Checking Extract-Cert PKCS#11 Compile Fix..."
          if [ ! -f "$FILE" ]; then
            echo "⚠️ File Not Found: $FILE"
            exit 1
          fi

          if grep -q 'USE_PKCS11_ENGINE' "$FILE"; then
            echo "✔️ Compile Fix Already Present"
          else
            echo "🔎 Checking Original Code..."
            if ! grep -q \
              'ERR(!ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0), "Set PKCS#11 PIN");' \
              "$FILE"; then
              echo "⚠️ Expected PKCS#11 Code Not Found"
              echo "📂 $FILE"
              exit 1
            fi

            echo "✔️ Original PKCS#11 Code Found"
            echo "⚙️ Applying Compile Fix..."
            perl -0pi -e \
              's/(\n\t\tif \(key_pass\)\n\t\t\tERR\(!ENGINE_ctrl_cmd_string\(e, "PIN", key_pass, 0\), "Set PKCS#11 PIN"\);)/\n#ifdef USE_PKCS11_ENGINE$1\n#endif/' \
              "$FILE"
            echo "✔️ Compile Fix Applied"
          fi

          echo "🔎 Verifying Compile Fix..."
          if grep -q '^[[:space:]]*#ifdef USE_PKCS11_ENGINE' "$FILE" &&
             grep -q \
              'ERR(!ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0), "Set PKCS#11 PIN");' \
              "$FILE" &&
             grep -q '^[[:space:]]*#endif' "$FILE"; then

            echo "✔️ USE PKCS11 ENGINE Guard Found"
            echo "✔️ PKCS#11 PIN Code Found"
            echo "✔️ #ENDIF Guard Found"
          else
            echo "⚠️ Compile Fix Verification Failed"
            exit 1
          fi

          echo "🔎 Applied Code:"
          grep -n -A5 -B2 \
            'USE_PKCS11_ENGINE' \
            "$FILE"
          echo "🎉 Compile Fix Complete"

    
      - name: 🧾 Generate Base Kernel Configuration
        shell: bash
        run: |
          # Define Kernel Configuration Paths
          CONFIGS="$SOURCEDIR/arch/arm64/configs"
          MERGEBASECONFIGS="$SOURCEDIR/scripts/kconfig/merge_config.sh"
          echo "📥 Generating SM8750 Base Kernel Configuration..."
          echo "📂 Kernel Source : $SOURCEDIR"
          echo "📂 Config Path   : $CONFIGS"

          # Validate Config Merge Script
          if [ ! -x "$MERGEBASECONFIGS" ]; then
            echo "⚠️ Base Config Merge Script Not Found"
            echo "📂 Expected: $MERGEBASECONFIGS"
            exit 1
          fi

          # Define Base Kernel Configurations
          BASECONFIG="$CONFIGS/gki_defconfig"
          PERFCONFIG="$CONFIGS/vendor/sun_perf.config"
          OPLUSCONFIG="$CONFIGS/vendor/oplus/sun_perf.config"
          # Validate Required Kernel Configurations
          for config in \
            "$BASECONFIG" \
            "$PERFCONFIG" \
            "$OPLUSCONFIG"; do
            if [ ! -f "$config" ]; then
              echo "⚠️ Required Kernel Config Not Found"
              echo "📂 $config"
              exit 1
            fi
           
            echo "✔️ Found: $config"
          done

          # Generate Merged Kernel Configuration
          cd "$SOURCEDIR"
          rm -f .config
          echo "🔧 Merging Base Kernel Configurations..."
          # Define Kernel Configuration File
          CONFIGFILE="$SOURCEDIR/.config"

          # Generate Merged Kernel Configuration
          KCONFIG_CONFIG="$CONFIGFILE" \
            "$MERGEBASECONFIGS" \
            -m \
            -r \
            "$BASECONFIG" \
            "$PERFCONFIG" \
            "$OPLUSCONFIG"
          # Validate Generated Configuration
          if [ ! -f "$SOURCEDIR/.config" ]; then
            echo "⚠️ Failed to Generate .config"
            exit 1
          fi

          echo "🧾 Base Kernel Config Generated"

          # Configure Kernel Local Version
          if [ -n "${{ inputs.ksuffix }}" ]; then
            ./scripts/config \
              --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-${{ inputs.ksuffix }}"
          else
            ./scripts/config \
              --file .config \
              --set-str CONFIG_LOCALVERSION "-4k-${SRCCOMMIT}"
          fi

          # Disable Automatic Local Version Suffix
          ./scripts/config \
            --file .config \
            -d CONFIG_LOCALVERSION_AUTO

          # Display Kernel Local Version
          echo "📌 Kernel Local Version:"
          grep '^CONFIG_LOCALVERSION=' .config || true

          # Display Configuration Summary
          echo "📊 Base Configuration:"
          echo "📌 Total Options: $(grep -c '^CONFIG_' .config || true)"

          echo "🎉 Base Kernel Configuration Generated Successfully"


    
      - name: 🔧 Solve Root Engine Source
        id: manager
        if: ${{ inputs.ksumeta != 'None' }}
        shell: bash
        run: |
          ROOTBRANCHSOURCE="${{ inputs.ksumeta }}"
          MANAGERBRANCH=""
          BRANCHPATH=""
          MANAGERARTIFACT=""
          KSUREPO=""

          # Resolve Root Source
          case "$ROOTBRANCHSOURCE" in
            ReSukiSU)
              MANAGERBRANCH="main"
              MANAGERARTIFACT="Manager-release"
              ;;
            *)
              echo "⚠️ Unsupported Root Source: $ROOTBRANCHSOURCE"
              exit 1
              ;;
          esac

          # Resolve Root Engine Repository
          case "$ROOTBRANCHSOURCE" in
            ReSukiSU)
              KSUREPO="ReSukiSU/ReSukiSU"
              ;;
            *)
              echo "⚠️ Unsupported Root Engine: $ROOTBRANCHSOURCE"
              exit 1
              ;;
          esac

          # Validate Resolution
          [[ -n "$MANAGERBRANCH" ]] || {
            echo "⚠️ Failed to Resolve Manager Branch"
            exit 1
          }

          [[ -n "$KSUREPO" ]] || {
            echo "⚠️ Failed to Resolve Root Engine Repository"
            exit 1
          }

          {
            echo "MANAGERBRANCH=$MANAGERBRANCH"
            echo "BRANCHPATH=$BRANCHPATH"
            echo "MANAGERARTIFACT=$MANAGERARTIFACT"
            echo "KSUREPO=$KSUREPO"
          } >> "$GITHUB_OUTPUT"

          echo "------------------------------"
          echo "✔️ Root Engine Source Resolved"
          echo "📦 Engine     : ${{ inputs.ksumeta }}"
          echo "📂 Repository : $KSUREPO"
          echo "🌿 Branch     : $MANAGERBRANCH"
          echo "📦 Artifact   : $MANAGERARTIFACT"
          echo "------------------------------"


      - name: 🔧 Configure Root Engine
        id: rootengine
        if: ${{ inputs.ksumeta != 'None' }}
        shell: bash
        run: |
          cd "$SOURCEDIR"

          MANAGERBRANCH="${{ steps.manager.outputs.MANAGERBRANCH }}"
          KSUREPO="${{ steps.manager.outputs.KSUREPO }}"

          # Helpers
          getcommitcount() {
            git rev-list --count HEAD 2>/dev/null || echo 0
          }

          setupengine() {
            local repo="$1"
            local branch="$2"
            local argument="$3"

            echo "🔗 Setup Repository : $repo"
            echo "🌿 Setup Branch     : $branch"
            echo "📌 Setup Argument   : $argument"

            curl -fsSL \
              "https://raw.githubusercontent.com/${repo}/${branch}/kernel/setup.sh" \
              | bash -s -- "$argument"
          }

          # ReSukiSU
          echo "🚀 Setting Up ReSukiSU..."

          setupengine \
            "$KSUREPO" \
            "$MANAGERBRANCH" \
            "$MANAGERBRANCH"
          cd KernelSU || {
            echo "⚠️ KSU ReSukiSU Directory was Not Created"
            exit 1
          }

          CURRENTBRANCH="$(git branch --show-current || true)"
          CURRENTBRANCH="${CURRENTBRANCH:-HEAD}"

          GITCOMMITHASH="$(git rev-parse --short=8 HEAD)"
          COMMITCOUNT="$(getcommitcount)"

          if [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]]; then
            KSUVERSION=$((COMMITCOUNT + 30700))
          else
            KSUVERSION=30700
          fi

          echo "KSUVERSION=$KSUVERSION" >> "$GITHUB_ENV"
          echo "GITCOMMITHASH=$GITCOMMITHASH" >> "$GITHUB_ENV"

          # Force Simple Tag-Based Full-Name Format
          DEFCONFIG="${SOURCEDIR}/arch/arm64/configs/gki_defconfig"
          if [[ -f "$DEFCONFIG" ]]; then
            sed -i '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG"
            printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"
          fi

          echo "------------------------------"
          echo "🌿 Branch          : $CURRENTBRANCH"
          echo "🔢 KSU Version     : $KSUVERSION"
          echo "🔖 Commit          : $GITCOMMITHASH"
          echo "------------------------------"

          echo "🎉 ReSukiSU Setup Complete"

  
      - name: 🔧 Integrate SUSFS
        run: |
          SRC="${SOURCEDIR}"
          SUSFSKERNEL="${WORKDIR}/susfs"

          SUSFSREPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFSBRANCH="gki-android15-6.6"
          SUSFS50PATCH="${SUSFSKERNEL}/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"

          echo "🔧 SUSFS Integration"
          echo "📌 SUSFS Repository : ${SUSFSREPO}"
          echo "📌 SUSFS Branch     : ${SUSFSBRANCH}"
          echo "📌 Kernel Source    : ${SOURCEDIR}"

          echo "📥 Cloning SUSFS..."
          rm -rf "${SUSFSKERNEL}"
          if git clone \
            --depth 1 \
            --branch "${SUSFSBRANCH}" \
            "${SUSFSREPO}" \
            "${SUSFSKERNEL}"; then
            echo "✔️ SUSFS Cloned Successfully"
          else
            echo "⚠️ Failed to Clone SUSFS"
            exit 1
          fi

          SUSFSCOMMIT="$(git -C "${SUSFSKERNEL}" rev-parse HEAD 2>/dev/null || echo Unknown)"
          SUSFSSHORT="$(git -C "${SUSFSKERNEL}" rev-parse --short HEAD 2>/dev/null || echo Unknown)"

          echo "📌 SUSFS Commit  : ${SUSFSSHORT}"
          echo "📌 SUSFS Revision: ${SUSFSCOMMIT}"

          SUSFSDIR="${SUSFSKERNEL}/kernel_patches"
          SUSFSFS="${SUSFSDIR}/fs"
          SUSFSINCLUDE="${SUSFSDIR}/include/linux"

          echo
          echo "🔎 Checking SUSFS Source Layout..."
          if [ ! -d "${SUSFSFS}" ]; then
            echo "⚠️ SUSFS fs Directory Was Not Found:"
            echo "${SUSFSFS}"
            exit 1
          fi

          if [ ! -d "${SUSFSINCLUDE}" ]; then
            echo "⚠️ SUSFS include/linux Directory Was Not Found:"
            echo "${SUSFSINCLUDE}"
            exit 1
          fi

          if [ ! -f "${SUSFS50PATCH}" ]; then
            echo "⚠️ SUSFS 50 Patch Was Not Found:"
            echo "${SUSFS50PATCH}"
            exit 1
          fi

          echo "✔️ SUSFS Source Layout Verified"
          echo "📌 SUSFS fs      : ${SUSFSFS}"
          echo "📌 SUSFS Headers : ${SUSFSINCLUDE}"
          echo "📌 SUSFS Patch   : ${SUSFS50PATCH}"

          echo
          echo "📥 Copying SUSFS Files..."
          mkdir -p "${SOURCEDIR}/fs"
          mkdir -p "${SOURCEDIR}/include/linux"
          cp -r "${SUSFSFS}/"* "${SOURCEDIR}/fs/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS FS Files"
          cp -r "${SUSFSINCLUDE}/"* "${SOURCEDIR}/include/linux/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS Linux Headers"
          echo "✔️ SUSFS Files Copied"

          echo
          echo "📥 Copying SUSFS 50 Patch..."
          cp "${SUSFS50PATCH}" "${SOURCEDIR}/" 2>/dev/null || \
            echo "⚠️ Failed to Copy SUSFS 50 Patch"
          echo "✔️ SUSFS 50 Patch Copied"

          echo
          echo "🔧 Applying SUSFS 50 Patch..."
          cd "$SOURCEDIR"
          if patch \
            -p1 \
            -F3 \
            --batch \
            -f \
            < "${SUSFS50PATCH}"; then
            echo "✔️ SUSFS 50 Patch Applied Successfully"
          else
            echo "⚠️ SUSFS 50 Patch Failed"
            echo
            echo "📌 SUSFS Commit : ${SUSFSSHORT}"
            echo "📌 Patch        : ${SUSFS50PATCH}"
            exit 1
          fi

          echo
          echo "🎉 SUSFS Integration Complete"
          echo "📌 SUSFS Branch : ${SUSFSBRANCH}"
          echo "📌 SUSFS Commit : ${SUSFSSHORT}"
          echo "📌 SUSFS Source : ${SUSFSKERNEL}"
          echo "📌 SUSFS Patch  : ${SUSFS50PATCH}"

   
      - name: 🔧 Integrate LZ4 OPlus
        if: inputs.neonlz4
        shell: bash
        run: |
          LZ4PATCHUPDATE="$GITHUB_WORKSPACE/lz4_oplus"  
          echo "🔧 LZ4 OPlus Integration"      
          cd "$SOURCEDIR"
      
