      - name: 🔧 Apply DroidSpaces / NTSync / EVDI Kernel Integration
        shell: bash
        run: |
          echo "🔧 Applying DroidSpaces Kernel Integration..."
          cd "$SOURCEDIR"

          EVDIKCONFIG="$SOURCEDIR/drivers/gpu/drm/Kconfig"
          EVDIMAKEFILE="$SOURCEDIR/drivers/gpu/drm/Makefile"
          MISCKCONFIG="$SOURCEDIR/drivers/misc/Kconfig"
          MISCMAKEFILE="$SOURCEDIR/drivers/misc/Makefile"
          SCHEDFILE="$SOURCEDIR/include/linux/sched.h"
          PIDFILE="$SOURCEDIR/kernel/pid.c"
          EXTRA="${GITHUB_WORKSPACE}/extra-files/patches/extra"

          echo "📥 Cloning Extra Files..."
          rm -rf "${GITHUB_WORKSPACE}/extra-files"
          git clone --depth=1 \
            https://github.com/GuLingguang/oneplus-sm8750-kernel-pro-build.git \
            "${GITHUB_WORKSPACE}/extra-files"

          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            echo "🚫 DroidSpaces Disabled"
            exit 0
          fi

          echo "📦 Installing DroidSpaces Sources..."
          cp -f "$EXTRA/drivers/misc/ntsync.c" \
            "$SOURCEDIR/drivers/misc/"

          cp -f "$EXTRA/include/uapi/linux/ntsync.h" \
            "$SOURCEDIR/include/uapi/linux/"

          rm -rf "$SOURCEDIR/drivers/gpu/drm/evdi"

          cp -r "$EXTRA/drivers/gpu/drm/evdi" \
            "$SOURCEDIR/drivers/gpu/drm/"

          echo "✔️ DroidSpaces Sources Installed"

          for FILE in \
            "$EVDIKCONFIG" \
            "$EVDIMAKEFILE" \
            "$MISCKCONFIG" \
            "$MISCMAKEFILE" \
            "$SCHEDFILE" \
            "$PIDFILE" \
            "$SOURCEDIR/drivers/misc/ntsync.c" \
            "$SOURCEDIR/include/uapi/linux/ntsync.h" \
            "$SOURCEDIR/drivers/gpu/drm/evdi/Kconfig" \
            "$SOURCEDIR/drivers/gpu/drm/evdi/Makefile"; do
            [ -f "$FILE" ] || {
              echo "⚠️ Missing: $FILE"
              exit 1
            }
          done

          echo "🔧 EVDI Kconfig..."
          if ! grep -qF 'source "drivers/gpu/drm/evdi/Kconfig"' "$EVDIKCONFIG"; then
            grep -qF 'source "drivers/gpu/drm/nouveau/Kconfig"' "$EVDIKCONFIG" || exit 1
            sed -i \
              '/source "drivers\/gpu\/drm\/nouveau\/Kconfig"/i source "drivers/gpu/drm/evdi/Kconfig"' \
              "$EVDIKCONFIG"
          fi

          echo "🔧 EVDI Makefile..."
          if ! grep -qF 'obj-$(CONFIG_DRM_LINDROID_EVDI)+= evdi/' "$EVDIMAKEFILE"; then
            grep -qF 'obj-y			+= display/' "$EVDIMAKEFILE" || exit 1
            sed -i \
              '/obj-y[[:space:]]*+= display\//a obj-$(CONFIG_DRM_LINDROID_EVDI)+= evdi/' \
              "$EVDIMAKEFILE"
          fi

          echo "🔧 NTSYNC Kconfig..."
          if ! grep -qE '^config NTSYNC$' "$MISCKCONFIG"; then
            grep -qF 'config APDS9802ALS' "$MISCKCONFIG" || exit 1
            perl -0pi -e \
              's/(\nconfig APDS9802ALS\n)/\nconfig NTSYNC\n\ttristate "NT synchronization primitive emulation"\n\tdefault m\n\thelp\n\t  This module provides kernel support for emulation of Windows NT synchronization primitives.\n\n$1/' \
              "$MISCKCONFIG"
          fi

          echo "🔧 NTSYNC Makefile..."
          if ! grep -qF 'obj-$(CONFIG_NTSYNC)' "$MISCMAKEFILE"; then
            grep -qF 'obj-$(CONFIG_SMPRO_ERRMON)' "$MISCMAKEFILE" || exit 1
            sed -i \
              '/obj-$(CONFIG_SMPRO_ERRMON)/i obj-$(CONFIG_NTSYNC)		+= ntsync.o' \
              "$MISCMAKEFILE"
          fi

          echo "🔧 SYSVIPC KABI..."
          if ! grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$SCHEDFILE"; then
            grep -qF 'struct sysv_sem			sysvsem;' "$SCHEDFILE" || exit 1
            grep -qF 'struct sysv_shm			sysvshm;' "$SCHEDFILE" || exit 1

            perl -0pi -e \
              's/\tstruct sysv_sem\s+sysvsem;\n\tstruct sysv_shm\s+sysvshm;/\t\/\/ struct sysv_sem\t\t\tsysvsem;\n\t\/\/ struct sysv_shm\t\t\tsysvshm;/' \
              "$SCHEDFILE"

            perl -0pi -e \
              's/\tANDROID_KABI_RESERVE\(6\);\n\tANDROID_KABI_RESERVE\(7\);\n\tANDROID_KABI_RESERVE\(8\);/\t#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif/' \
              "$SCHEDFILE"
          fi

          echo "👻 Ghost Task..."
          if ! grep -qF 'ghost-task-sentinel' "$PIDFILE"; then
            perl -0pi -e \
              's/(#include <uapi\/linux\/pidfd\.h>\n)/$1#include <linux\/version.h>\n#include <linux\/refcount.h>\n#include <linux\/module.h>\n/' \
              "$PIDFILE"

            perl -0pi -e \
              's/(EXPORT_SYMBOL_GPL\(init_pid_ns\);\n)/$1\nstatic struct task_struct ghost_task;\nstatic bool ghost_task_ready;\n\n#define set_task_usage(target, value) _Generic((target), refcount_t: refcount_set, atomic_t: atomic_set)(&(target), (value))\n\nvoid __init init_ghost_task(void)\n{\n\tmemcpy(\&ghost_task, \&init_task, sizeof(struct task_struct));\n\tstrncpy(ghost_task.comm, "ghost-task-sentinel", TASK_COMM_LEN);\n\tghost_task.pid = -1;\n\tghost_task.tgid = -1;\n\tset_task_usage(ghost_task.usage, 1000);\n#ifdef CONFIG_REFCOUNT_FULL\n\trefcount_set(\&ghost_task.refcount, 1000);\n#endif\n\tghost_task_ready = true;\n}\n/' \
              "$PIDFILE"

            perl -0pi -e \
              's/\treturn find_task_by_pid_ns\(vnr, task_active_pid_ns\(current\)\);/\tstruct task_struct *task;\n\tstruct module *mod;\n\tunsigned long caller_ip = _RET_IP_;\n\n\ttask = find_task_by_pid_ns(vnr, task_active_pid_ns(current));\n\tif (unlikely(!task)) {\n\t\tpreempt_disable();\n\t\tmod = __module_address(caller_ip);\n\t\tif (mod \&\& strcmp(mod->name, "oplus_bsp_midas") == 0) {\n\t\t\tpreempt_enable();\n\t\t\treturn ghost_task_ready ? \&ghost_task : \&init_task;\n\t\t}\n\t\tpreempt_enable();\n\t}\n\treturn task;/' \
              "$PIDFILE"

            perl -0pi -e \
              's/(void __init pid_idr_init\(void\)\n\{\n)/$1\tinit_ghost_task();\n/' \
              "$PIDFILE"
          fi

          echo "🔎 Verifying Integration..."
          grep -qF 'source "drivers/gpu/drm/evdi/Kconfig"' "$EVDIKCONFIG"
          grep -qF 'CONFIG_DRM_LINDROID_EVDI' "$EVDIMAKEFILE"
          grep -qE '^config NTSYNC$' "$MISCKCONFIG"
          grep -qF 'obj-$(CONFIG_NTSYNC)' "$MISCMAKEFILE"
          grep -qF 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' "$SCHEDFILE"
          grep -qF 'ghost-task-sentinel' "$PIDFILE"
          grep -qF 'oplus_bsp_midas' "$PIDFILE"
          grep -qF 'init_ghost_task();' "$PIDFILE"

          echo "✔️ All DroidSpaces / NTSync / EVDI Modifications Verified"
          echo "🎉 DroidSpaces / NTSync / EVDI Kernel Integration Complete"
   
    
      - name: 🔧 Integrate Linux Security Module Baseband Guard
        if: ${{ inputs.basebandguard }}
        shell: bash
        run: |
          MAXRETRIES=3
          cd "$SOURCEDIR"

          echo "🔧 Baseband Guard Integration"
          echo "📌 Source: VC-Teahouse/Baseband-guard"
          echo "📌 Kernel: $SOURCEDIR"

          # Download and Execute Baseband Guard Setup
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          echo "📥 Fetching BBG Setup Script..."
          BBGAPPLIED=false
          for i in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL "$URLBBG" | bash -s -- main; then
              BBGAPPLIED=true
              break
            fi

            echo "⚠️ BBG Setup Failed"
            echo "🔁 Retry $i/$MAXRETRIES..."
            if [ "$i" -lt "$MAXRETRIES" ]; then
              sleep 2
            fi
          done

          if [ "$BBGAPPLIED" != "true" ]; then
            echo "⚠️ Failed to Apply BBG"
            exit 1
          fi

          echo "🎉 BBG Setup Completed"

          # Locate Baseband Guard Source
          echo "🔎 Locating Baseband Guard Source..."
          BBGPATHDIR=""
          if [ -d "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$SOURCEDIR/Baseband-guard"
          elif [ -L "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$(readlink -f "$SOURCEDIR/Baseband-guard")"
          else
            BBGPATHDIR="$(
              find "$SOURCEDIR" \
                -maxdepth 3 \
                -type d \
                -name "Baseband-guard" \
                -print \
                -quit
            )"
          fi

          if [ -z "$BBGPATHDIR" ] || [ ! -d "$BBGPATHDIR" ]; then
            echo "⚠️ Baseband Guard Directory Not Found"
            exit 1
          fi

          echo "📂 BBG Directory:"
          echo "$BBGPATHDIR"

          # Validate Baseband Guard Source
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ BBG Source Not Found"
            echo "📂 BBG Contents:"
            ls -la "$BBGPATHDIR"
            exit 1
          fi

          echo "✔️ Baseband Guard Source Detected"

          # Validate Linux Security Kconfig
          BBGCONFIGFILE="$SOURCEDIR/security/Kconfig"
          if [ ! -f "$BBGCONFIGFILE" ]; then
            echo "⚠️ Linux Security Kconfig Not Found:"
            echo "$BBGCONFIGFILE"
            exit 1
          fi

          # Add Baseband Guard to LSM Default List
          echo "⚙️ Updating Linux Security Module Configuration..."
          if grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "ℹ️ Baseband Guard Already Present"
          else
            awk '
              /^config LSM$/ {
                in_lsm=1
              }

              in_lsm && /^[[:space:]]*default[[:space:]]/ {
                if ($0 ~ /selinux/ && $0 !~ /baseband_guard/) {
                  sub(/selinux/, "selinux,baseband_guard")
                }
              }

              in_lsm && /^config[[:space:]]/ && $0 !~ /^config LSM$/ {
                in_lsm=0
              }

              {
                print
              }
            ' "$BBGCONFIGFILE" > "$BBGCONFIGFILE.tmp"
            mv -f \
              "$BBGCONFIGFILE.tmp" \
              "$BBGCONFIGFILE"
            echo "✔️ Linux Security Configuration Updated"
          fi

          # Enable Baseband Guard If Kernel Config Already Exists
          if [ -f "$SOURCEDIR/.config" ]; then
            echo "⚙️ Enabling CONFIG BBG..."
            ./scripts/config \
              --file "$SOURCEDIR/.config" \
              -e CONFIG_BBG
            echo "✔️ CONFIG BBG Enabled"
          else
            echo "ℹ️ Kernel Config Not Present Yet"
            echo "ℹ️ CONFIG BBG Will Be Resolved During Kernel Configuration"
          fi

          # Final Validation
          echo "🔎 Validating Baseband Guard Integration..."
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ Baseband Guard Source Validation Failed"
            exit 1
          fi

          if ! grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "⚠️ Baseband Guard Was Not Added To Security/Kconfig"
            exit 1
          fi

          echo "✔️ Baseband Guard Source: OK"
          echo "✔️ Baseband Guard Kconfig: OK"
          echo "🎉 Baseband Guard Fully Integrated"
    
      
      - name: Apply ReKernel Patch
        if: ${{ inputs.rekernel }}
        run: |
          cd "$SOURCEDIR"
          patch -p1 -F3 --batch -f \
            < "$GITHUB_WORKSPACE/patches/AOSP/001-ReKernel-AOSP.patch"


      - name: 🔧 NoMount Built-in Integration
        if: ${{ inputs.nomount != 'None' }}
        shell: bash
        run: |
          echo "🔧 NoMount Built-in Integration"
          NOMOUNTSOURCE="${SOURCEDIR}"
          NOMOUNTBRANCH="${{ inputs.nomount }}"
          echo "📂 Kernel Source : ${NOMOUNTSOURCE}"
          echo "📌 NoMount Branch: ${NOMOUNTBRANCH}"

          # Verify Kernel Source
          if [ ! -d "$NOMOUNTSOURCE" ]; then
            echo "⚠️ Kernel Source Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE"
            exit 1
          fi

          # Verify Kernel Filesystem Directory
          if [ ! -d "$NOMOUNTSOURCE/fs" ]; then
            echo "⚠️ Kernel Filesystem Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE/fs"
            exit 1
          fi

          cd "$NOMOUNTSOURCE"

          echo "📥 Integrating NoMount Into Kernel Source..."
          case "$NOMOUNTBRANCH" in
            Master)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : master"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -
              ;;
            Dev)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : dev"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -s -- dev
              ;;
            *)
              echo "⚠️ Unsupported NoMount Selection: $NOMOUNTBRANCH"
              exit 1
              ;;
          esac
          echo "✔️ NoMount Setup Script Completed"

          # Validate NoMount Source
          if [ ! -d "$NOMOUNTSOURCE/fs/nomount" ]; then
            echo "⚠️ NoMount Source Directory Not Found"
            echo "📂 Expected: $NOMOUNTSOURCE/fs/nomount"
            exit 1
          fi

          echo "📂 NoMount Source:"
          ls -la "$NOMOUNTSOURCE/fs/nomount"

          echo "🔎 Verifying NoMount Kernel Integration..."
          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Kconfig" ]; then
            echo "⚠️ NoMount Kconfig Not Found"
            exit 1
          fi

          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Makefile" ]; then
            echo "⚠️ NoMount Makefile Not Found"
            exit 1
          fi

          if ! grep -qF 'nomount' "$NOMOUNTSOURCE/fs/Kconfig"; then
            echo "⚠️ NoMount Kconfig Is Not Included From fs/Kconfig"
            exit 1
          fi

          if ! grep -qF 'nomount/' "$NOMOUNTSOURCE/fs/Makefile"; then
            echo "⚠️ NoMount Makefile Is Not Included From fs/Makefile"
            exit 1
          fi

          echo "✔️ NoMount Kconfig Integration Verified"
          echo "✔️ NoMount Makefile Integration Verified"
          echo "✔️ NoMount Source Integration Verified"
          echo "🎉 NoMount Built-in Integration Complete"

    
      - name: 🔧 Configure Final Kernel Configuration
        run: |
          cd "$SOURCEDIR"
          echo "🔧 Configuring Final Kernel Configuration..."          
          # KSU
          if [ "${{ inputs.ksumeta }}" = "None" ]; then
            echo "🚫 KSU Disabled"
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          else
            echo "✔️ KSU Enabled"
            ./scripts/config --file .config \
              -e CONFIG_KSU

            # KSU Full Name Format
            ./scripts/config --file .config \
              --set-str CONFIG_KSU_FULL_NAME_FORMAT "%TAG_NAME%"
            echo "✔️ KSU Full Name Format: %TAG_NAME%"

            # SUSFS
            if [ "${{ inputs.susfsmeta }}" = "true" ]; then
              echo "✔️ KSU SUSFS Enabled"
              ./scripts/config --file .config \
                -e CONFIG_KSU_SUSFS
            else
              echo "🚫 KSU SUSFS Disabled"
              ./scripts/config --file .config \
                -d CONFIG_KSU_SUSFS
            fi
          fi

          # DroidSpaces
          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            echo "🚫 DroidSpaces Disabled"
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC \
              -d CONFIG_NTSYNC \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # EVDI Only Enabled In Extended Mode
          if [ "${{ inputs.droidspaces }}" != "extend" ]; then
            echo "🚫 EVDI Disabled"
            ./scripts/config --file .config \
              -d CONFIG_DRM_LINDROID_EVDI
          fi

          # Better Network / Netfilter
          if [ "${{ inputs.netfilter }}" != "true" ]; then
            echo "🚫 Better Network / Netfilter Disabled"
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          else
            echo "✔️ Better Network / Netfilter Enabled"
          fi

          # BBR TCP Congestion Control
          if [ "${{ inputs.bbr }}" = "true" ]; then
            echo "✔️ BBR Enabled"
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          # ReKernel Binder Hooks
          if [ "${{ inputs.rekernel }}" = "true" ]; then
            echo "✔️ ReKernel Enabled"
            ./scripts/config --file .config \
              -e CONFIG_REKERNEL
          fi

          # NoMount
          if [ "${{ inputs.nomount }}" = "None" ]; then
            echo "🚫 NoMount Disabled"
            ./scripts/config --file .config \
              -d CONFIG_NOMOUNT
          else
            echo "✔️ NoMount Enabled"
            ./scripts/config --file .config \
              -e CONFIG_NOMOUNT
          fi
          
          echo "🔄 Running Old DefConfig..."          
          export LLVM=1
          export LLVM_IAS=1
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "🔎 Final KSU Configuration"          
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_FULL_NAME_FORMAT)=' \
            .config || true

          echo
          echo "🔎 Final DroidSpaces Configuration"          
          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_NTSYNC|CONFIG_DRM_LINDROID_EVDI)=' \
            .config || true

          echo
          echo "🔎 Final Network Configuration"
         
          grep -E \
            '^(CONFIG_IP_SET|CONFIG_BPF_STREAM_PARSER|CONFIG_IP6_NF_NAT|CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR)=' \
            .config || true

          echo
          echo "🔎 Final ReKernel Configuration"          
          grep '^CONFIG_REKERNEL=' .config || true

          echo
          echo "🔎 Final NoMount Configuration"
          grep '^CONFIG_NOMOUNT=' .config || true

          echo
          echo "🔎 Final Local Version"        
          grep '^CONFIG_LOCALVERSION=' .config || true

          echo
          echo "🎉 Final Kernel Configuration Complete"
    
      
      - name: 🔨 Build Kernel
        if: ${{ !inputs.debugskipbuild }}
        shell: bash
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="${{ inputs.builduser }}"
          export KBUILD_BUILD_HOST="${{ inputs.buildhost }}"

          if [ "${{ inputs.buildccachedebug }}" = "true" ]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          if [[ -n "${{ inputs.kbuildtime }}" &&
                "${{ inputs.kbuildtime }}" != "N" &&
                "${{ inputs.kbuildtime }}" != "n" ]]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.kbuildtime }}"
            echo "🕒 Build Time: ${KBUILD_BUILD_TIMESTAMP}"
          fi

          cd "$GITHUB_WORKSPACE"

          chmod 755 lib/*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"

          LIBDIR="$GITHUB_WORKSPACE/lib"
          export PRELOAD_LIBS="$LIBDIR/libfakestat.so:$LIBDIR/libfaketimeMT.so"

          cat > cc-wrapper <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ccache clang "\$@"
          EOF

          cat > ld-wrapper <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ld.lld "\$@"
          EOF

          chmod +x cc-wrapper ld-wrapper
          echo "🔧 Build Environment"
          echo "📌 LLVM       : $LLVM"
          echo "📌 LLVM IAS   : $LLVM_IAS"
          echo "📌 Build User : $KBUILD_BUILD_USER"
          echo "📌 Build Host : $KBUILD_BUILD_HOST"
          echo "📌 Fake Stat  : $FAKESTAT"
          echo "📌 Fake Time  : $FAKETIME"
          echo "📌 CCache     : $(ccache --version | head -1)"

          cd "$SOURCEDIR"

          echo "🔨 Building Kernel Image..."
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CC="$GITHUB_WORKSPACE/cc-wrapper" \
            LD="$GITHUB_WORKSPACE/ld-wrapper" \
            HOSTLD="$GITHUB_WORKSPACE/ld-wrapper" \
            KCFLAGS+=-O2 \
            -j"$(nproc --all)" \
            Image

          echo "📊 CCache Status:"
          ccache -s

          IMAGE="arch/arm64/boot/Image"
          if [ ! -s "$IMAGE" ]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected: $GITHUB_WORKSPACE/work/src/$IMAGE"
            exit 1
          fi

          echo "📦 Kernel Image:"
          ls -lh "$IMAGE"
          echo "🎉 Kernel Build Complete"

   
      - name: 🧪 Debug Create Dummy Image
        if: ${{ inputs.debugskipbuild }}
        shell: bash
        run: |
          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"
          mkdir -p "$(dirname "$IMAGE")"
          printf '%s\n' "DEBUG DUMMY IMAGE" > "$IMAGE"

          SIZE=$(stat -c%s "$IMAGE")
          echo "🧪 Debug Mode: Kernel Build Skipped"
          echo "📂 Dummy Image: $IMAGE"
          echo "📦 Image Size : $SIZE Bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "⚠️ Failed to Create Dummy Image"
            exit 1
          fi

          echo "🚀 Dummy Image Created Successfully"
   
    
      - name: 🔎 Verify Kernel Build
        id: kernelverify
        shell: bash
        run: |
          cd "$SOURCEDIR"
          echo "🔎 Verifying Kernel Build..."
          echo "📌 Expected Kernel Version: $FULLVERSION"
          if [ ! -f "arch/arm64/boot/Image" ]; then
            echo "⚠️ Kernel Image Not Found"
            exit 1
          fi

          # Get Real Kernel Release
          REL=$(cat include/config/kernel.release 2>/dev/null || true)

          # Get UTS Version
          VER=$(grep -oE \
            '#[0-9]+ SMP[^"]*' \
            include/generated/utsversion.h 2>/dev/null |
            head -1 || true)

          # Fallback: Read UTS Version From Kernel Image
          if [ -z "$VER" ]; then
            VER=$(strings arch/arm64/boot/Image |
              grep -oE '#[0-9]+ SMP[^"]*' |
              head -1 || true)
          fi

          echo "📌 Kernel Release : ${REL:-Unknown}"
          echo "📌 UTS Version    : ${VER:-Unknown}"

          # Verify Kernel Release
          if [ -n "$REL" ]; then
            case "$REL" in
              "$FULLVERSION"*)
                echo "✔️ Kernel Version Matches: $FULLVERSION"
                ;;
              *)
                echo "⚠️ Kernel Version Mismatch"
                echo "📌 Expected: $FULLVERSION"
                echo "📌 Found   : $REL"
                exit 1
                ;;
            esac
          else
            echo "⚠️ Kernel Release Not Found"
          fi

          echo "kernelrel=$REL" >> "$GITHUB_OUTPUT"
          echo "kernelver=$VER" >> "$GITHUB_OUTPUT"

          echo "✔️ Kernel Build Verified"
          ls -lh arch/arm64/boot/Image
   
     
      - name: 🧩 Patch Kernel with KPM
        if: ${{ inputs.kpmodule && !inputs.debugskipbuild }}
        shell: bash
        run: |
          cd "$SOURCEDIR/arch/arm64/boot"
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux \
            -O kptools-linux
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux \
            -O kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux \
            -p \
            -i Image \
            -k kpimg-linux \
            -o oImage
          mv -f oImage Image
          rm -f kptools-linux kpimg-linux
          echo "🎉 KPM Patched"

   
      - name: 💾 Save GitHub CCache
        if: ${{ inputs.buildccacheupdate }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: CCache-SM8750-${{ inputs.aospsource }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}

  
      - name: 📦 Upload Public CCache
        if: ${{ inputs.buildccacheupdate }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        shell: bash
        run: |
          echo "📦 Packaging Public CCache..."

          if [ ! -d "$CCACHE_DIR" ]; then
            echo "⚠️ CCache Directory Not Found"
            echo "📂 Expected: $CCACHE_DIR"
            exit 1
          fi

          echo "📂 CCache Directory: $CCACHE_DIR"

          ccache -s || true

          echo "🗜️ Creating Public CCache Archive..."
          tar -I 'zstd -T0 -5' \
            -cf CCache-SM8750-${{ inputs.aospsource }}.tar.zst \
            -C "$CCACHE_DIR" .
          echo "📦 Archive Size: $(du -sh ccache-sm8750-lineage.tar.zst | cut -f1)"
          echo "🚀 Uploading Public CCache..."
          if gh release create \
            "CCache-SM8750-${{ inputs.aospsource }}" \
            CCache-SM8750-${{ inputs.aospsource }}.tar.zst \
            --notes 'Category: CCache | SM8750-O2-FT — Public CCache for OPlus AOSP SM8750 Kernel Builds'; then
            echo "✔️ Public CCache Release Created"
          elif gh release upload \
            "CCache-SM8750-${{ inputs.aospsource }}" \
            CCache-SM8750-${{ inputs.aospsource }}.tar.zst \
            --clobber; then
            echo "✔️ Public CCache Release Updated"
          else
            echo "⚠️ Failed to Upload Public CCache"
            exit 1
          fi

          rm -f CCache-SM8750-${{ inputs.aospsource }}.tar.zst
          echo "🎉 Public CCache Uploaded Successfully"

   
      - name: 🐞 Upload CCache Debug Log
        if: ${{ inputs.buildccachedebug }}
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log
          path: ccache.log
          if-no-files-found: ignore

    
      - name: 📥 Clone AnyKernel3
        shell: bash
        run: |
          echo "📥 Cloning AnyKernel3..."
          git clone \
            --depth=1 \
            --branch master \
            https://github.com/AndreiMikh/AnyKernel3.git \
            anykernel3
          echo "✔️ AnyKernel3 Cloned"

   
      - name: 📦 Package AnyKernel3
        id: package
        shell: bash
        run: |
          # Create Directories Used for AnyKernel3 Package and Output Files
          mkdir -p out pack

          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"

          # Verify Compiled Kernel Image Exists and Contains Data
          if [ ! -s "$IMAGE" ]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected: $IMAGE"
            exit 1
          fi

          echo "📥 Preparing AnyKernel3 Package..."

          # Copy AnyKernel3 Template Into Temporary Package Directory
          cp -a anykernel3/. pack/

          # Copy Compiled Kernel Image into AnyKernel3 Package
          cp "$IMAGE" pack/Image
          SIZE="$(stat -c%s "$IMAGE")"
          echo "📌 Kernel Image Size: $SIZE bytes"

          # Make Sure Kernel Image is Not Empty
          if [ "$SIZE" -le 0 ]; then
            echo "⚠️ Kernel Image Is Empty"
            exit 1
          fi

          echo "✔️ Kernel Image Verified"

          # Set Kernel Name Displayed by AnyKernel3
          if [ "${{ inputs.attribute }}" = "true" ]; then
            sed -i \
              "s#kernel.string=.*#kernel.string=AOSP ${{ inputs.aospsource }} Kernel | Build by ${{ inputs.builduser }}#" \
              pack/anykernel.sh
          else
            sed -i \
              "s#kernel.string=.*#kernel.string=${{ inputs.aospsource }} OPlus AOSP SM8750 Kernel#" \
              pack/anykernel.sh
          fi

          # Start Detecting Android Security Patch Level From Source Files
          echo
          echo "🔎 Detecting Android Security Patch Level From Source..."
          AOSPPATCHLEVEL=""

          # Search the workspace for Android build metadata that can contain the security patch level.
          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue
            echo "🔎 Checking: $FILE"
            PATCH="$(
              grep -hE \
                '(PLATFORM_SECURITY_PATCH|PRODUCT_SECURITY_PATCH|RO_BUILD_VERSION_SECURITY_PATCH|ro\.build\.version\.security\.patch)' \
                "$FILE" 2>/dev/null |
              grep -oE \
                '20[0-9]{2}-[0-9]{2}(-[0-9]{2})?' |
              head -n1 ||
              true
            )"

            if [ -n "$PATCH" ]; then
              AOSPPATCHLEVEL="${PATCH:0:7}"
              echo "✔️ Android Security Patch Level Detected"
              echo "📂 Source File: $FILE"
              echo "📲 Patch Level: $AOSPPATCHLEVEL"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -name "version_defaults.mk" \
                -o -name "security_patch.mk" \
                -o -name "build.prop" \
                -o -name "system.prop" \
                -o -name "vendor.prop" \
                -o -name "product.prop" \
                -o -name "*.mk" \
                -o -name "*.prop" \
              \) \
              -print \
              2>/dev/null
          )

          # Search Common Android Build Property Files if First Source Search Did Not Find a Valid Security Patch Level
          if [ -z "$AOSPPATCHLEVEL" ]; then
            echo "🔎 Searching Android Build Properties..."
            while IFS= read -r FILE; do
              [ -f "$FILE" ] || continue
              PATCH="$(
                grep -hE \
                  '^ro\.build\.version\.security\.patch[[:space:]]*=' \
                  "$FILE" 2>/dev/null |
                grep -oE \
                  '20[0-9]{2}-[0-9]{2}(-[0-9]{2})?' |
                head -n1 ||
                true
              )"

              if [ -n "$PATCH" ]; then
                AOSPPATCHLEVEL="${PATCH:0:7}"
                echo "✔️ Android Security Patch Level Detected"
                echo "📂 Source File: $FILE"
                echo "📲 Patch Level: $AOSPPATCHLEVEL"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                \( \
                  -name "build.prop" \
                  -o -name "system.prop" \
                  -o -name "vendor.prop" \
                  -o -name "product.prop" \
                \) \
                -print \
                2>/dev/null
            )
          fi

          # Use Workflow Fallback if No Valid Patch Level was Detected
          if ! [[ "$AOSPPATCHLEVEL" =~ ^20[0-9]{2}-[0-9]{2}$ ]]; then
            echo "⚠️ Android Security Patch Level Not Found In Source"
            echo "ℹ️ Using Workflow Fallback: 2026-08"
            AOSPPATCHLEVEL="2026-08"
          fi

          # Export Patch Level for Later Workflow Steps
          echo "AOSPPATCHLEVEL=$AOSPPATCHLEVEL" >> "$GITHUB_ENV"
          echo "📲 Android Security Patch Level: $AOSPPATCHLEVEL"
          echo "✔️ Android Security Patch Level Ready"

          # Generate AnyKernel3 Package File Name
          STAMP="$(date +%Y%m%d)"
          ZIP="AnyKernel3-(${FULLVERSION})-SM8750-${{ inputs.aospsource }}-ReSukiSU(${KSUVERSION})(${STAMP}).zip"

          echo "📦 Creating AnyKernel3 ZIP..."
          echo "📌 Package: $ZIP"

          # Compress AnyKernel3 Package
          cd pack
          zip -r9 \
            "../out/$ZIP" \
            . \
            -x "*.git*" \
            >/dev/null

          cd ..

          # Export Package Name for Later Workflow Steps
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          echo "✔️ AnyKernel3 Package Created"
          ls -lh "out/$ZIP"

          # Generate Raw Kernel Image and Boot Image When All Artifacts are Requested
          if [ "${{ inputs.artifactmode }}" = "all" ]; then
            echo "📦 Generating Raw Kernel Image..."
            cp "$IMAGE" out/Image
            echo "📦 Generating Boot Image..."
            echo "📲 Using Android Security Patch Level: $AOSPPATCHLEVEL"

            # Build Boot Image Using Compiled Kernel and Detected Android Security Patch Level
            mkbootimg \
              --kernel "$IMAGE" \
              --header_version 4 \
              --os_version 16.0.0 \
              --os_patch_level "$AOSPPATCHLEVEL" \
              --pagesize 4096 \
              --base 0x80000000 \
              -o out/boot.img

            # Verify Mkbootimg Produced a Valid Non-Empty Boot Image
            if [ ! -s out/boot.img ]; then
              echo "⚠️ Failed To Generate Boot Image"
              exit 1
            fi

            echo "🚀 All Mode: Image + Boot Image Generated"
            echo "📌 Generated Files:"
            ls -lh \
              out/Image \
              out/boot.img
            echo "📲 Boot Image Patch Level: $AOSPPATCHLEVEL"
          fi

   
      - name: 📤 Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: File-${{ inputs.aospsource }}(${{ env.FULLVERSION }})-ReSukiSU-(${{ env.KSUVERSION }})
          path: out/*
          retention-days: 30
          if-no-files-found: error
