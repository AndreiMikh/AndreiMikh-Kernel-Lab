name: SM-8750 Artifact Fetch

on:
  workflow_run:
    workflows: ["Main V8", "Test V8"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y gh jq unzip
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Download Artifacts from Exact Run
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}

          echo "🚀 Fetching Artifacts for RUN_ID=$RUN_ID"

          mkdir -p artifacts
          gh run download $RUN_ID -D artifacts

      # Optional: Split Per Device Cleanly
      - name: Organize per device
        run: |
          mkdir -p sorted

          for file in artifacts/*; do
            name=$(basename "$file")

            case "$name" in
              *oneplus_13_b*) DEV=oneplus_13_b ;;
              *oneplus_13s_b*) DEV=oneplus_13s_b ;;
              *oneplus_13t_b*) DEV=oneplus_13t_b ;;
              *oneplus_ace5_pro_b*) DEV=oneplus_ace5_pro_b ;;
              *oneplus_ace_6*) DEV=oneplus_ace_6 ;;
              *oneplus_pad_2_pro_b*) DEV=oneplus_pad_2_pro_b ;;
              *oneplus_pad_3_b*) DEV=oneplus_pad_3_b ;;
              *) DEV=unknown ;;
            esac

            mkdir -p sorted/$DEV
            mv "$file" sorted/$DEV/ || true
          done

      - name: Upload Grouped Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "instant-artifacts-${{ github.event.workflow_run.id }}"
          path: sorted/
