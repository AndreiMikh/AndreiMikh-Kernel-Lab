name: ☘️ Test AOSP SM8750
run-name: "${{ inputs.AOSPSOURCE }} • ${{ inputs.ROOTENGINE }}"
on:
  workflow_dispatch:
    inputs:
      AOSPSOURCE:
        type: choice
        description: 'AOSP Source'
        required: true       
        default: Lineage
        options:
          - Lineage
          - CrDroid

      ROOTENGINE:
        type: choice
        description: 'KernelSU Variant (BakaSU = Built-in KSU, None = No KSU)'
        required: true      
        default: BakaSU
        options:
          - BakaSU
          - SukiSU-Ultra
          - KernelSU-Next
          - None
 
      ROOTCOMMIT:
        type: string
        description: "Root Source Commit (Optional)"
        required: false
        default: ''    

      NOMOUNT:
        type: choice
        description: 'NoMount Built-in Integration (Master = Stable, Dev = Development)'
        required: true        
        default: Master
        options:
          - Master
          - Dev
          - None
  
      SUSFSENGINE:
        type: boolean
        description: 'SUSFS Mount / Root Hiding (Only Takes Effect When KernelSU is Enabled Above)'
        required: true
        default: true

      NEONLZ4UPDATE:
        type: boolean
        description: 'Update Kernel Compression Libraries to LZ4 1.10 + ZSTD 1.5.7 (Arm64 Neon, Better Ratio) - Replaces In-Tree LZ4 / ZSTD'
        required: true
        default: true

      BBG:
        type: boolean
        description: 'Kernel-Level Baseband Guard (Anti-Format)'
        required: true
        default: true
  
      BETTERNET:
        type: boolean
        description: 'Netfilter (IPSet / IPTables)'
        required: true
        default: true

      BBR:
        type: boolean
        description: 'BBR TCP Congestion Control'
        required: true
        default: true
  
      KERNELPATCH:
        type: boolean
        description: 'KPM / KPN Support'
        required: true
        default: false
 
      REKERNEL:
        type: boolean
        description: 'ReKernel Support (Freezer/NoActive Binder Hooks)'
        required: true
        default: true

      KERNELSUFFIX:
        type: string
        description: 'Kernel Version Suffix (e.g. Perf; Empty = Real Commit)'
        required: false
        default: flamingsakura

      KERNELBUILDTIME:
        type: string
        description: 'Custom Build Time String (e.g. Sun Dec 01 08:10:00 UTC 2024); Empty = Current UTC Time'
        required: false
        default: 'Mon Aug 3 07:07:07 UTC 2026'

      ATTR:
        type: boolean
        description: 'Attribution (Build Tags / KSU Version)'
        required: true
        default: true
 
      GITOWNER:
        type: string
        description: 'Build User'
        required: false
        default: 'AndreiMikh'
 
      GITHOST:
        type: string
        description: 'Build Host'
        required: false
        default: 'AOSP-Builder'
   
      GITRELEASE:
        type: boolean
        description: 'Create GitHub Release'
        required: true
        default: true

      GITRELEASETAG:
        type: string
        description: 'Release Tag (Empty = Auto Date)'
        required: false
        default: ''
 
      BUILDARTIFACT:
        type: choice
        description: 'Upload Artifacts (AnyKernel3 or All: + Image + Boot Image)'
        required: true
        default: AnyKernel3
        options:
          - AnyKernel3
          - All

      BUILDCCACHE:
        type: boolean
        description: 'Update Public CCache (Upload to Release)'
        required: true
        default: true
  
      DEBUGBUILDCCACHE:
        type: boolean
        description: 'Upload CCache Debug Logs'
        required: true
        default: false
 
      DEBUGKERNELBUILD:
        type: boolean
        description: 'Debug: Skip Kernel Build, Test Packaging / Upload Only (Creates Dummy Image)'
        required: true
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}

    env:
      # CCache Configuration
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: "content"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"

    steps:
      - name: 🧹 Clean Runner Environment
        shell: bash
        run: |
          echo "🧹 Cleaning Unused Runner Components..."
          # Remove Unused .NET Runtime
          sudo rm -rf /usr/share/dotnet
          # Remove Unused Android SDK
          sudo rm -rf /usr/local/lib/android
          # Remove Unused GHC Toolchain
          sudo rm -rf /opt/ghc
          # Remove Unused CodeQL Tools
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "📊 Runner Storage After Cleanup :"
          df -h
          echo "🎉 Runner Cleanup Complete"

      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          repository: AndreiMikh/AndreiMikh-Kernel-Lab
          ref: LiquidAndrei
          path: work/AndreiMikh-Kernel-Lab
          fetch-depth: 1

      - name: 🔍 Debug – Selected Workflow Inputs
        shell: bash
        run: |
          # Resolve Workflow Dispatch Inputs
          AOSPSOURCE='${{ inputs.AOSPSOURCE }}'
          ROOTENGINE='${{ inputs.ROOTENGINE }}'
          ROOTCOMMIT='${{ inputs.ROOTCOMMIT }}'
          NOMOUNT='${{ inputs.NOMOUNT }}'
          SUSFSENGINE='${{ inputs.SUSFSENGINE }}'
          NEONLZ4UPDATE='${{ inputs.NEONLZ4UPDATE }}'
          BBG='${{ inputs.BBG }}'
          BETTERNET='${{ inputs.BETTERNET }}'
          BBR='${{ inputs.BBR }}'
          KERNELPATCH='${{ inputs.KERNELPATCH }}'
          REKERNEL='${{ inputs.REKERNEL }}'
          KERNELSUFFIX='${{ inputs.KERNELSUFFIX }}'
          KERNELBUILDTIME='${{ inputs.KERNELBUILDTIME }}'
          ATTR='${{ inputs.ATTR }}'
          GITOWNER='${{ inputs.GITOWNER }}'
          GITHOST='${{ inputs.GITHOST }}'
          GITRELEASE='${{ inputs.GITRELEASE }}'
          GITRELEASETAG='${{ inputs.GITRELEASETAG }}'
          BUILDARTIFACT='${{ inputs.BUILDARTIFACT }}'
          BUILDCCACHE='${{ inputs.BUILDCCACHE }}'
          DEBUGBUILDCCACHE='${{ inputs.DEBUGBUILDCCACHE }}'
          DEBUGKERNELBUILD='${{ inputs.DEBUGKERNELBUILD }}'
          # Display Selected Inputs
          echo "🔍 Selected Workflow Inputs"
          printf '%-24s : %s\n' "AOSP Source"                 "$AOSPSOURCE"
          printf '%-24s : %s\n' "Root Engine"                 "$ROOTENGINE"
          printf '%-24s : %s\n' "Root Commit"                 "$ROOTCOMMIT"
          printf '%-24s : %s\n' "NoMount"                     "$NOMOUNT"
          printf '%-24s : %s\n' "SUSFS Engine"                "$SUSFSENGINE"
          printf '%-24s : %s\n' "LZ4 / ZSTD Update"           "$NEONLZ4UPDATE"
          printf '%-24s : %s\n' "Baseband Guard"              "$BBG"
          printf '%-24s : %s\n' "Netfilter"                   "$BETTERNET"
          printf '%-24s : %s\n' "BBR"                         "$BBR"
          printf '%-24s : %s\n' "Kernel Patch"                "$KERNELPATCH"
          printf '%-24s : %s\n' "Re-Kernel"                   "$REKERNEL"
          printf '%-24s : %s\n' "Kernel Suffix"               "$KERNELSUFFIX"
          printf '%-24s : %s\n' "Kernel Build Time"           "$KERNELBUILDTIME"
          printf '%-24s : %s\n' "Attribution"                 "$ATTR"
          printf '%-24s : %s\n' "Build User"                  "$GITOWNER"
          printf '%-24s : %s\n' "Build Host"                  "$GITHOST"
          printf '%-24s : %s\n' "GitHub Release"              "$GITRELEASE"
          printf '%-24s : %s\n' "Release Tag"                 "$GITRELEASETAG"
          printf '%-24s : %s\n' "Build Artifact"              "$BUILDARTIFACT"
          printf '%-24s : %s\n' "Build CCache"                "$BUILDCCACHE"
          printf '%-24s : %s\n' "CCache Debug"                "$DEBUGBUILDCCACHE"
          printf '%-24s : %s\n' "Debug Kernel Build"          "$DEBUGKERNELBUILD"
          # Print Unicode Codepoints for Strings Where Hidden Characters Matter
          # Whitespace and Unicode Formatting Characters (Category Cf) are Highlighted
          printunicode() {
            local LABEL="$1"
            local VALUE="$2"
            VALUE="$VALUE" LABEL="$LABEL" python3 <<'PY'
          import os
          import unicodedata
          label = os.environ["LABEL"]
          value = os.environ.get("VALUE", "")
          print(f"{label}: ", end="")
          for char in value:
            code = f"U+{ord(char):04X}"
            if char.isspace() or unicodedata.category(char) == "Cf":
              print(f"\033[31m{code}\033[0m", end=" ")
            else:
              print(code, end=" ")
          print()
          PY
          }

          # Unicode Diagnostics
          echo "🔤 Unicode Diagnostics"
          printunicode "KERNELBUILDTIME" "$KERNELBUILDTIME"
          printunicode "KERNELSUFFIX" "$KERNELSUFFIX"
          # Display Raw Hexadecimal Bytes to Expose Invisible Characters
          echo "🧬 Raw Byte Diagnostics"
          printf 'Kbuild Time : '
          printf '%s' "$KERNELBUILDTIME" | od -An -tx1 | tr -d '\n'
          printf 'KERNELSUFFIX : '
          printf '%s' "$KERNELSUFFIX" | od -An -tx1 | tr -d '\n'
          # Display Bash string lengths.
          echo "📏 Length Diagnostics"
          printf '%-18s : %d\n' \
            "KERNELBUILDTIME" \
            "${#KERNELBUILDTIME}"
          printf '%-18s : %d\n' \
            "KERNELSUFFIX" \
            "${#KERNELSUFFIX}"
          # Check Whether Important Inputs are Populated
          echo "🔎 Value State"
          if [[ -n "$KERNELBUILDTIME" ]]; then
            echo "Kbuild Time : Set"
          else
            echo "Kbuild Time : Empty"
          fi

          if [[ -n "$KERNELSUFFIX" ]]; then
            echo "Kbuild Suffix : Set"
          else
            echo "Kbuild Suffix : Empty"
          fi

          echo "🎉 Input Diagnostics Complete"

      - name: 💼 Prepare Build Workspace
        shell: bash
        run: |
          # Configure Git Identity
          if ! git config --global user.name >/dev/null; then
            git config --global user.name "AndreiMikh"
          fi

          if ! git config --global user.email >/dev/null; then
            git config --global user.email "andreimikhail0088@gmail.com"
          fi

          # Define Build Directories
          WORKDIR="$GITHUB_WORKSPACE/work"
          SOURCEDIR="$WORKDIR/src"
          LABDIR="$WORKDIR/AndreiMikh-Kernel-Lab"
          # Export Build Directories
          {
            echo "WORKDIR=$WORKDIR"
            echo "SOURCEDIR=$SOURCEDIR"
            echo "LABDIR=$LABDIR"
          } >> "$GITHUB_ENV"
          # Prepare Build Workspace
          echo "📁 Preparing Build Workspace..."
          mkdir -p \
            "$WORKDIR" \
            "$GITHUB_WORKSPACE/.ccache" \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/pack"
          # Prepare Toolchain Directories
          mkdir -p \
            "$GITHUB_WORKSPACE/clang" \
            "/tmp/gki"
          # Prepare Kernel Feature Directories
          mkdir -p \
            "$GITHUB_WORKSPACE/susfs" \
            "$GITHUB_WORKSPACE/extra-files"
          # Display Repository
          echo "📂 Repository : $LABDIR"
          ls -la "$LABDIR"
          # Display Prepared Directories
          echo "📂 Prepared Directories :"
          printf '  ✔ %s\n' \
            "$WORKDIR" \
            "$SOURCEDIR" \
            "$LABDIR" \
            "$GITHUB_WORKSPACE/.ccache" \
            "$GITHUB_WORKSPACE/clang" \
            "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/pack" \
            "$GITHUB_WORKSPACE/susfs" \
            "$GITHUB_WORKSPACE/extra-files" \
            "/tmp/gki"
          # Display Git Identity
          echo "🔧 Git Identity :"
          echo "📌 Name         : $(git config --global user.name)"
          echo "📌 Email        : $(git config --global user.email)"
          echo "🎉 Git Identity and Build Workspace Prepared Successfully"

      - name: 📦 Install Build Dependencies
        shell: bash
        run: |
          # Define Required APT Packages
          export APTPACKAGES="zip zstd patch bc flex bison libssl-dev libncurses-dev libelf-dev libdw-dev dwarves python3 ccache mkbootimg"
          # Define APT Packages Script
          SCRIPT="${WORKDIR}/AndreiMikh-Kernel-Lab/scripts/APT-Packages.sh"
          # Verify APT Packages Script
          if [[ ! -f "$SCRIPT" ]]; then
            echo "⚠️ APT Packages Script Not Found"
            echo "📁 Expected Path : $SCRIPT"
            exit 1
          fi

          # Make APT Packages Script Executable
          chmod +x "$SCRIPT"
          # Install Build Dependencies
          echo "🚀 Running APT Packages Script..."
          bash "$SCRIPT" "$HOME/.apt-pkg-cache"
          # Clean APT Package Cache
          echo "🧹 Cleaning APT Package Cache..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "🎉 Build Dependencies Ready"
 
      - name: 🔐 Resolve Clang Toolchain
        id: clang-meta
        shell: bash
        run: |
          # Define Clang Revision
          CLANGVERSION="r563880c"
          CLANGARCHIVE="clang-${CLANGVERSION}.tar.gz"
          # Export Clang Metadata
          {
            echo "CLANGVERSION=$CLANGVERSION"
            echo "CLANGARCHIVE=$CLANGARCHIVE"
          } >> "$GITHUB_ENV"
          # Define Clang Cache Key
          CLANGKEY="aosp-clang-21-${CLANGVERSION}-${{ runner.os }}-${{ runner.arch }}"
          echo "📌 Clang Revision  : $CLANGVERSION"
          echo "📌 Clang Archive   : $CLANGARCHIVE"
          echo "📌 Clang Cache Key : $CLANGKEY"
          # Export Step Outputs
          {
            echo "clangversion=$CLANGVERSION"
            echo "clangkey=$CLANGKEY"
          } >> "$GITHUB_OUTPUT"
  
      - name: 💾 Restore AOSP Clang Cache
        id: clang-cache
        uses: actions/cache/restore@v6
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clangkey }}
       
      - name: 📥 Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Display Clang Download Information
          echo "📥 Downloading AOSP Clang 21..."
          echo "📌 Revision : $CLANGVERSION"
          # Define Clang Paths
          CLANGDIR="$GITHUB_WORKSPACE/clang"
          CLANGFILE="$GITHUB_WORKSPACE/$CLANGARCHIVE"
          # Define AOSP Clang Archive URL
          CLANGURL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b5f16aee7b8af4c339972027e91e7e793c2e55d9/${CLANGARCHIVE}"
          echo "📌 Clang URL : $CLANGURL"          
          # Prepare Clang Directory
          rm -rf "$CLANGDIR"
          mkdir -p "$CLANGDIR"
          # Remove Previous Clang Archive
          rm -f "$CLANGFILE"
          # Download AOSP Clang Archive
          curl \
            -fL \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "$CLANGURL" \
            -o "$CLANGFILE"
          # Validate Downloaded Clang Archive
          if [[ ! -s "$CLANGFILE" ]]; then
            echo "⚠️ Clang Archive Was Not Downloaded"
            exit 1
          fi

          # Extract AOSP Clang Toolchain
          echo "📦 Extracting AOSP Clang..."
          tar \
            -xzf "$CLANGFILE" \
            -C "$CLANGDIR"
          # Remove Clang Archive After Extraction
          rm -f "$CLANGFILE"
          # Validate Clang Installation
          if [[ ! -x "$CLANGDIR/bin/clang" ]]; then
            echo "⚠️ Clang Executable Was Not Found After Extraction"
            echo "📂 Clang Directory :"
            ls -la "$CLANGDIR" || true
            echo "📂 clang/bin :"
            ls -la "$CLANGDIR/bin" || true
            exit 1
          fi

          # Display Successful Installation
          echo "🎉 AOSP Clang Installed Successfully"
          # Display Installed Clang Version
          echo "🔎 Clang Version :"
          "$CLANGDIR/bin/clang" --version
   
      - name: 💾 Save Clang Cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: clang
          key: ${{ steps.clang-meta.outputs.clangkey }}
   
      - name: 🪛 Configure LLVM Toolchain
        shell: bash
        run: |
          # Define Clang Toolchain Path
          CLANGBIN="$GITHUB_WORKSPACE/clang/bin"
          # Add Clang To GitHub Actions Path
          echo "$CLANGBIN" >> "$GITHUB_PATH"
          export PATH="$CLANGBIN:$PATH"
          echo "🔧 Configuring LLVM Clang..."
          echo "📂 Clang Path : $CLANGBIN"
          # Validate Clang Binary
          if [ ! -x "$CLANGBIN/clang" ]; then
            echo "⚠️ Clang Binary Not Found"
            echo "📂 Expected : $CLANGBIN/clang"
            exit 1
          fi

          # Verify LLVM Clang
          echo "🔎 Verifying LLVM Toolchain..."
          echo "📌 Clang :"
          clang --version
          # Verify LLVM LLD
          echo "📌 LLD :"
          ld.lld --version
          # Verify Clang LLD Resolution
          echo "📌 Clang LLD Path :"
          clang -print-prog-name=ld.lld
          # Create GKI Certificate Stub
          printf '%s\n' \
            'def generate_gki_certificate(*args, **kwargs):' \
            '    raise SystemExit("GKI SIGNING NOT SUPPORTED (STUB)")' \
            > /tmp/gki/generate_gki_certificate.py
          # Export Python Module Search Path
          echo "PYTHONPATH=/tmp" >> "$GITHUB_ENV"
          echo "📌 GKI Certificate Stub :"
          echo "/tmp/gki/generate_gki_certificate.py"
          echo "📌 PYTHONPATH :"
          echo "/tmp"
          echo "🎉 Clang Configuration and Toolchain Verification Complete"    

      - name: ⚙️ Configure CCache
        if: ${{ inputs.BUILDCCACHE }}
        shell: bash
        run: |
          # Configure CCache Environment
          export CCACHE_DIR="${CCACHE_DIR:-${GITHUB_WORKSPACE}/.ccache}"
          export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-8G}"
          export CCACHE_COMPILERCHECK="${CCACHE_COMPILERCHECK:-content}"
          export CCACHE_BASEDIR="${CCACHE_BASEDIR:-${GITHUB_WORKSPACE}}"
          export CCACHE_NOHASHDIR="${CCACHE_NOHASHDIR:-true}"
          export CCACHE_NOHARDLINK="${CCACHE_NOHARDLINK:-true}"
          export CCACHE_IS_KERNEL_COMPILING="${CCACHE_IS_KERNEL_COMPILING:-1}"
          # Export CCache Environment For Following Steps
          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_MAXSIZE=$CCACHE_MAXSIZE"
            echo "CCACHE_COMPILERCHECK=$CCACHE_COMPILERCHECK"
            echo "CCACHE_BASEDIR=$CCACHE_BASEDIR"
            echo "CCACHE_NOHASHDIR=$CCACHE_NOHASHDIR"
            echo "CCACHE_NOHARDLINK=$CCACHE_NOHARDLINK"
            echo "CCACHE_IS_KERNEL_COMPILING=$CCACHE_IS_KERNEL_COMPILING"
          } >> "$GITHUB_ENV"
          # Install Custom CCache Binary When Available
          if [[ -f "$GITHUB_WORKSPACE/lib/ccache-ecs" ]]; then
            echo "📦 Installing Custom CCache Binary..."
            sudo install \
              -m 0755 \
              "$GITHUB_WORKSPACE/lib/ccache-ecs" \
              /usr/local/bin/ccache
            echo "✔️ Custom CCache Installed"
          else
            echo "ℹ️ Custom CCache Binary Not Found"
            echo "📌 Using System CCache"
          fi

          # Configure CCache
          ccache --set-config=compression=true
          ccache --set-config=compression_level=3
          # Reduce Avoidable Cache Misses
          ccache --set-config=sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
          # Display CCache Configuration
          echo "🔧 CCache Configuration"
          echo "📂 Cache Directory  : $CCACHE_DIR"
          echo "📦 Maximum Size     : $CCACHE_MAXSIZE"
          echo "🗜️ Compression      : Enabled"
          echo "📊 Compression Lvl  : 3"
          echo "🔍 Compiler Check   : $CCACHE_COMPILERCHECK"
          echo "📍 Base Directory   : $CCACHE_BASEDIR"
          echo "📁 Hash Directory   : Disabled"
          echo "🔗 Hard Links       : Disabled"
          echo "⚙️ Kernel Compiling : $CCACHE_IS_KERNEL_COMPILING"
          echo "🔎 CCache Version"
          ccache --version
          echo "🔎 CCache Configuration"
          ccache --show-config
          echo "🎉 CCache Configuration Complete"

      - name: 💾 Restore CCache
        id: ccache-restore
        if: ${{ inputs.BUILDCCACHE }}
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          # Rolling Exact Key
          key: CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ steps.clang-meta.outputs.clangversion }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}
          # Restore Newest Compatible CCache
          restore-keys: |
            CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ steps.clang-meta.outputs.clangversion }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ steps.clang-meta.outputs.clangversion }}-${{ runner.os }}-${{ runner.arch }}-
            CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ steps.clang-meta.outputs.clangversion }}-
            CCache-SM8750-${{ inputs.AOSPSOURCE }}-

      - name: 📦 Pull Public CCache
        if: ${{ inputs.BUILDCCACHE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Re-Export CCache Directory
          CCACHE_DIR="${CCACHE_DIR:-${GITHUB_WORKSPACE}/.ccache}"
          # Check Whether CCache Data Was Actually Restored
          if [[ -n "$(find "$CCACHE_DIR" -type f -print -quit 2>/dev/null)" ]]; then
            echo "✔️ Existing CCache Found"
            echo "📌 Skipping Public CCache Download"
            echo "📊 Restored CCache Status"
            ccache -s
            exit 0
          fi

          # Define Public CCache Release
          ARCHIVE="CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst"
          RELEASE="CCache-SM8750-${{ inputs.AOSPSOURCE }}"
          echo "📦 No Local CCache Found"
          echo "📦 Looking For Public CCache Release..."
          echo "📌 Release : $RELEASE"
          echo "📌 Archive : $ARCHIVE"
          # Download Public CCache
          if gh release download "$RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" \
            --clobber; then
            echo "✔️ Public CCache Found"
            echo "📦 Merging Public CCache..."
            # Extract Public CCache
            tar \
              -I zstd \
              -xf "$ARCHIVE" \
              -C "$CCACHE_DIR"
            # Remove Downloaded Archive
            rm -f "$ARCHIVE"
            # Re-Apply CCache Size Limit
            ccache -M "$CCACHE_MAXSIZE"
            echo "📊 Public CCache Status"
            ccache -s
            echo "✔️ Public CCache Merged"
          else
            echo "ℹ️ No Public CCache Release Found"
            echo "📌 Starting With Empty CCache"
          fi

      - name: 📊 Initialize CCache Statistics
        if: ${{ inputs.BUILDCCACHE }}
        shell: bash
        run: |
          # Display Restored Cache Before Statistics Reset
          echo "📊 CCache Before Build"
          ccache -s
          # Reset Statistics Only
          # Does Not Delete Cached Compiler Objects
          ccache -z
          echo "📊 CCache Statistics Reset"
          ccache -s
          echo "🎉 CCache Ready For Kernel Build"

      - name: 💾 Save GitHub CCache
        if: ${{ inputs.BUILDCCACHE && !inputs.DEBUGKERNELBUILD }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          # Unique Rolling Cache Snapshot
          # A New Cache is Created for Every Successful Build
          key: CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ steps.clang-meta.outputs.clangversion }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 📦 Upload Public CCache
        if: ${{ inputs.BUILDCCACHE && !inputs.DEBUGKERNELBUILD }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: AndreiMikh/AndreiMikh-Kernel-Lab
        shell: bash
        run: |
          CCACHE_DIR="${CCACHE_DIR:-${GITHUB_WORKSPACE}/.ccache}"
          ARCHIVE="CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst"
          RELEASE="CCache-SM8750-${{ inputs.AOSPSOURCE }}"
          if [[ ! -d "$CCACHE_DIR" ]]; then
            echo "⚠️ CCache Directory Not Found : $CCACHE_DIR"
            exit 1
          fi

          if [[ -z "$(find "$CCACHE_DIR" -type f -print -quit 2>/dev/null)" ]]; then
            echo "ℹ️ CCache Directory is Empty"
            echo "📌 Skipping Public CCache Upload"
            exit 0
          fi

          echo "📊 Final CCache Status"
          ccache -s
          echo "📦 Packaging Public CCache..."
          tar -I 'zstd -T0 -3' -cf "$ARCHIVE" -C "$CCACHE_DIR" .
          echo "📦 Archive Size: $(du -sh "$ARCHIVE" | cut -f1)"
          echo "🚀 Uploading Public CCache..."
          if gh release create "$RELEASE" "$ARCHIVE" \
            --repo "$GH_REPO" \
            --title "$RELEASE" \
            --notes 'Category: CCache | SM8750-O2-FT — Public CCache for OPlus AOSP SM8750 Kernel Builds'; then
            echo "✔️ Public CCache Release Created"
          elif gh release view "$RELEASE" --repo "$GH_REPO" >/dev/null 2>&1; then
            if gh release upload "$RELEASE" "$ARCHIVE" \
              --repo "$GH_REPO" --clobber; then
              echo "✔️ Public CCache Release Updated"
            else
              echo "⚠️ Failed To Update Public CCache Release"
              rm -f "$ARCHIVE"
              exit 1
            fi
      
          else
            echo "⚠️ Failed To Create Public CCache Release"
            rm -f "$ARCHIVE"
            exit 1
          fi

          rm -f "$ARCHIVE"
          echo "🎉 Public CCache Uploaded Successfully"

      - name: 🐞 Upload CCache Debug Log
        if: ${{ inputs.DEBUGBUILDCCACHE }}
        uses: actions/upload-artifact@v6
        with:
          name: CCache-Debug-Log
          path: ccache.log
          if-no-files-found: ignore

      - name: 🗂️ Setup Reject Checker
        shell: bash
        run: |
          # Define Reject Checker
          REJECTCHECKER="${WORKDIR}/AndreiMikh-Kernel-Lab/scripts/RejectChecker.sh"
          # Validate Reject Checker
          if [[ ! -f "$REJECTCHECKER" ]]; then
            echo "⚠️ Reject Checker Not Found :"
            echo "$REJECTCHECKER"
            exit 1
          fi

          # Make Reject Checker Executable
          chmod +x "$REJECTCHECKER"
          # Export Reject Checker Path
          echo "REJECTCHECKER=$REJECTCHECKER" >> "$GITHUB_ENV"
          # Display Reject Checker Information
          echo "🔎 Reject Checker : $REJECTCHECKER"
          echo "🎉 Reject Checker Ready"

      - name: 📂 Download AOSP Kernel Sources
        if: ${{ inputs.AOSPSOURCE == 'Lineage' || inputs.AOSPSOURCE == 'CrDroid' }}
        shell: bash
        run: |
          # Define Kernel Source
          cd "$WORKDIR"
          # Define Kernel Repository Base
          KERNELBASE="${{ vars.KERNELSOURCE || 'https://github.com' }}"       
          # AOSP Kernel Source
          if [ "${{ inputs.AOSPSOURCE }}" = "Lineage" ]; then
            KERNELORG="LineageOS"
            KERNELBRANCH="lineage-24.0"
          else
            KERNELORG="crdroidandroid"
            KERNELBRANCH="17.0"
          fi

          # Kernel Repositories
          KERNELREPO="android_kernel_oneplus_sm8750"
          MODULESREPO="android_kernel_oneplus_sm8750-modules"
          DTREPO="android_kernel_oneplus_sm8750-devicetrees"          
          # Display Kernel Source Information
          echo "📥 Preparing Kernel Sources..."
          echo "📂 Working Directory : $(pwd)"
          echo "📦 Repository        : ${KERNELORG}/${KERNELREPO}"
          echo "🌿 Branch            : ${KERNELBRANCH}"
          # Source Commit
          echo "🔎 Detecting Source Commit..."
          FULLSRCCOMMIT="$(
            git ls-remote \
              "${KERNELBASE}/${KERNELORG}/${KERNELREPO}.git" \
              "refs/heads/${KERNELBRANCH}" |
            awk 'NR==1 {print $1}'
          )"
          # Validate Source Commit
          if [ -z "$FULLSRCCOMMIT" ]; then
            echo "⚠️ Failed to Detect Source Commit"
            echo "📦 Repository      : ${KERNELORG}/${KERNELREPO}"
            echo "🌿 Branch          : ${KERNELBRANCH}"
            exit 1
          fi

          # Define Short Source Commit
          SRCCOMMIT="${FULLSRCCOMMIT:0:8}"          
          echo "✔️ Source Commit Detected"
          echo "📌 Full Commit       : $FULLSRCCOMMIT"
          echo "📌 Short Commit      : $SRCCOMMIT"
          # Define Source Extraction Paths
          MODULES="$WORKDIR/sm8750-modules"
          DEVICETREES="$WORKDIR/sm8750-devicetrees"
          # Clean Previous Source Directories
          echo "🧹 Cleaning Previous Kernel Sources..."
          rm -rf \
            "$SOURCEDIR" \
            "$MODULES" \
            "$DEVICETREES"
          # Remove Previous Download Archives
          rm -f \
            "$WORKDIR/src.zip" \
            "$WORKDIR/modules.zip" \
            "$WORKDIR/dt.zip"
          # Download Kernel Source
          echo "📥 Downloading Kernel Source..."
          echo "📦 ${KERNELREPO}-${KERNELBRANCH}.zip"
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "${KERNELBASE}/${KERNELORG}/${KERNELREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o "$WORKDIR/src.zip"
          # Download Kernel Modules
          echo "📥 Downloading Kernel Modules..."
          echo "📦 ${MODULESREPO}-${KERNELBRANCH}.zip"
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "${KERNELBASE}/${KERNELORG}/${MODULESREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o "$WORKDIR/modules.zip"
          # Download Device Trees
          echo "📥 Downloading Device Trees..."
          echo "📦 ${DTREPO}-${KERNELBRANCH}.zip"
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            "${KERNELBASE}/${KERNELORG}/${DTREPO}/archive/refs/heads/${KERNELBRANCH}.zip" \
            -o "$WORKDIR/dt.zip"
          # Validate Downloaded Archives
          echo "📦 Downloaded Archives :"
          for archive in \
            "$WORKDIR/src.zip" \
            "$WORKDIR/modules.zip" \
            "$WORKDIR/dt.zip"; do
            if [[ ! -s "$archive" ]]; then
              echo "⚠️ Invalid or Empty Archive :"
              echo "$archive"
              exit 1
            fi

            ls -lh "$archive"
          done
          # Extract Kernel Source
          echo "📦 Extracting Kernel Source..."
          unzip -q "$WORKDIR/src.zip"
          mv \
            "${KERNELREPO}-${KERNELBRANCH}" \
            "$SOURCEDIR"
          # Extract Kernel Modules
          echo "📦 Extracting Kernel Modules..."
          unzip -q "$WORKDIR/modules.zip"
          mv \
            "${MODULESREPO}-${KERNELBRANCH}" \
            "$MODULES"
          # Extract Device Trees
          echo "📦 Extracting Device Trees..."
          unzip -q "$WORKDIR/dt.zip"
          mv \
            "${DTREPO}-${KERNELBRANCH}" \
            "$DEVICETREES"
          # Remove Download Archives
          rm -f \
            "$WORKDIR/src.zip" \
            "$WORKDIR/modules.zip" \
            "$WORKDIR/dt.zip"
          # Display External Kernel Sources Paths
          echo "📂 Kernel Source  : $SOURCEDIR"
          echo "📂 Kernel Modules : $MODULES"
          echo "📂 Device Trees   : $DEVICETREES"
          # Export Kernel Source Variables
          {
            echo "SRCCOMMIT=$SRCCOMMIT"
            echo "KERNELSRC=$SOURCEDIR"
            echo "KERNELMODULES=$MODULES"
            echo "DEVICETREES=$DEVICETREES"
          } >> "$GITHUB_ENV"
          # Validate Kernel Source
          echo "🔍 Validating Kernel Source..."
          if [[ ! -d "$SOURCEDIR" ]]; then
            echo "⚠️ Kernel Source Directory Not Found"
            echo "📂 $SOURCEDIR"
            exit 1
          fi

          if [[ ! -f "$SOURCEDIR/Makefile" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📌 $SOURCEDIR/Makefile"
            exit 1
          fi

          if [[ ! -d "$SOURCEDIR/arch/arm64" ]]; then
            echo "⚠️ ARM64 Architecture Directory Not Found"
            echo "📌 $SOURCEDIR/arch/arm64"
            exit 1
          fi

          if [[ ! -d "$SOURCEDIR/arch/arm64/boot/dts/vendor" ]]; then
            echo "⚠️ Vendor Device Tree Directory Not Found"
            echo "📌 $SOURCEDIR/arch/arm64/boot/dts/vendor"
            exit 1
          fi

          # Define KernelFwUpdate Kconfig Path
          KERNELFWUPDATE="$SOURCEDIR/drivers/base/kernelFwUpdate/Kconfig"
          if [[ ! -e "$KERNELFWUPDATE" ]]; then
            echo "⚠️ KernelFwUpdate Kconfig Not Found"
            echo "📌 $KERNELFWUPDATE"
            exit 1
          fi

          # Display Kernel Source Validation Results
          echo "✔️ Kernel Source Directory : Found"
          echo "✔️ Kernel Makefile         : Found"
          echo "✔️ ARM64 Architecture      : Found"
          echo "✔️ Vendor Device Trees     : Found"
          echo "✔️ KernelFwUpdate Kconfig  : Found"
          echo "🚀 Kernel Source Validation Complete"
          # Inspect Kernel Source Layout
          echo "🔍 Inspecting Kernel Source..."
          echo "📂 Kernel Source :"
          find "$SOURCEDIR" \
            -maxdepth 2 \
            -type d |
            sort
          echo "📄 KernelFwUpdate Files :"
          find "$SOURCEDIR" \
            \( \
              -iname 'Kconfig' \
              -o -iname '*kernelFwUpdate*' \
            \) \
            -print
          # Define SetLocalVersion Script
          SETLOCALVERSION="$SOURCEDIR/scripts/setlocalversion"
          # Remove Dirty Kernel Suffix
          if [[ -f "$SETLOCALVERSION" ]]; then
            echo "🧹 Removing -Dirty Kernel Suffix from Kernel Release..."
            sed -i \
              "s/printf '%s' -dirty/printf '%s' ''/g" \
              "$SETLOCALVERSION"
            echo "✔️ -Dirty Kernel Suffix Removal Applied"
            echo "📂 $SETLOCALVERSION"
          else
            echo "⚠️ SetLocalVersion Not Found : $SETLOCALVERSION"
          fi
         
          echo "🎉 Kernel Sources Prepared Successfully"

      - name: 🤖 Detect Kernel Version
        id: kernelversion
        shell: bash
        run: |
          # Define Kernel Makefile
          KERNELMAKEFILE="$SOURCEDIR/Makefile"
          echo "🔎 Detecting Kernel Version..."
          echo "📂 Kernel Source : $SOURCEDIR"
          # Validate Kernel Makefile
          if [[ ! -f "$KERNELMAKEFILE" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📂 Expected : $KERNELMAKEFILE"
            exit 1
          fi

          # Detect Kernel Module Branch
          echo "🔍 Detecting Kernel Module Branch..."
          KERNELMODULE=""
          for cfg in \
            "$SOURCEDIR/build.config.constants" \
            "$SOURCEDIR/build.config.common"; do
            if [[ -f "$cfg" ]]; then
              echo "📄 Checking : $cfg"
              TMPBRANCH=$(grep -m1 '^BRANCH=' "$cfg" | cut -d= -f2 || true)
              if [[ -n "${TMPBRANCH:-}" ]]; then
                KERNELMODULE="$TMPBRANCH"
                break
              fi
            fi
          done
          # Validate Kernel Module Branch
          if [[ -z "$KERNELMODULE" ]]; then
            echo "⚠️ Kernel Module Branch Not Found"
            echo "📂 Kernel Source : $SOURCEDIR"
            echo "📌 Checked       :"
            echo "   $SOURCEDIR/build.config.constants"
            echo "   $SOURCEDIR/build.config.common"
            exit 1
          fi

          # Parse Kernel Module Information
          ANDROIDVERSION="${KERNELMODULE%-*}"
          KERNELVERSION="${KERNELMODULE#*-}"
          echo "🚀 Kernel Module Detected"
          echo "📌 Kernel Module   : $KERNELMODULE"
          echo "📌 Android Version : $ANDROIDVERSION"
          echo "📌 Kernel Branch   : $KERNELVERSION"
          # Extract Kernel Version Components
          VERSION=$(awk '
            /^VERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          PATCHLEVEL=$(awk '
            /^PATCHLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          SUBLEVEL=$(awk '
            /^SUBLEVEL[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          EXTRAVERSION=$(awk '
            /^EXTRAVERSION[[:space:]]*=/ {
              print $3
              exit
            }
          ' "$KERNELMAKEFILE")
          # Apply Version Defaults
          VERSION="${VERSION:-0}"
          PATCHLEVEL="${PATCHLEVEL:-0}"
          SUBLEVEL="${SUBLEVEL:-0}"
          EXTRAVERSION="${EXTRAVERSION:-}"
          # Validate Version Components
          if ! [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Version : $VERSION"
            exit 1
          fi
         
          if ! [[ "$PATCHLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Patchlevel : $PATCHLEVEL"
            exit 1
          fi

          if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Sublevel : $SUBLEVEL"
            exit 1
          fi

          # Build Kernel Version Identifiers
          FULLVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"
          KSHORTVERSION="${VERSION}.${PATCHLEVEL}"
          KSHORTPATCHVERSION="${VERSION}_${PATCHLEVEL}"
          KV1="$VERSION"
          KV2="${VERSION}${PATCHLEVEL}"
          KV3="${VERSION}${PATCHLEVEL}${SUBLEVEL}"
          # Display Detected Kernel Version
          echo "🚀 Kernel Version Detected"
          echo "📌 Version       : $VERSION"
          echo "📌 Patchlevel    : $PATCHLEVEL"
          echo "📌 Sublevel      : $SUBLEVEL"
          echo "📌 Extra Version : ${EXTRAVERSION:-None}"
          echo "📌 Full Version  : $FULLVERSION"          
          echo "📌 KV1           : $KV1"
          echo "📌 KV2           : $KV2"
          echo "📌 KV3           : $KV3"         
          echo "📌 Short Version : $KSHORTVERSION"
          echo "📌 Patch Version : $KSHORTPATCHVERSION"     
          echo "📌 Android Base  : $ANDROIDVERSION"
          echo "📌 Kernel Base   : $KERNELVERSION"
          echo "📌 Kernel Module : $KERNELMODULE"
          # Export Kernel Version Variables
          {
            echo "KERNEL_VERSION=$VERSION"
            echo "KERNEL_PATCHLEVEL=$PATCHLEVEL"
            echo "KERNEL_SUBLEVEL=$SUBLEVEL"
            echo "KERNEL_EXTRAVERSION=$EXTRAVERSION"
            echo "FULLVERSION=$FULLVERSION"
            echo "KV1=$KV1"
            echo "KV2=$KV2"
            echo "KV3=$KV3"
            echo "KSHORTVERSION=$KSHORTVERSION"
            echo "KSHORTPATCHVERSION=$KSHORTPATCHVERSION"
            echo "KERNELMODULE=$KERNELMODULE"
            echo "ANDROIDVERSION=$ANDROIDVERSION"
            echo "KERNELVERSION=$KERNELVERSION"
          } >> "$GITHUB_ENV"
          # Export Kernel Version Outputs
          {
            echo "version=$VERSION"
            echo "patchlevel=$PATCHLEVEL"
            echo "sublevel=$SUBLEVEL"
            echo "extraversion=$EXTRAVERSION"
            echo "fullversion=$FULLVERSION"
            echo "kv1=$KV1"
            echo "kv2=$KV2"
            echo "kv3=$KV3"
            echo "shortversion=$KSHORTVERSION"
            echo "shortpatchversion=$KSHORTPATCHVERSION"
            echo "kernelmodule=$KERNELMODULE"
            echo "androidversion=$ANDROIDVERSION"
            echo "kernelversion=$KERNELVERSION"
          } >> "$GITHUB_OUTPUT"
          echo "🎉 Kernel Version Detection Complete"
         
      - name: ♻️ Extract-Cert PKCS11 Support
        shell: bash
        run: |
          # Define Extract-Cert Source
          FILE="$SOURCEDIR/certs/extract-cert.c"
          echo "🔧 Checking Extract-Cert PKCS11 Support..."
          # Validate Extract-Cert Source
          if [[ ! -f "$FILE" ]]; then
            echo "⚠️ File Not Found : $FILE"
            exit 1
          fi

          # Check PKCS11 PIN Handling
          if grep -q 'ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0)' "$FILE"; then
            echo "✔️ PKCS11 PIN Handling Found"
          else
            echo "ℹ️ PKCS11 PIN Handling Not Present"
            echo "✔️ No Modification Required"
            exit 0
          fi

          # Check Existing USE PKCS11 ENGINE Guard
          if grep -B5 -A2 \
            'ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0)' "$FILE" |
            grep -q '#ifdef USE_PKCS11_ENGINE'; then
            echo "✔️ USE PKCS11 ENGINE Guard Already Present"
            echo "✔️ No Modification Required"
            exit 0
          fi

          # Apply USE PKCS11 ENGINE Guard
          echo "⚙️ Applying USE PKCS11 ENGINE Guard..."
          perl -0pi -e \
            's/(\n\t\tif \(key_pass\)\n\t\t\tERR\(!ENGINE_ctrl_cmd_string\(e, "PIN", key_pass, 0\), "Set PKCS#11 PIN"\);)/\n#ifdef USE_PKCS11_ENGINE$1\n#endif/' \
            "$FILE"
          # Verify Compile Guard
          if grep -B5 -A2 \
            'ENGINE_ctrl_cmd_string(e, "PIN", key_pass, 0)' "$FILE" |
            grep -q '#ifdef USE_PKCS11_ENGINE'; then
            echo "🎉 PKCS11 Compile Guard Applied"
          else
            echo "⚠️ Failed to Apply PKCS#11 Compile Guard"
            exit 1
          fi  
   
      - name: 🧾 Generate Base Kernel Configuration
        shell: bash
        run: |
          # Define Kernel Configuration Paths
          CONFIGS="$SOURCEDIR/arch/arm64/configs"
          MERGEBASECONFIGS="$SOURCEDIR/scripts/kconfig/merge_config.sh"
          echo "📥 Generating SM8750 Base Kernel Configuration..."
          echo "📂 Kernel Source : $SOURCEDIR"
          echo "📂 Config Path   : $CONFIGS"
          # Validate Config Merge Script
          if [ ! -x "$MERGEBASECONFIGS" ]; then
            echo "⚠️ Base Config Merge Script Not Found"
            echo "📂 Expected    : $MERGEBASECONFIGS"
            exit 1
          fi

          # Define Base Kernel Configurations
          BASECONFIG="$CONFIGS/gki_defconfig"
          PERFCONFIG="$CONFIGS/vendor/sun_perf.config"
          OPLUSCONFIG="$CONFIGS/vendor/oplus/sun_perf.config"
          # Validate Required Kernel Configurations
          for config in \
            "$BASECONFIG" \
            "$PERFCONFIG" \
            "$OPLUSCONFIG"; do
            if [ ! -f "$config" ]; then
              echo "⚠️ Required Kernel Config Not Found"
              echo "📂 $config"
              exit 1
            fi
          
            echo "✔️ Found : $config"
          done

          # Generate Merged Kernel Configuration
          cd "$SOURCEDIR"
          rm -f .config
          echo "🔧 Merging Base Kernel Configurations..."
          # Define Kernel Configuration File
          CONFIGFILE="$SOURCEDIR/.config"
          # Generate Merged Kernel Configuration
          KCONFIG_CONFIG="$CONFIGFILE" \
            "$MERGEBASECONFIGS" \
            -m \
            -r \
            "$BASECONFIG" \
            "$PERFCONFIG" \
            "$OPLUSCONFIG"
          # Validate Generated Configuration
          if [ ! -f "$SOURCEDIR/.config" ]; then
            echo "⚠️ Failed to Generate .config"
            exit 1
          fi

          echo "🧾 Base Kernel Config Generated"
          # Configure Kernel Local Version
          if [ -n "${{ inputs.KERNELSUFFIX }}" ]; then
            ./scripts/config \
              --file .config \
              --set-str CONFIG_LOCALVERSION "-${{ inputs.KERNELSUFFIX }}-4k"
          else
            ./scripts/config \
              --file .config \
              --set-str CONFIG_LOCALVERSION "-${SRCCOMMIT}-4k"
          fi

          # Disable Automatic Local Version Suffix
          ./scripts/config \
            --file .config \
            -d CONFIG_LOCALVERSION_AUTO
          # Display Kernel Local Version
          echo "📌 Kernel Local Version :"
          grep '^CONFIG_LOCALVERSION=' .config || true
          # Display Configuration Summary
          echo "📊 Base Configuration :"
          echo "📌 Total Options : $(grep -c '^CONFIG_' .config || true)"
          echo "🎉 Base Kernel Configuration Generated Successfully"

      - name: 🆘 Solve Root Engine Source
        id: manager
        if: ${{ inputs.ROOTENGINE != 'None' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOTENGINE: ${{ inputs.ROOTENGINE }}
          ROOTCOMMIT: ${{ inputs.ROOTCOMMIT }}
        run: |
          MANAGERBRANCH=""
          BRANCHPATH=""
          MANAGERARTIFACT=""
          KSUREPO=""
          VERSIONREPO=""
          VERSIONBRANCH=""
          VERSIONOFFSET=""
          # Resolve Root Engine
          case "$ROOTENGINE" in
            BakaSU)
              KSUREPO="Baka-SU/BakaSU"
              MANAGERBRANCH="main"
              MANAGERARTIFACT="Manager-release"
              VERSIONOFFSET=30700
              VERSIONREPO="$KSUREPO"
              VERSIONBRANCH="$MANAGERBRANCH"
              ;;
            SukiSU-Ultra)
              KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
              MANAGERBRANCH="main"
              BRANCHPATH="builtin"
              MANAGERARTIFACT="manager"
              VERSIONOFFSET=37185
              VERSIONREPO="$KSUREPO"
              VERSIONBRANCH="$MANAGERBRANCH"
              ;;
            KernelSU-Next)
              KSUREPO="pershoot/KernelSU-Next"
              MANAGERBRANCH="dev"
              BRANCHPATH="dev-susfs"
              MANAGERARTIFACT="manager"
              VERSIONOFFSET=30000
              VERSIONREPO="KernelSU-Next/KernelSU-Next"
              VERSIONBRANCH="$MANAGERBRANCH"
              ;;
            *)
              echo "⚠️ Unsupported Root Engine: $ROOTENGINE"
              exit 1
              ;;
          esac
          # Resolve Setup Branch
          ROOTSOURCEBRANCH="${BRANCHPATH:-$MANAGERBRANCH}"
          # Resolve Exact Root Engine Commit
          if [[ -n "$ROOTCOMMIT" ]]; then
            if [[ ! "$ROOTCOMMIT" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
              echo "⚠️ Invalid Root Engine Commit: $ROOTCOMMIT"
              exit 1
            fi
            ROOTCOMMITFULL="$(
              gh api "repos/${KSUREPO}/commits/${ROOTCOMMIT}" --jq '.sha'
            )" || {
              echo "⚠️ Failed to Resolve Root Engine Commit"
              exit 1
            }
            BRANCHSTATUS="$(
              gh api \
                "repos/${KSUREPO}/compare/${ROOTSOURCEBRANCH}...${ROOTCOMMITFULL}" \
                --jq '.status'
            )" || {
              echo "⚠️ Failed to Validate Commit Against Setup Branch"
              exit 1
            }
            if [[ "$BRANCHSTATUS" != "identical" &&
                  "$BRANCHSTATUS" != "behind" &&
                  "$BRANCHSTATUS" != "ahead" ]]; then
              echo "⚠️ Commit Does Not Belong to the Selected Setup Branch"
              exit 1
            fi

            if [[ "${ROOTCOMMITFULL:0:7}" != "${ROOTCOMMIT:0:7}" ]]; then
              echo "⚠️ Resolved Commit Does Not Match Requested Commit"
              exit 1
            fi
        
          else
            ROOTCOMMITFULL="$(
              gh api \
                "repos/${KSUREPO}/commits/${ROOTSOURCEBRANCH}" \
                --jq '.sha'
            )" || {
              echo "⚠️ Failed to Resolve Latest Root Engine Commit"
              exit 1
            }
          fi
      
          [[ "$ROOTCOMMITFULL" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo "⚠️ Invalid Resolved Commit: $ROOTCOMMITFULL"
            exit 1
          }
          ROOTCOMMITSHORT="${ROOTCOMMITFULL:0:7}"
          # Resolve Version Commit Count
          if [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
            VERSIONREF="$VERSIONBRANCH"
          else
            VERSIONREF="$ROOTCOMMITFULL"
          fi

          VERSIONDATA="$(
            gh api graphql \
              -f query='
                query($owner: String!, $repo: String!, $expression: String!) {
                  repository(owner: $owner, name: $repo) {
                    object(expression: $expression) {
                      ... on Commit {
                        oid
                        history(first: 1) {
                          totalCount
                        }
                      }
                    }
                  }
                }
              ' \
              -F owner="${VERSIONREPO%%/*}" \
              -F repo="${VERSIONREPO#*/}" \
              -F expression="$VERSIONREF"
          )" || {
            echo "⚠️ Failed to Resolve Root Engine Version"
            exit 1
          }
          jq -e '
            (.errors == null) and
            (.data.repository.object.oid | type == "string") and
            (.data.repository.object.history.totalCount | type == "number")
          ' >/dev/null <<< "$VERSIONDATA" || {
            echo "⚠️ Invalid Root Engine Version Response"
            jq -r '.errors[]?.message' <<< "$VERSIONDATA" || true
            exit 1
          }
          VERSIONCOMMIT="$(
            jq -r '.data.repository.object.oid' <<< "$VERSIONDATA"
          )"
          COMMITCOUNT="$(
            jq -r '.data.repository.object.history.totalCount' <<< "$VERSIONDATA"
          )"
          if [[ "$ROOTENGINE" != "KernelSU-Next" &&
                "${VERSIONCOMMIT,,}" != "${ROOTCOMMITFULL,,}" ]]; then
            echo "⚠️ Version Commit Does Not Match Selected Commit"
            exit 1
          fi

          KSUVERSION=$((COMMITCOUNT + VERSIONOFFSET))
          # Resolve Latest Manager Tag
          MANAGERTAG="$(
            gh api "repos/${KSUREPO}/git/matching-refs/tags/" \
              --paginate \
              --jq '.[].ref | sub("^refs/tags/"; "")' |
              sort -V |
              tail -n 1
          )" || true
          # Export Root Engine Metadata
          {
            echo "managerbranch=$MANAGERBRANCH"
            echo "branchpath=$BRANCHPATH"
            echo "managerartifact=$MANAGERARTIFACT"
            echo "ksurepo=$KSUREPO"
            echo "rootcommitfull=$ROOTCOMMITFULL"
            echo "rootcommit=$ROOTCOMMITSHORT"
            echo "ksuversion=$KSUVERSION"
            echo "managertag=$MANAGERTAG"
          } >> "$GITHUB_OUTPUT"
          echo "------------------------------"
          echo "✔️ Root Engine Source Resolved"
          echo "📦 Engine        : $ROOTENGINE"
          echo "📂 Repository    : $KSUREPO"
          echo "🌿 Branch        : $MANAGERBRANCH"
          echo "📁 Setup Path    : ${BRANCHPATH:-None}"
          echo "📦 Artifact      : $MANAGERARTIFACT"
          echo "🔖 Commit        : $ROOTCOMMITSHORT"
          echo "🔢 KSU Version   : $KSUVERSION"
          echo "🏷️ Manager Tag   : ${MANAGERTAG:-None}"
          echo "------------------------------"

      - name: 🏍️ Configure Root Engine
        id: rootengine
        if: ${{ inputs.ROOTENGINE != 'None' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCEDIR: ${{ env.SOURCEDIR }}
          ROOTENGINE: ${{ inputs.ROOTENGINE }}
          ROOTCOMMIT: ${{ steps.manager.outputs.rootcommitfull }}
          ROOTCOMMITSHORT: ${{ steps.manager.outputs.rootcommit }}
          KSUREPO: ${{ steps.manager.outputs.ksurepo }}
          MANAGERBRANCH: ${{ steps.manager.outputs.managerbranch }}
          BRANCHPATH: ${{ steps.manager.outputs.branchpath }}
          KSUVERSION: ${{ steps.manager.outputs.ksuversion }}
          MANAGERTAG: ${{ steps.manager.outputs.managertag }}
          SUSFS: ${{ inputs.SUSFSENGINE }}
        run: |
          cd "$SOURCEDIR"
          # Validate Resolved Metadata
          [[ "$ROOTCOMMIT" =~ ^[a-fA-F0-9]{40}$ ]] || {
            echo "⚠️ Invalid Root Engine Commit"
            exit 1
          }
          [[ "$KSUVERSION" =~ ^[0-9]+$ ]] || {
            echo "⚠️ Invalid Root Engine Version"
            exit 1
          }
          # Resolve Engine Setup Parameters
          case "$ROOTENGINE" in
            BakaSU)
              ROOTDIR="$SOURCEDIR/KernelSU"
              SETUPBRANCH="$MANAGERBRANCH"
              SETUPARGUMENT="$MANAGERBRANCH"
              ;;
            SukiSU-Ultra)
              ROOTDIR="$SOURCEDIR/KernelSU"
              SETUPBRANCH="$MANAGERBRANCH"
              SETUPARGUMENT="$BRANCHPATH"
              ;;
            KernelSU-Next)
              ROOTDIR="$SOURCEDIR/KernelSU-Next"
              SETUPBRANCH="$BRANCHPATH"
              SETUPARGUMENT="$BRANCHPATH"
              ;;
            *)
              echo "⚠️ Unsupported Root Engine: $ROOTENGINE"
              exit 1
              ;;
          esac
          # Download and Execute Setup Script From Exact Commit
          setupengine() {
            local repo="$1"
            local branch="$2"
            local argument="$3"
            local commit="$4"
            local tempdir
            local setupscript
            tempdir="$(mktemp -d)"
            setupscript="$tempdir/setup.sh"
            echo "🔗 Setup Repository : $repo"
            echo "🌿 Setup Branch     : $branch"
            echo "📌 Setup Argument   : ${argument:-None}"
            echo "🔖 Setup Commit     : $commit"
            curl -fsSL --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/${repo}/${commit}/kernel/setup.sh" \
              -o "$setupscript" || {
                rm -rf "$tempdir"
                echo "⚠️ Failed to Download Setup Script"
                return 1
              }
            [[ -s "$setupscript" ]] || {
              rm -rf "$tempdir"
              echo "⚠️ Setup Script Is Empty"
              return 1
            }
            if [[ -n "$argument" ]]; then
              bash "$setupscript" "$argument" || {
                rm -rf "$tempdir"
                return 1
              }
            else
              bash "$setupscript" || {
                rm -rf "$tempdir"
                return 1
              }
            fi

            rm -rf "$tempdir"
          }
          # Install Exact Source While Preserving Git Metadata
          checkoutrootcommit() {
            local dir="$1"
            local commit="$2"
            local actual=""
            local tempdir=""
            [[ -d "$dir" ]] || {
              echo "⚠️ Root Engine Directory Not Found : $dir"
              return 1
            }
            actual="$(
              curl -fsSL --retry 3 --retry-all-errors \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${KSUREPO}/commits/${commit}" |
                jq -er '.sha'
            )" || {
              echo "⚠️ Failed to Verify Remote Commit"
              return 1
            }
            [[ "${actual,,}" == "${commit,,}" ]] || {
              echo "⚠️ Remote Commit Verification Failed"
              return 1
            }
            tempdir="$(mktemp -d)"
            curl -fsSL --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${KSUREPO}/tarball/${commit}" \
              -o "$tempdir/source.tar.gz" || {
                rm -rf "$tempdir"
                echo "⚠️ Failed to Download Exact Source"
                return 1
              }
            mkdir -p "$tempdir/extracted"
            tar -xzf "$tempdir/source.tar.gz" \
              -C "$tempdir/extracted" \
              --strip-components=1 || {
                rm -rf "$tempdir"
                echo "⚠️ Failed to Extract Source"
                return 1
              }
            [[ -f "$tempdir/extracted/Kbuild" ||
               -f "$tempdir/extracted/kernel/Kbuild" ]] || {
              rm -rf "$tempdir"
              echo "⚠️ Unexpected Root Engine Source Layout"
              return 1
            }
            find "$dir" -mindepth 1 -maxdepth 1 \
              ! -name ".git" -exec rm -rf -- {} + || {
                rm -rf "$tempdir"
                echo "⚠️ Failed to Clean Existing Source"
                return 1
              }
            cp -a "$tempdir/extracted/." "$dir/" || {
              rm -rf "$tempdir"
              echo "⚠️ Failed to Install Exact Source"
              return 1
            }
            rm -rf "$tempdir"
            [[ -f "$dir/Kbuild" || -f "$dir/kernel/Kbuild" ]] || {
              echo "⚠️ Installed Root Engine Source Is Invalid"
              return 1
            }
            echo "✔️ Exact Source Installed: $commit"
          }
          # Configure Root Engine Version Metadata
          recordrootversion() {
            {
              echo "KSUVERSION=$KSUVERSION"
              echo "KSUVER=$KSUVERSION"
              echo "GITCOMMITHASH=$ROOTCOMMITSHORT"
            } >> "$GITHUB_ENV"
            echo "🔖 Commit      : $ROOTCOMMITSHORT"
            echo "🏷️ Manager Tag : ${MANAGERTAG:-None}"
            echo "🔢 KSU Version : $KSUVERSION"
          }
          # Configure Version Fallback When Supported
          configureksuversionfallback() {
            if [[ -f kernel/Kbuild ]] &&
               grep -q '^KSU_VERSION_FALLBACK := ' kernel/Kbuild; then
              sed -i \
                "s/^KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := $KSUVERSION/" \
                kernel/Kbuild
              echo "✔️ KSU Version Fallback: $KSUVERSION"
            fi
          }
          # Install Selected Root Engine
          echo "🚀 Setting Up $ROOTENGINE..."
          setupengine \
            "$KSUREPO" "$SETUPBRANCH" \
            "$SETUPARGUMENT" "$ROOTCOMMIT"
          checkoutrootcommit "$ROOTDIR" "$ROOTCOMMIT"
          cd "$ROOTDIR"
          recordrootversion
          configureksuversionfallback
          # Configure Engine-Specific Options
          case "$ROOTENGINE" in
            BakaSU)
              DEFCONFIG="$SOURCEDIR/arch/arm64/configs/gki_defconfig"
              if [[ -f "$DEFCONFIG" ]]; then
                sed -i '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG"
                printf '%s\n' \
                  'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"' \
                  >> "$DEFCONFIG"
              fi
              ;;
            KernelSU-Next)
              if [[ "$SUSFS" != "-1" &&
                    -f kernel/supercall/dispatch.c ]]; then
                perl -0777 -i -pe '
                  s/#ifdef CONFIG_HAVE_SYSCALL_TRACEPOINTS.*?#endif/
                  strscpy(cmd.mode, "Inline", sizeof(cmd.mode));
                  /s
                ' kernel/supercall/dispatch.c
                echo "✔️ SUSFS Hook Mode Set to Inline"
              fi
              ;;
          esac
          # Export Root Engine Outputs
          {
            echo "ksuversion=$KSUVERSION"
            echo "managertag=$MANAGERTAG"
            echo "rootcommit=$ROOTCOMMITSHORT"
            echo "rootcommitfull=$ROOTCOMMIT"
          } >> "$GITHUB_OUTPUT"
          echo "------------------------------"
          echo "🎉 Root Engine Configuration Complete"
          echo "📦 Engine      : $ROOTENGINE"
          echo "📂 Repository  : $KSUREPO"
          echo "🔖 Commit      : $ROOTCOMMITSHORT"
          echo "🔢 KSU Version : $KSUVERSION"
          echo "------------------------------"

      - name: 📲 SUSFS Integration
        if: ${{ inputs.ROOTENGINE != 'None' && inputs.SUSFSENGINE }}
        shell: bash
        run: |
          # Define SUSFS Paths
          SUSFSKERNEL="${WORKDIR}/susfs"
          SUSFSREPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFSMIRROR="https://github.com/AndreiMikh/susfs4ksu.git"
          # Resolve SUSFS Branch
          SUSFSBRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
          SUSFS50PATCH="${SUSFSKERNEL}/kernel_patches/50_add_susfs_in_${SUSFSBRANCH}.patch"
          # Display SUSFS Configuration
          echo "🔧 SUSFS Integration"
          echo "📌 Kernel Module    : ${KERNELMODULE}"
          echo "📌 Android Version  : ${ANDROIDVERSION}"
          echo "📌 Kernel Version   : ${KERNELVERSION}"
          echo "📌 SUSFS Repository : ${SUSFSREPO}"
          echo "📌 SUSFS Branch     : ${SUSFSBRANCH}"
          echo "📌 Kernel Source    : ${SOURCEDIR}"
          # Clone SUSFS with Retry and GitHub Mirror Fallback
          echo "📥 Cloning SUSFS..."
          rm -rf "${SUSFSKERNEL}"
          SUSFSCLONED=false
          for attempt in {1..5}; do
            if git clone \
              --depth 1 \
              --branch "${SUSFSBRANCH}" \
              "${SUSFSREPO}" \
              "${SUSFSKERNEL}"; then
              echo "✔️ SUSFS Cloned Successfully from GitLab"
              SUSFSCLONED=true
              break
            fi

            rm -rf "${SUSFSKERNEL}"
            if [[ "$attempt" -lt 5 ]]; then
              echo "⚠️ GitLab Clone Failed (Attempt ${attempt}/5)"
              sleep $((attempt * 10))
            fi
          done

          if [[ "${SUSFSCLONED}" != "true" ]]; then
            echo "⚠️ GitLab Unavailable, Trying GitHub Mirror..."
            if git clone \
              --depth 1 \
              --branch "${SUSFSBRANCH}" \
              "${SUSFSMIRROR}" \
              "${SUSFSKERNEL}"; then
              echo "✔️ SUSFS Cloned Successfully from GitHub Mirror"
              SUSFSCLONED=true
            fi
          fi

          if [[ "${SUSFSCLONED}" != "true" ]]; then
            echo "⚠️ Failed to Clone SUSFS from GitLab and GitHub"
            echo "📌 Branch        : ${SUSFSBRANCH}"
            echo "📌 GitLab        : ${SUSFSREPO}"
            echo "📌 GitHub Mirror : ${SUSFSMIRROR}"
            exit 1
          fi

          # Resolve SUSFS Commit
          SUSFSCOMMIT="$(git -C "${SUSFSKERNEL}" rev-parse HEAD 2>/dev/null || echo Unknown)"
          SUSFSSHORT="$(git -C "${SUSFSKERNEL}" rev-parse --short HEAD 2>/dev/null || echo Unknown)"
          echo "📌 SUSFS Commit   : ${SUSFSSHORT}"
          echo "📌 SUSFS Revision : ${SUSFSCOMMIT}"
          # Define SUSFS Source Paths
          SUSFSDIR="${SUSFSKERNEL}/kernel_patches"
          SUSFSFS="${SUSFSDIR}/fs"
          SUSFSINCLUDE="${SUSFSDIR}/include/linux"
          # Validate SUSFS Source Layout and Patch
          echo "🔎 Checking SUSFS Source Layout..."
          if [[ ! -d "${SUSFSFS}" ]]; then
            echo "⚠️ SUSFS fs Directory Was Not Found"
            echo "📂 Creating : ${SUSFSFS}"
            mkdir -p "${SUSFSFS}"
          fi

          if [[ ! -d "${SUSFSINCLUDE}" ]]; then
            echo "⚠️ SUSFS include/linux Directory Was Not Found"
            echo "📂 Creating: ${SUSFSINCLUDE}"
            mkdir -p "${SUSFSINCLUDE}"
          fi

          echo "✔️ SUSFS Source Layout Verified"
          if [[ ! -f "${SUSFS50PATCH}" ]]; then
            echo "⚠️ SUSFS 50 Patch Was Not Found :"
            echo "${SUSFS50PATCH}"
            exit 1
          fi

          echo "✔️ SUSFS Source Patch Found"
          echo "📌 SUSFS FS      : ${SUSFSFS}"
          echo "📌 SUSFS Headers : ${SUSFSINCLUDE}"
          echo "📌 SUSFS Patch   : ${SUSFS50PATCH}"
          # Copy SUSFS Files
          echo "📥 Copying SUSFS Files..."
          cp -r "${SUSFSFS}/"* "${SOURCEDIR}/fs/" || {
            echo "⚠️ Failed to Copy SUSFS FS Files"
            exit 1
          }
          cp -r "${SUSFSINCLUDE}/"* "${SOURCEDIR}/include/linux/" || {
            echo "⚠️ Failed to Copy SUSFS Linux Headers"
            exit 1
          }
          echo "✔️ SUSFS Files Copied"
          # Copy SUSFS Patch
          echo "📥 Copying SUSFS 50 Patch..."
          cp "${SUSFS50PATCH}" "${SOURCEDIR}/" || {
            echo "⚠️ Failed to Copy SUSFS 50 Patch"
            exit 1
          }
          echo "✔️ SUSFS 50 Patch Copied"
          # Apply SUSFS 50 Patch
          echo "🔧 Applying SUSFS 50 Patch..."
          cd "$SOURCEDIR"
          if patch \
            -p1 \
            -F3 \
            --batch \
            -f \
            < "${SUSFS50PATCH}"; then
            echo "✔️ SUSFS 50 Patch Applied Successfully"
          else
            echo "⚠️ SUSFS 50 Patch Failed"
            echo "📌 SUSFS Commit : ${SUSFSSHORT}"
            echo "📌 Patch        : ${SUSFS50PATCH}"
            exit 1
          fi

          # Load Reject Checker
          source "$REJECTCHECKER"
          checkrejects .
          # Display SUSFS Result
          echo "🎉 SUSFS Integration Complete"
          echo "📌 Kernel Module : ${KERNELMODULE}"
          echo "📌 SUSFS Branch  : ${SUSFSBRANCH}"
          echo "📌 SUSFS Commit  : ${SUSFSSHORT}"
          echo "📌 SUSFS Source  : ${SUSFSKERNEL}"
          echo "📌 SUSFS Patch   : ${SUSFS50PATCH}"
   
      - name: 🔧 LZ4 Upgrade + Neon
        if: ${{ inputs.NEONLZ4UPDATE }}
        shell: bash
        run: |
          # Define LZ4 Patch Type and Paths
          PDIR="${WORKDIR}/AndreiMikh-Kernel-Lab/scripts"
          SCRIPT="${PDIR}/LZ4-Upgrade.sh"
          echo "🚀 LZ4 1.10.0 + Neon Patch Update"
          echo "📂 Kernel Source : ${SOURCEDIR}"
          # Validate LZ4 Update Script
          if [[ ! -f "$SCRIPT" ]]; then
            echo "⚠️ LZ4 Update Script Not Found :"
            echo "$SCRIPT"
            exit 1
          fi

          # Move Into Kernel Source Directory
          cd "$SOURCEDIR"
          # Execute LZ4 Update Script
          echo "🚀 Running LZ4 Patch Update Script..."
          bash "$SCRIPT"
          echo "✔️ LZ4 Update Script Completed"
          # Load Reject Checker
          source "$REJECTCHECKER"
          checkrejects .
          # Display LZ4 Result
          echo "🎉 LZ4 1.10.0 + Neon Patch Update Completed"
          echo "📂 Kernel Source : ${SOURCEDIR}"
    
      - name: 🔧 Integrate Linux Security Module Baseband Guard
        if: ${{ inputs.BBG }}
        shell: bash
        run: |
          MAXRETRIES=3
          cd "$SOURCEDIR"
          echo "🔧 Baseband Guard Integration"
          echo "📌 Source : VC-Teahouse/Baseband-guard"
          echo "📌 Kernel : $SOURCEDIR"
          # Download and Execute Baseband Guard Setup
          URLBBG="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          echo "📥 Fetching BBG Setup Script..."
          BBGAPPLIED=false
          for i in $(seq 1 "$MAXRETRIES"); do
            if curl -fsSL "$URLBBG" | bash -s -- main; then
              BBGAPPLIED=true
              break
            fi

            echo "⚠️ BBG Setup Failed"
            echo "🔁 Retry $i/$MAXRETRIES..."
            if [ "$i" -lt "$MAXRETRIES" ]; then
              sleep 2
            fi
          done

          if [ "$BBGAPPLIED" != "true" ]; then
            echo "⚠️ Failed to Apply BBG"
            exit 1
          fi

          echo "🎉 BBG Setup Completed"
          # Locate Baseband Guard Source
          echo "🔎 Locating Baseband Guard Source..."
          BBGPATHDIR=""
          if [ -d "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$SOURCEDIR/Baseband-guard"
          elif [ -L "$SOURCEDIR/Baseband-guard" ]; then
            BBGPATHDIR="$(readlink -f "$SOURCEDIR/Baseband-guard")"
          else
            BBGPATHDIR="$(
              find "$SOURCEDIR" \
                -maxdepth 3 \
                -type d \
                -name "Baseband-guard" \
                -print \
                -quit
            )"
          fi

          if [ -z "$BBGPATHDIR" ] || [ ! -d "$BBGPATHDIR" ]; then
            echo "⚠️ Baseband Guard Directory Not Found"
            exit 1
          fi

          echo "📂 BBG Directory :"
          echo "$BBGPATHDIR"
          # Validate Baseband Guard Source
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ BBG Source Not Found"
            echo "📂 BBG Contents :"
            ls -la "$BBGPATHDIR"
            exit 1
          fi

          echo "✔️ Baseband Guard Source Detected"
          # Validate Linux Security Kconfig
          BBGCONFIGFILE="$SOURCEDIR/security/Kconfig"
          if [ ! -f "$BBGCONFIGFILE" ]; then
            echo "⚠️ Linux Security Kconfig Not Found :"
            echo "$BBGCONFIGFILE"
            exit 1
          fi

          # Add Baseband Guard to LSM Default List
          echo "⚙️ Updating Linux Security Module Configuration..."
          if grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "ℹ️ Baseband Guard Already Present"
          else
            awk '
              /^config LSM$/ {
                in_lsm=1
              }
              in_lsm && /^[[:space:]]*default[[:space:]]/ {
                if ($0 ~ /selinux/ && $0 !~ /baseband_guard/) {
                  sub(/selinux/, "selinux,baseband_guard")
                }
              }
              in_lsm && /^config[[:space:]]/ && $0 !~ /^config LSM$/ {
                in_lsm=0
              }
              {
                print
              }
            ' "$BBGCONFIGFILE" > "$BBGCONFIGFILE.tmp"
            mv -f \
              "$BBGCONFIGFILE.tmp" \
              "$BBGCONFIGFILE"
            echo "✔️ Linux Security Configuration Updated"
          fi

          # Enable Baseband Guard If Kernel Config Already Exists
          if [ -f "$SOURCEDIR/.config" ]; then
            echo "⚙️ Enabling CONFIG BBG..."
            ./scripts/config \
              --file "$SOURCEDIR/.config" \
              -e CONFIG_BBG
            echo "✔️ CONFIG BBG Enabled"
          else
            echo "ℹ️ Kernel Config Not Present Yet"
            echo "ℹ️ CONFIG BBG Will Be Resolved During Kernel Configuration"
          fi

          # Final Validation
          echo "🔎 Validating Baseband Guard Integration..."
          if [ ! -f "$BBGPATHDIR/baseband_guard.c" ]; then
            echo "⚠️ Baseband Guard Source Validation Failed"
            exit 1
          fi

          if ! grep -qF "baseband_guard" "$BBGCONFIGFILE"; then
            echo "⚠️ Baseband Guard Was Not Added To Security/Kconfig"
            exit 1
          fi

          echo "✔️ Baseband Guard Source  : OK"
          echo "✔️ Baseband Guard Kconfig : OK"
          echo "🎉 Baseband Guard Fully Integrated"   
      
      - name: 🔧 ReKernel Integration
        if: ${{ inputs.REKERNEL }}
        shell: bash
        run: |
          RKREPODIR="${WORKDIR}/ReKernel"
          RKSRCDIR="${RKREPODIR}/LKM-Source"
          RKTARGETDIR="${SOURCEDIR}/drivers/rekernel"
          DRIVERSDIR="${SOURCEDIR}/drivers"
          KCONFIGFILE="${DRIVERSDIR}/Kconfig"
          MAKEFILE="${DRIVERSDIR}/Makefile"
          echo "🔧 ReKernel Integration"
          if [[ ! -d "$SOURCEDIR" || ! -f "$SOURCEDIR/Makefile" ]]; then
            echo "⚠️ Kernel Source Directory Not Found: ${SOURCEDIR}"
            exit 1
          fi

          if [[ ! -f "$KCONFIGFILE" || ! -f "$MAKEFILE" ]]; then
            echo "⚠️ Kernel Drivers Build Files Not Found"
            exit 1
          fi

          if [[ ! -d "$RKREPODIR/.git" ]]; then
            echo "└─ 📥 Cloning ReKernel..."
            git clone --depth=1 \
              https://github.com/Sakion-Team/Re-Kernel.git \
              "$RKREPODIR"
          else
            echo "└─ ℹ️ ReKernel Repository Already Exists"
          fi

          for FILE in Kconfig Makefile; do
            if [[ ! -s "${RKSRCDIR}/${FILE}" ]]; then
              echo "⚠️ ReKernel Source File Missing : ${RKSRCDIR}/${FILE}"
              exit 1
            fi
          done

          echo "└─ 📂 Source: ${RKSRCDIR}"
          if ! grep -qF 'source "drivers/rekernel/Kconfig"' "$KCONFIGFILE"; then
            python3 - "$KCONFIGFILE" <<'PY'
          import pathlib
          import re
          import sys
          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          if 'source "drivers/rekernel/Kconfig"' not in content:
              matches = list(re.finditer(r"(?m)^endmenu[ \t]*$", content))
              if not matches:
                  raise SystemExit("⚠️ No endmenu found in drivers/Kconfig")
              match = matches[-1]
              content = (
                  content[:match.start()]
                  + 'source "drivers/rekernel/Kconfig"\n\n'
                  + content[match.start():]
              )
              path.write_text(content)
          PY
          fi

          if ! grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$MAKEFILE"; then
            printf '\nobj-$(CONFIG_REKERNEL) += rekernel/\n' >> "$MAKEFILE"
          fi

          echo "└─ ♻️ Synchronizing ReKernel Source..."
          rm -rf "$RKTARGETDIR"
          mkdir -p "$RKTARGETDIR"
          cp -a "${RKSRCDIR}/." "$RKTARGETDIR/"
          for FILE in Kconfig Makefile; do
            if [[ ! -s "${RKTARGETDIR}/${FILE}" ]]; then
              echo "⚠️ ReKernel Integration File Missing : ${FILE}"
              exit 1
            fi
          done

          grep -qF 'source "drivers/rekernel/Kconfig"' "$KCONFIGFILE"
          grep -qF 'obj-$(CONFIG_REKERNEL) += rekernel/' "$MAKEFILE"
          echo "└─ ✔️ ReKernel Source Synced"
          echo "└─ ✔️ Kconfig Integrated"
          echo "└─ ✔️ Makefile Integrated"
          echo "└─ 🎉 ReKernel Integration Complete"

      - name: 🔧 NoMount Built-in Integration
        if: ${{ inputs.NOMOUNT != 'None' }}
        shell: bash
        run: |
          echo "🔧 NoMount Built-in Integration"
          NOMOUNTSOURCE="${SOURCEDIR}"
          NOMOUNTBRANCH="${{ inputs.NOMOUNT }}"
          echo "📂 Kernel Source  : ${NOMOUNTSOURCE}"
          echo "📌 NoMount Branch : ${NOMOUNTBRANCH}"
          # Verify Kernel Source
          if [ ! -d "$NOMOUNTSOURCE" ]; then
            echo "⚠️ Kernel Source Directory Not Found"
            echo "📂 Expected     : $NOMOUNTSOURCE"
            exit 1
          fi

          # Verify Kernel Filesystem Directory
          if [ ! -d "$NOMOUNTSOURCE/fs" ]; then
            echo "⚠️ Kernel Filesystem Directory Not Found"
            echo "📂 Expected     : $NOMOUNTSOURCE/fs"
            exit 1
          fi

          cd "$NOMOUNTSOURCE"
          echo "📥 Integrating NoMount Into Kernel Source..."
          case "$NOMOUNTBRANCH" in
            Master)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : master"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -
              ;;
            Dev)
              NOMOUNTURL="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
              echo "📌 Repository : maxsteeel/nomount"
              echo "🌿 Branch     : dev"
              curl -fsSL \
                "$NOMOUNTURL" |
                bash -s -- dev
              ;;
            *)
              echo "⚠️ Unsupported NoMount Selection : $NOMOUNTBRANCH"
              exit 1
              ;;
          esac
          echo "✔️ NoMount Setup Script Completed"
          # Validate NoMount Source
          if [ ! -d "$NOMOUNTSOURCE/fs/nomount" ]; then
            echo "⚠️ NoMount Source Directory Not Found"
            echo "📂 Expected : $NOMOUNTSOURCE/fs/nomount"
            exit 1
          fi

          echo "📂 NoMount Source :"
          ls -la "$NOMOUNTSOURCE/fs/nomount"
          echo "🔎 Verifying NoMount Kernel Integration..."
          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Kconfig" ]; then
            echo "⚠️ NoMount Kconfig Not Found"
            exit 1
          fi

          if [ ! -f "$NOMOUNTSOURCE/fs/nomount/Makefile" ]; then
            echo "⚠️ NoMount Makefile Not Found"
            exit 1
          fi

          if ! grep -qF 'nomount' "$NOMOUNTSOURCE/fs/Kconfig"; then
            echo "⚠️ NoMount Kconfig Is Not Included From fs/Kconfig"
            exit 1
          fi

          if ! grep -qF 'nomount/' "$NOMOUNTSOURCE/fs/Makefile"; then
            echo "⚠️ NoMount Makefile Is Not Included From fs/Makefile"
            exit 1
          fi

          echo "✔️ NoMount Kconfig Integration Verified"
          echo "✔️ NoMount Makefile Integration Verified"
          echo "✔️ NoMount Source Integration Verified"
          echo "🎉 NoMount Built-in Integration Complete"

      - name: 🛠️ Configure Kbuild Build Metadata
        shell: bash
        run: |
          # Resolve Build Timestamp Input
          TIMEINPUT="${{ inputs.KERNELBUILDTIME }}"
          if [[ -n "$TIMEINPUT" ]]; then
            DATESTR="$TIMEINPUT"
            echo "🔎 Using Custom Build Time : $DATESTR"
          else
            DATESTR="$(TZ='UTC' date '+%a %b %-d %H:%M:%S UTC %Y')"
            echo "🛠️ Using Current UTC Time : $DATESTR"
          fi

          # Validate Build Timestamp Format
          if ! date -d "$DATESTR" >/dev/null 2>&1; then
            echo "⚠️ Invalid Build Time"
            echo "📌 Value    : $DATESTR"
            echo "📌 Expected : <Day> <Month> <DD> <HH:MM:SS> UTC <YYYY>"
            exit 1
          fi

          # Configure Kbuild Build Metadata
          export KBUILD_BUILD_TIMESTAMP="$DATESTR"
          export KBUILD_BUILD_VERSION="1"
          # Export Kbuild Metadata To Following Workflow Steps
          {
            echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
          } >> "$GITHUB_ENV"
          # Display Build Metadata
          echo "🔍 Kbuild Build Metadata"
          echo "📌 Build Timestamp : $KBUILD_BUILD_TIMESTAMP"
          echo "📌 Build Version   : $KBUILD_BUILD_VERSION"
          echo "📌 Android Base    : $ANDROIDVERSION"
          echo "📌 Kernel Base     : $KERNELVERSION"
          echo "📌 Kernel Version  : $FULLVERSION"
          # Validate Kbuild Metadata
          if [[ -z "${KBUILD_BUILD_TIMESTAMP:-}" ]]; then
            echo "⚠️ Kbuild Build Timestamp Not Set"
            exit 1
          fi

          if [[ -z "${KBUILD_BUILD_VERSION:-}" ]]; then
            echo "⚠️ Kbuild Build Version Not Set"
            exit 1
          fi
          
          echo "🎉 Kbuild Build Metadata Configured"
     
      - name: 🔨 Build Kernel
        if: ${{ !inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          # Configure Kernel Build Environment
          sudo sysctl -w vm.max_map_count=1048576
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="${{ inputs.GITOWNER }}"
          export KBUILD_BUILD_HOST="${{ inputs.GITHOST }}"
          # Configure CCache Debug Logging
          if [[ "${{ inputs.DEBUGBUILDCCACHE }}" == "true" ]]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi

          # Validate Kbuild Build Metadata
          if [[ -z "${KBUILD_BUILD_TIMESTAMP:-}" ]]; then
            echo "⚠️ Kbuild Build Timestamp Not Set"
            exit 1
          fi

          if [[ -z "${KBUILD_BUILD_VERSION:-}" ]]; then
            echo "⚠️ Kbuild Build Version Not Set"
            exit 1
          fi

          echo "🔍 Kbuild Build Metadata"
          echo "📌 Build Time    : $KBUILD_BUILD_TIMESTAMP"
          echo "📌 Build Version : $KBUILD_BUILD_VERSION"
          echo "📌 Build User    : $KBUILD_BUILD_USER"
          echo "📌 Build Host    : $KBUILD_BUILD_HOST"
          # Define Fake Time Environment
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          # Define Build Paths
          LIBDIR="$LABDIR/lib"
          CCWRAPPER="$GITHUB_WORKSPACE/cc-wrapper"
          LDWRAPPER="$GITHUB_WORKSPACE/ld-wrapper"
          export PRELOAD_LIBS="$LIBDIR/libfakestat.so:$LIBDIR/libfaketimeMT.so"
          # Validate Build Tools
          echo "🔎 Validating Build Tools..."
          command -v clang >/dev/null || {
            echo "⚠️ clang Not Found"
            exit 1
          }
          command -v ld.lld >/dev/null || {
            echo "⚠️ ld.lld Not Found"
            exit 1
          }
          command -v ccache >/dev/null || {
            echo "⚠️ ccache Not Found"
            exit 1
          }
          # Validate Fake Time Libraries
          if [[ ! -f "$LIBDIR/libfakestat.so" ||
                ! -f "$LIBDIR/libfaketimeMT.so" ]]; then
            echo "⚠️ Fake Time Libraries Not Found"
            echo "📂 Library Directory : $LIBDIR"
            exit 1
          fi

          # Prepare Fake Time Libraries
          chmod 755 \
            "$LIBDIR/libfakestat.so" \
            "$LIBDIR/libfaketimeMT.so"
          # Create Clang Wrapper
          cd "$GITHUB_WORKSPACE"
          cat > "$CCWRAPPER" <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ccache clang "\$@"
          EOF
          # Create LLD Wrapper
          cat > "$LDWRAPPER" <<EOF
          #!/bin/bash
          export LD_PRELOAD="$PRELOAD_LIBS"
          export FAKESTAT="$FAKESTAT"
          export FAKETIME="$FAKETIME"
          exec ld.lld "\$@"
          EOF
          chmod +x "$CCWRAPPER" "$LDWRAPPER"
          # Validate Wrappers
          "$CCWRAPPER" --version >/dev/null
          "$LDWRAPPER" --version >/dev/null
          # Display Build Environment
          echo "🔧 Build Environment"
          echo "📌 LLVM         : $LLVM"
          echo "📌 LLVM IAS     : $LLVM_IAS"
          echo "📌 Architecture : arm64"
          echo "📌 Build User   : $KBUILD_BUILD_USER"
          echo "📌 Build Host   : $KBUILD_BUILD_HOST"
          echo "📌 Fake Stat    : $FAKESTAT"
          echo "📌 Fake Time    : $FAKETIME"
          echo "📌 Clang        : $(clang --version | sed -n '1p')"
          echo "📌 LLD          : $(ld.lld --version | sed -n '1p')"
          echo "📌 CCache       : $(ccache --version | sed -n '1p')"
          # Move Into Kernel Source
          cd "$SOURCEDIR"
          # Validate Kernel Source
          if [[ ! -f "Makefile" ]]; then
            echo "⚠️ Kernel Makefile Not Found"
            echo "📂 Expected   : $SOURCEDIR/Makefile"
            exit 1
          fi

          # Validate Kernel Configuration
          if [[ ! -f ".config" ]]; then
            echo "⚠️ Kernel Configuration Not Found"
            echo "📂 Expected   : $SOURCEDIR/.config"
            exit 1
          fi

          # Configure Final Kernel Configuration
          echo "🔧 Configuring Final Kernel Configuration..."
          # Root Engine
          if [ "${{ inputs.ROOTENGINE }}" = "None" ]; then
            echo "🚫 KSU Disabled"
            ./scripts/config --file .config \
              -d CONFIG_KSU \
              -d CONFIG_KSU_SUSFS
          else
            echo "✔️ KSU Enabled"
            ./scripts/config --file .config \
              -e CONFIG_KSU
            # KSU Full Name Format
            ./scripts/config --file .config \
              --set-str CONFIG_KSU_FULL_NAME_FORMAT "%TAG_NAME%"
            echo "✔️ KSU Full Name Format : %TAG_NAME%"
            # SUSFS Integration
            if [ "${{ inputs.SUSFSENGINE }}" = "true" ]; then
              echo "✔️ KSU SUSFS Enabled"
              ./scripts/config --file .config \
                -e CONFIG_KSU_SUSFS
            else
              echo "🚫 KSU SUSFS Disabled"
              ./scripts/config --file .config \
                -d CONFIG_KSU_SUSFS
            fi
          fi

          # BetterNetwork / Netfilter
          if [ "${{ inputs.BETTERNET }}" != "true" ]; then
            echo "🚫 BetterNetwork / Netfilter Disabled"
            ./scripts/config --file .config \
              -d CONFIG_IP_SET \
              -d CONFIG_BPF_STREAM_PARSER \
              -d CONFIG_IP6_NF_NAT
          else
            echo "✔️ Better Network / Netfilter Enabled"
          fi

          # BBR TCP Congestion Control
          if [ "${{ inputs.BBR }}" = "true" ]; then
            echo "✔️ BBR TCP Congestion Control Enabled"
            ./scripts/config --file .config \
              -e CONFIG_TCP_CONG_ADVANCED \
              -e CONFIG_TCP_CONG_BBR
          fi

          # ReKernel Binder Hook
          if [ "${{ inputs.REKERNEL }}" = "true" ]; then
            echo "✔️ ReKernel Binder Hook Enabled"
            ./scripts/config --file .config \
              -e CONFIG_REKERNEL
          fi

          # NoMount Integration
          if [ "${{ inputs.NOMOUNT }}" = "None" ]; then
            echo "🚫 NoMount Integration Disabled"
            ./scripts/config --file .config \
              -d CONFIG_NOMOUNT
          else
            echo "✔️ NoMount Integration Enabled"
            ./scripts/config --file .config \
              -e CONFIG_NOMOUNT
          fi

          # Synchronize Final Kernel Configuration
          echo "🔄 Running Old DefConfig..."
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            olddefconfig
          # Display Final KSU Configuration
          echo "🔎 Final Root Engine and SUSFS Configuration"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_FULL_NAME_FORMAT)=' \
            .config || true
          # Display Final DroidSpaces Configuration
          echo "🔎 Final DroidSpaces / NTSync / EVDI Configuration"
          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_NTSYNC|CONFIG_DRM_LINDROID_EVDI)=' \
            .config || true
          # Display Final Network Configuration
          echo "🔎 Final Network Configuration"
          grep -E \
            '^(CONFIG_IP_SET|CONFIG_BPF_STREAM_PARSER|CONFIG_IP6_NF_NAT|CONFIG_TCP_CONG_ADVANCED|CONFIG_TCP_CONG_BBR)=' \
            .config || true
          # Display Final ReKernel Configuration
          echo "🔎 Final ReKernel Binder Hook Configuration"
          grep '^CONFIG_REKERNEL=' .config || true
          # Display Final NoMount Configuration
          echo "🔎 Final NoMount Configuration"
          grep '^CONFIG_NOMOUNT=' .config || true
          # Display Final Local Version
          echo "🔎 Final Local Version"
          grep '^CONFIG_LOCALVERSION=' .config || true
          echo "🎉 Final Kernel Configuration Complete"
          # Start Build Timer
          BUILDSTART="$(date +%s)"
          # Build Kernel Image
          echo "🔨 Building Kernel Image..."
          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CC="$CCWRAPPER" \
            LD="$LDWRAPPER" \
            HOSTLD="$LDWRAPPER" \
            KCFLAGS+=-O2 \
            -j"$(nproc --all)" \
            Image
          # Calculate Build Duration
          BUILDEND="$(date +%s)"
          BUILDTIME="$((BUILDEND - BUILDSTART))"
          # Display CCache Status
          echo "📊 CCache Status :"
          ccache -s
          # Validate Kernel Image
          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected : $IMAGE"
            exit 1
          fi

          # Display Build Result
          echo "📦 Kernel Image :"
          ls -lh "$IMAGE"
          echo "⏱️ Build Duration : ${BUILDTIME}s"
          echo "🎉 Kernel Build Complete"
          # Generate GitHub Actions Build Summary
          CCACHESUMMARY="$(ccache -s 2>&1)"
          {
            echo "## 🧠 Compiler Cache Performance Summary"
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Build Status | 🚀 Success |"
            echo "| Build Time | **${BUILDTIME}s** |"
            echo "| Cacheable Calls | $(echo "$CCACHESUMMARY" | grep "Cacheable calls:" | sed 's/.*Cacheable calls:[[:space:]]*//') |"
            echo "| Cache Hits | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Hits:" | head -n1 | sed 's/.*Hits:[[:space:]]*//') |"
            echo "| Direct Hits | $(echo "$CCACHESUMMARY" | grep "Direct:" | sed 's/.*Direct:[[:space:]]*//') |"
            echo "| Preprocessed Hits | $(echo "$CCACHESUMMARY" | grep "Preprocessed:" | sed 's/.*Preprocessed:[[:space:]]*//') |"
            echo "| Cache Misses | $(echo "$CCACHESUMMARY" | grep -E "^[[:space:]]*Misses:" | head -n1 | sed 's/.*Misses:[[:space:]]*//') |"
            echo "| Uncacheable Calls | $(echo "$CCACHESUMMARY" | grep "Uncacheable calls:" | sed 's/.*Uncacheable calls:[[:space:]]*//') |"
            echo "| Cache Size | $(echo "$CCACHESUMMARY" | grep "Cache size" | sed 's/.*Cache size (GB):[[:space:]]*//') |"
            echo "### ⚡ Build Result"
            echo "**🎉 Build Completed Successfully**"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: 🧪 Create Debug Dummy Image
        if: ${{ inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          # Define Kernel Image
          IMAGE="$SOURCEDIR/arch/arm64/boot/Image"
          # Prepare Kernel Image Directory
          mkdir -p "$(dirname "$IMAGE")"
          # Create Dummy Kernel Image
          printf '%s\n' "DEBUG DUMMY IMAGE" > "$IMAGE"
          # Validate Dummy Kernel Image
          SIZE="$(stat -c%s "$IMAGE")"
          echo "🧪 Debug Mode  : Kernel Build Skipped"
          echo "📂 Dummy Image : $IMAGE"
          echo "📦 Image Size  : ${SIZE} Bytes"
          if [[ "$SIZE" -le 0 ]]; then
            echo "⚠️ Failed to Create Dummy Image"
            exit 1
          fi
      
          echo "🎉 Dummy Image Created Successfully"   
      
      - name: 🔎 Verify Kernel Build Metadata
        id: kernelverify
        shell: bash
        run: |
          # Enter Kernel Source Directory
          cd "$SOURCEDIR"
          # Display Expected Kernel Build Metadata
          echo "🔎 Verifying Kernel Build Metadata..."
          echo "📌 Expected Kernel Version : $FULLVERSION"
          echo "📌 Expected Build Time     : $KBUILD_BUILD_TIMESTAMP"
          # Define Kernel Image and UTS Header
          IMAGE="arch/arm64/boot/Image"
          UTSHEADER="include/generated/utsversion.h"
          # Validate Kernel Image
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected : $SOURCEDIR/$IMAGE"
            exit 1
          fi

          # Validate Generated UTS Header
          if [[ ! -f "$UTSHEADER" ]]; then
            echo "⚠️ UTS Version Header Not Found"
            echo "📂 Expected : $SOURCEDIR/$UTSHEADER"
            exit 1
          fi

          # Read UTS Version From Generated Header
          UTSVERSION="$(
            sed -n \
              's/^#define UTS_VERSION "\(.*\)"/\1/p' \
              "$UTSHEADER" |
              sed -n '1p'
          )"
          # Validate UTS Version
          if [[ -z "$UTSVERSION" ]]; then
            echo "⚠️ UTS Version Not Found"
            exit 1
          fi

          echo "📌 Kernel UTS Version : $UTSVERSION"
          # Verify Configured Build Timestamp
          if [[ "$UTSVERSION" == *"$KBUILD_BUILD_TIMESTAMP"* ]]; then
            echo "✔️ Kernel Build Timestamp Matches"
          else
            echo "⚠️ Kernel Build Timestamp Does Not Match"
            echo "📌 Expected : $KBUILD_BUILD_TIMESTAMP"
            echo "📌 Found    : $UTSVERSION"
            exit 1
          fi

          # Export UTS Version For Following Workflow Steps
          echo "utsversion=$UTSVERSION" >> "$GITHUB_OUTPUT"
          echo "🎉 Kernel Build Metadata Verified"      
    
      - name: 🧩 Patch Kernel with KP-Next
        if: ${{ inputs.KERNELPATCH && !inputs.DEBUGKERNELBUILD }}
        shell: bash
        run: |
          cd "$SOURCEDIR/arch/arm64/boot"
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux \
            -O kptools-linux
          wget -q \
            https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux \
            -O kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux \
            -p \
            -i Image \
            -k kpimg-linux \
            -o oImage
          mv -f oImage Image
          rm -f kptools-linux kpimg-linux
          echo "🎉 KPM Patched"
  
      - name: 💾 Save GitHub CCache
        if: ${{ inputs.BUILDCCACHE }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: CCache-SM8750-${{ inputs.AOSPSOURCE }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}
  
      - name: 📦 Upload Public CCache
        if: ${{ inputs.BUILDCCACHE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        shell: bash
        run: |
          echo "📦 Packaging Public CCache..."
          echo "📂 CCache Directory : $CCACHE_DIR"
          ccache -s || true
          echo "🗜️ Creating Public CCache Archive..."
          tar -I 'zstd -T0 -5' \
            -cf CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            -C "$CCACHE_DIR" .
          echo "📦 Archive Size : $(du -sh CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst | cut -f1)"
          echo "🚀 Uploading Public CCache..."
          if gh release create \
            "CCache-SM8750-${{ inputs.AOSPSOURCE }}" \
            CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            --notes 'Category : CCache | SM8750-O2-FT — Public CCache for OPlus AOSP SM8750 Kernel Builds'; then
            echo "✔️ Public CCache Release Created"
          elif gh release upload \
            "CCache-SM8750-${{ inputs.AOSPSOURCE }}" \
            CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst \
            --clobber; then
            echo "✔️ Public CCache Release Updated"
          else
            echo "⚠️ Failed to Upload Public CCache"
            exit 1
          fi
          rm -f CCache-SM8750-${{ inputs.AOSPSOURCE }}.tar.zst
          echo "🎉 Public CCache Uploaded Successfully"
   
      - name: 🐞 Upload CCache Debug Log
        if: ${{ inputs.DEBUGBUILDCCACHE }}
        uses: actions/upload-artifact@v6
        with:
          name: CCache-Debug-Log
          path: ccache.log
          if-no-files-found: ignore
   
      - name: 📦 Clone and Package AnyKernel3
        id: package
        shell: bash
        run: |
          # Define AnyKernel3 Paths
          AK3DIR="${GITHUB_WORKSPACE}/anykernel3"
          PACKDIR="${GITHUB_WORKSPACE}/pack"
          OUTDIR="${GITHUB_WORKSPACE}/out"
          IMAGE="${SOURCEDIR}/arch/arm64/boot/Image"
          # Define Android Source
          AOSPSOURCE="${{ inputs.AOSPSOURCE }}"
          # Define Source Branches
          LINEAGEBRANCH=""
          CRDROIDBRANCH=""
          CRDROIDDEVICE=""
          case "$AOSPSOURCE" in
            Lineage)
              LINEAGEBRANCH="lineage-24.0"
              ;;
            CrDroid)
              CRDROIDBRANCH="17.0"
              CRDROIDDEVICE="dodge"
              ;;
          esac
          # Define Security Patch Metadata
          RELEASEPATCH="${RUNNER_TEMP}/RELEASE_PLATFORM_SECURITY_PATCH.textproto"
          CRDROIDPATCH="${RUNNER_TEMP}/crDroidOTA.json"
          # Display Package Configuration
          echo "📦 AnyKernel3 Packaging"
          echo "📂 Kernel Source      : ${SOURCEDIR}"
          echo "📂 AnyKernel3         : ${AK3DIR}"
          echo "📂 Package Directory  : ${PACKDIR}"
          echo "📂 Output Directory   : ${OUTDIR}"
          echo "📌 Android Source     : ${AOSPSOURCE}"
          if [[ -n "$LINEAGEBRANCH" ]]; then
            echo "📌 LineageOS Branch : ${LINEAGEBRANCH}"
          fi

          if [[ -n "$CRDROIDBRANCH" ]]; then
            echo "📌 CrDroid Branch   : ${CRDROIDBRANCH}"
            echo "📌 CrDroid Device   : ${CRDROIDDEVICE}"
          fi

          # Clone AnyKernel3
          echo "📥 Cloning AnyKernel3..."
          rm -rf "$AK3DIR"
          git clone \
            --depth=1 \
            --branch master \
            https://github.com/AndreiMikh/AnyKernel3.git \
            "$AK3DIR"
          echo "✔️ AnyKernel3 Cloned Successfully"
          # Validate Kernel Image
          echo "🔎 Validating Kernel Image..."
          if [[ ! -s "$IMAGE" ]]; then
            echo "⚠️ Kernel Image Missing or Empty"
            echo "📂 Expected : $IMAGE"
            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"
          echo "✔️ Kernel Image Verified"
          echo "📌 Kernel Image Size : ${SIZE} bytes"
          # Prepare AnyKernel3 Package
          echo "📥 Preparing AnyKernel3 Package..."
          cp -a "$AK3DIR"/. "$PACKDIR"/
          cp "$IMAGE" "$PACKDIR/Image"
          echo "✔️ AnyKernel3 Package Prepared"
          # Configure AnyKernel3 Kernel Name
          echo "🔧 Configuring AnyKernel3 Kernel Name..."
          if [[ "${{ inputs.ATTR }}" == "true" ]]; then
            sed -i \
              "s#kernel.string=.*#kernel.string=AOSP ${AOSPSOURCE} Kernel | Build by ${{ inputs.GITOWNER }}#" \
              "$PACKDIR/anykernel.sh"
          else
            sed -i \
              "s#kernel.string=.*#kernel.string=${AOSPSOURCE} OPlus AOSP SM8750 Kernel#" \
              "$PACKDIR/anykernel.sh"
          fi

          echo "✔️ AnyKernel3 Kernel Name Configured"  
          # Detect Android Security Patch Level
          echo "🔎 Detecting Android Security Patch Level..."
          AOSPPATCHFULL=""
          case "$AOSPSOURCE" in
            Lineage)
              # Define LineageOS Release Metadata
              RELEASEURL="https://raw.githubusercontent.com/LineageOS/android_build_release/${LINEAGEBRANCH}/flag_values/bp4a/RELEASE_PLATFORM_SECURITY_PATCH.textproto"
              echo "📌 Source   : LineageOS"
              echo "📌 Branch   : ${LINEAGEBRANCH}"
              echo "📂 Metadata : ${RELEASEURL}"
              rm -f "$RELEASEPATCH"
              # Fetch LineageOS Release Metadata
              if curl -fsSL \
                "$RELEASEURL" \
                -o "$RELEASEPATCH"; then
                echo "✔️ LineageOS Release Metadata Downloaded"
                # Extract Security Patch Level
                AOSPPATCHFULL="$(
                  awk '
                    {
                      if (match($0, /20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/)) {
                        print substr($0, RSTART, RLENGTH)
                        exit
                      }
                    }
                  ' "$RELEASEPATCH"
                )"
                if [[ -n "$AOSPPATCHFULL" ]]; then
                  echo "✔️ LineageOS Security Patch Level Found"
                  echo "📲 Detected Patch Level : ${AOSPPATCHFULL}"
                else
                  echo "⚠️ LineageOS Security Patch Level Not Found"
                fi
              else
                echo "⚠️ Failed To Fetch LineageOS Release Metadata"
              fi
              ;;
            CrDroid)
              # Define CrDroid OTA Metadata
              CRDROIDURL="https://raw.githubusercontent.com/crdroidandroid/android_vendor_crDroidOTA/${CRDROIDBRANCH}/${CRDROIDDEVICE}.json"
              echo "📌 Source   : CrDroid"
              echo "📌 Branch   : ${CRDROIDBRANCH}"
              echo "📌 Device   : ${CRDROIDDEVICE}"
              echo "📂 Metadata : ${CRDROIDURL}"
              rm -f "$CRDROIDPATCH" 
              # Fetch CrDroid OTA Metadata
              if curl -fsSL \
                "$CRDROIDURL" \
                -o "$CRDROIDPATCH"; then
                echo "✔️ CrDroid OTA Metadata Downloaded"
                # Extract Security Patch Level
                AOSPPATCHFULL="$(
                  awk '
                    /"os_patch_level"[[:space:]]*:/ {
                      if (match($0, /20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/)) {
                        print substr($0, RSTART, RLENGTH)
                        exit
                      }
                    }
                  ' "$CRDROIDPATCH"
                )"
                if [[ -n "$AOSPPATCHFULL" ]]; then
                  echo "✔️ CrDroid Security Patch Level Found"
                  echo "📲 Detected Patch Level: ${AOSPPATCHFULL}"
                else
                  echo "⚠️ CrDroid Security Patch Level Not Found"
                fi
              else
                echo "⚠️ Failed To Fetch CrDroid OTA Metadata"
              fi
              ;;
            *)
              # Handle Unknown Android Source
              echo "⚠️ Unknown AOSP Source : ${AOSPSOURCE}"
              ;;
          esac
          # Validate Security Patch Level
          if [[ "$AOSPPATCHFULL" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            # Convert Security Patch Level
            AOSPPATCHLEVEL="${AOSPPATCHFULL:0:7}"
            echo "✔️ Android Security Patch Level Detected"
            echo "📲 Full Patch Level        : ${AOSPPATCHFULL}"
            echo "📲 Boot Patch Level        : ${AOSPPATCHLEVEL}"
          else
            # Use Workflow Fallback
            echo "⚠️ Android Security Patch Level Not Found In Source"
            echo "ℹ️ Using Workflow Fallback : 2026-08"
            AOSPPATCHLEVEL="2026-08"
          fi

          # Export Security Patch Level
          echo "AOSPPATCHLEVEL=$AOSPPATCHLEVEL" >> "$GITHUB_ENV"
          echo "📲 Final Boot Patchlevel : ${AOSPPATCHLEVEL}"
          # Generate AnyKernel3 Package Name
          STAMP="$(date +%Y-%m-%d)"
          ZIP="AK3-(${{ steps.kernelversion.outputs.fullversion }})-${{ inputs.AOSPSOURCE }}(SM8750)-${{ inputs.ROOTENGINE }}(${{ steps.rootengine.outputs.ksuversion }})(${STAMP}).zip"
          echo "📦 Creating AnyKernel3 ZIP..."
          echo "📌 Package : ${ZIP}"
          # Compress AnyKernel3 Package
          cd "$PACKDIR"
          zip -r9 \
            "${OUTDIR}/${ZIP}" \
            . \
            -x "*.git*" \
            >/dev/null
          cd "$GITHUB_WORKSPACE"
          # Export Package Name
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          echo "✔️ AnyKernel3 Package Created"
          ls -lh "${OUTDIR}/${ZIP}"
          # Generate Additional Artifacts
          if [[ "${{ inputs.BUILDARTIFACT }}" == "All" ]]; then
            echo "📦 Generating Additional Kernel Artifacts..."
            # Copy Raw Kernel Image
            cp "$IMAGE" "${OUTDIR}/Image"
            echo "✔️ Raw Kernel Image Generated"
            echo "📂 ${OUTDIR}/Image"
            # Generate Boot Image
            echo "📦 Generating Boot Image..."
            echo "📲 Android Security Patch Level : ${AOSPPATCHLEVEL}"
            mkbootimg \
              --kernel "$IMAGE" \
              --header_version 4 \
              --os_version 17.0.0 \
              --os_patch_level "$AOSPPATCHLEVEL" \
              --pagesize 4096 \
              --base 0x80000000 \
              -o "${OUTDIR}/boot.img"
            # Validate Boot Image
            if [[ ! -s "${OUTDIR}/boot.img" ]]; then
              echo "⚠️ Failed To Generate Boot Image"
              exit 1
            fi

            echo "✔️ Boot Image Generated"
            echo "📂 ${OUTDIR}/boot.img"
            # Display Generated Artifacts
            echo "🚀 All Mode        : Image + Boot Image Generated"
            echo "📌 Generated Files :"
            ls -lh \
              "${OUTDIR}/Image" \
              "${OUTDIR}/boot.img"
            echo "📲 Boot Image Patch Level : ${AOSPPATCHLEVEL}"
          fi
  
          echo "🎉 AnyKernel3 Packaging Complete"

      - name: 📤 Upload Kernel Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: File-${{ inputs.AOSPSOURCE }}(${{ steps.kernelversion.outputs.fullversion }})-BakaSU-(${{ steps.rootengine.outputs.ksuversion }})
          path: out/*
          retention-days: 30
          if-no-files-found: error
