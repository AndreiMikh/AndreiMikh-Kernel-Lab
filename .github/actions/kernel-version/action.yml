name: "Kernel Version Setup"
description: "Detect, Optionally Modify, and Export Kernel Version Information"

inputs:
  sublevel:
    description: "Optional Custom Kernel Sublevel"
    required: false
    default: ""

runs:
  using: composite

  steps:

    - name: 🔧 Kernel Version Setup
      shell: bash
      env:
        SUBLVLINPUT: ${{ inputs.sublevel }}
      run: |
        set -Eeuo pipefail

        cd kernel_workspace/kernel_platform

        echo "📂 Working Directory: $(pwd)"

        # Resolve Kernel Common Directory
        echo "🔍 Locating Kernel Common Directory..."
        if [[ -f "./common/Makefile" ]]; then
          KCDIR="./common"
        elif [[ -f "./kernel_platform/common/Makefile" ]]; then
          KCDIR="./kernel_platform/common"
        else
          echo "⚠️ ERROR: Kernel Common Makefile Not Found"
          echo "📂 Nearby Makefiles:"
          find . -maxdepth 4 -name Makefile | head -20
          exit 1
        fi

        COMMONMAKEFILE="$KCDIR/Makefile"
        echo "🚀 Kernel Common Directory Found"
        echo "📌 Using Makefile: $COMMONMAKEFILE"
        echo ""

        # Detect Kernel Module Branch
        echo "🔍 Detecting Kernel Module Branch..."
        KERNELMODULE=""

        for cfg in \
          "$KCDIR/build.config.constants" \
          "$KCDIR/build.config.common"; do
          if [[ -f "$cfg" ]]; then
            TMPBRANCH=$(grep -m1 '^BRANCH=' "$cfg" | cut -d= -f2 || true)

            if [[ -n "${TMPBRANCH:-}" ]]; then
              KERNELMODULE="$TMPBRANCH"
              break
            fi
          fi
        done

        # Fallback Using ACK SHA
        if [[ -z "${KERNELMODULE:-}" && -n "${KERNELREPOSITORY:-}" \
          && -f "./$KERNELREPOSITORY/android/ACK_SHA" ]]; then
          KERNELMODULE=$(sed -n '2p' "./$KERNELREPOSITORY/android/ACK_SHA" \
            | awk -F'-' '{print $1"-"$2}')
        fi

        # Parse Kernel Module Information
        if [[ -n "${KERNELMODULE:-}" ]]; then
          ANDROIDVERSION="${KERNELMODULE%-*}"
          KERNELVERSION="${KERNELMODULE#*-}"

          echo "🚀 Kernel Module Detected"
          echo "📌 Kernel Module   : $KERNELMODULE"
          echo "📌 Android Version : $ANDROIDVERSION"
          echo "📌 Kernel Branch   : $KERNELVERSION"
        else
          echo "⚠️ Unable to Detect Kernel Module"

          KERNELMODULE="Unknown"
          ANDROIDVERSION="Unknown"
          KERNELVERSION="Unknown"
        fi

        # Read Actual Kernel Version
        echo ""
        echo "🧾 Reading Real Kernel Version..."

        VERSION=$(grep '^VERSION[[:space:]]*=' "$COMMONMAKEFILE" \
          | head -n1 | cut -d= -f2 | tr -d ' ')

        PATCHLEVEL=$(grep '^PATCHLEVEL[[:space:]]*=' "$COMMONMAKEFILE" \
          | head -n1 | cut -d= -f2 | tr -d ' ')

        # Extract Sublevel
        SUBLEVEL=$(grep '^SUBLEVEL[[:space:]]*=' "$COMMONMAKEFILE" \
          | head -n1 | cut -d= -f2 | tr -d ' ')

        # Fallback if Empty
        VERSION="${VERSION:-0}"
        PATCHLEVEL="${PATCHLEVEL:-0}"
        SUBLEVEL="${SUBLEVEL:-0}"

        # Validate Sublevel
        if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
          echo "⚠️ Invalid Sublevel Detected: $SUBLEVEL — Forcing 0"
          SUBLEVEL=0
        fi

        OGVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"

        echo "📌 Kernel Version : $VERSION.$PATCHLEVEL"
        echo "📌 Kernel Sublevel: $SUBLEVEL"
        echo "📌 Original Kernel Version: $OGVERSION"

        # Optional Sublevel Override
        if [[ -n "${SUBLVLINPUT:-}" ]]; then
          echo ""
          echo "🛠️ Updating Kernel Sublevel..."
          echo "📌 New Sublevel: $SUBLVLINPUT"

          if ! [[ "$SUBLVLINPUT" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid Custom Sublevel: $SUBLVLINPUT"
            exit 1
          fi

          sed -i \
            "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLVLINPUT/" \
            "$COMMONMAKEFILE"
        else
          echo "📌 No Custom Sublevel Provided"
        fi

        # Read Updated Kernel Version
        NEWVERSION=$(awk '
          /^VERSION[[:space:]]*=/ {v=$3}
          /^PATCHLEVEL[[:space:]]*=/ {p=$3}
          /^SUBLEVEL[[:space:]]*=/ {s=$3}
          END {print v "." p "." s}
        ' "$COMMONMAKEFILE")

        echo ""
        echo "📊 Final Kernel Version: $NEWVERSION"

        if [[ "$OGVERSION" != "$NEWVERSION" ]]; then
          echo "⚙️ Kernel Version Modified"
          echo "📌 $OGVERSION → $NEWVERSION"
        else
          echo "✔️ Kernel Version Unchanged"
        fi

        # Export Environment Variables
        echo ""
        echo "📤 Exporting Environment Variables..."

        {
          echo "SUBLEVEL=$SUBLEVEL"
          echo "KERNELMODULE=$KERNELMODULE"
          echo "ANDROIDVERSION=$ANDROIDVERSION"
          echo "KERNELVERSION=$KERNELVERSION"
          echo "FULLVERSION=$NEWVERSION"
          echo "KV1=$(echo "$KERNELVERSION" | cut -d. -f1)"
          echo "KV2=$(echo "$KERNELVERSION" | tr -d '.')"
          echo "KV3=$(echo "$NEWVERSION" | tr -d '.')"
          echo "KSHORTVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2)"
          echo "KSHORTPATCHVERSION=$(echo "$NEWVERSION" | cut -d. -f1,2 | tr '.' '_')"
        } >> "$GITHUB_ENV"

        echo "🚀 Environment Variables Exported"

        echo ""
        echo "🎉 Kernel Version Setup Complete"
