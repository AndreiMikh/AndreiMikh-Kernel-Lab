# 📦 Install and Configure Cache-ECS
name: 📦 Install and Configure Cache-ECS
description: Download, Install and Configure Cache-ECS as System Cache Binary
runs:
  using: composite
  steps:
    # Download and Install Cache-ECS
    - name: 📦 Install and Configure Cache-ECS
      shell: bash
      run: |
        # Enable Strict Error Handling
        set -Eeuo pipefail
        # Define Cache-ECS Binary Source and Temporary Path
        ECSURL="https://raw.githubusercontent.com/AndreiMikh/AndreiMikh-Kernel-Lab/LiquidAndrei/lib/ccache-x86-64"
        ECSBIN="${RUNNER_TEMP}/ccache-ecs"
        # Download Cache-ECS Binary with Automatic Retry Protection
        echo "└─ 📥 Downloading Cache-ECS..."
        curl -fsSL \
          --retry 5 \
          --retry-delay 3 \
          --retry-all-errors \
          --connect-timeout 30 \
          -A "Mozilla/5.0" \
          "$ECSURL" \
          -o "$ECSBIN"
        # Verify Downloaded Binary Exists and is Not Empty
        [[ -s "$ECSBIN" ]] || {
          echo "└─ ⚠️ Cache-ECS Download Failed"
          exit 1
        }
        # Grant Execute Permission to Downloaded Binary
        chmod +x "$ECSBIN"
        # 🔧 Install Cache-ECS as System Cache Binary
        echo "🔧 Installing Cache-ECS..."
        sudo install -m 0755 "$ECSBIN" /usr/bin/ccache
        # Remove Temporary Binary After Installation
        rm -f "$ECSBIN"
        # Ensure System Binary Directory is Available in Subsequent Steps
        echo "/usr/bin" >> "$GITHUB_PATH"
        export PATH="/usr/bin:$PATH"
        # Display Cache-ECS Version to Verify Successful Installation
        echo "└─ 📜 Cache-ECS Version :"
        ccache --version
        # Confirm Cache-ECS Installation is Complete
        echo "└─ 🎉 Cache-ECS Setup Complete"
