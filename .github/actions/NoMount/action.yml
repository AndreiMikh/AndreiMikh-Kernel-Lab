name: NoMount Kernel Integration and Package
description: Integrate NoMount Into Kernel, Compile Userspace Binaries and Package Module
# Define Inputs Passed From Calling Workflow
inputs:
  # Select The NoMount Source Branch to Integrate
  NOMOUNT:
    description: Selected NoMount Branch
    required: true
# Expose Verified NoMount Source Metadata to Calling Workflow
outputs:
  # Return The Short SHA Of The Verified NoMount Commit
  nomountsha:
    description: Verified NoMount Source Commit (Short SHA)
    value: ${{ steps.nomount.outputs.nomountsha }}
# Configure Composite Action and Run NoMount Integration
runs:
  using: composite
  steps:
    - name: 🧩 NoMount Kernel Integration and Package
      # Step ID Used to Export Verified NoMount Commit SHA
      id: nomount
      shell: bash
      # Pass Workflow Inputs and Existing Environment Variables
      env:
        WORKDIR: ${{ env.WORKDIR }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        NOMOUNT: ${{ inputs.NOMOUNT }}
        KERNELVERSION: ${{ env.KERNELVERSION }}
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Define NoMount Source, Binary, Package And Output Paths
        NOMOUNTBRANCH="$NOMOUNT"
        NOMOUNTSOURCE="${WORKDIR}/nomount-source"
        NOMOUNTBIN="${WORKDIR}/nomount-bin"
        NOMOUNTMODULEDIR="${WORKDIR}/nomount-userspace"
        NOMOUNTOUTDIR="${WORKDIR}/output"
        # Enter Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # Display Initial Integration Information
        echo "NoMount Kernel Integration and Package"
        echo "└─ 📂 Work Directory : $WORKDIR"
        echo "└─ 📦 NoMount Branch : $NOMOUNTBRANCH"
        # Map User-Selected NoMount Variant to its Git Branch
        case "$NOMOUNTBRANCH" in
          # Stable NoMount Variant Uses Master Branch
          NoMount)
            NOMOUNTGITBRANCH="master"
            ;;
          # Development NoMount Variant Uses Dev Branch
          NoMount-Dev)
            NOMOUNTGITBRANCH="dev"
            ;;
          # Reject Unsupported Branch Selections
          *)
            echo "└─ ⛔ Invalid NoMount Branch : $NOMOUNTBRANCH"
            echo "└─ ⚠️ Supported Branches     : NoMount, NoMount-Dev"
            exit 1
            ;;
        esac
        # Display The Resolved NoMount Branch
        echo "└─ 📌 Selected Branch : $NOMOUNTBRANCH"
        echo "└─ 📌 Git Branch      : $NOMOUNTGITBRANCH"
        # Retrieve Current Remote Commit SHA For Selected Branch
        echo "└─ 🔎 Verifying NoMount Remote Branch..."
        REMOTECOMMIT="$(
          git ls-remote \
            "https://github.com/maxsteeel/nomount.git" \
            "refs/heads/${NOMOUNTGITBRANCH}" |
          awk '{print $1}'
        )"
        # Stop if Selected Remote Branch Cannot be Resolved
        [[ -n "$REMOTECOMMIT" ]] || {
          echo "└─ ⛔ NoMount Remote Branch Not Found"
          echo "└─ refs/heads/${NOMOUNTGITBRANCH}"
          exit 1
        }
        # Record Remote Commit For Later Verification
        echo "└─ 📌 Remote Commit   : $REMOTECOMMIT"
        # Remove Any Previous Checkout Before Downloading Source
        echo "└─ 📥 Cloning NoMount Source..."
        rm -rf "$NOMOUNTSOURCE"
        # Clone Only Selected Branch with a Shallow History
        git clone \
          --depth=1 \
          --branch "$NOMOUNTGITBRANCH" \
          --single-branch \
          "https://github.com/maxsteeel/nomount.git" \
          "$NOMOUNTSOURCE"
        # Detect Actual Checked-Out Branch and Commit SHA
        ACTUALBRANCH="$(
          git -C "$NOMOUNTSOURCE" branch --show-current
        )"
        ACTUALCOMMIT="$(
          git -C "$NOMOUNTSOURCE" rev-parse HEAD
        )"
        # Display Source Checkout Details
        echo "└─ 📂 NoMount Source   : $NOMOUNTSOURCE"
        echo "└─ 📌 Requested Branch : $NOMOUNTGITBRANCH"
        echo "└─ 📌 Checked-Out      : $ACTUALBRANCH"
        echo "└─ 📌 NoMount Commit   : $ACTUALCOMMIT"
        # Verify Checked-Out Branch Matches Requested Branch
        [[ "$ACTUALBRANCH" == "$NOMOUNTGITBRANCH" ]] || {
          echo "└─ ⛔ NoMount Branch Verification Failed"
          echo "└─ Expected : $NOMOUNTGITBRANCH"
          echo "└─ Actual   : $ACTUALBRANCH"
          exit 1
        }
        # Verify  Checked-Out Commit Matches Remote Reference
        [[ "$ACTUALCOMMIT" == "$REMOTECOMMIT" ]] || {
          echo "└─ ⛔ NoMount Commit Verification Failed"
          echo "└─ Expected : $REMOTECOMMIT"
          echo "└─ Actual   : $ACTUALCOMMIT"
          exit 1
        }
        # Report Successful Branch and Commit Verification
        echo "└─ 📌 NoMount Branch Verified"
        echo "└─ 📌 NoMount Commit Verified"
        # Generate Short Commit SHA
        NOMOUNTSHA="${ACTUALCOMMIT:0:7}"
        echo "└─ 📌 Full Commit SHA  : $ACTUALCOMMIT"
        echo "└─ 📌 Short Commit SHA : $NOMOUNTSHA"
        # Export Short SHA For Use by Subsequent Workflow Steps
        echo "nomountsha=$NOMOUNTSHA" >> "$GITHUB_OUTPUT"
        # Verify All Required NoMount Source Files Exist
        [[ -f "$NOMOUNTSOURCE/kernel/setup.sh" ]] || {
          echo "└─ ⚠️ NoMount Setup Script Missing"
          exit 1
        }
        [[ -f "$NOMOUNTSOURCE/userspace/src/nm.c" ]] || {
          echo "└─ ⚠️ NoMount Userspace Source Missing"
          exit 1
        }
        [[ -d "$NOMOUNTSOURCE/module" ]] || {
          echo "└─ ⚠️ NoMount Module Directory Missing"
          exit 1
        }
        [[ -f "$NOMOUNTSOURCE/module/module.prop" ]] || {
          echo "└─ ⚠️ NoMount Module.prop Missing"
          exit 1
        }
        # Continue Only After Required Repository Files are Verified
        echo "└─ 📌 NoMount Repository Verified"
        # Run Official NoMount Method Kernel Setup Script
        # Pass Resolved Git Branch to Setup Script
        echo "└─ 🚀 Running Official NoMount Method 1 Setup..."
        bash "$NOMOUNTSOURCE/kernel/setup.sh" "$NOMOUNTGITBRANCH"
        # Verify Setup Created the Expected Kernel Integration
        echo "└─ 🔎 Verifying NoMount Kernel Integration..."
        # Confirm FS/NoMount is a Symbolic Link
        [[ -L "$COMMONKERNELFOLDER/fs/nomount" ]] || {
          echo "└─ ⚠️ NoMount Symlink Missing"
          exit 1
        }
        # Resolve Symlink to its Actual Kernel Source Directory
        NOMOUNTKDIR="$(readlink -f "$COMMONKERNELFOLDER/fs/nomount")"
        echo "└─ 📂 Kernel Source  : $COMMONKERNELFOLDER"
        echo "└─ 📂 NoMount Kernel : $NOMOUNTKDIR"
        # Verify Required NoMount Kernel Source Files
        [[ -f "$COMMONKERNELFOLDER/fs/nomount/Kconfig" ]] || {
          echo "└─ ⚠️ NoMount Kernel Configuration Missing"
          exit 1
        }
        [[ -f "$COMMONKERNELFOLDER/fs/nomount/Makefile" ]] || {
          echo "└─ ⚠️ NoMount Makefile Missing"
          exit 1
        }
        [[ -f "$COMMONKERNELFOLDER/fs/nomount/nomount.c" ]] || {
          echo "└─ ⚠️ NoMount Source Missing"
          exit 1
        }
        # Verify NoMount Kernel Configuration is Registered in FS/Kconfig
        grep -qF 'source "fs/nomount/Kconfig"' \
          "$COMMONKERNELFOLDER/fs/Kconfig" || {
          echo "└─ ⚠️ NoMount Kernel Configuration Registration Missing"
          exit 1
        }
        # Verify NoMount Directory is Registered in FS/Makefile
        grep -qF 'obj-$(CONFIG_NOMOUNT) += nomount/' \
          "$COMMONKERNELFOLDER/fs/Makefile" || {
          echo "└─ ⚠️ NoMount Makefile Registration Missing"
          exit 1
        }
        # Report Successful Kernel Integration Checks
        echo "└─ 📌 NoMount Symlink Verified"
        echo "└─ 📌 NoMount Source Files Verified"
        echo "└─ 📌 NoMount Kernel Integration Verified"
        # Ensure Setup Script Did Not Change Checked-Out Commit
        SETUPCOMMIT="$(
          git -C "$NOMOUNTSOURCE" rev-parse HEAD
        )"
        [[ "$SETUPCOMMIT" == "$ACTUALCOMMIT" ]] || {
          echo "└─ ⛔ NoMount Source Commit Changed During Setup"
          echo "└─ Original : $ACTUALCOMMIT"
          echo "└─ Current  : $SETUPCOMMIT"
          exit 1
        }
        # Confirm Original Source Revision was Preserved
        echo "└─ 📌 NoMount Source Revision Preserved"
        # Define NoMount Userspace Source and Working Paths
        NOMOUNTUSERDIR="${NOMOUNTSOURCE}/userspace"
        NOMOUNTUSERSRC="${NOMOUNTUSERDIR}/src/nm.c"
        echo "NoMount Userspace Compilation"
        echo "└─ 📂 Source : $NOMOUNTUSERSRC"
        # Verify Userspace C Source Before Compilation
        [[ -f "$NOMOUNTUSERSRC" ]] || {
          echo "└─ ⛔ NoMount Userspace Source Not Found"
          exit 1
        }

        # Recreate a Clean Directory For Compiled Binaries
        rm -rf "$NOMOUNTBIN"
        mkdir -p "$NOMOUNTBIN"
        # Enter Directory Containing Userspace C Source
        cd "${NOMOUNTUSERDIR}/src"
        # Compile ARM64 Userspace Binary Using Zig
        echo "🔨 Building NoMount-ARM64..."
        zig cc \
          -target aarch64-linux \
          -Oz \
          -mcmodel=tiny \
          -static \
          -nostdlib \
          -ffreestanding \
          -fno-unwind-tables \
          -fno-ident \
          -Wno-invalid-noreturn \
          -Wl,--entry=_start \
          nm.c \
          -o "${NOMOUNTBIN}/nm-arm64"
        # Compile ARM32 Userspace Binary Using Zig
        echo "🔨 Building NoMount-ARM..."
        zig cc \
          -target arm-linux \
          -Oz \
          -static \
          -nostdlib \
          -ffreestanding \
          -fno-unwind-tables \
          -fno-ident \
          -Wno-invalid-noreturn \
          -ffunction-sections \
          -fdata-sections \
          -Wl,--gc-sections \
          -Wl,--entry=_start \
          nm.c \
          -o "${NOMOUNTBIN}/nm-arm"
        # Verify Both Compiled Binaries Exist and are Executable
        [[ -x "${NOMOUNTBIN}/nm-arm64" ]] || {
          echo "└─ ⚠️ NoMount-ARM64 Compilation Failed"
          exit 1
        }
        [[ -x "${NOMOUNTBIN}/nm-arm" ]] || {
          echo "└─ ⚠️ NoMount-ARM Compilation Failed"
          exit 1
        }
        # Report Successful Compilation and Display Binary Sizes
        echo "└─ 🎉 NoMount-ARM64 Compiled Successfully"
        echo "└─ 🎉 NoMount-ARM Compiled Successfully"
        ls -lh \
          "${NOMOUNTBIN}/nm-arm64" \
          "${NOMOUNTBIN}/nm-arm"
        # Prepare Clean Directory For NoMount Userspace Package
        echo "NoMount Userspace Packaging"
        rm -rf "$NOMOUNTMODULEDIR"
        mkdir -p "$NOMOUNTMODULEDIR/bin"
        mkdir -p "$NOMOUNTOUTDIR"
        # Copy Original NoMount Module Files Into Package
        cp -a "$NOMOUNTSOURCE/module/." \
          "$NOMOUNTMODULEDIR/"
        # Install Both Compiled Binaries with Executable Permissions
        install -m 0755 \
          "${NOMOUNTBIN}/nm-arm64" \
          "$NOMOUNTMODULEDIR/bin/nm-arm64"
        install -m 0755 \
          "${NOMOUNTBIN}/nm-arm" \
          "$NOMOUNTMODULEDIR/bin/nm-arm"
        # Store Full Source Commit SHA in Package
        printf '%s\n' "$ACTUALCOMMIT" \
          > "$NOMOUNTMODULEDIR/nm-commit-src"
        # Store Short Source Commit SHA in Package
        printf '%s\n' "$NOMOUNTSHA" \
          > "$NOMOUNTMODULEDIR/nm-commit"
        # Normalize Version Code To 1 When Property Exists
        if grep -q '^versionCode=' "$NOMOUNTMODULEDIR/module.prop"; then
          sed -i 's/^versionCode=.*/versionCode=1/' \
            "$NOMOUNTMODULEDIR/module.prop"
        fi
     
        # Verify Packaged Full Commit SHA Matches Source
        [[ "$(cat "$NOMOUNTMODULEDIR/nm-commit-src")" == "$ACTUALCOMMIT" ]] || {
          echo "└─ ⛔ Full Commit Metadata Verification Failed"
          exit 1
        }
        # Verify Packaged Short Commit SHA Matches Source
        [[ "$(cat "$NOMOUNTMODULEDIR/nm-commit")" == "$NOMOUNTSHA" ]] || {
          echo "└─ ⛔ Short Commit Metadata Verification Failed"
          exit 1
        }
        # Report Successful Commit Metadata Verification
        echo "📌 Full Commit Metadata Verified"
        echo "📌 8-Digit Commit Metadata Verified"
        # Define Output ZIP File Name Using Kernel Version and Commit SHA
        NOMOUNTMODULEZIP="${NOMOUNTOUTDIR}/NoMount-Userspace-Metamodule-${KERNELVERSION}-Commit(${NOMOUNTSHA}).zip"
        # Remove Any Previous ZIP Before Creating New Package
        rm -f "$NOMOUNTMODULEZIP"
        echo "└─ 📦 Creating NoMount Userspace ZIP..."
        # Archive Module Contents From Package Root
        (
          cd "$NOMOUNTMODULEDIR"
          zip -qr "$NOMOUNTMODULEZIP" .
        )
        # Generate SHA-256 Checksum File For ZIP Package
        sha256sum "$NOMOUNTMODULEZIP" \
          > "${NOMOUNTMODULEZIP}.sha256"
        # Confirm ZIP Exists and is Not Empty
        [[ -s "$NOMOUNTMODULEZIP" ]] || {
          echo "└─ ⚠️ NoMount Userspace ZIP was Not Created"
          exit 1
        }
        # Test ZIP Archive For Structural Integrity
        unzip -tq "$NOMOUNTMODULEZIP" || {
          echo "└─ ⛔ NoMount Userspace ZIP Integrity Check Failed"
          exit 1
        }
        # Verify ZIP Contains Required Module Metadata
        unzip -l "$NOMOUNTMODULEZIP" | grep -q 'module.prop' || {
          echo "└─ ⛔ Module.prop Missing From NoMount ZIP"
          exit 1
        }
        # Verify ARM64 Userspace Binary is Included
        unzip -l "$NOMOUNTMODULEZIP" | grep -q 'bin/nm-arm64' || {
          echo "└─ ⛔ NoMount-ARM64 Missing From NoMount ZIP"
          exit 1
        }
        # Verify ARM32 Userspace Binary is Included
        unzip -l "$NOMOUNTMODULEZIP" | grep -q 'bin/nm-arm' || {
          echo "└─ ⛔ NoMount-ARM Missing From NoMount ZIP"
          exit 1
        }
        # Verify Full Source Commit Metadata is Included
        unzip -l "$NOMOUNTMODULEZIP" | grep -q 'nm-commit-src' || {
          echo "└─ ⛔ Full Commit Metadata Missing From NoMount ZIP"
          exit 1
        }
        # Verify Short Source Commit Metadata is Included
        unzip -l "$NOMOUNTMODULEZIP" | grep -q 'nm-commit' || {
          echo "└─ ⛔ 7-Digit Commit Metadata Missing From NoMount ZIP"
          exit 1
        }
        # Print Final NoMount Integration and Packaging Report
        echo "------------------------------"
        echo "NoMount Integration Complete"
        echo "------------------------------"
        echo "📂 └─ Work Directory  : $WORKDIR"
        echo "📦 └─ Selected Branch : $NOMOUNTBRANCH"
        echo "🌿 └─ Git Branch      : $ACTUALBRANCH"
        echo "📌 └─ Full Commit     : $ACTUALCOMMIT"
        echo "📌 └─ Short Commit    : $NOMOUNTSHA"
        echo "📦 └─ ARM64 Binary    : ${NOMOUNTBIN}/nm-arm64"
        echo "📦 └─ ARM32 Binary    : ${NOMOUNTBIN}/nm-arm"
        echo "📦 └─ Userspace ZIP   : $NOMOUNTMODULEZIP"
        echo "🔐 └─ SHA-256         : ${NOMOUNTMODULEZIP}.sha256"
        # Display Contents of Completed ZIP Package
        echo "📋 └─ NoMount ZIP Contents  :"
        unzip -l "$NOMOUNTMODULEZIP"
        # Confirm NoMount Integration and Packaging Completed
        echo "└─ 🎉 NoMount Kernel Integration and Packaging Completed Successfully"
        echo "------------------------------"
