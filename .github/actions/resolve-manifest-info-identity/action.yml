name: 🧬 Build Identity
description: Extract Manifest Information and Generate Final Build Identity
inputs:
  FILE:
    required: true
  GITHUBREPOSITORY:
    required: false
    default: ""
  BUILDTIME:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
  KERNELPATCH:
    required: false
    default: ""
  ROOTBRANCHSOURCE:
    required: false
    default: ""
  SUSFSREPOSITORY:
    required: false
    default: ""
  ROOTENGINE:
    required: false
    default: ""
  LZ4NEON:
    required: false
    default: ""
  LSMBBG:
    required: false
    default: ""
  LXCDOCKERSUPPORT:
    required: false
    default: ""
  NOMOUNT:
    required: false
    default: ""
  NETFILTER:
    required: false
    default: ""
  TCPALGORITHM:
    required: false
    default: ""
  SUSFSVARIANT:
    required: false
    default: ""
  SUSFSBRANCHDEV:
    required: false
    default: ""
  WINDSPEED:
    required: false
    default: ""
  UNICODE:
    required: false
    default: ""
  REKERNEL:
    required: false
    default: ""
  NTSYNC:
    required: false
    default: ""
  XUS:
    required: false
    default: ""
outputs:
  manifestbasefile:
    description: Normalized manifest base filename
    value: ${{ steps.extract-info.outputs.manifestbasefile }}
  cpu:
    description: CPU extracted from manifest
    value: ${{ steps.extract-info.outputs.cpu }}
  value:
    description: Android manifest identity
    value: ${{ steps.extract-info.outputs.value }}
  suffix:
    description: Final build identity suffix
    value: ${{ steps.suffix.outputs.suffix }}
runs:
  using: composite
  steps:
    - name: 🧬 Extract Manifest Information
      id: extract-info
      env:
        FILE: ${{ inputs.FILE }}
        GITREPOSITORYINPUT: ${{ inputs.GITHUBREPOSITORY }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        # Verify Required Tools
        command -v jq >/dev/null || {
          echo "└─ ⚠️ JQ Not Installed"
          exit 1
        }
        # Switch to the GitHub Workspace
        cd "$WORKSPACEDIR"
        # Normalize Manifest File Name
        if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
          MANIFESTFILECONFIG="${BASH_REMATCH[1]}"
        else
          MANIFESTFILECONFIG="$FILE"
        fi

        # Generate Normalized Manifest Base Name
        MANIFESTBASEFILE=$(echo "$MANIFESTFILECONFIG" | sed -E '
          s/_aosp/AOSP/g;
          s/_custom/CustomBuild/g;
          s/_([a-zA-Z0-9])/\U\1/g;
          s/^oneplus/1+/;
          s/^realme/RealMe/;
          s/^oppo/Oppo/
        ')
        # Prepare Manifest Fallback Directory
        mkdir -p ".repo/fallbackmanifests"
        # Define Manifest and README Paths
        XMLPATH=".repo/fallbackmanifests/${FILE}.xml"
        READMEPATH=".repo/fallbackmanifests/README.md"
        # Display Normalized Manifest Information
        echo "└─ FILE                  : $FILE"
        echo "└─ MANIFESTFILECONFIG    : $MANIFESTFILECONFIG"
        echo "└─ MANIFESTBASEFILE      : $MANIFESTBASEFILE"
        # Export Manifest Names for Following Workflow Steps
        {
          echo "MANIFESTFILECONFIG=$MANIFESTFILECONFIG"
          echo "MANIFESTBASEFILE=$MANIFESTBASEFILE"
        } >> "$GITHUB_ENV"
        # Export Step Output
        echo "manifestbasefile=$MANIFESTBASEFILE" >> "$GITHUB_OUTPUT"
        # Define Repository Search Priority
        REPOS=(
          "AndreiMikh|Kernel-Manifest"
          "AndreiMikh|AndreiMikh-Kernel-Lab"
        )
        # Add Dynamic Repository When Provided
        if [[ -n "${GITREPOSITORYINPUT:-}" ]]; then
          # Normalize GitHub Repository Input
          GITREPOSITORYINPUT="${GITREPOSITORYINPUT#https://github.com/}"
          GITREPOSITORYINPUT="${GITREPOSITORYINPUT%/}"
          # Parse Owner and Repository Name
          case "$GITREPOSITORYINPUT" in
            */*)
              OWNER="${GITREPOSITORYINPUT%%/*}"
              REPO="${GITREPOSITORYINPUT##*/}"
              ;;
            *)
              OWNER="$GITREPOSITORYINPUT"
              REPO="Kernel-Manifest"
              ;;
          esac
          # Register Dynamic Repository
          echo "└─ 🚀 Dynamic Repository: ${OWNER}/${REPO}"
          REPOS+=("${OWNER}|${REPO}")
        fi

        # Initialize Manifest Search Results
        MANIFESTFOUNDREPO=""
        MANIFESTFOUNDREPONAME=""
        MANIFESTFOUNDBRANCH=""
        # Search Repositories in Deterministic Priority Order
        for ENTRY in "${REPOS[@]}"; do
          OWNER="${ENTRY%%|*}"
          REPOSITORYNAME="${ENTRY##*|}"
          echo "└─ 🔎 Checking ${OWNER}/${REPOSITORYNAME}"
          BRANCHES=""
          # Query GitHub API with Authentication
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            BRANCHES=$(curl \
              --connect-timeout 10 \
              --max-time 20 \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPOSITORYNAME}/branches?per_page=100" \
              | jq -r '.[].name? // empty' \
              2>/dev/null || true)
          fi

          # Fallback to Unauthenticated GitHub API
          if [[ -z "$BRANCHES" ]]; then
            BRANCHES=$(curl \
              --connect-timeout 10 \
              --max-time 20 \
              --fail \
              --silent \
              --show-error \
              "https://api.github.com/repos/${OWNER}/${REPOSITORYNAME}/branches?per_page=100" \
              | jq -r '.[].name? // empty' \
              2>/dev/null || true)
          fi

          # Fallback to Git LS-Remote When API Is Unavailable
          if [[ -z "$BRANCHES" ]]; then
            echo "└─ ⚠️ GitHub API Failed"
            echo "└─ 🔄 Falling Back to Git LS-Remote..."
            BRANCHES=$(git ls-remote \
              --heads \
              "https://github.com/${OWNER}/${REPOSITORYNAME}.git" \
              2>/dev/null \
              | sed 's|.*refs/heads/||' \
              || true)
          fi

          # Skip Repository When No Branches Are Available
          if [[ -z "$BRANCHES" ]]; then
            echo "└─ ⚠️ No Branches Found"
            continue
          fi

          # Search Each Branch for the Requested Manifest
          while IFS= read -r BRANCH; do
            [[ -z "$BRANCH" ]] && continue
            echo "└─  → 📃 Trying Branch: $BRANCH"
            # Build Raw GitHub URLs
            XMLURL="https://raw.githubusercontent.com/${OWNER}/${REPOSITORYNAME}/${BRANCH}/${FILE}.xml"
            READMEURL="https://raw.githubusercontent.com/${OWNER}/${REPOSITORYNAME}/${BRANCH}/README.md"
            # Check Whether the Manifest Exists
            if ! curl \
              --fail \
              --silent \
              --show-error \
              --head \
              "$XMLURL" >/dev/null 2>&1; then
              continue
            fi

            echo "└─ ✔️ Found ${FILE}.xml"
            echo "└─ 📂 Repository: ${OWNER}/${REPOSITORYNAME}"
            echo "└─ 🌿 Branch    : ${BRANCH}"
            # Download Manifest to Temporary File
            TMPXML="${XMLPATH}.tmp"
            if ! curl \
              --fail \
              --silent \
              --show-error \
              --location \
              "$XMLURL" \
              -o "$TMPXML"; then
              echo "└─ ⚠️ Manifest Download Failed"
              rm -f "$TMPXML"
              continue
            fi

            # Verify Downloaded Manifest Is Not Empty
            if [[ ! -s "$TMPXML" ]]; then
              echo "└─ ⚠️ Downloaded Manifest Is Empty"
              rm -f "$TMPXML"
              continue
            fi

            # Move Valid Manifest into Final Location
            mv "$TMPXML" "$XMLPATH"
            # Download README When Available
            TMPREADME="${READMEPATH}.tmp"
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              "$READMEURL" \
              -o "$TMPREADME"; then
              if [[ -s "$TMPREADME" ]]; then
                mv "$TMPREADME" "$READMEPATH"
              else
                rm -f "$TMPREADME"
              fi
            else
              rm -f "$TMPREADME"
            fi

            # Store Successful Repository Information
            MANIFESTFOUNDREPO="$OWNER"
            MANIFESTFOUNDREPONAME="$REPOSITORYNAME"
            MANIFESTFOUNDBRANCH="$BRANCH"
            # Stop Searching After First Successful Match
            break 2
          done <<< "$BRANCHES"
          echo "└─ ⚠️ ${FILE}.xml Not Found in ${OWNER}/${REPOSITORYNAME}"
        done

        # Verify a Manifest Was Successfully Found
        if [[ -z "$MANIFESTFOUNDREPO" || ! -s "$XMLPATH" ]]; then
          echo "└─ ⚠️ ${FILE}.xml Not Found in Any Repository"
          exit 1
        fi

        # Display Located Manifest Information
        echo "------ Manifest Located ------"
        echo "└─ 📂 Repository  : ${MANIFESTFOUNDREPO}/${MANIFESTFOUNDREPONAME}"
        echo "└─ 📂 Branch      : ${MANIFESTFOUNDBRANCH}"
        echo "------------------------------"
        # Export Manifest Location for Following Steps
        {
          echo "MANIFESTREPO=$MANIFESTFOUNDREPO"
          echo "MANIFESTREPONAME=$MANIFESTFOUNDREPONAME"
          echo "MANIFESTBRANCH=$MANIFESTFOUNDBRANCH"
        } >> "$GITHUB_ENV"

        # Parse Manifest Revision
        echo "└─ 📌 Parsing Manifest"
        if command -v xmllint >/dev/null; then
          echo "[Info] Using XMLLint for XML Parsing"
          REVISION=$(xmllint \
            --xpath 'string(//project/@revision)' \
            "$XMLPATH" \
            2>/dev/null || true)
        else
          echo "└─ ⚠️ XMLLint Not Found, Using Grep Fallback"
          REVISION=$(grep \
            -oP '<project[^>]+revision="\K[^"]+' \
            "$XMLPATH" \
            | head -n1 \
            || true)
        fi

        # Extract CPU from Manifest Revision
        CPU=$(echo "$REVISION" | cut -d'/' -f2 | cut -d'_' -f1)
        # Extract Android Version from Manifest Revision
        VANDROID=$(echo "$REVISION" \
          | grep -oP '\d+\.\d+(\.\d+)?' \
          | head -n1 \
          || true)
        # Extract Android Major Version
        ASHORTVERSION="${VANDROID%%.*}"
        # Export Parsed Manifest Information
        {
          echo "CPU=$CPU"
          echo "VANDROID=$VANDROID"
          echo "ASHORTVERSION=$ASHORTVERSION"
        } >> "$GITHUB_ENV"
        # Export CPU as a Step Output
        echo "cpu=$CPU" >> "$GITHUB_OUTPUT"
        # Parse README Build Information
        CPUD=""
        BUILDMETHOD=""
        if [[ -s "$READMEPATH" ]]; then
          BUILDLINE=$(grep \
            -m1 \
            'oplus_build_kernel.sh' \
            "$READMEPATH" \
            || true)
          if [[ -n "$BUILDLINE" ]]; then
            CPUD=$(awk '{print $(NF-1)}' <<< "$BUILDLINE")
            BUILDMETHOD=$(awk '{print $NF}' <<< "$BUILDLINE")
            {
              echo "CPUD=$CPUD"
              echo "BUILDMETHOD=$BUILDMETHOD"
            } >> "$GITHUB_ENV"
          fi
        fi

        # Output Combined Manifest Identity
        echo "value=Android${VANDROID:-Unknown}" >> "$GITHUB_OUTPUT"
        echo "└─ 🎉 Manifest Parsing Complete"

    - name: 🪪 Build Identity
      id: suffix
      shell: bash
      env:
        DEBUGBUILDTIME: ${{ inputs.BUILDTIME }}
        DEBUGSUFFIX: ${{ inputs.SUFFIX }}
      run: |
        set -Eeuo pipefail
        # Unicode Helper
        printunicode() {
          local LABEL="$1"
          local VALUE="$2"
          echo -n "$LABEL Unicode: "
          VALUE="$VALUE" python3 <<'PY'
        import os
        import unicodedata
        value = os.environ.get("VALUE", "")
        output = []
        for c in value:
            code = f"U+{ord(c):04X}"
            if c.isspace() or unicodedata.category(c) == "Cf":
                output.append(f"\033[31m{code}\033[0m")
            else:
                output.append(code)
        print(" ".join(output))
        PY
        }
        echo "--- Manifest Parsed Values ---"
        echo "└─ CPU                   : ${CPU:-<Empty>}"
        echo "└─ CPUD                  : ${CPUD:-<Empty>}"
        echo "└─ Android Version       : ${VANDROID:-<Empty>}"
        echo "└─ Build Profile         : ${BUILDMETHOD:-<Empty>}"
        echo "--------- Git Inputs ---------"
        echo "└─ File                  : ${{ inputs.FILE }}"
        echo "└─ KernelPatch           : ${{ inputs.KERNELPATCH }}"
        echo "└─ Root Branch           : ${{ inputs.ROOTBRANCHSOURCE }}"
        echo "└─ SUSFS                 : ${{ inputs.SUSFSREPOSITORY }}"
        echo "└─ Root                  : ${{ inputs.ROOTENGINE }}"
        echo "└─ ZRAM                  : ${{ inputs.LZ4NEON }}"
        echo "└─ Build Time            : $DEBUGBUILDTIME"
        echo "└─ Suffix                : $DEBUGSUFFIX"
        echo "└─ LSM Baseband Guard    : ${{ inputs.LSMBBG }}"
        echo "└─ LXC Support           : ${{ inputs.LXCDOCKERSUPPORT }}"
        echo "└─ NoMount               : ${{ inputs.NOMOUNT }}"
        echo "└─ Netfilter             : ${{ inputs.NETFILTER }}"
        echo "└─ TCP                   : ${{ inputs.TCPALGORITHM }}"
        echo "└─ SUSFS Repository      : ${{ inputs.SUSFSVARIANT }}"
        echo "└─ SUSFS Branch          : ${{ inputs.SUSFSBRANCHDEV }}"
        echo "└─ Windspeed             : ${{ inputs.WINDSPEED }}"
        echo "└─ Unicode Bypass        : ${{ inputs.UNICODE }}"
        echo "└─ ReKernel              : ${{ inputs.REKERNEL }}"
        echo "└─ NTSync                : ${{ inputs.NTSYNC }}"
        # Unicode Inspection
        printunicode "BUILDTIME" "$DEBUGBUILDTIME"
        printunicode "SUFFIX" "$DEBUGSUFFIX"
        # Raw Byte Inspection
        echo "----- Raw Character Debug -----"
        printf 'BUILDTIME bytes : '
        printf '%s' "$DEBUGBUILDTIME" \
          | od -An -tx1 \
          | tr -d '\n'
        printf 'SUFFIX bytes    : '
        printf '%s' "$DEBUGSUFFIX" \
          | od -An -tx1 \
          | tr -d '\n'
        # Length Inspection
        echo "-------- Length Debug --------"
        printf 'BUILDTIME length: %d\n' "${#DEBUGBUILDTIME}"
        printf 'SUFFIX length   : %d\n' "${#DEBUGSUFFIX}"
        echo "└─ ⚡ Full Build Identity..."
        # Read Inputs
        ROOTENGINE="${{ inputs.ROOTENGINE }}"
        ROOTBRANCH="${{ inputs.ROOTBRANCHSOURCE }}"
        KERNELPATCH="${{ inputs.KERNELPATCH }}"
        LZ4NEONPATCH="${{ inputs.LZ4NEON }}"
        SUSFSVAR="${{ inputs.SUSFSVARIANT }}"
        SUSFSDEV="${{ inputs.SUSFSBRANCHDEV }}"
        REKERNEL="${{ inputs.REKERNEL }}"
        LSMBBG="${{ inputs.LSMBBG }}"
        LXC="${{ inputs.LXCDOCKERSUPPORT }}"
        NETFILTER="${{ inputs.NETFILTER }}"
        NTSYNC="${{ inputs.NTSYNC }}"
        NOMOUNT="${{ inputs.NOMOUNT }}"
        TCP="${{ inputs.TCPALGORITHM }}"
        UNICODE="${{ inputs.UNICODE }}"
        XUS="${{ inputs.XUS }}"
        WINDSPEED="${{ inputs.WINDSPEED }}"
        # Root Engine
        declare -A ROOTENGINEMAP=(
          ["BakaSU"]="BakaSU"
          ["KernelSU-Next"]="KernelSU-Next"
          ["SukiSU-Ultra"]="SukiSU-Ultra"
          ["KernelSU"]="KernelSU"
        )
        SUFFIX="${ROOTENGINEMAP[$ROOTENGINE]:-}"
        # Kernel Patch
        declare -A KERNELPATCHMAP=(
          ["KPM"]="-KPM"
          ["KPN"]="-KPN"
        )
        SUFFIX+="${KERNELPATCHMAP[$KERNELPATCH]:-}"
        # Root Branch
        case "$ROOTBRANCH" in
          *Main*)
            SUFFIX+="-(Main)"
            ;;
          *Dev-SUSFS*)
            SUFFIX+="-(Dev-SUSFS)"
            ;;
          *Dev*)
            SUFFIX+="-(Dev)"
            ;;
          *Stable*)
            SUFFIX+="-(Stable)"
            ;;
          *Canary*)
            SUFFIX+="-(Canary)"
            ;;
        esac
        # LZ4 Neon
        declare -A LZ4NEONPATCHMAP=(
          ["LZ4-1.10.0-Patch-Update"]="-LZ4(Neon)"
        )
        SUFFIX+="${LZ4NEONPATCHMAP[$LZ4NEONPATCH]:-}"
        # SUSFS
        declare -A SUSFSVARMAP=(
          ["OGKI"]="-SuSFS(OKI)"
          ["GKI"]="-SuSFS(GKI)"
        )
        SUFFIX+="${SUSFSVARMAP[$SUSFSVAR]:-}"
        case "$SUSFSDEV" in
          true)
            SUFFIX+="(Dev)"
            ;;
          false)
            SUFFIX+="(Main)"
            ;;
        esac
        # NoMount Kernel Integration
        declare -A NOMOUNTVARMAP=(
          ["NoMount"]="-NoMount"
          ["NoMount-Dev"]="-NoMountDev"
          ["NoMount-Suite"]="-NoMountSuite"
        )
        SUFFIX+="${NOMOUNTVARMAP[$NOMOUNT]:-}"
        # ReKernel Integration
        declare -A REKERNELMAP=(
          ["Built-in"]="-RK"
          ["Module"]="-RK-Module"
        )
        SUFFIX+="${REKERNELMAP[$REKERNEL]:-}"
        # Boolean Features
        [[ "$LSMBBG" == "true" ]] && SUFFIX+="-BBG"
        # DroidSpaces LXC
        case "$LXC" in
          DroidSpacesLXC-Inject)
            SUFFIX+="-DS"
            ;;
        esac
        # Network Features
        [[ "$NETFILTER" == "true" ]] && SUFFIX+="-NetFilter"
        [[ "$NTSYNC" == "true" ]] && SUFFIX+="-NTSync"
        # BBR TCP
        case "$TCP" in
          BBRV1+ECN)
            SUFFIX+="-BBRV1+ECN"
            ;;
          BBRV1+BBRV3+ECN)
            SUFFIX+="-BBRV1+BBRV3+ECN"
            ;;
          BBRV1+ECN+Brutal)
            SUFFIX+="-BBRV1+ECN+Brutal"
            ;;
          BBRV1+BBRV3+ECN+Brutal)
            SUFFIX+="-BBRV1+BBRV3+ECN+Brutal"
            ;;
        esac
        # Final Branding
        SUFFIX+="-Andrei"
        [[ "$UNICODE" == "true" || "$UNICODE" == "Enabled" ]] \
          && SUFFIX+="-Unicode"
        [[ "$XUS" == "true" || "$XUS" == "Enabled" ]] \
          && SUFFIX+="-XUS"
        [[ "$WINDSPEED" == "true" ]] \
          && SUFFIX+="-Hmbird"
        # Normalize Suffix
        SUFFIX="$(echo "$SUFFIX" | sed 's/--/-/g')"
        # Export Suffix
        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        echo "└─ 🎉 Final Build Identity:"
        echo "$SUFFIX"
