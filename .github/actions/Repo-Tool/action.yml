# Install Repository Tool
name: 🧰 Install Repository Tool
description: Install and Verify Android Repository Tool with Google and GitHub Fallback Sources
runs:
  using: composite
  steps:
    # Install and Verify Repository Tool
    - name: 🧰 Install Repository Tool
      shell: bash
      run: |
        # Enable Strict Error Handling
        set -Eeuo pipefail
        # Check Whether Repository Tool Is Already Installed
        if command -v repo >/dev/null 2>&1; then
          echo "└─ 🎉 Repository Tool Already Installed"
          echo "└─ 📦 Repository Tool Path :"
          command -v repo
          echo "└─ 📜 Repository Version   :"
          repo --version
          exit 0
        fi

        # Define Repository Tool Installation Paths
        BIN="/usr/local/bin/repo"
        GOOGLE="https://storage.googleapis.com/git-repo-downloads/repo"
        GITHUB="https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo"
        # Download Repository Tool From Specified Source
        download() {
          local URL="$1"
          echo "└─ 🌐 Downloading Repository Tool :"
          echo "$URL"
          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 300 \
            "$URL" \
            -o repo
        }
        # Primary Source : Official Google Download
        echo "└─ 📥 Installing Repository Tool..."
        if download "$GOOGLE"; then
          echo "└─ 🎉 Repository Tool Downloaded From Google"
        else
          # 🔄 Fallback Source : Official GitHub Mirror
          echo "└─ ⚠️ Google Download Failed"
          echo "└─ 🔄 Trying Official GitHub Mirror..."
          if download "$GITHUB"; then
            echo "└─ 🎉 Repository Tool Downloaded From GitHub"
          else
            echo "└─ ⚠️ Failed to Download Repository Tool"
            rm -f repo
            exit 1
          fi
        fi

        # Grant Execute Permission
        chmod +x repo
        # Install Repository Tool Into System Binary Directory
        sudo install -m 0755 repo "$BIN"
        # Remove Temporary Download
        rm -f repo
        # Validate Repository Tool Installation
        if [[ ! -x "$BIN" ]]; then
          echo "└─ ⚠️ Repository Tool Installation Failed"
          echo "└─ 📌 Expected Path : $BIN"
          exit 1
        fi

        # Verify Repository Tool Installation Path
        echo "└─ 📦 Repository Tool Path :"
        command -v repo
        # Display Repository Tool Version
        echo "└─ 📜 Repository Version   :"
        repo --version
        # Confirm Repository Tool is Ready
        echo "└─ 🎉 Repository Tool Ready"
