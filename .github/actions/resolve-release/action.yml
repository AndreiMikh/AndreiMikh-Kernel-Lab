name: 🚀 Release Kernel
description: Release Kernel Package and Root Source Manager APK
inputs:
  FILE:
    required: true
  KSUVERSION:
    required: true
  FULLVERSION:
    required: true
  SUFFIX:
    required: true
  ROOTENGINE:
    required: true
  MANAGERAPK:
    required: true
runs:
  using: composite
  steps:
    - name: 📥 Download Kernel Package
      uses: actions/download-artifact@v8
      with:
        name: "Package-${{ inputs.FILE }}-${{ inputs.KSUVERSION }}"
        path: dist

    - name: 📥 Download Root Source APK Artifact
      if: ${{ inputs.MANAGERAPK == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: "ManagerAPK-${{ inputs.ROOTENGINE }}-${{ inputs.KSUVERSION }}"
        path: manager-apk

    - name: 🏷️ Release Status Requirement
      id: ksu-check
      shell: bash
      env:
        GHTOKEN: ${{ github.token }}
        KSUVERSION: ${{ inputs.KSUVERSION }}
      run: |
        set -Eeuo pipefail
        # Check Latest GitHub Release Tag
        LATESTTAG="$(gh release view --json tagName -q .tagName 2>/dev/null || echo '')"
        echo "└─ 📦 [Info] Latest Release Tag: ${LATESTTAG:-None}"
        echo "└─ 🆕 [Info] Current Root Source Version: ${KSUVERSION}"
        # No Previous Release Found
        if [[ -z "$LATESTTAG" ]]; then
          echo "└─ 🔍 [Info] No Previous Release Found → Proceeding"
          echo "shouldrelease=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Compare Latest Release Against Current Root Source Version
        if [[ "$LATESTTAG" == *"${KSUVERSION}"* ]]; then
          echo "└─ ⏭️ [Info] Same KSU Version Detected → Skipping Release"
          echo "shouldrelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "└─ 🚀 [Info] New Root Source Version Detected → Releasing"
          echo "shouldrelease=true" >> "$GITHUB_OUTPUT"
        fi

    - name: 📋 Release Package Contents
      if: ${{ steps.ksu-check.outputs.shouldrelease == 'true' && inputs.MANAGERAPK == 'true' }}
      env:
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "└─ 📦 Release Files:"
        find dist \
          -maxdepth 1 \
          -type f \
          -printf '  └─ %f\n' \
          | sort
        echo "└─ 📦 Root Engine : ${ROOTENGINE:-None}"
        find manager-apk \
          -type f \
          -name "*.apk" \
          -print
        APKCOUNT="$(
          find manager-apk \
            -type f \
            -name "*.apk" |
          wc -l
        )"
        if [[ "$APKCOUNT" -eq 0 ]]; then
          echo "└─ ⚠️ [Warn] Manager APK Artifact Contains No APK Files"
          find manager-apk -maxdepth 5 -print
          exit 1
        fi

    - name: 📤 Upload Artifacts to Git Release
      if: ${{ steps.ksu-check.outputs.shouldrelease == 'true' }}
      continue-on-error: true
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.FILE }}
        name: ${{ inputs.FILE }}-${{ inputs.FULLVERSION }}-${{ inputs.SUFFIX }}
        body: |
          ### 📋 **INSTALLATION GUIDE**:
          ### 📩 **DOWNLOAD THE KERNEL ZIP FILE**:
          ---
          - Navigate to the Release Page & Download the Correct Kernel Zip File for Your Device Model & Kernel Version
          - Ensure that You Select the File that Matches Your Device's Model & Kernel Version You're Installing
          ### 📲 **PREPARE YOUR DEVICE**:
          ---
          - Make Sure Your Device has an **Unlocked Bootloader** & a Compatible Custom Recovery (TWRP/OrangeFox/Etc)
          - It's Recommended to **Backup Your Data** Before Proceeding with Installation to Avoid Any Loss
          ### 📤 **INSTALL THROUGH RECOVERY TOOL**:
          ---
          - Reboot Your Device Into **Recovery Mode** (TWRP/OrangeFox/AERA)
          - In the Recovery Menu, Select **Install** & Navigate to the Downloaded Kernel Zip File
          - Select the Kernel Zip File & Swipe to Confirm Installation
          - After Installation Completes, Reboot Your Device Into System
          ### 📥 **INSTALLATION VIA KERNELFLASHER APP**:
          ---
          - **Download KernelFlasher**: Get **KernelFlasher** App from https://github.com/fatalcoder524/KernelFlasher
          - **Launch KernelFlasher**: Open the App & Make Sure Your **Device is Rooted**
          - **Select Kernel**: Choose the Downloaded Kernel Zip File Within the App
          - **Flash the Kernel**: Follow the Prompts to Flash Kernel Directly Onto Your Device
          - **Reboot**: After Installation Completes, Reboot Your Device
          ### 📥 **INSTALLATION VIA HORIZON FLASHER APP**:
          ---
          - **Download Horizon Flasher**: https://github.com/libxzr/HorizonKernelFlasher/releases
          - **Install App**: Launch App & Select the Downloaded Kernel Zip File
          - **Flash**: Follow the Application's Flashing Instructions
          - **Reboot to System**: Reboot After Flashing Completes
          ### 🛠️ **TROUBLESHOOTING**:
          ---
          - **Bootloops**: If Your Device is Stuck in a Bootloop After Installation, Try Clearing Cache & Dalvik Cache from Recovery Menu
          - **Kernel Panic**: This May Occur if Your Device is Incompatible with the Kernel... Check Device-Specific Patches or Revert to a Compatible Kernel
          - **Stuck on Recovery**: Reflash Recovery & Reattempt Installation
          ### 🧩 **TIPS**:
          ---
          - **Root Access**: If You Need Root Access, Ensure that the Corresponding Root Manager (`ReSukiSU (BakaSU)`, Etc) is Installed After Flashing the Kernel
          ### 📊 **AFTER INSTALLATION**:
          ---
          - Once Installed, You Can Verify the Kernel Version & Root Access Using a Kernel Checker or Root Checker
          - Enjoy the New Kernel Features & Enhancements Designed for Your Device
        files: |
          dist/*.zip
          manager-apk/*.apk
