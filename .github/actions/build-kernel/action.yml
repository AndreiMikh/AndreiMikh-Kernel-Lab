name: "Build Kernel"
description: "Build Kernel with Fast-Build and Fallback Support"

inputs:
  fastbuild:
    description: "Enable Fast Build"
    required: false
    default: "false"

runs:
  using: composite

  steps:

    - name: 🔧 Build Kernel
      if: ${{ inputs.fastbuild == 'true' }}
      id: fastbuild
      shell: bash
      run: |
        set -Eeuo pipefail
        error() {
          local line="$1"
          local code="$2"
          echo "⚠️ Fast Build Failed at Line $line (Exit Code $code)"
          if [[ -z "${FALLBACKSET:-}" ]]; then
            echo "fallbackreason=unexpectederror" >> "$GITHUB_OUTPUT"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            export FALLBACKSET=1
          fi
          exit 0
        }
        trap 'error $LINENO $?' ERR

        # Environment Variables
        FILEBASE="${MANIFESTBASEFILE}"
        BRANCH="${MANIFESTBRANCH}"
        CPU="${CPUD}"
        METHOD="${BUILDMETHOD}"
        GKIVER="${ANDROIDVERSION}-${KERNELVERSION}"

        echo "-------- Kernel Build --------"
        echo "📂 File     : $FILEBASE"
        echo "📂 Branch   : $BRANCH"
        echo "📂 CPU      : $CPU"
        echo "📁 Method   : $METHOD"
        echo "📁 Version  : $GKIVER"
        echo "------------------------------"
        echo ""

        FASTBUILDSTART=$(date +%s)
        cd kernel_workspace/kernel_platform || { echo "⚠️ Kernel Platform Not Found"; exit 1; }

        # Detect LLVM IAS
        USE_LLVM_IAS=false
        if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
          USE_LLVM_IAS=true
        fi

        # Resolve Clang Toolchain
        echo "------------------------------"
        echo "🚀 Resolving Clang Toolchain..."
        echo "------------------------------"
        echo ""

        CLANGROOT="prebuilts/clang/host/linux-x86"
        if [[ ! -d "$CLANGROOT" ]]; then
          echo "⚠️ Clang Root Directory Missing"
          echo "📂 Expected: $CLANGROOT"
          echo "fallbackreason=missingclangroot" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # Dynamic Clang Discovery
        echo "🔍 Searching for Valid Clang Toolchains..."
        CLANGDIR=""
        while IFS= read -r dir; do
          if [[ -x "$dir/bin/clang" ]]; then
            CLANGDIR="$dir"
          fi
        done < <(
          find "$CLANGROOT" \
            -maxdepth 1 \
            -type d \
            \( -name 'clang-r*' -o -name 'clang-*' \) \
            | sort -V
        )

        if [[ -z "${CLANGDIR:-}" ]]; then
          echo "⚠️ No Valid Clang Toolchain Found"
          echo "🔍 Debug: Available Files"
          find "$CLANGROOT" -maxdepth 2 -type f | sort || true
          echo "fallbackreason=missingclangdir" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        CLANGBIN="$CLANGDIR/bin"
        CLANGFULLPATH="$PWD/$CLANGBIN/clang"
        echo "📂 Clang Directory : $CLANGDIR"
        echo "📂 Clang Bin       : $CLANGBIN"

        # Validate Clang Binary
        if [[ ! -x "$CLANGFULLPATH" ]]; then
          echo "⚠️ Clang Binary Missing"
          echo "📂 Expected: $CLANGFULLPATH"
          echo "🔍 Debug: Directory Contents"
          ls -lah "$PWD/$CLANGBIN" || true
          echo "fallbackreason=missingclang" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # Extract Clang Version
        CLANGVERSION="$(
          "$CLANGFULLPATH" --version \
            | head -n1 \
            | sed -E 's/.*clang version ([0-9.]+).*/\1/' \
            || true
        )"

        if [[ -z "${CLANGVERSION:-}" ]]; then
          echo "⚠️ Failed to Detect Clang Version"
          echo "fallbackreason=missingclangversion" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # Export Runtime Variables
        export PATH="$PWD/$CLANGBIN:$PATH"
        export CCACHE_COMPILER="$(realpath "$CLANGFULLPATH")"

        # Compatibility Variable
        CLANGPREBUILTBIN="$CLANGBIN"

        # Extract Directory Information
        CLANGDIR="$(basename "$CLANGDIR")"
        CLANGPATH="$(basename "$CLANGBIN")"

        echo "------------------------------"
        echo "📂 Clang Version   : $CLANGVERSION"
        echo "📂 Clang Directory : $CLANGDIR"
        echo "📂 Clang Path      : $CLANGPATH"
        echo "📂 LLVM IAS        : $USE_LLVM_IAS"
        echo "------------------------------"
        echo ""

        clang --version | head -n1 || true

        # Load Environment Script
        set +u
        source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u

        # Export Paths
        export PATH="/usr/lib/ccache:$PWD/$CLANGBIN:$PATH"

        # Setup: Enables Compiler Caching to Speed Up Rebuilds
        # Compiler Cache Runtime Tuning
        export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log" || echo "⚠️ Cache Log Not Found"
        export CCACHE_DIR="$CCACHE_DIR" || echo "⚠️ Directory Not Available"
        export CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK" || echo "⚠️ Compiler Check Not Found"
        export CCACHE_BASEDIR="$CCACHE_BASEDIR" || echo "⚠️ Base Directory Not Found"
        export CCACHE_NOHASHDIR="$CCACHE_NOHASHDIR" || echo "⚠️ NoHash Directory Not Found"
        export CCACHE_NOHARDLINK="$CCACHE_NOHARDLINK" || echo "⚠️ Cache Hardlink Not Found"

        # Kernel Sloppiness
        CCACHECONF="$CCACHE_DIR/ccache.conf"

        grep -q "sloppiness" "$CCACHECONF" 2>/dev/null || cat >> "$CCACHECONF" <<EOF
        sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
        EOF

        # Ensure Size is Respected
        ccache -M "$CCACHE_MAXSIZE" || echo "⚠️ Max Size Not Found"

        echo "📊 Compiler Cache (Runtime) Configured"
        ccache -p

        # Rust Environment Setup
        if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
          echo "🦀 Configuring Rust Environment..."

          # Rust Prebuilts Version
          RUSTPREBUILT="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/rust/linux-x86"
          RUSTCPATH="$RUSTPREBUILT/$VERSIONRUSTC/bin/rustc"

          # Validate Rust Compiler
          if [[ -x "$RUSTCPATH" ]]; then
            export PATH="$(dirname "$RUSTCPATH"):$PATH"
            export RUSTC="$RUSTCPATH"

            echo "📌 Rust Compiler Detected"
            echo "📦 Binary : $RUSTCPATH"
            echo "📦 Version: $("$RUSTCPATH" --version)"
          else
            echo "⚠️ Rust Compiler Not Found"
            echo "📌 Expected: $RUSTCPATH"
            echo "📂 Rust Prebuilt Directory: $RUSTPREBUILT"
            echo ""
            echo "🔍 Available Rust Prebuilts:"
            find "$RUSTPREBUILT" -maxdepth 4 -type f -name rustc -print 2>/dev/null || true
            exit 1
          fi

          # Bindgen Detection and Automatic Fallback
          BINDGENBIN=""
          for f in \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang-tools/linux-x86/bin/bindgen" \
            "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang-tools/linux-x86/bin/bindgen"
          do
            [[ -x "$f" ]] && BINDGENBIN="$f" && break
          done

          # Use Prebuilt Bindgen
          if [[ -x "$BINDGENBIN" ]]; then
            export BINDGEN="$BINDGENBIN"
            echo "📌 Bindgen Detected"
            echo "📦 Binary : $BINDGENBIN"
            echo "📦 Version: $($BINDGENBIN --version | head -n1)"
          # Fallback to Cargo Install
          else
            echo "⚠️ Prebuilt Bindgen Not Found"
            echo "📥 Falling Back to Cargo Installation (bindgen-cli 0.69.5)"
            echo "⚙️ Installing Cargo Fallback..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none
            source "$HOME/.cargo/env"
            cargo install bindgen-cli --version 0.69.5
            echo "📥 Installing Bindgen..."
            BINDGENBIN="$(command -v bindgen || true)"
            if [[ -x "$BINDGENBIN" ]]; then
              export BINDGEN="$BINDGENBIN"
              echo "📜 Bindgen Installed Successfully"
              echo "📦 Binary  : $BINDGENBIN"
              echo "📦 Version : $($BINDGENBIN --version | head -n1)"
            else
              echo "⚠️ Bindgen Installation Failed"
              echo "fallbackreason=missingbindgen" >> "$GITHUB_OUTPUT"
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              export FALLBACKSET=1
              exit 0
            fi
          fi

          # Configure Lib Clang Path
          export LIBCLANG_PATH="$PWD/$(dirname "$CLANGBIN")/lib"
          echo "📂 Lib Clang Path : $LIBCLANG_PATH"
        fi

        # Pahole Detection and Fallback
        PAHOLEBIN=""
        for f in \
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin/pahole" \
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/kernel-build-tools/linux-x86/bin/pahole"
        do
          [[ -x "$f" ]] && PAHOLEBIN="$f" && break
        done

        # Fallback to Path Lookup
        if [[ -z "$PAHOLEBIN" ]]; then
          PAHOLEBIN="$(command -v pahole 2>/dev/null || true)"
          if [[ -x "$PAHOLEBIN" ]]; then
            echo "⚠️ Using Pahole from System PATH"
            echo "📦 Binary : $PAHOLEBIN"
          fi
        fi

        # Final Validation
        if [[ -x "$PAHOLEBIN" ]]; then
          export PAHOLE="$PAHOLEBIN"
          echo "📌 Pahole Detected"
          echo "📦 Binary  : $PAHOLEBIN"
          echo "🔍 Binary Validation"
          echo "📦 Pahole  : $PAHOLEBIN"
          echo "🔍 Toolchain Validation"
          echo "📦 Clang   : $(command -v clang)"
          echo "📦 LD.LLD  : $(command -v ld.lld)"
          echo "📦 LLVM-AR : $(command -v llvm-ar)"
          echo "📦 Pahole  : ${PAHOLEBIN:-missing}"
          echo ""
        else
          echo "⚠️ Pahole Not Found"
          echo "⚠️ BTF Generation Cannot Continue"
          echo "fallbackreason=missingpahole" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # Kleaf Clang Fallback Detection
        if [[ -z "${CLANGPREBUILTBIN:-}" ]]; then
          echo "🔍 Attempting Kleaf Clang Detection..."
          _kleaf_clang="$(
            grep -rh 'clang-r[0-9a-z]\+' \
              ./build/kernel/kleaf/ \
              ./common/build/kernel/kleaf/ \
              --include='*.bzl' 2>/dev/null \
            | grep -oP 'clang-r[0-9a-z]+' \
            | sort | uniq -c | sort -rn \
            | awk '{print $2; exit}'
          )"
          if [[ -n "$_kleaf_clang" ]]; then
            _kleaf_prebuilts="$(
              grep -rh 'prebuilts[^ "'"'"']*clang' \
                ./build/kernel/kleaf/ \
                ./common/build/kernel/kleaf/ \
                --include='*.bzl' 2>/dev/null \
              | grep -oP 'prebuilts[a-z-]*' \
              | sort | uniq -c | sort -rn \
              | awk '{print $2; exit}'
            )"
            CLANGPREBUILTBIN="${_kleaf_prebuilts:-prebuilts}/clang/host/linux-x86/${_kleaf_clang}/bin"
            echo "✔️ Kleaf Clang Detected"
            echo "📂 Path: $CLANGPREBUILTBIN"
          else
            echo "⚠️ Kleaf Clang Detection Failed"
          fi
        fi

        # Enter Kernel Source Directory
        if [[ -f ./common/Makefile ]]; then
          cd ./common
        else
          echo "⚠️ Common Directory Not Found!"
          exit 1
        fi

        # Physical Path Remapping
        ROOTREALPATH=$(realpath ../..) || {
          echo "⚠️ Real Path Failed"
          exit 1
        }

        # Normalize Root Real Path
        ROOTREALPATH="${ROOTREALPATH%/}"

        # Build KCFLAGS as Array Structured
        KCFLAGS=(
          -fdebug-prefix-map="${ROOTREALPATH}=."
          -fmacro-prefix-map="${ROOTREALPATH}=."
          -ffile-prefix-map="${ROOTREALPATH}=."
          -no-canonical-prefixes
          -Wno-error
          -O2
          -pipe
          -D__ANDROID_COMMON_KERNEL__
        )

        # Convert to Space-Separated String for Make
        KCFLAGS="${KCFLAGS[*]}"

        # Prepare Make Arguments
        MAKE_ARGS=(
          LLVM=1
          ARCH=arm64
          CROSS_COMPILE=aarch64-linux-gnu-
          CC="ccache clang"
          HOSTCC="ccache clang"
          LD=ld.lld
          HOSTLD=ld.lld
          PAHOLE="$PAHOLEBIN"
          KCFLAGS="$KCFLAGS"
        )

        [[ "$USE_LLVM_IAS" == "true" ]] && MAKE_ARGS=(LLVM_IAS=1 "${MAKE_ARGS[@]}")
        [[ "${ENABLERUSTC:-false}" == "true" ]] && MAKE_ARGS=(RUSTC="$RUSTCPATH" "${MAKE_ARGS[@]}")

        # Kernel Configuration and Compilation
        echo ">> 🚀 Running GKI Default Configuration"
        if ! make O=out ARCH=arm64 "${MAKE_ARGS[@]}" gki_defconfig; then
          echo "⚠️ GKI Default Configuration Failed"
          echo "fallbackreason=gkidefconfigfailed" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # Link Time Optimization (LTO) Configuration
        echo "🧾 Configuring Link Time Optimization (LTO) Configuration for Kernel $KERNELVERSION"

        # 1️⃣ Check Kernel Configuration
        if [[ ! -s out/.config ]]; then
          echo "⚠️ Configuration Not Found — Skipping Link Time Optimization (LTO) Configuration"
          echo "📊 Link Time Optimization (LTO) Status: Skipped (Reason: Missing Scripts / Configuration)"
        else
          # Auto-Detect Scripts / Configuration Location
          CONFIGTOOL=""
          for path in ../scripts/config ./scripts/config ../../scripts/config; do
            if [[ -x "$path" ]]; then
              CONFIGTOOL="$path"
              break
            fi
          done

          if [[ -z "$CONFIGTOOL" ]]; then
            CONFIGTOOL=$(find .. -type f -path "*/scripts/config" -executable 2>/dev/null | head -n1 || true)
          fi

          # Validation
          [[ -n "$CONFIGTOOL" ]] && [[ ! -x "$CONFIGTOOL" ]] && CONFIGTOOL=""

          # 2️⃣ Check Scripts / Configuration Separately
          if [[ -z "$CONFIGTOOL" ]]; then
            echo "⚠️ Scripts / Configuration Not Found — Skipping Link Time Optimization (LTO) Configuration"
            echo "📊 Link Time Optimization (LTO) Status: Skipped (Reason: ⚠️ Missing Scripts / Configuration)"
          else
            case "$KERNELVERSION" in
              5.*)
                echo ">> 🚀 Link Time Optimization (LTO): Thin"
                "$CONFIGTOOL" --file out/.config \
                  -e LTO_CLANG \
                  -e LTO_CLANG_THIN \
                  -d LTO_CLANG_NONE \
                  -d LTO_CLANG_FULL \
                  || echo "⚠️ Link Time Optimization (LTO) Configuration Apply Failed"
                echo "📊 Link Time Optimization (LTO) Status: Applied (Thin)"
                ;;
              *)
                echo "⚠️ Link Time Optimization (LTO) skipped for Kernel $KERNELVERSION"
                echo "📊 Link Time Optimization (LTO) Status: Skipped (Reason: ⚠️ Unsupported Kernel Version)"
                ;;
            esac
          fi
        fi

        # Final Default Configuration and Build
        echo ">> 🚀 Running Old Default Configuration"
        if ! make O=out "${MAKE_ARGS[@]}" olddefconfig; then
          echo "⚠️ Old Default Configuration Failed"
          echo "fallbackreason=olddefconfigfailed" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        # System Resource Information
        echo "💻 CPU Threads: $(nproc)"
        echo "💾 Memory:"
        free -h || true
        echo ">> 🧾 Compiling Kernel with $(nproc) Threads"
        if ! make -j"$(nproc)" O=out "${MAKE_ARGS[@]}"; then
          echo "⚠️ Kernel Compilation Failed"
          echo "fallbackreason=compilefailed" >> "$GITHUB_OUTPUT"
          echo "fallback=true" >> "$GITHUB_OUTPUT"
          export FALLBACKSET=1
          exit 0
        fi

        echo "📊 Compiler Cache Statistics"
        ccache -s || true
        FASTBUILDEND=$(date +%s)
        FASTBUILDTIME=$((FASTBUILDEND - FASTBUILDSTART))
        echo "fastbuildtime=$FASTBUILDTIME" >> "$GITHUB_OUTPUT"
        echo "⏱️ Fast Build Time: ${FASTBUILDTIME}s"
        echo "fastbuildstatus=success" >> "$GITHUB_OUTPUT"

        echo ""
        echo "🎉 Fast Build Completed Successfully"

    - name: 🔧 Build Kernel (Fallback)
      if: ${{ steps.fastbuild.outputs.fallback == 'true' || inputs.fastbuild != 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "⚠️ Failure on line $LINENO"' ERR
        FALLBACKSTART=$(date +%s)

        # Navigate
        cd kernel_workspace/kernel_platform || {
          echo "⚠️ kernel_platform Directory Not Found"
          exit 1
        }

        # Environment Variables
        FILEBASE="${FILEBASE:-${MANIFESTBASEFILE}}"
        CPU="${CPU:-$CPUD}"
        CPU="${CPU:-Unknown}"
        KERNELMODULE="${KERNELMODULE}"
        METHOD="${METHOD:-${BUILDMETHOD}}"
        METHOD="${METHOD:-Perf}"
        ANDROIDVERSION="${ANDROIDVERSION:-${ANDROIDVERSION}}"
        KERNELVERSION="${KERNELVERSION:-${KERNELVERSION}}"
        GKIV="${ANDROIDVERSION}-${KERNELVERSION}"

        # Fast Build Metadata
        FALLBACKREASON="${{ steps.fastbuild.outputs.fallbackreason }}"
        FASTBUILDTIME="${{ steps.fastbuild.outputs.fastbuildtime }}"
        FALLBACKREASON="${FALLBACKREASON:-Unknown}"
        FASTBUILDTIME="${FASTBUILDTIME:-0}"

        echo "🚀 Kernel Fallback Build..."
        echo "📂 Manifest : ${FILEBASE}"
        echo "📱 Target   : ${CPU}"
        echo "⚙️ Method   : ${METHOD}"
        echo "🧩 Version  : ${GKIV}"
        echo ""
        echo "⚠️ Fallback Reason : ${FALLBACKREASON}"

        if [[ "${FASTBUILDTIME}" != "0" ]]; then
          echo "⚡ Fast Build Runtime : ${FASTBUILDTIME}s"
        else
          echo "⚡ Fast Build : Skipped"
        fi

        echo ""

        # Restore Fast Build Cache
        echo "📥 Restoring Fast Build Cache..."
        mkdir -p out
        if [[ -d ../cache ]]; then
          [[ -f ../cache/.config ]] && cp -f ../cache/.config out/.config
          [[ -d ../cache/include ]] && cp -rf ../cache/include out/
          [[ -f ../cache/Module.symvers ]] && cp -f ../cache/Module.symvers out/
          echo "💻 Cache Restored"
        else
          echo "⚠️ No Fast Build Cache Found"
          echo "📌 Performing Full Rebuild"
        fi

        echo ""

        # Fix Recursive Symlink Issue
        echo "🧹 Cleaning Recursive Symlink Loops..."
        BROKENLINKS=(
          "common/out/source"
          "msm-kernel/out/source"
        )
        for link in "${BROKENLINKS[@]}"; do
          if [[ -L "$link" ]]; then
            echo "⚠️ Removing Symlink:"
            echo "   $link"
            rm -f "$link"
          fi
        done

        echo ""

        # Clean Bazel State
        if command -v bazel >/dev/null 2>&1; then
          echo "🧹 Cleaning Bazel Build State..."
          bazel clean --async || \
            echo "⚠️ Bazel Clean Failed (Ignored)"
        fi

        echo ""

        # Build Flags
        export KMI_SYMBOL_LIST_STRICT_MODE="${KMI_SYMBOL_LIST_STRICT_MODE:-0}"
        export BUILD_SYSTEM_DLKM="${BUILD_SYSTEM_DLKM:-0}"
        export SYSTEM_DLKM_RE_SIGN="${SYSTEM_DLKM_RE_SIGN:-0}"

        # Detect Build System
        BAZELSCRIPT=""
        OPLUSSCRIPT=""
        if [[ -f "build_with_bazel.py" ]]; then
          BAZELSCRIPT="build_with_bazel.py"
        elif [[ -f "build/build_with_bazel.py" ]]; then
          BAZELSCRIPT="build/build_with_bazel.py"
        elif [[ -f "oplus/build/oplus_build_kernel.sh" ]]; then
          OPLUSSCRIPT="oplus/build/oplus_build_kernel.sh"
        fi

        # Execute Build
        if [[ -n "${BAZELSCRIPT}" ]]; then
          echo "🔎 Detected Bazel / Kleaf Build System"
          echo "📄 Script : ${BAZELSCRIPT}"

          # OPlus Variant Generator
          if [[ -f "oplus/bazel/oplus_modules_variant.sh" ]]; then
            chmod +x oplus/bazel/oplus_modules_variant.sh

            ./oplus/bazel/oplus_modules_variant.sh \
              "${CPU}" \
              "${METHOD}"
          fi

          # Build
          python3 "${BAZELSCRIPT}" \
            -t "${CPU}" \
            "${METHOD}"

        elif [[ -n "${OPLUSSCRIPT}" ]]; then
          echo "🔎 Detected Legacy OPlus Build System"
          echo "📄 Script : ${OPLUSSCRIPT}"
          echo ""

          chmod +x "${OPLUSSCRIPT}"

          bash "${OPLUSSCRIPT}" \
            "${CPU}" \
            "${METHOD}"

        else
          echo "⚠️ No Valid Build System Found"
          echo ""

          echo "📂 Current Directory:"
          pwd

          echo ""
          echo "📄 Available Build Files:"
          find . -maxdepth 4 \( \
            -name "*.py" -o \
            -name "*.sh" -o \
            -name "WORKSPACE" -o \
            -name "MODULE.bazel" \
          \)
          exit 1
        fi

        # Build Timing
        FALLBACKEND=$(date +%s)
        FALLBACKTIME=$((FALLBACKEND - FALLBACKSTART))
        TOTALTIME=$((FALLBACKTIME + FASTBUILDTIME))

        echo ""
        echo "------------------------------"
        echo "🎉 Kernel Build Complete"
        echo "------------------------------"
        echo ""
        echo "⚡ Fast Build     : ${FASTBUILDTIME}s"
        echo "🐢 Fallback Build : ${FALLBACKTIME}s"
        echo "🕒 Total Runtime  : ${TOTALTIME}s"

        # GitHub Step Summary
        {
          echo "## 📊 Kernel Build Summary"
          echo ""

          echo "### ⚡ Build Performance"
          echo "- Fast Build: ${FASTBUILDTIME}s"
          echo "- Fallback Build: ${FALLBACKTIME}s"
          echo "- Total Runtime: ${TOTALTIME}s"
          echo ""

          echo "### 🧾 Build Information"
          echo "- CPU: ${CPU}"
          echo "- Method: ${METHOD}"
          echo "- Version: ${GKIV}"
          echo ""

          echo "### ⚠️ Fallback Reason"
          echo "- ${FALLBACKREASON}"

        } >> "${GITHUB_STEP_SUMMARY}"
