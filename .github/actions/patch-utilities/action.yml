name: Patch Utilities
description: Provides Reusable Patch Helper Functions for GitHub Actions Workflows

runs:
  using: composite
  steps:
    - name: Initialize Patch Utilities
      shell: bash
      run: |
        set -euo pipefail

        # Create the Helper Script in the Runner's Temporary Directory
        PATCH_UTILS="${RUNNER_TEMP}/patch-utils.sh"

        cat > "${PATCH_UTILS}" <<'EOF'
        #!/usr/bin/env bash

        # Scan a Directory Recursively for Patch Reject (*.rej) Files and
        # Display Detailed Information About Each Rejected Hunk
        checkrejects() {
          local SEARCHDIR="${1:-.}"
          local REJFILES

          REJFILES=$(find "$SEARCHDIR" -type f -name "*.rej" 2>/dev/null)
          [[ -z "$REJFILES" ]] && return 0

          while IFS= read -r REJFILE; do
            local ORIGFILE="${REJFILE%.rej}"
            ORIGFILE="${ORIGFILE#./}"

            local FAILEDHUNKS
            FAILEDHUNKS=$(grep -c '^@@ ' "$REJFILE" 2>/dev/null || true)

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚠️ Patch Reject Detected"
            echo "📝 Reject File  : ${REJFILE}"
            echo "📄 Target File  : ${ORIGFILE}"
            echo "❌ Failed Hunks : ${FAILEDHUNKS:-0}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cat "${REJFILE}"
            echo
          done <<< "${REJFILES}"
        }

        # Trap Handler for Failed Patch Operations
        rejecthandler() {
          local EXITCODE=$?

          trap - ERR

          echo "❌ Patch Application Failed"
          echo "🔍 Searching for Reject (*.rej) Files..."

          checkrejects .

          exit "${EXITCODE}"
        }
        EOF

        chmod +x "${PATCH_UTILS}"

        # Export the Helper Script Path for Subsequent Workflow Steps
        echo "PATCH_UTILS=${PATCH_UTILS}" >> "${GITHUB_ENV}"

        echo "Patch Utilities Initialized"
