name: Patch Utilities
description: Common patch helper functions

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}"

        cat > "${RUNNER_TEMP}/patch-utils.sh" <<'EOF'
        #!/usr/bin/env bash

        checkrejects() {
          local SEARCHDIR="${1:-.}"
          local REJFILES

          REJFILES=$(find "$SEARCHDIR" -name "*.rej" 2>/dev/null)
          [[ -z "$REJFILES" ]] && return 0

          while IFS= read -r REJFILE; do
            local ORIGFILE="${REJFILE%.rej}"
            ORIGFILE="${ORIGFILE#./}"
            local FAILEDHUNKS
            FAILEDHUNKS=$(grep -c '^@@ ' "$REJFILE" 2>/dev/null)

            echo "⚠️ Patch Reject Detected"
            echo "📝 Reject File  : $REJFILE"
            echo "📄 Target File  : $ORIGFILE"
            echo "⚠️ Failed Hunks : ${FAILEDHUNKS:-0}"
            echo
            cat "$REJFILE"
          done <<< "$REJFILES"
        }

        rejecthandler() {
          local EXITCODE=$?

          trap - ERR

          echo "⚠️ Patch Application Failed"
          echo "🔍 Scanning for Reject Files..."

          checkrejects .

          exit "$EXITCODE"
        }
        EOF

        chmod +x "${RUNNER_TEMP}/patch-utils.sh"

        echo "PATCH_UTILS=${RUNNER_TEMP}/patch-utils.sh" >> "$GITHUB_ENV"
