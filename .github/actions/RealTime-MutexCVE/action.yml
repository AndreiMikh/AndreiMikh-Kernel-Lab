# Real-Time Mutex CVE Fix
name: 🛡️ Apply Real-Time Mutex CVE Fix
description: Validate, Apply and Verify Real-Time Mutex CVE Fix in Kernel Source
# Composite Action Configuration
runs:
  using: composite
  steps:
    # Apply and Verify Real-Time Mutex CVE Fix
    - name: 🛡️ Apply and Verify Real-Time Mutex CVE Fix
      shell: bash
      # Import Environment Variable
      env:
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Navigate to the Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # Define Real-Time Mutex Source Files Affected by the CVE Fix
        RTMUTEX="kernel/locking/rtmutex.c"
        RTMUTEXAPIC="kernel/locking/rtmutex_api.c"
        # Display Real-Time Mutex Fix Information
        echo "└─ 🛡️ Checking Real-Time Mutex CVE Fix Compatibility..."
        echo "└─ 📂 Kernel Directory : $COMMONKERNELFOLDER"
        # Validate All Required Real-Time Mutex Source Files
        for TARGET in "$RTMUTEX" "$RTMUTEXAPIC"; do
          if [[ ! -f "$TARGET" ]]; then
            echo "└─ ⚠️ Required Real-Time Mutex Source File Not Found : $TARGET"
            exit 1
          fi

          echo "└─ 📌 Found : $TARGET"
          
        done

        # Check Whether the Kernel Contains the Expected Pre-Fix Code
        # Confirm All Three Original Code Patterns Match Before Applying Changes
        if grep -qF $'raw_spin_lock(&current->pi_lock);\n\trt_mutex_dequeue(lock, waiter);\n\tcurrent->pi_blocked_on = NULL;\n\traw_spin_unlock(&current->pi_lock);' "$RTMUTEX" &&
           grep -qF 'next_lock, NULL, current);' "$RTMUTEX" &&
           grep -qF $'if (unlikely(ret))\n\t\tremove_waiter(lock, waiter);' "$RTMUTEXAPIC"; then
          # Expected Pre-Fix Code Detected
          echo "└─ ⚙️ Compatible Kernel Detected..."
          echo "└─ 🩹 Applying Real-Time Mutex CVE Fix..."
          # Replace Unsafe Waiter Task Handling
          # Retrieve Actual Waiter Task Before Accessing its Priority-Inheritance Lock
          # Skip the Update if Waiter Task is No Longer Available
          # Protect Waiter State Updates with Waiter Task's PI Lock
          perl -0pi -e '
            my $old = qr/\traw_spin_lock\(&current->pi_lock\);\n\trt_mutex_dequeue\(lock, waiter\);\n\tcurrent->pi_blocked_on = NULL;\n\traw_spin_unlock\(&current->pi_lock\);/;
            my $new = "\tstruct task_struct *waiter_task = waiter->task;\n\n\tif (!waiter_task)\n\t\treturn;\n\n\tscoped_guard(raw_spinlock, &waiter_task->pi_lock) {\n\t\trt_mutex_dequeue(lock, waiter);\n\t\twaiter_task->pi_blocked_on = NULL;\n\t}";
            die "rtmutex waiter block not found\n" unless s/$old/$new/ == 1;
          ' "$RTMUTEX"
          # Use Actual Waiter Task For Priority-Inheritance Chain Processing
          # Replace Current Task Argument with Waiter Task
          perl -0pi -e '
            die "rtmutex priority chain target not found\n"
              unless s/next_lock, NULL, current\);/next_lock, NULL, waiter_task);/ == 1;
          ' "$RTMUTEX"
          # Fix Real-Time Mutex Proxy Lock Error Handling
          # Remove Waiter Only When Return Value Indicates an Error
          perl -0pi -e '
            die "rtmutex proxy lock condition not found\n"
              unless s/if \(unlikely\(ret\)\)\n\t\tremove_waiter\(lock, waiter\);/if (unlikely(ret < 0))\n\t\tremove_waiter(lock, waiter);/ == 1;
          ' "$RTMUTEXAPIC"
          # Verify All Expected CVE Fix Changes
          # Confirm Waiter Task, PI Lock and Blocked-On Updates
          # Also Verify Priority-Inheritance Argument and Error Condition
          if grep -qF 'struct task_struct *waiter_task = waiter->task;' "$RTMUTEX" &&
             grep -qF 'if (!waiter_task)' "$RTMUTEX" &&
             grep -qF 'scoped_guard(raw_spinlock, &waiter_task->pi_lock)' "$RTMUTEX" &&
             grep -qF 'waiter_task->pi_blocked_on = NULL;' "$RTMUTEX" &&
             grep -qF 'next_lock, NULL, waiter_task);' "$RTMUTEX" &&
             grep -qF $'if (unlikely(ret < 0))\n\t\tremove_waiter(lock, waiter);' "$RTMUTEXAPIC"; then
            # All Expected Changes Were Detected
            echo "└─ 🎉 Real-Time Mutex CVE Fix Applied and Verified"
          else
            # Fail Step if Any Expected Change is Missing
            echo "└─ ⚠️ Real-Time Mutex CVE Fix Verification Failed"
            exit 1
          fi

        else
          # Skip Kernels That Do Not Match Expected Pre-Fix Code
          # This Also Skips Kernels That May Already Contain the Fix
          echo "└─ ℹ️ Kernel is Not Compatible with Expected Pre-Fix Real-Time Mutex Code"
          echo "└─ ⏭️ Skipping..."
        fi
