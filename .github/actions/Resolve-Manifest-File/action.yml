name: 📄 Resolve Manifest File Configuration
description: Resolve Device Name to Manifest Configuration File Name
inputs:
  FILE:
    description: Device Name
    required: true
outputs:
  file:
    description: Resolved Manifest Configuration File Name
    value: ${{ steps.resolve-file.outputs.file }}
runs:
  using: composite
  steps:
    - name: 📄 Resolve Manifest Configuration
      id: resolve-file
      shell: bash
      # Pass the Selected Device Name Into the Composite Action
      env:
        INPUTFILE: ${{ inputs.FILE }}
      run: |
        set -Eeuo pipefail
        # Remove Leading and Trailing Whitespace
        INPUTFILE="${INPUTFILE#"${INPUTFILE%%[![:space:]]*}"}"
        INPUTFILE="${INPUTFILE%"${INPUTFILE##*[![:space:]]}"}"
        # Validate Selected Device Name
        if [[ -z "$INPUTFILE" ]]; then
          echo "⚠️ Device Name Cannot be Empty"
          exit 1
        fi

        # Resolve Device Names by SoC Generation, From Older to Newer
        # Custom, Wild and Canary Variants Retain Their Original Manifest Names
        case "$INPUTFILE" in             
          # Qualcomm SM8850
          1+15)                  FILE="oneplus_15" ;;
          1+15-Wild)             FILE="oneplus_15_w" ;;
          1+15-Canary)           FILE="oneplus_15_canary" ;;
          1+15-Custom)           FILE="oneplus_15_custom" ;;
          1+15T)                 FILE="oneplus_15t" ;;
          1+15T-Canary)          FILE="oneplus_15t_canary" ;;
          1+Pad3Pro-Canary)      FILE="oneplus_pad3_pro_canary" ;;
          1+Pad4)                FILE="oneplus_pad_4" ;;
          1+Pad4-Canary)         FILE="oneplus_pad_4_canary" ;; 
          # Qualcomm SM8845
          1+15R)                 FILE="oneplus_15r" ;;
          1+15R-Canary)          FILE="oneplus_15r_canary" ;;
          1+Ace6T)               FILE="oneplus_ace_6t" ;;
          1+Ace6T-Canary)        FILE="oneplus_ace_6t_canary" ;;        
          # Qualcomm SM8735
          1+Turbo6)              FILE="oneplus_turbo_6" ;;
          1+Nord6)               FILE="oneplus_nord_6" ;; 
          # Qualcomm SM8750
          1+13)                  FILE="oneplus_13_b" ;;
          1+13-China)            FILE="oneplus_13_china" ;;
          1+13-Custom)           FILE="oneplus_13_custom" ;;
          1+13-Wild)             FILE="oneplus_13_wild" ;;
          1+13T)                 FILE="oneplus_13t_b" ;;
          1+13S)                 FILE="oneplus_13s_b" ;;
          1+Ace5Pro)             FILE="oneplus_ace5_pro_b" ;;
          1+Ace6)                FILE="oneplus_ace_6" ;;
          1+Pad2Pro)             FILE="oneplus_pad_2_pro_b" ;;
          1+Pad3)                FILE="oneplus_pad_3_b" ;;
          # Qualcomm SM8650
          1+12)                  FILE="oneplus_12_b" ;;
          1+12-Custom)           FILE="oneplus_12_custom" ;;
          1+13R)                 FILE="oneplus_13r_b" ;;
          1+Ace3Pro)             FILE="oneplus_ace3_pro_b" ;;
          1+Ace5)                FILE="oneplus_ace5_b" ;;
          1+Pad2)                FILE="oneplus_pad2_b" ;;
          1+PadPro)              FILE="oneplus_pad_pro_b" ;;
          # Qualcomm SM8635
          1+Nord5)               FILE="oneplus_nord_5_b" ;;
          # Qualcomm SM8550
          1+11)                  FILE="oneplus_11_b" ;;
          1+12R)                 FILE="oneplus_12r_b" ;;
          1+Ace2Pro)             FILE="oneplus_ace2_pro_b" ;;
          1+Ace3)                FILE="oneplus_ace3_b" ;;
          1+Open)                FILE="oneplus_open_b" ;;
          # Qualcomm SM8475
          1+10T)                 FILE="oneplus_10t_v" ;;
          1+11R)                 FILE="oneplus_11r_b" ;;
          1+Ace2)                FILE="oneplus_ace2_b" ;;
          # Qualcomm SM8450
          1+10Pro)               FILE="oneplus_10_pro_b" ;;
          # Qualcomm SM7675
          1+Ace3V)               FILE="oneplus_ace_3v_b" ;;
          1+Nord4)               FILE="oneplus_nord_4_b" ;;
          # Qualcomm SM7635
          1+NordCE6)             FILE="oneplus_nord_ce6" ;;
          1+Turbo6V)             FILE="oneplus_turbo_6v" ;;
          # Qualcomm SM7550
          1+NordCE4)             FILE="oneplus_nord_ce4_b" ;;
          # Qualcomm SM6375
          1+NordCE4Lite5G)       FILE="oneplus_nord_ce4_lite_5g_b" ;;
          # MediaTek 6993
          1+Ace6Ultra)           FILE="oneplus_ace6_ultra" ;;
          # MediaTek MT6991
          1+Ace5Ultra)           FILE="oneplus_ace5_ultra_b" ;;
          1+Pad2-MT6991)         FILE="oneplus_pad2_mt6991_b" ;;
          # MediaTek MT6989
          1+Ace5Race)            FILE="oneplus_ace5_race_b" ;;
          # MediaTek MT6983
          1+Nord3)               FILE="oneplus_nord_3_b" ;;
          1+Ace2V)               FILE="oneplus_ace_2v_b" ;;
          1+Pad-MT6983)          FILE="oneplus_pad_mt6983_b" ;;
          # MediaTek MT6897
          1+NordCE5)             FILE="oneplus_nord_ce5_b" ;;
          1+Pad-MT6897)          FILE="oneplus_pad_mt6897_b" ;;
          # MediaTek MT6878
          1+NordCE6-Lite)        FILE="oneplus_nord_ce6_lite_b" ;;
          1+PadGo2)              FILE="oneplus_pad_go_2_b" ;;
          1+Turbo6X)             FILE="oneplus_turbo_6x_b" ;;
          # MediaTek MT6835                  
          1+N6X)                 FILE="oneplus_n6x_b" ;;
          1+N6X-Wild)            FILE="oneplus_n6x_w" ;;
          # MediaTek MT6789
          1+PadLite)             FILE="oneplus_pad_lite_b" ;;
          # Stop When Device Name is Not Supported
          *)
            echo "⚠️ Unsupported Device : $INPUTFILE"
            exit 1
            ;;
        esac
        # Export Resolved Manifest File Name to Subsequent Workflow Steps
        echo "FILE=$FILE" >> "$GITHUB_ENV"
        # Publish Resolved File Name as Composite Action Output
        echo "file=$FILE" >> "$GITHUB_OUTPUT"
        # Display Selected Device and Resolved Manifest File Name
        echo "└─ 📄 Selected Device : $INPUTFILE"
        echo "└─ 📄 Resolved File   : $FILE"
