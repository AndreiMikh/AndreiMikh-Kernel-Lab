# Kernel Cache Save Composite Action
name: 💾 Kernel Cache Save
description: Save ThinLTO and Compiler Build Cache
# Define Inputs Required by Composite Action
inputs:
  # Define Kernel Version Used to Determine ThinLTO Cache Compatibility
  KERNELVERSION:
    description: Kernel Version
    required: true
  # Define Whether ThinLTO Cache was Successfully Restored
  # Prevent Saving When an Existing ThinLTO Cache was Already Restored
  THINLTOCACHEHIT:
    description: Whether ThinLTO Cache was Restored
    required: false
    default: 'false'
  # Define Whether CCache Should be Saved After Compilation
  CCACHESAVE:
    description: Whether CCache Should be Saved
    required: false
    default: 'false'
  # Define Whether a GitHub Actions CCache was Already Restored
  CCACHERESTORED:
    description: Whether CCache was Restored
    required: false
    default: 'false'
  # Define Whether a Local CCache was Found
  LOCALCACHEHIT:
    description: Whether Local CCache Was Found
    required: false
    default: 'false'
  # Define Kernel Configuration Used to Generate Cache Key
  FILE:
    description: Kernel Configuration
    required: true
  # Define CPU Architecture Used to Generate Cache Key
  CPU:
    description: CPU Architecture
    required: true
runs:
  using: composite
  steps:
    # Save ThinLTO Cache
    # ThinLTO Cache is Only Used For Linux 5.x Kernel Builds
    # Skip Saving When the Cache was Already Successfully Restored
    - name: 💾 Save ThinLTO Cache
      if: ${{ startsWith(inputs.KERNELVERSION, '5.') && inputs.THINLTOCACHEHIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        # Define ThinLTO Cache Directory
        path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
        # Generate Unique Cache Key Using Runner OS, Branch, Kernel Configuration and Kernel Version
        key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.FILE }}-${{ inputs.KERNELVERSION }}

    # Save Compiler Build Cache
    # Skip When CCache is Disabled
    # Skip When CCache Saving is Not Requested
    # Skip When a GitHub Actions Cache was Already Restored
    # Skip When an Existing Local CCache was Found
    - name: 💾 Save Build Cache
      if: ${{ env.BUILDCCACHE != 'Disabled' && inputs.CCACHESAVE == 'true' && inputs.CCACHERESTORED != 'true' && inputs.LOCALCACHEHIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        # Define Compiler Build Cache Directory
        path: ${{ env.CCACHE_DIR }}
        # Generate Unique Cache Key Using Runner OS, Kernel Configuration, CPU Architecture and Branch
        key: CCache-${{ runner.os }}-${{ inputs.FILE }}-${{ inputs.CPU }}-${{ github.ref_name }}
        
