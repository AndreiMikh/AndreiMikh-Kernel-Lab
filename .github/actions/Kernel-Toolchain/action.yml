name: 🧰 Kernel Toolchain Setup
description: Detect Rust, Configure Clang and Bindgen and Test Kernel Toolchain Integration
outputs:
  enablerustc:
    description: Whether Rust Compiler Support is Enabled
    value: ${{ steps.rust-compiler.outputs.enablerustc }}
  versionrustc:
    description: Rust Compiler Version Used For Paths
    value: ${{ steps.rust-compiler.outputs.versionrustc }}
  rawrustc:
    description: Raw Rust Compiler Version
    value: ${{ steps.rust-compiler.outputs.rawrustc }}
runs:
  using: composite
  steps:
    - name: 🦀 Detect Rust Compiler
      id: rust-compiler
      shell: bash
      # Import Environment Variables
      env:
        KERNELPLATFORM: ${{ env.KERNELPLATFORM }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # State
        ENABLERUSTC="false"
        VERSIONRUSTC=""
        RAWRUSTC=""
        # Navigate Kernel Directory
        cd "$KERNELPLATFORM"
        # Paths Relative to Kernel Platform
        FCONFIG="${COMMONKERNELFOLDER}/build.config.constants"
        RUSTBIN="./prebuilts/rust/linux-x86/bin/rustc"
        # Detect Rust From Build Configuration Constants
        if [[ -f "$FCONFIG" ]]; then
          echo "└─ [Info] 🔎 Checking Build Configuration Constants..."
          # Prefer Modern AOSP Key
          RAWRUSTC="$(
            awk -F= '/^RUSTC_VERSION=/{print $2}' "$FCONFIG" \
              | tr -d '"' \
              | head -n1
          )"
          # Fallback to Legacy / Custom Key : VERSIONRUSTC
          if [[ -z "$RAWRUSTC" ]]; then
            RAWRUSTC="$(
              awk -F= '/^VERSIONRUSTC=/{print $2}' "$FCONFIG" \
                | tr -d '"' \
                | head -n1
            )"
          fi

          if [[ -n "$RAWRUSTC" ]]; then
            echo "└─ [Info] 📌 RUST Version From Configuration (Raw) : $RAWRUSTC"
            # Extract Path-Safe Version
            # Example: 1.81.0 From 1.81.0-Google
            VERSIONRUSTC="$(
              echo "$RAWRUSTC" \
                | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true
            )"
            # Fallback if version extraction fails
            [[ -z "$VERSIONRUSTC" ]] && VERSIONRUSTC="$RAWRUSTC"
            echo "└─ [Info] 📁 RUST Version For Paths    : $VERSIONRUSTC"
            ENABLERUSTC="true"
          else
            echo "└─ [Warn] ⚠️ No RUST Compiler Version Found in Configuration"
          fi
          
        else
          echo "└─ [Warn] ⚠️ Missing Build Configuration Constants"
        fi

        # Fallback : Detect Rust Toolchain Directly
        if [[ "$ENABLERUSTC" == "false" ]]; then
          if [[ -x "$RUSTBIN" ]]; then
            echo "└─ [Info] 📦 Rust Toolchain Detected (Fallback)"
            RAWRUSTC="$("$RUSTBIN" --version | awk '{print $2}')"
            VERSIONRUSTC="$(
              echo "$RAWRUSTC" \
                | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true
            )"
            # Fallback if Version Extraction Fails
            [[ -z "$VERSIONRUSTC" ]] && VERSIONRUSTC="$RAWRUSTC"
            echo "└─ [Info] 🔍 Detected Rustc Version   : $RAWRUSTC"
            echo "└─ [Info] 📁 RUST Version For Paths   : $VERSIONRUSTC"
            ENABLERUSTC="true"
          else
            echo "└─ [Info] ⛔ RUST Toolchain Not Found : $RUSTBIN"
          fi
        fi

        # Final Defaults
        if [[ "$ENABLERUSTC" != "true" ]]; then
          VERSIONRUSTC="None"
          RAWRUSTC="None"
        fi

        # Export to GitHub Environment
        echo "ENABLERUSTC=$ENABLERUSTC" >> "$GITHUB_ENV"
        echo "VERSIONRUSTC=$VERSIONRUSTC" >> "$GITHUB_ENV"
        echo "RAWRUSTC=$RAWRUSTC" >> "$GITHUB_ENV"
        # Export Step Outputs
        echo "enablerustc=$ENABLERUSTC" >> "$GITHUB_OUTPUT"
        echo "versionrustc=$VERSIONRUSTC" >> "$GITHUB_OUTPUT"
        echo "rawrustc=$RAWRUSTC" >> "$GITHUB_OUTPUT"
        # Final Summary
        echo "------------------------------"
        echo "└─ [Info] 🦀 RUST Detection Result"
        echo "------------------------------"
        echo "└─ [Info] Enabled      : $ENABLERUSTC"
        echo "└─ [Info] Raw Version  : $RAWRUSTC"
        echo "└─ [Info] Path Version : $VERSIONRUSTC"
        echo "------------------------------"

    - name: 🧰 Clang Toolchain
      shell: bash
      env:
        KERNELPLATFORM: ${{ env.KERNELPLATFORM }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Navigate to Kernel Platform
        cd "$KERNELPLATFORM"
        # Check Whether Kernel Build Configuration Enables LLVM's Integrated Assembler
        LLVMENABLED="false"
        if [[ -f "./common/build.config.arm" ]] &&
           grep -q '^LLVM_IAS=1' "${COMMONKERNELFOLDER}/build.config.arm"; then
          LLVMENABLED="true"
        fi

        # Resolve Clang Prebuilt Root
        echo "└─ [Info] 🚀 Resolving Clang Toolchain..."
        # Find Prebuilt Toolchain Directory Containing Linux-Hosted Clang Binaries
        CLANGROOT="$(
          find "${KERNELPLATFORM}" \
            -maxdepth 1 \
            -type d \
            -name 'prebuilts*' \
            -exec test -d '{}/clang/host/linux-x86' \; \
            -print |
          sort |
          head -n1
        )"
        [[ -n "$CLANGROOT" ]] || {
          echo "└─ [Warn] ⚠️ Clang Prebuilt Root Not Found"
          exit 1
        }
        CLANGROOT="$(realpath "$CLANGROOT")"
        # Select Newest Available Clang-r* Directory that Contains an Executable Clang Binary
        CLANGDIR="$(
          find "$CLANGROOT/clang/host/linux-x86" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -name 'clang-r*' \
            -exec test -x '{}/bin/clang' \; \
            -print 2>/dev/null |
          sort -V |
          tail -n1
        )"
        [[ -n "$CLANGDIR" ]] || {
          echo "└─ [Warn] ⚠️ No Valid Clang Toolchain Found"
          exit 1
        }
        # Resolve Absolute Toolchain Paths
        CLANGDIR="$(realpath "$CLANGDIR")"
        CLANGBIN="${CLANGDIR}/bin"
        CLANGFULLPATH="${CLANGBIN}/clang"
        # Make Sure Selected Clang Binary is Executable Before Exporting its Paths
        [[ -x "$CLANGFULLPATH" ]] || {
          echo "└─ [Warn] ⚠️ Clang Binary Not Found"
          echo "└─ [Info] 📌 Expected : $CLANGFULLPATH"
          exit 1
        }
        # Read Compiler Version Directly From Selected Clang Binary
        CLANGVERSION="$(
          "$CLANGFULLPATH" --version |
            sed -nE '1{s/.*clang version ([0-9.]+).*/\1/p}'
        )"
        [[ -n "$CLANGVERSION" ]] || {
          echo "└─ [Warn] ⚠️ Unable to Detect Clang Version"
          exit 1
        }
        # Locate Lib Clang For Tools Such as Bindgen that Require Clang Shared Library
        LIBCLANGPATH="$(
          find "$CLANGDIR" \
            -type f \
            \( -name 'libclang.so' -o -name 'libclang.so.*' \) \
            -print 2>/dev/null |
          head -n1 |
          xargs -r dirname
        )"
        # Export Resolved Clang Environment For Subsequent GitHub Actions Steps
        {
          echo "CLANGROOT=$CLANGROOT"
          echo "CLANGDIR=$CLANGDIR"
          echo "CLANGBIN=$CLANGBIN"
          echo "CLANGFULLPATH=$CLANGFULLPATH"
          echo "CLANGVERSION=$CLANGVERSION"
          echo "LLVMENABLED=$LLVMENABLED"
          echo "LIBCLANG_PATH=$LIBCLANGPATH"
          echo "CCACHE_COMPILER=$CLANGFULLPATH"
        } >> "$GITHUB_ENV"
        # Add Selected Clang Binaries to Path For Tools Invoked by Later Steps
        echo "$CLANGBIN" >> "$GITHUB_PATH"
        echo "└─ [Info] 📂 Clang Root      : $CLANGROOT"
        echo "└─ [Info] 📂 Clang Directory : $(basename "$CLANGDIR")"
        echo "└─ [Info] 📂 Clang Bin       : $CLANGBIN"
        echo "└─ [Info] 📂 Clang Version   : $CLANGVERSION"
        echo "└─ [Info] 📂 LLVM IAS        : $LLVMENABLED"
        echo "└─ [Info] 📂 Lib Clang       : ${LIBCLANGPATH:-Unavailable}"
        # Verify that Selected Compiler can Execute and Report its Resource Directory
        echo "└─ [Info] 🔎 Verifying Clang..."
        "$CLANGFULLPATH" --version | head -n1
        "$CLANGFULLPATH" -print-resource-dir
        # Report Whether Lib Clang Was Found For Rust Bindgen Integration
        if [[ -n "$LIBCLANGPATH" ]]; then
          echo "└─ [Info] 📌 LibClang Found"
        else
          echo "└─ [Warn] ⚠️ LibClang Not Found"
        fi

        echo "[Info] 🎉 Clang Toolchain Ready"

    - name: 🦀 Rust and Bindgen Compiler
      if: ${{ steps.rust-compiler.outputs.enablerustc == 'true' }}
      shell: bash
      env:
        KERNELPLATFORM: ${{ env.KERNELPLATFORM }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Navigate to Kernel Platform
        cd "$KERNELPLATFORM"
        echo "└─ [Info] 🦀 Setting Up Rust Toolchain"
        # Find Prebuilt Rust Toolchain Root Supplied by Kernel Source
        RUSTPREBUILT="$(
          find "${KERNELPLATFORM}" \
            -maxdepth 1 \
            -type d \
            -name 'prebuilts*' \
            -exec test -d '{}/rust/linux-x86' \; \
            -print |
          sort |
          head -n1
        )"
        [[ -n "$RUSTPREBUILT" ]] || {
          echo "└─ [Warn] ⚠️ Rust Prebuilt Root Not Found"
          exit 1
        }
        # Resolve Absolute Rust Prebuilt Path
        RUSTPREBUILT="$(realpath "$RUSTPREBUILT")"
        # First Try Rust Compiler Version Detected From Kernel Build Configuration
        RUSTCPATH="${RUSTPREBUILT}/rust/linux-x86/${VERSIONRUSTC}/bin/rustc"
        # If Configured Version is Unavailable, Search Prebuilt Tree For Another Usable Rustc
        if [[ ! -x "$RUSTCPATH" ]]; then
          echo "└─ [Warn] ⚠️ Rust Compiler Not Found"
          echo "└─ [Info] 📌 Expected                 : ${RUSTCPATH}"
          echo "└─ [Info] 🔍 Available Rust Compilers :"
          RUSTCPATH="$(
            find "$RUSTPREBUILT/rust/linux-x86" \
              -type f \
              -path '*/bin/rustc' \
              -executable \
              -print 2>/dev/null |
            sort -V |
            tail -n1
          )"
        fi
   
        # Stop Build if Neither Configured nor Fallback Rust Compiler Exists
        [[ -x "$RUSTCPATH" ]] || {
          echo "└─ [Warn] ⚠️ No Usable Rust Compiler Found"
          exit 1
        }
        RUSTCPATH="$(realpath "$RUSTCPATH")"
        RUSTBIN="$(dirname "$RUSTCPATH")"
        # Make Rust Available to Commands Executed Within Step
        export PATH="${RUSTBIN}:$PATH"
        # Persist Rust Toolchain Environment
        {
          echo "RUSTPREBUILT=${RUSTPREBUILT}"
          echo "RUSTCPATH=${RUSTCPATH}"
        } >> "$GITHUB_ENV"
        # Add Rust Toolchain to Path For Subsequent Steps
        echo "$RUSTBIN" >> "$GITHUB_PATH"
        # Preserve Lib Clang Environment
        if [[ -n "${LIBCLANG_PATH:-}" ]] &&
           [[ -d "$LIBCLANG_PATH" ]]; then
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
        fi

        # Display Rust Compiler Information
        echo "└─ [Info] 📂 Rust Root     : ${RUSTPREBUILT}"
        echo "└─ [Info] 📂 Rust Compiler : ${RUSTCPATH}"
        echo "└─ [Info] 📦 Rust Version  : $("$RUSTCPATH" --version)"
        echo "└─ [Info] 🔍 Resolving Bindgen"
        # Locate Prebuilt Bindgen
        BINDGENBIN="$(
          find "$KERNELPLATFORM" \
            -type f \
            -path '*/clang-tools/linux-x86/bin/bindgen' \
            -executable \
            -print 2>/dev/null |
          sort |
          head -n1
        )"
        # Use Prebuilt Bindgen When Available
        # Cargo Bindgen Fallback
        if [[ -z "$BINDGENBIN" ]]; then
          echo "└─ [Warn] ⚠️ Prebuilt Bindgen Not Found"
          echo "└─ [Info] 📥 Installing Bindgen-Cli 0.69.5..."
          if ! command -v cargo >/dev/null 2>&1; then
            echo "└─ [Info] 📥 Installing Cargo..."
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs |
              sh -s -- -y --default-toolchain none
            # Load Cargo Environment Installed by Rustup Into Current Shell
            source "$HOME/.cargo/env"
          fi
        
          # Install Required Bindgen CLI Version Used as Fallback Tool
          cargo install bindgen-cli --version 0.69.5
          BINDGENBIN="$(command -v bindgen || true)"
        fi
      
        # Ensure a Usable Bindgen Executable was Resolved From Either Source
        [[ -x "$BINDGENBIN" ]] || {
          echo "└─ [Warn] ⚠️ Bindgen Not Found"
          exit 1
        }
        # Resolve Absolute Bindgen Path
        BINDGENBIN="$(realpath "$BINDGENBIN")"
        # Persist Bindgen Under Both its Explicit Binary Name and Conventional Bindgen Variable
        {
          echo "BINDGENBIN=${BINDGENBIN}"
          echo "BINDGEN=${BINDGENBIN}"
        } >> "$GITHUB_ENV"
        # Add Bindgen Directory to Path For Subsequent Kernel Build Commands
        echo "$(dirname "$BINDGENBIN")" >> "$GITHUB_PATH"
        # Display Bindgen Information
        echo "└─ [Info] 📌 Bindgen : ${BINDGENBIN}"
        echo "└─ [Info] 📦 Version : $("$BINDGENBIN" --version | head -n1)"
        # Expose Clang Shared-Library Location to Bindgen When Lib Clang Was Discovered
        if [[ -n "${LIBCLANG_PATH:-}" ]]; then
          export LIBCLANG_PATH
          echo "└─ [Info] 📂 LibClang Path : $LIBCLANG_PATH"
        fi

        # Confirm Resolved Bindgen Binary Can Actually Execute
        if ! "$BINDGENBIN" --version >/dev/null 2>&1; then
          echo "└─ [Warn] ⚠️ Bindgen Execution Failed"
          exit 1
        fi

        echo "[Info] 🎉 Rust + Bindgen Ready"

    - name: 🧪 Test Toolchain Integration
      shell: bash
      env:
        KERNELPLATFORM: ${{ env.KERNELPLATFORM }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        echo "└─ [Info] 🧪 Testing Kernel Toolchain Integration..."
        TESTDIR="${RUNNER_TEMP}/kernel-toolchain-test"
        mkdir -p "$TESTDIR"
        echo "└─ [Info] 🧪 Testing Clang AArch64 Compilation"
        # Create Minimal Source For Actual Clang Compilation Test
        printf '%s\n' \
          'int test_function(int value)' \
          '{' \
          '  return value + 1;' \
          '}' \
          > "$TESTDIR/test.c"
        # Verify Selected Clang can Produce an AArch64 Object File
        if "$CLANGFULLPATH" \
          -target aarch64-linux-gnu \
          -c "$TESTDIR/test.c" \
          -o "$TESTDIR/test.o"; then
          echo "└─ [Info] 📌 Clang AArch64 Compilation Passed"
        else
          echo "└─ [Warn] ⚠️ Clang AArch64 Compilation Failed"
          exit 1
        fi
      
        [[ -s "$TESTDIR/test.o" ]] || {
          echo "└─ [Warn] ⚠️ Clang Produced an Empty Object File"
          exit 1
        }
        echo "└─ [Info] 🧪 Testing Bindgen + Lib Clang"
        if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
          # Create Minimal Source Header For Bindgen Integration Test
          printf '%s\n' \
            '#define TEST_VALUE 42' \
            '' \
            'struct test_struct {' \
            '  int value;' \
            '};' \
            > "$TESTDIR/test.h"
          # Generate Rust Bindings to Verify that Bindgen can Communicate with Lib Clang
          if LIBCLANG_PATH="${LIBCLANG_PATH:-}" \
            "$BINDGEN" "$TESTDIR/test.h" \
            --output "$TESTDIR/bindings.rs"; then
            echo "└─ [Info] 📌 Bindgen + Lib Clang Passed"
          else
            echo "└─ [Warn] ⚠️ Bindgen + Lib Clang Failed"
            exit 1
          fi
      
          [[ -s "$TESTDIR/bindings.rs" ]] || {
            echo "└─ [Warn] ⚠️ Bindgen Produced an Empty Bindings File"
            exit 1
          }
          echo "└─ [Info] 🧪 Testing Rust Compiler"
          # Compile Generated Bindings to Verify Selected Rust Compiler can Consume them
          if "$RUSTCPATH" \
            --crate-type lib \
            "$TESTDIR/bindings.rs" \
            -o "$TESTDIR/libbindings.rlib"; then
            echo "└─ [Info] 📌 Rust Binding Compilation Passed"
          else
            echo "└─ [Warn] ⚠️ Rust Binding Compilation Failed"
            exit 1
          fi
      
          [[ -s "$TESTDIR/libbindings.rlib" ]] || {
            echo "└─ [Warn] ⚠️ Rust Compiler Produced an Empty Library"
            exit 1
          }
        else
          echo "└─ [Info] ℹ️ Rust / Bindgen Integration : Disabled"
        fi

        echo "└─ [Info] 📋 Integration Test Summary"
        echo "└─ [Info] Clang AArch64 : Passed"
        if [[ "${ENABLERUSTC:-false}" == "true" ]]; then
          echo "└─ [Info] Bindgen       : Passed"
          echo "└─ [Info] Lib Clang     : Passed"
          echo "└─ [Info] Rust          : Passed"
        fi

        echo "[Info] 🎉 Kernel Toolchain Integration Tests Passed"
