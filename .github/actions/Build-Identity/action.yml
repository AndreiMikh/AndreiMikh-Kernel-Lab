name: 🪪 Build Identity
description: Generate Final Build Identity
# Define Inputs Passed From the Main Workflow
inputs:
  FILE:
    required: false
    default: ""
  BUILDTIME:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
  ROOTENGINE:
    required: false
    default: ""
  ROOTBRANCHSOURCE:
    required: false
    default: ""
  KERNELPATCH:
    required: false
    default: ""
  SUSFSREPOSITORY:
    required: false
    default: ""
  SUSFSVARIANT:
    required: false
    default: ""
  SUSFSBRANCHDEV:
    required: false
    default: ""
  NOMOUNT:
    required: false
    default: ""
  UNICODE:
    required: false
    default: ""
  LZ4NEON:
    required: false
    default: ""
  WINDSPEED:
    required: false
    default: ""
  LSMBBG:
    required: false
    default: ""
  LINUXCNTSYNC:
    required: false
    default: ""
  REKERNEL:
    required: false
    default: ""
  TCPALGORITHM:
    required: false
    default: ""
  NETFILTER:
    required: false
    default: ""
  MLGO:
    required: false
    default: ""
# Expose Generated Build Identity Suffix
outputs:
  suffix:
    description: Final Build Identity Suffix
    value: ${{ steps.suffix.outputs.suffix }}
# Configure Composite Action Execution
runs:
  using: composite
  steps:
    - name: 🪪 Build Identity
      id: suffix
      shell: bash
      # Export Inputs Required for Debugging and Build Identity Generation
      env:
        DEBUGBUILDTIME: ${{ inputs.BUILDTIME }}
        DEBUGSUFFIX: ${{ inputs.SUFFIX }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        ROOTBRANCH: ${{ inputs.ROOTBRANCHSOURCE }}
        KERNELPATCH: ${{ inputs.KERNELPATCH }}
        SUSFSREPOSITORY: ${{ inputs.SUSFSREPOSITORY }}
        SUSFSVAR: ${{ inputs.SUSFSVARIANT }}
        SUSFSDEV: ${{ inputs.SUSFSBRANCHDEV }}
        NOMOUNT: ${{ inputs.NOMOUNT }}
        UNICODE: ${{ inputs.UNICODE }}
        LZ4NEONPATCH: ${{ inputs.LZ4NEON }}
        WINDSPEED: ${{ inputs.WINDSPEED }}
        LSMBBG: ${{ inputs.LSMBBG }}
        LINUXCNTSYNC: ${{ inputs.LINUXCNTSYNC }}
        REKERNEL: ${{ inputs.REKERNEL }}
        TCP: ${{ inputs.TCPALGORITHM }}
        NETFILTER: ${{ inputs.NETFILTER }}
        MLGO: ${{ inputs.MLGO }}
      # Generate, Normalize and Export the Final Build Identity
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Display Unicode Code Points and Highlight Invisible Characters
        printunicode() {
          local LABEL="$1"
          local VALUE="$2"
          echo -n "$LABEL Unicode: "
          VALUE="$VALUE" python3 <<'PY'
        import os
        import unicodedata
        value = os.environ.get("VALUE", "")
        output = []
        for char in value:
            code = f"U+{ord(char):04X}"
            if char.isspace() or unicodedata.category(char) == "Cf":
                output.append(f"\033[31m{code}\033[0m")
            else:
                output.append(code)
        print(" ".join(output))
        PY
        }
        # Display Values Parsed From Kernel Manifest
        echo "--- Manifest Parsed Values ---"
        echo "└─ CPU                                               : ${CPU:-Empty}"
        echo "└─ CPUD                                              : ${CPUD:-Empty}"
        echo "└─ Android Version                                   : ${VANDROID:-Empty}"
        echo "└─ Build Profile                                     : ${BUILDMETHOD:-Empty}"
        # Display Inputs Received From Main Workflow
        echo "--------- Git Inputs ---------"
        echo "└─ File                                              : ${{ inputs.FILE }}"
        echo "└─ Build Time                                        : $DEBUGBUILDTIME"
        echo "└─ Custom Suffix                                     : $DEBUGSUFFIX"
        echo "└─ Root                                              : $ROOTENGINE"
        echo "└─ Root Branch                                       : $ROOTBRANCH"
        echo "└─ KernelPatch                                       : $KERNELPATCH"
        echo "└─ SUSFS Repository                                  : $SUSFSREPOSITORY"
        echo "└─ SUSFS Variant                                     : $SUSFSVAR"
        echo "└─ SUSFS Branch                                      : $SUSFSDEV"
        echo "└─ NoMount                                           : $NOMOUNT"
        echo "└─ Unicode Bypass                                    : $UNICODE"
        echo "└─ LZ4 Neon                                          : $LZ4NEONPATCH"
        echo "└─ Windspeed                                         : $WINDSPEED"
        echo "└─ LSM Baseband Guard                                : $LSMBBG"
        echo "└─ DroidSpaces / NTSynchronization Primitives        : $LINUXCNTSYNC"
        echo "└─ ReKernel                                          : $REKERNEL"
        echo "└─ TCP                                               : $TCP"
        echo "└─ Netfilter                                         : $NETFILTER"
        echo "└─ LLVM Machine Learning Guided Optimization (MLGO)  : $MLGO"
        # Inspect Unicode Code Points in Build Time and Custom Suffix
        printunicode "Build Time" "$DEBUGBUILDTIME"
        printunicode "Suffix" "$DEBUGSUFFIX"
        # Inspect Raw Bytes to Identify Invisible or Unexpected Characters
        echo "----- Raw Character Debug -----"
        printf 'Build Time Bytes  : '
        printf '%s' "$DEBUGBUILDTIME" | od -An -tx1 | tr -d '\n'
        printf '\nSuffix Bytes    : '
        printf '%s' "$DEBUGSUFFIX" | od -An -tx1 | tr -d '\n'
        printf '\n'
        # Display Character Lengths For Input Validation
        echo "-------- Length Debug --------"
        printf 'Build Time Length : %d\n' "${#DEBUGBUILDTIME}"
        printf 'Suffix Length     : %d\n' "${#DEBUGSUFFIX}"
        # Begin Constructing Final Kernel Build Identity
        echo "└─ ⚡ Full Build Identity..."
        # Initialize Final Build Identity
        SUFFIX=""
        # Resolve Selected Root Engine Name
        case "$ROOTENGINE" in
          BakaSU)
            SUFFIX="BakaSU"
            ;;
          KernelSU-Next)
            SUFFIX="KernelSU-Next"
            ;;
          SukiSU-Ultra)
            SUFFIX="SukiSU-Ultra"
            ;;
          KernelSU)
            SUFFIX="KernelSU"
            ;;
        esac
        # Append Selected Root Engine Branch
        case "$ROOTBRANCH" in
          *Builtin*)
            SUFFIX+="(Built-in)"
            ;;
          *Dev-SUSFS*)
            SUFFIX+="(Dev-SUSFS)"
            ;;
          *Dev*)
            SUFFIX+="(Dev)"
            ;;
          *Main*)
            SUFFIX+="(Main)"
            ;;
        esac
        # Append Selected KernelPatch Implementation
        case "$KERNELPATCH" in
          KPM)
            SUFFIX+="-KPModule"
            ;;
          KPN)
            SUFFIX+="-KPNext"
            ;;
        esac
        # Append the Selected LZ4 ARM64 Neon Optimization
        case "$LZ4NEONPATCH" in
          LZ4-1.10.0-Patch-Update)
            SUFFIX+="-LZ4(ARM64-Neon)"
            ;;
        esac
        # Append SuSFS Variant and Branch Only When SuSFS Repository is Enabled
        if [[ -z "$SUSFSREPOSITORY" || "$SUSFSREPOSITORY" != -* ]]; then
          # Append the Selected SuSFS Variant
          case "$SUSFSVAR" in
            OGKI)
              SUFFIX+="-SuSFS(OKI)"
              ;;
            GKI)
              SUFFIX+="-SuSFS(GKI)"
              ;;
          esac
          # Append Selected SuSFS Development or Main Branch
          case "$SUSFSDEV" in
            true)
              SUFFIX+="(Dev)"
              ;;
            false)
              SUFFIX+="(Main)"
              ;;
          esac
        fi

        # Append Selected NoMount Integration
        case "$NOMOUNT" in
          NoMount)
            SUFFIX+="-NoMount"
            ;;
          NoMount-Dev)
            SUFFIX+="-NoMount(Dev)"
            ;;
        esac
        # Append Selected ReKernel Integration
        case "$REKERNEL" in
          Built-in)
            SUFFIX+="-ReKernel"
            ;;
          Module)
            SUFFIX+="-ReKernelModule"
            ;;
        esac
        # Append LSM Baseband Guard Support
        if [[ "$LSMBBG" == "true" ]]; then
          SUFFIX+="-BBG"
        fi

        # Append DroidSpaces and NTSynchronization Support
        case "$LINUXCNTSYNC" in
          DroidSpaces+NTSync)
            SUFFIX+="-DroidSpaces+NTSYNC"
            ;;
        esac
        # Append Netfilter Network Extensions
        if [[ "$NETFILTER" == "true" ]]; then
          SUFFIX+="-Netfilter"
        fi

        # Append the Selected BBR TCP Congestion Control Algorithms
        case "$TCP" in
          BBRV1)
            SUFFIX+="-BBR1"
            ;;
          BBRV1+BBRV3)
            SUFFIX+="-BBR1+BBR3"
            ;;
        esac
        # Append Build Branding
        SUFFIX+="-Andrei"
        # Append Unicode Bypass Support When Enabled
        if [[ "$UNICODE" == "true" || "$UNICODE" == "Enabled" ]]; then
          SUFFIX+="-UnicodeBypass"
        fi

        # Append Hmbird / Windspeed Optimization When Enabled
        if [[ "$WINDSPEED" == "true" ]]; then
          SUFFIX+="-Hmbird"
        fi

        # Normalize Consecutive Hyphens in the Generated Suffix
        SUFFIX="$(printf '%s' "$SUFFIX" | sed 's/--/-/g')"
        # Export the Final Build Identity Through GitHub Actions Output
        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        # Display the Resolved Build Identity
        echo "└─ 🎉 Final Build Identity :"
        echo "$SUFFIX"
