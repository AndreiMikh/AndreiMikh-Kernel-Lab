name: 🪪 Build Identity
description: Generate Final Build Identity
# Define Inputs Passed From the Main Workflow
inputs:
  FILE:
    required: false
    default: ""
  BUILDTIME:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
  ROOTENGINE:
    required: false
    default: ""
  ROOTBRANCHSOURCE:
    required: false
    default: ""
  KERNELPATCH:
    required: false
    default: ""
  SUSFSREPOSITORY:
    required: false
    default: ""
  SUSFSVARIANT:
    required: false
    default: ""
  SUSFSBRANCHDEV:
    required: false
    default: ""
  NOMOUNT:
    required: false
    default: ""
  UNICODE:
    required: false
    default: ""
  LZ4NEON:
    required: false
    default: ""
  WINDSPEED:
    required: false
    default: ""
  LSMBBG:
    required: false
    default: ""
  LINUXCNTSYNC:
    required: false
    default: ""
  REKERNEL:
    required: false
    default: ""
  TCPALGORITHM:
    required: false
    default: ""
  NETFILTER:
    required: false
    default: ""
  MLGO:
    required: false
    default: ""
# Expose the Generated Build Identity Suffix
outputs:
  suffix:
    description: Final Build Identity Suffix
    value: ${{ steps.suffix.outputs.suffix }}
# Configure Composite Action Execution
runs:
  using: composite
  steps:
    - name: 🪪 Build Identity
      id: suffix
      shell: bash
      # Export Inputs Required for Debugging and Build Identity Generation
      env:
        DEBUGBUILDTIME: ${{ inputs.BUILDTIME }}
        DEBUGSUFFIX: ${{ inputs.SUFFIX }}        
      # Generate, Normalize and Export the Final Build Identity
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Display Unicode Code Points and Highlight Invisible Characters
        printunicode() {
          local LABEL="$1"
          local VALUE="$2"
          echo -n "$LABEL Unicode: "
          VALUE="$VALUE" python3 <<'PY'
        import os
        import unicodedata
        value = os.environ.get("VALUE", "")
        output = []
        for c in value:
          code = f"U+{ord(c):04X}"
          if c.isspace() or unicodedata.category(c) == "Cf":
            output.append(f"\033[31m{code}\033[0m")
          else:
            output.append(code)
        print(" ".join(output))
        PY
        }
        # Display Values Parsed From the Kernel Manifest
        echo "--- Manifest Parsed Values ---"
        echo "└─ CPU                                               : ${CPU:-Empty}"
        echo "└─ CPUD                                              : ${CPUD:-Empty}"
        echo "└─ Android Version                                   : ${VANDROID:-Empty}"
        echo "└─ Build Profile                                     : ${BUILDMETHOD:-Empty}"
        # Display Inputs Received From the Main Workflow
        echo "--------- Git Inputs ---------"
        echo "└─ File                                              : ${{ inputs.FILE }}"
        echo "└─ Build Time                                        : $DEBUGBUILDTIME"
        echo "└─ Suffix                                            : $DEBUGSUFFIX"
        echo "└─ Root                                              : ${{ inputs.ROOTENGINE }}"
        echo "└─ Root Branch                                       : ${{ inputs.ROOTBRANCHSOURCE }}"
        echo "└─ KernelPatch                                       : ${{ inputs.KERNELPATCH }}"
        echo "└─ SUSFS                                             : ${{ inputs.SUSFSREPOSITORY }}"
        echo "└─ SUSFS Variant                                     : ${{ inputs.SUSFSVARIANT }}"
        echo "└─ SUSFS Branch                                      : ${{ inputs.SUSFSBRANCHDEV }}"
        echo "└─ NoMount                                           : ${{ inputs.NOMOUNT }}"
        echo "└─ Unicode Bypass                                    : ${{ inputs.UNICODE }}"
        echo "└─ ZRAM                                              : ${{ inputs.LZ4NEON }}"
        echo "└─ Windspeed                                         : ${{ inputs.WINDSPEED }}"
        echo "└─ LSM Baseband Guard                                : ${{ inputs.LSMBBG }}"
        echo "└─ DroidSpaces / NTSynchonization Primitives Support : ${{ inputs.LINUXCNTSYNC }}"
        echo "└─ ReKernel                                          : ${{ inputs.REKERNEL }}"
        echo "└─ TCP                                               : ${{ inputs.TCPALGORITHM }}"
        echo "└─ Netfilter                                         : ${{ inputs.NETFILTER }}"
        echo "└─ LLVM Machine Learning Guided Optimization (MLGO)  : ${{ inputs.MLGO }}"
        # Inspect Unicode Code Points in Build Time and Custom Suffix
        printunicode "Build Time" "$DEBUGBUILDTIME"
        printunicode "Suffix" "$DEBUGSUFFIX"
        # Inspect Raw Bytes to Identify Invisible or Unexpected Characters
        echo "----- Raw Character Debug -----"
        printf 'Build Time Bytes  : '
        printf '%s' "$DEBUGBUILDTIME" | od -An -tx1 | tr -d '\n'
        printf '\nSuffix Bytes    : '
        printf '%s' "$DEBUGSUFFIX" | od -An -tx1 | tr -d '\n'
        printf '\n'
        # Display Character Lengths for Input Validation
        echo "-------- Length Debug --------"
        printf 'Build Time Length : %d\n' "${#DEBUGBUILDTIME}"
        printf 'Suffix Length     : %d\n' "${#DEBUGSUFFIX}"
        # Begin Constructing the Final Kernel Build Identity
        echo "└─ ⚡ Full Build Identity..."
        # Read Inputs Used During Build Identity Generation
        ROOTENGINE="${{ inputs.ROOTENGINE }}"
        ROOTBRANCH="${{ inputs.ROOTBRANCHSOURCE }}"
        KERNELPATCH="${{ inputs.KERNELPATCH }}"
        LZ4NEONPATCH="${{ inputs.LZ4NEON }}"
        SUSFSVAR="${{ inputs.SUSFSVARIANT }}"
        SUSFSDEV="${{ inputs.SUSFSBRANCHDEV }}"
        REKERNEL="${{ inputs.REKERNEL }}"
        LSMBBG="${{ inputs.LSMBBG }}"
        LINUXCNTSYNC="${{ inputs.LINUXCNTSYNC }}"
        NETFILTER="${{ inputs.NETFILTER }}"
        NOMOUNT="${{ inputs.NOMOUNT }}"
        TCP="${{ inputs.TCPALGORITHM }}"
        UNICODE="${{ inputs.UNICODE }}"
        WINDSPEED="${{ inputs.WINDSPEED }}"
        MLGO: ${{ inputs.MLGO }}
        # Resolve the Selected Root Engine Name
        declare -A ROOTENGINEMAP=(
          ["BakaSU"]="BakaSU"
          ["KernelSU-Next"]="KernelSU-Next"
          ["SukiSU-Ultra"]="SukiSU-Ultra"
          ["KernelSU"]="KernelSU"
        )
        SUFFIX="${ROOTENGINEMAP[$ROOTENGINE]:-}"
        # Append the Selected Root Engine Branch
        case "$ROOTBRANCH" in
          *Built-in*)
            SUFFIX+="(Built-in)"
            ;;
          *Dev-SUSFS*)
            SUFFIX+="(Dev-SUSFS)"
            ;;
          *Dev*)
            SUFFIX+="(Dev)"
            ;;
          *Main*)
            SUFFIX+="(Main)"
            ;;
        esac
        # Append the Selected KernelPatch Implementation
        declare -A KERNELPATCHMAP=(
          ["KPM"]="-KPM"
          ["KPN"]="-KPN"
        )
        SUFFIX+="${KERNELPATCHMAP[$KERNELPATCH]:-}"
        # Append the Selected LZ4 Neon Optimization
        declare -A LZ4NEONPATCHMAP=(
          ["LZ4-1.10.0-Patch-Update"]="-LZ4(Neon)"
        )
        SUFFIX+="${LZ4NEONPATCHMAP[$LZ4NEONPATCH]:-}"
        # Append the Selected SUSFS Variant
        declare -A SUSFSVARMAP=(
          ["OGKI"]="-SuSFS(OKI)"
          ["GKI"]="-SuSFS(GKI)"
        )
        SUFFIX+="${SUSFSVARMAP[$SUSFSVAR]:-}"
        # Append the Selected SUSFS Development or Main Branch
        case "$SUSFSDEV" in
          true)
            SUFFIX+="(Dev)"
            ;;
          false)
            SUFFIX+="(Main)"
            ;;
        esac
        # Append the Selected NoMount Integration
        declare -A NOMOUNTVARMAP=(
          ["NoMount"]="-NoMount"
          ["NoMount-Dev"]="-NoMountDev"
        )
        SUFFIX+="${NOMOUNTVARMAP[$NOMOUNT]:-}"
        # Append the Selected ReKernel Integration
        declare -A REKERNELMAP=(
          ["Built-in"]="-RK"
          ["Module"]="-RK-Module"
        )
        SUFFIX+="${REKERNELMAP[$REKERNEL]:-}"
        # Append Enabled Boolean Features
        [[ "$LSMBBG" == "true" ]] && SUFFIX+="-BBG"
        # Append DroidSpaces and NTSynchronization Support
        case "$LINUXCNTSYNC" in
          DroidSpaces+NTSync)
            SUFFIX+="-DroidSpaces+NTSync"
            ;;
        esac
        # Append Netfilter Network Extensions
        [[ "$NETFILTER" == "true" ]] && SUFFIX+="-NetFilter"
        # Append the Selected BBR TCP Congestion Control Algorithms
        case "$TCP" in
          BBRV1)
            SUFFIX+="-BBRV1"
            ;;
          BBRV1+BBRV3)
            SUFFIX+="-BBRV1+BBRV3"
            ;;
        esac
        # Append Build Branding and Optional Optimizations
        SUFFIX+="-Andrei"
        # Append Unicode Bypass Support When Enabled
        [[ "$UNICODE" == "true" || "$UNICODE" == "Enabled" ]] \
          && SUFFIX+="-Unicode"
        # Append Hmbird / Windspeed Optimization When Enabled
        [[ "$WINDSPEED" == "true" ]] \
          && SUFFIX+="-Hmbird"
        # Append LLVM Machine Learning Guided Optimization When Enabled
        [[ "$MLGO" == "true" ]] \
          && SUFFIX+="-MLGO"
        # Normalize Consecutive Hyphens in the Generated Suffix
        SUFFIX="$(echo "$SUFFIX" | sed 's/--/-/g')"
        # Export the Final Build Identity Through GitHub Actions Output
        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        # Display the Resolved Build Identity
        echo "└─ 🎉 Final Build Identity :"
        echo "$SUFFIX"
