name: 🪪 Build Identity
description: Generate Final Build Identity
inputs:
  FILE:
    required: false
    default: ""
  BUILDTIME:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
  KERNELPATCH:
    required: false
    default: ""
  ROOTBRANCHSOURCE:
    required: false
    default: ""
  SUSFSREPOSITORY:
    required: false
    default: ""
  ROOTENGINE:
    required: false
    default: ""
  LZ4NEON:
    required: false
    default: ""
  LSMBBG:
    required: false
    default: ""
  LINUXCNTSYNC:
    required: false
    default: ""
  NOMOUNT:
    required: false
    default: ""
  NETFILTER:
    required: false
    default: ""
  TCPALGORITHM:
    required: false
    default: ""
  SUSFSVARIANT:
    required: false
    default: ""
  SUSFSBRANCHDEV:
    required: false
    default: ""
  WINDSPEED:
    required: false
    default: ""
  UNICODE:
    required: false
    default: ""
  REKERNEL:
    required: false
    default: ""
  XUS:
    required: false
    default: ""
outputs:
  suffix:
    description: Final Build Identity Suffix
    value: ${{ steps.suffix.outputs.suffix }}
runs:
  using: composite
  steps:
    - name: 🪪 Build Identity
      id: suffix
      shell: bash
      env:
        DEBUGBUILDTIME: ${{ inputs.BUILDTIME }}
        DEBUGSUFFIX: ${{ inputs.SUFFIX }}
      run: |
        set -Eeuo pipefail
        # Unicode Helper
        printunicode() {
          local LABEL="$1"
          local VALUE="$2"
          echo -n "$LABEL Unicode: "
          VALUE="$VALUE" python3 <<'PY'
        import os
        import unicodedata
        value = os.environ.get("VALUE", "")
        output = []
        for c in value:
          code = f"U+{ord(c):04X}"
          if c.isspace() or unicodedata.category(c) == "Cf":
            output.append(f"\033[31m{code}\033[0m")
          else:
            output.append(code)
        print(" ".join(output))
        PY
        }
        echo "--- Manifest Parsed Values ---"
        echo "└─ CPU                                               : ${CPU:-<Empty>}"
        echo "└─ CPUD                                              : ${CPUD:-<Empty>}"
        echo "└─ Android Version                                   : ${VANDROID:-<Empty>}"
        echo "└─ Build Profile                                     : ${BUILDMETHOD:-<Empty>}"
        echo "--------- Git Inputs ---------"
        echo "└─ File                                              : ${{ inputs.FILE }}"
        echo "└─ KernelPatch                                       : ${{ inputs.KERNELPATCH }}"
        echo "└─ Root Branch                                       : ${{ inputs.ROOTBRANCHSOURCE }}"
        echo "└─ SUSFS                                             : ${{ inputs.SUSFSREPOSITORY }}"
        echo "└─ Root                                              : ${{ inputs.ROOTENGINE }}"
        echo "└─ ZRAM                                              : ${{ inputs.LZ4NEON }}"
        echo "└─ Build Time                                        : $DEBUGBUILDTIME"
        echo "└─ Suffix                                            : $DEBUGSUFFIX"
        echo "└─ LSM Baseband Guard                                : ${{ inputs.LSMBBG }}"
        echo "└─ DroidSpaces / NTSynchonization Primitives Support : ${{ inputs.LINUXCNTSYNC }}"
        echo "└─ NoMount                                           : ${{ inputs.NOMOUNT }}"
        echo "└─ Netfilter                                         : ${{ inputs.NETFILTER }}"
        echo "└─ TCP                                               : ${{ inputs.TCPALGORITHM }}"
        echo "└─ SUSFS Repository                                  : ${{ inputs.SUSFSVARIANT }}"
        echo "└─ SUSFS Branch                                      : ${{ inputs.SUSFSBRANCHDEV }}"
        echo "└─ Windspeed                                         : ${{ inputs.WINDSPEED }}"
        echo "└─ Unicode Bypass                                    : ${{ inputs.UNICODE }}"
        echo "└─ ReKernel                                          : ${{ inputs.REKERNEL }}"
        # Unicode Inspection
        printunicode "BUILDTIME" "$DEBUGBUILDTIME"
        printunicode "SUFFIX" "$DEBUGSUFFIX"
        # Raw Byte Inspection
        echo "----- Raw Character Debug -----"
        printf 'BUILDTIME bytes : '
        printf '%s' "$DEBUGBUILDTIME" \
          | od -An -tx1 \
          | tr -d '\n'
        printf 'SUFFIX bytes    : '
        printf '%s' "$DEBUGSUFFIX" \
          | od -An -tx1 \
          | tr -d '\n'
        # Length Inspection
        echo "-------- Length Debug --------"
        printf 'BUILDTIME length: %d\n' "${#DEBUGBUILDTIME}"
        printf 'SUFFIX length   : %d\n' "${#DEBUGSUFFIX}"
        echo "└─ ⚡ Full Build Identity..."
        # Read Inputs
        ROOTENGINE="${{ inputs.ROOTENGINE }}"
        ROOTBRANCH="${{ inputs.ROOTBRANCHSOURCE }}"
        KERNELPATCH="${{ inputs.KERNELPATCH }}"
        LZ4NEONPATCH="${{ inputs.LZ4NEON }}"
        SUSFSVAR="${{ inputs.SUSFSVARIANT }}"
        SUSFSDEV="${{ inputs.SUSFSBRANCHDEV }}"
        REKERNEL="${{ inputs.REKERNEL }}"
        LSMBBG="${{ inputs.LSMBBG }}"
        LINUXCNTSYNC="${{ inputs.LINUXCNTSYNC }}"
        NETFILTER="${{ inputs.NETFILTER }}"
        NOMOUNT="${{ inputs.NOMOUNT }}"
        TCP="${{ inputs.TCPALGORITHM }}"
        UNICODE="${{ inputs.UNICODE }}"
        XUS="${{ inputs.XUS }}"
        WINDSPEED="${{ inputs.WINDSPEED }}"
        # Root Engine
        declare -A ROOTENGINEMAP=(
          ["BakaSU"]="BakaSU"
          ["KernelSU-Next"]="KernelSU-Next"
          ["SukiSU-Ultra"]="SukiSU-Ultra"
          ["KernelSU"]="KernelSU"
        )
        SUFFIX="${ROOTENGINEMAP[$ROOTENGINE]:-}"
        # Kernel Patch
        declare -A KERNELPATCHMAP=(
          ["KPM"]="-KPM"
          ["KPN"]="-KPN"
        )
        SUFFIX+="${KERNELPATCHMAP[$KERNELPATCH]:-}"
        # Root Branch
        case "$ROOTBRANCH" in
          *Main*)
            SUFFIX+="-(Main)"
            ;;
          *Dev-SUSFS*)
            SUFFIX+="-(Dev-SUSFS)"
            ;;
          *Dev*)
            SUFFIX+="-(Dev)"
            ;;
          *Stable*)
            SUFFIX+="-(Stable)"
            ;;
          *Canary*)
            SUFFIX+="-(Canary)"
            ;;
        esac
        # LZ4 Neon
        declare -A LZ4NEONPATCHMAP=(
          ["LZ4-1.10.0-Patch-Update"]="-LZ4(Neon)"
        )
        SUFFIX+="${LZ4NEONPATCHMAP[$LZ4NEONPATCH]:-}"
        # SUSFS
        declare -A SUSFSVARMAP=(
          ["OGKI"]="-SuSFS(OKI)"
          ["GKI"]="-SuSFS(GKI)"
        )
        SUFFIX+="${SUSFSVARMAP[$SUSFSVAR]:-}"
        case "$SUSFSDEV" in
          true)
            SUFFIX+="(Dev)"
            ;;
          false)
            SUFFIX+="(Main)"
            ;;
        esac
        # NoMount Kernel Integration
        declare -A NOMOUNTVARMAP=(
          ["NoMount"]="-NoMount"
          ["NoMount-Dev"]="-NoMountDev"
        )
        SUFFIX+="${NOMOUNTVARMAP[$NOMOUNT]:-}"
        # ReKernel Integration
        declare -A REKERNELMAP=(
          ["Built-in"]="-RK"
          ["Module"]="-RK-Module"
        )
        SUFFIX+="${REKERNELMAP[$REKERNEL]:-}"
        # Boolean Features
        [[ "$LSMBBG" == "true" ]] && SUFFIX+="-BBG"
        # DroidSpaces / NTSynchonization Primitives
        case "$LINUXCNTSYNC" in
          DroidSpaces+NTSync)
            SUFFIX+="-DroidSpaces+NTSync"
            ;;
        esac
        # Network Features
        [[ "$NETFILTER" == "true" ]] && SUFFIX+="-NetFilter"
        # BBR TCP
        case "$TCP" in
          BBRV1+ECN)
            SUFFIX+="-BBRV1+ECN"
            ;;
          BBRV1+BBRV3+ECN)
            SUFFIX+="-BBRV1+BBRV3+ECN"
            ;;
          BBRV1+ECN+Brutal)
            SUFFIX+="-BBRV1+ECN+Brutal"
            ;;
          BBRV1+BBRV3+ECN+Brutal)
            SUFFIX+="-BBRV1+BBRV3+ECN+Brutal"
            ;;
        esac
        # Final Branding
        SUFFIX+="-Andrei"
        [[ "$UNICODE" == "true" || "$UNICODE" == "Enabled" ]] \
          && SUFFIX+="-Unicode"
        [[ "$XUS" == "true" || "$XUS" == "Enabled" ]] \
          && SUFFIX+="-XUS"
        [[ "$WINDSPEED" == "true" ]] \
          && SUFFIX+="-Hmbird"
        # Normalize Suffix
        SUFFIX="$(echo "$SUFFIX" | sed 's/--/-/g')"
        # Export Suffix
        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        echo "└─ 🎉 Final Build Identity :"
        echo "$SUFFIX"
