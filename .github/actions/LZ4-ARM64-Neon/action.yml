# Kernel LZ4 1.10.0 Upgrade and ARM64 NEON Optimizations
name: ⚡ Kernel LZ4 Upgrade + ARM64 Neon Optimizations
description: Upgrade Kernel LZ4 to Version 1.10.0 and Apply ARM64 Neon Optimizations
# Define Required Inputs
inputs:
  # Select Kernel LZ4 Upgrade and Neon Optimization Configuration
  LZ4NEON:
    description: Kernel LZ4 Upgrade and Neon Optimization Selection
    required: true
    default: LZ4-1.10.0-Patch-Update
# Define Composite Action Execution
runs:
  using: composite
  steps:
    # Upgrade Kernel LZ4 to Version 1.10.0 and Apply ARM64 Neon Optimizations
    - name: ⚡ Kernel LZ4 1.10.0 + ARM64 Neon Optimizations
      if: ${{ inputs.LZ4NEON == 'LZ4-1.10.0-Patch-Update' }}
      shell: bash
      env:
        # Export Selected LZ4 Patch Configuration
        LZ4NEONPATCH: ${{ inputs.LZ4NEON }}
        # Import Kernel Source and Script Directories
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        SCRIPTSDIR: ${{ env.SCRIPTSDIR }}
        # Import Kernel Patch Reject Checker
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Display Selected LZ4 Configuration
        echo "└─ 🚀 LZ4 1.10.0 Patch Update"
        echo "└─ 📦 Patch Type : $LZ4NEONPATCH"
        # Move Into Common Kernel Source Directory
        cd "$COMMONKERNELFOLDER"
        # Execute Kernel LZ4 Upgrade and ARM64 Neon Optimization Script
        echo "└─ 🚀 Running LZ4 Patch Update Script..."
        bash "${SCRIPTSDIR}/LZ4-Upgrade.sh"
        # Confirm Successful Script Execution
        echo "└─ 📌 Kernel LZ4 Update Script Completed"
        # Load Reject Checker and Verify Patch Application
        source "$REJECTCHECKER"
        checkrejects .
        # Display Successful Kernel LZ4 Upgrade Completion
        echo "└─ 🎉 LZ4 1.10.0 Patch Update Completed"
        echo "└─ 📦 Patch Type : $LZ4NEONPATCH"
