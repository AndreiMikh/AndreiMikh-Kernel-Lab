# Swap Disk Space and Setup Swap File
name: 🔄 Swap Disk Space
description: Inspect Disk Usage and Create and Enable a 4G Swap File
runs:
  using: composite
  steps:
    # Inspect Disk Usage and Workspace Size
    - name: 🔄 Swap Disk Space
      shell: bash
      env:
        # Workspace Directory
        WORKSPACEDIR: ${{ env.WORKSPACEDIR }}
      run: |
        # Enable Strict Error Handling
        set -euo pipefail
        # Display Filesystem Disk Usage
        echo "└─ 📌 Filesystem Disk Usage      :"
        df -hT
        # Display Workspace Directory Size
        echo "└─ 📌 Workspace Directory Size   :"
        du -sh "$WORKSPACEDIR" 2>/dev/null || true
        # Display 10 Largest Workspace Directories
        echo "└─ 🔎 Top 10 Largest Directories :"
        du -h --max-depth=1 "$WORKSPACEDIR" 2>/dev/null | sort -hr | head -n 10 || true
        # Confirm Disk Diagnostics are Complete
        echo "└─ 🎉 Done..."

    # Create and Enable Swap File
    - name: 💾 Setup Swap File
      shell: bash
      run: |
        # Enable Strict Error Handling
        set -euo pipefail
        # Define Swap File Path and Size
        SWAPFILE="/swapfile"
        SWAPSIZE="4G"
        # Check Whether Swap is Already Active
        echo "└─ 🔍 Checking Existing Swap..."
        if swapon --show=NAME --noheadings | grep -Fxq "$SWAPFILE"; then
          echo "└─ ℹ️ Swap Already Active : $SWAPFILE"
          free -h
          exit 0
        fi

        # Create the Swap File
        echo "└─ 📦 Creating $SWAPSIZE Swap at $SWAPFILE..."
        # Remove Stale Swap File if It Exists but Is Not Active
        if [ -e "$SWAPFILE" ]; then
          echo "└─ 🧹 Removing Stale Swap File..."
          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"
        fi

        # Try Fallocate First
        if sudo fallocate -l "$SWAPSIZE" "$SWAPFILE"; then
          echo "└─ 🎉 Fallocate Succeeded"
        else
          # Fall Back to DD if Fallocate Fails
          echo "└─ ⚠️ Fallocate Failed → Falling Back to DD"
          sudo dd \
            if=/dev/zero \
            of="$SWAPFILE" \
            bs=1M \
            count=4096 \
            status=progress
        fi

        # Set Secure Swap File Permissions
        sudo chmod 600 "$SWAPFILE"
        # Initialize Swap
        echo "└─ 🔧 Initializing Swap..."
        sudo mkswap "$SWAPFILE"
        # Enable Swap
        echo "└─ 🚀 Enabling Swap..."
        sudo swapon "$SWAPFILE"
        # Confirm Swap is Enabled Successfully
        echo "└─ 🎉 Swap Enabled Successfully"
        # Display Swap Status
        echo "------------ Swap ------------"
        swapon --show
        # Display Memory Status
        echo "----------- Memory -----------"
        free -h
