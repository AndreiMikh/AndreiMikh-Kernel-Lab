# SUSFS and Kernel Compatibility Patches Composite Action
name: 🩹 SUSFS and Kernel Compatibility Patches
description: Apply SUSFS Patches, Kernel Compatibility Fixes and Fake-Patch Handling
# Define Inputs Required by Composite Action
inputs:
  # Select Root Engine Used by the Kernel Build
  ROOTENGINE:
    description: Root Engine
    required: true
  # Select a SUSFS Commit, Tag, Branch, or Numeric Rollback Value
  SUSFSREPOSITORY:
    description: SUSFS Revision or Rollback Value
    required: true
  # Select SUSFS Repository Variant
  SUSFSVARIANT:
    description: SUSFS Variant (GKI or OGKI)
    required: true
  # Append Development Suffix to the Selected SUSFS Branch When Enabled
  SUSFSBRANCHDEV:
    description: SUSFS Development Branch
    required: true
  # Specify Target Kernel Configuration
  FILE:
    description: Kernel Target Configuration
    required: true
# Expose Detected SUSFS Version to Subsequent Workflow Steps
outputs:
  susfsver:
    description: Detected SUSFS Version
    value: ${{ steps.susfs.outputs.susfsver }}
runs:
  using: composite
  steps:
    # These Changes Prepare Older or Newer Kernel Sources for SUSFS Patch
    # Apply Kernel Fake Patches Before SUSFS Integration
    # Apply Temporary Kernel Compatibility Fixes Before SUSFS Integration
    - name: 🩹 Invert Fake Patches
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        KERNELMODULE: ${{ env.ANDROIDVERSION }}-${{ env.KERNELVERSION }}
        SUBLEVEL: ${{ env.SUBLEVEL }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
      run: |
        set -e
        # Validate Common Kernel Source Directory
        [[ -n "$COMMONKERNELFOLDER" && -d "$COMMONKERNELFOLDER" ]] || {
          echo "└─ ⚠️ Invalid Kernel Directory: $COMMONKERNELFOLDER" >&2
          exit 1
        }
        echo "└─ 📂 Kernel Directory : $COMMONKERNELFOLDER"
        echo "└─ 🔎 Kernel Base      : $KERNELMODULE"
        echo "└─ 🔢 Kernel Sublevel  : $SUBLEVEL"
        # Invert Android 12 5.10 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android12-5.10" ]]; then
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          # Fix the this_len Declaration in fs/proc/base.c
          if [[ "$SUBLEVEL" -le 43 ]]; then
            echo "└─ 🔧 Applying BASE Android 12 5.10 Fake Patch"
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/;' "$BASE"
          fi

          # Update INOTIFY MASK HANDLING in FS / NOTIFY / FDINFO
          if [[ "$SUBLEVEL" -le 117 ]]; then
            echo "└─ 🔧 Applying FDINFO Android 12 5.10 Fake Patch"
            sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' "$FDINFO"
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' "$FDINFO"
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' "$FDINFO"
          fi

          echo "└─ 🎉 Android 12 / 5.10 Fake Patch Preparation Complete"
        fi

        # Invert Android 13 5.15 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android13-5.15" ]]; then
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          OPEN="$COMMONKERNELFOLDER/fs/open.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$OPEN" ]] || { echo "└─ ⚠️ Missing: $OPEN" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          # Add Mount ID Mapping Headers and Update INOTIFY MASK HANDLING
          if [[ "$SUBLEVEL" -le 41 ]]; then
            echo "└─ 🔧 Applying NAMESPACE Android 13 5.15 SUSFS Fixes"
            sed -i '/^#include <linux\/shmem_fs.h>$/a #include <linux/mnt_idmapping.h>' "$NAMESPACE"
            echo "└─ 🔧 Applying OPEN Android 13 5.15 Fake Patch"
            sed -i '/^#include <linux\/compat.h>$/a #include <linux/mnt_idmapping.h>' "$OPEN"
            echo "└─ 🔧 Applying FDINFO Android 13 5.15 Fake Patch"
            sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' "$FDINFO"
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' "$FDINFO"
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' "$FDINFO"
          fi

          # Remove Obsolete SWAP SLOTS Header
          if [[ "$SUBLEVEL" -ge 123 ]]; then
            echo "└─ 🔧 Applying MEMORY Android 13 5.15 Fake Patch"
            sed -i '/#include <linux\/swap_slots\.h>/d' "$MEMORY"
          fi

          # Remove Block Trace Hook Header
          if [[ "$SUBLEVEL" -ge 197 ]]; then
            echo "└─ 🔧 Applying NAMESPACE Android 13 5.15 Fake Patch"
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' "$NAMESPACE"
          fi

          # Remove Memory Trace Hook Header
          if [[ "$SUBLEVEL" -ge 206 ]]; then
            echo "└─ 🔧 Applying TASK-MMU Android 13 5.15 Fake Patch"
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' "$MMU"
          fi

          echo "└─ 🎉 Android 13 / 5.15 Fake Patch Preparation Complete"
        fi

        # Invert Android 14 6.1 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android14-6.1" ]]; then
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          SUPER="$COMMONKERNELFOLDER/fs/super.c"
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$SUPER" ]] || { echo "└─ ⚠️ Missing: $SUPER" >&2; exit 1; }
          # Add DMA-BUF Header to FS / PROC / BASE
          if [[ "$SUBLEVEL" -le 141 ]]; then
            echo "└─ 🔧 Applying BASE Android 14 6.1 Fake Patch"
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' "$BASE"
          fi

          # Remove Block Trace Hook Header
          if [[ "$SUBLEVEL" -ge 157 ]]; then
            echo "└─ 🔧 Applying NAMESPACE Android 14 6.1 Fake Patch"
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' "$NAMESPACE"
            # Remove File System Trace Hook Header from FS / SUPER
            echo "└─ 🔧 Applying SUPER Android 14 6.1 Fake Patch"
            sed -i '/^#include <trace\/hooks\/fs\.h>$/d' "$SUPER"
          fi

          echo "└─ 🎉 Android 14 / 6.1 Fake Patch Preparation Complete"
        fi

        # Invert Android 15 6.6 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android15-6.6" ]]; then
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          # Fix VMA Tracking and Add Required Declarations and Trace Hook
          if [[ "$SUBLEVEL" -le 30 ]]; then
            echo "└─ 🔧 Applying TASK-MMU and NAMESPACE Android 15 6.6 Fake Patches"
            sed -i '/smap_gather_stats(vma, &mss, last_vma_end);/a\last_vma_end = vma->vm_end;' "$MMU"
            perl -0777 -i -pe '@l=split/\n/;for($i=$#l;$i>=0;$i--){if($l[$i]=~/last_vma_end = vma->vm_end;/){$l[$i]="\t\t\t\t".$l[$i];splice(@l,$i+1,0,"\t\t\t}");for($j=$i;$j>=0;$j--){if($l[$j]=~/if\s*\(vma->vm_end > last_vma_end\)/){$l[$j]=~s/\)\s*$/) {/;last}}last}}$_=join"\n",@l' "$MMU"
            sed -i '/#include <trace\/hooks\/blk\.h>/a #include <trace/hooks/fs.h>' "$NAMESPACE"
            sed -i \
              -e '/int ret = 0, copied = 0;/a \	unsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' \
              -e '/int ret = 0, copied = 0;/a \	pagemap_entry_t *res = NULL;' \
              "$MMU"
          fi

          # Add ZSWAP Header to MM / MEMORY
          if [[ "$SUBLEVEL" -le 57 ]]; then
            echo "└─ 🔧 Applying MEMORY Android 15 6.6 Fake Patch"
            sed -i '/^#include <linux\/sched\/sysctl.h>$/a #include <linux/zswap.h>' "$MEMORY"
          fi

          # Add DMA-BUF Header to FS / PROC / BASE
          if [[ "$SUBLEVEL" -le 92 ]]; then
            echo "└─ 🔧 Applying BASE Android 15 6.6 Fake Patch"
            sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' "$BASE"
          fi

          echo "└─ 🎉 Android 15 / 6.6 Fake Patch Preparation Complete"
        fi

        
        # Invert Android 16 6.12 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android16-6.12" ]]; then
          EXEC="$COMMONKERNELFOLDER/fs/exec.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          [[ -f "$EXEC" ]] || { echo "└─ ⚠️ Missing: $EXEC" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          echo "└─ 🩹 Applying Android 16 / 6.12 SUSFS Fake Patches"
          # Prepare DMA-BUF Header Compatibility in FS / EXEC
          if [[ "$SUBLEVEL" -le 58 ]]; then
            if grep -qF '#include <linux/dma-buf.h>' "$EXEC"; then
              echo "└─ ℹ️ DMA-BUF Header Already Present"
            elif grep -qF '#include <linux/ksm.h>' "$EXEC"; then
              echo "└─ 🔧 Adding DMA-BUF Header to EXEC"
              sed -i '/^#include <linux\/ksm.h>$/a #include <linux/dma-buf.h>' "$EXEC"
            else
              echo "└─ ⚠️ Cannot locate KSM header in EXEC" >&2
              exit 1
            fi
          fi

          # Prepare Sublevel 92 TASK-MMU Compatibility
          if [[ "$SUBLEVEL" -le 92 ]]; then
            if grep -qF 'if (!vma_pages(vma))' "$MMU"; then
              echo "└─ ℹ️ VMA PAGES() Condition Already Present"
            elif grep -qF 'if (!vma_data_pages(vma))' "$MMU"; then
              echo "└─ 🔧 Updating TASK-MMU Condition"
              sed -i 's/if (!vma_data_pages(vma))/if (!vma_pages(vma))/' "$MMU"
            else
              echo "└─ ⚠️ TASK-MMU VMA Condition Not Found" >&2
              exit 1
            fi
          fi

          # Detect and Validate Legacy SMAPS Rollup Layout
          if grep -Fq 'smap_gather_stats(vma, &mss, 0);' "$MMU"; then
            echo "└─ 🔧 Legacy SMAPS ROLLUP Layout Detected"
            # Add SUSFS Map Check to SHOW SMAP()
            if ! grep -Fq 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))' "$MMU"; then
              if ! grep -Fq 'if (!vma_pages(vma))' "$MMU" &&
                 ! grep -Fq 'if (!vma_data_pages(vma))' "$MMU"; then
                echo "└─ ⚠️ Cannot Locate SHOW SMAP() Insertion Point" >&2
                exit 1
              fi

              perl -0pi -e 's/(static\s+int\s+show_smap\s*\([^)]*\)\s*\{.*?)(\n[ \t]*if\s*\(!vma_(?:data_)?pages\(vma\))/$1\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n\t\treturn 0;\n#endif$2/s' "$MMU"
                  or die "Cannot Adapt SHOW SMAP()";
              ' "$MMU"
              echo "└─ 📌 Added SUSFS map check to show_smap()"
            else
              echo "└─ ℹ️ SUSFS map check already present in show_smap()"
            fi

            # The legacy rollup loop requires its full source context.
            # Refuse to guess where a skip would affect accounting.
            if ! grep -Fq 'SUSFS legacy rollup adapter' "$MMU"; then
              echo "└─ ⚠️ Legacy SHOW SMAPS ROLLUP() Needs a Source-Specific Adapter" >&2
              echo "└─ ⚠️ No Rollup Changes Were Made; Refusing an Unsafe Insertion" >&2
              exit 1
            fi
            
          else
            echo "└─ ℹ️ Non-Legacy SMAPS ROLLUP Layout Detected"
          fi

          echo "└─ 🎉 Android 16 / 6.12 Fake Patch Preparation Complete"
        fi

        # Report Completion of Temporary Compatibility Fixes
        echo "└─ 🎉 Kernel Fake Patches Applied"

    # Clone SUSFS and Apply Patches
    - name: 🩹 SUSFS Integration
      id: susfs
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        # Kernel Build Paths From the Caller Environment
        WORKDIR: ${{ env.WORKDIR }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
        # Root Engine and SUSFS Configuration
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        SUSFSREPOSITORY: ${{ inputs.SUSFSREPOSITORY }}
        SUSFSVARIANT: ${{ inputs.SUSFSVARIANT }}
        SUSFSBRANCHDEV: ${{ inputs.SUSFSBRANCHDEV }}
        FILE: ${{ inputs.FILE }}
        # Kernel Version Information
        ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
        KERNELVERSION: ${{ env.KERNELVERSION }}
        SUBLEVEL: ${{ env.SUBLEVEL }}
      run: |
        set -euo pipefail
        # Construct the Android and Kernel Version Identifier
        GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"
        # Navigate to the Kernel Working Directory
        cd "$WORKDIR"
        # Display Kernel Environment Information
        echo "└─ 🧾 Android Version       : $ANDROIDVERSION"
        echo "└─ 🧾 Kernel Version        : $KERNELVERSION"
        echo "└─ 🔎 Detected Kernel Base  : $GKIVERSION"
        echo "└─ 📁 Kernel Directory      : $COMMONKERNELFOLDER"
        # Select the SUSFS Repository, Branch and Optional Fallback
        echo "└─ 📥 Cloning SUSFS..."
        if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
          # Select the OGKI Repository and Branch
          BRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
          REPOURL="https://github.com/cctv18/susfs4oki.git"
          FALLBACKURL=""
        else
          # Select the GKI Repository and GitHub Mirror
          BRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
          REPOURL="https://gitlab.com/simonpunk/susfs4ksu.git"
          FALLBACKURL="https://github.com/AndreiMikh/susfs4ksu.git"
        fi

        # Append the Development Suffix When Enabled
        if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
          BRANCH="${BRANCH}-dev"
        fi

        # Attempt to Clone the Selected Branch up to Three Times
        CLONED=false
        for attempt in {1..3}; do
          # Remove Any Previous Failed Clone
          rm -rf susfs4ksu
          # Clone the Requested Branch With Shallow History
          if git clone --depth=1 --single-branch \
            --branch "$BRANCH" \
            "$REPOURL" susfs4ksu; then
            echo "└─ 📌 SUSFS Clone Successful"
            CLONED=true
            break
          fi

          # Remove an Incomplete Repository Before Retrying
          rm -rf susfs4ksu
          # Delay Between Retry Attempts
          if [[ "$attempt" -lt 3 ]]; then
            echo "└─ ⚠️ Clone Failed (Attempt $attempt/3)"
            sleep $((attempt * 3))
          fi

        done

        # Try the GitHub Mirror if the Primary Clone Failed
        if [[ "$CLONED" != "true" && -n "$FALLBACKURL" ]]; then
          echo "└─ ⚠️ GitLab Unavailable, Trying GitHub Mirror..."
          if git clone --depth=1 --single-branch \
            --branch "$BRANCH" \
            "$FALLBACKURL" susfs4ksu; then
            echo "└─ 📌 SUSFS GitHub Mirror Clone Successful"
            CLONED=true
          fi
        fi

        # Stop the Build if No Repository Could Be Cloned
        if [[ "$CLONED" != "true" ]]; then
          echo "└─ ⚠️ SUSFS Clone Failed"
          echo "└─ 📦 Repository : $REPOURL"
          echo "└─ 🌿 Branch     : $BRANCH"
          [[ -z "$FALLBACKURL" ]] || echo "└─ 🔄 Fallback   : $FALLBACKURL"
          exit 1
        fi

        # Display the Selected SUSFS Branch
        echo "└─ 📌 SUSFS Branch : $BRANCH"
        # Enter the Cloned SUSFS Repository
        cd susfs4ksu || exit 1
        # Check Whether a Specific SUSFS Revision Was Requested
        if [[ -n "${SUSFSREPOSITORY:-}" && "$SUSFSREPOSITORY" != "-1" ]]; then
          echo "└─ 🔎 SUSFS Revision : $SUSFSREPOSITORY"
          # Numeric Values Select a Previous Commit Relative to HEAD
          if [[ "$SUSFSREPOSITORY" =~ ^[0-9]+$ ]]; then
            echo "└─ 📦 Fetching Additional Git History..."
            # Expand the Shallow Clone or Fetch Additional History
            git fetch --unshallow || git fetch --depth=1000 origin "$BRANCH"
            # Check Out the Requested Historical Commit
            git checkout "HEAD~$SUSFSREPOSITORY" || {
              echo "└─ ⚠️ Failed Checkout HEAD~$SUSFSREPOSITORY"
              exit 1
            }
          else
            # Expand History When a Commit Hash Is Supplied
            if [[ "$SUSFSREPOSITORY" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "└─ 📦 Expanding Shallow Clone History..."
              git fetch --unshallow origin || \
                git fetch --deepen=200 origin "$BRANCH"
            fi

            # Check Out the Requested Commit, Tag or Branch
            git checkout "$SUSFSREPOSITORY" || {
              echo "└─ ⚠️ Invalid SUSFS Revision"
              exit 1
            }
          fi
        fi

        # Display the Active SUSFS Commit
        echo "└─ 📌 Active SUSFS Commit : $(git rev-parse --short HEAD)"
        # Detect the SUSFS Version From Its Header
        SUSFSVER="Unknown"
        SUSFSHEADER="./kernel_patches/include/linux/susfs.h"
        if [[ -f "$SUSFSHEADER" ]]; then
          SUSFSVER=$(
            awk -F'"' '/SUSFS_VERSION/ {print $2; exit}' "$SUSFSHEADER"
          )
          SUSFSVER="${SUSFSVER:-Unknown}"
        fi

        # Export the SUSFS Version to the Workflow Environment and Step Output
        echo "└─ 📦 SUSFS Version : $SUSFSVER"
        echo "SUSFSVER=$SUSFSVER" >> "$GITHUB_ENV"
        echo "susfsver=$SUSFSVER" >> "$GITHUB_OUTPUT"
        # Return to the Working Directory
        cd ..
        # Find SUSFS Core Patch Files Matching the Current Kernel Base
        echo "└─ 🔎 Searching SUSFS Patches..."
        shopt -s nullglob
        SUSFSPATCHLIST=(./susfs4ksu/kernel_patches/50_add_susfs_in_gki-"${ANDROIDVERSION}"-"${KERNELVERSION}"*.patch)
        # Stop if No Matching SUSFS Patch Exists
        if [[ ${#SUSFSPATCHLIST[@]} -eq 0 ]]; then
          echo "└─ ⚠️ No SUSFS Patch Found"
          ls ./susfs4ksu/kernel_patches/ || true
          exit 1
        fi

        # Select the Last Matching Patch from the Sorted Array
        SUSFSPATCH="${SUSFSPATCHLIST[-1]}"
        # Copy SUSFS Patch Files into the Common Kernel Source Tree
        echo "└─ 🧾 SUSFS Patch Directory : $SUSFSPATCH"
        if [[ "$SUSFSREPOSITORY" != "-1" ]]; then
          echo "└─ 📥 Copying SUSFS Patches..."
          # Copy the Main SUSFS Patch
          cp "$SUSFSPATCH" "${COMMONKERNELFOLDER}/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Patches"
          # Copy SUSFS Filesystem Changes
          cp -r ./susfs4ksu/kernel_patches/fs/* "${COMMONKERNELFOLDER}/fs/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Filesystem"
          # Copy SUSFS Linux Header Changes
          cp -r ./susfs4ksu/kernel_patches/include/linux/* "${COMMONKERNELFOLDER}/include/linux/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Linux Header"
        fi

        # Enter the Common Kernel Source Directory
        cd "$COMMONKERNELFOLDER"
        # Apply the SUSFS Core Patch
        echo "└─ ⚙️ Applying SUSFS Core Patch (50 Add SUSFS Patch)"
        if patch -p1 < "$(basename "$SUSFSPATCH")"; then
          echo "└─ 📌 SUSFS 50 Enable Core Patch Applied"
        else
          # Preserve the Original Behavior: Warn and Continue on Failure
          echo "└─ ⚠️ SUSFS Core Patch Already Applied or Failed"
        fi

        # Apply the SUSFS Enable Patch Only for KernelSU
        if [[ "$ROOTENGINE" == "KernelSU" ]]; then
          echo "⚙️ Applying KernelSU SUSFS enable patch"
          # Select the Branch for the SUSFS Enable Patch
          if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
            PATCHBRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
          else
            PATCHBRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
          fi

          # Append the Development Suffix When Enabled
          [[ "${SUSFSBRANCHDEV}" == "true" ]] && PATCHBRANCH="${PATCHBRANCH}-dev"
          # Build the SUSFS Enable Patch URL Based on the Variant
          case "$SUSFSVARIANT" in
            GKI)
              SUSFS10URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
              ;;
            OGKI)
              SUSFS10URL="https://raw.githubusercontent.com/cctv18/susfs4oki/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
              ;;
            *)
              # Reject Unsupported SUSFS Variants
              echo "└─ ⚠️ Invalid SUSFS Variant"
              exit 1
              ;;
          esac
          # Verify That the SUSFS Enable Patch URL Is Reachable
          echo "🔍 Checking Patch URL..."
          if ! wget --spider "$SUSFS10URL"; then
            echo "└─ ⚠️ Patch Does Not Exist :"
            echo "$SUSFS10URL"
            exit 1
          fi

          # Download the SUSFS Enable Patch
          echo "🌐 Downloading Patch : $SUSFS10URL"
          if ! wget "$SUSFS10URL" -O enable.patch; then
            echo "└─ ⚠️ Failed to Download SUSFS Enable Patch"
            exit 1
          fi

          # Track Whether the Enable Patch Was Applied Successfully
          APPLIED=false
          # Save the Current Directory for Cleanup and Return
          ORIGDIR="$(pwd)"
          # Resolve the KernelSU Source Directory
          KSUDIR="$(dirname "$COMMONKERNELFOLDER")/KernelSU"
          echo "└─ 📂 Current Directory : $(pwd)"
          echo "└─ 🔧 Applying SUSFS Enable Patch..."
          # Stop if the KernelSU Source Directory Is Missing
          if [[ ! -d "$KSUDIR" ]]; then
            echo "└─ ⚠️ KernelSU Directory Not Found :"
            echo "└─ $KSUDIR"
            rm -f "$ORIGDIR/enable.patch"
            exit 1
          fi

          # Enter the KernelSU Source Directory
          echo "└─ 📂 Entering KernelSU Directory..."
          cd "$KSUDIR" || exit 1
          echo "└─ 📂 Current Directory : $(pwd)"
          echo "└─ 🔧 Applying SUSFS Enable Patch..."
          # Apply the SUSFS Enable Patch
          if patch -p1 < "$ORIGDIR/enable.patch"; then
            APPLIED=true
            echo "📌 SUSFS Enable Patch Applied Successfully"
          else
            # Preserve the Original Behavior: Warn and Skip on Failure
            echo "└─ ⚠️ SUSFS Enable Patch is Not Compatible with KernelSU Source Tree"
            echo "└─ ℹ️ Skipping SUSFS Enable Patch"
          fi

          # Return to the Original Directory and Remove the Temporary Patch
          echo "└─ 📂 Returning to Original Directory..."
          cd "$ORIGDIR" || exit 1
          rm -f "$ORIGDIR/enable.patch"
          # Report the Final Enable Patch Status
          if [[ "$APPLIED" == "true" ]]; then
            echo "└─ 📌 KernelSU SUSFS Enable Patch Completed"
          else
            echo "└─ ⚠️ KernelSU SUSFS Enable Patch Skipped"
          fi

        else
          # Skip the KernelSU Enable Patch for Other Root Engines
          echo "└─ ♻️ Skipping KernelSU SUSFS Enable Patch (Root = $ROOTENGINE)"
        fi

        echo "🎉 SUSFS Patches Complete"
        # Apply the Legacy Compatibility Fix for Older Android 13 Kernel 5.15 Builds
        if [[ "$GKIVERSION" == "android13-5.15" && "$SUBLEVEL" -lt 123 ]]; then
          # Resolve the Legacy Compatibility Patch Path
          LEGACYPATCH="${PATCHDIR}/Legacy-5.15-Fix.patch"
          # Stop if the Required Legacy Patch Is Missing
          if [[ ! -f "$LEGACYPATCH" ]]; then
            echo "└─ ⚠️ Patch Not Found : $LEGACYPATCH"
            exit 1
          fi

          echo "└─ 🚀 Applying Legacy Fix (Kernel 5.15.0–5.15.123)"
          # Skip the Patch if It Is Already Applied
          if patch -R -p1 --dry-run < "$LEGACYPATCH" >/dev/null 2>&1; then
            echo "└─ ⚠️ Patch Already Applied — Skipping"
          else
            # Apply the Legacy Fix
            if patch -p1 < "$LEGACYPATCH"; then
              echo "📌 Legacy 5.15 Fix Applied"
            else
              echo "└─ ⚠️ Patch Failed"
              exit 1
            fi
          fi
        fi

        # Load the Reject Checker and Check for Patch Rejects
        source "$REJECTCHECKER"
        checkrejects .
        echo "└─ 🎉 Kernel Compatibility Fix Stage Completed"

    # Reverse Temporary Kernel Compatibility Fixes After SUSFS Integration
    - name: ♻️ Revert Fake Patches
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        KERNELMODULE: ${{ env.ANDROIDVERSION }}-${{ env.KERNELVERSION }}
        SUBLEVEL: ${{ env.SUBLEVEL }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
      run: |
        set -e
        # Validate Common Kernel Source Directory
        [[ -n "$COMMONKERNELFOLDER" && -d "$COMMONKERNELFOLDER" ]] || {
          echo "└─ ⚠️ Invalid Kernel Directory: $COMMONKERNELFOLDER" >&2
          exit 1
        }
        echo "└─ 📂 Kernel Directory : $COMMONKERNELFOLDER"
        echo "└─ 🔎 Kernel Base      : $KERNELMODULE"
        echo "└─ 🔢 Kernel Sublevel  : $SUBLEVEL"
        # Revert Android 12 5.10 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android12-5.10" ]]; then
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          # Revert Original THIS-LEN Declaration
          if [[ "$SUBLEVEL" -le 43 ]]; then
            echo "└─ ♻️ Reverting BASE Android 12 5.10 Fake Patch"
            sed -i \
              's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' \
              "$BASE"
          fi

          # Revert Original INOTIFY MASK HANDLING
          if [[ "$SUBLEVEL" -le 117 ]]; then
            echo "└─ ♻️ Reverting FDINFO Android 12 5.10 Fake Patch"
            perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' \
              "$FDINFO"
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' \
              "$FDINFO"
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' \
              "$FDINFO"
          fi

          echo "└─ 🎉 Android 12 / 5.10 Fake Patch Reversal Complete"
        fi

        # Revert Android 13 5.15 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android13-5.15" ]]; then
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          OPEN="$COMMONKERNELFOLDER/fs/open.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          SUSFS="$COMMONKERNELFOLDER/fs/susfs.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$OPEN" ]] || { echo "└─ ⚠️ Missing: $OPEN" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          [[ -f "$SUSFS" ]] || { echo "└─ ⚠️ Missing: $SUSFS" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          # Revert Mount ID Mapping Headers and Restore INOTIFY MASK HANDLING
          if [[ "$SUBLEVEL" -le 41 ]]; then
            echo "└─ ♻️ Reverting NAMESPACE Android 13 5.15 Fake Patch"
            sed -i '/#include <linux\/mnt_idmapping.h>$/d' "$NAMESPACE"
            echo "└─ ♻️ Reverting OPEN Android 13 5.15 Fake Patch"
            sed -i '/#include <linux\/mnt_idmapping.h>$/d' "$OPEN"
            echo "└─ ♻️ Reverting FDINFO Android 13 5.15 Fake Patch"
            perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' "$FDINFO"
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' "$FDINFO"
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' "$FDINFO"
            # Restore Original SUSFS User NAMESPACE Expressions
            echo "└─ ♻️ Restoring SUSFS User NAMESPACE Expressions"
            sed -i 's|i_uid_into_mnt(i_user_ns(&fi->inode), &fi->inode).val|i_uid_into_mnt(\&init_user_ns, \&fi->inode).val|g' "$SUSFS"
            sed -i 's|i_uid_into_mnt(i_user_ns(inode), inode).val|i_uid_into_mnt(\&init_user_ns, inode).val|g' "$SUSFS"
          fi

          # Revert SWAP SLOTS Header
          if [[ "$SUBLEVEL" -ge 123 ]]; then
            echo "└─ ♻️ Reverting MEMORY Android 13 5.15 Fake Patch"
            sed -i '/#ifdef CONFIG_KSU_SUSFS_SUS_MAP/i #include <linux/swap_slots.h>' "$MEMORY"
          fi

          # Revert Block Trace Hook Header
          if [[ "$SUBLEVEL" -ge 197 ]]; then
            echo "└─ ♻️ Reverting NAMESPACE Android 13 5.15 Fake Patch"
            sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' "$NAMESPACE"
          fi

          # Revert Memory Trace Hook Header
          if [[ "$SUBLEVEL" -ge 206 ]]; then
            echo "└─ ♻️ Reverting TASK-MMU Android 13 5.15 Fake Patch"
            sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' "$MMU"
          fi

          echo "└─ 🎉 Android 13 / 5.15 Fake Patch Reversal Complete"
        fi

        # Revert Android 14 6.1 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android14-6.1" ]]; then
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          SUPER="$COMMONKERNELFOLDER/fs/super.c"
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$SUPER" ]] || { echo "└─ ⚠️ Missing: $SUPER" >&2; exit 1; }
          # Revert DMA-BUF Header
          if [[ "$SUBLEVEL" -le 141 ]]; then
            echo "└─ ♻️ Reverting BASE Android 14 6.1 Fake Patch"
            sed -i '/^#include <linux\/dma-buf.h>$/d' "$BASE"
          fi

          # Revert Block and Filesystem Trace Hook Headers
          if [[ "$SUBLEVEL" -ge 157 ]]; then
            echo "└─ ♻️ Reverting NAMESPACE Android 14 6.1 Fake Patch"
            sed -i '/^#include "internal\.h"$/a #include <trace/hooks/blk.h>' "$NAMESPACE"
            # Restore Filesystem Trace Hook Header in FS / SUPER
            echo "└─ ♻️ Reverting SUPER Android 14 6.1 Fake Patch"
            sed -i '/^#include "internal\.h"$/a #include <trace/hooks/fs.h>' "$SUPER"
          fi

          echo "└─ 🎉 Android 14 / 6.1 Fake Patch Reversal Complete"
        fi

        # Revert Android 15 6.6 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android15-6.6" ]]; then
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          # Revert Added Trace Hook and Declarations
          if [[ "$SUBLEVEL" -le 30 ]]; then
            echo "└─ ♻️ Reverting TASK-MMU and NAMESPACE Android 15 6.6 Fake Patches"
            sed -i '/#include <trace\/hooks\/fs\.h>/d' "$NAMESPACE"
            sed -i \
              -e '/unsigned int nr_subpages = __PAGE_SIZE \/ PAGE_SIZE;/d' \
              -e '/pagemap_entry_t \*res = NULL;/d' \
              "$MMU"
          fi

          # Revert ZSWAP Header
          if [[ "$SUBLEVEL" -le 57 ]]; then
            echo "└─ ♻️ Reverting MEMORY Android 15 6.6 Fake Patch"
            sed -i '/^#include <linux\/zswap.h>$/d' "$MEMORY"
          fi

          # Revert DMA-BUF Header
          if [[ "$SUBLEVEL" -le 92 ]]; then
            echo "└─ ♻️ Reverting BASE Android 15 6.6 Fake Patch"
            sed -i '/^#include <linux\/dma-buf.h>$/d' "$BASE"
          fi

          echo "└─ 🎉 Android 15 / 6.6 Fake Patch Reversal Complete"
        fi

        # Revert Android 16 6.12 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android16-6.12" ]]; then
          EXEC="$COMMONKERNELFOLDER/fs/exec.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          [[ -f "$EXEC" ]] || { echo "└─ ⚠️ Missing: $EXEC" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          echo "└─ ♻️ Reverting Android 16 / 6.12 SUSFS Fake Patches"
          # Revert DMA-BUF Header
          if [[ "$SUBLEVEL" -le 58 ]]; then
            if grep -qF '#include <linux/dma-buf.h>' "$EXEC"; then
              echo "└─ 🔧 Removing DMA-BUF Header From EXEC"
              sed -i '\|^#include <linux/dma-buf.h>$|d' "$EXEC"
            else
              echo "└─ ℹ️ DMA-BUF Header Not Present"
            fi
          fi

          # Restore VMA Page Condition
          if [[ "$SUBLEVEL" -le 92 ]]; then
            if grep -qF 'if (!vma_pages(vma))' "$MMU"; then
              echo "└─ 🔧 Restoring VMA DATA PAGES() Condition"
              sed -i 's/if (!vma_pages(vma))/if (!vma_data_pages(vma))/' "$MMU"
            else
              echo "└─ ℹ️ No VMA Page Condition to Restore"
            fi
          fi

          # Revert SUSFS SHOW SMAP() Compatibility Check
          if grep -qF 'SUSFS Fake Patch: show_smap' "$MMU"; then
            echo "└─ 🔧 Removing show_smap() SUSFS Compatibility Check"
            sed -i '/SUSFS Fake Patch: show_smap/,+7d' "$MMU"
          else
            echo "└─ ℹ️ No SHOW SMAP() Compatibility Check Marker Found"
          fi

          # Revert SUSFS Legacy show_smaps_rollup() Adapter
          if grep -qF 'SUSFS Fake Patch: show_smaps_rollup' "$MMU"; then
            echo "└─ 🔧 Removing show_smaps_rollup() SUSFS Compatibility Adapter"
            sed -i '/SUSFS Fake Patch: show_smaps_rollup/,+12d' "$MMU"
          else
            echo "└─ ℹ️ No SHOW SMAPS ROLLUP() Adapter Marker Found"
          fi

          echo "└─ 🎉 Android 16 / 6.12 Fake Patch Reversal Complete"
        fi

        # Report Completion of Fake Patch Reversal
        echo "└─ 🎉 Kernel Fake Patches Reverted"
