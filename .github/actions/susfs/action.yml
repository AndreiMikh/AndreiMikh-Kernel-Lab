# SUSFS and Kernel Compatibility Patches Composite Action
name: 🩹 SUSFS and Kernel Compatibility Patches
description: Apply SUSFS Patches, Kernel Compatibility Fixes and Fake-Patch Handling
# Inputs Required by the Composite Action
inputs:
  WORKDIR:
    description: Working Directory
    required: true
  COMMONKERNELFOLDER:
    description: Kernel Source Directory
    required: true
  PATCHDIR:
    description: Patch Source Directory
    required: true
  # Root Engine Used by the Kernel Build
  ROOTENGINE:
    description: Root Engine
    required: true
  # SUSFS Revision, Commit, Tag, Branch or Numeric Rollback
  SUSFSREPOSITORY:
    description: SUSFS Revision or Rollback Value
    required: true
  # SUSFS Repository Variant (GKI or OGKI)
  SUSFSVARIANT:
    description: SUSFS Variant (GKI or OGKI)
    required: true
  # Enable the Development Branch Suffix
  SUSFSBRANCHDEV:
    description: SUSFS Development Branch
    required: true
  # Target Kernel Configuration
  FILE:
    description: Kernel Target Configuration
    required: true
  # Android Version Used to Select the SUSFS Branch
  ANDROIDVERSION:
    description: Android Kernel Base Version
    required: true
  # Kernel Version Used to Select SUSFS Branch and Patch
  KERNELVERSION:
    description: Kernel Version
    required: true
  # Kernel Sublevel Used by the Legacy Compatibility Fix
  SUBLEVEL:
    description: Kernel Sublevel
    required: true
# Outputs Exposed to Subsequent Workflow Steps
outputs:
  # Detected SUSFS Version From SUSFS Headers
  susfsver:
    description: Detected SUSFS Version
    value: ${{ steps.susfs.outputs.susfsver }}
runs:
  using: composite
  steps:
    # Apply Temporary Fake Patches Before SUSFS Integration
    - name: ♻️ Fake Patches (Invert)
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        # Kernel Source Directory
        COMMONKERNELFOLDER: ${{ inputs.COMMONKERNELFOLDER }}
        # Kernel Compatibility Patch Directory
        PATCHDIR: ${{ inputs.PATCHDIR }}
        # Android and Kernel Version Information
        ANDROIDVERSION: ${{ inputs.ANDROIDVERSION }}
        KERNELVERSION: ${{ inputs.KERNELVERSION }}
      run: |
        set -Eeuo pipefail
        # Enter Common Kernel Source Directory
        cd "$COMMONKERNELFOLDER"
        # Initialize the Temporary Fake Patch State File
        STATEFILE="${RUNNER_TEMP}/fake-patches-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.state"
        : > "$STATEFILE"
        # Initialize Fake Patch Tracking Flags
        fakepatched=0
        fakepatchedexpand=0
        fakepatchednrsubpages=0
        fakepatchedres=0
        fakepatcheddmabuf=0
        fakepatchedzswap=0
        fakepatchedswapslots=0
        # Apply Android 15 / Kernel 6.6 Compatibility Patches
        if [[ "$ANDROIDVERSION" == "android15" && "$KERNELVERSION" == "6.6" ]]; then
          # Add Missing FILESYSTEM TRACE HOOK Header
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            if grep -qxF '#include <trace/hooks/blk.h>' ./fs/namespace.c; then
              echo "└─ ♻️ Adding FILESYSTEM TRACE HOOK Header"
              sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace/hooks/fs.h>' ./fs/namespace.c
            fi
          fi

          # Apply FOLD FIXUP ENTRIES BACKPORT When Missing
          if ! grep -qxF 'extern void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end);' ./include/linux/page_size_compat.h; then
            echo "└─ ♻️ Applying FOLD FIXUP ENTRIES Backport"
            patch -p1 < "$PATCHDIR/SuSFS/Fold-Fixup-Entries.patch"
          fi

          # Add Fake NR SUBPAGES Declaration When Missing
          if ! grep -qE '^[[:space:]]*unsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;$' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ Adding Fake NR SUBPAGES Declaration"
            sed -i '/int ret = 0, copied = 0;/a\
                unsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c
            fakepatchednrsubpages=1
            fakepatched=1
          fi

          # Add Fake PAGEMAP ENTRY Declaration When Missing
          if ! grep -qE '^[[:space:]]*pagemap_entry_t \*res = NULL;$' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ Adding Fake PAGEMAP ENTRY Declaration"
            sed -i '/int ret = 0, copied = 0;/a\
                pagemap_entry_t *res = NULL;' ./fs/proc/task_mmu.c
            fakepatchedres=1
            fakepatched=1
          fi

          # Add Missing DMA BUF Header
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            if grep -qxF '#include <linux/cpufreq_times.h>' ./fs/proc/base.c; then
              echo "└─ ♻️ Adding DMA BUF Header"
              sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux/dma-buf.h>' ./fs/proc/base.c
              fakepatcheddmabuf=1
              fakepatched=1
            fi
          fi

          # Add Missing ZSWAP Header
          if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
            if grep -qxF '#include <linux/sched/sysctl.h>' ./mm/memory.c; then
              echo "└─ ♻️ Adding ZSWAP Header"
              sed -i '/#include <linux\/sched\/sysctl.h>/a #include <linux/zswap.h>' ./mm/memory.c
              fakepatchedzswap=1
              fakepatched=1
            fi
          fi

          # Temporarily Expand LAST VMA END Conditional Block
          if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c &&
             ! grep -qF 'SUSFS_IS_INODE_SUS_MAP' ./fs/proc/task_mmu.c &&
             ! grep -qF 'last_vma_end = vma->vm_end;' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ Expanding LAST VMA END Conditional Block"
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
            # Track Expansion Only if Replacement Occurred
            if grep -qF 'last_vma_end = vma->vm_end;' ./fs/proc/task_mmu.c; then
              fakepatchedexpand=1
              fakepatched=1
            fi
          fi
        fi

        # Android 12 / Kernel 5.10 Legacy Compatibility Check
        if [[ "$ANDROIDVERSION" == "android12" && "$KERNELVERSION" == "5.10" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ VMA PAGES(VMA) Line Missing; Marking Fake Patch"
            fakepatched=1
          fi
        fi

        # Android 13 / Kernel 5.15 Legacy Compatibility Checks
        if [[ "$ANDROIDVERSION" == "android13" && "$KERNELVERSION" == "5.15" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ VMA PAGES(VMA) Line Missing; Marking Fake Patch"
            fakepatched=1
          fi

          # Temporarily Remove SWAP SLOTS Headers When Present
          if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
            echo "└─ ♻️ Removing SWAP SLOTS Headers"
            sed -i '\|^#include <linux/swap_slots.h>$|d' ./mm/memory.c
            fakepatchedswapslots=1
            fakepatched=1
          fi
        fi

        # Android 14 / Kernel 6.1 Legacy Compatibility Checks
        if [[ "$ANDROIDVERSION" == "android14" && "$KERNELVERSION" == "6.1" ]]; then
          if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
            echo "└─ ♻️ VMA PAGES(VMA) Line Missing; Marking Fake Patch"
            fakepatched=1
          fi

          # Add Missing DMA BUF Header
          if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            if grep -qxF '#include <linux/cpufreq_times.h>' ./fs/proc/base.c; then
              echo "└─ ♻️ Adding DMA BUF Header"
              sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux/dma-buf.h>' ./fs/proc/base.c
              fakepatcheddmabuf=1
              fakepatched=1
            fi
          fi
        fi

        # Save Fake Patch Flags For Reverse Step
        {
          echo "fakepatched=$fakepatched"
          echo "fakepatchedexpand=$fakepatchedexpand"
          echo "fakepatchednrsubpages=$fakepatchednrsubpages"
          echo "fakepatchedres=$fakepatchedres"
          echo "fakepatcheddmabuf=$fakepatcheddmabuf"
          echo "fakepatchedzswap=$fakepatchedzswap"
          echo "fakepatchedswapslots=$fakepatchedswapslots"
        } > "$STATEFILE"
        # Export State File Path to Subsequent Workflow Steps
        echo "FAKEPATCHSTATEFILE=$STATEFILE" >> "$GITHUB_ENV"
        # Report Fake Patch Completion
        echo "🎉 Fake Patches Applied"

    # Clone SUSFS and Apply Patches
    - name: 🩹 SUSFS Integration
      id: susf
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        # Kernel Build Paths From Caller Environment
        WORKDIR: ${{ inputs.WORKDIR }}
        COMMONKERNELFOLDER: ${{ inputs.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ inputs.PATCHDIR }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
        # Root Engine and SUSFS Configuration
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        SUSFSREPOSITORY: ${{ inputs.SUSFSREPOSITORY }}
        SUSFSVARIANT: ${{ inputs.SUSFSVARIANT }}
        SUSFSBRANCHDEV: ${{ inputs.SUSFSBRANCHDEV }}
        FILE: ${{ inputs.FILE }}
        # Kernel Version Information
        ANDROIDVERSION: ${{ inputs.ANDROIDVERSION }}
        KERNELVERSION: ${{ inputs.KERNELVERSION }}
        SUBLEVEL: ${{ inputs.SUBLEVEL }}
      run: |
        set -euo pipefail
        # Construct Android and Kernel Version Identifier
        GKIVERSION="${ANDROIDVERSION}-${KERNELVERSION}"
        # Navigate to the Kernel Working Directory
        cd "$WORKDIR"
        # Display Kernel Environment Information
        echo "└─ 🧾 Android Version       : $ANDROIDVERSION"
        echo "└─ 🧾 Kernel Version        : $KERNELVERSION"
        echo "└─ 🔎 Detected Kernel Base  : $GKIVERSION"
        echo "└─ 📁 Kernel Directory      : $COMMONKERNELFOLDER"
        # Select SUSFS Repository, Branch and Optional Fallback
        echo "└─ 📥 Cloning SUSFS..."
        if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
          # Select the OGKI Repository and Branch
          BRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
          REPOURL="https://github.com/cctv18/susfs4oki.git"
          FALLBACKURL=""
        else
          # Select GKI Repository and GitHub Mirror
          BRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
          REPOURL="https://gitlab.com/simonpunk/susfs4ksu.git"
          FALLBACKURL="https://github.com/AndreiMikh/susfs4ksu.git"
        fi

        # Append Development Suffix When Enabled
        if [[ "$SUSFSBRANCHDEV" == "true" ]]; then
          BRANCH="${BRANCH}-dev"
        fi

        # Attempt to Clone Selected Branch up to Three Times
        CLONED=false
        for attempt in {1..3}; do
          # Remove Any Previous Failed Clone
          rm -rf susfs4ksu
          # Clone Requested Branch With Shallow History
          if git clone --depth=1 --single-branch \
            --branch "$BRANCH" \
            "$REPOURL" susfs4ksu; then
            echo "└─ 📌 SUSFS Clone Successful"
            CLONED=true
            break
          fi

          # Remove Incomplete Repository Before Retrying
          rm -rf susfs4ksu
          # Delay Between Retry Attempts
          if [[ "$attempt" -lt 3 ]]; then
            echo "└─ ⚠️ Clone Failed (Attempt $attempt/3)"
            sleep $((attempt * 3))
          fi
          
        done

        # Try GitHub Mirror if Primary Clone Failed
        if [[ "$CLONED" != "true" && -n "$FALLBACKURL" ]]; then
          echo "└─ ⚠️ GitLab Unavailable, Trying GitHub Mirror..."
          if git clone --depth=1 --single-branch \
            --branch "$BRANCH" \
            "$FALLBACKURL" susfs4ksu; then
            echo "└─ 📌 SUSFS GitHub Mirror Clone Successful"
            CLONED=true
          fi
        fi

        # Stop Build if No Repository Could be Cloned
        if [[ "$CLONED" != "true" ]]; then
          echo "└─ ⚠️ SUSFS Clone Failed"
          echo "└─ 📦 Repository : $REPOURL"
          echo "└─ 🌿 Branch     : $BRANCH"
          [[ -z "$FALLBACKURL" ]] || echo "└─ 🔄 Fallback   : $FALLBACKURL"
          exit 1
        fi

        # Display Selected SUSFS Branch
        echo "└─ 📌 SUSFS Branch : $BRANCH"
        # Enter Cloned SUSFS Repository
        cd susfs4ksu || exit 1
        # Check Whether Specific SUSFS Revision was Requested
        if [[ -n "${SUSFSREPOSITORY:-}" && "$SUSFSREPOSITORY" != "-1" ]]; then
          echo "└─ 🔎 SUSFS Revision : $SUSFSREPOSITORY"
          # Numeric Values Select a Previous Commit Relative to HEAD
          if [[ "$SUSFSREPOSITORY" =~ ^[0-9]+$ ]]; then
            echo "└─ 📦 Fetching Additional Git History..."
            # Expand Shallow Clone or Fetch Additional History
            git fetch --unshallow || git fetch --depth=1000 origin "$BRANCH"
            # Checkout Requested Historical Commit
            git checkout "HEAD~$SUSFSREPOSITORY" || {
              echo "└─ ⚠️ Failed Checkout HEAD~$SUSFSREPOSITORY"
              exit 1
            }
          else
            # Expand History When Commit Hash is Supplied
            if [[ "$SUSFSREPOSITORY" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "└─ 📦 Expanding Shallow Clone History..."
              git fetch --unshallow origin || \
                git fetch --deepen=200 origin "$BRANCH"
            fi

            # Checkout Requested Commit, Tag or Branch
            git checkout "$SUSFSREPOSITORY" || {
              echo "└─ ⚠️ Invalid SUSFS Revision"
              exit 1
            }
          fi
        fi

        # Display Active SUSFS Commit
        echo "└─ 📌 Active SUSFS Commit : $(git rev-parse --short HEAD)"
        # Detect SUSFS Version From its Header
        SUSFSVER="Unknown"
        SUSFSHEADER="./kernel_patches/include/linux/susfs.h"
        if [[ -f "$SUSFSHEADER" ]]; then
          SUSFSVER=$(
            awk -F'"' '/SUSFS_VERSION/ {print $2; exit}' "$SUSFSHEADER"
          )
          SUSFSVER="${SUSFSVER:-Unknown}"
        fi

        # Export SUSFS Version to Workflow Environment and Step Output
        echo "└─ 📦 SUSFS Version : $SUSFSVER"
        echo "SUSFSVER=$SUSFSVER" >> "$GITHUB_ENV"
        echo "susfsver=$SUSFSVER" >> "$GITHUB_OUTPUT"
        # Return to Working Directory
        cd ..
        # Find SUSFS Core Patch Files Matching Current Kernel Base
        echo "└─ 🔎 Searching SUSFS Patches..."
        shopt -s nullglob
        SUSFSPATCHLIST=(./susfs4ksu/kernel_patches/50_add_susfs_in_gki-"${ANDROIDVERSION}"-"${KERNELVERSION}"*.patch)
        # Stop if No Matching SUSFS Patch Exists
        if [[ ${#SUSFSPATCHLIST[@]} -eq 0 ]]; then
          echo "└─ ⚠️ No SUSFS Patch Found"
          ls ./susfs4ksu/kernel_patches/ || true
          exit 1
        fi

        # Select Last Matching Patch from Sorted Array
        SUSFSPATCH="${SUSFSPATCHLIST[-1]}"
        # Copy SUSFS Patch Files into the Common Kernel Source Tree
        echo "└─ 🧾 SUSFS Patch Directory : $SUSFSPATCH"
        if [[ "$SUSFSREPOSITORY" != "-1" ]]; then
          echo "└─ 📥 Copying SUSFS Patches..."
          # Copy Main SUSFS Patch
          cp "$SUSFSPATCH" "${COMMONKERNELFOLDER}/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Patches"
          # Copy SUSFS Filesystem Changes
          cp -r ./susfs4ksu/kernel_patches/fs/* "${COMMONKERNELFOLDER}/fs/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Filesystem"
          # Copy SUSFS Linux Header Changes
          cp -r ./susfs4ksu/kernel_patches/include/linux/* "${COMMONKERNELFOLDER}/include/linux/" 2>/dev/null || \
            echo "└─ ⚠️ Failed to Copy SUSFS Linux Header"
        fi

        # Enter Common Kernel Source Directory
        cd "$COMMONKERNELFOLDER"
        # Apply the SUSFS Core Patch
        echo "└─ ⚙️ Applying SUSFS Core Patch (50 Add SUSFS Patch)"
        if patch -p1 < "$(basename "$SUSFSPATCH")"; then
          echo "└─ 📌 SUSFS 50 Enable Core Patch Applied"
        else
          # Preserve Original Behavior: Warn and Continue on Failure
          echo "└─ ⚠️ SUSFS Core Patch Already Applied or Failed"
        fi

        # Apply SUSFS Enable Patch Only For KernelSU
        if [[ "$ROOTENGINE" == "KernelSU" ]]; then
          echo "⚙️ Applying KernelSU SUSFS enable patch"
          # Select Branch for SUSFS Enable Patch
          if [[ "$SUSFSVARIANT" == "OGKI" ]]; then
            PATCHBRANCH="oki-${ANDROIDVERSION}-${KERNELVERSION}"
          else
            PATCHBRANCH="gki-${ANDROIDVERSION}-${KERNELVERSION}"
          fi

          # Append Development Suffix When Enabled
          [[ "${SUSFSBRANCHDEV}" == "true" ]] && PATCHBRANCH="${PATCHBRANCH}-dev"
          # Build SUSFS Enable Patch URL Based on Variant
          case "$SUSFSVARIANT" in
            GKI)
              SUSFS10URL="https://gitlab.com/simonpunk/susfs4ksu/-/raw/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
              ;;
            OGKI)
              SUSFS10URL="https://raw.githubusercontent.com/cctv18/susfs4oki/${PATCHBRANCH}/kernel_patches/${ROOTENGINE}/10_enable_susfs_for_ksu.patch"
              ;;
            *)
              # Reject Unsupported SUSFS Variants
              echo "└─ ⚠️ Invalid SUSFS Variant"
              exit 1
              ;;
          esac
          # Verify the SUSFS Enable Patch URL Is Reachable
          echo "🔍 Checking Patch URL..."
          if ! wget --spider "$SUSFS10URL"; then
            echo "└─ ⚠️ Patch Does Not Exist :"
            echo "$SUSFS10URL"
            exit 1
          fi

          # Download the SUSFS Enable Patch
          echo "🌐 Downloading Patch : $SUSFS10URL"
          if ! wget "$SUSFS10URL" -O enable.patch; then
            echo "└─ ⚠️ Failed to Download SUSFS Enable Patch"
            exit 1
          fi

          # Track Whether Enable Patch Was Applied Successfully
          APPLIED=false
          # Save Current Directory for Cleanup and Return
          ORIGDIR="$(pwd)"
          # Resolve KernelSU Source Directory
          KSUDIR="$(dirname "$COMMONKERNELFOLDER")/KernelSU"
          echo "└─ 📂 Current Directory : $(pwd)"
          echo "└─ 🔧 Applying SUSFS Enable Patch..."
          # Stop if KernelSU Source Directory is Missing
          if [[ ! -d "$KSUDIR" ]]; then
            echo "└─ ⚠️ KernelSU Directory Not Found :"
            echo "└─ $KSUDIR"
            rm -f "$ORIGDIR/enable.patch"
            exit 1
          fi

          # Enter Root Engine Source (KernelSU) Directory
          echo "└─ 📂 Entering KernelSU Directory..."
          cd "$KSUDIR" || exit 1
          echo "└─ 📂 Current Directory : $(pwd)"
          echo "└─ 🔧 Applying SUSFS Enable Patch..."
          # Apply the SUSFS Enable Patch
          if patch -p1 < "$ORIGDIR/enable.patch"; then
            APPLIED=true
            echo "📌 SUSFS Enable Patch Applied Successfully"
          else
            # Preserve the Original Behavior: Warn and Skip on Failure
            echo "└─ ⚠️ SUSFS Enable Patch is Not Compatible with KernelSU Source Tree"
            echo "└─ ℹ️ Skipping SUSFS Enable Patch"
          fi

          # Return to the Original Directory and Remove the Temporary Patch
          echo "└─ 📂 Returning to Original Directory..."
          cd "$ORIGDIR" || exit 1
          rm -f "$ORIGDIR/enable.patch"
          # Report the Final Enable Patch Status
          if [[ "$APPLIED" == "true" ]]; then
            echo "└─ 📌 KernelSU SUSFS Enable Patch Completed"
          else
            echo "└─ ⚠️ KernelSU SUSFS Enable Patch Skipped"
          fi
          
        else
          # Skip the KernelSU Enable Patch for Other Root Engines
          echo "└─ ♻️ Skipping KernelSU SUSFS Enable Patch (Root = $ROOTENGINE)"
        fi

        echo "🎉 SUSFS Patches Complete"
        # Apply the Legacy Compatibility Fix for Older Android 13 Kernel 5.15 Builds
        if [[ "$GKIVERSION" == "android13-5.15" && "$SUBLEVEL" -lt 123 ]]; then
          # Resolve the Legacy Compatibility Patch Path
          LEGACYPATCH="${PATCHDIR}/Legacy-5.15-Fix.patch"
          # Stop if the Required Legacy Patch Is Missing
          if [[ ! -f "$LEGACYPATCH" ]]; then
            echo "└─ ⚠️ Patch Not Found : $LEGACYPATCH"
            exit 1
          fi

          echo "└─ 🚀 Applying Legacy Fix (Kernel 5.15.0–5.15.123)"
          # Skip the Patch if It Is Already Applied
          if patch -R -p1 --dry-run < "$LEGACYPATCH" >/dev/null 2>&1; then
            echo "└─ ⚠️ Patch Already Applied — Skipping"
          else
            # Apply Legacy Fix
            if patch -p1 < "$LEGACYPATCH"; then
              echo "📌 Legacy 5.15 Fix Applied"
            else
              echo "└─ ⚠️ Patch Failed"
              exit 1
            fi
          fi
        fi

        # Load Reject Checker and Check for Patch Rejects
        source "$REJECTCHECKER"
        checkrejects .
        echo "└─ 🎉 Kernel Compatibility Fix Stage Completed"

    # Revert Temporary Fake Patches After SUSFS Integration
    - name: ♻️ Fake Patches (Reverse)
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      env:
        # Kernel Source Directory
        COMMONKERNELFOLDER: ${{ inputs.COMMONKERNELFOLDER }}
        # Android and Kernel Version Information
        ANDROIDVERSION: ${{ inputs.ANDROIDVERSION }}
        KERNELVERSION: ${{ inputs.KERNELVERSION }}
      run: |
        set -Eeuo pipefail
        # Enter Common Kernel Source Directory
        cd "$COMMONKERNELFOLDER"
        # Validate the Fake Patch State File
        if [[ -z "${FAKEPATCHSTATEFILE:-}" || ! -f "$FAKEPATCHSTATEFILE" ]]; then
          echo "└─ ⚠️ Fake Patch State File Not Found"
          exit 1
        fi

        # Restore Fake Patch Tracking Flags
        source "$FAKEPATCHSTATEFILE"
        # Revert Android 15 / Kernel 6.6 Fake Patches
        if [[ "$ANDROIDVERSION" == "android15" && "$KERNELVERSION" == "6.6" ]]; then
          # Revert Temporary LAST VMA END Conditional Block Expansion
          if [[ "$fakepatchedexpand" == 1 ]]; then
            echo "└─ ♻️ Reverting LAST VMA END Conditional Block"
            perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
          fi

          # Remove Fake NR SUBPAGES Declaration
          if [[ "$fakepatchednrsubpages" == 1 ]]; then
            echo "└─ ♻️ Removing Fake NR SUBPAGES Declaration"
            sed -i '/^[[:space:]]*unsigned int nr_subpages = __PAGE_SIZE \/ PAGE_SIZE;$/d' ./fs/proc/task_mmu.c
          fi

          # Remove Fake PAGEMAP ENTRY Declaration
          if [[ "$fakepatchedres" == 1 ]]; then
            echo "└─ ♻️ Removing Fake PAGEMAP ENTRY Declaration"
            sed -i '/^[[:space:]]*pagemap_entry_t \*res = NULL;$/d' ./fs/proc/task_mmu.c
          fi

          # Remove DMA BUF Headers Added by Fake Patch
          if [[ "$fakepatcheddmabuf" == 1 ]]; then
            echo "└─ ♻️ Removing Added DMA BUF Headers"
            sed -i '\|^#include <linux/dma-buf.h>$|d' ./fs/proc/base.c
          fi

          # Remove ZSWAP Headers Added by Fake Patch
          if [[ "$fakepatchedzswap" == 1 ]]; then
            echo "└─ ♻️ Removing Added ZSWAP Headers"
            sed -i '\|^#include <linux/zswap.h>$|d' ./mm/memory.c
          fi
        fi

        # Revert Android 13 / Kernel 5.15 Fake Patch
        if [[ "$ANDROIDVERSION" == "android13" && "$KERNELVERSION" == "5.15" ]]; then
          # Restore SWAP SLOTS Headers Only if Step Removed it
          if [[ "$fakepatchedswapslots" == 1 ]]; then
            if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
              echo "└─ ♻️ Restoring SWAP SLOTS Headers"
              if grep -qxF '#include <linux/vmalloc.h>' ./mm/memory.c; then
                sed -i '/#include <linux\/vmalloc.h>/a #include <linux/swap_slots.h>' ./mm/memory.c
              else
                echo "└─ ⚠️ VMALLOC Headers Anchor Missing; Cannot Restore SWAP SLOTS Headers"
                exit 1
              fi
            fi
          fi
        fi

        # Revert Android 14 / Kernel 6.1 Fake Patch
        if [[ "$ANDROIDVERSION" == "android14" && "$KERNELVERSION" == "6.1" ]]; then
          # Remove DMA BUF Header Added by Fake Patch
          if [[ "$fakepatcheddmabuf" == 1 ]]; then
            echo "└─ ♻️ Removing Added DMA BUF Header"
            sed -i '\|^#include <linux/dma-buf.h>$|d' ./fs/proc/base.c
          fi
        fi

        # Add VMA PAD START Fallback if Required
        if [[ -f ./fs/proc/task_mmu.c ]] &&
           grep -qF 'VMA_PAD_START(' ./fs/proc/task_mmu.c &&
           ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|^[[:space:]]*#define[[:space:]]+VMA_PAD_START\b' ./fs/proc/task_mmu.c; then
          echo "└─ ♻️ Adding VMA PAD START Fallback"
          if grep -qxF '#include "internal.h"' ./fs/proc/task_mmu.c; then
            sed -i '/#include "internal.h"/a\
        \
        #undef VMA_PAD_START\
        #ifndef VMA_PAD_START\
        #define VMA_PAD_START(vma) ((vma)->vm_end)\
        #endif' ./fs/proc/task_mmu.c
          else
            echo "└─ ⚠️ INTERNAL Headers Anchor Missing; Cannot Add VMA PAD START Fallback"
            exit 1
          fi
        fi

        # Remove Temporary Fake Patch State File
        rm -f "$FAKEPATCHSTATEFILE"
        # Report Fake Patch Reversal Completion
        echo "🎉 Fake Patches Reverted"
