name: 🧩 Resolve Root Source
description: Resolve Engine Source(s)
inputs:
  ROOTBRANCHSOURCE:
    required: true
  ROOTENGINE:
    required: true
outputs:
  ksurepo:
    description: KSU setup repository
    value: ${{ steps.manager.outputs.ksurepo }}
  releaserepo:
    description: Manager release repository
    value: ${{ steps.manager.outputs.releaserepo }}
  releasebranch:
    description: Manager release branch
    value: ${{ steps.manager.outputs.releasebranch }}
  managerbranch:
    description: Manager branch
    value: ${{ steps.manager.outputs.managerbranch }}
  branchpath:
    description: Manager branch path
    value: ${{ steps.manager.outputs.branchpath }}
  managerartifact:
    description: Manager artifact
    value: ${{ steps.manager.outputs.managerartifact }}
  managertag:
    description: Latest manager tag
    value: ${{ steps.manager.outputs.managertag }}
  ksuversion:
    description: KSU version
    value: ${{ steps.manager.outputs.ksuversion }}
runs:
  using: composite
  steps:
    - name: 🧩 Solve APK Source
      id: manager
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        ROOTBRANCHSOURCE="${{ inputs.ROOTBRANCHSOURCE }}"
        ROOTENGINE="${{ inputs.ROOTENGINE }}"
        MANAGERBRANCH=""
        BRANCHPATH=""
        MANAGERARTIFACT=""
        # Setup / Source Repository Used for Cloning or Preparing Manager
        KSUREPO=""
        # Repository and Branch Used for the Root Source Version / Release Resolution
        VERSIONREPO=""
        VERSIONBRANCH=""
        VERSIONOFFSET=""
        # Resolve Root Source
        case "$ROOTBRANCHSOURCE" in
          SukiSU-Ultra-Builtin)
            MANAGERBRANCH="main"
            BRANCHPATH="builtin"
            MANAGERARTIFACT="manager"
            ;;
          KernelSU-Next-Dev-SUSFS)
            MANAGERBRANCH="dev-susfs"
            BRANCHPATH=""
            MANAGERARTIFACT="manager"
            ;;
          KernelSU-Main)
            MANAGERBRANCH="main"
            BRANCHPATH=""
            MANAGERARTIFACT="manager"
            ;;
          BakaSU-Main)
            MANAGERBRANCH="main"
            BRANCHPATH=""
            MANAGERARTIFACT="Manager-release"
            ;;
          BakaSU-Dev)
            MANAGERBRANCH="dev"
            BRANCHPATH=""
            MANAGERARTIFACT="Manager-release"
            ;;
          *)
            echo "└─ ⚠️ Unsupported Root Source: $ROOTBRANCHSOURCE"
            exit 1
            ;;
        esac
        # Resolve Root Engine Repository
        case "$ROOTENGINE" in
          SukiSU-Ultra)
            KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
            VERSIONREPO="SukiSU-Ultra/SukiSU-Ultra"
            RELEASEREPO="$KSUREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU-Next)
            KSUREPO="pershoot/KernelSU-Next"
            VERSIONREPO="KernelSU-Next/KernelSU-Next"
            RELEASEREPO="$VERSIONREPO"
            RELEASEBRANCH="dev"
            ;;
          BakaSU)
            KSUREPO="Baka-SU/BakaSU"
            VERSIONREPO="Baka-SU/BakaSU"
            RELEASEREPO="$KSUREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU)
            KSUREPO="tiann/KernelSU"
            VERSIONREPO="tiann/KernelSU"
            RELEASEREPO="$KSUREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          *)
            echo "└─ ⚠️ Unsupported Root Engine: $ROOTENGINE"
            exit 1
            ;;
        esac
        # Validate Resolution
        [[ -n "$MANAGERBRANCH" ]] || {
          echo "└─ ⚠️ Failed to Resolve Manager Branch"
          exit 1
        }
        [[ -n "$KSUREPO" ]] || {
          echo "└─ ⚠️ Failed to Resolve Root Engine Repository"
          exit 1
        } 
        [[ -n "$VERSIONREPO" ]] || {
          echo "└─ ⚠️ Failed to Resolve Root Engine Repository"
          exit 1
        }         
        echo ""
        echo "------------------------------"
        echo "└─ 🔗 Repository     : $KSUREPO"
        echo "└─ 🌿 Manager Branch : $MANAGERBRANCH"
        echo "└─ 📁 Setup Repo     : ${BRANCHPATH:-None}"
        echo "└─ 📦 Manager Artifact: $MANAGERARTIFACT"
        echo "------------------------------"
        # Resolve Root Source Version
        case "$ROOTENGINE" in
          SukiSU-Ultra)
            VERSIONOFFSET="37185"
            VERSIONBRANCH="main"
            ;;
          BakaSU)
            VERSIONOFFSET="30700"
            VERSIONBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU-Next)
            VERSIONOFFSET="30000"
            VERSIONBRANCH="dev"
            ;;
          KernelSU)
            VERSIONOFFSET="30000"
            VERSIONBRANCH="$MANAGERBRANCH"
            ;;
          *)
            echo "└─ ⚠️ Unsupported Root Engine: $ROOTENGINE"
            exit 1
            ;;
        esac
        [[ "$VERSIONOFFSET" =~ ^[0-9]+$ ]] || {
          echo "└─ ⚠️ Invalid Version Offset: $VERSIONOFFSET"
          exit 1
        }
        [[ -n "$VERSIONBRANCH" ]] || {
          echo "└─ ⚠️ Failed to Resolve Root Source Version / Branch"
          exit 1
        }
        echo ""
        echo "------------------------------"
        echo "└─ 📦 Engine            : $ROOTENGINE"
        echo "└─ 🔗 Setup Repository  : $KSUREPO"
        echo "└─ 🌿 Setup Branch      : $MANAGERBRANCH"
        echo "└─ 📁 Setup Path        : ${BRANCHPATH:-None}"
        echo "└─ 📦 Manager Artifact  : $MANAGERARTIFACT"
        echo "------------------------------"
        echo "└─ 🔢 Version Source    : $VERSIONREPO"
        echo "└─ 🌿 Version Branch    : $VERSIONBRANCH"
        echo "└─ ➕ Version Offset    : $VERSIONOFFSET"
        echo "------------------------------"
        # Validate Version Branch
        echo "└─ 🔎 Validating Version Branch..."
        if ! gh api \
          "repos/${VERSIONREPO}/git/ref/heads/${VERSIONBRANCH}" \
          --silent >/dev/null 2>&1; then
          echo "└─ ⚠️ Version Branch Not Found"
          echo "└─ Repository : $VERSIONREPO"
          echo "└─ Branch     : $VERSIONBRANCH"
          exit 1
        fi

        echo "✔ Version Branch: $VERSIONBRANCH"
      
        echo ""
        echo "------------------------------"         
        echo "└─ 🔎 Resolving $ROOTENGINE Root Source Version..."
        COMMITCOUNT="$(
          gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $expression: String!) {
                repository(owner: $owner, name: $repo) {
                  object(expression: $expression) {
                    ... on Commit {
                      history(first: 1) {
                        totalCount
                      }
                    }
                  }
                }
              }
            ' \
            -F owner="${VERSIONREPO%%/*}" \
            -F repo="${VERSIONREPO#*/}" \
            -F expression="${VERSIONBRANCH}^{commit}" \
            --jq '.data.repository.object.history.totalCount // empty'
        )"
        # Calculate Root Source Version
        [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]] || {
          echo "└─ ⚠️ Failed to Resolve $ROOTENGINE Commit Count"
          exit 1
        }
        KSUVERSION=$((COMMITCOUNT + VERSIONOFFSET))
        [[ "$KSUVERSION" =~ ^[0-9]+$ ]] || {
          echo "└─ ⚠️ Invalid Root Source Version: $KSUVERSION"
          exit 1
        }
        echo "└─ 📊 Commit Count         : $COMMITCOUNT"
        echo "└─ ➕ Offset               : $VERSIONOFFSET"
        echo "└─ 🔢 Root Source Version  : $KSUVERSION"
        # Resolve Latest Manager Tag
        echo "------------------------------"
        echo "└─ 🔎 Resolving Latest Manager Tag..."
        # Primary: Git Tags
        MANAGERTAG="$(
          gh api \
            "repos/${RELEASEREPO}/git/matching-refs/tags/" \
            --paginate \
            --jq '.[].ref | sub("^refs/tags/"; "")' |
          sort -V |
          tail -n 1
        )"
        if [[ -n "$MANAGERTAG" ]]; then
          echo "└─ ✔ Latest Manager Tag: $MANAGERTAG"
        else
          echo "└─ ⚠️ No Git Tag Found"
          echo "└─ 🔄 Falling Back to GitHub Releases..."
          RELEASEJSON="$(
            gh api \
              "repos/${RELEASEREPO}/releases?per_page=100" \
              2>/dev/null || true
          )"
          if [[ -n "$RELEASEJSON" ]] && \
             jq -e 'type == "array"' >/dev/null 2>&1 <<< "$RELEASEJSON"; then
            MANAGERTAG="$(
              jq -r '
                map(select(
                  .draft == false and
                  .prerelease == false and
                  (.tag_name // "") != ""
                )) |
                sort_by(.published_at // "") |
                reverse |
                .[0].tag_name // empty
              ' <<< "$RELEASEJSON"
            )"
          fi

          if [[ -n "$MANAGERTAG" ]]; then
            echo "└─ ✔ Manager Tag From Release: $MANAGERTAG"
          else
            echo "└─ ⚠️ No Manager Tag Found"
            echo "└─ Release Repository : $RELEASEREPO"
            echo "└─ Manager Artifact    : $MANAGERARTIFACT"
            echo "└─ Continuing Without Release Tag"
          fi
        fi
       
        echo "└─ 🏷️ Latest Manager Tag: $MANAGERTAG"
        # Export Outputs
        {
          echo "managerbranch=$MANAGERBRANCH"
          echo "branchpath=$BRANCHPATH"
          echo "managerartifact=$MANAGERARTIFACT"
          echo "ksurepo=$KSUREPO"
          echo "releaserepo=$RELEASEREPO"
          echo "releasebranch=$RELEASEBRANCH"
          echo "managertag=$MANAGERTAG"
          echo "ksuversion=$KSUVERSION"        
        } >> "$GITHUB_OUTPUT"
        echo "└─ 📦 Engine       : $ROOTENGINE"
        echo "└─ 📂 Repository   : $KSUREPO"
        echo "└─ 🌿 Branch       : $MANAGERBRANCH"
        echo "└─ 📁 Setup Repo   : ${BRANCHPATH:-None}"
        echo "└─ 📦 Artifact     : $MANAGERARTIFACT"
        echo "└─ 🏷️ Manager Tag  : $MANAGERTAG"
        echo "└─ 📊 Commit Count : $COMMITCOUNT"
        echo "└─ 🔢 KSU Version  : $KSUVERSION"
        echo "------------------------------"
