# Kernel Artifact Upload Composite Action
name: 📤 Upload Kernel Artifacts
description: Upload Flashable Kernel, NoMount Userspace and Compiler Cache Artifacts
# Define Inputs Required by Composite Action
inputs:
  # Define Complete Kernel Version
  FULLVERSION:
    description: Complete Kernel Version
    required: true
  # Define Root Engine Version
  KSUVERSION:
    description: Root Engine Version
    required: true
  # Define Kernel Configuration
  FILE:
    description: Kernel Configuration
    required: true
  # Define Kernel Build Suffix
  SUFFIX:
    description: Kernel Build Suffix
    required: true
  # Define NoMount Configuration
  NOMOUNT:
    description: NoMount Configuration
    required: false
    default: Disabled
  # Define NoMount Repository Commit
  NOMOUNTSHA:
    description: NoMount Commit SHA
    required: false
    default: ''
  # Define CCache Save Status
  CCACHESAVE:
    description: Whether CCache Should Be Saved
    required: false
    default: 'false'
  # Define CCache Tarball Path
  TAR:
    description: CCache Tarball
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Upload Flashable Kernel Artifact
    # Package AnyKernel3 Files For Kernel Installation
    # Retain Uploaded Artifact For 7 Days
    - name: 📤 Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v7
      with:
        # Build Kernel Artifact Name
        name: "${{ inputs.FULLVERSION }}-${{ inputs.KSUVERSION }}-${{ inputs.FILE }}-${{ inputs.SUFFIX }}"
        # Upload Flashable Kernel Files
        path: ./AnyKernel3/*
        # Retain Artifact For 7 Days
        retention-days: 7

    # Upload NoMount Userspace
    # Only Upload When NoMount or NoMount-Dev Is Selected
    - name: 📤 Upload NoMount Userspace
      if: ${{ inputs.NOMOUNT == 'NoMount' || inputs.NOMOUNT == 'NoMount-Dev' }}
      uses: actions/upload-artifact@v7
      with:
        # Build NoMount Userspace Artifact
        name: ${{ inputs.NOMOUNT }}-Package-Kernel(${{ inputs.FULLVERSION }})-Commit(${{ inputs.NOMOUNTSHA }})
        # Upload NoMount Userspace Files
        path: |
          ${{ github.workspace }}/kernel_workspace/output/NoMount-*.zip
        # Warn When No ZIP is Found
        if-no-files-found: warn
        retention-days: 7

    # Upload Compiler Cache Tarball
    # Use Custom Composite Action to Upload CCache ZST Archive
    - name: 📤 Upload Compiler Cache Tarball
      uses: ./kernel_workspace/AndreiMikh-Kernel-Lab/.github/actions/Upload-CCache-ZST
      with:
        # Pass CCache Save Status
        CCACHESAVE: ${{ inputs.CCACHESAVE }}
        # Pass CCache Tarball
        TAR: ${{ inputs.TAR }}
