# Kernel Artifact Upload Composite Action
name: 📤 Upload Kernel Artifacts
description: Upload Flashable Kernel, NoMount Userspace and Compiler Cache Artifacts
# Define Inputs Required by Composite Action
inputs:
  # Define Complete Kernel Version
  FULLVERSION:
    description: Complete Kernel Version
    required: true
  # Define Root Engine Version
  KSUVERSION:
    description: Root Engine Version
    required: true
  # Define Kernel Configuration
  FILE:
    description: Kernel Configuration
    required: true
  # Define Kernel Build Suffix
  SUFFIX:
    description: Kernel Build Suffix
    required: true
  # Define NoMount Configuration
  NOMOUNT:
    description: NoMount Configuration
    required: false
    default: Disabled
  # Define NoMount Userspace ZIP Path
  NOMOUNTZIP:
    description: NoMount Userspace Module ZIP Path
    required: false
    default: ''
  # Define NoMount Repository Commit
  NOMOUNTSHA:
    description: NoMount Commit SHA
    required: false
    default: ''
  # Define CCache Save Status
  CCACHESAVE:
    description: Whether CCache Should Be Saved
    required: false
    default: 'false'
  # Define CCache Tarball Path
  TAR:
    description: CCache Tarball
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Upload Flashable Kernel Artifact
    # Package AnyKernel3 Files For Kernel Installation
    # Retain Uploaded Artifact For 7 Days
    - name: 📤 Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v7
      with:
        # Build Kernel Artifact Name
        name: "${{ inputs.FULLVERSION }}-${{ inputs.KSUVERSION }}-${{ inputs.FILE }}-${{ inputs.SUFFIX }}"
        # Upload Flashable Kernel Files
        path: ./AnyKernel3/*
        # Retain Artifact For 7 Days
        retention-days: 7

    # Upload NoMount Userspace Module ZIP
    # Only Upload When NoMount or NoMount-Dev is Selected
    - name: 📤 Upload NoMount Userspace
      if: ${{ inputs.NOMOUNT == 'NoMount' || inputs.NOMOUNT == 'NoMount-Dev' }}
      uses: actions/upload-artifact@v7
      with:
        # Build NoMount Artifact Name
        name: Package-NoMount-${{ inputs.FULLVERSION }}
        # Upload Only Module ZIP and its SHA-256 Checksum
        path: |
          ${{ github.workspace }}/kernel_workspace/output/NoMount-MetaModule-*.zip
          ${{ github.workspace }}/kernel_workspace/output/NoMount-MetaModule-*.zip.sha256
        # Exclude Parent Directory Structure
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    # Upload Compiler Cache Tarball
    # Upload CCache Tarball to GitHub Release
    - name: 📤 Upload Compiler Cache Tarball
      # Run Only When CCache Saving is Enabled and Tarball Path is Provided
      if: ${{ inputs.CCACHESAVE == 'true' && inputs.TAR != '' }}
      shell: bash
      # Export and Import Required Environment Variables
      env:
        OWNER: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        TAR: ${{ inputs.TAR }}
        TAG: ${{ env.CPU }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Validate Compiler Cache Tarball
        echo "└─ 📦 CCache Tarball :"
        echo "└─    $TAR"
        # Check Whether Compiler Cache Tarball Exists
        if [[ ! -f "$TAR" ]]; then
          # Report Missing CCache Tarball
          echo "└─ ⚠️ CCache Tarball Not Found :"
          echo "└─    $TAR"
          echo "└─ ⏭️ Skipping Compiler Cache Tarball Upload..."
        else
          # Validate GitHub Release Tag
          if [[ -z "$TAG" ]]; then
            echo "└─ ⚠️ GitHub Release Tag is Empty"
            exit 1
          fi

          # Display Compiler Cache Tarball Details
          echo "└─ 📌 Tarball Found :"
          ls -lh "$TAR"
          # Get Current Date and Time (UTC+8)
          TIMESTAMP=$(TZ='Asia/Manila' date '+%Y-%m-%d %H:%M:%S GMT+0800')
          # Check Whether GitHub Release Already Exists
          echo "└─ 🔎 Checking GitHub Release :"
          echo "└─    $TAG"
          if ! gh release view "$TAG" --repo "$OWNER" >/dev/null 2>&1; then
            # Report if Requested Release Does Not Exist
            echo "└─ ⚠️ GitHub Release Not Found :"
            echo "└─    $TAG"
            # Create New GitHub Release For Detected CPU Tag
            echo "└─ 🚀 Creating GitHub Release..."
            gh release create "$TAG" \
              --repo "$OWNER" \
              --title "CCache - $TAG" \
              --notes "$(cat <<EOF
        📦 Compiler Cache Tarball
        └─ 🏷️ Tag      : $TAG
        └─ 🤖 Workflow : ${GITHUB_WORKFLOW}
        └─ 📅 Updated  : ${TIMESTAMP}
        EOF
        )"
            # Confirm Successful Release Creation
            echo "└─ 🎉 GitHub Release Created Successfully"
          else
            # Reuse Existing Release if it Already Exists
            echo "└─ 📌 GitHub Release Found : $TAG"
          fi

          # Upload Compiler Cache Tarball to GitHub Release
          # Replace Existing Asset With the Same File Name if Present
          echo "└─ 🚀 Uploading Compiler Cache Tarball..."
          gh release upload \
            "$TAG" \
            "$TAR" \
            --repo "$OWNER" \
            --clobber
          # Report Successful Compiler Cache Tarball Upload
          echo "└─ 🎉 CCache Tarball Uploaded Successfully"
          echo "└─ 📦 Release Tag : $TAG"
          echo "└─ 🕒 Timestamp   : $TIMESTAMP"
        fi
