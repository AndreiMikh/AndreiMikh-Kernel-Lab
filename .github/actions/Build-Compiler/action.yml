name: ⚙️ Setup Build Toolchains
description: Setup Zig and Kotlin Compilers, Reuse Verified Kotlin Release Cache and Clean Previous Zig Caches
runs:
  using: composite
  steps:
    # Setup Zig Toolchain
    # Install Zig 0.16.0 and Enable Its Built-In GitHub Actions Cache
    - name: ⚙️ Setup Zig Toolchain
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        use-cache: true
        cache-size-limit: 2048
   
    # Resolve and Setup Kotlin Compiler
    # Resolve and Install Latest Stable Kotlin Compiler
    - name: 🧰 Setup Kotlin Compiler
      shell: bash
      # Import GitHub Authentication and Repository Information
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Define Kotlin Installation and Download Paths
        KOTLINHOME="$HOME/kotlinc"
        KOTLINZIP="$RUNNER_TEMP/kotlinc.zip"
        KOTLINPART="${KOTLINZIP}.part"
        KOTLINSTAGE="$RUNNER_TEMP/kotlin-install"
        KOTLINCACHEDIR="$RUNNER_TEMP/kotlin-cache"
        # Define Kotlin GitHub Release and Asset Names
        KOTLINRELEASE="Kotlin"
        KOTLINCACHE="kotlin-compiler"
        # Initialize Temporary Compiler Checksum
        KOTLINCHECKSUM="$RUNNER_TEMP/kotlinc.zip.sha256"
        # Remove Temporary Download and Installation Files When Step Exits
        trap 'rm -rf "$KOTLINZIP" "$KOTLINPART" "$KOTLINSTAGE" "$KOTLINCACHEDIR" "$KOTLINCHECKSUM"' EXIT
        # Verify Required Build Utilities
        # Verify All Required Kotlin Setup Utilities Exist
        for TOOL in curl jq gh unzip sha256sum awk grep; do
          command -v "$TOOL" >/dev/null 2>&1 || {
            echo "└─ ⛔ [Warn] Required Build Utility Missing : $TOOL"
            exit 1
          }
          
        done

        # Verify GitHub Authentication is Available
        [[ -n "$GH_TOKEN" ]] || {
          echo "└─ ⛔ [Warn] GitHub Authentication Token Missing"
          exit 1
        }
        # Resolve Latest Stable Kotlin Compiler Version
        echo "🔎 Resolving Latest Stable Kotlin Compiler..."
        # Retrieve Latest Published Kotlin Release Metadata
        RELEASE="$(
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 300 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/JetBrains/kotlin/releases/latest"
        )"
        # Extract and Validate Latest Kotlin Version
        KOTLINVER="$(
          jq -er '
            .tag_name
            | select(type == "string" and length > 0)
            | sub("^v"; "")
            | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' <<< "$RELEASE"
        )"
        # Define Version-Specific GitHub Release Asset Names
        KOTLINASSET="${KOTLINCACHE}-${KOTLINVER}.zip"
        KOTLINHASHASSET="${KOTLINASSET}.sha256"
        # Initialize Optional JetBrains Download Metadata
        KOTLINURL=""
        KOTLINHASH=""
        # Locate Official JetBrains Compiler Asset
        echo "└─ 🔎 [Info] Resolving Official JetBrains Compiler Asset..."
        # Locate Exact Kotlin Compiler Release Asset
        KOTLINASSETINFO="$(
          jq -c --arg version "$KOTLINVER" '
            [
              .assets[]?
              | select(.name == ("kotlin-compiler-" + $version + ".zip"))
              | select(.browser_download_url | type == "string")
              | select(.browser_download_url | startswith("https://"))
            ]
            | first // empty
          ' <<< "$RELEASE"
        )"
        # Extract Official JetBrains Download Metadata When Available
        if [[ -n "$KOTLINASSETINFO" ]]; then
          # Extract Official Compiler Download URL
          KOTLINURL="$(
            jq -er '.browser_download_url' <<< "$KOTLINASSETINFO"
          )"
          # Extract Published SHA-256 Digest When Available
          KOTLINHASH="$(
            jq -r '
              if (.digest | type == "string") and
                 (.digest | startswith("sha256:")) then
                .digest | sub("^sha256:"; "")
              else
                empty
              end
            ' <<< "$KOTLINASSETINFO"
          )"
        else
          echo "└─ ⚠️ [Warn] Official JetBrains Compiler Asset Not Found"
        fi

        # Display Resolved Kotlin Compiler Information
        echo "└─ 📦 [Info] Kotlin Compiler Version : $KOTLINVER"
        echo "└─ 📦 [Info] GitHub Release Tag      : $KOTLINRELEASE"
        echo "└─ 📦 [Info] Cache Asset             : $KOTLINASSET"
        # Reuse Existing Installed Kotlin Compiler
        # Reuse Existing Compiler Only When its Version Matches
        if [[ -x "$KOTLINHOME/bin/kotlinc" ]] &&
          "$KOTLINHOME/bin/kotlinc" -version 2>&1 |
            grep -Fq "kotlinc-jvm ${KOTLINVER}"; then
          echo "└─ 📌 [Info] Kotlin ${KOTLINVER} is Already Installed"
          # Skip Download, Extraction and Release Upload
          echo "└─ 📌 [Info] Existing Kotlin Installation Reused"
        else
          # Prepare Clean Kotlin Installation Environment
          echo "└─ ⚙️ [Info] Preparing Kotlin Installation..."
          # Remove Previous Installation and Temporary Files
          rm -rf "$KOTLINHOME" "$KOTLINSTAGE" "$KOTLINCACHEDIR"
          rm -f "$KOTLINZIP" "$KOTLINPART" "$KOTLINCHECKSUM"
          # Create Clean Temporary Directories
          mkdir -p "$KOTLINSTAGE"
          mkdir -p "$KOTLINCACHEDIR"
          # Resolve Existing Kotlin GitHub Release
          echo "└─ 🔎 [Info] Checking Kotlin GitHub Release..."
          echo "└─ 📌 [Info] Repository  : $GITHUB_REPOSITORY"
          echo "└─ 📌 [Info] Release Tag : $KOTLINRELEASE"
          echo "└─ 📌 [Info] Asset       : $KOTLINASSET"
          # Initialize Release and Download Status
          RELEASEEXISTS=false
          CACHEVALID=false
          DOWNLOADSUCCESS=false
          DOWNLOADSOURCE=""
          # Initialize Existing Release Asset Metadata
          RELEASEASSETS=""
          # Retrieve Existing Kotlin Release Asset Names
          if RELEASEASSETS="$(
            gh release view "$KOTLINRELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' \
              2>/dev/null
          )"; then
            RELEASEEXISTS=true
            echo "└─ 📌 [Info] Kotlin GitHub Release Found"
          else
            echo "└─ ⚠️ [Info] Kotlin GitHub Release Does Not Exist Yet"
          fi

          # Restore Existing Kotlin Compiler Release Cache
          if [[ "$RELEASEEXISTS" == "true" ]]; then
            # Verify Both Required Version-Specific Assets Exist
            if grep -Fxq "$KOTLINASSET" <<< "$RELEASEASSETS" &&
              grep -Fxq "$KOTLINHASHASSET" <<< "$RELEASEASSETS"; then
              echo "└─ 📥 [Info] Restoring Kotlin Compiler From GitHub Release..."
              # Download Exact Compiler Archive From Existing Release
              if gh release download "$KOTLINRELEASE" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$KOTLINASSET" \
                --dir "$KOTLINCACHEDIR"; then
                # Download Exact SHA-256 Checksum From Existing Release
                if gh release download "$KOTLINRELEASE" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$KOTLINHASHASSET" \
                  --dir "$KOTLINCACHEDIR"; then
                  # Define Restored Compiler and Checksum Paths
                  CACHEZIP="${KOTLINCACHEDIR}/${KOTLINASSET}"
                  CACHECHECKSUM="${KOTLINCACHEDIR}/${KOTLINHASHASSET}"
                  # Verify Restored Compiler Archive Exists
                  if [[ -s "$CACHEZIP" && -s "$CACHECHECKSUM" ]]; then
                    # Extract and Validate Cached SHA-256 Digest
                    CACHEHASH="$(
                      awk 'NR == 1 { print $1 }' "$CACHECHECKSUM"
                    )"
                    if [[ "$CACHEHASH" =~ ^[a-fA-F0-9]{64}$ ]]; then
                      # Verify Restored Compiler Archive SHA-256
                      echo "└─ 🔐 [Info] Verifying Cached Kotlin SHA-256..."
                      if echo "${CACHEHASH}  ${CACHEZIP}" |
                        sha256sum --check --status; then
                        # Verify Restored Compiler Archive Integrity
                        echo "└─ 📦 [Info] Verifying Cached Compiler ZIP..."
                        if unzip -tq "$CACHEZIP" >/dev/null 2>&1; then
                          # Extract Cached Compiler Into Temporary Directory
                          echo "└─ 📂 [Info] Validating Cached Kotlin Installation..."
                          if unzip -q "$CACHEZIP" -d "$KOTLINSTAGE"; then
                            # Verify Cached Kotlin Compiler Executable Exists
                            if [[ -x "$KOTLINSTAGE/kotlinc/bin/kotlinc" ]]; then
                              # Verify Cached Compiler Version Matches Latest Release
                              if "$KOTLINSTAGE/kotlinc/bin/kotlinc" -version 2>&1 |
                                grep -Fq "kotlinc-jvm ${KOTLINVER}"; then
                                CACHEVALID=true
                                DOWNLOADSUCCESS=true
                                DOWNLOADSOURCE="GitHub Release"
                                echo "└─ ✔️ [Info] Kotlin Compiler Cache Verified"
                                echo "└─ 📌 [Info] Cached Kotlin Version : $KOTLINVER"
                              else
                                echo "└─ ⚠️ [Warn] Cached Kotlin Version Does Not Match"
                              fi

                            else
                              echo "└─ ⚠️ [Warn] Cached Kotlin Executable Missing"
                            fi

                          else
                            echo "└─ ⚠️ [Warn] Cached Kotlin Extraction Failed"
                          fi

                        else
                          echo "└─ ⚠️ [Warn] Cached Kotlin ZIP is Corrupted"
                        fi

                      else
                        echo "└─ ⚠️ [Warn] Cached Kotlin SHA-256 Verification Failed"
                      fi

                    else
                      echo "└─ ⚠️ [Warn] Cached Kotlin SHA-256 Digest is Invalid"
                    fi

                  else
                    echo "└─ ⚠️ [Warn] Cached Kotlin Archive or Checksum is Empty"
                  fi

                else
                  echo "└─ ⚠️ [Warn] Cached Kotlin Checksum Download Failed"
                fi

              else
                echo "└─ ⚠️ [Warn] Cached Kotlin Compiler Download Failed"
              fi

            else
              echo "└─ ⚠️ [Info] Matching Kotlin Cache Assets Are Incomplete"
            fi

          else
            echo "└─ ⚠️ [Info] Kotlin Release Cache Is Not Available"
          fi

          # Fall Back to Official JetBrains Compiler Download
          if [[ "$DOWNLOADSUCCESS" != "true" ]]; then
            echo "└─ 🔄 [Info] Using Official JetBrains Compiler Fallback..."
            # Remove Invalid or Incomplete Cached Installation
            rm -rf "$KOTLINSTAGE"
            mkdir -p "$KOTLINSTAGE"
            rm -f "$KOTLINPART" "$KOTLINZIP" "$KOTLINCHECKSUM"
            # Ensure Official JetBrains Compiler URL Is Available
            if [[ -z "$KOTLINURL" ]]; then
              echo "└─ ⛔ [Warn] Official JetBrains Compiler URL Not Found"
              echo "└─ ⛔ [Warn] Cannot Continue Without a Valid Compiler Asset"
              exit 1
            fi

            # Display Official JetBrains Download Information
            echo "└─ 🌐 [Info] Download URL : $KOTLINURL"
            # Initialize JetBrains Download Retry Loop
            for ATTEMPT in {1..6}; do
              echo "   🔄 [Info] Download Attempt ${ATTEMPT}/6..."
              # Download Kotlin Compiler From Official JetBrains Release
              if curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --connect-timeout 30 \
                --max-time 900 \
                --output "$KOTLINPART" \
                "$KOTLINURL"; then
                # Accept Only Non-Empty Downloaded Archives
                if [[ -s "$KOTLINPART" ]]; then
                  DOWNLOADSUCCESS=true
                  DOWNLOADSOURCE="JetBrains"
                  break
                fi
              fi

              # Remove Any Incomplete Download Before Retrying
              rm -f "$KOTLINPART"
              # Retry With Exponential Backoff
              if [[ "$ATTEMPT" -lt 6 ]]; then
                WAIT=$((10 * (2 ** (ATTEMPT - 1)))
                echo "   ⚠️ [Info] Download Failed. Retrying in ${WAIT}s..."
                sleep "$WAIT"
              fi

            done

            # Abort When All Official Download Attempts Have Failed
            if [[ "$DOWNLOADSUCCESS" != "true" ]]; then
              echo "└─ ⛔ [Warn] Kotlin Compiler Download Failed"
              exit 1
            fi

            # Verify Official Kotlin Compiler Download
            # Verify Downloaded Archive Exists
            [[ -s "$KOTLINPART" ]] || {
              echo "└─ ⛔ [Warn] Kotlin Compiler Archive Is Missing"
              exit 1
            }
            # Verify Official SHA-256 Digest When Published
            if [[ -n "$KOTLINHASH" ]]; then
              echo "└─ 🔐 [Info] Verifying Official Kotlin SHA-256..."
              echo "${KOTLINHASH}  ${KOTLINPART}" |
                sha256sum --check --status || {
                  echo "└─ ⛔ [Warn] Official Kotlin SHA-256 Verification Failed"
                  exit 1
                }
              echo "└─ ✔️ [Info] Official SHA-256 Verification Passed"
            else
              echo "└─ ⚠️ [Info] No Official SHA-256 Digest Published"
            fi

            # Promote Verified Download to Final Compiler Archive
            mv "$KOTLINPART" "$KOTLINZIP"
            # Verify Official Kotlin Compiler Archive
            echo "└─ 📦 [Info] Validating Official Kotlin Compiler ZIP..."
            # Verify Downloaded Archive Is a Valid ZIP File
            unzip -tq "$KOTLINZIP" >/dev/null || {
              echo "└─ ⛔ [Warn] Kotlin Compiler Archive is Corrupted"
              exit 1
            }
            # Extract Official Compiler Into Temporary Directory
            echo "└─ 📂 [Info] Extracting Official Kotlin Compiler..."
            unzip -q "$KOTLINZIP" -d "$KOTLINSTAGE"
            # Verify Kotlin Compiler Executable Exists
            [[ -x "$KOTLINSTAGE/kotlinc/bin/kotlinc" ]] || {
              echo "└─ ⛔ [Warn] Kotlin Compiler Installation Failed"
              exit 1
            }
            # Confirm Installed Compiler Matches Requested Version
            "$KOTLINSTAGE/kotlinc/bin/kotlinc" -version 2>&1 |
              grep -Fq "kotlinc-jvm ${KOTLINVER}" || {
                echo "└─ ⛔ [Warn] Installed Kotlin Version Does Not Match"
                exit 1
              }
            echo "└─ ✔️ [Info] Official Kotlin Compiler Verified"
            # Prepare Kotlin GitHub Release Cache
            echo "└─ 📦 [Info] Preparing Kotlin GitHub Release Cache..."
            # Generate SHA-256 Checksum For Future Cache Verification
            sha256sum "$KOTLINZIP" |
              awk '{ print $1 }' > "$KOTLINCHECKSUM"
            # Verify Generated Checksum Exists
            [[ -s "$KOTLINCHECKSUM" ]] || {
              echo "└─ ⛔ [Warn] Kotlin Checksum Generation Failed"
              exit 1
            }
            # Create Kotlin Release When it Does Not Exist
            if [[ "$RELEASEEXISTS" != "true" ]]; then
              echo "└─ 📦 [Info] Creating Kotlin GitHub Release..."
              gh release create "$KOTLINRELEASE" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Kotlin Compiler Cache" \
                --notes "Automatically Maintained Kotlin Compiler Cache" \
                --target "$GITHUB_SHA"
              RELEASEEXISTS=true
            fi

            # Refresh Existing Kotlin Release Asset Metadata
            echo "└─ 🔎 [Info] Checking Existing Kotlin Release Assets..."
            RELEASEASSETS="$(
              gh release view "$KOTLINRELEASE" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            # Remove Invalid or Incomplete Kotlin Cache Assets
            # Existing Cache Assets are Replaced Only After Failed Validation
            # A Valid Cache Never Reaches this Upload Section
            for ASSET in "$KOTLINASSET" "$KOTLINHASHASSET"; do
              if grep -Fxq "$ASSET" <<< "$RELEASEASSETS"; then
                echo "└─ 🧹 [Info] Removing Invalid or Incomplete Cache Asset : $ASSET"
                gh release delete-asset "$KOTLINRELEASE" "$ASSET" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              fi

            done

            # Upload Verified Kotlin Compiler and Checksum
            echo "└─ 📤 [Info] Uploading Verified Kotlin Compiler Cache..."
            # Upload Compiler Archive and Matching SHA-256 Checksum
            # No --clobber is Needed Because Invalid Assets were Removed
            gh release upload "$KOTLINRELEASE" \
              "$KOTLINZIP#${KOTLINASSET}" \
              "$KOTLINCHECKSUM#${KOTLINHASHASSET}" \
              --repo "$GITHUB_REPOSITORY"
            # Verify Uploaded Kotlin Release Assets
            echo "└─ 🔎 [Info] Verifying Uploaded Kotlin Release Assets..."
            # Retrieve Updated Release Asset Names
            RELEASEASSETS="$(
              gh release view "$KOTLINRELEASE" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            # Verify Compiler Archive Exists in GitHub Release
            grep -Fxq "$KOTLINASSET" <<< "$RELEASEASSETS" || {
              echo "└─ ⛔ [Warn] Uploaded Kotlin Compiler Asset Not Found"
              exit 1
            }
            # Verify Matching SHA-256 Asset Exists in GitHub Release
            grep -Fxq "$KOTLINHASHASSET" <<< "$RELEASEASSETS" || {
              echo "└─ ⛔ [Warn] Uploaded Kotlin Checksum Asset Not Found"
              exit 1
            }
            # Report Successful Kotlin Compiler Cache Upload
            echo "└─ ✔️ [Info] Kotlin Compiler Cache Uploaded Successfully"
            echo "└─ 📌 [Info] Release Tag : $KOTLINRELEASE"
            echo "└─ 📌 [Info] Compiler    : $KOTLINASSET"
            echo "└─ 📌 [Info] Checksum    : $KOTLINHASHASSET"
          else
            # Report Successful Kotlin Release Cache Restoration
            echo "└─ ✔️ [Info] Existing Kotlin Compiler Cache Reused"
            echo "└─ 📌 [Info] Release Tag : $KOTLINRELEASE"
            echo "└─ 📌 [Info] Compiler    : $KOTLINASSET"
            echo "└─ 📌 [Info] Checksum    : $KOTLINHASHASSET"
          fi

          # Install Verified Kotlin Compiler
          # Verify Compiler Extraction Directory Contains Valid Installation
          [[ -x "$KOTLINSTAGE/kotlinc/bin/kotlinc" ]] || {
            echo "└─ ⛔ [Warn] Verified Kotlin Compiler Installation Missing"
            exit 1
          }
          # Verify Final Compiler Version Before Installation
          "$KOTLINSTAGE/kotlinc/bin/kotlinc" -version 2>&1 |
            grep -Fq "kotlinc-jvm ${KOTLINVER}" || {
              echo "└─ ⛔ [Warn] Final Kotlin Compiler Version Verification Failed"
              exit 1
            }
          # Move Verified Compiler Into its Final Installation Directory
          mv "$KOTLINSTAGE/kotlinc" "$KOTLINHOME"
          # Report Successful Kotlin Compiler Installation
          echo "└─ ✔️ [Info] Kotlin Compiler Installation Verified"
          echo "└─ 📌 [Info] Installation Source : $DOWNLOADSOURCE"
        fi

        # Configure Kotlin Environment For Subsequent Steps
        # Add Kotlin Compiler to PATH For Subsequent Workflow Steps
        echo "$KOTLINHOME/bin" >> "$GITHUB_PATH"
        # Export Kotlin Installation Directory to Workflow Environment
        echo "KOTLINHOME=$KOTLINHOME" >> "$GITHUB_ENV"
        # Display Final Kotlin Compiler Version
        echo "└─ 🎉 [Result] Kotlin Compiler Setup Completed"
        "$KOTLINHOME/bin/kotlinc" -version

    # Clean Previous Zig Caches
    # Remove Previous Zig Caches to Reclaim Repository Cache Storage
    - name: 🧹 Clean Previous Zig Caches
      uses: actions/github-script@v9
      continue-on-error: true
      # Define Zig Version Used by Current Workflow
      env:
        ZIGVERSION: 0.16.0
      with:
        script: |
          // Identify Current Workflow Run and Repository
          const currentRunId = String(context.runId);
          const { owner, repo } = context.repo;
          // Match Existing Setup-Zig Version 2 Caches For This Configuration
          const prefix =
            `setup-zig-cache-v2-kernel_build-zig-x86_64-linux-${process.env.ZIGVERSION}--`;
          // Retrieve Available GitHub Actions Caches
          const caches = await github.paginate(
            github.rest.actions.getActionsCacheList,
            {
              owner,
              repo,
              per_page: 100
            }
          );
          // Select Matching Caches Without Deleting Current Run's Cache
          const previousCaches = caches.filter(cache =>
            cache.key.startsWith(prefix) &&
            !cache.key.includes(`--${currentRunId}-`)
          );
          // Report When No Previous Zig Caches Need Cleanup
          if (previousCaches.length === 0) {
            console.log("ℹ️ No Previous Zig Caches Found");
          }
          // Delete Previous Zig Caches and Handle Missing Entries
          for (const cache of previousCaches) {
            console.log(`🧹 Deleting Previous Zig Cache : ${cache.key}`);
            try {
              await github.rest.actions.deleteActionsCacheById({
                owner,
                repo,
                cache_id: cache.id
              });
              // Confirm Successful Cache Removal
              console.log(`└─ 📌 Deleted : ${cache.key}`);
            } catch (error) {
              // Ignore Caches Already Deleted by Another Process
              if (error.status === 404) {
                console.log(`└─ ℹ️ Cache Already Missing : ${cache.key}`);
                continue;
              }
              // Propagate Other API Errors
              throw error;
            }
          }
          // Report Final Zig Cache Cleanup Status
          console.log("🎉 Previous Zig Cache Cleanup Completed");
