name: ⚙️ Setup Build Toolchains
description: Setup Zig and Kotlin Compilers, Clean Previous Zig Caches
runs:
  using: composite
  steps:
    # Install Zig 0.16.0 and Enable Its Built-In GitHub Actions Cache
    - name: ⚙️ Setup Zig Toolchain
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        use-cache: true
        cache-size-limit: 2048

    # Resolve and Install Latest Stable Kotlin Compiler
    - name: 🧰 Setup Kotlin Compiler
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Define the Kotlin Installation Directory and Download Archive
        KOTLINHOME="$HOME/kotlinc"
        KOTLINZIP="$RUNNER_TEMP/kotlinc.zip"
        # Query GitHub for the Latest Published Kotlin Release
        echo "🔎 Resolving Latest Stable Kotlin Compiler..."
        KOTLINVER="$(
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/JetBrains/kotlin/releases/latest" |
          jq -er '
            .tag_name
            | select(type == "string" and length > 0)
            | sub("^v"; "")
            | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
          '
        )"
        # Construct Kotlin Compiler Release Download URL
        KOTLINURL="https://github.com/JetBrains/kotlin/releases/download/v${KOTLINVER}/kotlin-compiler-${KOTLINVER}.zip"
        echo "└─ 📦 Kotlin Compiler Version: ${KOTLINVER}"
        # Reuse the Existing Compiler Only When Its Version Matches
        if [[ -x "$KOTLINHOME/bin/kotlinc" ]] &&
          "$KOTLINHOME/bin/kotlinc" -version 2>&1 |
            grep -Fq "kotlinc-jvm ${KOTLINVER}"; then
          echo "└─ ✔️ Kotlin ${KOTLINVER} Is Already Installed"
        else
          # Remove Previous Installation and Any Stale Archive
          echo "└─ ⚙️ Installing Kotlin ${KOTLINVER}..."
          rm -rf "$KOTLINHOME"
          rm -f "$KOTLINZIP"
          # Download Kotlin Compiler Distribution
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            "$KOTLINURL" \
            --output "$KOTLINZIP"
          # Reject an Empty or Missing Compiler Archive
          [[ -s "$KOTLINZIP" ]] || {
            echo "└─ ⛔ Kotlin Compiler Archive is Missing or Empty"
            exit 1
          }
          # Verify Download is a Valid ZIP Archive
          unzip -tq "$KOTLINZIP" >/dev/null
          # Extract Distribution Into HOME Directory
          unzip -q "$KOTLINZIP" -d "$HOME"
          # Remove the Temporary Archive After Extraction
          rm -f "$KOTLINZIP"
          # Verify Kotlin Compiler Executable Exists
          [[ -x "$KOTLINHOME/bin/kotlinc" ]] || {
            echo "└─ ⛔ Kotlin Compiler Installation Failed"
            exit 1
          }
          # Confirm Installed Compiler Matches Requested Version
          "$KOTLINHOME/bin/kotlinc" -version 2>&1 |
            grep -Fq "kotlinc-jvm ${KOTLINVER}" || {
              echo "└─ ⛔ Installed Kotlin Version Does Not Match"
              exit 1
            }
        fi

        # Add Kotlin to PATH For All Subsequent Workflow Steps
        echo "$KOTLINHOME/bin" >> "$GITHUB_PATH"
        # Export Kotlin Installation Directory to Workflow Environment
        echo "KOTLINHOME=$KOTLINHOME" >> "$GITHUB_ENV"
        # Display Final Compiler Version For Build Logs
        echo "└─ 🎉 Kotlin Compiler Setup Completed"
        "$KOTLINHOME/bin/kotlinc" -version

    # Remove Old Zig Caches to Reclaim Repository Cache Storage
    - name: 🧹 Clean Previous Zig Caches
      uses: actions/github-script@v9
      continue-on-error: true
      env:
        ZIG_VERSION: 0.16.0
      with:
        script: |
          // Identify Current Workflow Run and Repository
          const currentRunId = String(context.runId);
          const { owner, repo } = context.repo;
          // Match Caches Created by Setup-Zig V2 For Build Configuration
          const prefix =
            `setup-zig-cache-v2-kernel_build-zig-x86_64-linux-${process.env.ZIG_VERSION}--`;
          // Retrieve Repository's Available Actions Caches
          const caches = await github.paginate(
            github.rest.actions.getActionsCacheList,
            {
              owner,
              repo,
              per_page: 100
            }
          );
          // Select Matching Caches Without Deleting Current Run's Cache
          const previousCaches = caches.filter(cache =>
            cache.key.startsWith(prefix) &&
            !cache.key.includes(`--${currentRunId}-`)
          );
          // Report When No Previous Zig Caches Need to Be Removed
          if (previousCaches.length === 0) {
            console.log("ℹ️ No Previous Zig Caches Found");
          }
          // Delete Each Matching Cache and Handle Already-Removed Entries
          for (const cache of previousCaches) {
            console.log(`🧹 Deleting Previous Zig Cache: ${cache.key}`);
            try {
              await github.rest.actions.deleteActionsCacheById({
                owner,
                repo,
                cache_id: cache.id
              });
              // Confirm Successful Cache Removal
              console.log(`└─ 📌 Deleted: ${cache.key}`);
            } catch (error) {
              // Ignore Caches That were Already Deleted by Another Process
              if (error.status === 404) {
                console.log(`└─ ℹ️ Cache Already Missing: ${cache.key}`);
                continue;
              }
              // Propagate Other API Errors to Action's Error Handler
              throw error;
            }
          }
          // Report the Final Cache Cleanup Status
          console.log("🎉 Previous Zig Cache Cleanup Completed");
