# GitHub Actions Composite Action: Kernel Build Details
name: 📋 Kernel Build Details
description: Generate Detailed Post-Kernel-Build Summary of Kernel Version, Build Configuration, Integrated Features and Workflow Information
# Define Inputs Passed From Main Workflow
inputs:
  # Kernel Manifest Configuration
  FILE:
    description: Resolved Device Manifest Configuration File Name
    required: false
    default: ""
  # Kernel Build Timestamp
  BUILDTIME:
    description: Configured Kernel Build Timestamp
    required: false
    default: ""
  # Custom Kernel Version Suffix
  SUFFIX:
    description: Custom Kernel Version Suffix
    required: false
    default: ""
  # Selected Root Engine
  ROOTENGINE:
    description: Root Solution or KernelSU Manager Variant
    required: false
    default: ""
  # Selected Root Engine Branch
  ROOTBRANCHSOURCE:
    description: Selected Root Engine Branch
    required: false
    default: ""
  # Selected KernelPatch Variant
  KERNELPATCH:
    description: Selected KernelPatch Variant
    required: false
    default: ""
  # Selected SuSFS Repository Revision
  SUSFSREPOSITORY:
    description: Selected SuSFS Repository Revision
    required: false
    default: ""
  # Selected SuSFS Variant
  SUSFSVARIANT:
    description: Selected SuSFS Variant
    required: false
    default: ""
  # SuSFS Development Branch Selection
  SUSFSBRANCHDEV:
    description: Whether SuSFS Development Branch is Selected
    required: false
    default: ""
  # Selected NoMount Variant or Branch
  NOMOUNT:
    description: Selected NoMount Variant or Branch
    required: false
    default: ""
  # Unicode Bypass Configuration
  UNICODE:
    description: Whether Unicode Bypass Patch Is Enabled
    required: false
    default: ""
  # LZ4 NEON Optimization Configuration
  LZ4NEON:
    description: Selected LZ4 NEON Optimization or Version
    required: false
    default: ""
  # Hmbird / Windspeed Scheduler Configuration
  WINDSPEED:
    description: Whether Hmbird or Windspeed Scheduler Patch Is Enabled
    required: false
    default: ""
  # LSM Baseband Guard Configuration
  LSMBBG:
    description: Whether LSM Baseband Guard Feature Is Enabled
    required: false
    default: ""
  # DroidSpaces / NTSync Configuration
  LINUXCNTSYNC:
    description: DroidSpaces and NTSync Configuration or Selection
    required: false
    default: ""
  # ReKernel Integration Configuration
  REKERNEL:
    description: ReKernel Integration Configuration or Status
    required: false
    default: ""
  # Selected TCP Congestion Control Algorithm
  TCPALGORITHM:
    description: Selected TCP Congestion Control Algorithm
    required: false
    default: ""
  # Netfilter Configuration
  NETFILTER:
    description: Whether Netfilter IP Set and IPv6 NAT Fix Features Are Enabled
    required: false
    default: ""
  # Requested LLVM MLGO Configuration
  MLGO:
    description: LLVM Machine Learning Guided Optimization Configuration or Status
    required: false
    default: ""
  # Actual LLVM MLGO Compiler Support Status
  MLGOENABLED:
    description: Actual LLVM MLGO Compiler Support Status From Kernel Build Output
    required: false
    default: "false"
  # Compiler Cache Configuration
  BUILDCCACHE:
    description: Whether Compiler Cache Is Enabled
    required: false
    default: ""
  # Disk Space Cleanup Configuration
  CLEANSPACE:
    description: Disk Space Cleanup Configuration or Status
    required: false
    default: ""
# Configure Composite Action Execution
runs:
  using: composite
  steps:
    # Generate Detailed Post-Kernel-Build Summary
    - name: 📋 Kernel Build Details
      shell: bash
      # Export Composite Action Inputs and Import Workflow Environment Variables
      env:
        # Kernel Build Information
        FILE: ${{ inputs.FILE }}
        BUILDTIME: ${{ inputs.BUILDTIME }}
        SUFFIX: ${{ inputs.SUFFIX }}
        # Root Engine Configuration
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        ROOTBRANCHSOURCE: ${{ inputs.ROOTBRANCHSOURCE }}
        KERNELPATCH: ${{ inputs.KERNELPATCH }}
        # SUSFS Configuration
        SUSFSREPOSITORY: ${{ inputs.SUSFSREPOSITORY }}
        SUSFSVARIANT: ${{ inputs.SUSFSVARIANT }}
        SUSFSBRANCHDEV: ${{ inputs.SUSFSBRANCHDEV }}
        # Kernel Integration Configuration
        NOMOUNT: ${{ inputs.NOMOUNT }}
        REKERNEL: ${{ inputs.REKERNEL }}
        # System Feature Configuration
        UNICODE: ${{ inputs.UNICODE }}
        LSMBBG: ${{ inputs.LSMBBG }}
        LINUXCNTSYNC: ${{ inputs.LINUXCNTSYNC }}
        NETFILTER: ${{ inputs.NETFILTER }}
        TCPALGORITHM: ${{ inputs.TCPALGORITHM }}
        # Memory and Performance Configuration
        LZ4NEON: ${{ inputs.LZ4NEON }}
        WINDSPEED: ${{ inputs.WINDSPEED }}
        # LLVM MLGO Configuration
        MLGO: ${{ inputs.MLGO }}
        MLGOENABLED: ${{ inputs.MLGOENABLED }}
        # Compiler Cache and Cleanup Configuration
        BUILDCCACHE: ${{ inputs.BUILDCCACHE }}
        CLEANSPACE: ${{ inputs.CLEANSPACE }}
        # Import Kernel Version Information From Workflow Environment
        ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
        FULLVERSION: ${{ env.FULLVERSION }}
      run: |
        # Helper Function : Convert Boolean Inputs Into Readable Status Labels
        bool() {
          if [[ "${1:-}" == "true" ]]; then
            echo "Enabled"
          else
            echo "Disabled"
          fi
        }
        # Generate Post-Build Summary in GitHub Actions
        {
          # Summary Title
          echo "### 📊 Post Kernel Build Details"
          # Core Information
          echo "#### 🧩 Core Information"
          echo "| Category | Reported Value |"
          echo "|---|---|"
          echo "| └─ 📦 Manifest | \`${FILE:-Unknown}\` |"
          echo "| └─ 🔧 Kernel Version | \`${ANDROIDVERSION:-Unknown}-${FULLVERSION:-Unknown}\` |"
          echo "| └─ 🕒 Kernel Build Time | \`${BUILDTIME:-Auto}\` |"
          echo "| └─ 🏷️ Kernel Suffix | \`${SUFFIX:-Auto}\` |"
          echo "| └─ 🔐 Root / KSU Manager Variant | \`${ROOTENGINE:-None}\` |"
          echo "| └─ 🌿 Root Engine Branch | \`${ROOTBRANCHSOURCE:-Default}\` |"
          # Root and KernelPatch Configuration
          echo "#### 🛡️ Root and KernelPatch Configuration"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🩹 KernelPatch | \`${KERNELPATCH:-Disabled}\` |"
          # SuSFS Configuration
          echo "#### 🧬 SuSFS Configuration"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 📦 SuSFS Repository | \`${SUSFSREPOSITORY:-Default}\` |"
          echo "| └─ 🧬 SuSFS Variant | \`${SUSFSVARIANT:-Disabled}\` |"
          echo "| └─ 🧪 SuSFS Development Branch | $(bool "$SUSFSBRANCHDEV") |"
          # Kernel Integrations
          echo "#### 🔌 Kernel Integrations"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔤 NoMount | \`${NOMOUNT:-Disabled}\` |"
          echo "| └─ 🔁 ReKernel | \`${REKERNEL:-Disabled}\` |"
          # System Features
          echo "#### 🧠 System Features"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔰 LSM Baseband Guard | $(bool "$LSMBBG") |"
          echo "| └─ 🧩 DroidSpaces / NTSync Primitives | \`${LINUXCNTSYNC:-Disabled}\` |"
          echo "| └─ 📡 Netfilter IP Set / IPv6 NAT Fix | $(bool "$NETFILTER") |"
          echo "| └─ 🛜 TCP Congestion Control | \`${TCPALGORITHM:-Default}\` |"
          # Memory and Performance Optimizations
          echo "#### 🧮 Memory and Performance"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ ⚙️ LZ4 ARM64 Neon Optimization | \`${LZ4NEON:-Disabled}\` |"
          echo "| └─ 🌪️ Hmbird / Windspeed Scheduler | $(bool "$WINDSPEED") |"
          # Compiler Configuration
          echo "#### 🏗️ Compiler Configuration"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🛡️ LLVM MLGO | $(bool "$MLGOENABLED") |"
          echo "| └─ 💾 Compiler Cache | \`${BUILDCCACHE:-Disabled}\` |"
          # Miscellaneous Features
          echo "#### 🧾 Miscellaneous"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔤 Unicode Bypass | $(bool "$UNICODE") |"
          echo "| └─ 🧹 Disk Space Cleanup | \`${CLEANSPACE:-Disabled}\` |"
          # Workflow Information
          echo "#### 🔄 Workflow Information"
          echo "| Category | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🆔 Workflow Run ID | \`${GITHUB_RUN_ID}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
        # Report Successful Summary Generation
        echo "└─ 🎉 [Success] Kernel Build Details Summary Generated"
