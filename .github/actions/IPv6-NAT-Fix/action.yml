# IPv6 NAT Fix Composite Action
name: 🔧 IPv6 NAT Fix
description: Apply IPv6 NAT Compatibility Patch For Supported Devices
inputs:
  # Enable or Disable NetFilter IPv6 NAT Fix Stage
  NETFILTER:
    description: Enable NetFilter IPv6 NAT Fix Stage
    required: true
    default: "false"
runs:
  using: composite
  steps:
    - name: 🔧 IPv6 NAT Fix Stage
      # 🚦 Run Only When NetFilter Is Enabled
      if: ${{ inputs.NETFILTER == 'true' }}
      shell: bash
      # Import Environment Variables
      env:
        CPU: ${{ env.CPU }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
      run: |
        set -euo pipefail
        # 📌 Define IPv6 NAT Patch Path
        IPV6PATCHFILE="${PATCHDIR}/IPv6.patch"
        echo "└─ ✔ NetFilter Enabled — 🔎 Checking IPv6 NAT Compatibility..."
        # 📂 Move to Kernel Common Directory
        cd "$COMMONKERNELFOLDER"
        # 🔍 Validate That the IPv6 NAT Patch Exists
        if [[ ! -f "$IPV6PATCHFILE" ]]; then
          echo "└─ ⚠️ Patch File Not Found:"
          echo "$IPV6PATCHFILE"
          exit 1
        fi

        # Check Whether Device CPU is Supported
        if [[ "${CPU:-}" != sm* ]]; then
          echo "└─ ⚠️ Device CPU Not Supported For IPv6 NAT Fix — Skipping"
          exit 0
        fi

        echo "└─ 📊 Device CPU Supports IPv6 NAT Fix"
        # Check Whether Patch Can be Applied
        if patch --dry-run -p1 < "$IPV6PATCHFILE" >/dev/null 2>&1; then
          # Apply IPv6 NAT Compatibility Patch
          echo "└─ 🚀 Applying IPv6 NAT Compatibility Patch..."
          patch -p1 -F3 < "$IPV6PATCHFILE"
          echo "└─ ✔ IPv6 NAT Fix Applied Successfully"
        else
          # ⚙️ Skip if Patch is Already Applied or Cannot be Applied
          echo "└─ ⚙️ IPv6 NAT Patch Already Applied or Not Needed"
        fi

        # Complete IPv6 NAT Fix Stage
        echo "└─ 🎉 IPv6 NAT Fix Stage Completed"
        
