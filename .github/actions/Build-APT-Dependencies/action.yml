name: 🧰 Build Dependencies
description: Clean APT Metadata and Install Required Kernel Build Dependencies
runs:
  using: composite
  steps:
    # Install Required Packages and Prepare Kernel Build Environment
    - name: 🧰 Install Build Dependencies
      shell: bash
      # Import Environment Variables
      env:
        SCRIPTSDIR: ${{ env.SCRIPTSDIR }}
      run: |
        set -Eeuo pipefail
        # Remove Problematic Third-Party APT Repositories
        echo "└─ 🧹 Removing Problematic APT Repositories..."
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
        sudo rm -f /etc/apt/sources.list.d/*chrome* || true
        # Clean Stale APT Metadata
        echo "└─ 🧹 Cleaning APT Lists..."
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get clean
        # Refresh Package Indexes with Retry
        echo "└─ 🔄 Updating APT Indexes..."
        sudo apt-get update \
          -o Acquire::Retries=5 \
          -o Acquire::http::Pipeline-Depth=0
        # Define Required APT Packages
        export APTPACKAGES="bc build-essential bison clang curl dos2unix elfutils flex gawk git kmod lld llvm libdw-dev libelf-dev lz4 libncurses-dev libssl-dev libxml2-utils python3 rsync unzip zip zlib1g-dev"
        # Define APT Packages Script Path
        APTSCRIPT="${SCRIPTSDIR}/APT-Packages.sh"
        # Verify APT Packages Script Exists
        if [[ ! -f "$APTSCRIPT" ]]; then
          echo "└─ ⚠️ APT Packages Script Not Found"
          echo "└─ 📁 Expected Path : $APTSCRIPT"
          exit 1
        fi

        # Make APT Packages Script Executable
        chmod +x "$APTSCRIPT"
        # Install Packages Using Persistent Cache
        echo "└─ 🚀 Running APT Packages Script..."
        bash "$APTSCRIPT" "$HOME/.apt-pkg-cache"
        # Complete Dependency Setup
        echo "└─ 🎉 Build Dependencies Ready"
