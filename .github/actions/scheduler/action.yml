name: "Scheduler"
description: "Apply Fengchi/Windspeed Scheduler Patches"

runs:
  using: composite

  steps:

    - name: 🔧 Scheduler Conversion
      if: ${{ env.KERNELVERSION == '6.6' && github.event.inputs.WINDSPEED == 'false' && !endsWith(github.event.inputs.FILE, 'aosp') }}
      shell: bash
      run: |
        set -Eeuo pipefail

        # Paths
        PDIR="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab/patches"
        KCDIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
        PFILE="${PDIR}/HMBIRD.patch"

        echo "------------------------------"
        echo "🚀 Scheduler Conversion Stage"
        echo "📂 Kernel Version: ${KERNELVERSION}"
        echo "------------------------------"
        echo ""

        # Validate Kernel Directory
        if [[ ! -d "$KCDIR" ]]; then
          echo "⚠️ Kernel Directory Not Found:"
          echo "$KCDIR"
          exit 1
        fi

        cd "$KCDIR"

        # Validate Patch
        if [[ ! -f "$PFILE" ]]; then
          echo "⚠️ Patch File Not Found:"
          echo "$PFILE"
          echo "⏭️ Conversion Skipped"
          exit 0
        fi

        # Detect Already-Converted Scheduler
        if [[ -d "kernel/sched/hmbird" ]] || \
           [[ -d "vendor/oplus/kernel/cpu/sched_ext/hmbird" ]]; then
          echo "🔎 Hmbird Scheduler Already Present"
          echo "⏭️ Skipping Conversion Stage"
          exit 0
        fi

        # Validate Makefile
        if [[ ! -f "drivers/Makefile" ]]; then
          echo "⚠️ Drivers Makefile Not Found"
          exit 1
        fi

        echo "🔍 Checking Hmbird Conversion Patch..."

        patchstatus=0

        # Check Whether Patch Can Be Applied
        if patch -p1 --dry-run -F3 < "$PFILE" >/dev/null 2>&1; then
          echo "✔️ Hmbird Patch is Applicable"

          # Add Hmbird Build Rule
          if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
            echo "✔️ Hmbird Build Rule Already Present"
          else
            echo "🛠️ Injecting Hmbird Build Rule"
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          fi

          echo "🚀 Applying Scheduler Conversion Patch..."
          patch -p1 -F3 < "$PFILE" || patchstatus=$?

          if [[ "$patchstatus" -eq 0 ]]; then
            echo "✔️ Scheduler Conversion Applied Successfully"
          else
            echo "⚠️ Scheduler Conversion Patch Failed"
          fi

        # Check Whether Patch Is Already Applied
        elif patch -p1 -R --dry-run -F3 < "$PFILE" >/dev/null 2>&1; then
          echo "✔️ Hmbird Conversion Patch is Already Applied"
          echo "⏭️ Skipping Conversion"

          # Restore Hmbird Build Rule if Missing
          if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
            echo "✔️ Hmbird Build Rule Already Present"
          else
            echo "🛠️ Restoring Hmbird Build Rule"
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          fi

        else
          echo "⚠️ Hmbird Patch is Not Applicable"
          echo "⚠️ The Patch is Neither Applicable Nor Already Applied"
          echo "🛑 Scheduler Conversion Failed"
          exit 1
        fi

        # Load Reject Checker and Run Rejection Check
        source "$REJECTCHECKER"
        checkrejects .

        # Fail After Reject Check if Patch Failed
        if [[ "$patchstatus" -ne 0 ]]; then
          exit "$patchstatus"
        fi

        echo ""
        echo "🎉 Scheduler Conversion Stage Completed"


    - name: 🔧 Apply Fengchi / Windspeed Scheduler
      if: ${{ github.event.inputs.WINDSPEED == 'true' }}
      shell: bash
      env:
        FILE: ${{ github.event.inputs.FILE }}
        CPU: ${{ env.CPU }}
        CPUD: ${{ env.CPUD }}
      run: |
        set -Eeuo pipefail

        # Enter Kernel Source Directory
        cd kernel_workspace/kernel_platform/common

        # Resolve CPU Branch and Patch Name
        CPU="${CPU:-${CPUD:-}}"
        CFILE="${FILE//_bak/}"

        # Check if Fengchi Scheduler Already Exists
        for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
          [[ -e "$p" ]] && {
            echo "🎉 Fengchi Scheduler Already Exists"
            echo "⏭️ Skipping Patch..."
            exit 0
          }
        done

        # Clone Fengchi Patch Repository
        rm -rf SCHED_PATCH
        echo "📥 Cloning Fengchi Patch Repository..."
        git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git -b "$CPU" || {
          echo "⚠️ CPU Branch '$CPU' Does Not Exist"
          echo "⚠️ Fengchi Does Not Support This Device Yet"
          exit 11
        }

        # Locate Fengchi Patch
        PFILE="fengchi_${CFILE}.patch"
        PPATH="./SCHED_PATCH/${PFILE}"

        [[ -f "$PPATH" ]] || {
          echo "⚠️ Patch '$PFILE' Not Found"
          echo "⚠️ Fengchi Does Not Support This Device Yet"
          exit 12
        }

        # Apply Fengchi Scheduler Patch
        echo "🔧 Applying Fengchi Scheduler Patch..."

        cp "$PPATH" ./
        dos2unix "$PFILE" 2>/dev/null || true
        patchstatus=0
        patch -p1 --forward -F3 < "$PFILE" || patchstatus=$?

        # Cleanup
        rm -f "$PFILE"
        rm -rf SCHED_PATCH

        # Load Reject Checker and Run Rejection Check
        source "$REJECTCHECKER"
        checkrejects .

        # Fail if Patch Application Failed
        if [[ "$patchstatus" -ne 0 ]]; then
          echo "⚠️ Fengchi Scheduler Patch Failed"
          exit "$patchstatus"
        fi

        echo ""
        echo "🚀 Fengchi Patch Applied Successfully"
