# Unicode Bypass Composite Action
name: 🚧 Unicode Bypass
description: Apply Unicode Bypass Patch Based on Kernel Version
inputs:
  # Enable or Disable Unicode Bypass
  UNICODE:
    description: Enable Unicode Bypass Patch
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # 🚧 Apply Unicode Bypass Patch When Enabled
    - name: 🚧 Unicode Bypass
      if: ${{ inputs.UNICODE == 'true' }}
      shell: bash
      # Export Composite Inputs as Environment Variables
      env:
        KV1: ${{ env.KV1 }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        echo "└─ 🚀 Unicode Bypass Patch Stage"
        echo "└─ 📂 Kernel Major Version : ${KV1:-Unknown}"
        # Validate Kernel Major Version is Set
        if [[ -z "${KV1:-}" ]]; then
          echo "└─ ⚠️ KV1 (Kernel Major Version) Not Set"
          exit 1
        fi

        # Ensure Kernel Major Version Contains Only Digits
        if ! [[ "$KV1" =~ ^[0-9]+$ ]]; then
          echo "└─ ⚠️ Invalid KV1 Value : $KV1"
          exit 1
        fi

        # Verify Kernel Common Directory Exists
        if [[ ! -d "$COMMONKERNELFOLDER" ]]; then
          echo "└─ ⚠️ Kernel Common Directory Not Found :"
          echo "$COMMONKERNELFOLDER"
          exit 1
        fi

        # Change to Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # Select Unicode Bypass Patch Based on Kernel Version
        if (( KV1 < 6 )); then
          # Use Patch Intended For Kernel Versions Below 6.1
          UNICODEPATCH="${PATCHDIR}/Unicode-Bypass-Fix-6.1-.patch"
          echo "└─ 📊 Using Patch : Kernel < 6.1"
        else
          # Use Patch Intended For Kernel Version 6.1 and Above
          UNICODEPATCH="${PATCHDIR}/Unicode-Bypass-Fix-6.1+.patch"
          echo "└─ 📊 Using Patch : Kernel ≥ 6.1"
        fi

        # Check Whether Selected Patch File Exists
        if [[ ! -f "$UNICODEPATCH" ]]; then
          echo "└─ ⚠️ Patch File Not Found :"
          echo "$UNICODEPATCH"
          echo "└─ ⏭️ Skipping Unicode Bypass Stage"
          exit 0
        fi

        # Display Selected Patch File Name
        echo "└─ 📦 Patch File : $(basename "$UNICODEPATCH")"
        # Check Whether the Patch Can Be Applied Without Modifying Files
        echo "└─ 🔍 Checking Patch Applicability..."
        if patch -p1 --dry-run < "$UNICODEPATCH" >/dev/null 2>&1; then
          # Apply Patch When Dry Run Succeeds
          echo "🛠️ Applying Unicode Bypass Patch..."
          patch -p1 --forward < "$UNICODEPATCH"
          echo "└─ 📌 Patch Applied Successfully"
        else
          # Skip Application if Patch Cannot be Applied Cleanly
          echo "└─ 📌 Patch Already Applied or Not Required"
        fi

        # Verify Reject Checker Script Exists
        if [[ ! -f "$REJECTCHECKER" ]]; then
          echo "└─ ⚠️ Reject Checker Not Found :"
          echo "$REJECTCHECKER"
          exit 1
        fi

        # Load Reject Checker Functions
        source "$REJECTCHECKER"
        # Check Current Kernel Source For Patch Rejections
        checkrejects .
        # Report Successful Completion of Unicode Bypass Stage
        echo "└─ 🎉 Unicode Bypass Stage Completed"
