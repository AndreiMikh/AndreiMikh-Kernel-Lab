# Root Source Resolution Composite Action
name: 🧩 Resolve Root Source
description: Resolve Root Source(s)
inputs:
  # Select Root Source Branch
  ROOTBRANCHSOURCE:
    required: true
  # Select Root Engine
  ROOTENGINE:
    required: true
  # Specify Custom Root Source Commit (Optional)
  ROOTCOMMIT:
    required: false
    default: ""
# Define Outputs Generated By Root Source Manager
outputs:
  # Root Source Setup Repository
  ksurepo:
    description: Root Source Setup Repository
    value: ${{ steps.manager.outputs.ksurepo }}
  # Full Root Source Commit Hash
  rootcommitfull:
    description: Root Source Commit Hash
    value: ${{ steps.manager.outputs.rootcommitfull }}
  # Short Root Source Commit Hash (7 Characters)
  rootcommit:
    description: Root Source Commit Hash (7 Characters)
    value: ${{ steps.manager.outputs.rootcommit }}
  # Root Source Manager Release Repository
  releaserepo:
    description: Root Source Manager Release Repository
    value: ${{ steps.manager.outputs.releaserepo }}
  # Root Source Manager Release Branch
  releasebranch:
    description: Root Source Manager Release Branch
    value: ${{ steps.manager.outputs.releasebranch }}
  # Root Source Manager Branch
  managerbranch:
    description: Manager Branch
    value: ${{ steps.manager.outputs.managerbranch }}
  # Root Source Manager Branch Path
  branchpath:
    description: Root Source Manager Branch Path
    value: ${{ steps.manager.outputs.branchpath }}
  # Root Source Manager Artifact
  managerartifact:
    description: Root Source Manager artifact
    value: ${{ steps.manager.outputs.managerartifact }}
  # Root Source Latest Manager Release Tag
  managertag:
    description: Root Source Latest Manager Tag
    value: ${{ steps.manager.outputs.managertag }}
  # Root Source Version
  ksuversion:
    description: Root Source Version
    value: ${{ steps.manager.outputs.ksuversion }}
runs:
  using: composite
  steps:
    - name: 🧩 Solve APK Source
      id: manager
      shell: bash
      # Export Composite Action Inputs
      env:
        GH_TOKEN: ${{ github.token }}
        ROOTBRANCHSOURCE: ${{ inputs.ROOTBRANCHSOURCE }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        ROOTCOMMIT: ${{ inputs.ROOTCOMMIT }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        MANAGERBRANCH=""
        BRANCHPATH=""
        MANAGERARTIFACT=""
        # Setup / Source Repository Used For Cloning or Preparing Manager
        KSUREPO=""
        # Repository and Branch Used For Root Source Version / Release Resolution
        VERSIONREPO=""
        VERSIONBRANCH=""
        VERSIONOFFSET=""
        # Resolve Root Source
        case "$ROOTBRANCHSOURCE" in
          BakaSU-Main)
            MANAGERBRANCH="main"
            BRANCHPATH=""
            MANAGERARTIFACT="Manager-release"
            ;;
          SukiSU-Ultra-Main)
            MANAGERBRANCH="main"
            BRANCHPATH="main"
            MANAGERARTIFACT="manager"
            ;;
          SukiSU-Ultra-Builtin)
            MANAGERBRANCH="main"
            BRANCHPATH="builtin"
            MANAGERARTIFACT="manager"
            ;;
          KernelSU-Next-Dev-SUSFS)
            MANAGERBRANCH="dev"
            BRANCHPATH="dev-susfs"
            MANAGERARTIFACT="manager"
            ;;
          KernelSU-Main)
            MANAGERBRANCH="main"
            BRANCHPATH=""
            MANAGERARTIFACT="manager"
            ;;
          *)
            echo "└─ [Warn] ⚠️ Unsupported Root Source : $ROOTBRANCHSOURCE"
            exit 1
            ;;
        esac
        # Resolve Root Engine Repository
        case "$ROOTENGINE" in
          SukiSU-Ultra)
            KSUREPO="SukiSU-Ultra/SukiSU-Ultra"
            VERSIONREPO="SukiSU-Ultra/SukiSU-Ultra"
            RELEASEREPO="$VERSIONREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU-Next)
            KSUREPO="pershoot/KernelSU-Next"
            VERSIONREPO="KernelSU-Next/KernelSU-Next"
            RELEASEREPO="$VERSIONREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          BakaSU)
            KSUREPO="Baka-SU/BakaSU"
            VERSIONREPO="Baka-SU/BakaSU"
            RELEASEREPO="$VERSIONREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU)
            KSUREPO="tiann/KernelSU"
            VERSIONREPO="tiann/KernelSU"
            RELEASEREPO="$VERSIONREPO"
            RELEASEBRANCH="$MANAGERBRANCH"
            ;;
          *)
            echo "└─ [Warn] ⚠️ Unsupported Root Engine : $ROOTENGINE"
            exit 1
            ;;
        esac
        # Resolve Root Source Branch
        if [[ "$ROOTBRANCHSOURCE" == "SukiSU-Ultra-Builtin" ]]; then
          ROOTSOURCEBRANCH="main"
        else
          ROOTSOURCEBRANCH="${BRANCHPATH:-$MANAGERBRANCH}"
        fi
        
        ROOTSOURCEREPO="$KSUREPO"
        # Validate Resolution
        [[ -n "$MANAGERBRANCH" ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Manager Branch"
          exit 1
        }
        [[ -n "$KSUREPO" ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Root Engine Repository"
          exit 1
        }
        [[ -n "$VERSIONREPO" ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Root Engine Repository"
          exit 1
        }
        echo ""
        echo "------------------------------"
        echo "└─ [Info] 🔗 Repository       : $KSUREPO"
        echo "└─ [Info] 🌿 Manager Branch   : $MANAGERBRANCH"
        echo "└─ [Info] 📁 Setup Repo       : ${BRANCHPATH:-None}"
        echo "└─ [Info] 📦 Manager Artifact : $MANAGERARTIFACT"
        echo "------------------------------"
        # Resolve Root Source Version
        VERSIONCOUNTREPO="$VERSIONREPO"
        VERSIONCOUNTREF=""
        case "$ROOTENGINE" in
          SukiSU-Ultra)
            VERSIONOFFSET="37185"
            VERSIONBRANCH="$ROOTSOURCEBRANCH"             
            ;;
          BakaSU)
            VERSIONOFFSET="30700"
            VERSIONBRANCH="$MANAGERBRANCH"
            ;;
          KernelSU-Next)
            VERSIONOFFSET="30000"
            VERSIONBRANCH="$ROOTSOURCEBRANCH"
            VERSIONCOUNTREPO="KernelSU-Next/KernelSU-Next"
            VERSIONCOUNTREF="$MANAGERBRANCH"
            ;;
          KernelSU)
            VERSIONOFFSET="30000"
            VERSIONBRANCH="$MANAGERBRANCH"
            ;;
          *)
            echo "└─ [Warn] ⚠️ Unsupported Root Engine : $ROOTENGINE"
            exit 1
            ;;
        esac
        [[ "$VERSIONOFFSET" =~ ^[0-9]+$ ]] || {
          echo "└─ [Warn] ⚠️ Invalid Version Offset : $VERSIONOFFSET"
          exit 1
        }
        [[ -n "$VERSIONBRANCH" ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Root Source Version / Branch"
          exit 1
        }
        echo ""
        echo "------------------------------"
        echo "└─ [Info] 📦 Engine            : $ROOTENGINE"
        echo "└─ [Info] 🔗 Setup Repository  : $KSUREPO"
        echo "└─ [Info] 🌿 Setup Branch      : $MANAGERBRANCH"
        echo "└─ [Info] 📁 Setup Path        : ${BRANCHPATH:-None}"
        echo "└─ [Info] 📦 Manager Artifact  : $MANAGERARTIFACT"
        echo "------------------------------"
        echo "└─ [Info] 🔢 Version Source    : $VERSIONCOUNTREPO"
        echo "└─ [Info] 🌿 Version Branch    : $VERSIONBRANCH"
        echo "└─ [Info] ➕ Version Offset    : $VERSIONOFFSET"
        echo "------------------------------"
        # Validate Version Branch
        echo "└─ [Info] 🔎 Validating Version Branch..."
        if ! gh api \
          "repos/${VERSIONCOUNTREPO}/git/ref/heads/${VERSIONCOUNTREF:-$VERSIONBRANCH}" \
          --silent >/dev/null 2>&1; then
          echo "└─ [Warn] ⚠️ Version Branch Not Found"
          echo "└─ [Info] Repository : $ROOTSOURCEREPO"
          echo "└─ [Info] Branch     : ${VERSIONCOUNTREF:-$VERSIONBRANCH}"
          exit 1
        fi

        echo "✔ Version Branch: ${VERSIONCOUNTREF:-$VERSIONBRANCH}"
        # Resolve Root Engine Commit
        ROOTCOMMITFALLBACK=false
        if [[ -n "$ROOTCOMMIT" ]]; then
          if [[ ! "$ROOTCOMMIT" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
            echo "└─ [Warn] ⚠️ Invalid Root Engine Commit : $ROOTCOMMIT"
            echo "└─ [Info] Expected a 7–40 Character SHA"
            exit 1
          fi

          echo "└─ [Info] 🔎 Searching For Commit : $ROOTCOMMIT"
          ROOTCOMMITFULL="$(
            gh api "repos/${ROOTSOURCEREPO}/commits/${ROOTCOMMIT}" \
              --jq '.sha'
          )" || {
            echo "└─ [Warn] ⚠️ Failed to Resolve Commit : $ROOTCOMMIT"
            exit 1
          }
          # Verify Commit Belongs to Root Source Branch
          BRANCHSTATUS="$(
            gh api \
              "repos/${ROOTSOURCEREPO}/compare/${ROOTSOURCEBRANCH}...${ROOTCOMMITFULL}" \
              --jq '.status'
          )" || {
            echo "└─ [Warn] ⚠️ Failed to Compare Commit Against Branch : $ROOTSOURCEBRANCH"
            exit 1
          }
          
          if [[ "$BRANCHSTATUS" != "identical" && \
                "$BRANCHSTATUS" != "behind" && \
                "$BRANCHSTATUS" != "ahead" ]]; then
            echo "└─ [Warn] ⚠️ Commit Mismatch: $ROOTSOURCEBRANCH"
            echo "└─ [Info] 🔄 Falling Back to Latest Branch Commit"
            ROOTCOMMITFULL="$(
              gh api \
                "repos/${ROOTSOURCEREPO}/commits/${ROOTSOURCEBRANCH}" \
                --jq '.sha'
            )" || {
              echo "└─ [Warn] ⚠️ Failed to Resolve Branch Commit : $ROOTSOURCEBRANCH"
              exit 1
            }
            ROOTCOMMITFALLBACK=true
          fi

          # Validate First 7 Characters
          if [[ "$ROOTCOMMITFALLBACK" != true && \
                "${ROOTCOMMITFULL:0:7}" != "${ROOTCOMMIT:0:7}" ]]; then
            echo "└─ [Warn] ⚠️ Resolved Commit Does Not Match Input"
            echo "└─ [Info] Input    : $ROOTCOMMIT"
            echo "└─ [Info] Resolved : $ROOTCOMMITFULL"
            exit 1
          fi
 
        else
          echo "└─ [Info] 🌿 Using Latest Commit From Branch : $ROOTSOURCEBRANCH"
          ROOTCOMMITFULL="$(
            gh api \
              "repos/${ROOTSOURCEREPO}/commits/${ROOTSOURCEBRANCH}" \
              --jq '.sha'
          )" || {
            echo "└─ [Warn] ⚠️ Failed to Resolve Branch Commit : $ROOTSOURCEBRANCH"
            exit 1
          }
        fi

        [[ "$ROOTCOMMITFULL" =~ ^[a-fA-F0-9]{40}$ ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Full Commit SHA"
          exit 1
        }
        ROOTCOMMITSHORT="${ROOTCOMMITFULL:0:7}"
        {
          echo "rootcommitfull=$ROOTCOMMITFULL"
          echo "rootcommit=$ROOTCOMMITSHORT"
        } >> "$GITHUB_OUTPUT"
        echo "└─ [Info] ✔ Resolved Commit  : $ROOTCOMMITSHORT"
        echo "└─ [Info] 🔖 Full Commit SHA : $ROOTCOMMITFULL"
        echo ""
        echo "------------------------------"
        echo "└─ [Info] 🔎 Resolving $ROOTENGINE Root Source Version..."
        # KernelSU-Next Uses Upstream Version Branch, Not Fork Commit
        if [[ "$ROOTENGINE" != "KernelSU-Next" ]]; then
          VERSIONCOUNTREF="${ROOTCOMMITFULL}^{commit}"
        fi

        VERSIONDATA="$(
          gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $expression: String!) {
                repository(owner: $owner, name: $repo) {
                  object(expression: $expression) {
                    ... on Commit {
                      oid
                      history(first: 1) {
                        totalCount
                      }
                    }
                  }
                }
              }
            ' \
            -F owner="${VERSIONCOUNTREPO%%/*}" \
            -F repo="${VERSIONCOUNTREPO#*/}" \
            -F expression="$VERSIONCOUNTREF"
        )" || {
          echo "└─ [Warn] ⚠️ Failed to Resolve Version History"
          echo "└─ [Info] Repository : $VERSIONCOUNTREPO"
          echo "└─ [Info] Reference  : $VERSIONCOUNTREF"
          exit 1
        }
        if ! jq -e '
          (.errors == null) and
          (.data.repository.object.oid | type == "string") and
          (.data.repository.object.history.totalCount | type == "number")
        ' >/dev/null 2>&1 <<< "$VERSIONDATA"; then
          echo "└─ [Warn] ⚠️ Invalid Version History Response"
          jq -r '
            if .errors then
              .errors[] | "└─ [Info] API Error : \(.message)"
            else
              "└─ Repository or Commit History was Not Found"
            end
          ' <<< "$VERSIONDATA" 2>/dev/null || true
          exit 1
        fi
      
        RESOLVEDCOMMIT="$(
          jq -r '.data.repository.object.oid // empty' <<< "$VERSIONDATA"
        )"
        COMMITCOUNT="$(
          jq -r '.data.repository.object.history.totalCount // empty' <<< "$VERSIONDATA"
        )"
        echo "└─ [Info] ✔ Version Commit  : ${RESOLVEDCOMMIT:0:7}"
        echo "└─ [Info] 📊 Commit Count   : $COMMITCOUNT"
        if [[ "$ROOTENGINE" != "KernelSU-Next" ]]; then
          [[ "${RESOLVEDCOMMIT,,}" == "${ROOTCOMMITFULL,,}" ]] || {
            echo "└─ [Warn] ⚠️ Selected Commit Does Not Match Resolved Commit"
            echo "└─ [Info] Expected : $ROOTCOMMITFULL"
            echo "└─ [Info] Resolved : $RESOLVEDCOMMIT"
            exit 1
          }
        fi

        # Calculate Root Source Version
        [[ "$COMMITCOUNT" =~ ^[0-9]+$ ]] || {
          echo "└─ [Warn] ⚠️ Failed to Resolve $ROOTENGINE Commit Count"
          exit 1
        }
        KSUVERSION=$((COMMITCOUNT + VERSIONOFFSET))
        [[ "$KSUVERSION" =~ ^[0-9]+$ ]] || {
          echo "└─ [Warn] ⚠️ Invalid Root Source Version : $KSUVERSION"
          exit 1
        }
        echo "└─ [Info] 📊 Commit Count         : $COMMITCOUNT"
        echo "└─ [Info] ✔ Offset                : $VERSIONOFFSET"
        echo "└─ [Info] 🔢 Root Source Version  : $KSUVERSION"
        # Resolve Latest Manager Tag
        echo "------------------------------"
        echo "└─ [Info] 🔎 Resolving Latest Manager Tag..."
        # Primary: Git Tags
        MANAGERTAG="$(
          gh api \
            "repos/${RELEASEREPO}/git/matching-refs/tags/" \
            --paginate \
            --jq '.[].ref | sub("^refs/tags/"; "")' |
          sort -V |
          tail -n 1
        )" || true
        if [[ -n "$MANAGERTAG" ]]; then
          echo "└─ [Info] ✔ Latest Manager Tag : $MANAGERTAG"
        else
          echo "└─ [Warn] ⚠️ No Git Tag Found"
          echo "└─ [Info] 🔄 Falling Back to GitHub Releases..."
          RELEASEJSON="$(
            gh api \
              "repos/${RELEASEREPO}/releases?per_page=100" \
              2>/dev/null || true
          )"
          if [[ -n "$RELEASEJSON" ]] && \
             jq -e 'type == "array"' >/dev/null 2>&1 <<< "$RELEASEJSON"; then
            MANAGERTAG="$(
              jq -r '
                map(select(
                  .draft == false and
                  .prerelease == false and
                  (.tag_name // "") != ""
                )) |
                sort_by(.published_at // "") |
                reverse |
                .[0].tag_name // empty
              ' <<< "$RELEASEJSON"
            )"
          fi

          if [[ -n "$MANAGERTAG" ]]; then
            echo "└─ [Info] ✔ Manager Tag From Release : $MANAGERTAG"
          else
            echo "└─ [Warn] ⚠️ No Manager Tag Found"
            echo "└─ [Info] Release Repository         : $RELEASEREPO"
            echo "└─ [Info] Manager Artifact           : $MANAGERARTIFACT"
            echo "└─ [Info] Continuing Without Release Tag"
          fi
        fi

        echo "└─ [Info] 🏷️ Latest Manager Tag: $MANAGERTAG"
        # Export Outputs
        {
          echo "managerbranch=$MANAGERBRANCH"
          echo "branchpath=$BRANCHPATH"
          echo "managerartifact=$MANAGERARTIFACT"
          echo "ksurepo=$KSUREPO"
          echo "releaserepo=$RELEASEREPO"
          echo "releasebranch=$RELEASEBRANCH"
          echo "managertag=$MANAGERTAG"
          echo "ksuversion=$KSUVERSION"
        } >> "$GITHUB_OUTPUT"
        echo "└─ [Info] 📦 Engine       : $ROOTENGINE"
        echo "└─ [Info] 📂 Repository   : $KSUREPO"
        echo "└─ [Info] 🌿 Branch       : $MANAGERBRANCH"
        echo "└─ [Info] 📁 Setup Repo   : ${BRANCHPATH:-None}"
        echo "└─ [Info] 📦 Artifact     : $MANAGERARTIFACT"
        echo "└─ [Info] 🏷️ Manager Tag  : $MANAGERTAG"
        echo "└─ [Info] 📊 Commit Count : $COMMITCOUNT"
        echo "└─ [Info] 🔢 KSU Version  : $KSUVERSION"
        echo "------------------------------"
