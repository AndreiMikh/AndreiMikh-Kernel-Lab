# Hmbird Scheduler Setup
name: ⚡ Hmbird Scheduler Setup
description: Configure Hmbird Scheduler with Generic Conversion and Device-Specific Fengchi Patches
inputs:
  # Resolved Kernel Manifest File Used to Select Hmbird Patch
  FILE:
    description: Resolved Kernel Manifest File
    required: true
runs:
  using: composite
  steps:
    # Convert the Kernel Scheduler to Hmbird
    - name: 🔄 Apply Scheduler Conversion
      if: ${{ steps.kernel-version-setup.outputs.kernelversion == '6.6' && !inputs.WINDSPEED }}
      shell: bash
      # Import Environment Variables
      env:
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
        KERNELVERSION: ${{ env.KERNELVERSION }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Define Hmbird Scheduler Conversion Patch
        SCHEDCONVERTPATCH="${PATCHDIR}/HMBIRD.patch"
        # Display Scheduler Conversion Information
        echo "└─ 🚀 Scheduler Conversion Stage"
        echo "└─ 📂 Kernel Version   : ${KERNELVERSION}"
        echo "└─ 📄 Conversion Patch : ${SCHEDCONVERTPATCH}"
        # Validate Hmbird Conversion Patch
        if [[ ! -f "$SCHEDCONVERTPATCH" ]]; then
          echo "└─ ⚠️ Hmbird Conversion Patch Not Found : $SCHEDCONVERTPATCH"
          exit 1
        fi

        # Validate Shared Patch Rejection Checker
        if [[ ! -f "$REJECTCHECKER" ]]; then
          echo "└─ ⚠️ Reject Checker Not Found : $REJECTCHECKER"
          exit 1
        fi

        # Navigate to Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # Check Whether Hmbird Scheduler is Already Integrated
        if [[ -d "kernel/sched/hmbird" ]] || \
           [[ -d "vendor/oplus/kernel/cpu/sched_ext/hmbird" ]]; then
          echo "└─ ℹ️ Hmbird Scheduler Already Present"
          echo "└─ ⏭️ Skipping Conversion Stage"
          exit 0
        fi

        # Validate Drivers Makefile Required For Hmbird Build
        if [[ ! -f "drivers/Makefile" ]]; then
          echo "└─ ⚠️ Drivers Makefile Not Found"
          exit 1
        fi

        # Check Whether Hmbird Conversion Patch can be Applied
        echo "└─ 🔍 Checking Hmbird Conversion Patch..."
        # Initialize Patch Application Status
        patchstatus=0
        if patch -p1 --dry-run -F3 < "$SCHEDCONVERTPATCH" >/dev/null 2>&1; then
          # Confirm Patch Applicability
          echo "└─ 📌 Hmbird Patch is Applicable"
          # Check Whether the Required Hmbird Build Rule Already Exists
          if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
            echo "└─ 📌 Hmbird Build Rule Already Present"
          else
            # Insert Missing Hmbird Build Rule at the Beginning
            echo "└─ 🛠️ Injecting Hmbird Build Rule"
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          fi

          # Apply Hmbird Scheduler Conversion Patch
          echo "└─ 🚀 Applying Scheduler Conversion Patch..."
          if patch -p1 -F3 < "$SCHEDCONVERTPATCH"; then
            echo "└─ 📌 Scheduler Conversion Applied Successfully"
          else
            patchstatus=$?
            echo "└─ ⚠️ Scheduler Conversion Patch Failed with Status ${patchstatus}"
          fi

        # Check Whether the Conversion Patch has Already been Applied
        elif patch -p1 -R --dry-run -F3 < "$SCHEDCONVERTPATCH" >/dev/null 2>&1; then
          # Skip Reapplying an Already-Applied Patch
          echo "└─ 📌 Hmbird Conversion Patch is Already Applied"
          echo "└─ ⏭️ Skipping Conversion"
          # Restore Required Hmbird Build Rule if Missing
          if grep -qE '^[[:space:]]*obj-y[[:space:]]*\+=.*hmbird_patch\.o' drivers/Makefile; then
            echo "└─ 📌 Hmbird Build Rule Already Present"
          else
            echo "└─ 🛠️ Restoring Hmbird Build Rule"
            sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          fi

        else
          # Reject Patches That are Neither Applicable Nor Already Applied
          echo "└─ ⚠️ Hmbird Patch is Not Applicable"
          echo "└─ ⚠️ Patch is Neither Applicable Nor Already Applied"
          echo "└─ 🛑 Scheduler Conversion Failed"
          exit 1
        fi

        # Load Shared Patch Rejection Checker
        source "$REJECTCHECKER"
        # Detect and Report Rejected Patch Hunks
        checkrejects .
        # Validate Hmbird Conversion Patch Application
        if [[ "$patchstatus" -ne 0 ]]; then
          echo "└─ ⚠️ Scheduler Conversion Failed with Status ${patchstatus}"
          exit "$patchstatus"
        fi

        # Report Successful Hmbird Scheduler Conversion
        echo "└─ 🎉 Scheduler Conversion Stage Completed"

    # Apply the Device-Specific Hmbird Scheduler Patch
    - name: ⚡ Apply Fengchi Scheduler Patch
      if: ${{ contains(fromJSON('["sm8750", "sm8735", "mt6991"]'), steps.extract-info.outputs.cpu) && inputs.WINDSPEED }}
      shell: bash
      # Export Composite Action Inputs and Import Environment Variables
      env:
        # Kernel Common Source Directory
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        # 📄 Resolved Kernel Manifest File
        FILE: ${{ inputs.FILE }}
        # Primary CPU Identifier
        CPU: ${{ env.CPU }}
        # Fallback CPU Identifier
        CPUD: ${{ env.CPUD }}
        # Patch Reject Checker Script
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Navigate to Kernel Common Directory
        cd "$COMMONKERNELFOLDER"
        # Resolve CPU Branch and Normalize Manifest Filename
        CPU="${CPU:-${CPUD:-}}"
        CFILE="${FILE//_bak/}"
        # Validate CPU Branch
        if [[ -z "$CPU" ]]; then
          echo "└─ ⚠️ CPU Branch is Empty"
          echo "└─ ⚠️ Unable to Select Fengchi Scheduler Patch"
          exit 1
        fi

        # Check Whether Hmbird Scheduler Already Exists
        for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
          [[ -e "$p" ]] && {
            echo "└─ 🎉 Hmbird Scheduler Already Exists"
            echo "└─ ⏭️ Skipping Patch..."
            exit 0
          }
          
        done

        # Clone Hmbird Scheduler Patch Repository
        rm -rf SCHEDPATCH
        echo "└─ 📥 Cloning Hmbird Patch Repository..."
        if ! git clone --depth=1 \
          https://github.com/AndreiMikh/Kernel-Hmbird-Patch.git \
          -b "$CPU" SCHEDPATCH; then
          echo "└─ ⚠️ CPU Branch '$CPU' Does Not Exist or Cannot be Cloned"
          echo "└─ ⚠️ Fengchi may Not Support Selected Device Yet"
          rm -rf SCHEDPATCH
          exit 11
        fi

        # Locate Device-Specific Hmbird Patch
        FENGCHIPATCH="fengchi_${CFILE}.patch"
        FENGCHIPATH="./SCHEDPATCH/${FENGCHIPATCH}"
        if [[ ! -f "$FENGCHIPATH" ]]; then
          echo "└─ ⚠️ Patch '$FENGCHIPATCH' Not Found"
          echo "└─ ⚠️ Hmbird may Not Support Selected Device Yet"
          rm -rf SCHEDPATCH
          exit 12
        fi

        # Apply Hmbird Scheduler Patch with Fuzz Factor 3
        echo "└─ 🔧 Applying Hmbird Scheduler Patch..."
        cp "$FENGCHIPATH" ./
        dos2unix "$FENGCHIPATCH" 2>/dev/null || true
        # Track Patch Application Status
        patchstatus=0
        if patch -p1 --forward -F3 < "$FENGCHIPATCH"; then
          echo "└─ 🎉 Hmbird Scheduler Patch Command Completed"
        else
          patchstatus=$?
          echo "└─ ⚠️ Hmbird Scheduler Patch Command Failed"
        fi

        # Remove Temporary Patch Files and Repository
        rm -f "$FENGCHIPATCH"
        rm -rf SCHEDPATCH
        # Validate Patch Reject Checker
        if [[ ! -f "$REJECTCHECKER" ]]; then
          echo "└─ ⚠️ Reject Checker Script Not Found : $REJECTCHECKER"
          exit 1
        fi

        # Load Reject Checker and Inspect Patched Files
        source "$REJECTCHECKER"
        checkrejects .
        # Fail if Patch Application was Unsuccessful
        if [[ "$patchstatus" -ne 0 ]]; then
          echo "└─ ⚠️ Hmbird Scheduler Patch Failed"
          exit "$patchstatus"
        fi

        # Complete Hmbird Scheduler Integration
        echo "└─ 🎉 Hmbird Scheduler Patch Applied Successfully"
