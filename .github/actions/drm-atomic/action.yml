# DRM Atomic Clone Validation Flicker Fix
name: 🩹 DRM Atomic Clone Validation Flicker Fix
description: Validate and Apply DRM Atomic Clone Validation Flicker Fix For OnePlus SM8750 Kernels
# Composite Action Configuration
runs:
  using: composite
  steps:
    # Validate and Apply DRM Atomic Flicker Fix
    - name: 🩹 Apply DRM Atomic Clone Validation Flicker Fix
      shell: bash
      # Export Composite Action Inputs as Environment Variables
      env:
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
        CPU: ${{ env.CPU }}
        FULLVERSION: ${{ env.FULLVERSION }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Resolve DRM Atomic Patch Location
        DRMFIXPATCH="${PATCHDIR}/drm-atomic.patch"
        # Display DRM Fix Configuration
        echo "└─ 🚀 DRM Atomic Clone Validation Flicker Fix"
        echo "└─ 📂 CPU        : ${CPU:-Unknown}"
        echo "└─ 📂 Kernel     : ${FULLVERSION:-Unknown}"
        echo "└─ 📂 Kernel Dir : $COMMONKERNELFOLDER"
        echo "└─ 📄 Patch      : $DRMFIXPATCH"
        # Validate the Required Patch and Rejection Checker
        if [[ ! -f "$DRMFIXPATCH" ]]; then
          echo "└─ ⚠️ DRM Atomic Patch Not Found : $DRMFIXPATCH"
          exit 1
        fi

        if [[ ! -f "$REJECTCHECKER" ]]; then
          echo "└─ ⚠️ Reject Checker Not Found   : $REJECTCHECKER"
          exit 1
        fi

        # Define DRM Source Files Required by Patch
        TARGETS=(
          "drivers/gpu/drm/drm_atomic_helper.c"
          "drivers/gpu/drm/drm_mode_config.c"
          "include/drm/drm_mode_config.h"
        )
        # Navigate to Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # 🔎 Confirm All Required DRM Source Files Exist
        echo "└─ 🔎 Validating DRM Atomic Target Files..."
        for TARGET in "${TARGETS[@]}"; do
          if [[ ! -f "$TARGET" ]]; then
            echo "└─ ⚠️ Required DRM File Not Found :"
            echo "$TARGET"
            exit 1
          fi

          echo "└─ 📌 Found : $TARGET"
          
        done

        # Check Whether Patch can be Applied Cleanly
        echo "└─ 🧪 Checking DRM Atomic Patch Compatibility..."
        if git apply --check -p1 "$DRMFIXPATCH" >/dev/null 2>&1; then
          # 🩹 Apply Patch When All Changes are Compatible
          echo "└─ 🚀 Applying DRM Atomic Clone Validation Flicker Fix..."
          git apply --verbose -p1 "$DRMFIXPATCH"
          echo "└─ 🎉 DRM Atomic Flicker Fix Applied Successfully"
        elif git apply --reverse --check -p1 "$DRMFIXPATCH" >/dev/null 2>&1; then
          # ⏭️ Skip Patch When it has Already Been Applied
          echo "└─ ℹ️ DRM Atomic Flicker Fix is Already Applied"
          echo "└─ ⏭️ Skipping Patch..."
        else
          # Report Incompatible Source Without Failing Step
          echo "└─ ⚠️ DRM Atomic Patch is Incompatible with Kernel Source"
          echo "└─ ⚠️ Patch Validation Failed"
          echo "└─ ⏭️ Skipping Patch..."
        fi

        # Load Shared Patch Rejection Checker
        source "$REJECTCHECKER"
        # Check For Rejected Patch Hunks in Kernel Source
        checkrejects .
        # Report Successful Completion of DRM Fix Stage
        echo "└─ 🎉 DRM Atomic Clone Validation Flicker Fix Completed"
