# Workspace Paths Configuration Composite Action
# Configure and Validate All Required directories For Android Kernel Build Environment
name: 📂 Workspace Paths
description: Configure, Validate and Export Kernel Build Workspace Paths
# Define Composite Action Outputs
# Expose selected workspace paths to the calling workflow
outputs:
  # Root Working Directory
  workdir:
    description: Kernel Workspace Directory
    value: ${{ steps.workspace.outputs.workdir }}
  # Kernel GKI Default Configuration
  defconfig:
    description: Kernel GKI Default Configuration Path
    value: ${{ steps.workspace.outputs.defconfig }}
  # Kernel Platform Source Directory
  kernelplatform:
    description: Kernel Platform Directory
    value: ${{ steps.workspace.outputs.kernelplatform }}
  # Common Kernel Source Directory
  commonkernelfolder:
    description: Common Kernel Source Directory
    value: ${{ steps.workspace.outputs.commonkernelfolder }}
  # Kernel Lab Patch Directory
  patchdir:
    description: Kernel Lab Patches Directory
    value: ${{ steps.workspace.outputs.patchdir }}
# Define Composite Action Execution
runs:
  using: composite
  steps:
    # Configure, Validate and Export Kernel Workspace Paths
    - name: 📂 Workspace Paths
      id: workspace
      shell: bash
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Define GitHub Actions Workspace
        # Use Runner-Provided Workspace as Root Directory
        WORKSPACEDIR="${GITHUB_WORKSPACE}"
        # Define Kernel Build Workspace
        # Store Kernel Sources and Build-Related Repositories Under This Directory
        WORKDIR="${WORKSPACEDIR}/kernel_workspace"
        # Define Kernel Lab Repository
        # Contains Kernel Patches, Scripts, Libraries and Build Utilities
        LABDIR="${WORKDIR}/AndreiMikh-Kernel-Lab"
        # Define Kernel Platform Source Directories
        # Separate Common Kernel Source From Qualcomm MSM Kernel Source
        KERNELPLATFORM="${WORKDIR}/kernel_platform"
        COMMONKERNELFOLDER="${KERNELPLATFORM}/common"
        MSMKERNELFOLDER="${KERNELPLATFORM}/msm-kernel"
        # Define Kernel GKI Default Configuration
        # Use Common Kernel Architecture Configuration as Build Configuration
        DEFCONFIG="${COMMONKERNELFOLDER}/arch/arm64/configs/gki_defconfig"
        # Define Kernel Lab Resource Directories
        # PATCHDIR: Kernel Patch Collections
        # SCRIPTSDIR: Kernel Build and Maintenance Scripts
        # LIBDIR: Supporting Libraries and External Resources
        PATCHDIR="${LABDIR}/patches"
        SCRIPTSDIR="${LABDIR}/scripts"
        LIBDIR="${LABDIR}/lib"
        # Define Kernel Build Output Directory
        # Contains Generated Configuration Files and Compiled Kernel Artifacts
        OUTDIR="${COMMONKERNELFOLDER}/out"
        # Define Common Kernel Lab Utilities
        # RejectChecker Detects Rejected or Unsuccessfully Applied Kernel Patches
        REJECTCHECKER="${SCRIPTSDIR}/RejectChecker.sh"
        # Verify Reject Checker Availability
        # Grant Execution Permission When Script Exists
        if [[ -f "$REJECTCHECKER" ]]; then
          chmod +x "$REJECTCHECKER"
        else
          echo "└─ ⚠️ Reject Checker Not Found    : $REJECTCHECKER"
        fi

        # Validate Kernel Lab Repository Checkout
        # Stop Execution if Expected Repository Directory is Unavailable
        test -d "$LABDIR" || {
          echo "└─ ⚠️ Kernel Lab Not Found        : $LABDIR"
          exit 1
        }
        # Validate Kernel Lab Scripts Directory
        # Ensure Required Scripts Directory Exists Before Continuing
        test -d "$SCRIPTSDIR" || {
          echo "└─ ⚠️ Scripts Directory Not Found : $SCRIPTSDIR"
          exit 1
        }
        # Export Workspace Paths to GitHub Environment
        # Github Environment Makes These Variables Available to Subsequent Workflow Steps
        {
          echo "WORKSPACEDIR=${WORKSPACEDIR}"
          echo "WORKDIR=${WORKDIR}"
          echo "LABDIR=${LABDIR}"
          echo "DEFCONFIG=${DEFCONFIG}"
          echo "KERNELPLATFORM=${KERNELPLATFORM}"
          echo "COMMONKERNELFOLDER=${COMMONKERNELFOLDER}"
          echo "MSMKERNELFOLDER=${MSMKERNELFOLDER}"
          echo "PATCHDIR=${PATCHDIR}"
          echo "SCRIPTSDIR=${SCRIPTSDIR}"
          echo "LIBDIR=${LIBDIR}"
          echo "OUTDIR=${OUTDIR}"
          echo "REJECTCHECKER=${REJECTCHECKER}"
        } >> "$GITHUB_ENV"
        # Export Composite Action Outputs
        # Github Output Exposes Selected Paths Through Calling Workflow Step ID
        {
          echo "workdir=${WORKDIR}"
          echo "defconfig=${DEFCONFIG}"
          echo "kernelplatform=${KERNELPLATFORM}"
          echo "commonkernelfolder=${COMMONKERNELFOLDER}"
          echo "patchdir=${PATCHDIR}"
        } >> "$GITHUB_OUTPUT"
        # Display Configured Workspace Information
        # Print Resolved Paths For Build Environment Verification and Troubleshooting
        echo "------------------------------"
        echo "└─ 📂 Workspace Paths"
        echo "------------------------------"
        echo "└─ 📂 Workspace       : ${WORKSPACEDIR}"
        echo "└─ 📂 Work            : ${WORKDIR}"
        echo "└─ 📂 Kernel Lab      : ${LABDIR}"
        echo "└─ 📂 Kernel Platform : ${KERNELPLATFORM}"
        echo "└─ 📂 Common Kernel   : ${COMMONKERNELFOLDER}"
        echo "└─ 📂 MSM Kernel      : ${MSMKERNELFOLDER}"
        echo "└─ 📂 Patches         : ${PATCHDIR}"
        echo "└─ 📂 Scripts         : ${SCRIPTSDIR}"
        echo "└─ 📂 Libraries       : ${LIBDIR}"
        echo "└─ 📂 Output          : ${OUTDIR}"
        echo "└─ 📂 Reject Checker  : ${REJECTCHECKER}"
        echo "------------------------------"
