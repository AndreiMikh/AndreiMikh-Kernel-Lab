# KernelPatch Configuration Composite Action
name: 🧩 AnyKernel3 and KernelPatch Configuration
description: Clone and Configure AnyKernel3, Apply KernelPatch-Next and Prepare Final Image
# Define Inputs Required by Composite Action
inputs:
  # Select Root Engine Used by Kernel Build
  ROOTENGINE:
    description: Kernel root engine
    required: true
  # Define Kernel Manifest Configuration File
  FILE:
    description: Kernel Manifest Configuration File
    required: true
  # Select KernelPatch Variant (KernelPatch-Next)
  KERNELPATCH:
    description: KernelPatch variant (KernelPatch-Next)
    required: true
    default: KPN
  # Root Engine and Manager Information
  KSUVERSION:
    description: Root Engine Version
    required: false
    default: ""
  MANAGERTAG:
    description: Root Engine Manager Tag
    required: false
    default: ""
  # SuSFS Information
  SUSFSCOMMIT:
    description: Active SuSFS Commit
    required: false
    default: ""
  SUSFSVERSION:
    description: Active SuSFS Version
    required: false
    default: ""
  # Define GitHub Branch Name for KernelPatch-Next Fallback Downloads
  GITHUB_REF_NAME:
    description: GitHub Branch Name Used For KernelPatch-Next Fallback Downloads
    required: false
    default: main
# Define Composite Action Execution
runs:
  using: composite
  steps:
    # Configure AnyKernel3 Packaging Engine
    # Step Clones AnyKernel3, Configures Kernel Identification String
    # Validates Compiled Kernel Image and Copies Into AnyKernel3 Directory
    - name: 📦 AnyKernel3 Packaging Engine
      shell: bash
      env:
        # Import Device, Root Engine and Kernel Version Information
        FILE: ${{ inputs.FILE }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        KERNELVERSION: ${{ env.KERNELVERSION }}
        SUBLEVEL: ${{ env.SUBLEVEL }}
        # Import Workspace and Compiled Kernel Output Directories
        WORKSPACEDIR: ${{ env.WORKSPACEDIR }}
        OUTDIR: ${{ env.OUTDIR }}
        # Import Root Engine Version and Manager Information
        KSUVERSION: ${{ inputs.KSUVERSION }}
        MANAGERTAG: ${{ inputs.MANAGERTAG }}
        # Import SuSFS Version and Commit Information
        SUSFSCOMMIT: ${{ inputs.SUSFSCOMMIT }}
        SUSFSVERSION: ${{ inputs.SUSFSVERSION }}
      # Enable Strict Error Handling
      run: |
        set -euo pipefail
        # Clone AnyKernel3 Branch
        echo "└─ 📂 Cloning AnyKernel3 Master Branch..."
        git clone --depth=1 --branch master01-1 --single-branch \
          https://github.com/AndreiMikh/AnyKernel3.git \
          "${WORKSPACEDIR}/AnyKernel3"
        # Path to AnyKernel3 Folder
        ANYKERNEL="${WORKSPACEDIR}/AnyKernel3"
        # Confirm AnyKernel3 Branch
        # Enter Cloned Repository and Display Currently Checked-Out Branch
        cd "$ANYKERNEL"
        echo "└─ 🌿 AnyKernel3 Branch    : $(git branch --show-current)"
        # Configure AnyKernel3 Kernel Name
        # Display Resolved Root Engine Configuration and SuSFS Information
        echo "└─ 🔧 Configuring AnyKernel3 Kernel Name..."
        echo "└─ 🔍 Root Engine Version  : ${KSUVERSION:-Unknown}"
        echo "└─ 🔍 Manager Tag          : ${MANAGERTAG:-Unknown}"
        echo "└─ 🔍 SuSFS Version        : ${SUSFSVERSION:-Unknown}"
        echo "└─ 🔍 SuSFS Commit         : ${SUSFSCOMMIT:-Unknown}"
        # Build Kernel Identification String
        KERNELNAME="Root Configuration : ${ROOTENGINE} ${MANAGERTAG} (${KSUVERSION}) | Device : ${FILE} | SuSFS Version : ${SUSFSVERSION:-Unknown} | SuSFS Commit : ${SUSFSCOMMIT:-Unknown} | Kernel Base : ${KERNELVERSION}.${SUBLEVEL} | Built by Andrei"
        # Update Kernel String Only When Setting Already Exists in AnyKernel Script
        if grep -q '^kernel.string=' "$ANYKERNEL/anykernel.sh"; then
          sed -i \
            "s#^kernel.string=.*#kernel.string=${KERNELNAME}#" \
            "$ANYKERNEL/anykernel.sh"
          echo "└─ 🏷️ Kernel Name : ${KERNELNAME}"
        else
          echo "└─ ⚠️ Kernel String Setting Not Found, Skipping..."
        fi

        # Valid Kernel Output Path
        # Point to Compiled ARM64 Kernel Image Generated by Build Process
        IMAGEPATH="${OUTDIR}/arch/arm64/boot/Image"
        echo "└─ 🔎 Checking Kernel Image..."
        # Validate Kernel Image Exists
        # Stop Packaging if Expected Compiled Image is Missing
        if [[ ! -f "${IMAGEPATH}" ]]; then
          echo "└─ ⚠️ Kernel Image Not Found!"
          echo "└─ 🧾 Expected Path :"
          echo "${IMAGEPATH}"
          exit 1
        fi

        # Display Compiled Kernel Image Information
        # Show Resolved Path, Human-Readable Size and Exact Byte Count
        echo "└─ 📌 Kernel Image Found :"
        realpath "${IMAGEPATH}"
        echo "└─ 📦 Image Size :"
        ls -lh "${IMAGEPATH}"
        echo "└─ 📊 Bytes :"
        stat -c%s "${IMAGEPATH}"
        # Final Artifact
        # Copy Compiled Image Into AnyKernel3 as Primary Kernel Image
        echo "└─ 📦 Copying to AnyKernel3..."
        cp -f "${IMAGEPATH}" "${ANYKERNEL}/Image"
        # Report Successful AnyKernel3 Packaging
        echo "└─ 🎉 AnyKernel3 Packaging Completed Successfully"

    # Configure and Apply Selected KernelPatch Variant
    # Operates Directly on Image Already Copied Into AnyKernel3
    - name: 🧩 KernelPatch Configuration
      # Run KernelPatch-Next Only When KPN is Selected
      if: ${{ inputs.KERNELPATCH == 'KPN' }}
      shell: bash
      env:
        # Pass Composite Action Inputs and Import Paths to Shell Environment
        KERNELPATCH: ${{ inputs.KERNELPATCH }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        WORKSPACEDIR: ${{ env.WORKSPACEDIR }}
        WORKDIR: ${{ env.WORKDIR }}
        GITHUB_REF_NAME: ${{ inputs.GITHUB_REF_NAME }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        # Define Kernel Image and AnyKernel3 Paths
        # KernelPatch-Next Modifies Packaged Image Directly
        ANYKERNEL="${WORKSPACEDIR}/AnyKernel3"
        IMAGE="${ANYKERNEL}/Image"
        # Define Temporary KernelPatch-Next Tool Paths
        KPTTOOLS="${WORKDIR}/kptools-linux"
        KPIMG="${WORKDIR}/kpimg-linux"
        KPOUTPUT="${WORKDIR}/oImage"
        # Cleanup Temporary KernelPatch Tools and Generated Files
        cleanup() {
          local STATUS=$?
          trap - EXIT
          rm -f -- \
            "$KPTTOOLS" \
            "$KPIMG" \
            "$KPOUTPUT" \
            "${ANYKERNEL}/Image.sha256" \
            "${ANYKERNEL}/oImage" || true
          return "$STATUS"
        }
        trap cleanup EXIT
        # Display KernelPatch Configuration
        echo "------------------------------"
        echo "└─ 🧩 KernelPatch Configuration"
        echo "└─ KernelPatch  : ${KERNELPATCH}"
        echo "└─ Root Engine  : ${ROOTENGINE}"
        echo "------------------------------"
        # Validate Required Environment Paths
        # Ensure Both Workspace and Kernel Working Directory are Available
        [[ -n "$WORKSPACEDIR" && -n "$WORKDIR" ]] || {
          echo "└─ ⚠️ Required Environment Path Is Empty"
          exit 1
        }
        # Validate AnyKernel3 Directory
        # Confirm Packaging Step Created Expected Directory
        [[ -d "$ANYKERNEL" ]] || {
          echo "└─ ⚠️ AnyKernel3 Directory Not Found : $ANYKERNEL"
          exit 1
        }
        # Validate Kernel Image Exists and is Not Empty
        # Prevent KernelPatch From Running Against a Missing or Empty Image
        [[ -s "$IMAGE" ]] || {
          echo "└─ ⚠️ Kernel Image Not Found : $IMAGE"
          exit 1
        }
        # Enter Kernel Image Output Directory
        cd "$ANYKERNEL"
        # Display Original Kernel Image Information
        echo "└─ 📌 Kernel Image : $IMAGE"
        ls -lh Image
        # Save Original Kernel Image Checksum For Modification Verification
        # Checksum is Retained to Determine Whether Patch Changed Image
        echo "└─ 🔐 Creating Original Image Checksum..."
        sha256sum Image > Image.sha256
        # KernelSU-Next KernelPatch-Next (KPN)
        # KernelPatch-Next Downloads its Tools From Official Release, with a Repository Fallback
        echo "└─ 🧩 Using KernelSU-Next KernelPatch-Next"
        # Define KernelSU-Next KernelPatch-Next Repository and Fallback Download URL
        KPREPO="KernelSU-Next/KPatch-Next"
        KPFALLBACK="https://raw.githubusercontent.com/AndreiMikh/AndreiMikh-Kernel-Lab/refs/heads/${GITHUB_REF_NAME}/patches/KPN"
        # Resolve Latest KernelSU-Next KernelPatch-Next Release
        # Query GitHub Latest-Release API and Extract its Tag Name
        echo "└─ 🌐 Resolving Latest KernelPatch-Next Release..."
        TAG="$(
          curl -fsSL \
            -H "User-Agent: Mozilla/5.0" \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            "https://api.github.com/repos/${KPREPO}/releases/latest" \
          | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' \
          || true
        )"
        # Attempt to Resolve Latest Release From Releases List if Latest Endpoint Fails
        # Provides a Secondary API Lookup When Latest-Release Endpoint is Unavailable
        if [[ -z "$TAG" || "$TAG" == "null" ]]; then
          echo "└─ ⚠️ Latest Release Lookup Failed"
          echo "└─ 🔄 Falling Back to Releases List..."
          TAG="$(
            curl -fsSL \
              -H "User-Agent: Mozilla/5.0" \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              "https://api.github.com/repos/${KPREPO}/releases" \
            | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' \
            || true
          )"
        fi

        # Use Built-in KernelPatch-Next Release Version if Both Release Lookups Fail
        # Hardcoded Fallback Keeps Workflow Usable if Both API Requests Fail
        if [[ -z "$TAG" || "$TAG" == "null" ]]; then
          echo "└─ ⚠️ Unable to Determine Latest Release"
          echo "└─ 📦 Using Built-in Fallback: 0.13.5-2"
          TAG="0.13.5-2"
        fi

        # Construct KernelPatch-Next Release Download URL
        BASEKPNURL="https://github.com/${KPREPO}/releases/download/${TAG}"
        # Display Resolved KernelPatch-Next Release Information
        echo "└─ 📦 Release Information"
        echo "└─ Repository : ${KPREPO}"
        echo "└─ Tag        : ${TAG}"
        # Download KernelSU-Next KernelPatch-Next Files with Primary and Fallback Sources
        # Helper First Attempts Official Release URL and then Configured Fallback
        download() {
          local FILE="$1"
          local PRIMARY="${BASEKPNURL}/${FILE}"
          local FALLBACK="${KPFALLBACK}/${FILE}"
          local DEST="${WORKDIR}/${FILE}"
          # Attempt to Download File From Official Release
          echo "└─ 📥 Downloading ${FILE}"
          if ! curl -fsSL \
            -H "User-Agent: Mozilla/5.0" \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -o "$DEST" \
            "$PRIMARY"
          then
            # Attempt Fallback Download if Official Release Download Fails
            echo "└─ ⚠️ Primary Download Failed"
            echo "└─ 🔄 Trying Fallback..."
            curl -fsSL \
              -H "User-Agent: Mozilla/5.0" \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              -o "$DEST" \
              "$FALLBACK"
          fi

          # Validate Downloaded File Exists and is Not Empty
          # Prevent Execution of an Incomplete or Missing Download
          [[ -s "$DEST" ]] || {
            echo "└─ ⚠️ ${FILE} Download Failed"
            exit 1
          }
          # Grant Execution Permission to Downloaded KernelPatch-Next Tool
          chmod +x "$DEST"
          echo "└─ 📥 ${FILE} Ready"
        }
        # Download KernelSU-Next KernelPatch-Next Tools
        # Both Patching Utility and KernelPatch Image are Required by KernelPatch-Next
        download "kptools-linux"
        download "kpimg-linux"
        # Apply KernelPatch-Next to Original Kernel Image
        # Generate Output Image Using Downloaded KernelPatch-Next Tools and Packaged Image
        echo "└─ ⚙️ Applying KernelPatch-Next..."
        "$KPTTOOLS" \
          -p \
          -i "$IMAGE" \
          -k "$KPIMG" \
          -o "$KPOUTPUT"
        # Validate KernelPatch-Next Generated a Patched Image
        # Ensure Output Exists and Contains Data Before Replacing Image
        [[ -s "$KPOUTPUT" ]] || {
          echo "└─ ⚠️ KernelPatch Failed"
          exit 1
        }
        # Replace Original Kernel Image with Patched Image
        mv -f "$KPOUTPUT" "$IMAGE"
        # Compare Patched Image Against Original Checksum
        # Report Whether KernelPatch-Next Changed Original Kernel Image
        echo "└─ 🔍 Verifying Patched Image..."
        if sha256sum -c Image.sha256 >/dev/null 2>&1; then
          echo "└─ ⚠️ Image Checksum is Unchanged"
          echo "└─ ⚠️ KernelPatch may Not have been Applied"
        else
          echo "└─ 🎉 Kernel Image Successfully Modified"
        fi

        # Report Successful KernelSU-Next KernelPatch-Next Configuration
        echo "└─ 🎉 KernelSU-Next KernelPatch-Next Completed"
        # Report Completed KernelPatch Configuration
        # Final Packaged Image Now Contains Selected KernelPatch Modification
        echo "------------------------------"
        echo "└─ 🎉 KernelPatch Configuration Completed"
        echo "└─ 📦 AnyKernel3 Image Ready : ${IMAGE}"
        echo "------------------------------"
