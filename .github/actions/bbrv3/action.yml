# BBRv3 TCP Congestion Control
name: 🌐 TCP Congestion Control BBRv3
description: Apply BBRv3 Backport, Debug FS Tunables and SYSCTL Compatibility Patches
# Composite Action Configuration
runs:
  using: composite
  steps:
    # Apply BBRv3 and Required Compatibility Patches
    - name: 🌐 Apply BBRv3 Patches
      shell: bash
      # Export Composite Action Inputs as Environment Variables
      env:
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
        ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
        KERNELVERSION: ${{ env.KERNELVERSION }}
        REJECTCHECKER: ${{ env.REJECTCHECKER }}
      run: |
        # Enable Strict Bash Error Handling
        set -Eeuo pipefail
        # Define BBRv3 Patch Directory
        BBRDIR="${PATCHDIR}/BBRV3"
        # Select Main BBRv3 Patch For Target Android and Kernel Versions
        BBRPATCH="${BBRDIR}/bbrv3-${ANDROIDVERSION}-${KERNELVERSION}.patch"
        # Define Android 16 / Kernel 6.12 Debug FS and Tunables Patch
        DEBUGFSPATCH="${BBRDIR}/bbrv3-adddebugfs-diagruntimetunables.patch"
        # Display BBRv3 Configuration
        echo "└─ 🚀 Applying BBRv3..."
        echo "└─ 📂 BBRv3 Patch Directory  : ${BBRDIR}"
        echo "└─ 📱 Android Version        : ${ANDROIDVERSION}"
        echo "└─ 🐧 Kernel Version         : ${KERNELVERSION}"
        echo "└─ ⚙️ BBRv3 Patch            : $(basename "${BBRPATCH}")"
        echo "└─ 🔧 Debug FS Patch         : $(basename "${DEBUGFSPATCH}")"
        # 🔎 Validate BBRv3 Patch Directory
        if [[ ! -d "${BBRDIR}" ]]; then
          echo "└─ ⚠️ BBRv3 Patch Directory Not Found : ${BBRDIR}"
          exit 1
        fi

        # 🔎 Validate Main BBRv3 Backport Patch
        if [[ ! -f "${BBRPATCH}" ]]; then
          echo "└─ ⚠️ BBRv3 Patch Not Found for ${ANDROIDVERSION}-${KERNELVERSION}"
          echo "└─ 📄 Expected                : ${BBRPATCH}"
          echo "└─ 📋 Available BBRv3 Patches :"
          find "${BBRDIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.patch" \
            -print | sort
          exit 1
        fi

        # 📁 Navigate to Kernel Common Source Directory
        cd "$COMMONKERNELFOLDER"
        # 📊 Initialize Overall Patch Status
        # Preserve the First Failure While Continuing Other Patch Checks
        patchstatus=0
        # 🩹 Apply the Main BBRv3 Backport Patch
        echo "└─ ⚙️ Applying BBRv3 Main Patch..."
        if patch -p1 < "${BBRPATCH}"; then
          echo "└─ 🚀 Main BBRv3 Patch Applied Successfully"
        else
          patchstatus=$?
          echo "└─ ⚠️ BBRv3 Main Patch Failed with Status ${patchstatus}"
        fi

        # Apply Additional Debug FS and Runtime Tunables
        # This Patch is Required Only For Android 16 / Kernel 6.12
        if [[ "$ANDROIDVERSION" == "android16" && "$KERNELVERSION" == "6.12" ]]; then
          # Validate the Required DebugFS / Tunables Patch
          if [[ ! -f "${DEBUGFSPATCH}" ]]; then
            echo "└─ ⚠️ Required BBRv3 Debug FS / Tunables Patch Not Found"
            echo "└─ 📄 Expected : ${DEBUGFSPATCH}"
            # Preserve First Failure Status
            if [[ "$patchstatus" -eq 0 ]]; then
              patchstatus=1
            fi

          else
            # Apply Android 16 / Kernel 6.12 Additional Patch
            echo "└─ ⚙️ Applying Android 16 / Kernel 6.12 Debug FS / Tunables Patch..."
            echo "└─ 📄 Patch: $(basename "${DEBUGFSPATCH}")"
            if patch -p1 < "${DEBUGFSPATCH}"; then
              echo "└─ 🚀 BBRv3 DebugFS / Tunables Patch Applied Successfully"
            else
              debugfsstatus=$?
              echo "└─ ⚠️ BBRv3 Debug FS / Tunables Patch Failed with Status ${debugfsstatus}"
              # Preserve First Failure Status
              if [[ "$patchstatus" -eq 0 ]]; then
                patchstatus="$debugfsstatus"
              fi
            fi
          fi

        else
          # Skip DebugFS / Tunables for Other Kernel Versions
          echo "└─ ☘️ DebugFS / Tunables Patch Not Required For ${ANDROIDVERSION}-${KERNELVERSION}"
        fi

        # 🔎 Check Whether Proc-Dou8vec-Minmax() Exists
        # Apply SYSCTL Compatibility Patches Only When the Function Is Missing
        if ! grep -qE 'proc_dou8vec_minmax[[:space:]]*\(' include/linux/sysctl.h; then
          echo "└─ ⚠️ Proc-Dou8vec-Minmax() is Missing"
          echo "└─ 🩹 Applying Required SYSCTL Compatibility Patches..."
          # Define Required SYSCTL Compatibility Patches
          COMPATPATCHES=(
            "sysctl-addprocdou8vec-minmax-pre-5-13.patch"
            "sysctl-fixdataracesproc-dou8vec-minmax-pre-5-13.patch"
          )
          # Apply Each Required Compatibility Patch
          for COMPATPATCH in "${COMPATPATCHES[@]}"; do
            # Resolve Compatibility Patch Location
            COMPATFILE="${BBRDIR}/${COMPATPATCH}"
            # Validate Required Compatibility Patch
            if [[ ! -f "${COMPATFILE}" ]]; then
              echo "└─ ⚠️ Required Compatibility Patch Not Found:"
              echo "└─ 📄 ${COMPATFILE}"
              # Preserve First Failure Status
              if [[ "$patchstatus" -eq 0 ]]; then
                patchstatus=1
              fi
              
              # Continue Checking Remaining Compatibility Patches
              continue
            fi

            # Apply SYSCTL Compatibility Patch
            echo "└─ ⚙️ Applying Compatibility Patch: ${COMPATPATCH}"
            if patch -p1 < "${COMPATFILE}"; then
              echo "└─ 🚀 Applied ${COMPATPATCH}"
            else
              compatstatus=$?
              echo "└─ ⚠️ Failed to Apply ${COMPATPATCH} (Status ${compatstatus})"
              # Preserve the First Failure Status
              if [[ "$patchstatus" -eq 0 ]]; then
                patchstatus="$compatstatus"
              fi
            fi

          done

        else
          # Skip Compatibility Patches When the Function Already Exists
          echo "└─ ℹ️ Proc-Dou8vec-Minmax() Already Exists"
          echo "└─ ☘️ Skipping SYSCTL Compatibility Patches"
        fi

        # Validate Shared Patch Rejection Checker
        echo "└─ 🔎 Running Reject Checker..."
        if [[ ! -f "${REJECTCHECKER}" ]]; then
          echo "└─ ⚠️ Reject Checker Not Found : ${REJECTCHECKER}"
          exit 1
        fi

        # Load Shared Reject Checker
        source "${REJECTCHECKER}"
        # Check for Rejected Patch Hunks
        checkrejects .
        # Evaluate Final Patch Application Status
        if [[ "$patchstatus" -ne 0 ]]; then
          echo "└─ ⚠️ BBRv3 Patch Application Failed"
          echo "└─ 📱 Android     : ${ANDROIDVERSION}"
          echo "└─ 🐧 Kernel      : ${KERNELVERSION}"
          echo "└─ ⚠️ Exit Status : ${patchstatus}"
          exit "$patchstatus"
        fi

        # Report Successful BBRv3 Patch Application
        echo "└─ 🎉 BBRv3 Patches Applied Successfully"
