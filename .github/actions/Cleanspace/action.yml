name: Optimize Build Storage
description: "Free-up GitHub Actions Runner Disk Space by Removing Unnecessary Software"
# Define Configurable Cleanup Inputs
inputs:
  cleanspace:
    description: "Enable or Disable Storage Cleanup / Optimization"
    required: false
    default: "Disabled"
  remove-dotnet:
    description: "Remove .NET SDK"
    required: false
    default: "true"
  remove-android:
    description: "Remove Android SDK"
    required: false
    default: "true"
  remove-haskell:
    description: "Remove Haskell"
    required: false
    default: "true"
  remove-codeql:
    description: "Remove CodeQL"
    required: false
    default: "true"
  remove-docker-images:
    description: "Remove Unused Docker Images"
    required: false
    default: "false"
  debug:
    description: "Display Detailed Cleanup Logs"
    required: false
    default: "true"
# Configure Composite Action Execution
runs:
  using: composite
  steps:
    - name: 🧹 Optimize Build Storage
      # Run Cleanup Only When CLEANSPACE is Enabled
      if: ${{ inputs.cleanspace == 'Enabled' }}
      shell: bash
      # Export Cleanup Inputs as Environment Variables
      env:
        REMOVEDOTNET: ${{ inputs.remove-dotnet }}
        REMOVEANDROID: ${{ inputs.remove-android }}
        REMOVEHASKELL: ${{ inputs.remove-haskell }}
        REMOVECODEQL: ${{ inputs.remove-codeql }}
        REMOVEDOCKERIMAGES: ${{ inputs.remove-docker-images }}
        DEBUG: ${{ inputs.debug }}

      run: |
        # Enable Strict Error Handling
        set -Eeuo pipefail
        # Initialize Cleanup Timer
        STARTTIME=$(date +%s%3N)
        # Configure Maximum Parallel Cleanup Workers
        MAXWORKERS=4
        # Initialize Cleanup Statistics
        CLEANUPPIDS=()
        CLEANUPFAILED=0
        REMOVEDCOUNT=0
        # Display Initial Disk Usage
        echo "└─ 🧹 Optimizing Build Storage..."
        echo "└─ ⚙️ Parallel Workers : ${MAXWORKERS}"
        echo "└─ 📊 Disk Usage Before Cleanup :"
        df -h /
        # Initialize Cleanup Paths
        CLEANUPPATHS=()
        # Add Optional Software Cleanup Paths
        [[ "${REMOVEDOTNET}" == "true" ]] && CLEANUPPATHS+=(/usr/share/dotnet)
        [[ "${REMOVEANDROID}" == "true" ]] && CLEANUPPATHS+=(/usr/local/lib/android)
        [[ "${REMOVEHASKELL}" == "true" ]] && CLEANUPPATHS+=(/opt/ghc)
        [[ "${REMOVECODEQL}" == "true" ]] && CLEANUPPATHS+=(/opt/hostedtoolcache/CodeQL)
        # Add Additional Unnecessary Software Paths
        CLEANUPPATHS+=(
          /usr/local/aws-sam-cli
          /usr/local/share/powershell
          /usr/local/lib/heroku
          /opt/az
          /opt/microsoft/powershell
          /usr/local/bin/pulumi*
        )
        # Enable Safe Wildcard Expansion
        shopt -s nullglob
        # Track Individual Cleanup Durations
        declare -A CLEANUPSTART=()
        # Wait for Completed Cleanup Processes
        waitforcleanup() {
          local PID="${CLEANUPPIDS[0]}"
          local PATHNAME="${CLEANUPSTART[${PID}]}"
          if wait "${PID}"; then
            if [[ "${DEBUG}" == "true" ]]; then
              echo "└─ 📌 Removed : ${PATHNAME}"
            fi
          else
            echo "└─ ⚠️ Cleanup Failed : ${PATHNAME}"
            CLEANUPFAILED=1
          fi

          unset 'CLEANUPSTART[$PID]'
          CLEANUPPIDS=("${CLEANUPPIDS[@]:1}")
        }
        # Start Parallel Directory Cleanup
        for CLEANUPPATH in "${CLEANUPPATHS[@]}"; do
          # Skip Missing Cleanup Paths
          if [[ ! -e "${CLEANUPPATH}" && ! -L "${CLEANUPPATH}" ]]; then
            continue
          fi

          # Display Removal Targets When Debugging Is Enabled
          if [[ "${DEBUG}" == "true" ]]; then
            echo "└─ 🗑️ Removing : ${CLEANUPPATH}"
          fi

          # Start Timed Directory Removal
          (
            sudo rm -rf -- "${CLEANUPPATH}"
          ) &
          CLEANUPPID=$!
          CLEANUPPIDS+=("${CLEANUPPID}")
          CLEANUPSTART["${CLEANUPPID}"]="${CLEANUPPATH}"
          ((REMOVEDCOUNT+=1))
          # Limit Simultaneous Cleanup Processes
          if (( ${#CLEANUPPIDS[@]} >= MAXWORKERS )); then
            waitforcleanup
          fi

        done

        # Wait For Remaining Cleanup Processes
        while (( ${#CLEANUPPIDS[@]} > 0 )); do
          waitforcleanup
          
        done

        # Report Cleanup Results
        echo "└─ 🗑️ Cleanup Targets Processed : ${REMOVEDCOUNT}"
        # Optionally Remove Unused Docker Images
        if [[ "${REMOVEDOCKERIMAGES}" == "true" ]] &&
           command -v docker >/dev/null 2>&1; then
          echo "└─ 🐳 Removing Unused Docker Images..."
          if ! sudo docker image prune --all --force; then
            echo "└─ ⚠️ Docker Cleanup Failed"
            CLEANUPFAILED=1
          fi
        fi

        # Clean Downloaded APT Package Archives
        echo "└─ 🧹 Cleaning APT Cache..."
        if ! sudo apt-get clean; then
          echo "└─ ⚠️ APT Cache Cleanup Failed"
          CLEANUPFAILED=1
        fi

        # Calculate Cleanup Duration
        ENDTIME=$(date +%s%3N)
        ELAPSED=$((ENDTIME - STARTTIME))
        # Display Final Disk Usage
        echo "└─ 📊 Disk Usage After Cleanup :"
        df -h /
        # Display Cleanup Statistics
        echo "└─ ⚙️ Parallel Workers  : ${MAXWORKERS}"
        echo "└─ 🗑️ Targets Processed : ${REMOVEDCOUNT}"
        echo "└─ ⏱️ Cleanup Duration  : $((ELAPSED / 1000)).$((ELAPSED % 1000))s"
        # Report Cleanup Results
        if (( CLEANUPFAILED != 0 )); then
          echo "└─ ⚠️ Storage Optimization Completed with Warnings"
        else
          echo "└─ 🎉 Build Storage Optimization Complete"
        fi
