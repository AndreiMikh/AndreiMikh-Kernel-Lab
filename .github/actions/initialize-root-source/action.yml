name: Configure Root Engine
description: Configure and Verify Selected Root Source Engine
inputs:
  github-token:
    description: GitHub Token
    required: true
  kernelplatform:
    description: Kernel Platform Directory
    required: true
  rootengine:
    description: Selected Root Source
    required: true
  rootcommit:
    description: Full Root Source Commit SHA
    required: true
  rootcommitshort:
    description: Short Root Source Commit SHA
    required: true
  ksurepo:
    description: Root Source Repository
    required: true
  managerbranch:
    description: Manager Branch
    required: true
  branchpath:
    description: Setup Argument or Branch Path
    required: true
  ksuversion:
    description: Resolved Root Source Version
    required: true
  managertag:
    description: Resolved Manager Tag
    required: true
  susfs:
    description: SUSFS repository selection
    required: true
  defconfig:
    description: Kernel Default Configuration Path
    required: true
outputs:
  ksuversion:
    description: Configured Root Source Version
    value: ${{ steps.rootengine.outputs.ksuversion }}
  managertag:
    description: Configured Manager Tag
    value: ${{ steps.rootengine.outputs.managertag }}
runs:
  using: composite
  steps:
    - name: ⚙️ Configure Root Engine
      id: rootengine
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        KERNELPLATFORM: ${{ inputs.kernelplatform }}
        ROOTENGINE: ${{ inputs.rootengine }}
        ROOTCOMMIT: ${{ inputs.rootcommit }}
        ROOTCOMMITSHORT: ${{ inputs.rootcommitshort }}
        KSUREPO: ${{ inputs.ksurepo }}
        MANAGERBRANCH: ${{ inputs.managerbranch }}
        BRANCHPATH: ${{ inputs.branchpath }}
        KSUVERSION: ${{ inputs.ksuversion }}
        MANAGERTAG: ${{ inputs.managertag }}
        SUSFS: ${{ inputs.susfs }}
        DEFCONFIG: ${{ inputs.defconfig }}
      run: |
        set -Eeuo pipefail
        cd "$KERNELPLATFORM"
        # Validate Resolved Root Engine Metadata
        if [[ -z "$KSUVERSION" || -z "$MANAGERTAG" ]]; then
          echo "└─ ⚠️ [Error] Root Engine Metadata Was Not Resolved"
          exit 1
        fi

        if [[ ! "$ROOTCOMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo "└─ ⚠️ [Error] Invalid Full Root Engine Commit: $ROOTCOMMIT"
          echo "└─ Ensure prepare exports rootcommitfull"
          exit 1
        fi

        echo "------------------------------"
        echo "└─ 🔎 [Info] Resolved Root Engine Metadata"
        echo "└─ 📦 [Info] Engine           : $ROOTENGINE"
        echo "└─ 🏷️ [Info] Manager Tag      : $MANAGERTAG"
        echo "└─ 🔢 [Info] KSU Version      : $KSUVERSION"
        echo "└─ 🔖 [Info] Requested Commit : ${ROOTCOMMITSHORT:-${ROOTCOMMIT:0:7}}"
        echo "└─ 🔖 [Info] Full Commit      : $ROOTCOMMIT"
        echo "------------------------------"
        # Download and Execute Root Engine Setup Script From Exact Commit
        setupengine() {
          local repo="${1:?Missing Repository}"
          local branch="${2:?Missing Branch}"
          local argument="${3-}"
          local commit="${4:-}"
          local sourcedir="${RUNNER_TEMP:-/tmp}/RootSource-${ROOTENGINE:-Unknown}"
          local setupscript="$sourcedir/setup.sh"
          # Validate Requested Full Commit Hash
          if [[ ! "$commit" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "└─ ⚠️ [Error] Invalid Setup Commit: ${commit:-Missing}"
            return 1
          fi

          echo "└─ 🔗 [Info] Setup Repository : $repo"
          echo "└─ 🌿 [Info] Setup Branch     : $branch"
          echo "└─ 📌 [Info] Setup Argument   : ${argument:-None}"
          echo "└─ 🔖 [Info] Setup Commit     : $commit"
          # Prepare Clean Setup Directory
          rm -rf "$sourcedir"
          mkdir -p "$sourcedir"
          # Download Setup Script From Exact Commit
          echo "└─ 📥 [Info] Downloading Setup Script..."
          if ! curl -fsSL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${repo}/${commit}/kernel/setup.sh" \
            -o "$setupscript"; then
            echo "└─ ⚠️ [Error] Failed to Download Setup Script"
            echo "└─ [Info] Repository : $repo"
            echo "└─ [Info] Commit     : $commit"
            return 1
          fi

          # Reject Missing or Empty Setup Scripts
          if [[ ! -s "$setupscript" ]]; then
            echo "└─ ⚠️ [Error] Downloaded Setup Script Is Empty"
            return 1
          fi

          echo "└─ 🚀 Executing Setup Script..."
          # Preserve Original Setup Script Argument Behavior
          if [[ -n "$argument" ]]; then
            bash "$setupscript" "$argument"
          else
            bash "$setupscript"
          fi
        }
        # Verify and Install Exact Root Engine Commit
        checkoutrootcommit() {
          local dir="$1"
          local commit="$2"
          local branch="$3"
          local actual=""
          local archive=""
          # Validate Root Engine Source Directory
          if [[ ! -d "$dir" ]]; then
            echo "└─ ⚠️ [Error] Root Engine Directory Not Found: $dir"
            return 1
          fi

          # Validate Requested Full Commit Hash
          if [[ ! "$commit" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "└─ ⚠️ [Error] Invalid Requested Commit : $commit"
            return 1
          fi

          echo "└─ 🔎 [Info] Verifying Root Engine Commit..."
          echo "└─ 📂 [Info] Directory  : $dir"
          echo "└─ 📦 [Info] Repository : $KSUREPO"
          echo "└─ 🌿 [Info] Branch     : $branch"
          echo "└─ 🔖 [Info] Requested  : $commit"
          # Verify Requested Commit Against the GitHub API
          actual="$(
            curl -fsSL --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${KSUREPO}/commits/${commit}" \
              | jq -r '.sha // empty'
          )" || {
            echo "└─ ⚠️ [Error] Failed to Verify Remote Commit"
            return 1
          }
          # Reject Any Commit That Does Not Match Requested Hash
          if [[ "${actual,,}" != "${commit,,}" ]]; then
            echo "└─ ⚠️ [Error] Remote Commit Verification Failed"
            echo "└─ [Info] Requested : $commit"
            echo "└─ [Info] Actual    : ${actual:-Not Found}"
            return 1
          fi

          # Download Verified Commit as Source Archive
          archive="https://api.github.com/repos/${KSUREPO}/tarball/${commit}"
          echo "└─ 📥 [Info] Downloading Exact Root Engine Commit..."
          local tempdir
          tempdir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$archive" \
            -o "$tempdir/source.tar.gz" || {
              echo "└─ ⚠️ [Error] Failed to Download Requested Commit"
              rm -rf "$tempdir"
              return 1
            }
          # Extract Source Archive Without Its Top-Level Directory
          echo "└─ 📦 [Info] Extracting Requested Source..."
          mkdir -p "$tempdir/extracted"
          tar -xzf "$tempdir/source.tar.gz" \
            -C "$tempdir/extracted" \
            --strip-components=1 || {
              echo "└─ ⚠️ [Error] Failed to Extract Requested Source"
              rm -rf "$tempdir"
              return 1
            }
          # Validate Extracted Root Engine Source Layout
          if [[ ! -f "$tempdir/extracted/Kbuild" && \
                ! -f "$tempdir/extracted/kernel/Kbuild" ]]; then
            echo "└─ ⚠️ [Error] Downloaded Source Does Not Match Expected Layout"
            rm -rf "$tempdir"
            return 1
          fi

          # Replace Existing Source While Preserving Git Directory
          echo "└─ 🔄 [Info] Replacing Root Engine Source..."
          find "$dir" -mindepth 1 -maxdepth 1 \
            ! -name ".git" -exec rm -rf -- {} + || {
              echo "└─ ⚠️ [Error] Failed to Clean Existing Source"
              rm -rf "$tempdir"
              return 1
            }
          # Install Verified Source Into Existing Directory
          cp -a "$tempdir/extracted/." "$dir/" || {
            echo "└─ ⚠️ [Error] Failed to Install Requested Source"
            rm -rf "$tempdir"
            return 1
          }
          # Validate Installed Root Engine Source
          if [[ ! -f "$dir/Kbuild" && ! -f "$dir/kernel/Kbuild" ]]; then
            echo "└─ ⚠️ [Error] Installed Root Engine Source Is Invalid"
            rm -rf "$tempdir"
            return 1
          fi

          # Remove Temporary Download and Extraction Files
          rm -rf "$tempdir"
          echo "└─ ✔️ [Info] Remote Commit Verified : $actual"
          echo "└─ ✔️ [Info] Exact Source Installed : $commit"
        }
        # Record Root Engine Version and Export Build Metadata
        recordrootversion() {
          local GITCOMMITHASH="${ROOTCOMMIT:0:7}"
          echo "└─ 🔖 [Info] Current Commit : $GITCOMMITHASH"
          echo "└─ 🏷️ [Info] Manager Tag    : $MANAGERTAG"
          echo "└─ 🔢 [Info] KSU Version    : $KSUVERSION"
          # Export Version Variables to Subsequent GitHub Actions Steps
          {
            echo "KSUVERSION=$KSUVERSION"
            echo "KSUVER=$KSUVERSION"
            echo "GITCOMMITHASH=$GITCOMMITHASH"
          } >> "$GITHUB_ENV"
        }
        # Configure KSU Version Fallback
        configureksuversionfallback() {
          if [[ -f kernel/Kbuild ]] &&
             grep -q '^KSU_VERSION_FALLBACK := ' kernel/Kbuild; then
            sed -i \
              "s/^KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := $KSUVERSION/" \
              kernel/Kbuild
            echo "└─ ✔️ [Info] KSU Version Fallback : $KSUVERSION"
          fi
        }
        # Configure Selected Root Engine
        case "$ROOTENGINE" in
          SukiSU-Ultra)
            echo "└─ 🚀 Setting Up SukiSU-Ultra..."
            setupengine "$KSUREPO" "$MANAGERBRANCH" "$BRANCHPATH" "$ROOTCOMMIT"
            cd KernelSU || {
              echo "└─ ⚠️ [Error] SukiSU-Ultra Directory Not Found"
              exit 1
            }
            recordrootversion
            configureksuversionfallback
            echo "└─ 🎉 SukiSU-Ultra Setup Complete"
            ;;
          BakaSU)
            echo "└─ 🚀 Setting Up ReSukiSU (BakaSU)..."
            setupengine "$KSUREPO" "$MANAGERBRANCH" "$MANAGERBRANCH" "$ROOTCOMMIT"
            cd KernelSU || {
              echo "└─ ⚠️ [Error] ReSukiSU Directory Not Found"
              exit 1
            }
            checkoutrootcommit "$PWD" "$ROOTCOMMIT" "$MANAGERBRANCH"
            recordrootversion
            configureksuversionfallback
            # Manager Version Format
            if [[ -n "${DEFCONFIG:-}" && -f "$DEFCONFIG" ]]; then
              sed -i '/^CONFIG_KSU_FULL_NAME_FORMAT=/d' "$DEFCONFIG"
              printf 'CONFIG_KSU_FULL_NAME_FORMAT="%%TAG_NAME%%"\n' >> "$DEFCONFIG"
            fi

            echo "└─ 🎉 ReSukiSU (BakaSU) Setup Complete"
            ;;
          KernelSU-Next)
            echo "└─ 🚀 Setting Up KernelSU-Next..."
            setupengine "$KSUREPO" "$BRANCHPATH" "$BRANCHPATH" "$ROOTCOMMIT"
            cd KernelSU-Next || {
              echo "└─ ⚠️ [Error] KernelSU-Next Directory Not Found"
              exit 1
            }
            checkoutrootcommit "$PWD" "$ROOTCOMMIT" "$MANAGERBRANCH"
            recordrootversion
            configureksuversionfallback
            # SUSFS Inline Hook Mode
            if [[ "$SUSFS" != "-1" ]] &&
               [[ -f kernel/supercall/dispatch.c ]]; then
              perl -0777 -i -pe '
                s/#ifdef CONFIG_HAVE_SYSCALL_TRACEPOINTS.*?#endif/
                strscpy(cmd.mode, "Inline", sizeof(cmd.mode));
                /s
              ' kernel/supercall/dispatch.c
              echo "└─ ✔️ SUSFS Hook Mode Set to Inline"
            fi

            echo "└─ 🎉 KernelSU-Next Setup Complete"
            ;;
          KernelSU)
            echo "└─ 🚀 Setting Up KernelSU..."
            setupengine "$KSUREPO" "$MANAGERBRANCH" "$MANAGERBRANCH" "$ROOTCOMMIT"
            cd KernelSU || {
              echo "└─ ⚠️ [Error] KernelSU Directory Not Found"
              exit 1
            }
            checkoutrootcommit "$PWD" "$ROOTCOMMIT" "$MANAGERBRANCH"
            recordrootversion
            configureksuversionfallback
            echo "└─ 🎉 KernelSU Setup Complete"
            ;;
          *)
            echo "└─ ⚠️ [Error] Unsupported Root Engine: $ROOTENGINE"
            exit 1
            ;;
        esac
        # Export Root Engine Outputs
        {
          echo "ksuversion=$KSUVERSION"
          echo "managertag=$MANAGERTAG"
        } >> "$GITHUB_OUTPUT"
        echo "------------------------------"
        echo "└─ 🎉 Root Engine Configuration Complete"
        echo "└─ 📦 Engine            : $ROOTENGINE"
        echo "└─ 📂 Setup Repository  : $KSUREPO"
        echo "└─ 🌿 Setup Branch      : $MANAGERBRANCH"
        echo "└─ 🔖 Requested Commit  : ${ROOTCOMMITSHORT:-${ROOTCOMMIT:0:7}}"
        echo "└─ 🔖 Full Commit SHA   : $ROOTCOMMIT"
        echo "└─ 🏷️ Manager Tag       : $MANAGERTAG"
        echo "└─ 🔢 KSU Version       : $KSUVERSION"
        echo "└─ 📁 Setup Argument    : ${BRANCHPATH:-None}"
        echo "------------------------------"
