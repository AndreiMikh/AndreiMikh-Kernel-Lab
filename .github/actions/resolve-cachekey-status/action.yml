name: 🗝️ Cache Key and Status
description: Display Compiler Cache Key and Restoration Status
inputs:
  FILE:
    required: true
    default: ""
  ROOTENGINE:
    required: true
    default: ""
  CPU:
    required: true
    default: ""
  LOCAL:
    required: false
    default: ""
  RELEASE:
    required: false
    default: ""
  CCACHE_DIR:
    required: true
    default: ""
  RUNNEROS:
    required: true
    default: ""
runs:
  using: composite
  steps:
    - name: 🗝️ Cache Key and Status
      shell: bash
      env:
        RUNNEROS: ${{ inputs.RUNNEROS }}
        FILE: ${{ inputs.FILE }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        CPU: ${{ inputs.CPU }}
        LOCAL: ${{ inputs.LOCAL }}
        RELEASE: ${{ inputs.RELEASE }}
        CCACHE_DIR: ${{ inputs.CCACHE_DIR }}
      run: |
        set -euo pipefail
        # Build Display Cache Key
        # Represents Logical Cache Identity Used by Workflow
        # Build Cache Keys
        LOCALCACHEKEY="CCache-${RUNNEROS}-${FILE}-${CPU}-${GITHUB_REF_NAME}"
        RELEASECACHEKEY="Cache-${FILE}-${ROOTENGINE}-${GITHUB_REF_NAME}"
        # Select Cache Key Based on Restoration Source
        if [[ "$LOCAL" == 'true' ]]; then
          CACHEKEY="$LOCALCACHEKEY"
          CACHESOURCE="Local"
        elif [[ "$RELEASE" == 'true' ]]; then
          CACHEKEY="$RELEASECACHEKEY"
          CACHESOURCE="Release"
        else
          CACHEKEY="$LOCALCACHEKEY"
          CACHESOURCE="None"
        fi

        # Check whether the cache directory contains data
        CACHEDATA=false
        if [[ -d "$CCACHE_DIR" ]] &&
          find "$CCACHE_DIR" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
          CACHEDATA=true
        fi
        
        # Read Cache Restoration Results
        # Local Cache = GitHub Actions Cache Restoration
        # Release Cache = Public Cache Release Restoration
        # Display Cache Restoration Information
        echo "└─ 🔑 Cache Key : $CACHEKEY"
        echo "└─ 🎯 Local Cache Hit   : ${LOCAL:-false}"
        echo "└─ 🎯 Release Cache Hit : ${RELEASE:-false}"
        # Write Cache Status to GitHub Actions Step Summary
        echo "### 🧠 Compiler Cache Status" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
        # Determine Highest-Confidence Cache Result
        # Priority:
        #   1. Exact GitHub Actions Cache Hit
        #   2. Exact Public Release Cache Hit
        #   3. Existing Cache Data Restored Through Restore-Key Fallback
        #   4. Completely Empty Cache (Cold Build)
        if [[ "$LOCAL" == 'true' ]]; then
          STATUS="✔️ Exact Cache Match Restored from Local (Fully Matched Cache Key with Identical Build Signature for Maximum Reuse Efficiency)"
          echo "└─ 🎉 Exact Cache Hit!"
        elif [[ "$RELEASE" == 'true' ]]; then
          STATUS="✔️ Exact Cache Match Restored from Release (Fully Matched Cache Key with Identical Build Signature for Maximum Reuse Efficiency)"
          echo "└─ 🎉 Exact Cache Hit!"
        elif [[ "$CACHEDATA" == "true" ]]; then
          STATUS="♻️ Partial Cache Restored (Fallback Cache Retrieved via Restore Keys — May Result in Lower but Still Effective Cache Hit Rate)"
          echo "└─ ♻️ Partial Cache Found via Restore Keys"
        else
          # Usable Cached Compiler Objects Were Restored
          # Kernel Build Will Therefore Start as a Cold Cache Build
          STATUS="⚠️ No Cache Available (Cold Build — All Compilation Requests Will Be Processed Without Any Cached Objects)"
          echo "└─ ⚠️ No Cache Found — Cold Build"
        fi

        # Add Final Cache Status to GitHub Actions Summary
        echo "| Cache | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
        # Display Final Cache Status in Workflow Log
        echo "└─ 📦 Final Cache Status:"
        echo "$STATUS"
