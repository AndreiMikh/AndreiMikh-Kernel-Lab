name: 📋 Kernel Build Details
description: Generate Post Kernel Build Details Summary
inputs:
  ROOTENGINE:
    required: false
    default: ""
  ANDROIDVERSION:
    required: false
    default: ""
  FULLVERSION:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
  BUILDTIME:
    required: false
    default: ""
  FILE:
    required: false
    default: ""
  SUSFSVARIANT:
    required: false
    default: ""
  SUSFSBRANCHDEV:
    required: false
    default: ""
  KERNELPATCH:
    required: false
    default: ""
  BUILDCCACHE:
    required: false
    default: ""
  LSMBBG:
    required: false
    default: ""
  NETFILTER:
    required: false
    default: ""
  TCPALGORITHM:
    required: false
    default: ""
  LXCDOCKERSUPPORT:
    required: false
    default: ""
  LZ4NEON:
    required: false
    default: ""
  WINDSPEED:
    required: false
    default: ""
  UNICODE:
    required: false
    default: ""
  CLEANSPACE:
    required: false
    default: ""
  XUS:
    required: false
    default: ""
  REKERNEL:
    required: false
    default: ""
  NTSYNC:
    required: false
    default: ""
  NOMOUNT:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: 📋 Kernel Build Details
      shell: bash
      env:
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        ANDROIDVERSION: ${{ inputs.ANDROIDVERSION }}
        FULLVERSION: ${{ inputs.FULLVERSION }}
        SUFFIX: ${{ inputs.SUFFIX }}
        BUILDTIME: ${{ inputs.BUILDTIME }}
        FILE: ${{ inputs.FILE }}
        SUSFSVARIANT: ${{ inputs.SUSFSVARIANT }}
        SUSFSBRANCHDEV: ${{ inputs.SUSFSBRANCHDEV }}
        KERNELPATCH: ${{ inputs.KERNELPATCH }}
        BUILDCCACHE: ${{ inputs.BUILDCCACHE }}
        LSMBBG: ${{ inputs.LSMBBG }}
        NETFILTER: ${{ inputs.NETFILTER }}
        TCPALGORITHM: ${{ inputs.TCPALGORITHM }}
        LXCDOCKERSUPPORT: ${{ inputs.LXCDOCKERSUPPORT }}
        LZ4NEON: ${{ inputs.LZ4NEON }}
        WINDSPEED: ${{ inputs.WINDSPEED }}
        UNICODE: ${{ inputs.UNICODE }}
        CLEANSPACE: ${{ inputs.CLEANSPACE }}
        XUS: ${{ inputs.XUS }}
        REKERNEL: ${{ inputs.REKERNEL }}
        NTSYNC: ${{ inputs.NTSYNC }}
        NOMOUNT: ${{ inputs.NOMOUNT }}
      run: |
        {
          echo "### 📊 Post Kernel Build Details"
          # Helper for Boolean Display(s)
          bool() { [[ "$1" == "true" ]] && echo "✔ Yes" || echo "✘ No"; }
          # Core Information
          echo "#### 🧩 Core Information"
          echo "| Category                                           | Reported Value                                  |"
          echo "|----------------------------------------------------|-------------------------------------------------|"
          echo "| └─ 🔐 Root / KSU Manager Variant                   | \`${ROOTENGINE}\`                               |"
          echo "| └─ 📱 Device Model                                 | \`${FILE}\`                         |"
          echo "| └─ 🔧 Kernel Version                               | \`${ANDROIDVERSION}-${FULLVERSION}\`            |"
          echo "| └─ 🏷️ Kernel Suffix                                | \`${SUFFIX:-Auto}\`                             |"
          echo "| └─ 🕒 Kernel Build Time                            | \`${BUILDTIME:-Auto}\`                          |"
          # Build Configuration
          echo "#### ⚙️ Build Configuration"
          echo "| Feature                                            | Reported Value                                   |"
          echo "|----------------------------------------------------|--------------------------------------------------|"
          echo "| └─ 📦 Manifest                                     | \`${FILE}\`                                      |"
          echo "| └─ 🧬 SUSFS Variant                                | \`${SUSFSVARIANT}\`                              |"
          echo "| └─ 🧪 SUSFS Development Branch                     | $(bool "${SUSFSBRANCHDEV}")                      |"
          echo "| └─ 🩹 Kernel Patch Variant                         | \`${KERNELPATCH}\`                               |"
          echo "| └─ 💾 Compiler Cache                               | \`${BUILDCCACHE}\`                               |"
          # System Features
          echo "#### 🧠 System Features"
          echo "| Feature                                            | Reported Value                                   |"
          echo "|----------------------------------------------------|--------------------------------------------------|"
          echo "| └─ 🔰 LSM (Linux Security Module) Baseband Guard   | $(bool "${LSMBBG}")                              |"
          echo "| └─ 📡 Netfilter IP Set; IP v6 NAT Fix              | $(bool "${NETFILTER}")                           |"
          echo "| └─ 🛜 TCP Congestion Control Algorithm             | \`${TCPALGORITHM}\`                              |"
          echo "| └─ 🧩 LXC (Linux Containers) Docker Support Variant| \`${LXCDOCKERSUPPORT}\`                          |"
          # Memory and Performance
          echo "#### 🧮 Memory and Performance"
          echo "| Feature                                            | Reported Value                                   |"
          echo "|----------------------------------------------------|--------------------------------------------------|"
          echo "| └─ ⚙️ LZ4 1.10.0                                   | \`${LZ4NEON}\`                                   |"
          echo "| └─ 🌪️ Hmbird / Windspeed Patch Scheduler           | $(bool "${WINDSPEED}")                           |"
          # Miscellaneous
          echo "#### 🧾 Miscellaneous"
          echo "| Feature                                            | Reported Value                                   |"
          echo "|----------------------------------------------------|--------------------------------------------------|"
          echo "| └─ 🔤 Unicode Bypass Patch                         | $(bool "${UNICODE}")                             |"
          echo "| └─ 🧹 Disk Space Clean                             | \`${CLEANSPACE}\`                                |"
          echo "| └─ 📂 XUS Patch                                    | \`${XUS}\`                                       |"
          echo "| └─ 🔁 Re-Kernel (Use with Freezer, NoActive, Etc.) | \`${REKERNEL}\`                                  |"
          echo "| └─ 🔤 NTSync Patch                                 | $(bool "${NTSYNC}")                              |"
          echo "| └─ 🔤 Built-in NoMount                             | \`${NOMOUNT}\`                                   |"
          echo "| └─ 🆔 Workflow Run ID                              | \`${GITHUB_RUN_ID}\`                             |"
        } >> "$GITHUB_STEP_SUMMARY"
