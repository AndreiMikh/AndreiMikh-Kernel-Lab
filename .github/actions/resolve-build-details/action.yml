name: 📋 Kernel Build Details
description: Generate a Detailed Post-Kernel-Build Summary of Kernel Version, Build Configuration, Integrated Features and Workflow Information
inputs:
  ROOTENGINE:
    description: Root Solution or KernelSU Manager Variant
    required: false
    default: ""
  SUFFIX:
    description: Custom Kernel Version Suffix
    required: false
    default: ""
  BUILDTIME:
    description: Configured Kernel Build Timestamp
    required: false
    default: ""
  FILE:
    description: Resolved Device Manifest Configuration File Name
    required: false
    default: ""
  SUSFSVARIANT:
    description: Selected SUSFS Variant or Revision
    required: false
    default: ""
  SUSFSBRANCHDEV:
    description: Whether SUSFS Development Branch is Selected
    required: false
    default: ""
  KERNELPATCH:
    description: Selected Kernel Patch Variant
    required: false
    default: ""
  BUILDCCACHE:
    description: Whether Compiler Cache is Enabled
    required: false
    default: ""
  LSMBBG:
    description: Whether LSM Baseband Guard Feature is Enabled
    required: false
    default: ""
  NETFILTER:
    description: Whether Netfilter IP Set and IPv6 NAT Fix Features are Enabled
    required: false
    default: ""
  TCPALGORITHM:
    description: Selected TCP Congestion Control Algorithm
    required: false
    default: ""
  LINUXCNTSYNC:
    description: DroidSpaces and NTSync Configuration or Selection
    required: false
    default: ""
  LZ4NEON:
    description: Selected LZ4 NEON Optimization or Version
    required: false
    default: ""
  WINDSPEED:
    description: Whether Hmbird or Windspeed Scheduler Patch is Enabled
    required: false
    default: ""
  UNICODE:
    description: Whether Unicode Bypass Patch is Enabled
    required: false
    default: ""
  CLEANSPACE:
    description: Disk Space Cleanup Configuration or Status
    required: false
    default: ""
  REKERNEL:
    description: ReKernel Integration Configuration or Status
    required: false
    default: ""
  NOMOUNT:
    description: Selected Built-in NoMount Variant or Branch
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: 📋 Kernel Build Details
      shell: bash
      env:
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
        ANDROIDVERSION: ${{ env.ANDROIDVERSION }}
        FULLVERSION: ${{ env.FULLVERSION }}
        SUFFIX: ${{ inputs.SUFFIX }}
        BUILDTIME: ${{ inputs.BUILDTIME }}
        FILE: ${{ inputs.FILE }}
        SUSFSVARIANT: ${{ inputs.SUSFSVARIANT }}
        SUSFSBRANCHDEV: ${{ inputs.SUSFSBRANCHDEV }}
        KERNELPATCH: ${{ inputs.KERNELPATCH }}
        BUILDCCACHE: ${{ inputs.BUILDCCACHE }}
        LSMBBG: ${{ inputs.LSMBBG }}
        NETFILTER: ${{ inputs.NETFILTER }}
        TCPALGORITHM: ${{ inputs.TCPALGORITHM }}
        LINUXCNTSYNC: ${{ inputs.LINUXCNTSYNC }}
        LZ4NEON: ${{ inputs.LZ4NEON }}
        WINDSPEED: ${{ inputs.WINDSPEED }}
        UNICODE: ${{ inputs.UNICODE }}
        CLEANSPACE: ${{ inputs.CLEANSPACE }}
        REKERNEL: ${{ inputs.REKERNEL }}
        NOMOUNT: ${{ inputs.NOMOUNT }}
      run: |
        # Helper For Formatted Boolean Display(s) Summary
        bool() {
          if [[ "${1:-}" == "true" ]]; then
            echo "✔ Yes"
          else
            echo "✘ No"
          fi
        }
        # Generate the Post-Build Summary
        {
          echo "### 📊 Post Kernel Build Details"

          # Core Information
          echo "#### 🧩 Core Information"
          echo "| Category | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔐 Root / KSU Manager Variant | \`${ROOTENGINE:-None}\` |"
          echo "| └─ 📱 Device Model | \`${FILE:-Unknown}\` |"
          echo "| └─ 🔧 Kernel Version | \`${ANDROIDVERSION:-Unknown}-${FULLVERSION:-Unknown}\` |"
          echo "| └─ 🏷️ Kernel Suffix | \`${SUFFIX:-Auto}\` |"
          echo "| └─ 🕒 Kernel Build Time | \`${BUILDTIME:-Auto}\` |"

          # Build Configuration
          echo "#### ⚙️ Build Configuration"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 📦 Manifest | \`${FILE:-Disabled}\` |"
          echo "| └─ 🧬 SUSFS Variant | \`${SUSFSVARIANT:-Disabled}\` |"
          echo "| └─ 🧪 SUSFS Development Branch | $(bool "$SUSFSBRANCHDEV") |"
          echo "| └─ 🩹 Kernel Patch Variant | \`${KERNELPATCH:-Disabled}\` |"
          echo "| └─ 💾 Compiler Cache | \`${BUILDCCACHE:-Disabled}\` |"

          # System Features
          echo "#### 🧠 System Features"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔰 LSM (Linux Security Module) Baseband Guard | $(bool "$LSMBBG") |"
          echo "| └─ 📡 Netfilter IP Set; IPv6 NAT Fix | $(bool "$NETFILTER") |"
          echo "| └─ 🛜 TCP Congestion Control Algorithm | \`${TCPALGORITHM:-Default}\` |"
          echo "| └─ 🧩 DroidSpaces / NTSync Primitives | \`${LINUXCNTSYNC:-Disabled}\` |"

          # Memory and Performance
          echo "#### 🧮 Memory and Performance"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ ⚙️ LZ4 1.10.0 Neon | \`${LZ4NEON:-Disabled}\` |"
          echo "| └─ 🌪️ Hmbird / Windspeed Patch Scheduler | $(bool "$WINDSPEED") |"

          # Miscellaneous Features
          echo "#### 🧾 Miscellaneous"
          echo "| Feature | Reported Value |"
          echo "|---|---|"
          echo "| └─ 🔤 Unicode Bypass | $(bool "$UNICODE") |"
          echo "| └─ 🧹 Disk Space Clean | \`${CLEANSPACE:-Disabled}\` |"
          echo "| └─ 🔁 ReKernel (Use with Freezer, NoActive, Etc.) | \`${REKERNEL:-Disabled}\` |"
          echo "| └─ 🔤 NoMount | \`${NOMOUNT:-Disabled}\` |"
          echo "| └─ 🆔 Workflow Run ID | \`${GITHUB_RUN_ID}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
