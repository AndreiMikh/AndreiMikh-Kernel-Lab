name: 🔧 Resolve ReKernel
description: Resolve and Download ReKernel Module
inputs:
  # Android Version Used by Kernel
  ANDROIDVERSION:
    description: Android Version
    required: true
  # Kernel Version or Kernel Series Used by the Kernel
  KERNELVERSION:
    description: Kernel Version
    required: true
outputs:
  # Selected ReKernel ZIP Asset Name
  asset-name:
    description: Selected ReKernel Asset
    value: ${{ steps.download-rekernel.outputs.asset-name }}
  # Direct Download URL of Selected ReKernel ZIP
  download-url:
    description: ReKernel Download URL
    value: ${{ steps.download-rekernel.outputs.download-url }}
  # ReKernel Version Extracted From Asset Name
  version-number:
    description: ReKernel Version
    value: ${{ steps.download-rekernel.outputs.version-number }}
  # Path to Selected ReKernel Kernel Module
  module-path:
    description: Selected ReKernel Module Path
    value: ${{ steps.extract-rekernel.outputs.module-path }}

runs:
  using: composite
  steps:
    # Find Latest Published ReKernel Release and Select its ZIP Asset
    - name: 🔎 Find ReKernel Module ZIP
      id: download-rekernel
      uses: actions/github-script@v9
      with:
        script: |
          const owner = 'Sakion-Team';
          const repo = 'Re-Kernel';
          // Fetch Latest Published GitHub Release
          core.info(`└─ 🔎 Fetching Latest ${owner}/${repo} Release...`);
          const release = await github.rest.repos.getLatestRelease({
            owner,
            repo,
          });
          const releaseTag = release.data.tag_name;
          const assets = release.data.assets || [];
          // Display Latest Release Information
          core.info(`└─ 📦 Latest Release : ${releaseTag}`);
          core.info(`└─ 📦 Release Assets : ${assets.length}`);
          // Match ReKernel ZIP Assets
          const pattern = /^Re-Kernel.*\.zip$/i;
          const targetAsset = assets.find(asset =>
            pattern.test(asset.name)
          );
          // Fail if No ReKernel ZIP Exists in Latest Release
          if (!targetAsset) {
            core.setFailed(
              `└─ ⚠️ [Error] No ReKernel ZIP Found in ${releaseTag}`
            );
            return;
          }
          // Extract Version Number From ReKernel Asset Name
          // Example: Re-Kernel-v11.7.zip → 11.7
          const versionMatch =
            targetAsset.name.match(/^Re-Kernel-v?([\d.]+)/i);
          const versionNumber = versionMatch
            ? versionMatch[1]
            : releaseTag.replace(/^v/i, '') || 'latest';
          // Display Selected ReKernel Asset Information
          core.info('');
          core.info('-----------------------------');
          core.info(`└─ 📦 [Result] Asset   : ${targetAsset.name}`);
          core.info(`└─ 🏷️ [Result] Version : ${versionNumber}`);
          core.info(`└─ 📏 [Result] Size    : ${(targetAsset.size / 1024).toFixed(1)} KB`);
          core.info('-----------------------------');
          // Export Selected Asset Information to Next Step
          core.setOutput(
            'asset-name',
            targetAsset.name
          );
          core.setOutput(
            'download-url',
            targetAsset.browser_download_url
          );
          core.setOutput(
            'version-number',
            versionNumber
          );

    # Download, Validate, Extract, and Locate ReKernel Module
    - name: 📥 Download ReKernel Module
      id: extract-rekernel
      env:
        # ReKernel Asset Selected by Previous Step
        ASSETNAME: ${{ steps.download-rekernel.outputs.asset-name }}
        # Direct Download URL for Selected Asset
        DLURL: ${{ steps.download-rekernel.outputs.download-url }}
        # ReKernel Version
        VERSIONNUMBER: ${{ steps.download-rekernel.outputs.version-number }}
        # Android Version Used by the Kernel
        ANDROIDVERSION: ${{ inputs.ANDROIDVERSION }}
        # Kernel Version or Kernel Series Used by the Kernel
        KERNELVERSION: ${{ inputs.KERNELVERSION }}
      shell: bash
      run: |
        set -Eeuo pipefail
        # Directory Where ReKernel ZIP Will Be Extracted
        ARTIFACTNAME="ReKernel-v${VERSIONNUMBER}"
        # Normalize Android Version to ReKernel Android Format
        if [[ "${ANDROIDVERSION}" == android* ]]; then
          ANDROIDVERSION="${ANDROIDVERSION}"
        else
          ANDROIDVERSION="android${ANDROIDVERSION}"
        fi

        # Normalize Kernel Version to ReKernel Kernel Series
        # Example: 6.6.118 → 6.6
        # Example: 6.6 → 6.6
        if [[ "${KERNELVERSION}" == *.*.* ]]; then
          KERNELSERIES="${KERNELVERSION%.*}"
        else
          KERNELSERIES="${KERNELVERSION}"
        fi

        # Build ReKernel Module Search Pattern
        REKERNELPATTERN="rekernel-${ANDROIDVERSION}-${KERNELSERIES}-*.ko"
        # Display ReKernel Information
        echo "└─ 📦 [Info] ReKernel Asset  : ${ASSETNAME}"
        echo "└─ 🏷️ [Info] Version         : ${VERSIONNUMBER}"
        echo "└─ 🤖 [Info] Android Version : ${ANDROIDVERSION}"
        echo "└─ 🐧 [Info] Kernel Version  : ${KERNELVERSION}"
        echo "└─ 🔎 [Info] Kernel Series   : ${KERNELSERIES}"
        echo "└─ 🔎 [Info] Module Pattern  : ${REKERNELPATTERN}"
        echo "└─ 📁 [Info] Artifact        : ${ARTIFACTNAME}"
        echo "└─ 🔗 [Info] Download URL    : ${DLURL}"
        # Download Selected ReKernel Release Asset
        echo "└─ 📥 Downloading ReKernel..."
        curl \
          --fail \
          --location \
          --retry 3 \
          --retry-delay 2 \
          --silent \
          --show-error \
          --output "${ASSETNAME}" \
          "${DLURL}"
        echo "└─ ✔️ [Result] ReKernel Download Complete"
        # Display Downloaded ZIP Information
        echo "└─ 📊 [Info] Downloaded File :"
        ls -lh "${ASSETNAME}"
        # Verify Downloaded ZIP Archive
        echo "└─ 🔎 [Info] Validating ZIP Archive..."
        unzip -tq "${ASSETNAME}"
        echo "└─ ✔️ [Info] ZIP Validation Passed"
        # Remove Previous Extraction Directory
        rm -rf "${ARTIFACTNAME}"
        # Create Clean Extraction Directory
        mkdir -p "${ARTIFACTNAME}"
        # Extract ReKernel ZIP
        echo "└─ 📂 Extracting ReKernel..."
        unzip -q \
          "${ASSETNAME}" \
          -d "${ARTIFACTNAME}"
        echo "└─ ✔️ [Result] ReKernel Extraction Complete"
        # Find Matching ReKernel Module
        REKERNELMODULE="$(
          find "${ARTIFACTNAME}" \
            -type f \
            -name "${REKERNELPATTERN}" \
            -print \
            | sort -V \
            | tail -n 1
        )"
        # Fail if No Matching ReKernel Module Was Found
        if [[ -z "${REKERNELMODULE}" ]]; then
          echo "⚠️ [Error] No ReKernel Module Found"
          echo "└─ 🤖 Android Version : ${ANDROIDVERSION}"
          echo "└─ 🐧 Kernel Series   : ${KERNELSERIES}"
          echo "└─ 🔎 Pattern        : ${REKERNELPATTERN}"
          exit 1
        fi

        # Remove All Non-Matching ReKernel Kernel Modules
        echo "└─ 🧹 Removing Non-Matching ReKernel Modules..."
        find "${ARTIFACTNAME}" \
          -type f \
          -path '*/kmod/*.ko' \
          ! -path "${REKERNELMODULE}" \
          -delete
        # Display Selected ReKernel Module
        echo "└─ ✔️ [Result] ReKernel Module Found"
        echo "└─ 📦 [Module] ${REKERNELMODULE}"
        # Display Final ReKernel Files
        echo "└─ 📋 [Info] Final ReKernel Files :"
        find "${ARTIFACTNAME}" \
          -maxdepth 6 \
          -type f \
          -print \
          | sort
        # Export Selected Module Path
        echo "module-path=${REKERNELMODULE}" >> "$GITHUB_OUTPUT"
       
    # Upload Complete Extracted ReKernel Release as a Workflow Artifact
    - name: 📤 Upload ReKernel Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ReKernel-Module
        path: ReKernel-v${{ steps.download-rekernel.outputs.version-number }}-Module
        if-no-files-found: error
        compression-level: 0
