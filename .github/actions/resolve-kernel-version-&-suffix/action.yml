name: 📌 Kernel Version Setup
description: Detect Kernel Version and Configure Kernel Version Suffix
inputs:
  SUBLEVEL:
    required: false
    default: ""
  SUFFIX:
    required: false
    default: ""
outputs:
  androidversion:
    description: Detected Android kernel module version
    value: ${{ steps.kernel-version-setup.outputs.androidversion }}
  kernelversion:
    description: Detected kernel branch version
    value: ${{ steps.kernel-version-setup.outputs.kernelversion }}
  fullversion:
    description: Final kernel version
    value: ${{ steps.kernel-version-setup.outputs.fullversion }}
  suffix:
    description: Final kernel version suffix
    value: ${{ steps.kernel-version-setup.outputs.suffix }}
runs:
  using: composite
  steps:
    - name: 📌 Kernel Version Setup
      id: kernel-version-setup
      shell: bash
      env:
        SUBLEVELINPUT: ${{ inputs.SUBLEVEL }}
        SUFFIXINPUT: ${{ inputs.SUFFIX }}
      run: |
        set -Eeuo pipefail
        cd "$KERNELPLATFORM"
        echo "└─ 📂 Working Directory: $(pwd)"
        COMMONMAKEFILE="${COMMONKERNELFOLDER}/Makefile"
        echo "└─ 🚀 Kernel Common Directory Found"
        echo "└─ 📌 Using Makefile: $COMMONMAKEFILE"
        # Detect Kernel Module Branch
        echo "🔍 Detecting Kernel Module Branch..."
        KERNELMODULE=""
        for cfg in \
          "${COMMONKERNELFOLDER}/build.config.constants" \
          "${COMMONKERNELFOLDER}/build.config.common"
        do
          [[ -f "$cfg" ]] || continue
          TMPBRANCH="$(
            grep -m1 '^BRANCH=' "$cfg" \
              | cut -d= -f2 \
              || true
          )"
          if [[ -n "$TMPBRANCH" ]]; then
            KERNELMODULE="$TMPBRANCH"
            break
          fi
        done

        # Fallback: Detect Module Branch from ACK-SHA
        if [[ -z "$KERNELMODULE" \
           && -n "${KERNELREPOSITORY:-}" \
           && -f "./$KERNELREPOSITORY/android/ACK_SHA" ]]; then
          KERNELMODULE="$(
            sed -n '2p' "./$KERNELREPOSITORY/android/ACK_SHA" \
              | awk -F'-' '{print $1 "-" $2}'
          )
        fi

        # Parse Kernel Module Information
        if [[ -n "${KERNELMODULE:-}" ]]; then
          ANDROIDVERSION="${KERNELMODULE%-*}"
          KERNELVERSION="${KERNELMODULE#*-}"
          echo "└─ 🚀 Kernel Module Detected"
          echo "└─ 📌 Kernel Module   : $KERNELMODULE"
          echo "└─ 📌 Android Version : $ANDROIDVERSION"
          echo "└─ 📌 Kernel Branch   : $KERNELVERSION"
        else
          echo "└─ ⚠️ Unable to Detect Kernel Module"
          KERNELMODULE="Unknown"
          ANDROIDVERSION="Unknown"
          KERNELVERSION="Unknown"
        fi

        # Read Actual Kernel Version
        echo "🧾 Reading Real Kernel Version..."
        VERSION="$(
          awk -F'=' '/^VERSION[[:space:]]*=/ {
            gsub(/[[:space:]]/, "", $2)
            print $2
            exit
          }' "$COMMONMAKEFILE"
        )"
        PATCHLEVEL="$(
          awk -F'=' '/^PATCHLEVEL[[:space:]]*=/ {
            gsub(/[[:space:]]/, "", $2)
            print $2
            exit
          }' "$COMMONMAKEFILE"
        )"
        SUBLEVEL="$(
          awk -F'=' '/^SUBLEVEL[[:space:]]*=/ {
            gsub(/[[:space:]]/, "", $2)
            print $2
            exit
          }' "$COMMONMAKEFILE"
        )"
        # Fallback if Empty
        VERSION="${VERSION:-0}"
        PATCHLEVEL="${PATCHLEVEL:-0}"
        SUBLEVEL="${SUBLEVEL:-0}"
        # Validate Original Sublevel
        if ! [[ "$SUBLEVEL" =~ ^[0-9]+$ ]]; then
          echo "└─ ⚠️ Invalid Sublevel Detected: $SUBLEVEL"
          echo "└─ 🔧 Forcing Sublevel to 0"
          SUBLEVEL=0
        fi

        OGVERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
        echo "└─ 📌 Kernel Version : $VERSION.$PATCHLEVEL"
        echo "└─ 📌 Kernel Sublevel: $SUBLEVEL"
        echo "└─ 📌 Original Kernel Version: $OGVERSION"
        # Optional Sublevel Override
        if [[ -n "${SUBLEVELINPUT:-}" ]]; then
          echo "🛠️ Updating Kernel Sublevel..."
          echo "└─ 📌 New Sublevel: $SUBLEVELINPUT"
          if ! [[ "$SUBLEVELINPUT" =~ ^[0-9]+$ ]]; then
            echo "└─ ⚠️ Invalid Custom Sublevel: $SUBLEVELINPUT"
            exit 1
          fi

          sed -i \
            "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVELINPUT/" \
            "$COMMONMAKEFILE"
          # Re-read the Updated Sublevel
          SUBLEVEL="$SUBLEVELINPUT"
          echo "└─ ✔️ Kernel Sublevel Updated: $SUBLEVEL"
        else
          echo "└─ 📌 No Custom Sublevel Provided"
        fi

        # Read Final Kernel Version
        NEWVERSION="$(
          awk '
            /^VERSION[[:space:]]*=/    { v=$3 }
            /^PATCHLEVEL[[:space:]]*=/ { p=$3 }
            /^SUBLEVEL[[:space:]]*=/   { s=$3 }
            END { print v "." p "." s }
          ' "$COMMONMAKEFILE"
        )"
        echo "📊 Final Kernel Version: $NEWVERSION"
        if [[ "$OGVERSION" != "$NEWVERSION" ]]; then
          echo "└─ ⚙️ Kernel Version Modified"
          echo "└─ 📌 $OGVERSION → $NEWVERSION"
        else
          echo "└─ ✔️ Kernel Version Unchanged"
        fi

        # Export Kernel Version Environment
        echo "└─ 📤 Exporting Environment Variables..."
        {
          echo "SUBLEVEL=$SUBLEVEL"
          echo "KERNELMODULE=$KERNELMODULE"
          echo "ANDROIDVERSION=$ANDROIDVERSION"
          echo "KERNELVERSION=$KERNELVERSION"
          echo "FULLVERSION=$NEWVERSION"
          echo "KV1=${KERNELVERSION%%.*}"
          echo "KV2=${KERNELVERSION//./}"
          echo "KV3=${NEWVERSION//./}"
          echo "KSHORTVERSION=${NEWVERSION%.*}"
          echo "KSHORTPATCHVERSION=${NEWVERSION%.*}"
        } >> "$GITHUB_ENV"
        # Export Values for GitHub Actions Expressions
        {
          echo "androidversion=$ANDROIDVERSION"
          echo "kernelversion=$KERNELVERSION"
          echo "fullversion=$NEWVERSION"
        } >> "$GITHUB_OUTPUT"
        echo "└─ 🚀 Environment Variables Exported"
        echo "🎉 Kernel Version Setup Complete"

        # Navigate to Kernel Workspace
        cd "$WORKDIR"
        # Android Version Is Already Determined by Kernel Version Setup
        echo "└─ 🔧 Configuring Kernel Version Suffix..."
        echo "└─ 📌 Android Version: ${ANDROIDVERSION}"
        # Define Supported SetLocalVersion Scripts
        FILES=(
          "${COMMONKERNELFOLDER}/scripts/setlocalversion"
          "${MSMKERNELFOLDER}/scripts/setlocalversion"
          "${KERNELPLATFORM}/external/dtc/scripts/setlocalversion"
        )
        # Resolve Custom or Automatic Suffix
        SUFFIX="${SUFFIXINPUT}"
        if [[ -n "$SUFFIX" ]]; then
          # Custom Suffix Mode
          SUFFIXMODE="Custom"
          echo "└─ 🚀 Custom Kernel Suffix Detected"
          echo "└─ 📌 Suffix: ${SUFFIX}"
          # Build Final KernelLocalVersion
          FINALSUFFIX="-${ANDROIDVERSION}-${SUFFIX}-4k"
          echo "└─ 📌 Final KernelLocalVersion: ${FINALSUFFIX}"
          # Track Injection Status
          INJECTIONSUCCESS=true
          # Process All Supported SetLocalVersion Scripts
          for path in "${FILES[@]}"; do
            # Skip Missing SetLocalVersion Scripts
            [[ -f "$path" ]] || continue
            echo "└─ 📂 Processing: ${path}"
            # Ensure Script Remains Executable
            chmod +x "$path"
            # Remove Existing Dirty Tags
            sed -i 's/ -dirty//g' "$path"
            # Remove Dirty Tags From Dynamically Generated Res Values
            if ! grep -q 'res=$(echo "$res" | sed' "$path"; then
              sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
            fi

            # Detect SetLocalVersion Format
            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              # New Format: Replace SCMVersion Output Directly
              echo "└─ 📌 New SetLocalVersion Format Detected"
              if ! sed -i \
                "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${ANDROIDVERSION}-${SUFFIX}-4k\"|" \
                "$path"; then
                echo "└─ ⚠️ Failed to Modify: ${path}"
                INJECTIONSUCCESS=false
                break
              fi
            elif grep -q 'echo "\$res"' "$path"; then
              # Old Format: Use Static Res Value
              echo "└─ 📌 Old SETLOCALVERSION Format Detected"
              echo "└─ ✔️ Using Static Res Value"
              if ! sed -i \
                "s/^res=.*/res=\"-${ANDROIDVERSION}-${SUFFIX}-4k\"/" \
                "$path"; then
                echo "└─ ⚠️ Failed to Modify: ${path}"
                INJECTIONSUCCESS=false
                break
              fi
            else
              # Standard Format: Dynamically Inject Suffix
              echo "🛠️ Standard SETLOCALVERSION Format Detected"
              # Warn About Bazel Version Handling
              if [[ -f kernel_platform/build_with_bazel.py ]]; then
                echo "└─ ⚠️ Bazel Build Detected"
                echo "└─ 📌 Special Characters in the Suffix May Require Adjustment"
              fi

              # Inject Custom Suffix Before First Echo "$res"
              if ! tac "$path" |
                sed \
                  "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}-4k; echo \"\\\$res\";/" \
                | tac > "${path}.tmp"; then
                echo "└─ ⚠️ Failed to Inject Suffix: ${path}"
                rm -f "${path}.tmp"
                INJECTIONSUCCESS=false
                break
              fi
              # Replace Original Script
              mv "${path}.tmp" "$path"
            fi

            # Restore Executable Permission
            chmod +x "$path"
            echo "└─ 🎉 Finished: ${path}"
          done

          # Handle Custom Suffix Injection Result
          if [[ "$INJECTIONSUCCESS" == "true" ]]; then
            echo "└─ 🎉 Custom Kernel Suffix Injection Successful"
            echo "└─ 📌 Local Version: ${FINALSUFFIX}"
          else
            # Custom Injection Failed — Use Environment Fallback
            echo "└─ ⚠️ Custom Kernel Suffix Injection Failed"
            echo "└─ 🔄 Activating Local Version Fallback"
            {
              echo "LOCALVERSION=${FINALSUFFIX}"
              echo "KBUILDVERSION=${FINALSUFFIX}"
            } >> "$GITHUB_ENV"
            echo "└─ 🎉 Local Version Fallback Enabled"
            echo "└─ 📌 LOCALVERSION=${FINALSUFFIX}"
            echo "└─ 📌 KBUILDVERSION=${FINALSUFFIX}"
          fi
        else
          # Automatic Suffix Mode
          SUFFIXMODE="Automatic"
          echo "└─ 🎲 No Custom Kernel Suffix Provided"
          echo "└─ 🚀 Generating Random Kernel Suffix..."
          # Generate Random Kernel Suffix
          RANDOMDIGIT=$((RANDOM % 10))
          RANDOMHASH="$(head -c 7 /dev/urandom | xxd -p)"
          AUTOSUFFIX="${RANDOMDIGIT}-g${RANDOMHASH}"
          SUFFIX="$AUTOSUFFIX"
          FINALSUFFIX="-${ANDROIDVERSION}-${AUTOSUFFIX}-4k"
          echo "└─ 🧾 Generated Suffix: ${AUTOSUFFIX}"
          echo "└─ 📌 Final Local Version: ${FINALSUFFIX}"
          # Process All Supported SetLocalVersion Scripts
          for path in "${FILES[@]}"; do
            # Skip Missing SetLocalVersion Scripts
            [[ -f "$path" ]] || continue
            echo "└─ 📂 Processing: ${path}"
            # Ensure Script Remains Executable
            chmod +x "$path"
            # Remove Existing Dirty Markers
            sed -i 's/ -dirty//g' "$path"
            # Prevent Duplicate Automatic Injection
            if grep -q "Kernel Auto Suffix Injection" "$path"; then
              echo "└─ ℹ️ Auto Suffix Injection Already Present"
              echo "└─ ⏭️ Skipping: ${path}"
              continue
            fi

            # Append Automatic Suffix Logic
            printf '%s\n' \
              '' \
              '# Kernel Auto Suffix Injection' \
              'if [ -n "$res" ]; then' \
              '  case "$res" in' \
              "    *\"-${AUTOSUFFIX}\"*)" \
              '      ;;' \
              '    *)' \
              "      res=\"\$res-${ANDROIDVERSION}-${AUTOSUFFIX}-4k\"" \
              '      ;;' \
              '  esac' \
              'fi' >> "$path"
            # Restore Executable Permission
            chmod +x "$path"
            echo "└─ 🎉 Auto Suffix Injection Applied"
          done
        fi

        echo "⚙️ Checking Kernel Version Changes..."
        # Stage All Modified Files
        git add -A
        # Commit Only When Changes Exist
        if git diff --cached --quiet; then
          echo "└─ ℹ️ No Kernel Version Changes Detected"
        else
          if [[ "$SUFFIXMODE" == "Custom" ]]; then
            git commit \
              -m "└─ 🎉 Inject Custom Kernel Version Suffix"
          else
            git commit \
              -m "└─ 🎉 Apply Auto-Generated Kernel Suffix"
          fi

          echo "└─ 🎉 Kernel Version Changes Committed Successfully"
        fi

        echo "------------------------------"
        echo "🎉 Kernel Version Suffix Configuration Complete"
        echo "└─ 📌 Mode          : ${SUFFIXMODE}"
        echo "└─ 📌 Android       : ${ANDROIDVERSION}"
        echo "└─ 📌 Suffix        : ${SUFFIX}"
        echo "└─ 📌 Local Version : ${FINALSUFFIX}"
        echo "------------------------------"
        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
