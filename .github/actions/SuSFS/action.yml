                        print(f"└─ 📌 Matching Line: {line}")
                    raise RuntimeError(
                        "Cannot Uniquely Locate Rollup Statistics Call"
                    )
                anchor = matches[0].group(0)
                replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
        		if (vma->vm_file &&
        		    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
        			goto bypass_orig_flow;
        #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP
        		smap_gather_stats(vma, &mss, 0);"""        
                fn = fn.replace(anchor, replacement, 1)
                print("└─ 🔧 Adding SHOW SMAPS ROLLUP() Hook")
            else:
                print("└─ ℹ️ SUSFS Map Hook Already Present in Rollup")        
            # Ensure Exactly One Bypass Label Exists
            labels = fn.count("bypass_orig_flow:")      
            if labels == 0:
                anchor = "\t\tlast_vma_end = vma->vm_end;"      
                if fn.count(anchor) != 1:
