# SUSFS and Kernel Compatibility Patches Composite Action
name: 🩹 SUSFS and Kernel Compatibility Patches
description: Apply SUSFS Patches, Kernel Compatibility Fixes and Fake Patch Handling
# Define Inputs Required by Composite Action
inputs:
  # Select Root Engine Used by the Kernel Build
  ROOTENGINE:
    description: Root Engine
    required: true
  # Select a SUSFS Commit, Tag, Branch, or Numeric Rollback Value
  SUSFSREPOSITORY:
    description: SUSFS Revision or Rollback Value
    required: true
  # Select SUSFS Repository Variant
  SUSFSVARIANT:
    description: SUSFS Variant (GKI or OGKI)
    required: true
  # Append Development Suffix to the Selected SUSFS Branch When Enabled
  SUSFSBRANCHDEV:
    description: SUSFS Development Branch
    required: true
  # Specify Target Kernel Configuration
  FILE:
    description: Kernel Target Configuration
    required: true
# Expose Detected SUSFS Version to Subsequent Workflow Steps
outputs:
  susfsver:
    description: Detected SUSFS Version
    value: ${{ steps.susfs.outputs.susfsver }}
runs:
  using: composite
  steps:
    # These Changes Prepare Older or Newer Kernel Sources For SUSFS Patch
    # Apply Kernel Fake Patches Before SUSFS Integration
    # Apply Temporary Kernel Compatibility Fixes Before SUSFS Integration
    - name: 🩹 Invert Fake Patches
      if: ${{ inputs.SUSFSREPOSITORY != '-1' }}
      shell: bash
      # Import Environment Variables
      env:
        KERNELMODULE: ${{ env.ANDROIDVERSION }}-${{ env.KERNELVERSION }}
        SUBLEVEL: ${{ env.SUBLEVEL }}
        COMMONKERNELFOLDER: ${{ env.COMMONKERNELFOLDER }}
        PATCHDIR: ${{ env.PATCHDIR }}
      run: |
        set -e
        # Validate Common Kernel Source Directory
        [[ -n "$COMMONKERNELFOLDER" && -d "$COMMONKERNELFOLDER" ]] || {
          echo "└─ ⚠️ Invalid Kernel Directory: $COMMONKERNELFOLDER" >&2
          exit 1
        }
        echo "└─ 📂 Kernel Directory : $COMMONKERNELFOLDER"
        echo "└─ 🔎 Kernel Base      : $KERNELMODULE"
        echo "└─ 🔢 Kernel Sublevel  : $SUBLEVEL"
        # Initialize Per-File Flags
        FAKEPATCHBASE=0
        FAKEPATCHFDINFO=0
        FAKEPATCHNAMESPACE=0
        FAKEPATCHOPEN=0
        FAKEPATCHMEMORY=0
        FAKEPATCHTASKMMU=0
        FAKEPATCHSUPER=0
        FAKEPATCHEXEC=0
        # Invert Android 12 / 5.10 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android12-5.10" ]]; then
          # Define Required Kernel Source File Paths
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          # Validate That Required Source Files Exist
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          # Fix THIS-LEN Declaration in FS / PROC / BASE
          # Apply Only to Kernel Sublevels 43 and Below
          # Skip When Fake Patch Flag is Already Set
          if [[ "$SUBLEVEL" -le 43 && "$FAKEPATCHBASE" -eq 0 ]]; then
            # Check Whether THIS-LEN Already Uses SIZE-T
            if grep -qE 'size_t[[:space:]]+this_len[[:space:]]*=[[:space:]]*min_t[[:space:]]*\([[:space:]]*size_t[[:space:]]*,' "$BASE"; then
              # Avoid Reapplying an Existing Declaration Update
              echo "└─ ℹ️ THIS-LEN Declaration Already Updated"
            # Locate Original INT-Based THIS-LEN Declaration
            elif grep -qE 'int[[:space:]]+this_len[[:space:]]*=[[:space:]]*min_t[[:space:]]*\([[:space:]]*int[[:space:]]*,' "$BASE"; then
              echo "└─ 🔧 Applying BASE Android 12 / 5.10 Fake Patch"
              # Replace INT With SIZE-T in Declaration and MIN-T Type
              perl -i -pe 's/int\s+this_len\s*=\s*min_t\s*\(\s*int\s*,/size_t this_len = min_t(size_t,/' "$BASE"
              # Record That BASE Fake Patch was Applied
              FAKEPATCHBASE=1
            else
              # Report When Neither Expected Declaration Pattern is Found
              echo "└─ ⚠️ Cannot Locate THIS-LEN Declaration; Skipping" >&2
            fi

          else
            # Skip When Sublevel is too High or Fake Patch Flag is Set
            echo "└─ ⏭️ Skipping BASE Fake Patch For Sublevel $SUBLEVEL"
          fi

          # Update INOTIFY Mask Handling in FS / NOTIFY / FDINFO
          # Apply Only to Kernel Sublevels 117 and Below
          # Skip When FDINFO Fake Patch Flag is Already Set
          if [[ "$SUBLEVEL" -le 117 && "$FAKEPATCHFDINFO" -eq 0 ]]; then
            # Locate Original INOTIFY Mask Argument Pattern
            if [[ "$FAKEPATCHFDINFO" -eq 0 ]] && grep -qF 'mask, mark->ignored_mask' "$FDINFO"; then
              echo "└─ 🔧 Applying FDINFO Android 12 / 5.10 Fake Patch"
              # Remove Obsolete Comment and Local Mask Declaration Block
              sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' "$FDINFO"
              # Replace Original Mask Arguments with SUSFS-Compatible Helper
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' "$FDINFO"
              # Replace Printed Ignored Mask with a Fixed Zero Value
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' "$FDINFO"
              # Record That FDINFO Fake Patch was Applied
              FAKEPATCHFDINFO=1
            # Detect Whether INOTIFY Mask Update is Already Present
            elif grep -qF 'inotify_mark_user_mask(mark)' "$FDINFO"; then
              echo "└─ ℹ️ FDINFO INOTIFY Mask Handling Already Updated"
            else
              # Report When Expected INOTIFY Mask Pattern is Missing
              echo "└─ ⚠️ Cannot Locate FDINFO INOTIFY Mask Pattern; Skipping" >&2
            fi

          else
            # Skip When Sublevel is too High or Fake Patch Flag is Set
            echo "└─ ⏭️ Skipping FDINFO Fake Patch For Sublevel $SUBLEVEL"
          fi

          echo "└─ 🎉 Android 12 / 5.10 Fake Patch Preparation Complete"
        fi
        
        # Invert Android 13 / 5.15 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android13-5.15" ]]; then
          # Define Required Kernel Source File Paths
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          OPEN="$COMMONKERNELFOLDER/fs/open.c"
          FDINFO="$COMMONKERNELFOLDER/fs/notify/fdinfo.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          # Validate That All Required Source Files Exist
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$OPEN" ]] || { echo "└─ ⚠️ Missing: $OPEN" >&2; exit 1; }
          [[ -f "$FDINFO" ]] || { echo "└─ ⚠️ Missing: $FDINFO" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          # Add Mount ID Mapping Headers and Update INOTIFY Mask Handling
          # Apply These Fixes Only to Kernel Sublevels 41 and Below
          if [[ "$SUBLEVEL" -le 41 ]]; then
            # Prepare NAMESPACE Mount ID Mapping Header
            # Insert Header After SHMEM FS When it is Missing
            if [[ "$FAKEPATCHNAMESPACE" -eq 1 ]]; then
              echo "└─ ℹ️ NAMESPACE Fake Patch Already Applied"
            elif grep -qFx '#include <linux/mnt_idmapping.h>' "$NAMESPACE"; then
              echo "└─ ℹ️ NAMESPACE Mount ID Mapping Header Already Present"
            elif grep -qFx '#include <linux/shmem_fs.h>' "$NAMESPACE"; then
              echo "└─ 🔧 Applying NAMESPACE Android 13 / 5.15 SUSFS Fix"
              sed -i '/^#include <linux\/shmem_fs.h>$/a #include <linux/mnt_idmapping.h>' "$NAMESPACE"
              # Record That NAMESPACE Fake Patch was Applied
              FAKEPATCHNAMESPACE=1
            else
              # Report When Expected Header Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate NAMESPACE Header Insertion Point; Skipping" >&2
            fi

            # Prepare OPEN Mount ID Mapping Header
            # Insert Header After COMPAT When it is Missing
            if [[ "$FAKEPATCHOPEN" -eq 1 ]]; then
              echo "└─ ℹ️ OPEN Fake Patch Already Applied"
            elif grep -qFx '#include <linux/mnt_idmapping.h>' "$OPEN"; then
              echo "└─ ℹ️ OPEN Mount ID Mapping Header Already Present"
            elif grep -qFx '#include <linux/compat.h>' "$OPEN"; then
              echo "└─ 🔧 Applying OPEN Android 13 / 5.15 Fake Patch"
              sed -i '/^#include <linux\/compat.h>$/a #include <linux/mnt_idmapping.h>' "$OPEN"
              # Record That OPEN Fake Patch was Applied
              FAKEPATCHOPEN=1
            else
              # Report When Expected Header Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate OPEN Header Insertion Point; Skipping" >&2
            fi

            # Prepare FDINFO INOTIFY Mask Handling
            # Replace Original Mask Arguments With SUSFS-Compatible Helper
            if [[ "$FAKEPATCHFDINFO" -eq 0 ]] && grep -qF 'mask, mark->ignored_mask' "$FDINFO"; then
              echo "└─ 🔧 Applying FDINFO Android 13 / 5.15 Fake Patch"
              # Remove Obsolete Comment and Local Mask Declaration Block
              sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' "$FDINFO"
              # Replace Original Mask Arguments With INOTIFY MARK USER MASK()
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' "$FDINFO"
              # Replace Printed Ignored Mask With a Fixed Zero Value
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' "$FDINFO"
              # Record That FDINFO Fake Patch was Applied
              FAKEPATCHFDINFO=1
            elif grep -qF 'inotify_mark_user_mask(mark)' "$FDINFO"; then
              # Avoid Reapplying INOTIFY Mask Replacement
              echo "└─ ℹ️ FDINFO INOTIFY Mask Handling Already Updated"
            else
              # Report When Expected INOTIFY Mask Pattern is Missing
              echo "└─ ⚠️ Cannot Locate FDINFO INOTIFY Mask Pattern; Skipping" >&2
            fi

          else
            # Skip Older-Kernel Compatibility Fixes Above Sublevel 41
            echo "└─ ⏭️ Skipping Mount ID Mapping and INOTIFY Fixes For Sublevel $SUBLEVEL"
          fi

          # Remove Obsolete SWAP SLOTS Header
          # Apply Only at Sublevel 123 and Above When MEMORY has Not been Patched
          if [[ "$SUBLEVEL" -ge 123 && "$FAKEPATCHMEMORY" -eq 0 ]]; then
            if grep -qFx '#include <linux/swap_slots.h>' "$MEMORY"; then
              echo "└─ 🔧 Applying MEMORY Android 13 / 5.15 Fake Patch"
              # Delete Obsolete SWAP SLOTS Header
              sed -i '/^#include <linux\/swap_slots\.h>$/d' "$MEMORY"
              # Record That MEMORY Fake Patch was Applied
              FAKEPATCHMEMORY=1
            else
              # Avoid Repeating a Header Removal
              echo "└─ ℹ️ SWAP SLOTS Header Already Absent"
            fi
            
          else
            # Skip When Kernel Sublevel is too Low or Patch Flag is Set
            echo "└─ ⏭️ Skipping MEMORY Fake Patch For Sublevel $SUBLEVEL"
          fi

          # Remove Block Trace Hook Header
          # Apply Only at Sublevel 197 and Above When NAMESPACE has Not been Patched
          if [[ "$SUBLEVEL" -ge 197 && "$FAKEPATCHNAMESPACE" -eq 0 ]]; then
            if grep -qFx '#include <trace/hooks/blk.h>' "$NAMESPACE"; then
              echo "└─ 🔧 Applying NAMESPACE Android 13 / 5.15 Fake Patch"
              # Delete BLOCK Trace Hook Header
              sed -i '/^#include <trace\/hooks\/blk\.h>$/d' "$NAMESPACE"
              # Record That NAMESPACE Fake Patch was Applied
              FAKEPATCHNAMESPACE=1
            else
              # Avoid Repeating a Header Removal
              echo "└─ ℹ️ Block Trace Hook Header Already Absent"
            fi
            
          else
            # Skip When Kernel Sublevel is too Low or Patch Flag is Set
            echo "└─ ⏭️ Skipping NAMESPACE Trace Hook Fix For Sublevel $SUBLEVEL"
          fi

          # Remove Memory Trace Hook Header
          # Apply Only at Sublevel 206 and Above When TASK-MMU has Not been Patched
          if [[ "$SUBLEVEL" -ge 206 && "$FAKEPATCHTASKMMU" -eq 0 ]]; then
            if grep -qFx '#include <trace/hooks/mm.h>' "$MMU"; then
              echo "└─ 🔧 Applying TASK-MMU Android 13 / 5.15 Fake Patch"
              # Delete MEMORY Trace Hook Header
              sed -i '/^#include <trace\/hooks\/mm\.h>$/d' "$MMU"
              # Record That TASK-MMU Fake Patch was Applied
              FAKEPATCHTASKMMU=1
            else
              # Avoid Repeating a Header Removal
              echo "└─ ℹ️ Memory Trace Hook Header Already Absent"
            fi
            
          else
            # Skip When Kernel Sublevel is too Low or Patch Flag is Set
            echo "└─ ⏭️ Skipping TASK-MMU Trace Hook Fix For Sublevel $SUBLEVEL"
          fi

          echo "└─ 🎉 Android 13 / 5.15 Fake Patch Preparation Complete"
        fi
       
        # Invert Android 14 6.1 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android14-6.1" ]]; then
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          SUPER="$COMMONKERNELFOLDER/fs/super.c"  
          # Validate Required Source Files
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$SUPER" ]] || { echo "└─ ⚠️ Missing: $SUPER" >&2; exit 1; }  
          # Add DMA-BUF Header to File System / PROC / BASE
          if [[ "$SUBLEVEL" -le 141 && "$FAKEPATCHBASE" -eq 0 ]]; then
            if grep -qFx '#include <linux/dma-buf.h>' "$BASE"; then
              echo "└─ ℹ️ DMA-BUF Header Already Present"
            elif grep -qFx '#include <linux/cpufreq_times.h>' "$BASE"; then
              echo "└─ 🔧 Applying BASE Android 14 6.1 Fake Patch"
              sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' "$BASE"
              FAKEPATCHBASE=1
            else
              echo "└─ ⚠️ Cannot Locate BASE Header Insertion Point; Skipping" >&2
            fi
            
          else
            echo "└─ ⏭️ Skipping BASE Fake Patch For Sublevel $SUBLEVEL"
          fi
  
          # Add Block Trace Hook Header Below Sublevel 157
          if [[ "$SUBLEVEL" -lt 157 ]]; then
            if grep -qFx '#include <trace/hooks/blk.h>' "$NAMESPACE"; then
              echo "└─ ℹ️ Block Trace Hook Header Already Present"
            elif grep -qFx '#include "internal.h"' "$NAMESPACE"; then
              echo "└─ 🔧 Applying NAMESPACE Android 14 6.1 Fake Patch"
              sed -i '/^#include "internal\.h"$/a #include <trace/hooks/blk.h>' "$NAMESPACE"
              FAKEPATCHNAMESPACE=1
            else
              echo "└─ ⚠️ Cannot Locate NAMESPACE Header Insertion Point; Skipping" >&2
            fi
            
          else
            echo "└─ ⏭️ Skipping NAMESPACE Fake Patch For Sublevel $SUBLEVEL"
          fi
  
          # Remove File System Trace Hook Header From File System / SUPER
          if [[ "$SUBLEVEL" -ge 157 ]]; then
            if [[ "$FAKEPATCHSUPER" -eq 0 ]] && grep -qFx '#include <trace/hooks/fs.h>' "$SUPER"; then
              echo "└─ 🔧 Applying SUPER Android 14 6.1 Fake Patch"
              sed -i '/^#include <trace\/hooks\/fs\.h>$/d' "$SUPER"
              FAKEPATCHSUPER=1
            else
              echo "└─ ℹ️ File System Trace Hook Header Already Absent"
            fi
            
          else
            echo "└─ ⏭️ Skipping SUPER Fake Patch For Sublevel $SUBLEVEL"
          fi
  
          echo "└─ 🎉 Android 14 / 6.1 Fake Patch Preparation Complete"
        fi
        
        # Prepare Android 15 / 6.6 Compatibility Fixes
        if [[ "$KERNELMODULE" == "android15-6.6" ]]; then
          # Define Required Kernel Source File Paths
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"
          NAMESPACE="$COMMONKERNELFOLDER/fs/namespace.c"
          MEMORY="$COMMONKERNELFOLDER/mm/memory.c"
          BASE="$COMMONKERNELFOLDER/fs/proc/base.c"
          # 🔎 Validate That All Required Source Files Exist
          [[ -f "$MMU" ]] || { echo "└─ ⚠️ Missing: $MMU" >&2; exit 1; }
          [[ -f "$NAMESPACE" ]] || { echo "└─ ⚠️ Missing: $NAMESPACE" >&2; exit 1; }
          [[ -f "$MEMORY" ]] || { echo "└─ ⚠️ Missing: $MEMORY" >&2; exit 1; }
          [[ -f "$BASE" ]] || { echo "└─ ⚠️ Missing: $BASE" >&2; exit 1; }
          # Prepare TASK-MMU and NAMESPACE Compatibility Fixes
          # Apply These Fixes Only to Kernel Sublevels 30 and Below
          if [[ "$SUBLEVEL" -le 30 ]]; then
            echo "└─ 🔧 Applying TASK-MMU and NAMESPACE Fake Patches"
            # Add VMA End Tracking to TASK-MMU
            # Avoid Duplicating Existing VMA End Assignment
            if grep -Fq 'last_vma_end = vma->vm_end;' "$MMU"; then
              echo "└─ ℹ️ VMA End Tracking Already Present"
            # Locate Original SMAP Statistics Call
            elif grep -Fq 'smap_gather_stats(vma, &mss, last_vma_end);' "$MMU"; then
              # Insert VMA End Assignment After Statistics Call
              sed -i '/smap_gather_stats(vma, &mss, last_vma_end);/a\last_vma_end = vma->vm_end;' "$MMU"
              # Restore Required if Block Structure and Braces
              # Indent Inserted Assignment and Add Closing Brace
              # Update VMA End Condition to Open a Block
              perl -0777 -i -pe '
                @l = split /\n/;
                for ($i = $#l; $i >= 0; $i--) {
                  if ($l[$i] =~ /last_vma_end = vma->vm_end;/) {
                    $l[$i] = "\t\t\t\t" . $l[$i];
                    splice(@l, $i + 1, 0, "\t\t\t}");
                    for ($j = $i; $j >= 0; $j--) {
                      if ($l[$j] =~ /if\s*\(vma->vm_end > last_vma_end\)/) {
                        $l[$j] =~ s/\)\s*$/) {/;
                        last;
                      }
                    }
                    last;
                  }
                }
                $_ = join "\n", @l;
              ' "$MMU"
              # Record That TASK-MMU Fake Patch was Applied
              FAKEPATCHTASKMMU=1
              echo "└─ 📌 Added VMA End Tracking"
            else
              # Report When Expected SMAP Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate VMA Tracking Insertion Point" >&2
            fi

            # Add File System Trace Hook to NAMESPACE
            # Insert FS Hook After Existing BLK Hook
            if grep -Fq '#include <trace/hooks/fs.h>' "$NAMESPACE"; then
              echo "└─ ℹ️ File System Trace Hook Already Present"
            elif grep -Fq '#include <trace/hooks/blk.h>' "$NAMESPACE"; then
              sed -i '/#include <trace\/hooks\/blk\.h>/a #include <trace/hooks/fs.h>' "$NAMESPACE"
              # Record That NAMESPACE Fake Patch was Applied
              FAKEPATCHNAMESPACE=1
              echo "└─ 📌 Added File System Trace Hook"
            else
              # Report When Expected BLK Header is Missing
              echo "└─ ⚠️ Cannot Locate BLK Trace Hook in NAMESPACE" >&2
            fi

            # Add Required Declarations to TASK-MMU
            # Check Whether Both Declarations are Already Present
            if grep -Fq 'unsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' "$MMU" &&
               grep -Fq 'pagemap_entry_t *res = NULL;' "$MMU"; then
              echo "└─ ℹ️ TASK-MMU Declarations Already Present"
            # Locate Original RET and COPIED Declaration
            elif grep -Fq 'int ret = 0, copied = 0;' "$MMU"; then
              # Insert Both Required Declarations After Existing Declaration
              sed -i \
                -e '/int ret = 0, copied = 0;/a\	unsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' \
                -e '/int ret = 0, copied = 0;/a\	pagemap_entry_t *res = NULL;' \
                "$MMU"
              # Record That TASK-MMU Fake Patch Was Applied
              FAKEPATCHTASKMMU=1
              echo "└─ 📌 Added TASK-MMU Declarations"
            else
              # Report When Expected Declaration Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate TASK-MMU Declaration Insertion Point" >&2
            fi

          else
            # Skip TASK-MMU and NAMESPACE Fixes For Newer Sublevels
            echo "└─ ℹ️ TASK-MMU and NAMESPACE Fixes Not Required For Sublevel $SUBLEVEL"
          fi

          # Add ZSWAP Header to MEMORY
          # Apply Only to Kernel Sublevels 57 and Below
          # Skip When MEMORY Fake Patch Flag is Already Set
          if [[ "$SUBLEVEL" -le 57 && "${FAKEPATCHMEMORY:-0}" -eq 0 ]]; then
            # Check Whether ZSWAP Header is Already Present
            if grep -Fq '#include <linux/zswap.h>' "$MEMORY"; then
              echo "└─ ℹ️ ZSWAP Header Already Present"
            # Locate the SCHED / SYSCTL Header
            elif grep -Fq '#include <linux/sched/sysctl.h>' "$MEMORY"; then
              # Insert ZSWAP Immediately After SCHED / SYSCTL
              sed -i '/^#include <linux\/sched\/sysctl.h>$/a #include <linux/zswap.h>' "$MEMORY"
              # Record That MEMORY Fake Patch was Applied
              FAKEPATCHMEMORY=1
              echo "└─ 📌 Added ZSWAP Header"
            else
              # Report When Expected Header Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate SCHED / SYSCTL Header In MEMORY" >&2
            fi

          else
            # Skip When Sublevel is too High or Fake Patch Flag is Set
            echo "└─ ℹ️ ZSWAP Header Not Required For Sublevel $SUBLEVEL or Already Prepared"
          fi

          # Add DMA-BUF Header to BASE
          # Apply Only to Kernel Sublevels 92 and Below
          # Skip When BASE Fake Patch Flag is Already Set
          if [[ "$SUBLEVEL" -le 92 && "${FAKEPATCHBASE:-0}" -eq 0 ]]; then
            # Check Whether DMA-BUF Header is Already Present
            if grep -Fq '#include <linux/dma-buf.h>' "$BASE"; then
              echo "└─ ℹ️ DMA-BUF Header Already Present"
            # Locate CPUFREQ TIMES Header
            elif grep -Fq '#include <linux/cpufreq_times.h>' "$BASE"; then
              # Insert DMA-BUF Immediately After CPUFREQ TIMES
              sed -i '/^#include <linux\/cpufreq_times.h>$/a #include <linux/dma-buf.h>' "$BASE"
              # Record That BASE Fake Patch was Applied
              FAKEPATCHBASE=1
              echo "└─ 📌 Added DMA-BUF Header"
            else
              # Report When Expected Header Insertion Point is Missing
              echo "└─ ⚠️ Cannot Locate CPUFREQ TIMES Header in BASE" >&2
            fi

          else
            # Skip When Sublevel is too High or Fake Patch Flag is Set
            echo "└─ ℹ️ DMA-BUF Header Not Required For Sublevel $SUBLEVEL or Already Prepared"
          fi

          echo "└─ 🎉 Android 15 / 6.6 Fake Patch Preparation Complete"
        fi
                
        # Invert Android 16 / 6.12 SUSFS Compatibility Fixes
        if [[ "$KERNELMODULE" == "android16-6.12" ]]; then
          # Define Source File Paths
          EXEC="$COMMONKERNELFOLDER/fs/exec.c"
          MMU="$COMMONKERNELFOLDER/fs/proc/task_mmu.c"        
          # Check Required Source Files
          [[ -f "$EXEC" ]] || echo "└─ ⚠️ Missing EXEC Source: $EXEC"
          [[ -f "$MMU" ]] || echo "└─ ⚠️ Missing TASK-MMU Source: $MMU"       
          echo "└─ 🩹 Preparing Android 16 / 6.12 SUSFS Compatibility"        
          # Apply Compatibility Fixes For Kernel Sublevels 58 and Below
          if [[ "$SUBLEVEL" -le 58 ]]; then       
            # Prepare DMA-BUF Header In EXEC
            if [[ -f "$EXEC" ]]; then
              if grep -qFx '#include <linux/dma-buf.h>' "$EXEC"; then
                echo "└─ ℹ️ DMA-BUF Header Already Present"       
              elif grep -qFx '#include <linux/ksm.h>' "$EXEC"; then
                echo "└─ 🔧 Adding DMA-BUF Header to EXEC"        
                if sed -i \
                  '/^#include <linux\/ksm\.h>$/a #include <linux/dma-buf.h>' \
                  "$EXEC" &&
                  grep -qFx '#include <linux/dma-buf.h>' "$EXEC"; then
                  FAKEPATCHEXEC=1
                  echo "└─ 📌 DMA-BUF Header Added"
                else
                  FAKEPATCHEXEC=0
                  echo "└─ ⚠️ Failed to Add DMA-BUF Header"
                fi
                
              else
                FAKEPATCHEXEC=0
