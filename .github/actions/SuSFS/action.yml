            source,
            "static int show_smaps_rollup(",
            fix_rollup
        )        
        # Validate Both Hooks Before Writing The Source
        start, end = bounds(source, "static int show_smap(")
        smap = source[start:end]        
        start, end = bounds(source, "static int show_smaps_rollup(")
        rollup = source[start:end]        
        if "SUSFS_IS_INODE_SUS_MAP" not in smap:
            raise RuntimeError("SHOW SMAP() Hook Validation Failed")       
        if (
            "goto bypass_orig_flow;" not in rollup
