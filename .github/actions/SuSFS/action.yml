                        "Cannot Uniquely Locate Rollup VMA-End Assignment"
                    )      
                replacement = """#ifdef CONFIG_KSU_SUSFS_SUS_MAP
        bypass_orig_flow:
        #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP
        		last_vma_end = vma->vm_end;"""        
                fn = fn.replace(anchor, replacement, 1)
