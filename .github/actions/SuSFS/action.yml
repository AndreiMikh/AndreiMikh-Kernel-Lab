            fi
        
            # 🩹 Fake-Patch SUSFS Map Hooks Into TASK-MMU
            if [[ -f "$MMU" ]]; then
              if python3 - "$MMU" <<'PY'
        import sys
        from pathlib import Path        
        path = Path(sys.argv[1])
        source = path.read_text()
        original = source        
        # Locate a Function's Opening and Closing Braces
        def bounds(text, signature):
            start = text.find(signature)
            if start < 0:
                raise RuntimeError(f"Function Not Found: {signature}")       
            brace = text.find("{", start)
            if brace < 0:
                raise RuntimeError(f"Opening Brace Not Found: {signature}")       
            depth = 0
            for i in range(brace, len(text)):
                if text[i] == "{":
                    depth += 1
                elif text[i] == "}":
                    depth -= 1
                    if depth == 0:
                        return start, i + 1        
            raise RuntimeError(f"Closing Brace Not Found: {signature}")        
        # Edit Only Requested Function
        def edit(text, signature, fn):
            start, end = bounds(text, signature)
            return text[:start] + fn(text[start:end]) + text[end:]        
        # Add SUSFS Map Hook to SHOW SMAP()
        def fix_smap(fn):
            marker = "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"        
            if marker in fn:
                print("└─ ℹ️ SHOW SMAP() Hook Already Present")
                return fn        
            anchor = "\tstruct mem_size_stats mss = {};"
            if fn.count(anchor) != 1:
                raise RuntimeError(
                    "Cannot Uniquely Locate SHOW SMAP() Initializer"
                )        
            replacement = anchor + """        
        #ifdef CONFIG_KSU_SUSFS_SUS_MAP
        	if (vma->vm_file &&
        	    SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))
        		return 0;
        #endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP
        """        
            print("└─ 🔧 Adding show_smap() Hook")
            return fn.replace(anchor, replacement, 1)        
        source = edit(source, "static int show_smap(", fix_smap)        
        # Add SUSFS Map Bypass To SHOW SMAPS ROLLUP()
        def fix_rollup(fn):
            marker = "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"        
            if marker not in fn:
                # Find Rollup Statistics Call Regardless of Indentation
                import re
                matches = list(re.finditer(
                    r'^[ \t]*smap_gather_stats\s*\(\s*vma\s*,\s*&mss\s*,\s*0\s*\)\s*;',
