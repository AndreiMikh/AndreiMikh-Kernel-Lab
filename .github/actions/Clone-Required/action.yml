# Kernel Lab Repository Clone Composite Action
# Clone the configured Kernel Lab Repository and Branch Into Kernel Workspace
name: 🌿 Clone Kernel Lab
description: Clone AndreiMikh Kernel Lab Repository and Prepare Its Workspace Directory
# Define Composite Action Execution
runs:
  using: composite
  steps:
    # Clone Kernel Lab Repository
    - name: 🌿 Clone Kernel Lab
      shell: bash
      env:
        # Kernel Lab Git Repository URL
        REPOURL: https://github.com/AndreiMikh/AndreiMikh-Kernel-Lab.git
        # Kernel Lab Branch to Clone
        REPOBRANCH: LiquidAndrei
      run: |
        # Enable Strict Bash Execution
        set -Eeuo pipefail
        # Define Repository Destination
        # Clone Kernel Lab inside the Kernel Workspace Directory
        REPOPATH="${GITHUB_WORKSPACE}/kernel_workspace/AndreiMikh-Kernel-Lab"
        # Prepare Repository Parent Directory
        # Ensure Destination Parent Directory Exists Before Cloning
        mkdir -p "$(dirname "$REPOPATH")"
        # Clone Selected Kernel Lab Repository
        # --Branch: Select Configured Repository Branch
        # --Depth 1: Perform Shallow Clone to Reduce Download Size and Time
        # REPOURL: Source Git Repository
        # REPOPATH: Local Repository Destination
        git clone \
          --branch "$REPOBRANCH" \
          --depth 1 \
          "$REPOURL" \
          "$REPOPATH"
        # Display Repository Clone Information
        echo "└─ 📂 Repository : $REPOPATH"
        echo "└─ 🌿 Branch     : $REPOBRANCH"
