name: 🤖 Resolve Root Source Manager APK
description: Resolve Root Source Manager APK
inputs:
  ROOTENGINE:
    required: true
  KSUREPOSITORY:
    required: true
  RELEASEREPOSITORY:
    required: true
  BRANCH:
    description: Effective Root Engine Manager Branch
    required: true
  ROOTCOMMIT:
    description: Resolved Full Root Engine Commit SHA
    required: true
  MANAGERTAG:
    required: false
    default: ""
  KSUVERSION:
    required: true
outputs:
  managerapk:
    description: Manager APK Available
    value: ${{ steps.root-engine-apk.outputs.managerapk }}
  apkcount:
    description: Manager APK Count
    value: ${{ steps.root-engine-apk.outputs.apkcount }}
  managerapkdir:
    description: Manager APK Directory
    value: ${{ steps.root-engine-apk.outputs.managerapkdir }}
  selectedrun:
    description: Selected Workflow Run
    value: ${{ steps.root-engine-apk.outputs.selectedrun }}
runs:
  using: composite
  steps:
    - name: 🤖 Workflow APK Resolver
      id: root-engine-apk
      shell: bash
      # Export Composite Action Inputs
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KSUREPOSITORY: ${{ inputs.KSUREPOSITORY }}
        RELEASEREPOSITORY: ${{ inputs.RELEASEREPOSITORY }}
        BRANCH: ${{ inputs.BRANCH }}
        ROOTCOMMIT: ${{ inputs.ROOTCOMMIT }}
        MANAGERTAG: ${{ inputs.MANAGERTAG }}
        KSUVERSION: ${{ inputs.KSUVERSION }}
        ROOTENGINE: ${{ inputs.ROOTENGINE }}
      # Enable Strict Bash Error Handling
      run: |
        set -Eeuo pipefail
        export GH_TOKEN="$GITHUB_TOKEN"
        echo "└─ [Info] 🚀 APK Resolver Started..."
        MANAGERAPKDIR="${RUNNER_TEMP}/ManagerAPK-${ROOTENGINE}"
        rm -rf "$MANAGERAPKDIR"
        mkdir -p "$MANAGERAPKDIR"
        echo "------------------------------"
        echo "└─ [Info] ℹ️ Root Engine        : ${ROOTENGINE:-None}"
        echo "└─ [Info] ℹ️ Source Repository  : ${KSUREPOSITORY:-None}"
        echo "└─ [Info] ℹ️ Release Repository : ${RELEASEREPOSITORY:-None}"
        echo "└─ [Info] ℹ️ Effective Branch   : ${BRANCH:-None}"
        echo "└─ [Info] ℹ️ Resolved Commit    : ${ROOTCOMMIT:-None}"
        echo "└─ [Info] ℹ️ Manager Tag        : ${MANAGERTAG:-None}"
        echo "└─ [Info] ℹ️ KSU Version        : ${KSUVERSION:-None}"
        echo "└─ [Info] ℹ️ Output Directory   : $MANAGERAPKDIR"
        echo "------------------------------"
        # Default Outputs
        APKMANAGER="false"
        APKCOUNT="0"
        selectedrun=""
        bestscore=0
        # Validate Effective Branch and Resolved Commit From Root Source Resolver
        if [[ -z "$BRANCH" ]]; then
          echo "└─ [Warn] ⚠️ Effective Root Engine Branch Was Not Provided"
          exit 1
        fi
        if [[ ! "$ROOTCOMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo "└─ [Warn] ⚠️ Invalid Root Engine Commit : $ROOTCOMMIT"
          exit 1
        fi

        echo "└─ [Info] 🔎 Searching Successful Runs For Exact Commit..."
        echo "└─ [Info] 🔖 Requested Commit : $ROOTCOMMIT"
        # Fetch Successful Workflow Runs For Selected Commit
        echo "└─ [Info] 🔎 Searching Build Manager Runs For Exact Commit..."
        echo "└─ [Info] 🔎 Discovering Manager Build Workflow..."
        echo "└─ [Info] 🔖 Requested Commit : $ROOTCOMMIT"
        API_URL="https://api.github.com/repos/${RELEASEREPOSITORY}/actions/workflows"
        WORKFLOWJSON="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "${API_URL}?per_page=100")" || {
          echo "└─ [Warn] ⚠️ Failed to Fetch Workflows"
          exit 1
        }
        WORKFLOWID="$(jq -r '
          [
            .workflows[]?
            | select(.state == "active")
            | select(
                (.name // "" | ascii_downcase | contains("manager"))
                and
                (.name // "" | ascii_downcase | contains("build"))
              )
          ]
          | sort_by(.id)
          | last
          | .id // empty
        ' <<< "$WORKFLOWJSON")"
        if [[ -z "$WORKFLOWID" ]]; then
          echo "└─ [Warn] ⚠️ No Active Manager Build Workflow Found"
          exit 1
        fi

        echo "└─ [Info] 🆔 Discovered Workflow ID: $WORKFLOWID"
        echo "└─ [Info] 🔎 Fetching Successful Manager Runs..."
        if [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
          RUNSJSON="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "branch=${BRANCH}" \
            --data-urlencode "status=success" \
            --data-urlencode "per_page=100" \
            "${API_URL}/${WORKFLOWID}/runs")" || {
            echo "└─ [Warn] ⚠️ Failed to Fetch Manager Runs"
            exit 1
          }
          mapfile -t runs < <(
            jq -r '
              [
                .workflow_runs[]?
                | select(.conclusion == "success")
              ]
              | sort_by(.created_at)
              | reverse
              | .[].id
            ' <<< "$RUNSJSON"
          )
        else
          RUNSJSON="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "branch=${BRANCH}" \
            --data-urlencode "status=success" \
            --data-urlencode "head_sha=${ROOTCOMMIT}" \
            --data-urlencode "per_page=100" \
            "${API_URL}/${WORKFLOWID}/runs")" || {
            echo "└─ [Warn] ⚠️ Failed to Fetch Manager Runs"
            exit 1
          }
          mapfile -t runs < <(
            jq -r --arg commit "$ROOTCOMMIT" '
              [
                .workflow_runs[]?
                | select(.conclusion == "success")
                | select((.head_sha | ascii_downcase) == ($commit | ascii_downcase))
              ]
              | sort_by(.created_at)
              | reverse
              | .[].id
            ' <<< "$RUNSJSON"
          )
        fi
        if [[ ${#runs[@]} -eq 0 ]]; then
          echo "└─ [Warn] ⚠️ No Successful Manager Runs Found"
          echo "   ├─ [Info] Branch : $BRANCH"
          if [[ "$ROOTENGINE" == "KernelSU-Next" ]]; then
            echo "   └─ [Info] Source : Upstream manager branch"
          else
            echo "   └─ [Info] Commit : $ROOTCOMMIT"
          fi
        else
          echo "└─ [Info] 🔖 Found ${#runs[@]} Matching Manager Runs"
          printf '└─ [Info] 🏁 Matching Run ID : %s\n' "${runs[@]}"
        fi
   
        # Source Runs Based on Available Artifacts
        # Score Runs Based on Available Artifacts
        # Runs are Processed Newest-First, so Equal Scores Retain Newest Matching Run
        echo "└─ [Info] 🔍 Scanning Runs For Manager / APK Artifacts..."
        for runid in "${runs[@]}"; do
          echo "------------------------------"
          echo "└─ [Info] 🔍 Run ID : $runid"
          artifactnames="$(
            gh api \
              "repos/${RELEASEREPOSITORY}/actions/runs/${runid}/artifacts" \
              --jq '.artifacts[].name' 2>/dev/null || true
          )"
          if [[ -z "$artifactnames" ]] || \
             ! echo "$artifactnames" | grep -qiE 'apk|manager|release|build'; then
            echo "└─ [Info] ♻️ No Relevant Artifacts Found"
            continue
          fi

          score=0
          # APK Artifact Score
          if echo "$artifactnames" | grep -Eqi '\.apk($|[^a-zA-Z])'; then
            score=$((score + 50))
          fi

          # Manager Artifact Score
          if echo "$artifactnames" | grep -qi "manager"; then
            score=$((score + 20))
          fi

          # Release / Build Artifact Score
          if echo "$artifactnames" | grep -qiE 'release|build'; then
            score=$((score + 10))
          fi

          echo "└─ [Info] 📊 Score For Run $runid = $score"
          if [[ "$score" -gt "$bestscore" ]]; then
            bestscore="$score"
            selectedrun="$runid"
            echo "└─ [Info] 🏆 Selected Run Updated → $runid"
          fi
        done
     
        # Display Selected Run and its Active Artifacts
        if [[ -z "$selectedrun" ]]; then
          echo "└─ [Warn] ⚠️ No Valid APK Workflow Found"
        else
          echo "------------------------------"
          echo "└─ [Info] 🏁 Selected Run : $selectedrun"
          echo "└─ [Info] 🏁 Best Score   : $bestscore"
          echo "------------------------------"
          echo "└─ [Info] 🔍 Checking Artifacts..."
          gh api \
            "repos/${RELEASEREPOSITORY}/actions/runs/${selectedrun}/artifacts" \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | .name
            ' || true         
        fi
       
        echo "└─ [Info] 📩 Fetching Manager APK Artifacts..."
        # Resolve Manager Artifact Download URLs
        artifacturls=""
        if [[ -n "$selectedrun" ]]; then
          echo "└─ [Info] 📩 Resolving Manager Artifact URLs..."
          artifacturls="$(
            gh api \
              "repos/${RELEASEREPOSITORY}/actions/runs/${selectedrun}/artifacts" \
              --jq '
                .artifacts[]
                | select(.expired == false)
                | select(.name | test("manager"; "i"))
                | .archive_download_url
              ' \
              2>/dev/null || true
          )"
        fi

        if [[ -n "$artifacturls" ]]; then
          echo "└─ [Info] 🔗 Manager Artifact URLs:"
          echo "$artifacturls"
        else
          echo "└─ [Warn] ⚠️ No Manager Artifact URLs Found"
        fi

        artifactcount="$(
          if [[ -n "$artifacturls" ]]; then
            printf '%s\n' "$artifacturls" |
              grep -c 'api.github.com' || true
          else
            echo "0"
          fi
        )"
        echo "└─ [Info] 📦 Manager Artifact Count : $artifactcount"
        # Download and Extract Manager Artifacts
        if [[ "$artifactcount" -gt 0 ]]; then
          i=0
          while read -r url; do
            [[ -z "$url" ]] && continue
            i=$((i + 1))
            zipfile="${MANAGERAPKDIR}/artifact_${i}.zip"
            echo "└─ [Info] ⬇️ Downloading Manager Artifact #$i"
            if ! curl \
              --location \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 600 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$zipfile" \
              "$url"; then
              echo "└─ [Warn] ⚠️ Artifact Download Failed, Skipping"
              rm -f "$zipfile"
              continue
            fi

            if ! unzip -t "$zipfile" >/dev/null 2>&1; then
              echo "└─ [Warn] ⚠️ Invalid or Corrupted Artifact, Skipping"
              rm -f "$zipfile"
              continue
            fi

            echo "└─ [Info] 📦 Extracting Manager Artifact #$i"
            if ! unzip -o "$zipfile" \
              -d "$MANAGERAPKDIR" >/dev/null 2>&1; then
              echo "└─ [Warn] ⚠️ Artifact Extraction Failed, Skipping"
              rm -f "$zipfile"
              continue
            fi

            rm -f "$zipfile"
          done <<< "$artifacturls"
        fi      
        
        echo "└─ [Info] 🧹 Cleaning Non-APK Files..."
        find "$MANAGERAPKDIR" \
          -type f \
          ! -name "*.apk" \
          -delete || true
        # ReSukiSU (BakaSU) ARM64 Release Filter
        if [[ "$RELEASEREPOSITORY" == "Baka-SU/BakaSU" ]]; then
          echo "└─ [Info] ℹ️ ReSukiSU (BakaSU) Repository Detected"
          echo "└─ [Info] 🔍 Filtering Standard ARM64-V8A Release APK..."
          find "$MANAGERAPKDIR" \
            -type f \
            -name "*.apk" \
            ! -name "*arm64-v8a-release.apk" \
            ! -name "*universal-release.apk" \
            -delete || true
          find "$MANAGERAPKDIR" \
            -type f \
            -name "*spoofed*.apk" \
            -delete || true
          echo "└─ [Info] 🔖 ReSukiSU (BakaSU) APK Filtering Complete"
        fi

        echo "└─ [Info] 🔍 Verifying Output..."
        # Verify Final Manager / APK Output
        APKCOUNT="$(
          find "$MANAGERAPKDIR" \
            -type f \
            -name "*.apk" |
          wc -l
        )"
        echo "└─ [Result] 📦 APK Count  : $APKCOUNT"
        if [[ "$APKCOUNT" -gt 0 ]]; then
          APKMANAGER="true"
          echo "└─ [Result] 📌 Manager APK Resolution Successful"
          echo "└─ [Result] 📦 APKs Found : $APKCOUNT"
          find "$MANAGERAPKDIR" \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;
        else
          echo "└─ [Warn] ⚠️ No Usable Manager APK Files Found"
        fi

        # Step Outputs
        {
          echo "managerapk=$APKMANAGER"
          echo "apkcount=$APKCOUNT"
          echo "managerapkdir=$MANAGERAPKDIR"
          echo "selectedrun=$selectedrun"
          echo "ksuversion=$KSUVERSION"
        } >> "$GITHUB_OUTPUT"
        echo "└─ [Result] 📤 Manager APK Available  : $APKMANAGER"
        echo "└─ [Result] 📦 APK Count              : $APKCOUNT"
        echo "└─ [Result] 🏁 Selected Run           : $selectedrun"
        echo "└─ [Result] 🔗 Release Repository     : $RELEASEREPOSITORY"
        echo "└─ [Result] 🎉 APK Resolver Completed"

    - name: 📤 Upload Manager APK
      if: ${{ steps.root-engine-apk.outputs.managerapk == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ManagerAPK-${{ inputs.ROOTENGINE }}-${{ inputs.KSUVERSION }}
        path: ${{ steps.root-engine-apk.outputs.managerapkdir }}/*.apk
        if-no-files-found: warn
        retention-days: 7
